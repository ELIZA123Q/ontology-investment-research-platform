# 步骤参数归属表：登记权威种类，防止业务参数双写。
# authority_kind:
#   semantic_ontology_instance — 稳定语义类型或指标定义
#   research_rule_config — 证据、推理、门槛与模板配置
#   research_runtime_contract — 运行对象和值域合同
#   knowledge_base_ref — 知识库方法说明，必须回指运行合同或研究规则
#   runtime_contract — 运行合同（阶段状态等），不进业务本体
schema_name: parameter_authority_matrix
schema_version: 1.1.0
status: active
note: 覆盖率 100% 指已登记参数的权威唯一，不是「一切皆本体」。

parameters:
  - id: state_variables
    label: 稳定研究指标定义
    stages: [02, 03, 04]
    authority_kind: semantic_ontology_instance
    authority_ref: 语义本体/二级半导体/research_metrics.yaml#semantic_instances.@type=ResearchMetric

  - id: evidence_profiles
    label: 证据画像与 quality_floor
    stages: [02, 03]
    authority_kind: research_rule_config
    authority_ref: 研究规则/二级半导体/research_config.yaml#runtime_objects.@type=EvidenceProfile

  - id: propagation_templates
    label: 传导模板
    stages: [02, 04]
    authority_kind: research_rule_config
    authority_ref: 研究规则/二级半导体/research_config.yaml#runtime_objects.@type=PropagationTemplate

  - id: scenario_templates
    label: 情景模板
    stages: [02, 04]
    authority_kind: research_rule_config
    authority_ref: 研究规则/二级半导体/research_config.yaml#runtime_objects.@type=ScenarioTemplate

  - id: business_scenario_tags
    label: 业务情景标签
    stages: [02, 04]
    authority_kind: research_rule_config
    authority_ref: 研究规则/二级半导体/research_config.yaml#runtime_objects.@type=BusinessScenarioTag

  - id: judgment_level_criterion_templates
    label: J0–J4 默认可复用门槛模板
    stages: [02, 04]
    authority_kind: research_rule_config
    authority_ref: 研究规则/二级半导体/research_config.yaml#runtime_objects.@type=JudgmentLevelCriterionTemplate

  - id: evidence_recipes
    label: 取证配方
    stages: [03]
    authority_kind: research_rule_config
    authority_ref: 研究规则/二级半导体/research_config.yaml#runtime_objects.@type=EvidenceRecipe

  - id: source_profiles
    label: 稳定来源画像
    stages: [03]
    authority_kind: research_rule_config
    authority_ref: 研究规则/二级半导体/research_config.yaml#runtime_objects.@type=SourceProfile

  - id: proxy_indicators
    label: 代理指标
    stages: [03, 04, 05]
    authority_kind: research_rule_config
    authority_ref: 研究规则/二级半导体/research_config.yaml#runtime_objects.@type=ProxyIndicator

  - id: judgment_evidence_threshold
    label: Q/反证/路径就绪 → 最大 J 矩阵
    stages: [03, 04]
    authority_kind: research_rule_config
    authority_ref: 研究规则/reasoning.yaml#rules.judgment_evidence_threshold

  - id: judgment_types
    label: 判断单元类型
    stages: [02, 03, 04]
    authority_kind: research_runtime_contract
    authority_ref: 研究运行合同/reasoning.yaml#object_types.JudgmentUnit.properties.judgment_type.allowed_values

  - id: judgment_levels
    label: 判断等级 J0–J4
    stages: [02, 03, 04, 05]
    authority_kind: research_runtime_contract
    authority_ref: 研究运行合同/reasoning.yaml#object_types.JudgmentLevelCriterion.properties.judgment_level.allowed_values

  - id: path_readiness_statuses
    label: 路径就绪状态
    stages: [03]
    authority_kind: research_rule_config
    authority_ref: 研究规则/reasoning.yaml#rules.judgment_evidence_threshold.parameters.path_readiness_caps

  - id: path_result_statuses
    label: 路径推理结果状态
    stages: [04]
    authority_kind: research_rule_config
    authority_ref: 研究规则/reasoning.yaml#rules.judgment_evidence_threshold.parameters.path_result_statuses

  - id: source_authority_levels
    label: 来源权威下限
    stages: [02, 03, 04]
    authority_kind: research_runtime_contract
    authority_ref: 研究运行合同/reasoning.yaml#object_types.JudgmentLevelCriterion.properties.minimum_source_authority.allowed_values

  - id: source_tiers
    label: 来源层级 S1–S8
    stages: [02, 03]
    authority_kind: research_runtime_contract
    authority_ref: 研究运行合同/evidence.yaml#object_types.SourceProfile.properties.sourceTier

  - id: confidence_levels
    label: 置信上限 high/medium/low
    stages: [03, 04]
    authority_kind: research_runtime_contract
    authority_ref: 研究运行合同/evidence.yaml#object_types.EvidenceReadinessAssessment.properties.confidenceCeiling

  - id: basket_roles
    label: 证据篮子角色
    stages: [02, 03]
    authority_kind: research_runtime_contract
    authority_ref: 研究运行合同/evidence.yaml#object_types.EvidenceBasket.properties.basketRole

  - id: kb03_method_roles
    label: 取证方法五角色（说明层）
    stages: [03]
    authority_kind: knowledge_base_ref
    authority_ref: 知识库_03取证/03_registry.yaml#evidence_roles
    must_point_to: 研究规则/reasoning.yaml#rules.judgment_evidence_threshold.parameters.evidence_method_role_to_basket_role

  - id: kb03_quality_language
    label: 完备度四档用语（说明层）
    stages: [03]
    authority_kind: knowledge_base_ref
    authority_ref: 知识库_03取证/03_registry.yaml#quality_language
    must_point_to: 研究规则/reasoning.yaml#rules.judgment_evidence_threshold.parameters.quality_language_to_evidence_grades

  - id: judgment_method_routes
    label: judgment_type → kb03/kb04 方法路由
    stages: [02, 03, 04]
    authority_kind: runtime_contract
    authority_ref: 00_全局/contracts/judgment_method_routes.yaml#routes
    note: 路由合同；judgment_type 值域仍以一级本体为准，本表不升格为治理域本体实例

  - id: stage_statuses
    label: 阶段运行状态
    stages: [01, 02, 03, 04, 05]
    authority_kind: runtime_contract
    authority_ref: 00_全局/contracts/public_contract.yaml#stage_statuses

  - id: task_disposition
    label: 01 任务处置结果
    stages: [01]
    authority_kind: runtime_contract
    authority_ref: 运行校验/status_derivation.py#TASK_DISPOSITIONS

  - id: quality_status
    label: 质量门状态
    stages: [01, 02, 03, 04, 05]
    authority_kind: runtime_contract
    authority_ref: 运行校验/quality_gate_utils.py#QUALITY_STATUSES

  - id: expression_strength_markers
    label: 05 强度措辞禁表
    stages: [05]
    authority_kind: runtime_contract
    authority_ref: 05_表达交付/validate_05_outputs.py#STRENGTH_UPGRADE_MARKERS
    note: 本期保持运行约束，不升格为治理域本体

# 明确不升格：二级指南与 04/05 审计枚举保持说明/阶段合同，不登记为 ontology_rule_param。
not_promoted:
  - id: evidence_quality_dimensions
    reason: 二级证据质量维度为领域取证指南，与 L1 sourceTier/confidence/basketRole 语义相近但职责不同；不合并升格
    stays_at: 研究规则/二级半导体/evidence_policy.yaml#evidence_quality_dimensions
  - id: event_type_taxonomy
    reason: 领域事件分类法，介于 schema 扩展与实例之间；任务需要时经 02 映射，不进一级规则参数
    stays_at: 研究规则/二级半导体/reasoning_policy.yaml#event_type_taxonomy
  - id: commercialization_stages
    reason: 半导体商业化阶段词表，由实例 stage_vocabulary_ref 引用，不升格为 L1 枚举
    stays_at: 研究规则/二级半导体/evidence_policy.yaml#commercialization_stages
  - id: stage04_handoff_and_audit_enums
    reason: handoff_to_05 / permitted_role / delivery_archetype 等属 04→05 阶段审计与表达合同，非业务强度参数
    stays_at: 04_推理/模板/04_推理审计模板.yaml#handoff_to_05
