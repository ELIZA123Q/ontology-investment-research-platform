schema_name: controlled_research_chain_public_contract
schema_version: 1.2.0
status: active

# 这里只维护跨阶段共享语义。阶段内部字段继续由 01—05 各自规范维护。
ownership:
  public_contract:
    - trace_id_patterns
    - stage_statuses
    - validity_statuses
    - publish_statuses
    - scope_relations
    - aggregation_outcomes
    - update_actions
    - evidence_wave_classifications
    - stage_attempt_states
    - object_validity_propagation
    - scope_graph
    - claim_scope
    - cross_stage_references
  formal_ontology:
    - object_types
    - relation_types
    - state_variables
    - stable_domain_rules
  knowledge_bases:
    - reusable_methods
    - method_applicability
    - method_specific_gates
  stage_specs:
    - stage_internal_fields
    - researcher_readable_explanations

trace_id_patterns:
  task_id: '^JTASK-[A-Z0-9][A-Z0-9_-]+$'
  run_id: '^(?:RUN|EXEC)-[A-Z0-9][A-Z0-9_-]+$'
  Q: '^Q-\d+$'
  JU: '^JU-\d+$'
  ER: '^ER-\d+$'
  EV: '^EV-\d+$'
  C: '^C-(?:\d+|[A-Z0-9][A-Z0-9_-]*)$'
  RC: '^(?:RC|GATE|G)-\d+$'

business_authority_refs:
  judgment_types: 一级通用本体规范/reasoning.yaml#object_types.JudgmentUnit.properties.judgment_type.allowed_values
  judgment_levels: 一级通用本体规范/reasoning.yaml#object_types.JudgmentLevelCriterion.properties.judgment_level.allowed_values
  path_readiness_statuses: 一级通用本体规范/reasoning.yaml#rules.judgment_evidence_threshold.parameters.path_readiness_caps.@keys

legacy_judgment_type_migration:
  trend_or_phase: trend_direction
  mechanism_transmission: null
  object_comparison: object_differentiation
  valuation_expectation: null
  risk_reassessment: null
  note: null 表示旧类型语义不唯一，必须返回 02 重新拆分，禁止自动迁移。

stage_statuses: [not_started, in_progress, complete, blocked, returned]
path_result_statuses:
  - established
  - partially_established
  - weakened
  - blocked
  - insufficient_evidence
  - contested
  - not_applicable
validity_statuses: [current, stale, revalidation_required, missing]
publish_statuses: [PUBLISHABLE, RETURN_REQUIRED, STAGE_READY, INCOMPLETE_CHAIN]

# 以下枚举由公共校验器计算或校验；阶段产物不得另行定义同名语义。
scope_relations: [same, narrower, broader, overlap, incomparable]
aggregation_outcomes: [synchronized, dominant, differentiated, insufficient]
update_actions: [new, maintain, enhance, weaken, block, revise, retire]

# 以下枚举只控制运行路由，不定义新的业务变量、证据强度或推理权重。
evidence_wave_classifications:
  - task_contract_revision
  - reasoning_structure_revision
  - evidence_update
  - presentation_revision
  - no_semantic_delta
stage_attempt_states: [pending, committed, superseded]

scope_graph:
  schema_version: 1.0.0
  dimensions: [object, geography, customer, metric, time]
  node_contract:
    required_fields: [scope_ref, label, dimensions, parent_scope_ref]
    parent_rule: 除根节点外，每个范围节点必须引用同一图中的唯一父节点；图必须无环。
    dimension_rule: dimensions 只能使用受控维度，值必须为非空字符串列表。
  relation_rule: same/narrower/broader 由父子可达关系计算；无可达关系时，按维度交集派生 overlap 或 incomparable。

claim_scope:
  required_fields: [scope_ref, exclusions, time_basis]
  rule: Claim 或表达的范围必须引用 02 冻结的 scope_graph 节点，排除项与时间口径属于范围合同的一部分。

method_namespaces:
  evidence: kb03
  reasoning: kb04
  rule: 跨阶段产物中的方法引用必须带命名空间；知识库内部文件名可继续使用 A01—A10。

runtime_objects:
  - Task
  - Run
  - StageArtifact
  - StageAttempt
  - ValidationIssue
  - EvidenceWave
  - OntologyDependencyProjection
  - IterationPlan

publish_semantics:
  quality_pass: 研究过程与阶段合同是否合格
  publishable: 当前产物是否可正式交付；只能由总校验器派生
  judgment_level: 单条判断的证据与推理强度
  directional_conclusion_available: 是否存在可表达的方向性结论
  insufficient_can_publish: true

stale_propagation:
  stage_01: [stage_02, stage_03, stage_04, stage_05]
  stage_02: [stage_03, stage_04, stage_05]
  stage_03: [stage_04, stage_05]
  stage_04: [stage_05]
  stage_05: []

# 对象级传播是阶段 stale 的依据；箭头表示“上游变化使下游需要重算”。
# ReportClaim 是 04/05 发布投影，不扩展一级正式本体。
object_validity_propagation:
  dependency_order:
    - [EvidenceClaim_or_EvidenceFact, Observation_or_Event_or_Signal_or_MarketExpectation]
    - [Observation_or_Event_or_Signal, Hypothesis]
    - [Hypothesis, RuleEvaluation]
    - [RuleEvaluation, Judgment]
    - [Judgment, ExpectationGap_or_AssetImpact]
    - [MarketExpectation, ExpectationGap]
    - [ExpectationGap_or_AssetImpact, ReportClaim]
  authority_rule: 每条依赖必须引用正式本体 Relation；只有 ReportClaim 边允许 stageProjection。
  invalidation_rule: 只传播到可达下游对象，不因同属一个阶段而使无关对象 stale。

iteration_semantics:
  evidence_unit: frozen_batch
  existing_structure_route: stage_03_then_affected_stage_04
  structural_discovery_route: full_stage_02_quality_gate_then_affected_stage_03_and_stage_04
  task_contract_route: stage_01
  presentation_only_route: stage_05
  immutable_reasoning_revision_relation: reasoningSupersedes
  immutable_reasoning_revision_action: ReviseReasoningObject
  convergence_rule: 无待处理结构触发、无关键 stale 对象、attempt 哈希为 current、冲突已 resolved/contested/blocked，且最新波次未改变关键判断或路径。
  forbidden_rule: 禁止用固定最大循环次数替代语义收敛。
