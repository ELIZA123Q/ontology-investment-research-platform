  maximum_judgment_level_if_missing: J2
- evidence_requirement_id: ER-03
  question: 有效产能、利用率、交期、产品分配、封装瓶颈或替代供应。
  linked_instance_requirement: ''
  linked_state_variables: []
  linked_judgment_units:
