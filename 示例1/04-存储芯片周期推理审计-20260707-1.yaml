  metrics:
  - coverage_unit_total
  - evidence_backed_unit_count
  - evidence_coverage_rate
  formulas:
  - evidence_coverage_rate=evidence_backed_unit_count/coverage_unit_total
  scope_notes:
  - 覆盖率不得替代判断充分性
  time_lag_notes:
  - 财报、行业价格和新闻稿存在发布时间与业务时间错位
  known_limitations:
  - 多层库存、订单取消率、同代际 HBM 成交价、新增供给认证仍不足
