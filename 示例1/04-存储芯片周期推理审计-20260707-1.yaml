  market_common_view: 市场容易把存储芯片理解为 HBM、通用 DRAM、NAND 同步上行的强周期，或把 2027H2—2028 的供给线索直接理解为周期结束窗口。
  differentiated_view: 本次判断更适合写成 AI/HBM 驱动的结构性高位延续；产品强弱、价格兑现和结束条件必须拆开，而不是合并成同步强周期。
  why_now: 2026H2 进入价格斜率、客户库存、订单兑现和 HBM4 认证的共同验证期，足以检验本轮上行是延续、正常化还是提前见顶。
  misread_risks:
  - 把传统 DRAM 合约价大幅上行误读为所有存储产品同步强景气。
  - 把企业级 SSD 需求强误读为全 NAND 需求同向强。
  - 把新增供给时间表误读为确定周期结束日。
  narrative_spine: 先指出市场同步周期理解的偏差，再用价格兑现、HBM 晶圆占用、原厂库存、企业级与消费端分化推进证据，最后落到 2026H2 的验证信号和 2027H2—2028 的条件式正常化窗口。
  evidence_progression:
  - step: 价格已兑现
    evidence_summary: 传统 DRAM 合约价 2026Q1 大幅上行且 2026Q2E 仍处高位，Micron DRAM/NAND 实现价也明显改善。
