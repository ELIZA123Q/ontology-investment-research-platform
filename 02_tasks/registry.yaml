schema_name: task_domain_registry
schema_version: 2.0.0
status: active

authority:
  answers: Task 权威入口是本文件与受约束 Research Node Catalog；Deep Research 仅为可选模板。
  write_entry: 02_tasks/
  read_primary: 02_tasks/**/registry.yaml
  executable_node_catalog: 07_runtime/src/runtime/node-catalog.ts
  planner: 07_runtime/src/runtime/planner.ts

subdomains:
  scenarios:
    registry: 02_tasks/01_scenarios/registry.yaml
    status: active
  definitions:
    registry: 02_tasks/02_definitions/registry.yaml
    status: active
  roles:
    registry: 02_tasks/03_roles/registry.yaml
    status: active
  workflows_deep_research:
    registry: 02_tasks/04_workflows/deep_research/registry.yaml
    status: template_only

notes:
  - Intent → Task → typed TaskGraph 是运行主链。
  - 01—05 只是一种 Deep Research 模板，Runtime 可跳过、并行或局部重跑，但不能绕过节点前置条件。
