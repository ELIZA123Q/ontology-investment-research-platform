schema_name: task_role_registry
schema_version: 2.0.0
status: active

authority:
  answers: 角色合同索引在本文件；Agent 执行 manifest 由 Capability 域统一登记。
  write_entry: 02_tasks/03_roles/
  read_primary: 02_tasks/03_roles/registry.yaml
  agent_registry: 03_capabilities/01_agents/registry.yaml

roles:
  - role_id: researcher
    actor_type: human
    responsibility: 表达目标、补充材料、审阅关键判断和调整方向
    human_gates: [plan_confirmation, evidence_confirmation, judgment_confirmation, publish_confirmation]
  - role_id: research_lead
    actor_type: agent
    maps_to_agent: research-lead
    responsibility: 保持用户对话控制权，规划受约束任务图并综合结果
