schema_name: task_definition_registry
schema_version: 2.0.0
status: active

authority:
  answers: 标准 Task 定义权威在本文件；Runtime 按意图选择最小必要 TaskGraph。
  write_entry: 02_tasks/02_definitions/
  read_primary: 02_tasks/02_definitions/registry.yaml
  executable_planner: 07_runtime/src/runtime/planner.ts

source_basis:
  - 02_tasks/04_workflows/deep_research/stages/01_intake.md
  - 05_governance/14_evals/02_案例
  - 03_capabilities/05_method_libraries/02_研究框架

task_definitions:
  - task_id: cycle_judgement
    name: 周期判断
    objective: 判断给定时间窗内行业或子行业状态是否进入上行/下行周期或拐点区间
    default_role: research-lead
    optional_template: deep_research
    relevant_skills: [research-framing, research-method, evidence-assessment, hypothesis-analysis, research-writing]
  - task_id: event_impact
    name: 事件影响判断
    objective: 判断事件对对象状态变量与资产影响路径的方向、强度与时滞
    default_role: research-lead
    optional_template: deep_research
    relevant_skills: [research-method, evidence-assessment, hypothesis-analysis]
  - task_id: company_analysis
    name: 公司分析
    objective: 在给定范围内评估公司经营与业绩判断的证据充分性、边界与改判条件
    default_role: research-lead
    optional_template: deep_research
    relevant_skills: [research-framing, research-method, evidence-assessment, research-writing]
  - task_id: evidence_verification
    name: 证据核验
    objective: 对候选来源执行抓取、留痕、去重、可回溯核验与覆盖评估
    default_role: research-lead
    intent: evidence_only
    relevant_skills: [evidence-assessment]
    relevant_tools: [source.discover, source.capture, financial.mcp]
