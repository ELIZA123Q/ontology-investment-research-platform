schema_name: governed_asset_registry
schema_version: 1.0.0
status: active
description: >
  治理控制面的资产目录。owner_role 表示问责角色而非个人；
  authority_ref 是唯一机器权威，任何消费面不得维护同义副本。

owner_roles:
  governance_owner: 维护项目边界、公共合同和治理发布门。
  ontology_steward: 维护正式本体模型、领域参数图和语义迁移。
  runtime_owner: 维护运行状态、图物化、数据映射和执行接线。
  method_owner: 维护可复用研究方法及其适用边界。

validation_profiles:
  governance_contract:
    required_checks: [validate_governance_control_plane, validate_project]
  ontology_core:
    required_checks: [validate_v3, ontology:check, ontology:audit, typecheck, validate_project]
  ontology_domain_parameters:
    required_checks: [validate_parameter_authority, validate_v3, validate_project]
  runtime_contract:
    required_checks: [validate_rule_authority, validate_parameter_authority, typecheck, runtime:test]
  method_assets:
    required_checks: [validate_method_assets, test:method_registry, validate_project]

assets:
  - id: governance.control_contract
    asset_kind: governance_contract
    authority_ref: governance/02_合同/governance_control_contract.yaml
    owner_role: governance_owner
    status: active
    version: 1.0.0
    validation_profile: governance_contract
    consumers: []

  - id: governance.asset_registry
    asset_kind: governance_registry
    authority_ref: governance/02_合同/governed_asset_registry.yaml
    owner_role: governance_owner
    status: active
    version: 1.0.0
    validation_profile: governance_contract
    consumers: []

  - id: ontology.model_registry
    asset_kind: ontology_registry
    authority_ref: ontology/01_通用/model_registry.yaml
    owner_role: ontology_steward
    status: active
    version: 1.0.0
    validation_profile: ontology_core
    consumers: [runtime_semantic_catalog, formal_packages_and_regression_instances]

  - id: ontology.semantic_models
    asset_kind: formal_ontology
    authority_ref: ontology/01_通用/models
    owner_role: ontology_steward
    status: active
    version: 3.0.0
    validation_profile: ontology_core
    consumers:
      - runtime_semantic_catalog
      - runtime_schema_and_ui_vocabulary
      - instance_graph_contract_and_materializer
      - workflow_semantic_envelopes
      - method_assets_and_routes
      - external_data_mapping_profiles
      - formal_packages_and_regression_instances

  - id: ontology.semiconductor_parameters
    asset_kind: domain_business_parameters
    authority_ref: ontology/02_领域/semiconductor/business_instances.yaml
    owner_role: ontology_steward
    status: active
    version: 1.1.0
    validation_profile: ontology_domain_parameters
    consumers: [workflow_semantic_envelopes, method_assets_and_routes]

  - id: governance.public_contract
    asset_kind: public_contract
    authority_ref: governance/02_合同/public_contract.yaml
    owner_role: governance_owner
    status: active
    version: 1.3.0
    validation_profile: runtime_contract
    consumers: [workflow_semantic_envelopes, formal_packages_and_regression_instances]

  - id: governance.rule_authority
    asset_kind: authority_registry
    authority_ref: governance/02_合同/rule_authority_registry.yaml
    owner_role: governance_owner
    status: active
    version: 1.1.0
    validation_profile: runtime_contract
    consumers: [runtime_semantic_catalog, instance_graph_contract_and_materializer]

  - id: governance.parameter_authority
    asset_kind: authority_registry
    authority_ref: governance/02_合同/parameter_authority_matrix.yaml
    owner_role: governance_owner
    status: active
    version: 1.1.0
    validation_profile: runtime_contract
    consumers: [workflow_semantic_envelopes, method_assets_and_routes]

  - id: governance.ontology_consumers
    asset_kind: impact_registry
    authority_ref: governance/02_合同/ontology_consumer_registry.yaml
    owner_role: governance_owner
    status: active
    version: 1.0.0
    validation_profile: governance_contract
    consumers: []

  - id: governance.data_mapping_profiles
    asset_kind: mapping_registry
    authority_ref: governance/02_合同/ontology_data_mapping_profiles.yaml
    owner_role: runtime_owner
    status: active
    version: 1.0.0
    validation_profile: runtime_contract
    consumers: [external_data_mapping_profiles]

  - id: methods.registry
    asset_kind: method_registry
    authority_ref: methods/00_登记/method_assets.yaml
    owner_role: method_owner
    status: active
    version: 1.0.0
    validation_profile: method_assets
    consumers: [method_assets_and_routes]

  - id: runtime.operation_registry
    asset_kind: runtime_registry
    authority_ref: runtime/engine/runtime_operations.yaml
    owner_role: runtime_owner
    status: active
    version: 1.0.0
    validation_profile: runtime_contract
    consumers: [instance_graph_contract_and_materializer, workflow_semantic_envelopes]
