schema_name: ontology_v3_runtime_mapping
schema_version: 1.0.0
status: implemented
formal_ontology_version: 3.0.0
public_contract_version: 1.3.0
runtime_implementation_status: implemented
description: Ontology 3.0 与 Public Contract 1.3 的 Runtime 映射；MethodApplication、正式本体读取和运行操作注册表已实现。

mapping:
  ontology_objects: runtime/adapters/ontology.ts
  method_application: runtime/engine/method_application.ts
  runtime_operations: runtime/engine/runtime_operations.yaml
  evidence_wave: runtime/engine/templates/evidence_wave.template.yaml
  invalidation_projection: runtime/engine/templates/dependency_projection.template.yaml

moved_legacy_resources:
  action_types:
    target: runtime_command_or_domain_service
    rule: 不作为本体类型暴露；执行结果必须写入运行实例或审计记录。
  functions:
    target: pure_function_or_adapter
    rule: 确定性、读写范围与副作用由 Runtime 类型约束。
  logic_flows:
    target: method_or_workflow_orchestrator
    rule: 研究方法进入 methods，阶段路由进入 runtime/workflow。

implemented_types:
  MethodApplication:
    source_contract: governance/02_合同/public_contract.yaml#method_application_contract
    persistence: append-only per run
    identity: application_id
    status_transition: candidate -> selected -> executed | rejected | blocked | degraded
  InvalidationProjection:
    source_contract: governance/02_合同/public_contract.yaml#object_validity_propagation
    requirement: 仅传播到关系图中可达的下游对象。
