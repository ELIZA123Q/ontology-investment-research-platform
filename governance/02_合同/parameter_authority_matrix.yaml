# 步骤参数归属表：登记权威种类，防止业务参数双写。
# authority_kind:
#   formal_ontology_instance — 类型 + 可引用实例（领域或任务图）
#   ontology_rule_param — 一级本体规则参数（不必做成对象实例）
#   knowledge_base_ref — 知识库方法说明，必须回指本体
#   runtime_contract — 运行合同（阶段状态等），不进业务本体
schema_name: parameter_authority_matrix
schema_version: 1.1.0
status: active
note: 覆盖率 100% 指已登记参数的权威唯一，不是「一切皆本体」。

parameters:
  - id: state_variables
    label: 状态变量 / 决策变量
    stages: [02, 03, 04]
    authority_kind: formal_ontology_instance
    authority_ref: ontology/02_领域/semiconductor/business_instances.yaml#StateVariable

  - id: evidence_profiles
    label: 证据画像与 quality_floor
    stages: [02, 03]
    authority_kind: formal_ontology_instance
    authority_ref: ontology/02_领域/semiconductor/business_instances.yaml#EvidenceProfile

  - id: propagation_templates
    label: 传导模板
    stages: [02, 04]
    authority_kind: formal_ontology_instance
    authority_ref: ontology/02_领域/semiconductor/business_instances.yaml#PropagationTemplate

  - id: scenario_templates
    label: 情景模板
    stages: [02, 04]
    authority_kind: formal_ontology_instance
    authority_ref: ontology/02_领域/semiconductor/business_instances.yaml#ScenarioTemplate

  - id: business_scenario_tags
    label: 业务情景标签
    stages: [02, 04]
    authority_kind: formal_ontology_instance
    authority_ref: ontology/02_领域/semiconductor/business_instances.yaml#BusinessScenarioTag

  - id: judgment_level_criterion_templates
    label: J0–J4 默认可复用门槛模板
    stages: [02, 04]
    authority_kind: formal_ontology_instance
    authority_ref: ontology/02_领域/semiconductor/business_instances.yaml#JudgmentLevelCriterionTemplate

  - id: evidence_recipes
    label: 取证配方
    stages: [03]
    authority_kind: formal_ontology_instance
    authority_ref: ontology/02_领域/semiconductor/business_instances.yaml#EvidenceRecipe

  - id: source_profiles
    label: 稳定来源画像
    stages: [03]
    authority_kind: formal_ontology_instance
    authority_ref: ontology/02_领域/semiconductor/business_instances.yaml#SourceProfile

  - id: proxy_indicators
    label: 代理指标
    stages: [03, 04, 05]
    authority_kind: formal_ontology_instance
    authority_ref: ontology/02_领域/semiconductor/business_instances.yaml#ProxyIndicator

  - id: judgment_evidence_threshold
    label: Q/反证/路径就绪 → 最大 J 矩阵
    stages: [03, 04]
    authority_kind: runtime_contract
    authority_ref: governance/02_合同/judgment_threshold_policy.yaml
    note: 正式语义规则仍在 judgment.yaml；Q/反证/路径到运行输出的矩阵属于跨阶段合同。

  - id: judgment_types
    label: 判断单元类型
    stages: [02, 03, 04]
    authority_kind: ontology_rule_param
    authority_ref: ontology/01_通用/models/judgment.yaml#object_types.JudgmentUnit.attributes.judgment_type.allowed_values

  - id: judgment_levels
    label: 判断等级 J0–J4
    stages: [02, 03, 04, 05]
    authority_kind: ontology_rule_param
    authority_ref: ontology/01_通用/models/judgment.yaml#object_types.Judgment.attributes.level.allowed_values

  - id: path_readiness_statuses
    label: 路径就绪状态
    stages: [03]
    authority_kind: runtime_contract
    authority_ref: governance/02_合同/judgment_threshold_policy.yaml#path_readiness_caps

  - id: path_result_statuses
    label: 路径推理结果状态
    stages: [04]
    authority_kind: runtime_contract
    authority_ref: governance/02_合同/judgment_threshold_policy.yaml#path_result_statuses

  - id: source_authority_levels
    label: 来源权威下限
    stages: [02, 03, 04]
    authority_kind: runtime_contract
    authority_ref: governance/02_合同/judgment_threshold_policy.yaml#source_authority_levels

  - id: source_tiers
    label: 来源层级 S1–S8
    stages: [02, 03]
    authority_kind: ontology_rule_param
    authority_ref: ontology/01_通用/models/evidence.yaml#object_types.SourceDocument.attributes.source_tier.allowed_values

  - id: confidence_levels
    label: 置信上限 high/medium/low
    stages: [03, 04]
    authority_kind: ontology_rule_param
    authority_ref: ontology/01_通用/models/judgment.yaml#object_types.Judgment.attributes.confidence.allowed_values

  - id: basket_roles
    label: 证据篮子角色（运行时六值）
    stages: [02, 03]
    authority_kind: runtime_contract
    authority_ref: governance/02_合同/judgment_threshold_policy.yaml#operational_basket_roles

  - id: kb03_method_roles
    label: 取证方法五角色（说明层）
    stages: [03]
    authority_kind: knowledge_base_ref
    authority_ref: methods/03_取证/03_registry.yaml#evidence_roles
    must_point_to: governance/02_合同/judgment_threshold_policy.yaml#evidence_method_role_to_basket_role

  - id: kb03_quality_language
    label: 完备度四档用语（说明层）
    stages: [03]
    authority_kind: knowledge_base_ref
    authority_ref: methods/03_取证/03_registry.yaml#quality_language
    must_point_to: governance/02_合同/judgment_threshold_policy.yaml#quality_language_to_evidence_grades

  - id: judgment_method_routes
    label: judgment_type → kb03/kb04 方法路由
    stages: [02, 03, 04]
    authority_kind: runtime_contract
    authority_ref: governance/02_合同/judgment_method_routes.yaml#routes
    note: 路由合同；judgment_type 值域仍以一级本体为准，本表不升格为治理域本体实例

  - id: stage_statuses
    label: 阶段运行状态
    stages: [01, 02, 03, 04, 05]
    authority_kind: runtime_contract
    authority_ref: governance/02_合同/public_contract.yaml#stage_statuses

  - id: task_disposition
    label: 01 任务处置结果
    stages: [01]
    authority_kind: runtime_contract
    authority_ref: governance/03_校验/status_derivation.py#TASK_DISPOSITIONS

  - id: quality_status
    label: 质量门状态
    stages: [01, 02, 03, 04, 05]
    authority_kind: runtime_contract
    authority_ref: governance/03_校验/quality_gate_utils.py#QUALITY_STATUSES

  - id: expression_strength_markers
    label: 05 强度措辞禁表
    stages: [05]
    authority_kind: runtime_contract
    authority_ref: governance/03_校验/stages/stage_05/validate_05_outputs.py#STRENGTH_UPGRADE_MARKERS
    note: 本期保持运行约束，不升格为治理域本体

# 明确不升格：二级指南与 04/05 审计枚举保持说明/阶段合同，不登记为 ontology_rule_param。
not_promoted:
  - id: evidence_quality_dimensions
    reason: 二级证据质量维度为领域取证指南，与 L1 sourceTier/confidence/basketRole 语义相近但职责不同；不合并升格
    stays_at: ontology/01_通用/models/semiconductor_extension.yaml#domain_guides.evidence_quality_dimensions
  - id: event_type_taxonomy
    reason: 领域事件分类法，介于 schema 扩展与实例之间；任务需要时经 02 映射，不进一级规则参数
    stays_at: ontology/01_通用/models/semiconductor_extension.yaml#event_taxonomy.event_type_taxonomy
  - id: commercialization_stages
    reason: 半导体商业化阶段词表，由实例 stage_vocabulary_ref 引用，不升格为 L1 枚举
    stays_at: ontology/01_通用/models/semiconductor_extension.yaml#domain_guides.commercialization_stages
  - id: stage04_handoff_and_audit_enums
    reason: handoff_to_05 / permitted_role / delivery_archetype 等属 04→05 阶段审计与表达合同，非业务强度参数
    stays_at: runtime/workflow/stage_specs/04_判断/模板/04_推理审计模板.yaml#handoff_to_05
