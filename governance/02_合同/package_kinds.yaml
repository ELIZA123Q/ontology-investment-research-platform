schema_name: research_package_kinds
schema_version: 1.0.0
contract_version: 1.3.0
description: >
  一次研究运行的权威制品有三类。工作台「导出正式发布包」生产 formal_pack；
  workbench_export 仅作内部紧凑投影/回归；语义样例不得走正式中文命名包发现规则。
  routing_rules 是 detect_package_kind 的唯一路由权威。

kinds:
  formal_pack:
    schema_name: controlled_research_run_manifest
    schema_version: "1.3.0"
    layout: chinese_named_md_yaml
    validator: governance/03_校验/validate_run.py
    discovery_markers:
      - "01-*投研需求说明-*.md"
    publishable: true
    notes: >
      研究员/发布主链；中文命名 MD + YAML。
      工作台「导出正式发布包」是正式包生产入口；独立语义审查后可 PUBLISHABLE。

  semantic_fixture:
    schema_name: controlled_research_run_manifest_v3
    schema_version: "1.0.0"
    layout: compact_v3_yaml
    validator: governance/03_校验/validate_v3_samples.py
    discovery_markers:
      - 01_task.yaml
      - 02_structure.yaml
      - incremental_update.yaml
    publishable: false
    contract_ref:
      schema_name: controlled_research_run_manifest
      schema_version: "1.3.0"
    notes: Ontology 3.0 / Public Contract 1.3 黄金样例；紧凑 YAML，证明语义链而非发布排版。

  workbench_export:
    schema_name: controlled_research_run_manifest_workbench
    schema_version: "1.0.0"
    layout: compact_v3_yaml
    validator: governance/03_校验/validate_workbench_package.py
    discovery_markers:
      - 01_task.yaml
      - 02_structure.yaml
      - package_kind.yaml
    publishable: false
    contract_ref:
      schema_name: controlled_research_run_manifest
      schema_version: "1.3.0"
    notes: >
      工作台紧凑投影/回归夹具。日常正式交付请走 formal_pack 导出；
      本类型仅供内部验收与 03_回归，不能替代正式中文命名包。

routing_rules:
  - if_manifest_package_kind_in: [formal_pack, semantic_fixture, workbench_export]
  - if_manifest_schema_name: controlled_research_run_manifest
    then: formal_pack
  - if_manifest_schema_name: controlled_research_run_manifest_workbench
    then: workbench_export
  - if_manifest_schema_name: controlled_research_run_manifest_v3
    then: semantic_fixture
  - if_glob: "01-*投研需求说明-*.md"
    then: formal_pack
  - if_files_all: [01_task.yaml, 02_structure.yaml, package_kind.yaml]
    then: workbench_export
  - if_files_all: [01_task.yaml, 02_structure.yaml, incremental_update.yaml]
    then: semantic_fixture
  - if_files_all: [01_task.yaml, 02_structure.yaml]
    and_manifest_run_mode: workbench
    then: workbench_export
  - if_files_all: [01_task.yaml, 02_structure.yaml]
    then: semantic_fixture
