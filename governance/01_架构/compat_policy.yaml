schema_name: repository_compat_policy
schema_version: 1.0.0
status: active
principles:
- legacy_paths_remain_readable
- new_writes_go_to_five_domains_first
- no_destructive_deletes_in_boundary_rewrite
legacy_roots:
  ontology:
    mode: compat
    target: semantic/ontology
  methods:
    mode: compat
    target: tasks+capabilities
  runtime:
    mode: compat
    target: capabilities+execution+app
  instances:
    mode: compat
    target: execution/workspace
  evaluation:
    mode: compat
    target: governance/evals
  workflow:
    mode: compat
    target: tasks/workflows/deep_research
  delivery:
    mode: compat
    target: methods/05_表达
  knowledge:
    mode: compat
    target: methods + semantic/tasks/capabilities/execution
  governance_contracts:
    mode: compat
    target: governance/02_合同
  governance_validation:
    mode: compat
    target: governance/03_校验
  governance_architecture:
    mode: compat
    target: governance/01_架构
  governance_evaluation:
    mode: compat
    target: evaluation
compat_marking_policy:
  required_file: README.compat.md
  required_fields:
  - mode
  - target_authority
  - write_policy
  - migration_ref
  write_policy_default: deny_new_writes
