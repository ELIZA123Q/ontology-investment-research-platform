schema_name: layered_repository_layout
schema_version: 2.1.0
status: active
skeleton_ref: governance/01_架构/00_五域系统骨架.md
authority_index: governance/01_架构/five_domain_authority.yaml
migration_ledger: governance/04_路线图/2026-08-06_五域迁移资产账本.md
compat_policy: governance/01_架构/compat_policy.yaml
authority_domains:
  architecture: governance/01_架构
  five_domain_index: governance/01_架构/five_domain_authority.yaml
  semantic: semantic
  task: tasks
  capability: capabilities
  execution: execution
  governance: governance
  public_contracts: governance/02_合同
  validation: governance/03_校验
  ontology: ontology
  methods: methods
  workflow: tasks/workflows/deep_research
  runtime: runtime
  run_instances: instances
  delivery: methods/05_表达
  evaluation: evaluation
  app_ui: runtime/app
  app_surface: app
write_policy:
  new_edits_go_to: five_domain_write_entries
  legacy_roots_are: compat_read_only
aliases:
  semantic/ontology: ontology
  semantic/dictionary: ontology/01_通用
  semantic/evidence: methods/03_取证
  tasks/workflows/deep_research: runtime/workflow/stage_specs
  capabilities/agents: runtime/agents
  capabilities/skills: runtime/skills
  capabilities/protocols/mcp: methods/03_取证
  execution/workspace: instances
  execution/runtime: runtime
  governance/rules: governance/02_合同
  governance/verifiers: governance/03_校验
  governance/evals: evaluation
  workflow: tasks/workflows/deep_research
  delivery: methods/05_表达
  knowledge: methods
  governance/contracts: governance/02_合同
  governance/validation: governance/03_校验
  governance/architecture: governance/01_架构
  governance/evaluation: evaluation
  app: runtime/app
layers:
  semantic:
    purpose: 领域世界模型——对象、关系、概念口径、图合同、证据 provenance
    registry: semantic/registry.yaml
    target_paths:
    - semantic/ontology
    - semantic/dictionary
    - semantic/knowledge_graph
    - semantic/evidence
    may_define:
    - object_types
    - relation_types
    - action_types
    - semantic_constraint_rules
    - concept_glossary
    - graph_contracts
    - evidence_provenance_contracts
    must_not_define:
    - research_procedures
    - stage_gates
    - prompts
    - single_run_judgments
  task:
    purpose: 场景、标准任务、角色与推荐工作流（含 Deep Research 01—05）
    registry: tasks/registry.yaml
    target_paths:
    - tasks/scenarios
    - tasks/definitions
    - tasks/roles
    - tasks/workflows
    may_define:
    - scenarios
    - task_definitions
    - roles
    - workflow_specs
    - stage_inputs
    - stage_outputs
    - return_conditions
    must_not_define:
    - ontology_meanings
    - tool_implementations
    - evaluation_protocols
  capability:
    purpose: Agent 组织与可调用能力（Skill / Tool / 协议）
    registry: capabilities/registry.yaml
    target_paths:
    - capabilities/agents
    - capabilities/skills
    - capabilities/tools
    - capabilities/protocols
    may_define:
    - agent_contracts
    - skills
    - tools
    - mcp_channel_registration
    - a2a_protocol_boundaries
    must_not_define:
    - world_model
    - single_run_workspace_artifacts
  execution:
    purpose: 单次运行的 Context / Memory / Workspace / Runtime
    registry: execution/registry.yaml
    target_paths:
    - execution/context
    - execution/memory
    - execution/workspace
    - execution/runtime
    may_define:
    - context_assembly
    - memory_contracts
    - run_records
    - job_orchestration
    - storage
    must_not_define:
    - reusable_method_truth
    - parallel_ontology
    - parallel_public_contracts
  governance:
    purpose: 规则、身份、权限、质量评测与确定性校验
    registry: governance/rules/registry.yaml
    target_paths:
    - governance/rules
    - governance/identity
    - governance/permissions
    - governance/evals
    - governance/verifiers
    may_define:
    - asset_boundaries
    - public_contracts
    - status_protocols
    - validation_rules
    - eval_protocols
    - identity_permission_matrices
    must_not_define:
    - ontology_meanings
    - method_content
    - run_facts
    - production_answers
  ontology:
    purpose: 'COMPAT: 正式本体仍在 ontology/；目标迁入 semantic/'
    may_define:
    - object_types
    - relation_types
    - action_types
    - semantic_constraint_rules
    must_not_define:
    - single_run_observations
    - single_run_judgments
    - method_procedures
    - stage_contracts
    - run_evaluations
  methods:
    purpose: 'COMPAT: 方法正文拆入 task/capability；过渡期仍可读 methods/'
    may_define:
    - method_metadata
    - applicability
    - failure_conditions
    - candidate_routes
    must_not_define:
    - single_run_method_selection
    - single_run_judgments
  workflow:
    purpose: 'COMPAT: Deep Research 旧路径 runtime/workflow/stage_specs；新增改动写 tasks/workflows/deep_research'
    may_define:
    - stage_inputs
    - stage_outputs
    - stage_actions
    - return_conditions
    must_not_define:
    - duplicated_method_content
    - single_run_results
  runtime:
    purpose: 'COMPAT: 编排与引擎仍在 runtime/；目标拆入 capabilities + execution'
    may_define:
    - execution_state
    - adapters
    - orchestration
    - method_selection
    must_not_define:
    - parallel_public_contracts
    - parallel_ontology
  instances:
    purpose: 'COMPAT: 运行产物仍在 instances/；目标 execution/workspace'
    may_define:
    - run_records
    - rule_evaluations
    - judgments
    - reasoning_traces
    must_not_define:
    - reusable_method_truth
  delivery:
    purpose: 'COMPAT: 表达标准仍在 methods/05_表达'
    may_define:
    - expression_standards
    - report_templates
    must_not_define:
    - new_facts
    - new_judgments
  evaluation:
    purpose: 'COMPAT: 评测仍在 evaluation/；目标 governance/evals'
    may_define:
    - test_cases
    - protocols
    - harnesses
    - reports
    must_not_define:
    - production_answers
legacy_note: legacy paths are compat-read-only; new writes must target five-domain
  authorities and documented aliases. Ask authority location via five_domain_authority.yaml
  and each domain registry.yaml first.
