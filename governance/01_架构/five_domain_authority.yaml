schema_name: five_domain_authority_index
schema_version: 1.0.0
status: active
skeleton_ref: governance/01_架构/00_五域系统骨架.md
layout_ref: governance/01_架构/repo_layout.yaml
compat_ref: governance/01_架构/compat_policy.yaml
migration_ledger: governance/04_路线图/2026-08-06_五域迁移资产账本.md

rule: |
  新增改动写入 write_entry；运行时与校验器默认读 read_primary（或其镜像）；
  compat_read 仅用于回放与过渡，不再作为新增改动入口。
  “权威在哪”优先查本文件 + 各域 registry.yaml，不查旧顶层目录习惯。

domains:
  semantic:
    registry: semantic/registry.yaml
    write_entry: semantic/
    read_primary:
      - semantic/ontology/registry.yaml
      - semantic/dictionary/registry.yaml
      - semantic/knowledge_graph/registry.yaml
      - semantic/evidence/registry.yaml
    compat_read:
      - ontology/
      - methods/03_取证/B00_来源选择与使用边界.md
  task:
    registry: tasks/registry.yaml
    write_entry: tasks/
    read_primary:
      - tasks/workflows/deep_research/registry.yaml
      - tasks/scenarios/registry.yaml
      - tasks/definitions/registry.yaml
      - tasks/roles/registry.yaml
    compat_read:
      - runtime/workflow/stage_specs/
      - methods/02_研究框架/行业/*/场景卡/
  capability:
    registry: capabilities/registry.yaml
    write_entry: capabilities/
    read_primary:
      - capabilities/registry.yaml
      - capabilities/agents/registry.yaml
      - capabilities/skills/registry.yaml
      - capabilities/tools/registry.yaml
      - capabilities/protocols/mcp/registry.yaml
      - capabilities/protocols/a2a/registry.yaml
      - capabilities/protocols/a2a/BOUNDARY.md
    compat_read:
      - runtime/agents/
      - runtime/skills/
      - methods/03_取证/
  execution:
    registry: execution/registry.yaml
    write_entry: execution/
    read_primary:
      - execution/registry.yaml
      - execution/context/registry.yaml
      - execution/memory/contract.yaml
      - execution/workspace/registry.yaml
      - execution/runtime/registry.yaml
      - governance/01_架构/runtime_contexts.yaml
    compat_read:
      - runtime/
      - instances/
  governance:
    registry: governance/registry.yaml
    write_entry: governance/{rules,evals,verifiers,identity,permissions}/
    read_primary:
      - governance/registry.yaml
      - governance/rules/registry.yaml
      - governance/verifiers/registry.yaml
      - governance/evals/registry.yaml
      - governance/identity/registry.yaml
      - governance/permissions/registry.yaml
    compat_read:
      - governance/02_合同/
      - governance/03_校验/
      - evaluation/
      - governance/contracts/
      - governance/validation/
      - governance/architecture/

runtime_consumption:
  context_registry_primary: governance/01_架构/runtime_contexts.yaml
  context_registry_compat:
    - governance/architecture/runtime_contexts.yaml
  asset_coverage_primary: governance/03_校验/runtime_asset_coverage.yaml
  asset_coverage_compat:
    - governance/validation/runtime_asset_coverage.yaml
  stage_spec_primary: tasks/workflows/deep_research/
  stage_spec_compat:
    - runtime/workflow/stage_specs/
  stage_yaml_template_primary: methods/templates/
  stage_yaml_template_compat:
    - runtime/workflow/stage_specs/*/模板/

done_criteria_this_wave:
  - 五域 registry 可独立回答权威在哪
  - runtime context + 校验器默认读新路径或新镜像
  - 旧路径仍可回放，但不再作为新增改动入口
  - validate_project 不因路径不存在新增失败

  app:
    registry: app/registry.yaml
    write_entry: app/
    read_primary:
      - app/registry.yaml
      - app/README.md
    compat_read:
      - runtime/app/
