schema_name: ontology_governance_shared_model
schema_version: 2.0.0
meta_schema_version: 2.0.0
status: active
namespace: gov.shared
model: shared
description: 治理对象复用的共享属性与接口。

shared_property_types:
  governance_id:
    metadata: {id: governance_id, namespace: gov.shared, label_zh: 治理标识, label_en: Governance ID, definition: 治理控制面内稳定且唯一的标识。, model: shared, version: 2.0.0, status: active}
    type: string
    required: true
    description: 全局稳定标识。
  governance_status:
    metadata: {id: governance_status, namespace: gov.shared, label_zh: 治理状态, label_en: Governance Status, definition: 治理对象当前状态的公共属性。, model: shared, version: 2.0.0, status: active}
    type: string
    required: true
    description: 对象当前状态。
  governance_version:
    metadata: {id: governance_version, namespace: gov.shared, label_zh: 治理版本, label_en: Governance Version, definition: 治理资源采用的语义版本。, model: shared, version: 2.0.0, status: active}
    type: string
    required: true
    description: SemVer 版本。
  content_fingerprint:
    metadata: {id: content_fingerprint, namespace: gov.shared, label_zh: 内容指纹, label_en: Content Fingerprint, definition: 对受治理内容按约定算法计算的不可混淆摘要。, model: shared, version: 2.0.0, status: active}
    type: string
    required: false
    description: "以 sha256: 开头的内容指纹。"
  created_at:
    metadata: {id: created_at, namespace: gov.shared, label_zh: 创建时间, label_en: Created At, definition: 治理对象首次写入的系统时间。, model: shared, version: 2.0.0, status: active}
    type: datetime
    required: true
    description: ISO 8601 时间。
  updated_at:
    metadata: {id: updated_at, namespace: gov.shared, label_zh: 更新时间, label_en: Updated At, definition: 治理对象最近一次合法 Action 写入时间。, model: shared, version: 2.0.0, status: active}
    type: datetime
    required: true
    description: ISO 8601 时间。

interface_types:
  GovernableResource:
    metadata: {id: GovernableResource, namespace: gov.shared, label_zh: 可治理资源, label_en: Governable Resource, definition: 具有稳定身份、版本、状态和责任角色的治理资源。, model: shared, version: 2.0.0, status: active}
    required_properties: [id, version, status, owner_role, created_at, updated_at]
  ReviewableProposal:
    metadata: {id: ReviewableProposal, namespace: gov.shared, label_zh: 可审阅提案, label_en: Reviewable Proposal, definition: 具有基线、差异、影响与生命周期的变更提案。, model: shared, version: 2.0.0, status: active}
    required_properties: [id, status, base_fingerprint, change_kind, created_at, updated_at]
  AuditableAction:
    metadata: {id: AuditableAction, namespace: gov.shared, label_zh: 可审计动作, label_en: Auditable Action, definition: 可追溯到 Action 类型、执行者、输入和结果的治理动作记录。, model: shared, version: 2.0.0, status: active}
    required_properties: [id, action_type, action_version, actor_name, input_snapshot, result_snapshot, created_at]
