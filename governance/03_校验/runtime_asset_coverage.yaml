# ontology / methods / workflow → Runtime 工作台注入覆盖矩阵
# 维护三库时对照本表：改 critical 资产须保证对应 injection_mode 仍生效。
schema_name: runtime_asset_coverage
schema_version: 1.0.0
status: active

injection_modes:
  knowledge: "governance/01_架构/runtime_contexts.yaml 阶段白名单全文（可截断）"
  registry_routed: "method_registry / judgment_method_routes 进入 method_candidates"
  guidance_excerpt: "method_guidance 按候选截断摘录 selected_method_guidance"
  ontology_slice: "ontology_tools / context_assembler 按语义路由切片"
  structured_input: "workflow.generate 结构化字段（caps / cards / hints / permission）"
  missing_critical: "应进 Runtime 但尚未接线（须优先补齐）"

