      status: {type: enum, required: true, cardinality: '1..1', value_role: state, nullable_semantics: forbidden, allowed_values: [entered, in_progress, complete, invalidated], description: 场景语义完成状态，不是任务运行状态。}
    constraints: {unique: [name, cutoff_at], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
