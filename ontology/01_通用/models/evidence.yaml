schema_name: investment_research_evidence_model
schema_version: 3.0.0
meta_schema_version: 1.0.0
status: active
namespace: core.evidence
model: evidence
description: 来源、陈述、事实、要求、评估与证据篮子的可追溯模型。
object_types:
  SourceDocument: &source_type
    metadata: {id: SourceDocument, namespace: core.evidence, label_zh: 来源文档, label_en: Source Document, aliases: [来源], definition: 可定位、可版本化并具有发布主体的原始材料。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [公司公告], counter_examples: [分析师判断]}
    primary_key: id
    title_property: title
    attributes:
      title: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 标题。}
      uri: {type: uri, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 地址或内部定位。}
      published_at: {type: datetime, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, time_basis: publication_time, description: 发布时间。}
      source_tier: {type: enum, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, allowed_values: [S1, S2, S3, S4, S5, S6, S7, S8], description: 与现有取证策略库一致的来源等级；来源角色和权威类型另行记录，不与等级混用。}
    constraints: &standard_constraints {unique: [], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  EvidenceClaim:
    metadata: {id: EvidenceClaim, namespace: core.evidence, label_zh: 原始陈述, label_en: Evidence Claim, aliases: [材料主张], definition: 从来源中按原意提取且可精确定位的原子陈述。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [公告称产能增加20%], counter_examples: [因此行业上行]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, description: 原始陈述。}
      locator: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 页码、段落、表格或时间戳。}
    constraints: *standard_constraints
  EvidenceFact:
    metadata: {id: EvidenceFact, namespace: core.evidence, label_zh: 证据事实, label_en: Evidence Fact, aliases: [归一事实], definition: 由原始陈述归一对齐后形成且不包含分析推断的事实。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [同口径库存同比下降10%], counter_examples: [库存下降意味着周期反转]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, description: 归一事实。}
      subject_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, reference_target: core_object, description: 事实主体。}
      time_basis: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 时间口径。}
      scope_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: ResearchScope, description: 适用范围。}
    constraints: *standard_constraints
  EvidenceRequirement:
    metadata: {id: EvidenceRequirement, namespace: core.evidence, label_zh: 证据要求, label_en: Evidence Requirement, aliases: [ER], definition: 判断单元在主体、时间、范围、来源和证据角色上的最低输入合同。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [需要两条独立产能证据], counter_examples: [搜索更多资料]}
    primary_key: id
    title_property: requirement
    attributes:
      requirement: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 可执行要求。}
      evidence_role: {type: enum, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, allowed_values: [support, counter, context, boundary], description: 证据角色。}
      minimum_independent_sources: {type: integer, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 最低独立来源数。}
    constraints: *standard_constraints
  EvidenceAssessment:
    metadata: {id: EvidenceAssessment, namespace: core.evidence, label_zh: 证据评估, label_en: Evidence Assessment, aliases: [可用性评估], definition: 证据在特定任务、范围和判断单元下的可靠性、相关性、时效性与可用性评估。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [公告为直接高可靠证据], counter_examples: [该来源永远可靠]}
    primary_key: id
    title_property: assessment
    attributes:
      assessment: {type: enum, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, allowed_values: [usable, usable_with_caveat, contested, unusable], description: 使用结论。}
      directness: {type: enum, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, allowed_values: [direct, indirect, proxy], description: 直接性。}
      limitations: {type: array, required: true, cardinality: '0..*', value_role: metadata, nullable_semantics: 空列表表示未识别额外限制。, description: 局限。}
    constraints: *standard_constraints
  EvidenceBasket:
    metadata: {id: EvidenceBasket, namespace: core.evidence, label_zh: 证据篮子, label_en: Evidence Basket, aliases: [证据组合], definition: 为单一判断单元与单一证据角色组织的具体证据集合。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [JU-01支持证据篮子], counter_examples: [全项目所有证据]}
    primary_key: id
    title_property: label
    attributes:
      label: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 篮子标签。}
      role: {type: enum, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, allowed_values: [support, counter, context, boundary], description: 篮子角色。}
    constraints: *standard_constraints
relation_types:
  claimCitesSource: {metadata: {id: claimCitesSource, namespace: core.evidence, label_zh: 陈述引用来源, label_en: claim cites source, aliases: [], definition: 原始陈述的来源关系。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [陈述引用公告], counter_examples: [判断引用证据篮子]}, source_types: [EvidenceClaim], target_types: [SourceDocument], source_cardinality: '1..1', target_cardinality: '0..*', direction: directed, inverse_of: sourceHasClaim, symmetric: false, transitive: false, evidence_required: false, temporal: false, attributes: {}, invalidation_policy: block_delete}
  sourceHasClaim: {metadata: {id: sourceHasClaim, namespace: core.evidence, label_zh: 来源具有陈述, label_en: source has claim, aliases: [], definition: claimCitesSource 的逆关系。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [公告具有陈述], counter_examples: [事实支持信号]}, source_types: [SourceDocument], target_types: [EvidenceClaim], source_cardinality: '0..*', target_cardinality: '1..1', direction: directed, inverse_of: claimCitesSource, symmetric: false, transitive: false, evidence_required: false, temporal: false, attributes: {}, invalidation_policy: block_delete}
  factDerivedFromClaim: {metadata: {id: factDerivedFromClaim, namespace: core.evidence, label_zh: 事实源自陈述, label_en: fact derived from claim, aliases: [], definition: 归一事实所依据的原始陈述。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [库存事实源自公告], counter_examples: [判断源自方法]}, source_types: [EvidenceFact], target_types: [EvidenceClaim], source_cardinality: '1..*', target_cardinality: '0..*', direction: directed, inverse_of: claimGroundsFact, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  claimGroundsFact: {metadata: {id: claimGroundsFact, namespace: core.evidence, label_zh: 陈述奠定事实, label_en: claim grounds fact, aliases: [], definition: factDerivedFromClaim 的逆关系。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [陈述支撑事实], counter_examples: [事实支撑判断]}, source_types: [EvidenceClaim], target_types: [EvidenceFact], source_cardinality: '0..*', target_cardinality: '1..*', direction: directed, inverse_of: factDerivedFromClaim, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  evidenceConflictsWith: {metadata: {id: evidenceConflictsWith, namespace: core.evidence, label_zh: 证据冲突, label_en: evidence conflicts with, aliases: [], definition: 两项证据在同一主体、范围、时间与口径下不可同时成立。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [两项库存数据冲突], counter_examples: [不同口径数值不同]}, source_types: [EvidenceClaim, EvidenceFact], target_types: [EvidenceClaim, EvidenceFact], source_cardinality: '0..*', target_cardinality: '0..*', direction: undirected, inverse_of: evidenceConflictsWith, symmetric: true, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
rules:
  evidence_scope_time_alignment:
    metadata: {id: evidence_scope_time_alignment, namespace: core.evidence, label_zh: 证据范围时间对齐, label_en: Evidence scope and time alignment, aliases: [], definition: 正式证据必须与目标主体、范围、时间和口径一致或披露代理关系。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [同主体同期间数据], counter_examples: [全球数据无披露代表单一公司]}
    rule_class: evidence_constraint
    applies_to: [EvidenceAssessment]
    input_types: [EvidenceFact, EvidenceRequirement, ResearchScope]
    output_types: [EvidenceAssessment]
    preconditions: [source_traceable]
    condition: subject_time_scope_unit_aligned or proxy_disclosed
    counter_conditions: [scope_mismatch, future_data, undisclosed_proxy]
    failure_result: unusable_or_caveated
    priority: blocking
    test_cases: [{id: EVI-R-01-P, expected: pass}, {id: EVI-R-01-N, expected: reject}]
  no_direct_evidence_to_judgment:
    metadata: {id: no_direct_evidence_to_judgment, namespace: core.evidence, label_zh: 禁止证据直达判断, label_en: No direct evidence to judgment, aliases: [], definition: 证据只能直接支持观测、事件、信号或假设，不能越过推理步骤直接生成判断。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [事实支持信号后形成判断], counter_examples: [事实直接支持最终判断]}
    rule_class: evidence_constraint
    applies_to: [evidence_reasoning_relation]
    input_types: [EvidenceFact, reasoning_object]
    output_types: [validation_result]
    preconditions: [target_type_known]
    condition: target_type in [Observation, Event, Signal, Hypothesis]
    counter_conditions: [target_type_is_Judgment]
    failure_result: reject
    priority: blocking
    test_cases: [{id: EVI-R-02-P, expected: pass}, {id: EVI-R-02-N, expected: reject}]
