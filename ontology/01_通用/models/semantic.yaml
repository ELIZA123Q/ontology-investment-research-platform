rules:
  semantic_endpoint_compatibility:
    metadata: {id: semantic_endpoint_compatibility, namespace: core.semantic, label_zh: 关系端点兼容, label_en: Relation endpoint compatibility, aliases: [], definition: 关系实例的端点类型必须落在关系定义允许范围内。执行面是 Runtime 实例图物化（validateRuntimeGraph），不是 stage_04 判断链引用检查；后者见 judgment_reference_integrity。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [Company produces Product], counter_examples: [Event produces Region]}
    rule_class: semantic_constraint
    applies_to: [relation_instance]
    input_types: [relation_instance]
    output_types: [validation_result]
    preconditions: [relation_type_exists]
    condition: source.type in relation.source_types and target.type in relation.target_types
    counter_conditions: [dangling_endpoint, incompatible_endpoint]
    failure_result: reject
    priority: blocking
    test_case_role: design_intent
    test_cases: [{id: SEM-R-01-P, input: {relation_type: produces, source_type: Company, target_type: Product, endpoints_exist: true}, expected: pass}, {id: SEM-R-01-N, input: {relation_type: produces, source_type: Event, target_type: Region, endpoints_exist: true}, expected: reject}]
  value_chain_propagation_consistency:
    metadata: {id: value_chain_propagation_consistency, namespace: core.semantic, label_zh: 产业链传导一致性, label_en: Value chain propagation consistency, aliases: [传导路径一致性], definition: 传导/机制/影响类判断必须具备至少一条含两个及以上状态变量的路径；若声明正式影响边，则每条边必须具备机制与方向，且同端点对不得出现冲突方向。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-27', valid_to: null, replaced_by: [], source: ontology-3.0-deep-axioms, examples: [transmission_path 判断绑定两条变量的传导路径], counter_examples: [机制判断无路径且无影响边]}
    rule_class: semantic_constraint
    applies_to: [Judgment]
    input_types: [Judgment, JudgmentUnit, StateVariable]
    output_types: [validation_result]
    preconditions: [judgment_unit_bound]
    condition: non_propagation_type_or_path_consistent
    counter_conditions: [propagation_type_without_path, path_variables_unlinked, influence_sign_conflict]
    failure_result: reject_or_downgrade
    priority: blocking
    test_case_role: executable
    test_cases:
      - {id: SEM-R-02-P, input: {non_propagation_type_or_path_consistent: true, propagation_type_without_path: false, path_variables_unlinked: false, influence_sign_conflict: false}, expected: pass}
      - {id: SEM-R-02-N, input: {non_propagation_type_or_path_consistent: false, propagation_type_without_path: true, path_variables_unlinked: false, influence_sign_conflict: false}, expected: reject}
