schema_name: investment_research_semantic_model
schema_version: 3.0.0
meta_schema_version: 1.0.0
status: active
namespace: core.semantic
model: semantic
description: 跨行业稳定的投研对象、属性和结构关系。

object_types:
  Organization:
    metadata: &organization_meta
      {id: Organization, namespace: core.semantic, label_zh: 组织, label_en: Organization, aliases: [机构], definition: 可独立识别并承担经济或公共职能的组织主体。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [监管机构], counter_examples: [临时项目组]}
    primary_key: id
    title_property: name
    attributes: &named_attributes
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 规范名称。}
      aliases: {type: array, required: false, cardinality: '0..*', value_role: identity, nullable_semantics: 空列表表示无已知别名。, description: 可归一别名。}
    constraints: &standard_constraints {unique: [name], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  Company:
    extends: Organization
    metadata: {id: Company, namespace: core.semantic, label_zh: 公司, label_en: Company, aliases: [企业], definition: 以商业经营为主要身份的组织主体。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [上市公司], counter_examples: [行业协会]}
    primary_key: id
    title_property: name
    attributes:
      <<: *named_attributes
      primary_listing_ref: {type: object_ref, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示未冻结主挂牌引用。, reference_target: Listing, description: 公司主挂牌引用。}
      issuer_identifiers: {type: array, required: false, cardinality: '0..*', value_role: identity, nullable_semantics: null 表示未冻结发行人标识集合。, description: 可归一发行人标识集合（如 ISIN/其他代码）。}
    constraints: *standard_constraints
  Industry:
    metadata: {id: Industry, namespace: core.semantic, label_zh: 行业, label_en: Industry, aliases: [产业], definition: 具有共同供需和竞争结构的经济活动集合。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [半导体行业], counter_examples: [单一公司]}
    primary_key: id
    title_property: name
    attributes: *named_attributes
    constraints: *standard_constraints
  ValueChainSegment:
    metadata: {id: ValueChainSegment, namespace: core.semantic, label_zh: 产业链环节, label_en: Value Chain Segment, aliases: [环节, Segment], definition: 在产业价值创造中承担稳定功能的位置。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [设备环节], counter_examples: [季度收入]}
    primary_key: id
    title_property: name
    attributes: *named_attributes
    constraints: *standard_constraints
  Product:
    metadata: {id: Product, namespace: core.semantic, label_zh: 产品, label_en: Product, aliases: [产品类别], definition: 可被生产、交易、使用或交付的产品或产品类别。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [存储芯片], counter_examples: [库存水平]}
    primary_key: id
    title_property: name
    attributes:
      <<: *named_attributes
      product_category: {type: string, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示未冻结分类口径。, description: 产品类别或子口径（非百科长文）。}
      primary_application_ref: {type: object_ref, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示尚未绑定主要应用锚点。, reference_target: Application, description: 该产品在研究中最常用的主要应用锚点。}
    constraints: *standard_constraints
  Technology:
    metadata: {id: Technology, namespace: core.semantic, label_zh: 技术, label_en: Technology, aliases: [技术路线], definition: 可稳定识别、具有能力边界的技术或技术体系。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [先进封装], counter_examples: [技术成熟度上升]}
    primary_key: id
    title_property: name
    attributes: *named_attributes
    constraints: *standard_constraints
  Region:
    metadata: {id: Region, namespace: core.semantic, label_zh: 地区, label_en: Region, aliases: [管辖区], definition: 可稳定引用的地理、经济或监管范围。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [中国大陆], counter_examples: [全球需求走强]}
    primary_key: id
    title_property: name
    attributes: *named_attributes
    constraints: *standard_constraints
  Metric:
    metadata: {id: Metric, namespace: core.semantic, label_zh: 指标, label_en: Metric, aliases: [度量], definition: 具有稳定定义、单位与口径的可观测或可计算量。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [库存周转天数], counter_examples: [库存处于低位]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 指标名称。}
      unit: {type: string, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示无量纲或单位尚未冻结。, description: 标准单位。}
      time_basis: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 时点、期间或滚动口径。}
      comparability_basis: {type: string, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示暂无可比性口径。, description: 用于跨公司/跨期间可比的口径基准。}
    constraints: *standard_constraints
  Application:
    metadata: {id: Application, namespace: core.semantic, label_zh: 应用场景, label_en: Application, aliases: [下游应用], definition: 产品或技术被使用并产生业务价值的稳定用途分类。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [数据中心训练], counter_examples: [公司本季度增加采购]}
    primary_key: id
    title_property: name
    attributes: *named_attributes
    constraints: *standard_constraints
  Material:
    extends: Product
    metadata: {id: Material, namespace: core.semantic, label_zh: 材料, label_en: Material, aliases: [原材料], definition: 被生产过程消耗、转化或沉积并进入产品或制造过程的产品类别。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [电子特气], counter_examples: [设备维护服务]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 材料名称。}
      aliases: {type: array, required: false, cardinality: '0..*', value_role: identity, nullable_semantics: 空列表表示无已知别名。, description: 可归一别名。}
      specification: {type: string, required: false, cardinality: '0..1', value_role: fact, nullable_semantics: null 表示规格尚未冻结。, description: 关键规格或纯度口径。}
    constraints: *standard_constraints
  ProcessStep:
    metadata: {id: ProcessStep, namespace: core.semantic, label_zh: 工艺步骤, label_en: Process Step, aliases: [制造步骤], definition: 在生产过程中具有明确输入、输出和功能边界的稳定步骤类别。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [刻蚀], counter_examples: [某日设备停机]}
    primary_key: id
    title_property: name
    attributes: *named_attributes
    constraints: *standard_constraints
  PolicyInstrument:
    metadata: {id: PolicyInstrument, namespace: core.semantic, label_zh: 政策工具, label_en: Policy Instrument, aliases: [监管工具], definition: 由有权机构发布并对对象行为、准入或资源配置形成稳定约束的政策手段类别。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [出口管制清单], counter_examples: [政策发布事件]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 政策工具名称。}
      instrument_type: {type: enum, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, allowed_values: [restriction, subsidy, tax, standard, licensing, disclosure, other], description: 政策工具类型。}
      jurisdiction_ref: {type: object_ref, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示尚未绑定主要管辖区。, reference_target: Region, description: 政策适用的主要管辖区（可选）。}
    constraints: *standard_constraints
  Asset:
    metadata: {id: Asset, namespace: core.semantic, label_zh: 资产, label_en: Asset, aliases: [经济资产], definition: 可识别、可归属且能够承载经济利益或风险的资产类别；作为设施类（如 ManufacturingFacility）和金融工具（FinancialInstrument）的公共投影父类。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-27', valid_to: null, replaced_by: [], source: ontology-3.0-content-enhancement, examples: [公司股权, 半导体制造设施], counter_examples: [看多观点, 市场情绪]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 资产名称。}
      asset_class: {type: string, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, description: 资产类别。}
    constraints: *standard_constraints
  FinancialInstrument:
    extends: Asset
    metadata: {id: FinancialInstrument, namespace: core.semantic, label_zh: 金融工具, label_en: Financial Instrument, aliases: [证券], definition: 体现一方金融资产与另一方权益或负债关系、可被稳定识别的资产。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-27', valid_to: null, replaced_by: [], source: ontology-3.0-content-enhancement, examples: [上市公司普通股], counter_examples: [公司利润]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 金融工具名称。}
      instrument_type: {type: enum, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, allowed_values: [equity, debt, fund, derivative, depositary_receipt, other], description: 金融工具类型。}
      identifier: {type: string, required: false, cardinality: '0..1', value_role: identity, nullable_semantics: null 表示尚无统一市场代码。, description: 市场代码或标准标识。}
    constraints: {unique: [identifier], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  TradingVenue:
    extends: Organization
    metadata: {id: TradingVenue, namespace: core.semantic, label_zh: 交易场所, label_en: Trading Venue, aliases: [交易所], definition: 提供金融工具挂牌或交易制度并可稳定识别的组织。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-27', valid_to: null, replaced_by: [], source: ontology-3.0-content-enhancement, examples: [证券交易所], counter_examples: [证券代码]}
    primary_key: id
    title_property: name
    attributes:
      <<: *named_attributes
      mic_or_code: {type: string, required: false, cardinality: '0..1', value_role: identity, nullable_semantics: null 表示无国际标准代码或代码尚未冻结。, description: MIC 或市场通用代码。}
    constraints: *standard_constraints
  Listing:
    metadata: {id: Listing, namespace: core.semantic, label_zh: 上市挂牌, label_en: Listing, aliases: [挂牌关系], definition: 金融工具由发行主体在交易场所挂牌的一项具有有效期的可识别安排。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-27', valid_to: null, replaced_by: [], source: ontology-3.0-content-enhancement, examples: [某公司普通股在交易所挂牌], counter_examples: [股价上涨]}
    primary_key: id
    title_property: ticker
    attributes:
      ticker: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 挂牌代码。}
      listed_at: {type: date, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, time_basis: effective_time, description: 上市或挂牌生效日期。}
      delisted_at: {type: date, required: false, cardinality: '0..1', value_role: fact, nullable_semantics: null 表示仍有效。, time_basis: effective_time, description: 终止挂牌日期。}
    constraints: {unique: [ticker], mutually_exclusive: [], lifecycle: listed_at_lte_delisted_at}
  ResearchScope:
    metadata: {id: ResearchScope, namespace: core.semantic, label_zh: 研究范围, label_en: Research Scope, aliases: [Scope], definition: 对象、地域、客户、指标与时间边界的可引用集合。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [中国存储芯片行业2026年], counter_examples: [值得关注]}
    primary_key: id
    title_property: label
    attributes:
      label: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 范围标签。}
      dimensions: {type: object, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 对象、地域、客户、指标和时间维度。}
    constraints: {unique: [label], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}

