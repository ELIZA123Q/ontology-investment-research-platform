    source_types: [Company, Product, ValueChainSegment, Technology]
    target_types: [Industry, ValueChainSegment]
    source_cardinality: '0..*'
    target_cardinality: '0..*'
    direction: directed
    inverse_of: contains
    symmetric: false
    transitive: false
    evidence_required: true
    temporal: true
    attributes: {}
    invalidation_policy: retain_history
