  expectationGapBasedOnJudgment: {metadata: {id: expectationGapBasedOnJudgment, namespace: core.judgment, label_zh: 预期差基于判断, label_en: expectation gap based on judgment, aliases: [], definition: 预期差必须引用已经形成的研究判断。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-freeze-correction, examples: [预期差基于周期判断], counter_examples: [证据直接生成预期差]}, source_types: [ExpectationGap], target_types: [Judgment], source_cardinality: '1..1', target_cardinality: '0..*', direction: directed, inverse_of: judgmentHasExpectationGap, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
