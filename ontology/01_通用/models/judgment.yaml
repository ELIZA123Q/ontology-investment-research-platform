      source_judgment_refs: {type: array, required: true, cardinality: '1..*', value_role: metadata, nullable_semantics: forbidden, description: 作为输入的既有判断引用。}
      target_object_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: core_object, description: 影响目标对象。}
      direction: {type: enum, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, allowed_values: [positive, negative, mixed, neutral, indeterminate], description: 影响方向。}
      time_horizon: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 影响时间尺度。}
      limitations: {type: array, required: true, cardinality: '0..*', value_role: judgment, nullable_semantics: 空列表不代表无限外推，仍受来源判断范围限制。, description: 投影限制。}
    constraints: *standard_constraints
  ReasoningTrace:
    metadata: {id: ReasoningTrace, namespace: core.judgment, label_zh: 推理留痕, label_en: Reasoning Trace, aliases: [推理链], definition: 从证据、状态、信号、假设、规则评估与方法应用到判断的不可变引用图。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [C-01完整追溯图], counter_examples: [研究摘要]}
