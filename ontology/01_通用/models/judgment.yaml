schema_name: investment_research_judgment_model
schema_version: 3.0.0
meta_schema_version: 1.0.0
status: active
namespace: core.judgment
model: judgment
description: 研究问题、判断单元、假设、信号、竞争解释、阻断因素、规则评估、判断与推理留痕。
object_types:
  ResearchQuestion: &question
    metadata: {id: ResearchQuestion, namespace: core.judgment, label_zh: 研究问题, label_en: Research Question, aliases: [问题节点], definition: 具有明确范围、回答标准和失败路由的研究子问题。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [库存是否进入去化阶段], counter_examples: [研究半导体]}
    primary_key: id
    title_property: question
    attributes:
      question: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 可回答问题。}
      scope_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: ResearchScope, description: 范围引用。}
      failure_route: {type: enum, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, allowed_values: [stop, downgrade, competing_explanation, return_to_structure], description: 失败路由。}
    constraints: &standard_constraints {unique: [], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  JudgmentUnit:
    metadata: {id: JudgmentUnit, namespace: core.judgment, label_zh: 判断单元, label_en: Judgment Unit, aliases: [JU], definition: 在单一对象、范围、时间和口径下可独立接受证据与形成判断的最小单元。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [存储库存环比下降], counter_examples: [行业景气且公司受益]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 待裁决陈述。}
      judgment_type: {type: enum, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, allowed_values: [state_measurement, trend_direction, cycle_phase, mechanism_validation, causal_attribution, transmission_path, object_differentiation, impact_realization, expectation_gap, valuation_impact], description: 判断类型。}
      scope_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: ResearchScope, description: 范围引用。}
    constraints: *standard_constraints
  Hypothesis:
    metadata: {id: Hypothesis, namespace: core.judgment, label_zh: 假设, label_en: Hypothesis, aliases: [待验证假设], definition: 具有方向、时间尺度与证伪条件的解释或预测。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [供给收缩导致库存去化], counter_examples: [行业很好]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, description: 假设陈述。}
      falsification_conditions: {type: array, required: true, cardinality: '1..*', value_role: metadata, nullable_semantics: forbidden, description: 可观测证伪条件。}
      time_horizon: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 时间尺度。}
    constraints: *standard_constraints
  Signal:
    metadata: {id: Signal, namespace: core.judgment, label_zh: 信号, label_en: Signal, aliases: [判断信号], definition: 从证据事实或状态观测中解释出的、对假设具有明确作用方向的中间结果。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [库存连续下降构成支持信号], counter_examples: [公告称库存下降]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, description: 信号解释。}
      role: {type: enum, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, allowed_values: [support, weaken, block, context], description: 作用方向。}
    constraints: *standard_constraints
  CompetingExplanation:
    metadata: {id: CompetingExplanation, namespace: core.judgment, label_zh: 竞争解释, label_en: Competing Explanation, aliases: [替代解释], definition: 对同一观测结果提供可区分的替代机制。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [库存下降源于减产而非需求恢复], counter_examples: [数据可能不准]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, description: 替代解释。}
      discriminating_evidence: {type: array, required: true, cardinality: '1..*', value_role: metadata, nullable_semantics: forbidden, description: 区分性证据。}
    constraints: *standard_constraints
  BlockingFactor:
    metadata: {id: BlockingFactor, namespace: core.judgment, label_zh: 阻断因素, label_en: Blocking Factor, aliases: [阻断项], definition: 命中后限制方法执行、结论方向或结论等级的条件。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [关键口径不可比], counter_examples: [一般性不确定性]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, description: 阻断说明。}
      effect: {type: enum, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, allowed_values: [method_block, direction_block, level_cap, scope_cap], description: 阻断效果。}
    constraints: *standard_constraints
  RuleEvaluation:
    metadata: {id: RuleEvaluation, namespace: core.judgment, label_zh: 规则评估, label_en: Rule Evaluation, aliases: [规则执行记录], definition: 对正式稳定规则的输入、条件、反条件和结果的不可变评估记录。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [证据门槛逐项评估], counter_examples: [condition_results仅写matched]}
    primary_key: id
    title_property: rule_ref
    attributes:
      rule_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: stable_rule, description: 正式规则引用。}
      input_refs: {type: array, required: true, cardinality: '1..*', value_role: metadata, nullable_semantics: forbidden, description: 实际输入引用。}
      condition_results: {type: array, required: true, cardinality: '1..*', value_role: calculated, nullable_semantics: forbidden, description: 每项必须含条件、表达式、输入、结果和理由。}
      result: {type: enum, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, allowed_values: [pass, fail, contested, blocked], description: 结果。}
    constraints: *standard_constraints
  Judgment:
    metadata: {id: Judgment, namespace: core.judgment, label_zh: 判断, label_en: Judgment, aliases: [研究结论], definition: 经证据、信号、假设、正式约束与方法应用后形成的有范围、有条件结论。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [行业处于早期去库阶段J2], counter_examples: [公告显示库存下降]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, description: 结论。}
      level: {type: enum, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, allowed_values: [J0, J1, J2, J3, J4], description: 判断等级。}
      confidence: {type: enum, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, allowed_values: [low, medium, high], description: 置信度。}
      decision_status: {type: enum, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, allowed_values: [draft, supported, contested, blocked, indeterminate, invalidated], description: 判断的语义状态；indeterminate 明确表示证据不足以判断。}
      conflict_status: {type: enum, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, allowed_values: [none, unresolved, resolved, decisive], description: 冲突证据处理状态。}
      not_judgeable_reason: {type: string, required: false, cardinality: '0..1', value_role: judgment, nullable_semantics: null 仅允许用于非 blocked 或 indeterminate 状态。, description: 不可判断或阻断时的具体原因。}
      scope_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: ResearchScope, description: 判断适用范围。}
      cutoff_at: {type: datetime, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, time_basis: research_cutoff, description: 形成判断时允许使用信息的截止时间。}
      conditions: {type: array, required: false, cardinality: '0..*', value_role: judgment, nullable_semantics: 空列表仍受范围与截止时间限制。, description: 成立条件。}
      invalidation_conditions: {type: array, required: true, cardinality: '1..*', value_role: judgment, nullable_semantics: forbidden, description: 失效条件。}
    constraints: *standard_constraints
  MarketExpectation:
    metadata: {id: MarketExpectation, namespace: core.judgment, label_zh: 市场预期, label_en: Market Expectation, aliases: [一致预期, 隐含预期], definition: 在明确对象、范围和时间截面下由价格、预测或参与者行为反映的外部预期状态；它不是研究者待验证的假设。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-freeze-correction, examples: [市场一致预期未来两季度价格继续下跌], counter_examples: [研究者假设库存将下降]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: state, nullable_semantics: forbidden, description: 可核对的市场预期陈述。}
      scope_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: ResearchScope, description: 预期适用范围。}
      as_of: {type: datetime, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, time_basis: research_cutoff, description: 预期观测截面。}
      source_refs: {type: array, required: true, cardinality: '1..*', value_role: metadata, nullable_semantics: forbidden, description: 形成预期状态的证据来源。}
    constraints: *standard_constraints
  ExpectationGap:
    metadata: {id: ExpectationGap, namespace: core.judgment, label_zh: 预期差, label_en: Expectation Gap, aliases: [判断与预期差异], definition: 研究判断与同范围同时间截面的市场预期之间可解释、可失效的差异结果；它不是一般判断的同义词。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-freeze-correction, examples: [研究判断为有条件修复而市场仍预期持续下行], counter_examples: [行业进入去库后段]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, description: 预期差陈述。}
      direction: {type: enum, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, allowed_values: [positive, negative, mixed, none, indeterminate], description: 相对市场预期的差异方向。}
      judgment_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: Judgment, description: 研究判断引用。}
      market_expectation_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: MarketExpectation, description: 对照市场预期引用。}
      invalidation_conditions: {type: array, required: true, cardinality: '1..*', value_role: judgment, nullable_semantics: forbidden, description: 预期差失效条件。}
    constraints: *standard_constraints
  AssetImpact:
    metadata: {id: AssetImpact, namespace: core.judgment, label_zh: 资产影响, label_en: Asset Impact, aliases: [资产映射], definition: 将既有研究判断在明确标的、传导路径、时间尺度与边界下投影为资产层影响的判断结果；它不得绕过业务判断直接由证据生成。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-freeze-correction, examples: [成本上升对样本设备商利润率形成有条件负面影响], counter_examples: [给予目标价或仓位建议]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, description: 资产影响陈述。}
      source_judgment_refs: {type: array, required: true, cardinality: '1..*', value_role: metadata, nullable_semantics: forbidden, description: 作为输入的既有判断引用。}
      target_object_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: core_object, description: 影响目标对象。}
      direction: {type: enum, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, allowed_values: [positive, negative, mixed, neutral, indeterminate], description: 影响方向。}
      time_horizon: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 影响时间尺度。}
      limitations: {type: array, required: false, cardinality: '0..*', value_role: judgment, nullable_semantics: 空列表不代表无限外推，仍受来源判断范围限制。, description: 投影限制。}
    constraints: *standard_constraints
  ReasoningTrace:
    metadata: {id: ReasoningTrace, namespace: core.judgment, label_zh: 推理留痕, label_en: Reasoning Trace, aliases: [推理链], definition: 从证据、状态、信号、假设、规则评估与方法应用到判断的不可变引用图。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [C-01完整追溯图], counter_examples: [研究摘要]}
    primary_key: id
    title_property: judgment_ref
    attributes:
      judgment_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: Judgment, description: 目标判断。}
      node_refs: {type: array, required: true, cardinality: '1..*', value_role: metadata, nullable_semantics: forbidden, description: 追溯节点。}
      created_at: {type: datetime, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 留痕时间。}
    constraints: {unique: [], mutually_exclusive: [], lifecycle: immutable_superseding}
relation_types:
  signalEvaluatesHypothesis: {metadata: {id: signalEvaluatesHypothesis, namespace: core.judgment, label_zh: 信号评估假设, label_en: signal evaluates hypothesis, aliases: [], definition: 信号对假设产生支持、削弱或阻断作用。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [库存信号支持去库假设], counter_examples: [证据直接生成判断]}, source_types: [Signal], target_types: [Hypothesis], source_cardinality: '1..*', target_cardinality: '1..*', direction: directed, inverse_of: hypothesisEvaluatedBySignal, symmetric: false, transitive: false, evidence_required: true, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  hypothesisEvaluatedBySignal: {metadata: {id: hypothesisEvaluatedBySignal, namespace: core.judgment, label_zh: 假设由信号评估, label_en: hypothesis evaluated by signal, aliases: [], definition: signalEvaluatesHypothesis 的逆关系。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [假设由信号评估], counter_examples: [判断引用来源]}, source_types: [Hypothesis], target_types: [Signal], source_cardinality: '1..*', target_cardinality: '1..*', direction: directed, inverse_of: signalEvaluatesHypothesis, symmetric: false, transitive: false, evidence_required: true, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  judgmentBasedOnHypothesis: {metadata: {id: judgmentBasedOnHypothesis, namespace: core.judgment, label_zh: 判断基于假设, label_en: judgment based on hypothesis, aliases: [], definition: 判断引用经过信号评估的假设。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [周期判断基于去库假设], counter_examples: [判断直接基于证据]}, source_types: [Judgment], target_types: [Hypothesis], source_cardinality: '1..*', target_cardinality: '0..*', direction: directed, inverse_of: hypothesisSupportsJudgment, symmetric: false, transitive: false, evidence_required: true, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  hypothesisSupportsJudgment: {metadata: {id: hypothesisSupportsJudgment, namespace: core.judgment, label_zh: 假设支持判断, label_en: hypothesis supports judgment, aliases: [], definition: judgmentBasedOnHypothesis 的逆关系。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [假设支持判断], counter_examples: [事实支撑判断]}, source_types: [Hypothesis], target_types: [Judgment], source_cardinality: '0..*', target_cardinality: '1..*', direction: directed, inverse_of: judgmentBasedOnHypothesis, symmetric: false, transitive: false, evidence_required: true, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  judgmentHasRuleEvaluation: {metadata: {id: judgmentHasRuleEvaluation, namespace: core.judgment, label_zh: 判断具有规则评估, label_en: judgment has rule evaluation, aliases: [], definition: 判断形成时实际执行的正式稳定约束评估。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [判断引用证据门槛评估], counter_examples: [判断引用治理检查]}, source_types: [Judgment], target_types: [RuleEvaluation], source_cardinality: '1..*', target_cardinality: '1..1', direction: directed, inverse_of: ruleEvaluationForJudgment, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  ruleEvaluationForJudgment: {metadata: {id: ruleEvaluationForJudgment, namespace: core.judgment, label_zh: 规则评估对应判断, label_en: rule evaluation for judgment, aliases: [], definition: judgmentHasRuleEvaluation 的逆关系。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [门槛评估对应C-01], counter_examples: [方法应用对应判断]}, source_types: [RuleEvaluation], target_types: [Judgment], source_cardinality: '1..1', target_cardinality: '1..*', direction: directed, inverse_of: judgmentHasRuleEvaluation, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  expectationGapComparesExpectation: {metadata: {id: expectationGapComparesExpectation, namespace: core.judgment, label_zh: 预期差对照市场预期, label_en: expectation gap compares expectation, aliases: [], definition: 预期差引用同范围同时间截面的市场预期。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-freeze-correction, examples: [预期差对照一致预期], counter_examples: [假设直接作为市场预期]}, source_types: [ExpectationGap], target_types: [MarketExpectation], source_cardinality: '1..1', target_cardinality: '0..*', direction: directed, inverse_of: marketExpectationComparedByGap, symmetric: false, transitive: false, evidence_required: true, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
