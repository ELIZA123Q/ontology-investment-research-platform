schema_name: investment_research_judgment_model
schema_version: 3.0.0
meta_schema_version: 1.0.0
status: active
namespace: core.judgment
model: judgment
description: 研究问题、判断单元、假设、信号、竞争解释、阻断因素、规则评估、判断与推理留痕。
object_types:
  ResearchQuestion: &question
    metadata: {id: ResearchQuestion, namespace: core.judgment, label_zh: 研究问题, label_en: Research Question, aliases: [问题节点], definition: 具有明确范围、回答标准和失败路由的研究子问题。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [库存是否进入去化阶段], counter_examples: [研究半导体]}
    primary_key: id
    title_property: question
    attributes:
      question: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 可回答问题。}
      scope_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: ResearchScope, description: 范围引用。}
      failure_route: {type: enum, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, allowed_values: [stop, downgrade, competing_explanation, return_to_structure], description: 失败路由。}
    constraints: &standard_constraints {unique: [], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  JudgmentUnit:
    metadata: {id: JudgmentUnit, namespace: core.judgment, label_zh: 判断单元, label_en: Judgment Unit, aliases: [JU], definition: 在单一对象、范围、时间和口径下可独立接受证据与形成判断的最小单元。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [存储库存环比下降], counter_examples: [行业景气且公司受益]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 待裁决陈述。}
      judgment_type: {type: enum, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, allowed_values: [state_measurement, trend_direction, cycle_phase, mechanism_validation, causal_attribution, transmission_path, object_differentiation, impact_realization, expectation_gap, valuation_impact], description: 判断类型。}
      scope_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: ResearchScope, description: 范围引用。}
    constraints: *standard_constraints
  Hypothesis:
    metadata: {id: Hypothesis, namespace: core.judgment, label_zh: 假设, label_en: Hypothesis, aliases: [待验证假设], definition: 具有方向、时间尺度与证伪条件的解释或预测。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [供给收缩导致库存去化], counter_examples: [行业很好]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, description: 假设陈述。}
      falsification_conditions: {type: array, required: true, cardinality: '1..*', value_role: metadata, nullable_semantics: forbidden, description: 可观测证伪条件。}
      time_horizon: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 时间尺度。}
    constraints: *standard_constraints
  Signal:
    metadata: {id: Signal, namespace: core.judgment, label_zh: 信号, label_en: Signal, aliases: [判断信号], definition: 从证据事实或状态观测中解释出的、对假设具有明确作用方向的中间结果。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [库存连续下降构成支持信号], counter_examples: [公告称库存下降]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, description: 信号解释。}
      role: {type: enum, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, allowed_values: [support, weaken, block, context], description: 作用方向。}
    constraints: *standard_constraints
  CompetingExplanation:
    metadata: {id: CompetingExplanation, namespace: core.judgment, label_zh: 竞争解释, label_en: Competing Explanation, aliases: [替代解释], definition: 对同一观测结果提供可区分的替代机制。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [库存下降源于减产而非需求恢复], counter_examples: [数据可能不准]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, description: 替代解释。}
      discriminating_evidence: {type: array, required: true, cardinality: '1..*', value_role: metadata, nullable_semantics: forbidden, description: 区分性证据。}
    constraints: *standard_constraints
  BlockingFactor:
    metadata: {id: BlockingFactor, namespace: core.judgment, label_zh: 阻断因素, label_en: Blocking Factor, aliases: [阻断项], definition: 命中后限制方法执行、结论方向或结论等级的条件。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [关键口径不可比], counter_examples: [一般性不确定性]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, description: 阻断说明。}
      effect: {type: enum, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, allowed_values: [method_block, direction_block, level_cap, scope_cap], description: 阻断效果。}
    constraints: *standard_constraints
  RuleEvaluation:
    metadata: {id: RuleEvaluation, namespace: core.judgment, label_zh: 规则评估, label_en: Rule Evaluation, aliases: [规则执行记录], definition: 对正式稳定规则的输入、条件、反条件和结果的不可变评估记录。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [证据门槛逐项评估], counter_examples: [condition_results仅写matched]}
    primary_key: id
    title_property: rule_ref
    attributes:
      rule_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: stable_rule, description: 正式规则引用。}
      input_refs: {type: array, required: true, cardinality: '1..*', value_role: metadata, nullable_semantics: forbidden, description: 实际输入引用。}
      condition_results: {type: array, required: true, cardinality: '1..*', value_role: calculated, nullable_semantics: forbidden, description: 每项必须含条件、表达式、输入、结果和理由。}
      result: {type: enum, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, allowed_values: [pass, fail, contested, blocked], description: 结果。}
    constraints: *standard_constraints
  Judgment:
    metadata: {id: Judgment, namespace: core.judgment, label_zh: 判断, label_en: Judgment, aliases: [研究结论], definition: 经证据、信号、假设、正式约束与方法应用后形成的有范围、有条件结论。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [行业处于早期去库阶段J2], counter_examples: [公告显示库存下降]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, description: 结论。}
      level: {type: enum, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, allowed_values: [J0, J1, J2, J3, J4], description: 判断等级。}
      confidence: {type: enum, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, allowed_values: [low, medium, high], description: 置信度。}
      conditions: {type: array, required: true, cardinality: '0..*', value_role: judgment, nullable_semantics: 空列表仍受范围与截止时间限制。, description: 成立条件。}
      invalidation_conditions: {type: array, required: true, cardinality: '1..*', value_role: judgment, nullable_semantics: forbidden, description: 失效条件。}
    constraints: *standard_constraints
  MarketExpectation:
    metadata: {id: MarketExpectation, namespace: core.judgment, label_zh: 市场预期, label_en: Market Expectation, aliases: [一致预期, 隐含预期], definition: 在明确对象、范围和时间截面下由价格、预测或参与者行为反映的外部预期状态；它不是研究者待验证的假设。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-freeze-correction, examples: [市场一致预期未来两季度价格继续下跌], counter_examples: [研究者假设库存将下降]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: state, nullable_semantics: forbidden, description: 可核对的市场预期陈述。}
