rules:
  judgment_evidence_threshold:
    metadata: {id: judgment_evidence_threshold, namespace: core.judgment, label_zh: 判断证据门槛, label_en: Judgment evidence threshold, aliases: [], definition: 判断等级不得超过证据完整性、反证处理和范围一致性共同允许的上限。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [部分证据最多J2], counter_examples: [单条间接证据形成J4]}
    rule_class: evidence_constraint
    applies_to: [Judgment]
    input_types: [EvidenceAssessment, EvidenceBasket, RuleEvaluation, JudgmentUnit]
    output_types: [Judgment]
    preconditions: [support_and_counter_baskets_assessed]
    condition: judgment.level <= evidence_ceiling and scope_aligned and counterevidence_resolved
    counter_conditions: [missing_counterevidence, scope_expansion, decisive_counterevidence]
    failure_result: downgrade_or_block
    priority: blocking
    test_cases: [{id: JUD-R-01-P, input: {requested_level: J2, evidence_ceiling: J3, scope_aligned: true, counterevidence_status: resolved}, expected: pass}, {id: JUD-R-01-N, input: {requested_level: J4, evidence_ceiling: J1, scope_aligned: false, counterevidence_status: decisive}, expected: reject}]
  judgment_status_consistency:
    metadata: {id: judgment_status_consistency, namespace: core.judgment, label_zh: 判断状态一致性, label_en: Judgment status consistency, aliases: [], definition: 判断状态必须与冲突证据、阻断因素和不可判断原因保持一致，禁止用高置信状态掩盖未解决冲突。, model: judgment, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [冲突未解决时判断为contested], counter_examples: [决定性反证存在时仍标记supported]}
    rule_class: state_consistency
    applies_to: [Judgment]
    input_types: [Judgment, EvidenceBasket, BlockingFactor]
    output_types: [Judgment]
    preconditions: [judgment_unit_and_cutoff_present]
    condition: unresolved_conflict_implies_contested and decisive_conflict_implies_blocked_or_indeterminate and blocked_or_indeterminate_has_reason
    counter_conditions: [supported_with_unresolved_conflict, blocked_without_reason, indeterminate_without_reason]
    failure_result: reject_or_invalidate_judgment
    priority: blocking
    test_cases: [{id: JUD-R-02-P, input: {decision_status: contested, conflict_status: unresolved, blocking_factor_count: 0, not_judgeable_reason: null}, expected: pass}, {id: JUD-R-02-N, input: {decision_status: supported, conflict_status: decisive, blocking_factor_count: 1, not_judgeable_reason: null}, expected: reject}]
