schema_name: investment_research_state_event_model
schema_version: 3.0.0
meta_schema_version: 1.0.0
status: active
namespace: core.state_event
model: state_event
description: 对象在特定业务时间和研究范围下的状态、观测与事件；不包含工作流动作。
object_types:
  StateVariable:
    metadata: &sv_meta {id: StateVariable, namespace: core.state_event, label_zh: 状态变量, label_en: State Variable, aliases: [变量], definition: 锚定对象、指标和范围并可随时间变化的研究变量。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [行业库存水平], counter_examples: [库存指标定义]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 变量名称。}
      category: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 变量所属的稳定分析类别。}
      definition: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 不依赖具体任务的变量定义。}
      variable_kind: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 定量、定性或派生变量类别。}
      anchors: {type: array, required: true, cardinality: '1..*', value_role: metadata, nullable_semantics: forbidden, description: 允许锚定的语义对象类型；具体对象由 stateVariableForObject 关系绑定。}
      decision_use: {type: string, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示尚未补充典型判断用途。, description: 变量可服务的典型判断用途。}
      observation_guidance: {type: string, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示沿用指标定义。, description: 观测和解释注意事项。}
      evidence_profile_ref: {type: string, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示尚未绑定领域证据画像。, description: 领域证据画像引用。}
      counter_evidence_guidance: {type: string, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示尚未补充通用反证指引。, description: 典型反证方向。}
      variable_role: {type: string, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示未预设研究优先级。, description: 变量在领域研究中的典型角色。}
      metric_ref: {type: object_ref, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示这是稳定变量定义，具体任务尚未绑定指标。, reference_target: Metric, description: 任务实例使用的指标引用。}
      scope_ref: {type: object_ref, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示这是稳定变量定义，具体任务尚未绑定范围。, reference_target: ResearchScope, description: 任务实例使用的范围引用。}
    constraints: &standard_constraints {unique: [], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  Observation:
    metadata: {id: Observation, namespace: core.state_event, label_zh: 观测, label_en: Observation, aliases: [状态观测], definition: 对状态变量在明确业务时间、公布时间和研究截止时间下的记录。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [季度库存周转天数为90天], counter_examples: [库存将下降]}
    primary_key: id
    title_property: label
    attributes:
      label: {type: string, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, description: 观测标签。}
      value: {type: object, required: true, cardinality: '1..1', value_role: state, nullable_semantics: forbidden, description: 数值、枚举或区间。}
      observed_at: {type: datetime, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, time_basis: business_time, description: 业务时间。}
      valid_from: {type: datetime, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, time_basis: effective_time, description: 该观测值开始适用的有效时间。}
      valid_to: {type: datetime, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示有效期尚未结束或未知。, time_basis: effective_time, description: 该观测值停止适用的有效时间。}
      published_at: {type: datetime, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示未知或未公开。, time_basis: publication_time, description: 公布时间。}
      cutoff_at: {type: datetime, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, time_basis: research_cutoff, description: 研究截止时间。}
    constraints: *standard_constraints
  Event:
    metadata: {id: Event, namespace: core.state_event, label_zh: 事件, label_en: Event, aliases: [业务事件], definition: 在明确时间发生且可能改变对象状态的事实性变化。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [工厂投产], counter_examples: [公司属于设备商]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, description: 事件名称。}
      event_type: {type: enum, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, allowed_values: [commercial, operational, technology, policy, supply, demand, financial, other], description: 事件类型。}
      occurred_at: {type: datetime, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, time_basis: business_time, description: 发生时间。}
      effective_at: {type: datetime, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, time_basis: effective_time, description: 事件开始产生业务效力的时间。}
      published_at: {type: datetime, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示事件未公开或公布时间未知。, time_basis: publication_time, description: 事件首次可获得的公布时间。}
      cutoff_at: {type: datetime, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, time_basis: research_cutoff, description: 本次研究允许使用该事件的截止时间。}
    constraints: *standard_constraints
  StateSnapshot:
    metadata: {id: StateSnapshot, namespace: core.state_event, label_zh: 状态快照, label_en: State Snapshot, aliases: [快照], definition: 同一范围与截止时间下多个观测的不可变集合。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [季度行业状态快照], counter_examples: [滚动任务]}
    primary_key: id
    title_property: label
    attributes:
      label: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 快照标签。}
      cutoff_at: {type: datetime, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, time_basis: research_cutoff, description: 截止时间。}
      scope_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: ResearchScope, description: 快照覆盖的研究范围。}
    constraints: {unique: [label, cutoff_at], mutually_exclusive: [], lifecycle: immutable}
  StateChange:
    metadata: {id: StateChange, namespace: core.state_event, label_zh: 状态变化, label_en: State Change, aliases: [状态变更], definition: 同一状态变量在可比范围和口径下由前态到后态的已识别变化，不等同于导致变化的事件。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [库存由高位下降至正常区间], counter_examples: [公司发布季度报告]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: state, nullable_semantics: forbidden, description: 对前态、后态与方向的原子描述。}
      direction: {type: enum, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, allowed_values: [increase, decrease, unchanged, transition, indeterminate], description: 状态变化方向。}
      effective_at: {type: datetime, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, time_basis: effective_time, description: 变化生效时间。}
      cutoff_at: {type: datetime, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, time_basis: research_cutoff, description: 识别变化时的研究截止时间。}
    constraints: {unique: [], mutually_exclusive: [], lifecycle: immutable_superseding}
relation_types:
  observationOf:
    metadata: &observation_rel_meta {id: observationOf, namespace: core.state_event, label_zh: 观测变量, label_en: observation of, aliases: [], definition: 观测对应的状态变量。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [库存观测对应库存变量], counter_examples: [证据支持判断]}
    source_types: [Observation]
    target_types: [StateVariable]
    source_cardinality: '1..1'
    target_cardinality: '0..*'
    direction: directed
    inverse_of: hasObservation
    symmetric: false
    transitive: false
    evidence_required: true
    temporal: true
    attributes: {}
    invalidation_policy: invalidate_downstream
  hasObservation:
    metadata: {id: hasObservation, namespace: core.state_event, label_zh: 具有观测, label_en: has observation, aliases: [], definition: observationOf 的逆关系。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [变量具有季度观测], counter_examples: [事件影响变量]}
    source_types: [StateVariable]
    target_types: [Observation]
    source_cardinality: '0..*'
    target_cardinality: '1..1'
    direction: directed
    inverse_of: observationOf
    symmetric: false
    transitive: false
    evidence_required: true
    temporal: true
    attributes: {}
    invalidation_policy: invalidate_downstream
  eventAffectsState:
    metadata: {id: eventAffectsState, namespace: core.state_event, label_zh: 事件影响状态, label_en: event affects state, aliases: [], definition: 已发生事件可能改变目标状态变量。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [投产影响产能], counter_examples: [报告提到事件]}
    source_types: [Event]
    target_types: [StateVariable]
    source_cardinality: '0..*'
    target_cardinality: '0..*'
    direction: directed
    inverse_of: affectedByEvent
    symmetric: false
    transitive: false
    evidence_required: true
    temporal: true
    attributes: {}
    invalidation_policy: invalidate_downstream
  affectedByEvent:
    metadata: {id: affectedByEvent, namespace: core.state_event, label_zh: 受事件影响, label_en: affected by event, aliases: [], definition: eventAffectsState 的逆关系。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [产能受投产影响], counter_examples: [变量具有观测]}
    source_types: [StateVariable]
    target_types: [Event]
    source_cardinality: '0..*'
    target_cardinality: '0..*'
    direction: directed
    inverse_of: eventAffectsState
    symmetric: false
    transitive: false
    evidence_required: true
    temporal: true
    attributes: {}
    invalidation_policy: invalidate_downstream
  stateVariableForObject: {metadata: {id: stateVariableForObject, namespace: core.state_event, label_zh: 状态变量锚定对象, label_en: state variable for object, aliases: [], definition: 状态变量锚定一个处于研究范围内的语义对象。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [库存变量锚定存储行业], counter_examples: [指标锚定判断]}, source_types: [StateVariable], target_types: [Organization, Company, Industry, ValueChainSegment, Product, Technology, Region, Application, Material, ProcessStep, PolicyInstrument, Asset, FinancialInstrument], source_cardinality: '1..1', target_cardinality: '0..*', direction: directed, inverse_of: objectHasStateVariable, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  objectHasStateVariable: {metadata: {id: objectHasStateVariable, namespace: core.state_event, label_zh: 对象具有状态变量, label_en: object has state variable, aliases: [], definition: stateVariableForObject 的逆关系。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [存储行业具有库存变量], counter_examples: [行业具有判断]}, source_types: [Organization, Company, Industry, ValueChainSegment, Product, Technology, Region, Application, Material, ProcessStep, PolicyInstrument, Asset, FinancialInstrument], target_types: [StateVariable], source_cardinality: '0..*', target_cardinality: '1..1', direction: directed, inverse_of: stateVariableForObject, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  snapshotIncludesObservation: {metadata: {id: snapshotIncludesObservation, namespace: core.state_event, label_zh: 快照包含观测, label_en: snapshot includes observation, aliases: [], definition: 状态快照包含在同一范围且不晚于截止时间的观测。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [季度快照包含库存观测], counter_examples: [快照包含未来预测]}, source_types: [StateSnapshot], target_types: [Observation], source_cardinality: '1..*', target_cardinality: '0..*', direction: directed, inverse_of: observationInSnapshot, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  observationInSnapshot: {metadata: {id: observationInSnapshot, namespace: core.state_event, label_zh: 观测位于快照, label_en: observation in snapshot, aliases: [], definition: snapshotIncludesObservation 的逆关系。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [库存观测位于季度快照], counter_examples: [观测位于事件]}, source_types: [Observation], target_types: [StateSnapshot], source_cardinality: '0..*', target_cardinality: '1..*', direction: directed, inverse_of: snapshotIncludesObservation, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  stateChangeOf: {metadata: {id: stateChangeOf, namespace: core.state_event, label_zh: 状态变化对应变量, label_en: state change of, aliases: [], definition: 状态变化对应唯一状态变量。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [库存下降对应库存变量], counter_examples: [事件对应判断]}, source_types: [StateChange], target_types: [StateVariable], source_cardinality: '1..1', target_cardinality: '0..*', direction: directed, inverse_of: stateVariableHasChange, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  stateVariableHasChange: {metadata: {id: stateVariableHasChange, namespace: core.state_event, label_zh: 状态变量具有变化, label_en: state variable has change, aliases: [], definition: stateChangeOf 的逆关系。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [库存变量具有下降变化], counter_examples: [变量具有公告]}, source_types: [StateVariable], target_types: [StateChange], source_cardinality: '0..*', target_cardinality: '1..1', direction: directed, inverse_of: stateChangeOf, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  stateChangeFromObservation: {metadata: {id: stateChangeFromObservation, namespace: core.state_event, label_zh: 状态变化源于前态观测, label_en: state change from observation, aliases: [], definition: 状态变化引用同变量、同口径的前态观测。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [库存下降源于上期库存观测], counter_examples: [状态变化源于判断]}, source_types: [StateChange], target_types: [Observation], source_cardinality: '1..1', target_cardinality: '0..*', direction: directed, inverse_of: observationPrecedesChange, symmetric: false, transitive: false, evidence_required: true, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  observationPrecedesChange: {metadata: {id: observationPrecedesChange, namespace: core.state_event, label_zh: 观测先于状态变化, label_en: observation precedes change, aliases: [], definition: stateChangeFromObservation 的逆关系。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [上期库存观测先于库存下降], counter_examples: [观测直接生成判断]}, source_types: [Observation], target_types: [StateChange], source_cardinality: '0..*', target_cardinality: '1..1', direction: directed, inverse_of: stateChangeFromObservation, symmetric: false, transitive: false, evidence_required: true, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  stateChangeToObservation: {metadata: {id: stateChangeToObservation, namespace: core.state_event, label_zh: 状态变化形成后态观测, label_en: state change to observation, aliases: [], definition: 状态变化引用同变量、同口径的后态观测。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [库存下降形成本期库存观测], counter_examples: [状态变化形成报告]}, source_types: [StateChange], target_types: [Observation], source_cardinality: '1..1', target_cardinality: '0..*', direction: directed, inverse_of: observationResultsFromChange, symmetric: false, transitive: false, evidence_required: true, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  observationResultsFromChange: {metadata: {id: observationResultsFromChange, namespace: core.state_event, label_zh: 观测源于状态变化, label_en: observation results from change, aliases: [], definition: stateChangeToObservation 的逆关系。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [本期库存观测源于库存下降], counter_examples: [观测源于假设]}, source_types: [Observation], target_types: [StateChange], source_cardinality: '0..*', target_cardinality: '1..1', direction: directed, inverse_of: stateChangeToObservation, symmetric: false, transitive: false, evidence_required: true, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  eventProducesStateChange: {metadata: {id: eventProducesStateChange, namespace: core.state_event, label_zh: 事件产生状态变化, label_en: event produces state change, aliases: [], definition: 有证据的已发生事件是某项状态变化的触发或原因候选，不自动证明唯一因果。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [投产事件产生供给状态变化], counter_examples: [报告发布产生行业判断]}, source_types: [Event], target_types: [StateChange], source_cardinality: '0..*', target_cardinality: '0..*', direction: directed, inverse_of: stateChangeTriggeredByEvent, symmetric: false, transitive: false, evidence_required: true, temporal: true, attributes: {causal_status: {type: enum, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, allowed_values: [candidate, supported, contested], description: 事件与变化之间的因果识别状态。}}, invalidation_policy: invalidate_downstream}
  stateChangeTriggeredByEvent: {metadata: {id: stateChangeTriggeredByEvent, namespace: core.state_event, label_zh: 状态变化由事件触发, label_en: state change triggered by event, aliases: [], definition: eventProducesStateChange 的逆关系。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [供给变化由投产事件触发], counter_examples: [判断由公告触发]}, source_types: [StateChange], target_types: [Event], source_cardinality: '0..*', target_cardinality: '0..*', direction: directed, inverse_of: eventProducesStateChange, symmetric: false, transitive: false, evidence_required: true, temporal: true, attributes: {causal_status: {type: enum, required: true, cardinality: '1..1', value_role: judgment, nullable_semantics: forbidden, allowed_values: [candidate, supported, contested], description: 事件与变化之间的因果识别状态。}}, invalidation_policy: invalidate_downstream}
rules:
  state_time_consistency:
    metadata: {id: state_time_consistency, namespace: core.state_event, label_zh: 状态时间一致性, label_en: State time consistency, aliases: [], definition: 观测业务时间不得晚于研究截止时间，历史快照不得覆盖。, model: state_event, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [截止日前观测], counter_examples: [使用未来数据]}
    rule_class: state_consistency
    applies_to: [Observation, StateSnapshot]
    input_types: [Observation, StateSnapshot]
    output_types: [validation_result]
    preconditions: [timestamps_present]
    condition: observed_at <= cutoff_at and snapshots_are_immutable
    counter_conditions: [future_data, overwritten_snapshot]
