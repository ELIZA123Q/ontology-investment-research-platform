data_logic:
  metrics:
    - 分应用 bit demand
    - 同规格合约价与实现价
    - 多层库存天数与交期
    - 新增合格供给里程碑
  formulas:
    - name: 分应用 bit demand
      expression: 系统/设备出货量 × 单机或单卡平均内存容量
      interpretation: 区分出货量与单机容量对需求的贡献，不把销售额直接当作 bit demand。
      claim_refs: [C-02, C-04, C-05, C-06, C-07]
      evidence_refs: [EV-01, EV-08, EV-11, EV-13, EV-17, EV-28, EV-29]
    - name: 有效供给
      expression: wafer starts × 单片可用 die × 良率 × 封装/测试通过率 × 客户认证可交付比例
      interpretation: 资本开支、厂房或名义产能不等于可交付供给。
      claim_refs: [C-02, C-04, C-05, C-06, C-07]
      evidence_refs: [EV-06, EV-09, EV-26, EV-27, EV-40, EV-41, EV-42, EV-43, EV-44, EV-48]
    - name: 库存变化
      expression: 上期库存 + 采购/供给流入 - 终端实际消耗
      interpretation: 必须同时观察不同产业链层级，避免把库存转移当作总库存变化。
      claim_refs: [C-02, C-03, C-04, C-06, C-07, C-08]
      evidence_refs: [EV-05, EV-15, EV-21, EV-22, EV-32, EV-34, EV-35, EV-36, EV-37]
    - name: 周期结束确认
      expression: 同口径价格连续转平/下降 AND 多层库存正常化或累积 AND 交期/分配正常化 AND 新增合格供给或需求下降可解释
      interpretation: 涨价斜率放缓只能确认价格加速结束，不能单独确认供需周期结束。
      claim_refs: [C-03, C-04, C-08]
      evidence_refs: [EV-02, EV-03, EV-04, EV-06, EV-16, EV-26, EV-43, EV-44]
  timing_and_scope_notes:
    - 价格、库存、良率、认证和稳定量产存在不同时滞，不得将计划日期写成有效供给日期。
    - HBM、非 HBM DRAM 与 NAND 的价格口径和供给约束不同，不得使用单一平均周期。

