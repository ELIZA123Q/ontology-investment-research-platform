uncertainty_register:
  - uncertainty_id: U-01
    tier: decisive
    statement: 多层库存是否真正偏低，还是只发生了库存搬家。
    affects_claim_refs: [C-02, C-03, C-04, C-06, C-07, C-08]
    current_gap: 缺原厂—模组/渠道—OEM/云客户连续同口径库存与实际消耗。
    observation_signal: 至少两个产业链层级连续两季的库存天数、规格可用性、在途和交期。
    update_trigger: 多层库存持续回升且交期缩短，或库存持续偏低。
    judgment_change: 前者提高正常化概率，后者延续结构性偏紧判断。
    gap_refs: [GAP-01, GAP-09]
  - uncertainty_id: U-02
    tier: decisive
    statement: 订单是否真正锁定，还是存在取消、延迟拉货和重复下单。
    affects_claim_refs: [C-02, C-03, C-04, C-06, C-07, C-08]
    current_gap: 缺行业级取消率、订单兑现、实际拉货和重复下单序列。
    observation_signal: 长协条款、实际拉货/订单覆盖、取消率和延迟交付。
    update_trigger: 取消率和延迟拉货同步上升，或订单兑现率持续高位。
    judgment_change: 前者削弱需求主线并使周期提前转弱，后者支持周期延长。
    gap_refs: [GAP-02]
  - uncertainty_id: U-03
    tier: decisive
    statement: 2027 新增产能能否通过良率、客户认证和稳定量产。
    affects_claim_refs: [C-04, C-05, C-08]
    current_gap: 已知建设和首批贡献窗口，未来设施的良率、认证和稳定量产尚未发生。
    observation_signal: 设备搬入、首片、样品、客户认证、稳定量产和有意义出货。
    update_trigger: 重要设施里程碑整体提前或延迟。
    judgment_change: 提前且需求未上修时正常化窗口前移；延迟时后移至 2028 年以后。
    gap_refs: [GAP-04, GAP-11, GAP-12]
  - uncertainty_id: U-04
    tier: decisive
    statement: AI 需求能否继续覆盖消费端需求破坏。
    affects_claim_refs: [C-02, C-04, C-05, C-06, C-07, C-08]
    current_gap: 缺全行业同口径分应用 bit demand 和服务器实际部署序列。
    observation_signal: 系统出货量与单机/单卡容量的乘积，并对照 AI capex、服务器和企业级 SSD 实际订单。
    update_trigger: AI capex、服务器拉货和企业级 SSD 订单同时下修或继续上修。
    judgment_change: 同时下修提高 2027 年提前见顶的可能；继续上修推迟缓解窗口。
    gap_refs: [GAP-08]
  - uncertainty_id: U-05
    tier: boundary
    statement: HBM 同代际连续成交价与价格口径不足。
    affects_claim_refs: [C-01, C-03, C-05, C-08]
    current_gap: HBM 缺同代际、同层数和同合同口径的连续成交价。
    observation_signal: 同代际 HBM 合同价与实现价时间序列。
    update_trigger: 形成至少两个可比时点的价格与合同机制。
    judgment_change: 改善 HBM 价格阶段判断，不改变已观测的 DRAM/NAND 价格方向。
    gap_refs: [GAP-13, GAP-14]
  - uncertainty_id: U-06
    tier: boundary
    statement: 全行业同口径有效产能、利用率、交期、配额和替代供应不足。
    affects_claim_refs: [C-02, C-04, C-06, C-07, C-08]
    current_gap: 有产品和局部原厂供给限制信号，缺可比的全行业量化序列。
    observation_signal: 分产品有效产能、利用率、交期、配额和替代供应。
    update_trigger: 形成三类产品同口径连续数据。
    judgment_change: 改善跨产品紧张度和供给弹性比较，不直接推翻局部偏紧方向。
    gap_refs: [GAP-03, GAP-10, GAP-12]
  - uncertainty_id: U-07
    tier: audit_only
    statement: SK hynix 官方页面直连返回 HTTP 403，原文可复核性下降。
    affects_claim_refs: []
    current_gap: 无法依赖该页形成唯一关键结论。
    observation_signal: 合规 API、IR PDF 或官方同步稿。
    update_trigger: 取得可归档的官方替代文档。
    judgment_change: 只改善审计可复现性，不直接改变业务观点。
    gap_refs: [GAP-05]
  - uncertainty_id: U-08
    tier: audit_only
    statement: 本次未保存网页原文和内容哈希，长期可复现性受限。
    affects_claim_refs: []
    current_gap: 来源定位和抓取时间已保留，原文固定快照缺失。
    observation_signal: 合规原始材料归档与 SHA-256。
    update_trigger: 原文归档流程启用。
    judgment_change: 只改善长期审计性。
    gap_refs: [GAP-06]
  - uncertainty_id: U-09
    tier: audit_only
    statement: 来源清单和取数口径尚未稳定版本化。
    affects_claim_refs: []
    current_gap: 每次运行需重新解释来源与查询口径。
    observation_signal: 版本化来源清单、查询参数、替代源和停止条件。
    update_trigger: 稳定取数配方库发布。
    judgment_change: 只改善跨次运行一致性。
    gap_refs: [GAP-07]

