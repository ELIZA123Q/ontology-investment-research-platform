cycle_stage_taxonomy:
  description: 04 对各产品线的阶段归类框架，不是 03 证据清单
  stages:
    - stage_id: tight_upcycle
      name: 紧缺上行
      meaning: 需求强于有效供给，价格和交期继续上行
      typical_conditions: [需求强, 库存低, 交期拉长, 价格持续上涨]
      primary_logic_units: [LU-01]
    - stage_id: late_acceleration
      name: 加速上行后段
      meaning: 价格仍涨，但涨幅可能接近高点
      typical_conditions: [价格涨幅高, 部分需求或采购开始承压]
      primary_logic_units: [LU-01, LU-02]
    - stage_id: high_normalization
      name: 高位正常化
      meaning: 供需仍不宽松，但价格涨幅放缓、交期改善
      typical_conditions: [价格继续高位但边际趋稳, 库存开始修复]
      primary_logic_units: [LU-02]
    - stage_id: peak_weakening
      name: 见顶转弱
      meaning: 需求或订单走弱，价格上行动能不足
      typical_conditions: [库存回升, 订单取消, 价格涨幅明显收窄]
      primary_logic_units: [LU-02, LU-03]
    - stage_id: downturn
      name: 下行
      meaning: 供给超过需求，价格和稼动率下行
      typical_conditions: [库存累积, 价格下跌, 产能利用率下降]
      primary_logic_units: [LU-03]
    - stage_id: insufficient_evidence
      name: 证据不足
      meaning: 关键证据缺失或互相矛盾
      typical_conditions: [不能形成方向性判断]
      primary_logic_units: [LU-05]
  rules:
    - 三类产品分别独立判定阶段，不得共用一个阶段标签。
    - 阶段由需求、库存、有效供给、价格和交期等指标组合判定；单一信号不足以定阶段。

