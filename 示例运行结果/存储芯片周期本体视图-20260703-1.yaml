  normalized_question: >-
    截至每次运行的数据截止时点，全球存储芯片中 HBM、非 HBM DRAM 与 NAND 分别处于什么供需与价格周期阶段；
    在未来 6—24 个月内，哪些需求、库存、有效供给、价格和产能信号将支持周期延续或表明周期转入见顶、正常化或下行？
  task_type:
    primary: 状态与趋势判断
    secondary: []
  scope:
    time: 回看最近六个季度并前瞻 6—24 个月
    time_policy:
      mode: rolling
      anchor: execution_date
      anchor_value: null
      timezone: Asia/Shanghai
      lookback: P18M
      lookforward: P24M
      fixed_start: null
      fixed_end: null
      data_cutoff: execution_date
    geography: 全球
    value_chain: 终端需求—订单与库存—晶圆制造/先进封装—产品供给—合约及实现价格
    objects: [HBM, 通用DRAM, NANDFLASH]
    object_display_names:
      通用DRAM: 非 HBM DRAM
    object_selection:
      mode: fixed
      as_of: execution_date
      criteria:
        - 分开覆盖 HBM、非 HBM DRAM 与 NAND，不以单一行业均值替代
        - HBM 属于 DRAM 内部高端品类，单独作为观察层
        - 对 DRAM/HBM 重点观察主要 DRAM 原厂（Samsung、SK hynix、Micron）
        - 对 NAND 补充主要 NAND 原厂（含 Kioxia、Western Digital、Solidigm、YMTC 等）及企业级 SSD 供应链
        - 原厂披露用于供给和经营交叉验证，不做个股判断
      count_or_coverage: 三类产品与分产品主要原厂
      refresh_on_each_run: true

