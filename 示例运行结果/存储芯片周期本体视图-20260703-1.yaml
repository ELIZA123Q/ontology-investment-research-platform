reasoning_view:
  event_types:
    - id: demand_forecast_change
      name: 需求或预测变化
      description: 终端需求、行业预测或客户需求展望发生变化。
      applicable_object_types: [Application, Industry, Product]
      required_properties: [name, occurredAt, semanticRefs, evidenceRefs]
      evidence_requirements: [ER-01]
      source_ref: 二级半导体领域本体规范/reasoning.yaml#demand_forecast_change
      source_version: 1.0.0
      selection_reason: 承接 AI/服务器需求上修和消费需求下修。
      used_by_path_nodes: [N-01, N-06]
    - id: order_shipment_change
      name: 订单与出货变化
      description: 订单、取消、排产、出货或交付计划发生变化。
      applicable_object_types: [Company, Product, Segment]
      required_properties: [name, occurredAt, semanticRefs, evidenceRefs]
      evidence_requirements: [ER-02]
      source_ref: 二级半导体领域本体规范/reasoning.yaml#order_shipment_change
      source_version: 1.0.0
      selection_reason: 区分长期订单与抢货、取消或延迟拉货。
      used_by_path_nodes: [N-02, N-06]
    - id: price_lead_time_change
      name: 价格与交期变化
      description: 产品价格、报价、交期和分配机制发生变化。
      applicable_object_types: [Product, Company, Segment]
      required_properties: [name, occurredAt, semanticRefs, evidenceRefs]
      evidence_requirements: [ER-05]
      source_ref: 二级半导体领域本体规范/reasoning.yaml#price_lead_time_change
      source_version: 1.0.0
      selection_reason: 定位当前涨价阶段和价格斜率变化。
      used_by_path_nodes: [N-04, N-07]
    - id: capacity_investment_change
      name: 产能与投资变化
      description: 新建、扩建、减产、关停或设备投资发生变化。
      applicable_object_types: [Company, ManufacturingFacility, Segment]
      required_properties: [name, occurredAt, semanticRefs, evidenceRefs]
      evidence_requirements: [ER-06]
      source_ref: 二级半导体领域本体规范/reasoning.yaml#capacity_investment_change
      source_version: 1.0.0
      selection_reason: 承接 2027—2028 新增晶圆与封装供给。
      used_by_path_nodes: [N-05, N-07]
  state_variables:
    - id: end_market_demand_strength
      name: 终端需求强度
      definition: 终端行业、应用或工作负载对半导体功能和数量的需求强弱。
      allowed_anchor_types: [Application, Industry, Product]
      observation_guidance: 综合终端销量、使用量、系统部署、出货和行业景气，而非单一预测。
      counter_evidence_guidance: 终端销量下修、设备利用不足、预算削减或需求前置透支。
      evidence_profile_ref: demand_orders
      source_ref: 二级半导体领域本体规范/reasoning.yaml#end_market_demand_strength
      source_version: 1.0.0
      selection_reason: 判断 AI 强需求与消费需求走弱的分化。
      used_by_path_nodes: [N-01, N-06]
    - id: order_visibility
      name: 订单能见度
      definition: 订单、合同、排产和客户承诺对未来交付需求的可见程度。
      allowed_anchor_types: [Company, Product, Segment]
      observation_guidance: 同时检查订单覆盖期、取消条款、重复下单和交付排期。
      counter_evidence_guidance: 订单取消、重复下单、渠道囤货或客户延迟拉货。
      evidence_profile_ref: demand_orders
      source_ref: 二级半导体领域本体规范/reasoning.yaml#order_visibility
      source_version: 1.0.0
      selection_reason: 区分可兑现需求和抢货。
      used_by_path_nodes: [N-02, N-06]
    - id: inventory_cycle_position
      name: 库存周期位置
      definition: 产业链处于补库、正常、积累、去库或短缺阶段的综合状态。
      allowed_anchor_types: [Industry, Segment, Company, Product]
      observation_guidance: 对齐供应商、渠道、客户和终端多层库存及业务时间。
      counter_evidence_guidance: 不同层级库存方向相反、渠道重复下单或终端需求与出货背离。
      evidence_profile_ref: inventory_cycle
      source_ref: 二级半导体领域本体规范/reasoning.yaml#inventory_cycle_position
      source_version: 1.0.0
      selection_reason: 判断短缺、补库和潜在累库。
      used_by_path_nodes: [N-02, N-06, N-07]
    - id: inventory_buffer_capacity
      name: 库存缓冲能力
      definition: 现有库存吸收供给中断或需求波动的能力及可持续时间。
      allowed_anchor_types: [Company, Product, Segment]
      observation_guidance: 结合可用库存、规格兼容性、在途库存和安全库存政策。
      counter_evidence_guidance: 账面库存规格不可用、消耗加快或数据只覆盖单一层级。
      evidence_profile_ref: inventory_cycle
      source_ref: 二级半导体领域本体规范/reasoning.yaml#inventory_buffer_capacity
      source_version: 1.0.0
      selection_reason: 检查库存是否足以缓冲供给冲击。
      used_by_path_nodes: [N-02, N-03, N-04]
    - id: supply_availability
      name: 供给可得性
      definition: 在目标时间和地域内获得合格产品、材料、设备或产能的难易程度。
      allowed_anchor_types: [Product, Segment, ManufacturingFacility]
      observation_guidance: 联合观察产能、良率、交期、分配、物流和替代供应。
      counter_evidence_guidance: 闲置产能、库存充足、替代供应可用或交期缩短。
      evidence_profile_ref: capacity_supply
      source_ref: 二级半导体领域本体规范/reasoning.yaml#supply_availability
      source_version: 1.0.0
      selection_reason: 判断三类产品的实际可交付供给。
      used_by_path_nodes: [N-03, N-05, N-07]
    - id: capacity_tightness
      name: 产能紧张度
      definition: 有效产能相对于可兑现需求的紧张程度。
      allowed_anchor_types: [ManufacturingFacility, Segment, Product]
      observation_guidance: 使用有效产能而非名义产能，并考虑良率、产品切换和维护停机。
      counter_evidence_guidance: 产线利用不足、可快速切换产能、良率改善或需求重复计算。
      evidence_profile_ref: capacity_supply
      source_ref: 二级半导体领域本体规范/reasoning.yaml#capacity_tightness
      source_version: 1.0.0
      selection_reason: 定位当前短缺和产能挤出。
      used_by_path_nodes: [N-03, N-04, N-07]
    - id: capacity_expansion_progress
      name: 产能扩张进展
      definition: 从投资、建设、设备搬入、认证到稳定量产的扩产推进程度。
      allowed_anchor_types: [ManufacturingFacility, Company, Segment]
      observation_guidance: 分阶段记录建设、设备安装、试产、良率爬坡和客户认证。
      counter_evidence_guidance: 项目延期、设备短缺、良率不足、认证失败或资本约束。
      evidence_profile_ref: capacity_supply
      source_ref: 二级半导体领域本体规范/reasoning.yaml#capacity_expansion_progress
      source_version: 1.0.0
      selection_reason: 决定供给正常化窗口。
      used_by_path_nodes: [N-05, N-07]
    - id: yield_maturity
      name: 良率成熟度
      definition: 工艺在目标规格和规模下稳定产出合格产品的成熟程度。
      allowed_anchor_types: [ManufacturingFacility, ProcessStep, Product]
      observation_guidance: 观察良率趋势、跨批次稳定性、量产和客户质量反馈。
      counter_evidence_guidance: 关键缺陷、跨厂复制失败、可靠性不达标或成本不可接受。
      evidence_profile_ref: manufacturing_yield
      source_ref: 二级半导体领域本体规范/reasoning.yaml#yield_maturity
      source_version: 1.0.0
      selection_reason: 防止把新厂建设直接等同于有效供给。
      used_by_path_nodes: [N-05, N-07]
    - id: supply_elasticity
      name: 供给响应弹性
      definition: 供给体系面对需求或价格变化时扩大、切换或恢复供给的能力。
      allowed_anchor_types: [Segment, Product]
      observation_guidance: 考虑建设周期、设备通用性、产品切换、良率、认证和替代供应。
      counter_evidence_guidance: 产能可快速切换、标准化程度高或替代供应成熟。
      evidence_profile_ref: capacity_supply
      source_ref: 二级半导体领域本体规范/reasoning.yaml#supply_elasticity
      source_version: 1.0.0
      selection_reason: 判断紧缺和价格压力可以持续多久。
      used_by_path_nodes: [N-05, N-07]
    - id: product_price_pressure
      name: 产品价格压力
      definition: 产品价格受到供需、竞争、结构和合同机制影响而上行或下行的压力。
      allowed_anchor_types: [Product, Segment, Company]
      observation_guidance: 区分挂牌价、合同价、成交价、实现价和产品组合。
      counter_evidence_guidance: 产品结构变化、折扣未兑现、合同锁价或汇率影响。
      evidence_profile_ref: pricing_economics
      source_ref: 二级半导体领域本体规范/reasoning.yaml#product_price_pressure
      source_version: 1.0.0
      selection_reason: 定位价格上行、斜率放缓和见顶。
      used_by_path_nodes: [N-04, N-07]
    - id: pricing_power
      name: 定价与成本传导能力
      definition: 在不显著损失需求或份额的情况下调整价格并传递成本的能力。
      allowed_anchor_types: [Company, Product, Segment]
      observation_guidance: 观察合同、替代难度、涨价兑现和份额变化。
      counter_evidence_guidance: 客户议价强、替代充足、涨价后需求或份额下降。
      evidence_profile_ref: pricing_economics
      source_ref: 二级半导体领域本体规范/reasoning.yaml#pricing_power
      source_version: 1.0.0
      selection_reason: 判断高价能否维持及是否触发需求破坏。
      used_by_path_nodes: [N-04, N-06, N-07]
  propagation_templates:
    - id: demand_to_orders
      name: 终端需求向订单传导
      description: 终端需求增强且采用或单位含量上升时，订单能见度通常改善。
      source_variables: [end_market_demand_strength]
      target_variables: [order_visibility]
      conditions: [需求来自真实使用而非渠道囤货, 产品已进入客户采购范围]
      evidence_requirements: [ER-01, ER-02]
      weaken_conditions: [客户库存偏高, 需求由短期项目驱动]
      block_conditions: [客户取消项目, 需求被替代路线满足]
      source_ref: 二级半导体领域本体规范/reasoning.yaml#demand_to_orders
      source_version: 1.0.0
      selection_reason: 验证 AI/服务器和消费需求向采购的传导。
      used_by_path_nodes: [N-01, N-02, N-06]
    - id: orders_to_capacity_pressure
      name: 订单向产能压力传导
      description: 高质量订单增长超过有效产能时，产能和未交付订单压力上升。
      source_variables: [order_visibility]
      target_variables: [capacity_tightness]
      conditions: [订单不可轻易取消, 有效产能包含良率和切换损失]
      evidence_requirements: [ER-02, ER-03]
      weaken_conditions: [客户重复下单, 库存可满足需求]
      block_conditions: [订单大规模取消, 存在大量闲置可切换产能]
      source_ref: 二级半导体领域本体规范/reasoning.yaml#orders_to_capacity_pressure
      source_version: 1.0.0
      selection_reason: 由订单质量确认产能紧张。
      used_by_path_nodes: [N-02, N-03]
    - id: inventory_restocking
      name: 补库存向订单上行传导
      description: 低库存叠加需求稳定时，补库会放大短期订单和产能压力。
      source_variables: [inventory_cycle_position, end_market_demand_strength]
      target_variables: [order_visibility, capacity_tightness]
      conditions: [库存低于运营安全水平, 需求未显著下修]
      evidence_requirements: [ER-01, ER-04]
      weaken_conditions: [补库仅发生在单一渠道, 终端需求仍弱]
      block_conditions: [产品即将被替代]
      source_ref: 二级半导体领域本体规范/reasoning.yaml#inventory_restocking
      source_version: 1.0.0
      selection_reason: 区分真实需求与补库放大。
      used_by_path_nodes: [N-02, N-03]
    - id: supply_constraint_to_price_delivery
      name: 供给约束向价格交期传导
      description: 供给可得性下降且库存不足时，交期和价格上行压力增强。
      source_variables: [supply_availability, capacity_tightness]
      target_variables: [product_price_pressure]
      conditions: [需求仍在, 替代供应有限, 库存不足]
      evidence_requirements: [ER-03, ER-04, ER-05]
      weaken_conditions: [合同锁价, 下游主动削减需求]
      block_conditions: [替代供应已认证, 库存足以覆盖冲击]
      source_ref: 二级半导体领域本体规范/reasoning.yaml#supply_constraint_to_price_delivery
      source_version: 1.0.0
      selection_reason: 将短缺映射到价格而非直接形成结论。
      used_by_path_nodes: [N-03, N-04]
    - id: inventory_buffer_absorption
      name: 库存对供应冲击的缓冲
      description: 可用库存越充足，供应冲击向交期和价格传导越弱、越滞后。
      source_variables: [inventory_buffer_capacity]
      target_variables: [product_price_pressure]
      conditions: [库存真实可用, 规格和质量满足生产]
      evidence_requirements: [ER-04]
      weaken_conditions: [库存集中在错误规格或地域]
      block_conditions: [库存不可用或冲击超过覆盖期]
      source_ref: 二级半导体领域本体规范/reasoning.yaml#inventory_buffer_absorption
      source_version: 1.0.0
      selection_reason: 约束价格传导强度。
      used_by_path_nodes: [N-02, N-04]
    - id: capacity_expansion_to_supply_relief
      name: 扩产向供给缓解传导
      description: 扩产完成、良率成熟并通过认证后，有效供给增加并缓解产能紧张。
      source_variables: [capacity_expansion_progress, yield_maturity]
      target_variables: [supply_availability, capacity_tightness]
      conditions: [设备工艺匹配, 良率稳定, 客户认证完成]
      evidence_requirements: [ER-06]
      weaken_conditions: [需求同步上修, 产品结构不匹配]
      block_conditions: [扩产延期, 良率失败, 认证未通过]
      source_ref: 二级半导体领域本体规范/reasoning.yaml#capacity_expansion_to_supply_relief
      source_version: 1.0.0
      selection_reason: 判断 2027—2028 新增名义产能是否成为有效供给。
      used_by_path_nodes: [N-05, N-07]
    - id: supply_elasticity_to_price_persistence
      name: 供给弹性向价格持续性传导
      description: 供给弹性低且产能紧张时，价格压力更可能持续。
      source_variables: [supply_elasticity, capacity_tightness]
      target_variables: [product_price_pressure]
      conditions: [需求仍在, 替代供应有限]
      evidence_requirements: [ER-03, ER-05, ER-06]
      weaken_conditions: [可快速切换产能, 库存缓冲充足]
      block_conditions: [替代供应已规模可用]
      source_ref: 二级半导体领域本体规范/reasoning.yaml#supply_elasticity_to_price_persistence
      source_version: 1.0.0
      selection_reason: 形成条件式周期持续时间。
      used_by_path_nodes: [N-05, N-07]
    - id: advanced_packaging_to_inputs
      name: 先进封装向基板设备测试传导
      description: 先进封装采用提升通常增加高端基板、互连、封装设备和复杂测试需求。
      source_variables: [technology_maturity, adoption_penetration]
      target_variables: [order_visibility, capacity_tightness]
      conditions: [路线进入量产, 封装价值量与复杂度提升]
      evidence_requirements: [ER-03, ER-06]
      weaken_conditions: [封装标准化降低单位投入, 良率快速改善]
      block_conditions: [热或可靠性问题阻止量产]
      source_ref: 二级半导体领域本体规范/reasoning.yaml#advanced_packaging_to_inputs
      source_version: 1.0.0
      selection_reason: 承接 HBM 先进封装瓶颈。
      used_by_path_nodes: [N-03, N-05]
  scenario_templates:
    - id: base
      name: 基准情景
      source_ref: 二级半导体领域本体规范/reasoning.yaml#scenario_templates.base
      used_by_path_nodes: [N-07]
    - id: upside
      name: 上行情景
      source_ref: 二级半导体领域本体规范/reasoning.yaml#scenario_templates.upside
      used_by_path_nodes: [N-07]
    - id: downside
      name: 下行情景
      source_ref: 二级半导体领域本体规范/reasoning.yaml#scenario_templates.downside
      used_by_path_nodes: [N-07]
  rules:
    - id: no_direct_evidence_to_judgment
      name: 证据不得直达判断
      description: 证据只能支撑允许的推理输入，不得直接支撑判断。
      rule_type: blocking
      applies_to: [evidenceGroundsReasoning]
      condition: 目标属于 Observation、Event、MarketExpectation 或 Signal。
      result: 允许创建支撑关系。
      priority: 100
      failure_handling: reject_grounding
      source_ref: 一级通用本体规范/reasoning.yaml#no_direct_evidence_to_judgment
      source_version: 1.0.0
      selection_reason: 防止来源直接证明周期结论。
      used_by_path_nodes: [N-01, N-02, N-03, N-04, N-05, N-06, N-07]
    - id: variable_propagation_inference
      name: 变量传导推理
      description: 源变量已有观测、条件满足且无阻断时形成目标变量影响候选。
      rule_type: inference
      applies_to: [StateVariable, Observation, variableInfluencesVariable]
      condition: 源变量变化已有观测，传导条件满足，且不存在有效阻断条件。
      result: 产生目标变量方向、滞后和影响候选。
      priority: 60
      failure_handling: no_propagation
      source_ref: 一级通用本体规范/reasoning.yaml#variable_propagation_inference
      source_version: 1.0.0
      selection_reason: 执行需求—订单—产能—价格—供给缓解的逐段验证。
      used_by_path_nodes: [N-02, N-03, N-04, N-07]
    - id: time_alignment
      name: 时间尺度对齐
      description: 比较对象的业务时间和时间尺度必须可比。
      rule_type: validation
      applies_to: [Observation, Hypothesis, Judgment]
      condition: 业务时间、截面和 timeHorizon 可比较。
      result: 允许比较或聚合。
      priority: 80
      failure_handling: split_or_stop_comparison
      source_ref: 一级通用本体规范/reasoning.yaml#time_alignment
      source_version: 1.0.0
      selection_reason: 统一财季、自然季度与 2027—2028 投产窗口。
      used_by_path_nodes: [N-01, N-02, N-03, N-04, N-05, N-06, N-07]
    - id: blocking_signal_precedence
      name: 阻断信号优先
      description: 有效阻断信号优先于支持或催化信号。
      rule_type: blocking
      applies_to: [Hypothesis, Judgment]
      condition: 存在未失效且适用当前时间尺度的 block 信号。
      result: 目标结论置为 blocked。
      priority: 100
      failure_handling: block_conclusion
      source_ref: 一级通用本体规范/reasoning.yaml#blocking_signal_precedence
      source_version: 1.0.0
      selection_reason: 需求崩塌、扩产提前或良率失败可阻断原路径。
      used_by_path_nodes: [N-06, N-07]
    - id: judgment_evidence_threshold
      name: 判断证据门槛
      description: 根据证据、竞争解释和反证确定判断等级。
      rule_type: scoring
      applies_to: [Judgment]
      condition: 输入链完整且已检查支持、削弱、阻断、竞争解释和未解决不确定性。
      result: 产生 conclusionLevel 和 confidence。
      priority: 70
      failure_handling: lower_level_and_confidence
      source_ref: 一级通用本体规范/reasoning.yaml#judgment_evidence_threshold
      source_version: 1.0.0
      selection_reason: 对当前阶段和结束窗口分别控制结论强度。
      used_by_path_nodes: [N-04, N-07]
    - id: reasoning_trace_required
      name: 推理链可追溯
      description: 输入、规则、关系和结论必须可追溯。
      rule_type: validation
      applies_to: [Judgment, ReasoningTrace]
      condition: 输入、公开步骤、Rule、Function、Logic 和输出引用完整。
      result: 允许进入正式输出。
      priority: 90
      failure_handling: keep_internal_candidate
      source_ref: 一级通用本体规范/reasoning.yaml#reasoning_trace_required
      source_version: 1.0.0
      selection_reason: 确保 04 结论回到 02 节点和 03 证据。
      used_by_path_nodes: [N-07]

evidence_view:
  evidence_caliber_constraints:
    - constraint_id: ECC-01
      domain: price
      statement: 价格证据必须区分合约价、现货价、原厂 ASP、第三方价格调查和实现价，不得直接混用。
      applies_to_requirement_ids: [ER-05]
    - constraint_id: ECC-02
      domain: demand
      statement: 需求证据必须区分终端出货、客户资本开支、订单锁量和提前采购。
      applies_to_requirement_ids: [ER-01, ER-02]
    - constraint_id: ECC-03
      domain: supply
      statement: 供给证据必须区分名义产能、晶圆投入、良率、认证通过和实际交付。
      applies_to_requirement_ids: [ER-03, ER-06]
    - constraint_id: ECC-04
      domain: inventory
      statement: 库存证据必须区分原厂库存、渠道库存和客户库存。
      applies_to_requirement_ids: [ER-04]
    - constraint_id: ECC-05
      domain: time
      statement: 所有证据必须保留业务时间，不得只记录发布日期。
      applies_to_requirement_ids: [ER-01, ER-02, ER-03, ER-04, ER-05, ER-06]
  evidence_degradation_rules:
    - rule_id: EDR-01
      condition: 某一产品线缺少价格、库存、有效供给或需求中的关键证据
      action: 不得输出强方向性结论；只能输出证据不足或带明确限定的倾向性判断
      cycle_stage_output: 证据不足
    - rule_id: EDR-02
      condition: 证据只覆盖 HBM、非 HBM DRAM、NAND 中的一部分产品
      action: 不得外推为整个存储芯片周期
    - rule_id: EDR-03
      condition: 价格证据与库存或供给证据方向冲突
      action: 优先降级为分化或待验证；不得直接判定周期结束
  evidence_requirements:
    - requirement_id: ER-01
      purpose: support
      required_information: AI/服务器及 PC/手机等终端的实际需求、部署、出货或明确展望。
      evidence_profile_refs: [demand_orders]
      acceptable_source_types: [company_filing, company_results, industry_statistics, industry_research]
      minimum_quality: 至少一条需求端证据，业务时间明确，并检查消费终端反向变化。
      caliber_constraints: [ECC-02, ECC-05]
      used_by_path_nodes: [N-01, N-06]
    - requirement_id: ER-02
      purpose: support
      required_information: 长协、订单覆盖、排产、出货或交付的连续记录及取消风险。
      evidence_profile_refs: [demand_orders]
      acceptable_source_types: [company_filing, company_results]
      minimum_quality: 至少一条订单或交付证据；说明约束性、期限与业务时间。
      caliber_constraints: [ECC-02, ECC-05]
      used_by_path_nodes: [N-02, N-06]
    - requirement_id: ER-03
      purpose: support
      required_information: 有效产能、利用率、交期、产品分配、封装瓶颈或替代供应。
      evidence_profile_refs: [capacity_supply]
      acceptable_source_types: [company_filing, company_results, industry_research]
      minimum_quality: 产能/设施与交期或分配至少各一项，并区分名义与有效供给。
      caliber_constraints: [ECC-03, ECC-05]
      used_by_path_nodes: [N-03, N-05]
    - requirement_id: ER-04
      purpose: support
      required_information: 原厂、渠道、OEM/客户至少两个层级的库存、覆盖期或消耗速度。
      evidence_profile_refs: [inventory_cycle]
      acceptable_source_types: [company_filing, company_results, industry_research]
      minimum_quality: 至少两个层级、时间序列和终端需求对照。
      caliber_constraints: [ECC-04, ECC-05]
      used_by_path_nodes: [N-02, N-03, N-04]
    - requirement_id: ER-05
      purpose: support
      required_information: 同规格合约、成交或实现价格的连续变化及下一季斜率指引。
      evidence_profile_refs: [pricing_economics]
      acceptable_source_types: [company_results, industry_price_survey]
      minimum_quality: 成交、合约或实现价格；至少两个连续时点；说明产品组合影响。
      caliber_constraints: [ECC-01, ECC-05]
      used_by_path_nodes: [N-04, N-07]
    - requirement_id: ER-06
      purpose: support
      required_information: 新增晶圆/封装产能的建设、设备、试产、良率、认证和量产时间表。
      evidence_profile_refs: [capacity_supply, manufacturing_yield]
      acceptable_source_types: [company_filing, company_results, company_release, industry_research]
      minimum_quality: 至少有设施与投产时间；有效供给结论还需良率或量产验证。
      caliber_constraints: [ECC-03, ECC-05]
      used_by_path_nodes: [N-05, N-07]
  evidence_profiles:
    - profile_id: demand_orders
      source_ref: 二级半导体领域本体规范/evidence.yaml#demand_orders
      source_version: 1.0.0
      selection_reason: 需求、订单和交付的核心 profile。
      used_by_requirement_ids: [ER-01, ER-02, CER-01]
    - profile_id: capacity_supply
      source_ref: 二级半导体领域本体规范/evidence.yaml#capacity_supply
      source_version: 1.0.0
      selection_reason: 有效产能、供给、替代和扩产时间。
      used_by_requirement_ids: [ER-03, ER-06, CER-02]
    - profile_id: manufacturing_yield
      source_ref: 二级半导体领域本体规范/evidence.yaml#manufacturing_yield
      source_version: 1.0.0
      selection_reason: 新增名义产能转化为有效供给的必要门槛。
      used_by_requirement_ids: [ER-06, CER-02]
    - profile_id: inventory_cycle
      source_ref: 二级半导体领域本体规范/evidence.yaml#inventory_cycle
      source_version: 1.0.0
      selection_reason: 多层库存、补库和缓冲判断。
      used_by_requirement_ids: [ER-04, CER-01]
    - profile_id: pricing_economics
      source_ref: 二级半导体领域本体规范/evidence.yaml#pricing_economics
      source_version: 1.0.0
      selection_reason: 合约/实现价格、定价权和需求破坏。
      used_by_requirement_ids: [ER-05, CER-03]
  quality_dimensions: [source_authority, traceability, independence, time_relevance, scope_match, statement_nature]
  counter_evidence_requirements:
    - requirement_id: CER-01
      condition: PC/手机出货、配置、采购或订单下降，客户/渠道库存上升，或存在提前采购和重复下单。
      effect: 削弱需求到订单及订单到产能压力路径，可能使通用产品提前见顶。
      evidence_profile_refs: [demand_orders, inventory_cycle]
      acceptable_source_types: [industry_statistics, industry_research, company_results]
      minimum_quality: 至少一条终端反向证据并说明产品和业务时间。
      used_by_path_nodes: [N-01, N-02, N-06, N-07]
    - requirement_id: CER-02
      condition: 新增产能、替代供应、良率或认证进度快于预期，或存在大量可切换闲置产能。
      effect: 削弱供给紧张和价格持续性，提前供需正常化窗口。
      evidence_profile_refs: [capacity_supply, manufacturing_yield]
      acceptable_source_types: [company_filing, company_release, industry_research]
      minimum_quality: 不能只有扩产公告；需量产、良率或认证证据。
      used_by_path_nodes: [N-03, N-05, N-07]
    - requirement_id: CER-03
      condition: HBM 年度合同、产品组合或多供竞争导致价格与全行业紧张度不同步。
      effect: 限制由单一 ASP 或 HBM 价格外推全行业周期。
      evidence_profile_refs: [pricing_economics]
      acceptable_source_types: [industry_price_survey, company_results]
      minimum_quality: 明确产品代际、合同周期和同口径比较。
      used_by_path_nodes: [N-04, N-07]
  conflict_and_gap_rules:
    - 高质量支持与反证并存时保留 contested，不按来源数量表决。
    - 缺少多层库存或良率认证时只能给条件式窗口，置信度不高于 medium。
    - 预测、管理层展望和实际经营观测分开记录。
    - 关键证据不满足时对应产品线只能输出证据不足或倾向性判断，见 evidence_degradation_rules。
    - 部分产品覆盖时不得外推全行业周期；价格与库存/供给冲突时降级为分化或待验证。

candidate_paths:
  - path_id: P-01
    name: 当前周期位置判断
    purpose: 分产品验证需求、订单库存、有效供给和价格共同指向的周期阶段。
    logic_unit_refs: [LU-01, LU-02]
    framework_basis_refs: [IF-MEM-01, IF-SC-01, BF-SD-01, BF-PC-01]
    start_node: N-01
    target_node: N-04
    nodes:
      - node_id: N-01
        question: AI/服务器和消费终端需求分别处于什么状态？
        ontology_refs:
          object_types: [Product, Application, Industry]
          relation_types: [productUsedInApplication]
          event_types: [demand_forecast_change]
          state_variables: [end_market_demand_strength]
          propagation_templates: [demand_to_orders]
          rules: [no_direct_evidence_to_judgment, time_alignment]
        required_instances: [IR-O-01, IR-O-02, IR-R-02, IR-E-01, IR-OBS-01, IR-OBS-08, IR-OBS-09]
        evidence_requirements: [ER-01, CER-01]
        counter_conditions: [消费终端出货和配置显著下降, AI 需求仅为预测而无部署]
        depends_on: []
