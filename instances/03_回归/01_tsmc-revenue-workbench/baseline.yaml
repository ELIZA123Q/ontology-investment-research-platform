  document_markdown: |-
    # 台积电2024年营收同比增速分析报告

    **分析日期**：截至2025年1月16日
    **证据来源**：TSMC向美国SEC提交的两份6-K申报文件（EDGAR系统）
    **分析问题**：台积电2024年全年营收是否同比增长？Q4营收同比增速是否高于全年增速？

    ---

    ## 一、核心结论

    | 判断维度 | 结论 | 证据 |
    |----------|------|------|
    | 2024年全年营收是否同比增长？ | **是**，同比增长33.9% | SRC-CONTROLLED-01 |
    | Q4同比增速是否高于全年增速？ | **是**，38.8% > 33.9%，高出4.9个百分点 | SRC-CONTROLLED-01 + SRC-CONTROLLED-02 |

    ---

    ## 二、证据详述

    ### 2.1 全年营收（SRC-CONTROLLED-01）

    - **来源**：TSMC 2024年12月营收报告（Form 6-K），2025年1月10日提交SEC
    - **原文引用**：
      > "Revenue for January through December 2024 totaled NT$2,894.31 billion, an increase of 33.9 percent compared to the same period in 2023."
    - **数据**：全年营收 NT$28,943.1亿，同比增长33.9%
    - **来源层级**：S1（TSMC官方SEC申报，属最高可信度层级）

    ### 2.2 第四季度营收（SRC-CONTROLLED-02）

    - **来源**：TSMC 2024年第四季度财报新闻稿（Form 6-K exhibit），2025年1月16日提交SEC
    - **原文引用**：
      > "Year-over-year, fourth quarter revenue increased 38.8% while net income and diluted EPS both increased 57.0%."
    - **数据**：Q4营收同比增长38.8%
    - **来源层级**：S1

    ### 2.3 增速比较（C-03，由C-01与C-02推导）

    - Q4同比增速 38.8% 显著高于全年同比增速 33.9%
    - 差值：+4.9个百分点
    - 含义：2024年下半年营收增速快于上半年，呈加速态势

    ---

    ## 三、反证与注意事项

    1. **发行人自我报告风险**：两份证据均为TSMC自行向SEC提交的6-K申报，未经独立第三方审计核对。2024年完整年报（20-F）预计于2025年4月提交，届时可能存在追溯调整。

    2. **汇率因素未剥离**：营收以新台币（NT$）计价。2024年间新台币兑美元存在波动，若以美元或其他币种衡量，增速可能与本报告数字存在差异。

    3. **数据交叉验证受限**：12月营收报告（2025-01-10发布）不含季度拆分，Q4增速38.8%仅见于1月16日的完整财报新闻稿。两份文件发布时间间隔6天，无法用前者独立验证后者。但两份文件均由同一发行人（TSMC）在同一报告周期内发布，数据应具有内部一致性。

    ---

    ## 四、证据局限与边界

    | 局限类型 | 说明 |
    |----------|------|
    | 来源数量 | 仅2份SEC申报，未纳入法人说明会、分析师报告、行业数据等外部验证 |
    | 审计状态 | 6-K为未经审计的临时报告，20-F年度审计报告尚未发布 |
    | 增速构成 | 无法分解为量（出货晶圆数）×价（ASP）贡献，亦无制程节点（3nm/5nm/7nm等）拆分 |
    | 时间边界 | 截止2025-01-16（Q4财报日），不覆盖后续重述、更正或新信息 |
    | 比较基准 | 增速为名义YoY对比，未做日历效应（如闰年、工作日数）调整 |

    ---

    ## 五、方向判断总结

    **问**：台积电2024年全年营收是否同比增长？
    **答**：是，增长33.9%。证据来源：TSMC 12月营收6-K（SRC-CONTROLLED-01），S1层级，可直接复核。

    **问**：Q4营收同比增速是否高于全年增速？
    **答**：是，Q4增速38.8%高于全年33.9%，高出4.9个百分点。证据来源：Q4财报6-K（SRC-CONTROLLED-02）与12月营收6-K（SRC-CONTROLLED-01）的比较，两项均为S1层级。

    **证据上限**：判断严格限于两份SEC 6-K申报文件提供的合并营收名义同比增速。超出此范围——包括但不仅限于：各季度绝对金额、分业务/分地区营收、毛利率/净利率趋势、2025年业绩指引——均不在本分析证据覆盖范围内。
