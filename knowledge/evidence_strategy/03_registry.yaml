registry_type: evidence_method_registry
schema_version: 3.2.0
updated_at: 2026-07-23

# 本文件是方法说明与任务编排索引，不是业务参数权威。
# 角色枚举、完备度↔Q、篮子角色对照一律回指跨阶段门槛合同；正式本体只保留证据约束语义。
ontology_authority_refs:
  basket_roles: governance/02_合同/judgment_threshold_policy.yaml#operational_basket_roles
  quality_language_to_evidence_grades: governance/02_合同/judgment_threshold_policy.yaml#quality_language_to_evidence_grades
  evidence_method_role_to_basket_role: governance/02_合同/judgment_threshold_policy.yaml#evidence_method_role_to_basket_role
  evidence_recipes: ontology/02_领域/semiconductor/business_instances.yaml#business_instance_graph.objects.@type=EvidenceRecipe
  source_profiles: ontology/02_领域/semiconductor/business_instances.yaml#business_instance_graph.objects.@type=SourceProfile
  proxy_indicators: ontology/02_领域/semiconductor/business_instances.yaml#business_instance_graph.objects.@type=ProxyIndicator

# 方法层机器路由表：把 EvidenceProfile / JudgmentType / EvidenceRole
# 编译成可执行的来源顺序、检索域名、查询词和核验方式。
# 来源生产者与查询参数会变化，因此不进入正式本体。
source_route_registry_ref: methods/03_取证/source_routes.yaml

# 所有证据必须先通过的共同有效性条件；不是可收集的证据角色。
validity_preconditions:
  - id: traceable
    label: 可追溯
  - id: permission_ok
    label: 权限合法
  - id: object_match
    label: 对象匹配
  - id: business_time_match
    label: 业务时间匹配
  - id: definition_unit_match
    label: 定义与单位匹配
  - id: version_clear
    label: 版本明确

# 方法侧五类角色（说明用）。机器权威映射见 ontology_authority_refs.evidence_method_role_to_basket_role。
evidence_roles:
  primary:
    label: 主证据
    question: 是否直接回答当前问题
    basket_role_ref: primary_support
  baseline:
    label: 比较基准
    question: 相对前期、历史、同业或正常区间处于哪里
    basket_role_ref: background_evidence
  mechanism:
    label: 机制或承接
    question: 变化怎样传导、由谁承接、哪里可能阻断
    basket_role_ref: cross_validation
  cross_check:
    label: 独立交叉验证
    question: 不同生产链的材料是否给出相容结果
    basket_role_ref: cross_validation
  counter:
    label: 反证与限制
    question: 哪些反向、阻断候选或竞争解释材料需要移交 04
    basket_role_ref: counter_evidence

# 研究员完备度用语（说明用）。机器 Q 档映射权威在跨阶段门槛合同，此处仅投影。
quality_language:
  sufficient:
    label: 充分
    maximum_use: 明确判断（含明确支持与明确否定）
    machine_evidence_grades_ref: governance/02_合同/judgment_threshold_policy.yaml#quality_language_to_evidence_grades.sufficient
  limited:
    label: 受限
    maximum_use: 有条件判断
    machine_evidence_grades_ref: governance/02_合同/judgment_threshold_policy.yaml#quality_language_to_evidence_grades.limited
  observation:
    label: 观察
    maximum_use: 方向观察
    machine_evidence_grades_ref: governance/02_合同/judgment_threshold_policy.yaml#quality_language_to_evidence_grades.observation
  unusable:
    label: 不可用
    maximum_use: 暂不可判断
    machine_evidence_grades_ref: governance/02_合同/judgment_threshold_policy.yaml#quality_language_to_evidence_grades.unusable

# 04 命题支持状态对照（03 不填写）
proposition_support_states_owned_by_04:
  - support
  - partial_support
  - weaken
  - contested
  - block
  - overturn
  - pending

judgment_types:
  state_measurement:
    method: A02
    required_roles: [primary, baseline, counter]
    optional_roles: [cross_check]
    formal_a08: false
    auto_add: []
    max_completeness_without_direct_data: observation
    evidence_recipe_ref: recipe_state_measurement
  trend_direction:
    method: A03
    required_roles: [primary, baseline, cross_check, counter]
    optional_roles: []
    formal_a08: true
    auto_add: []
    requires_methods: [A02]
    max_completeness_without_direct_data: observation
    evidence_recipe_ref: recipe_trend_direction
  cycle_phase:
    method: A03
    required_roles: [primary, baseline, cross_check, counter]
    optional_roles: [mechanism]
    formal_a08: true
    auto_add: []
    requires_methods: [A02]
    max_completeness_without_direct_data: observation
    evidence_recipe_ref: recipe_cycle_phase
  mechanism_validation:
    method: A04
    required_roles: [primary, mechanism, cross_check, counter]
    optional_roles: [baseline]
    formal_a08: true
    auto_add: [A01]
    max_completeness_without_direct_data: observation
    evidence_recipe_ref: recipe_mechanism_validation
  causal_attribution:
    method: A04
    required_roles: [primary, mechanism, cross_check, counter]
    optional_roles: [baseline]
    formal_a08: true
    auto_add: [A01]
    max_completeness_without_direct_data: observation
    evidence_recipe_ref: recipe_causal_attribution
  transmission_path:
    method: A04
    required_roles: [primary, mechanism, counter]
    optional_roles: [cross_check]
    formal_a08: true
    auto_add: [A01]
    max_completeness_without_direct_data: observation
    evidence_recipe_ref: recipe_transmission_path
  object_differentiation:
    method: A05
    required_roles: [primary, baseline, mechanism, counter]
    optional_roles: [cross_check]
    formal_a08: true
    auto_add: []
    forbidden_without: [unified_comparison_scope]
    max_completeness_without_direct_data: observation
    evidence_recipe_ref: recipe_object_differentiation
  impact_realization:
    method: A06
    required_roles: [primary, mechanism, baseline, counter]
    optional_roles: [cross_check]
    formal_a08: true
    auto_add: []
    forbidden_without: [financial_baseline, critical_financial_bridge]
    max_completeness_without_direct_data: observation
    evidence_recipe_ref: recipe_impact_realization
  expectation_gap:
    method: A07
    required_roles: [primary, baseline, cross_check, counter]
    optional_roles: []
    formal_a08: true
    auto_add: []
    forbidden_without: [pre_event_consensus_vintage]
    max_completeness_without_direct_data: observation
    evidence_recipe_ref: recipe_expectation_gap
  valuation_impact:
    method: A07
    required_roles: [primary, baseline, cross_check, counter]
    optional_roles: [mechanism]
    formal_a08: true
    auto_add: []
    forbidden_without: [valuation_baseline]
    max_completeness_without_direct_data: observation
    evidence_recipe_ref: recipe_valuation_impact

methods:
  A01:
    name: 事实状态取证
    file: A01_事实确认.md
    mode: auxiliary
    required_roles: [primary, counter]
    use_when: 关键事实、政策、项目、交易、认证或关系需要状态材料
    counter_mode: lightweight
    contract:
      applicability: 关键事实、政策、项目、交易、认证或关系需要状态确认
      preconditions: [target_fact_defined, source_scope_defined]
      inputs: [judgment_unit, evidence_requirement, source_scope]
      outputs: [fact_evidence_bundle, fact_status, evidence_gap]
      not_applicable_when: [target_fact_undefined]
      degrade_policy: 无权威原始来源时标记间接或暂不可确认
      alternatives: [kb03:A08, kb03:A09]
      counter_examples: [secondary_summary_as_primary_fact]
  A02:
    name: 状态测量取证
    file: A02_状态变量测量.md
    mode: primary
    required_roles: [primary, baseline, counter]
    counter_mode: lightweight
    contract:
      applicability: 状态变量需要同口径观测和基准比较
      preconditions: [state_variable_defined, observation_basis_defined]
      inputs: [judgment_unit, evidence_requirement, state_variable, baseline_scope]
      outputs: [state_measurement_bundle, comparable_baseline, evidence_gap]
      not_applicable_when: [state_variable_undefined, observation_basis_undefined]
      degrade_policy: 无直接观测或同口径基准时最高为观察
      alternatives: [kb03:A01, kb03:A09]
      counter_examples: [mixed_units_as_state_measurement]
  A03:
    name: 趋势与阶段证据准备
    file: A03_趋势与阶段判断.md
    mode: primary
    required_roles: [primary, baseline, cross_check, counter]
    requires_methods: [A02]
    counter_mode: formal_a08
    contract:
      applicability: 趋势方向或周期阶段需要多期可比证据
      preconditions: [kb03:A02_completed, comparable_time_series_available]
      inputs: [judgment_unit, state_measurements, time_window, counterevidence_requirement]
      outputs: [trend_evidence_bundle, stage_evidence_bundle, turning_point_candidates]
      not_applicable_when: [state_measurement_missing, comparable_series_missing]
      degrade_policy: 序列不足或交叉验证缺失时最高为观察
      alternatives: [kb03:A02, kb03:A08, kb03:A09]
      counter_examples: [two_noncomparable_points_as_trend]
  A04:
    name: 路径分段取证
    file: A04_机制传导验证.md
    mode: primary
    required_roles: [primary, mechanism, counter]
    auto_add_when:
      - when: start_fact_unconfirmed
        add: [A01]
    follow_on_methods:
      - when: target_involves_revenue_profit_or_cash
        add: [A06]
    counter_mode: formal_a08
    contract:
      applicability: 机制、因果或传导问题需要逐段验证路径
      preconditions: [start_fact_identified, path_nodes_defined]
      inputs: [judgment_unit, path_definition, segment_evidence_requirements]
      outputs: [segment_evidence_bundle, blocker_candidates, endpoint_evidence]
      not_applicable_when: [path_nodes_undefined]
      degrade_policy: 起点未确认先调用 A01；某段缺证据则停止向终点外推
      alternatives: [kb03:A01, kb03:A06, kb03:A08, kb03:A09]
      counter_examples: [endpoint_correlation_as_complete_path]
  A05:
    name: 可比性与暴露证据准备
    file: A05_对象分化比较.md
    mode: primary
    required_roles: [primary, baseline, mechanism, counter]
    forbidden_without: [unified_comparison_scope]
    follow_on_methods:
      - when: target_involves_revenue_profit_or_cash
        add: [A06]
    counter_mode: formal_a08
    contract:
      applicability: 对象分化需要统一口径、暴露和承接证据
      preconditions: [unified_comparison_scope]
      inputs: [judgment_unit, comparison_scope, object_exposure_requirements]
      outputs: [comparable_object_bundle, exposure_matrix, comparison_gaps]
      not_applicable_when: [comparison_scope_not_unified]
      degrade_policy: 部分可比时只保留分组比较，不形成精确排序
      alternatives: [kb03:A04, kb03:A06, kb03:A08]
      counter_examples: [different_geographies_as_direct_ranking]
  A06:
    name: 财务桥输入与测算证据
    file: A06_财务影响测算.md
    mode: auxiliary
    required_roles: [primary, mechanism, baseline, counter]
    use_when: 目标涉及收入、利润、现金流或资产负债表
    forbidden_without: [financial_baseline, critical_financial_bridge]
    counter_mode: formal_a08
    contract:
      applicability: 目标涉及收入、利润、现金流或资产负债表影响
      preconditions: [financial_baseline, critical_financial_bridge]
      inputs: [judgment_unit, financial_baseline, impact_bridge, evidence_requirements]
      outputs: [financial_bridge_inputs, sensitivity_evidence, financial_gaps]
      not_applicable_when: [financial_baseline_missing, critical_bridge_missing]
      degrade_policy: 基准或桥接缺失时只提供方向材料，不提供精确测算输入
      alternatives: [kb03:A04, kb03:A05, kb03:A08]
      counter_examples: [industry_growth_as_company_revenue]
  A07:
    name: 事前预期与定价证据准备
    file: A07_市场预期与定价.md
    mode: primary
    required_roles: [primary, baseline, cross_check, counter]
    forbidden_without: [pre_event_consensus_vintage]
    counter_mode: formal_a08
    contract:
      applicability: 预期差或估值影响需要事前预期和定价基准
      preconditions: [pre_event_consensus_vintage]
      inputs: [judgment_unit, prior_expectation_scope, new_information_scope, pricing_scope]
      outputs: [expectation_vintage_bundle, revision_evidence, pricing_evidence]
      not_applicable_when: [pre_event_consensus_vintage_missing]
      degrade_policy: 无事前 vintage 时最高为观察或不可用
      alternatives: [kb03:A06, kb03:A08, kb03:A09]
      counter_examples: [post_event_consensus_as_prior_expectation]
  A08:
    name: 反向证据扫描
    file: A08_反证与竞争解释.md
    mode: add_on
    required_roles: [counter]
    use_when: A03—A07 及正式财务/比较命题；A01/A02 仅轻量反向检查
    counter_mode: self
    contract:
      applicability: 正式判断需要反证、阻断因素和竞争解释材料
      preconditions: [target_hypothesis_or_path_defined]
      inputs: [judgment_unit, target_hypothesis, competing_explanation_scope]
      outputs: [counterevidence_bundle, blocker_evidence, discrimination_gaps]
      not_applicable_when: [target_hypothesis_and_path_both_undefined]
      degrade_policy: 反向来源受限时必须披露扫描范围和未覆盖项
      alternatives: [kb03:A01, kb03:A09]
      counter_examples: [absence_of_support_as_counterevidence]
  A09:
    name: 代理指标校准
    file: A09_代理指标.md
    mode: add_on
    required_roles: [cross_check, counter]
    use_when: 直接数据不可得、明显滞后、权限受限或结构上不可观测
    max_completeness_as_core_substitute: limited
    counter_mode: lightweight
    contract:
      applicability: 直接数据不可得、滞后、权限受限或结构上不可观测
      preconditions: [target_variable_defined, proxy_relation_explained]
      inputs: [judgment_unit, target_variable, proxy_candidate, calibration_scope]
      outputs: [proxy_evidence_bundle, calibration_result, proxy_limitations]
      not_applicable_when: [proxy_relation_unexplained, calibration_scope_missing]
      degrade_policy: 作为核心替代时完备度不得达到充分
      alternatives: [kb03:A01, kb03:A02, kb03:A08]
      counter_examples: [uncalibrated_proxy_as_direct_measurement]

dependency_rules:
  A03_requires_A02: 没有合格 A02 测量，不得调用 A03
  A04_auto_A01: 起点事实未确认时，自动增加 A01
  A05_requires_unified_scope: 比较变量未统一口径时，不得形成排序证据包
  A06_auto_on_financials: 目标涉及收入、利润、现金流时自动调用 A06
  A07_requires_vintage: 没有事前共识 vintage 时不得形成预期差证据包，完备度最高观察或不可用
  A09_no_sufficient_as_core: A09 作为核心替代时不得达到充分

source_guides:
  principles: B00_来源选择与使用边界.md
  general: B01_通用来源速查.md
  semiconductor: B02_半导体来源速查.md
