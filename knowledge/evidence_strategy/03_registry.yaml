runtime_compatibility:
  legacy_snapshot_fields:
    library_recipe_id: 从 3.1 起填写 kb03:A01—kb03:A09 命名空间方法 ID
    library_basket_ids: 填写 primary|baseline|mechanism|cross_check|counter；历史快照中的 scope 视为有效性检查已做，不再当作可收集角色
  rule: Q0—Q4 仅用于既有运行产物与统一状态派生，不在研究员任务卡中显示或填写
