document_type: cross_domain_runtime_instance_manifest
schema_version: 3.0.0

# 产出文件名惯例：03-<主题>语义域与证据域实例清单-<日期>-<序号>.yaml
# 尽管文件名侧重语义/证据，included_domains 另含 reasoning_input（冻结输入）；
# 完整推理裁决实例在 04 推理审计的 business_instance_graph，不在本清单。

metadata:
  task_id: ""
  execution_id: ""
  source_02_view_ref: "02-<核心主题>本体视图-<YYYYMMDD>-<当日序号>.yaml"
  source_02_view_version: 1
  source_02_view_hash: ""
  snapshot_ref: "03-<核心主题>数据与证据快照-<YYYYMMDD>-<当日序号>/manifest.csv"
  frozen_at: ""

ontology_versions:
  platform:
    meta_schema: 1.0.0
    ontology: 3.0.0
  domain:
    name: "<领域本体名称>"
    version: 3.0.0

manifest_role:
  stage: "03"
  included_domains: [semantic, evidence, reasoning_input]
  instance_only: true
  formal_ontology_mutated: false

domain_instances:
  semantic_domain:
    role: runtime_instances
    object_types: [Industry, PolicyInstrument, Company]
    files:
      objects: "<快照目录>/02_assets/semantic_instances.csv"
      relations: "<快照目录>/02_assets/semantic_relations.csv"
  evidence_domain:
    role: runtime_instances
    object_types: [SourceDocument, EvidenceClaim, EvidenceFact, EvidenceAssessment]
    files:
      source_documents: "<快照目录>/02_assets/source_documents.csv"
      claims: "<快照目录>/02_assets/evidence_claims.csv"
      facts: "<快照目录>/02_assets/evidence_facts.csv"
      relations: "<快照目录>/02_assets/evidence_relations.csv"
      assessments: "<快照目录>/02_assets/evidence_assessments.csv"
  reasoning_domain:
    role: frozen_inputs_only
    object_types: [Observation, Event, MarketExpectation]
    files:
      inputs: "<快照目录>/02_assets/reasoning_inputs.csv"

operational_files:
  source_retrievals: "<快照目录>/02_assets/source_snapshot.csv"
  evidence_records: "<快照目录>/02_assets/evidence_records.csv"

cross_domain_constraints:
  source_claim_fact_chain_complete: false
  assessment_targets_resolvable: false
  semantic_instances_runtime_only: true
  reasoning_inputs_frozen: false
  no_rule_evaluation_instances: true
  no_judgment_instances: true

candidate_feedback_ref: null

method_applications:
  # 必须完整复制 02 的全部 MA；裁决候选尚未进入执行时保持 candidate，不能省略。
  - application_id: MA-01
    method_id: kb03:A01
    method_version: 3.2.0
    capability_type: evidence
    target_question_refs: [Q-01]
    target_judgment_unit_refs: [JU-01]
    target_ontology_object_refs: []
    status: selected
    precondition_checks:
      - precondition_id: source_scope_available
        result: pass
        evidence_refs: [EV-01]
        reason: ""
    input_evidence_refs: [EV-01]
    output_signal_refs: []
    output_judgment_refs: []
    execution_summary: ""
    applicability_boundary: "<继承 02，不得改写>"
    limitations: []
    counter_example_refs: []
    provenance:
      stage: stage_03
      source_application_id: MA-01
      actor: "<取证执行人或 agent>"
      recorded_at: "<ISO 8601>"
    alternatives: []

validation:
  result: "<pass | fail>"
  checked_at: ""
  issues: []

# 正式语义/证据/观测实例权威源；下列 CSV 仅为只读投影。
business_instance_graph:
  schema_name: ontology_business_instance_graph
  schema_version: 1.0.0
  authority: business_parameters
  objects: []
  relations: []
  projection_fingerprints: {}
