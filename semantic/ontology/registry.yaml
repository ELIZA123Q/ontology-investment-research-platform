schema_name: semantic_ontology_registry
schema_version: 1.1.0
status: active

authority:
  answers: 正式本体机器权威过渡期仍在 ontology/；本 registry 是 Semantic/ontology 归属索引与新增登记入口。
  write_entry: semantic/ontology/
  read_primary: ontology/
  compat_read:
    - ontology/

source_of_truth: ontology

model_registry: ontology/01_通用/model_registry.yaml
meta_schema: ontology/01_通用/meta_schema.yaml
core_models:
  - ontology/01_通用/models/semantic.yaml
  - ontology/01_通用/models/state_event.yaml
  - ontology/01_通用/models/evidence.yaml
  - ontology/01_通用/models/judgment.yaml
  - ontology/01_通用/models/scenario.yaml

domain_extensions:
  - ontology/02_领域/semiconductor

notes:
  - 不重写 ontology/*.yaml 业务语义；本轮只做路径归属。
  - 新增模型登记先写入本 registry，再落入 ontology 物理文件。
