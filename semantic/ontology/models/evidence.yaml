schema_name: investment_research_evidence_model
schema_version: 3.0.0
meta_schema_version: 1.0.0
status: active
namespace: core.evidence
model: evidence
description: 来源、陈述、事实、要求、评估与证据篮子的可追溯模型。
object_types:
  SourceDocument: &source_type
    metadata: {id: SourceDocument, namespace: core.evidence, label_zh: 来源文档, label_en: Source Document, aliases: [来源], definition: 可定位、可版本化并具有发布主体的原始材料。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [公司公告], counter_examples: [分析师判断]}
    primary_key: id
    title_property: title
    attributes:
      title: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 标题。}
      uri: {type: uri, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 地址或内部定位。}
      published_at: {type: datetime, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, time_basis: publication_time, description: 发布时间。}
      source_tier: {type: enum, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, allowed_values: [S1, S2, S3, S4, S5, S6, S7, S8], description: 与现有取证策略库一致的来源等级；来源角色和权威类型另行记录，不与等级混用。}
    constraints: &standard_constraints {unique: [], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  EvidenceClaim:
    metadata: {id: EvidenceClaim, namespace: core.evidence, label_zh: 原始陈述, label_en: Evidence Claim, aliases: [材料主张], definition: 从来源中按原意提取且可精确定位的原子陈述。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [公告称产能增加20%], counter_examples: [因此行业上行]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, description: 原始陈述。}
      locator: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 页码、段落、表格或时间戳。}
      extracted_at: {type: datetime, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, time_basis: observation_time, description: 陈述被提取并可用于研究的时间。}
      cutoff_at: {type: datetime, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, time_basis: research_cutoff, description: 本次研究截止时间。}
    constraints: *standard_constraints
  EvidenceFact:
    metadata: {id: EvidenceFact, namespace: core.evidence, label_zh: 证据事实, label_en: Evidence Fact, aliases: [归一事实], definition: 由原始陈述归一对齐后形成且不包含分析推断的事实。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [同口径库存同比下降10%], counter_examples: [库存下降意味着周期反转]}
    primary_key: id
    title_property: statement
    attributes:
      statement: {type: string, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, description: 归一事实。}
      subject_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, reference_target: core_object, description: 事实主体。}
      time_basis: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 时间口径。}
      scope_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, reference_target: ResearchScope, description: 适用范围。}
      observed_at: {type: datetime, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, time_basis: observation_time, description: 事实所描述对象被观察的时间。}
      valid_from: {type: datetime, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, time_basis: effective_time, description: 事实开始适用的有效时间。}
      valid_to: {type: datetime, required: false, cardinality: '0..1', value_role: fact, nullable_semantics: null 表示仍有效或失效时间未知。, time_basis: effective_time, description: 事实停止适用的有效时间。}
      published_at: {type: datetime, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, time_basis: publication_time, description: 支撑该事实的最早可获得发布时间。}
      cutoff_at: {type: datetime, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, time_basis: research_cutoff, description: 本次研究截止时间。}
    constraints: *standard_constraints
  EvidenceRequirement:
    metadata: {id: EvidenceRequirement, namespace: core.evidence, label_zh: 证据要求, label_en: Evidence Requirement, aliases: [ER], definition: 判断单元在主体、时间、范围、来源和证据角色上的最低输入合同。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [需要两条独立产能证据], counter_examples: [搜索更多资料]}
    primary_key: id
    title_property: requirement
    attributes:
      requirement: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 可执行要求。}
      evidence_role: {type: enum, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, allowed_values: [support, counter, context, boundary], description: 证据角色。}
      minimum_independent_sources: {type: integer, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 最低独立来源数。}
      evidence_profile_refs: {type: array, required: false, cardinality: '0..*', value_role: metadata, nullable_semantics: 空列表表示任务变量未绑定领域 EvidenceProfile，必须由 no_profile_reason 解释。, description: 受治理的领域证据画像 ID；只描述最低材料组合，不包含厂商、URL 或查询参数。}
      evidence_recipe_ref: {type: string, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示尚未匹配领域取证配方。, description: 与判断类型对齐的受治理 EvidenceRecipe ID。}
      derivation_refs: {type: object, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示旧产物尚无机器推导血缘。, description: 由判断单元、状态变量和传播路径推导本要求的稳定引用。}
      no_profile_reason: {type: string, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示已绑定 EvidenceProfile 或尚未完成校验。, description: task_local 或无正式状态变量时允许缺少画像的显式原因。}
    constraints: *standard_constraints
  EvidenceAssessment:
    metadata: {id: EvidenceAssessment, namespace: core.evidence, label_zh: 证据评估, label_en: Evidence Assessment, aliases: [可用性评估], definition: 证据在特定任务、范围和判断单元下的可靠性、相关性、时效性与可用性评估。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [公告为直接高可靠证据], counter_examples: [该来源永远可靠]}
    primary_key: id
    title_property: assessment
    attributes:
      assessment: {type: enum, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, allowed_values: [usable, usable_with_caveat, contested, unusable], description: 使用结论。}
      directness: {type: enum, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, allowed_values: [direct, indirect, proxy], description: 直接性。}
      limitations: {type: array, required: false, cardinality: '0..*', value_role: metadata, nullable_semantics: 空列表表示未识别额外限制。, description: 局限。}
    constraints: *standard_constraints
  EvidenceBasket:
    metadata: {id: EvidenceBasket, namespace: core.evidence, label_zh: 证据篮子, label_en: Evidence Basket, aliases: [证据组合], definition: 为单一判断单元与单一证据角色组织的具体证据集合。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [JU-01支持证据篮子], counter_examples: [全项目所有证据]}
    primary_key: id
    title_property: label
    attributes:
      label: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 篮子标签。}
      role: {type: enum, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, allowed_values: [support, counter, context, boundary], description: 篮子角色。}
    constraints: *standard_constraints
relation_types:
  claimCitesSource: {metadata: {id: claimCitesSource, namespace: core.evidence, label_zh: 陈述引用来源, label_en: claim cites source, aliases: [], definition: 原始陈述的来源关系。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [陈述引用公告], counter_examples: [判断引用证据篮子]}, source_types: [EvidenceClaim], target_types: [SourceDocument], source_cardinality: '1..1', target_cardinality: '0..*', direction: directed, inverse_of: sourceHasClaim, symmetric: false, transitive: false, evidence_required: false, temporal: false, attributes: {}, invalidation_policy: block_delete}
  sourceHasClaim: {metadata: {id: sourceHasClaim, namespace: core.evidence, label_zh: 来源具有陈述, label_en: source has claim, aliases: [], definition: claimCitesSource 的逆关系。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [公告具有陈述], counter_examples: [事实支持信号]}, source_types: [SourceDocument], target_types: [EvidenceClaim], source_cardinality: '0..*', target_cardinality: '1..1', direction: directed, inverse_of: claimCitesSource, symmetric: false, transitive: false, evidence_required: false, temporal: false, attributes: {}, invalidation_policy: block_delete}
  factDerivedFromClaim: {metadata: {id: factDerivedFromClaim, namespace: core.evidence, label_zh: 事实源自陈述, label_en: fact derived from claim, aliases: [], definition: 归一事实所依据的原始陈述。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [库存事实源自公告], counter_examples: [判断源自方法]}, source_types: [EvidenceFact], target_types: [EvidenceClaim], source_cardinality: '1..*', target_cardinality: '0..*', direction: directed, inverse_of: claimGroundsFact, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  claimGroundsFact: {metadata: {id: claimGroundsFact, namespace: core.evidence, label_zh: 陈述奠定事实, label_en: claim grounds fact, aliases: [], definition: factDerivedFromClaim 的逆关系。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [陈述支撑事实], counter_examples: [事实支撑判断]}, source_types: [EvidenceClaim], target_types: [EvidenceFact], source_cardinality: '0..*', target_cardinality: '1..*', direction: directed, inverse_of: factDerivedFromClaim, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  evidenceConflictsWith: {metadata: {id: evidenceConflictsWith, namespace: core.evidence, label_zh: 证据冲突, label_en: evidence conflicts with, aliases: [], definition: 两项证据在同一主体、范围、时间与口径下不可同时成立。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-design, examples: [两项库存数据冲突], counter_examples: [不同口径数值不同]}, source_types: [EvidenceClaim, EvidenceFact], target_types: [EvidenceClaim, EvidenceFact], source_cardinality: '0..*', target_cardinality: '0..*', direction: undirected, inverse_of: evidenceConflictsWith, symmetric: true, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  requirementForJudgmentUnit: {metadata: {id: requirementForJudgmentUnit, namespace: core.evidence, label_zh: 证据要求对应判断单元, label_en: requirement for judgment unit, aliases: [], definition: 证据要求只服务于一个原子判断单元，防止跨判断复用粗粒度门槛。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [产能证据要求对应产能判断单元], counter_examples: [一个要求对应整个报告]}, source_types: [EvidenceRequirement], target_types: [JudgmentUnit], source_cardinality: '1..1', target_cardinality: '1..*', direction: directed, inverse_of: judgmentUnitRequiresEvidence, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  judgmentUnitRequiresEvidence: {metadata: {id: judgmentUnitRequiresEvidence, namespace: core.evidence, label_zh: 判断单元需要证据, label_en: judgment unit requires evidence, aliases: [], definition: requirementForJudgmentUnit 的逆关系。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [产能判断单元需要支持与反证要求], counter_examples: [最终判断直接需要来源]}, source_types: [JudgmentUnit], target_types: [EvidenceRequirement], source_cardinality: '1..*', target_cardinality: '1..1', direction: directed, inverse_of: requirementForJudgmentUnit, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  assessmentEvaluatesFact: {metadata: {id: assessmentEvaluatesFact, namespace: core.evidence, label_zh: 评估评价事实, label_en: assessment evaluates fact, aliases: [], definition: 证据评估在特定判断单元语境下评价一项归一事实的可用性。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [可用性评估评价库存事实], counter_examples: [评估评价最终判断]}, source_types: [EvidenceAssessment], target_types: [EvidenceFact], source_cardinality: '1..1', target_cardinality: '0..*', direction: directed, inverse_of: factHasAssessment, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  factHasAssessment: {metadata: {id: factHasAssessment, namespace: core.evidence, label_zh: 事实具有评估, label_en: fact has assessment, aliases: [], definition: assessmentEvaluatesFact 的逆关系。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [库存事实具有可用性评估], counter_examples: [事实具有结论等级]}, source_types: [EvidenceFact], target_types: [EvidenceAssessment], source_cardinality: '0..*', target_cardinality: '1..1', direction: directed, inverse_of: assessmentEvaluatesFact, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  basketIncludesAssessment: {metadata: {id: basketIncludesAssessment, namespace: core.evidence, label_zh: 证据篮子包含评估, label_en: basket includes assessment, aliases: [], definition: 单一角色证据篮子包含已在本判断单元语境中评价的证据评估。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [支持篮子包含两项可用评估], counter_examples: [篮子直接包含最终判断]}, source_types: [EvidenceBasket], target_types: [EvidenceAssessment], source_cardinality: '1..*', target_cardinality: '0..*', direction: directed, inverse_of: assessmentInBasket, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  assessmentInBasket: {metadata: {id: assessmentInBasket, namespace: core.evidence, label_zh: 评估位于证据篮子, label_en: assessment in basket, aliases: [], definition: basketIncludesAssessment 的逆关系。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [库存评估位于支持篮子], counter_examples: [来源位于判断]}, source_types: [EvidenceAssessment], target_types: [EvidenceBasket], source_cardinality: '0..*', target_cardinality: '1..*', direction: directed, inverse_of: basketIncludesAssessment, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  basketFulfillsRequirement: {metadata: {id: basketFulfillsRequirement, namespace: core.evidence, label_zh: 证据篮子满足要求, label_en: basket fulfills requirement, aliases: [], definition: 证据篮子对同角色证据要求给出满足、部分满足或未满足结果。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [两条独立证据满足支持要求], counter_examples: [背景篮子满足反证要求]}, source_types: [EvidenceBasket], target_types: [EvidenceRequirement], source_cardinality: '1..1', target_cardinality: '0..*', direction: directed, inverse_of: requirementFulfilledByBasket, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {fulfillment: {type: enum, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, allowed_values: [met, partially_met, unmet], description: 要求满足结果。}}, invalidation_policy: invalidate_downstream}
  requirementFulfilledByBasket: {metadata: {id: requirementFulfilledByBasket, namespace: core.evidence, label_zh: 证据要求由篮子满足, label_en: requirement fulfilled by basket, aliases: [], definition: basketFulfillsRequirement 的逆关系。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [支持要求由支持篮子满足], counter_examples: [判断由篮子直接满足]}, source_types: [EvidenceRequirement], target_types: [EvidenceBasket], source_cardinality: '0..*', target_cardinality: '1..1', direction: directed, inverse_of: basketFulfillsRequirement, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {fulfillment: {type: enum, required: true, cardinality: '1..1', value_role: calculated, nullable_semantics: forbidden, allowed_values: [met, partially_met, unmet], description: 要求满足结果。}}, invalidation_policy: invalidate_downstream}
  factGroundsObservation: {metadata: {id: factGroundsObservation, namespace: core.evidence, label_zh: 事实奠定观测, label_en: fact grounds observation, aliases: [], definition: 证据事实作为状态观测的事实基础；两者必须主体、范围、单位和时间对齐。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [库存事实奠定库存观测], counter_examples: [事实直接奠定判断]}, source_types: [EvidenceFact], target_types: [Observation], source_cardinality: '0..*', target_cardinality: '1..*', direction: directed, inverse_of: observationGroundedByFact, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  observationGroundedByFact: {metadata: {id: observationGroundedByFact, namespace: core.evidence, label_zh: 观测由事实奠定, label_en: observation grounded by fact, aliases: [], definition: factGroundsObservation 的逆关系。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [库存观测由库存事实奠定], counter_examples: [判断由事实奠定]}, source_types: [Observation], target_types: [EvidenceFact], source_cardinality: '1..*', target_cardinality: '0..*', direction: directed, inverse_of: factGroundsObservation, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
  factGroundsEvent: {metadata: {id: factGroundsEvent, namespace: core.evidence, label_zh: 事实奠定事件, label_en: fact grounds event, aliases: [], definition: 证据事实证明事件发生、时间或范围，不包含影响推断。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: ontology-3.0-stage3-closure, examples: [投产公告事实奠定投产事件], counter_examples: [事实证明事件影响利润]}, source_types: [EvidenceFact], target_types: [Event], source_cardinality: '0..*', target_cardinality: '1..*', direction: directed, inverse_of: eventGroundedByFact, symmetric: false, transitive: false, evidence_required: false, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
