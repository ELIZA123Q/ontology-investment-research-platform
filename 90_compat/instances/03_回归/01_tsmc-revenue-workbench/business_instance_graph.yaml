          metric: 合并营收（net revenue / consolidated revenue）
          period: 2024自然年（1-12月）及2024 Q4（10-12月）vs 2023年同期
          currency: 新台币（TWD）为主，美元（USD）为辅
          as_of: 2025-01-16T23:59:59+08:00
          scope: 台积电合并报表口径（台湾主体+海外子公司），以官方公告为唯一数据源
      projection:
        section: research_scope
        index: 0
    - id: tsmc_revenue
      type: StateVariable
      properties:
        id: tsmc_revenue
        name: 台积电合并营收观测
        category: 财务观测
        definition: 台积电官方公告的月度或季度合并营收金额，单位为新台币（可辅以美元口径核对）。涵盖2023年1月至2024年12月的完整月度序列，以及据此汇总的季度和年度总额。
        variable_kind: observable
        anchors:
          - 台积电月度营收公告（每月10日前公布上月营收）
          - 台积电季度合并财务报表
          - 台积电法人说明会简报及新闻稿
        ontology_node_id: task_local:tsmc_revenue
        role: 主观测变量——所有期间营收的原始数据来源
      projection:
        section: variables
        index: 0
