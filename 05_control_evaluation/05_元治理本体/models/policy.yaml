schema_name: ontology_governance_policy_model
schema_version: 2.0.0
meta_schema_version: 2.0.0
status: active
namespace: gov.policy
model: policy
description: Action 提交条件引用的治理规则、角色和批准策略。

roles:
  governance_owner: 维护治理边界、治理模型和发布基线。
  ontology_steward: 维护正式本体、领域参数图和语义迁移。
  runtime_owner: 维护 Runtime、图物化、映射和执行接线。
  method_owner: 维护研究方法及适用边界。
  independent_reviewer: 对高影响或破坏性变更提供独立审阅。

approval_policies:
  standard_ontology_change:
    required_roles: [ontology_steward]
    minimum_approvals: 1
    reject_is_terminal: true
  breaking_ontology_change:
    required_roles: [ontology_steward, runtime_owner, independent_reviewer]
    minimum_approvals: 3
    reject_is_terminal: true

validation_profiles:
  governance_ontology:
    required_checks: [validate_governance_control_plane, validate_project]
  ontology_core:
    required_checks: [validate_ontology, ontology:check, ontology:audit, typecheck, runtime:test, validate_project]
  ontology_domain_parameters:
    required_checks: [validate_parameter_authority, validate_ontology, validate_project]
  runtime_contract:
    required_checks: [validate_rule_authority, validate_parameter_authority, typecheck, runtime:test]
  method_assets:
    required_checks: [validate_method_assets, test:method_registry, validate_project]

rules:
  governance_formal_ontology_separation:
    metadata: {id: governance_formal_ontology_separation, namespace: gov.policy, label_zh: 治理与正式本体隔离, label_en: Governance Formal Ontology Separation, definition: gov 模型不得注册进正式投研本体或业务实例图。, model: policy, version: 2.0.0, status: active}
    rule_class: boundary
    applies_to: [GovernedAsset, ChangeProposal, GovernanceActionLog]
    predicate: governance_model_ids_disjoint_from_formal_ontology_registry
    failure_message: 治理模型不得进入正式投研本体注册表、业务实例图或商业规则求值。
  unique_asset_authority:
    metadata: {id: unique_asset_authority, namespace: gov.policy, label_zh: 资产唯一权威, label_en: Unique Asset Authority, definition: 每个受治理资产只能有一个机器权威引用。, model: policy, version: 2.0.0, status: active}
    rule_class: authority
    applies_to: [GovernedAsset, AuthorityAssignment]
    predicate: authority_ref_unique_and_resolvable
    failure_message: 受治理资产必须绑定唯一且可解析的仓库权威。
  action_only_mutation:
    metadata: {id: action_only_mutation, namespace: gov.policy, label_zh: Action 唯一写入, label_en: Action Only Mutation, definition: 提案状态和治理对象关键状态只能由注册 Action Type 改变。, model: policy, version: 2.0.0, status: active}
    rule_class: lifecycle
    applies_to: [ChangeProposal, OntologyBranch, ApprovalTask, MigrationTask, GovernanceException]
    predicate: mutation_has_registered_action_type
    failure_message: 治理状态变化必须由已注册 Action 执行。
  impact_snapshot_complete:
    metadata: {id: impact_snapshot_complete, namespace: gov.policy, label_zh: 影响快照完整, label_en: Complete Impact Snapshot, definition: 影响评估至少包含变更元素和必跑检查，并绑定冻结基线。, model: policy, version: 2.0.0, status: active}
    rule_class: impact
    applies_to: [ImpactAssessment]
    predicate: changed_elements_and_required_checks_nonempty
    failure_message: 影响评估必须冻结至少一个变更元素和一个必跑检查。
  proposal_baseline_current:
    metadata: {id: proposal_baseline_current, namespace: gov.policy, label_zh: 提案基线当前有效, label_en: Proposal Baseline Current, definition: 批准和发布时提案基线必须等于当前正式本体指纹且无未解决冲突。, model: policy, version: 2.0.0, status: active}
    rule_class: lifecycle
    applies_to: [ChangeProposal, OntologyBranch]
    predicate: base_fingerprint_matches_current_and_conflicts_empty
    failure_message: 当前基线已变化或仍有冲突，必须先 rebase。
  required_approvals_satisfied:
    metadata: {id: required_approvals_satisfied, namespace: gov.policy, label_zh: 批准条件满足, label_en: Required Approvals Satisfied, definition: 批准任务满足适用策略要求且无拒绝决定。, model: policy, version: 2.0.0, status: active}
    rule_class: approval
    applies_to: [ChangeProposal, ApprovalTask]
    predicate: approval_policy_minimum_and_roles_satisfied
    failure_message: 适用批准策略尚未满足。
  implementation_ref_resolves:
    metadata: {id: implementation_ref_resolves, namespace: gov.policy, label_zh: 实现引用可解析, label_en: Implementation Reference Resolves, definition: 提案实现引用必须指向仓库内现存资产。, model: policy, version: 2.0.0, status: active}
    rule_class: validation
    applies_to: [ChangeProposal]
    predicate: repository_ref_exists
    failure_message: 实现引用必须指向仓库内现存资产。
  all_required_checks_pass:
    metadata: {id: all_required_checks_pass, namespace: gov.policy, label_zh: 必跑检查全部通过, label_en: All Required Checks Pass, definition: 影响评估列出的每项检查都有不可变 pass 结果。, model: policy, version: 2.0.0, status: active}
    rule_class: validation
    applies_to: [ChangeProposal, ValidationRun]
    predicate: every_required_check_result_is_pass
    failure_message: 仍有缺失或未通过的必跑检查。
  breaking_change_migration_complete:
    metadata: {id: breaking_change_migration_complete, namespace: gov.policy, label_zh: 破坏性变更迁移完成, label_en: Breaking Change Migration Complete, definition: 破坏性提案必须绑定可解析且完成的迁移任务。, model: policy, version: 2.0.0, status: active}
    rule_class: migration
    applies_to: [ChangeProposal, MigrationTask]
    predicate: non_breaking_or_completed_migration_resolves
    failure_message: 破坏性本体变更必须绑定可解析且完成的迁移任务。
  target_resolves:
    metadata: {id: target_resolves, namespace: gov.policy, label_zh: 目标可解析, label_en: Target Resolves, definition: 发布时拟正式元素 ID 能从当前正式本体或领域参数图解析。, model: policy, version: 2.0.0, status: active}
    rule_class: release
    applies_to: [ChangeProposal]
    predicate: target_id_resolves_in_current_formal_catalog
    failure_message: 发布时拟正式元素 ID 必须能从当前正式本体或领域参数图解析。
  release_fingerprint_current:
    metadata: {id: release_fingerprint_current, namespace: gov.policy, label_zh: 发布指纹当前有效, label_en: Release Fingerprint Current, definition: 发布指纹必须是 sha256 且等于发布时正式本体当前指纹。, model: policy, version: 2.0.0, status: active}
    rule_class: release
    applies_to: [ChangeProposal, ReleaseBaseline]
    predicate: release_fingerprint_is_sha256_and_matches_current
    failure_message: 发布指纹必须等于当前正式本体内容指纹。
  immutable_action_history:
    metadata: {id: immutable_action_history, namespace: gov.policy, label_zh: 动作历史不可变, label_en: Immutable Action History, definition: ActionLog 只追加且保存执行时 Action 版本、输入与结果。, model: policy, version: 2.0.0, status: active}
    rule_class: audit
    applies_to: [GovernanceActionLog]
    predicate: append_only_action_log_with_versioned_snapshots
    failure_message: 治理动作历史不得被覆盖或静默改写。
  exceptions_cannot_override_semantics:
    metadata: {id: exceptions_cannot_override_semantics, namespace: gov.policy, label_zh: 例外不可覆盖正式语义, label_en: Exceptions Cannot Override Semantics, definition: 治理例外不得跳过正式本体结构、类型或商业规则的正确性检查。, model: policy, version: 2.0.0, status: active}
    rule_class: boundary
    applies_to: [GovernanceException]
    predicate: exception_rule_class_not_formal_semantics
    failure_message: 治理例外不得覆盖正式本体语义正确性。
