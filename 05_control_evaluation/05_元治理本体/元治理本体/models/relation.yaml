    source_types: [ImpactAssessment]
    target_types: [ChangeProposal]
    source_cardinality: '1..1'
    target_cardinality: '0..*'
    direction: directed
    inverse_of: proposalHasImpactAssessment
    attributes: {}
    invalidation_policy: retain_history
