  consumerAffectedByImpact:
    metadata: {id: consumerAffectedByImpact, namespace: gov.change, label_zh: 消费者被影响评估涉及, label_en: consumer affected by impact, definition: impactAffectsConsumer 的逆关系。, model: relation, version: 2.0.0, status: active}
    source_types: [GovernanceConsumer]
