schema_name: ontology_governance_relation_model
schema_version: 2.0.0
meta_schema_version: 2.0.0
status: active
namespace: gov.change
model: relation
description: 治理对象之间的影响、责任、变更、批准、检查、迁移、发布与审计关系。

relation_types:
  governedAssetOwnedBy:
    metadata: {id: governedAssetOwnedBy, namespace: gov.change, label_zh: 资产由其负责, label_en: governed asset owned by, definition: 受治理资产由权威责任分配承担问责。, model: relation, version: 2.0.0, status: active}
    source_types: [GovernedAsset]
    target_types: [AuthorityAssignment]
    source_cardinality: '1..1'
    target_cardinality: '0..*'
    direction: directed
    inverse_of: ownerResponsibleForAsset
    attributes: {}
    invalidation_policy: block_delete
  ownerResponsibleForAsset:
    metadata: {id: ownerResponsibleForAsset, namespace: gov.change, label_zh: 负责资产, label_en: owner responsible for asset, definition: governedAssetOwnedBy 的逆关系。, model: relation, version: 2.0.0, status: active}
    source_types: [AuthorityAssignment]
    target_types: [GovernedAsset]
    source_cardinality: '0..*'
    target_cardinality: '1..1'
    direction: directed
    inverse_of: governedAssetOwnedBy
    attributes: {}
    invalidation_policy: block_delete
  assetConsumedBy:
    metadata: {id: assetConsumedBy, namespace: gov.change, label_zh: 资产被其消费, label_en: asset consumed by, definition: 消费者读取或依赖受治理资产。, model: relation, version: 2.0.0, status: active}
    source_types: [GovernedAsset]
    target_types: [GovernanceConsumer]
    source_cardinality: '0..*'
    target_cardinality: '0..*'
    direction: directed
    inverse_of: consumerUsesAsset
    attributes: {usage_mode: {type: enum, allowed_values: [read, write, validate, publish]}}
    invalidation_policy: invalidate_downstream
  consumerUsesAsset:
    metadata: {id: consumerUsesAsset, namespace: gov.change, label_zh: 消费者使用资产, label_en: consumer uses asset, definition: assetConsumedBy 的逆关系。, model: relation, version: 2.0.0, status: active}
    source_types: [GovernanceConsumer]
    target_types: [GovernedAsset]
    source_cardinality: '0..*'
    target_cardinality: '0..*'
    direction: directed
    inverse_of: assetConsumedBy
    attributes: {usage_mode: {type: enum, allowed_values: [read, write, validate, publish]}}
    invalidation_policy: invalidate_downstream
  proposalChangesAsset:
    metadata: {id: proposalChangesAsset, namespace: gov.change, label_zh: 提案变更资产, label_en: proposal changes asset, definition: 变更提案拟修改一个受治理资产。, model: relation, version: 2.0.0, status: active}
    source_types: [ChangeProposal]
    target_types: [GovernedAsset]
    source_cardinality: '1..*'
    target_cardinality: '0..*'
    direction: directed
    inverse_of: assetChangedByProposal
    attributes: {}
    invalidation_policy: retain_history
  assetChangedByProposal:
    metadata: {id: assetChangedByProposal, namespace: gov.change, label_zh: 资产被提案变更, label_en: asset changed by proposal, definition: proposalChangesAsset 的逆关系。, model: relation, version: 2.0.0, status: active}
