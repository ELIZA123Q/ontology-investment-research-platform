    metadata: {id: impactAffectsConsumer, namespace: gov.change, label_zh: 影响涉及消费者, label_en: impact affects consumer, definition: 影响评估识别出一个受影响消费者。, model: relation, version: 2.0.0, status: active}
    source_types: [ImpactAssessment]
    target_types: [GovernanceConsumer]
    source_cardinality: '0..*'
    target_cardinality: '0..*'
    direction: directed
    inverse_of: consumerAffectedByImpact
    attributes: {severity: {type: enum, allowed_values: [low, medium, high, breaking]}}
