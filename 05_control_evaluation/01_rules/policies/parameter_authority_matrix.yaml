schema_name: parameter_authority_matrix
schema_version: 2.0.0
status: active
note: 登记 vNext 使用的参数唯一权威；消费者可以投影值，但不得维护第二套值域。

authority_kinds:
  formal_ontology: Ontology 5.0 类型、属性、规则或受治理实例。
  control_policy: 05_control_evaluation 拥有的规则或阈值。
  capability_registry: Skill 与方法资产拥有的能力元数据。
  context_state_contract: 04_context_state 拥有的 Context / State / Memory / Workspace 合同与值域。
  runtime_contract: vNext Runtime 拥有的执行状态与接口类型。

parameters:
  - id: state_variables
    authority_kind: formal_ontology
    authority_ref: 01_semantic_knowledge/01_ontology/domains/semiconductor/business_instances.yaml#StateVariable
    consumers: [semantic_context, research_plan, judgment]
  - id: evidence_profiles
    authority_kind: formal_ontology
    authority_ref: 01_semantic_knowledge/01_ontology/domains/semiconductor/business_instances.yaml#EvidenceProfile
    consumers: [evidence_package, ontology_actions]
  - id: evidence_recipes
    authority_kind: formal_ontology
    authority_ref: 01_semantic_knowledge/01_ontology/domains/semiconductor/business_instances.yaml#EvidenceRecipe
    consumers: [evidence_package]
  - id: source_profiles
    authority_kind: formal_ontology
    authority_ref: 01_semantic_knowledge/01_ontology/domains/semiconductor/business_instances.yaml#SourceProfile
    consumers: [source_discovery, evidence_package]
  - id: proxy_indicators
    authority_kind: formal_ontology
    authority_ref: 01_semantic_knowledge/01_ontology/domains/semiconductor/business_instances.yaml#ProxyIndicator
    consumers: [evidence_package, judgment, report]
  - id: judgment_types
    authority_kind: formal_ontology
    authority_ref: 01_semantic_knowledge/01_ontology/models/judgment.yaml#object_types.JudgmentUnit.attributes.judgment_type.allowed_values
    consumers: [method_application, judgment]
  - id: judgment_levels
    authority_kind: formal_ontology
    authority_ref: 01_semantic_knowledge/01_ontology/models/judgment.yaml#object_types.Judgment.attributes.level.allowed_values
    consumers: [judgment, report]
  - id: source_tiers
    authority_kind: formal_ontology
    authority_ref: 01_semantic_knowledge/01_ontology/models/evidence.yaml#object_types.SourceDocument.attributes.source_tier.allowed_values
    consumers: [source_capture, evidence_assessment]
  - id: confidence_levels
    authority_kind: formal_ontology
    authority_ref: 01_semantic_knowledge/01_ontology/models/judgment.yaml#object_types.Judgment.attributes.confidence.allowed_values
    consumers: [judgment]
  - id: judgment_thresholds
    authority_kind: control_policy
    authority_ref: 05_control_evaluation/01_rules/policies/judgment_threshold_policy.yaml
    consumers: [evidence_assessment, judgment]
  - id: evidence_sufficiency_thresholds
    authority_kind: control_policy
    authority_ref: 05_control_evaluation/01_rules/policies/evidence_sufficiency_policy.yaml
    consumers: [evidence_assessment, task_outcome]
  - id: artifact_editing_rules
    authority_kind: control_policy
    authority_ref: 05_control_evaluation/01_rules/policies/artifact_editing_policy.yaml
    consumers: [artifact_store, approvals, trusted_ui]
  - id: runtime_lifecycle_and_outcomes
    authority_kind: context_state_contract
    authority_ref: 04_context_state/02_state/lifecycle_contract.yaml
    consumers: [state_machine, task_store, command_api, trusted_ui]
  - id: knowledge_promotion_rules
    authority_kind: control_policy
    authority_ref: 05_control_evaluation/01_rules/knowledge_promotion/knowledge_learning_contract.yaml
    consumers: [knowledge_service, governance_policy_engine]
  - id: evidence_roles
    authority_kind: control_policy
    authority_ref: 05_control_evaluation/01_rules/policies/judgment_threshold_policy.yaml#operational_basket_roles
    consumers: [method_application, evidence_package]
  - id: judgment_method_routes
    authority_kind: control_policy
    authority_ref: 05_control_evaluation/01_rules/policies/judgment_method_routes.yaml#routes
    consumers: [research_plan, method_application]
  - id: financial_model_integrity_rules
    authority_kind: control_policy
    authority_ref: 05_control_evaluation/01_rules/policies/financial_model_integrity_policy.yaml
    consumers: [financial_normalization, financial_model, valuation_analysis]
  - id: model_data_egress_rules
    authority_kind: control_policy
    authority_ref: 05_control_evaluation/01_rules/policies/model_data_egress_policy.yaml
    consumers: [model_context_policy, model_gateway]
  - id: capability_activation_rules
    authority_kind: control_policy
    authority_ref: 05_control_evaluation/01_rules/policies/capability_activation_policy.yaml
    consumers: [capability_release, cutover_audit]
  - id: change_deposition_rules
    authority_kind: control_policy
    authority_ref: 05_control_evaluation/01_rules/policies/change_deposition_policy.yaml
    consumers: [change_review, governance_verifier]
  - id: signal_evidence_admission_rules
    authority_kind: control_policy
    authority_ref: 05_control_evaluation/01_rules/policies/signal_evidence_admission_policy.yaml
    consumers: [signal_workbench, source_capture, evidence_assessment]
  - id: source_document_attestation_rules
    authority_kind: control_policy
    authority_ref: 05_control_evaluation/01_rules/policies/source_document_attestation_policy.yaml
    consumers: [source_result_adapter, provenance_verifier, provenance_store, researcher_material]
  - id: method_assets
    authority_kind: capability_registry
    authority_ref: 03_agent_capability/02_skills/method_assets.yaml
    consumers: [method_router, method_application]
  - id: artifact_kinds_and_statuses
    authority_kind: context_state_contract
    authority_ref: 04_context_state/04_workspace/contract.yaml#artifact_contract
    consumers: [task_graph, artifact_store, trusted_ui]
  - id: method_application_shape
    authority_kind: runtime_contract
    authority_ref: 06_runtime/src/contracts.ts#MethodApplication
    consumers: [method_router, judgment, report]
  - id: task_node_statuses
    authority_kind: context_state_contract
    authority_ref: 04_context_state/02_state/contract.yaml#runtime_status_projection
    consumers: [planner, kernel, worker]
  - id: actor_types
    authority_kind: runtime_contract
    authority_ref: 06_runtime/src/contracts.ts#OntologyActorType
    consumers: [action_catalog, action_service, action_execution]
  - id: action_permissions_and_approvals
    authority_kind: formal_ontology
    authority_ref: 01_semantic_knowledge/01_ontology/kinetics/action_types.yaml
    consumers: [action_service]

not_promoted:
  - id: evidence_quality_dimensions
    reason: 领域取证指南，不与一级 source tier 或 confidence 值域合并。
    stays_at: 01_semantic_knowledge/01_ontology/domains/semiconductor/ontology_extension.yaml#domain_guides.evidence_quality_dimensions
  - id: event_type_taxonomy
    reason: 领域事件扩展，由 Ontology extension 治理。
    stays_at: 01_semantic_knowledge/01_ontology/domains/semiconductor/ontology_extension.yaml#event_taxonomy.event_type_taxonomy
  - id: report_discipline_diagnostics
    reason: 运行时诊断不是本体规则参数或正式研究质量分数。
    stays_at: 05_control_evaluation/05_evals/protocols/report_quality_evaluation_contract.yaml
