    blocking: true
  valuation_hypothesis_level_coupling:
    source_ref: 01_semantic_knowledge/01_ontology/models/judgment.yaml#rules
    rule_class: evidence_constraint
    execution_surface: runtime_semantic_execution
    blocking: true
  risk_exposure_blocking_linkage:
    source_ref: 01_semantic_knowledge/01_ontology/models/judgment.yaml#rules
    rule_class: state_consistency
