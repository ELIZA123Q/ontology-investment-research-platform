governance_rules:
  LOOP-IDENTITY-001:
    source_ref: 05_control_evaluation/01_rules/contracts/public_contract.yaml#task_graph_contract
    requirement: Event、Artifact 与 Action 必须绑定同一 Conversation、Task、Node 和 KnowledgeLock 上下文。
    execution_mode: automated
    validator_refs: [06_runtime/src/runtime/kernel.ts, 06_runtime/src/runtime/store.ts]
    test_refs: [06_runtime/tests/kernel.test.ts, 06_runtime/tests/store.test.ts]
    business_support_allowed: false
  LOOP-ROUTE-001:
    source_ref: 02_scenario_task/contracts/research_planning_contract.yaml
    requirement: 规划只能使用白名单节点，并按影响分析选择局部重算或任务分支。
    execution_mode: automated
    validator_refs: [06_runtime/src/runtime/plan-compiler.ts, 06_runtime/src/runtime/node-catalog.ts]
    test_refs: [06_runtime/tests/planner.test.ts]
    business_support_allowed: false
  LOOP-STALE-001:
    source_ref: 05_control_evaluation/01_rules/contracts/public_contract.yaml#object_validity_propagation
    requirement: 失效只向实际依赖图可达的下游传播，不按固定阶段整批传播。
    execution_mode: automated
    validator_refs: [06_runtime/src/runtime/kernel.ts, 06_runtime/src/runtime/planner.ts]
    test_refs: [06_runtime/tests/kernel.test.ts, 06_runtime/tests/planner.test.ts]
    business_support_allowed: false
  LOOP-ATTEMPT-001:
    source_ref: 05_control_evaluation/01_rules/contracts/public_contract.yaml#artifact_contract
    requirement: Artifact 修订创建新版本，Event 与历史版本保持追加式留痕。
    execution_mode: automated
    validator_refs: [06_runtime/src/runtime/store.ts, 06_runtime/src/runtime/kernel.ts]
    test_refs: [06_runtime/tests/store.test.ts, 06_runtime/tests/kernel.test.ts]
    business_support_allowed: false
  LOOP-CONVERGENCE-001:
    source_ref: 05_control_evaluation/01_rules/contracts/public_contract.yaml#task_graph_contract
    requirement: 运行从 Checkpoint 恢复，完成条件由依赖、审批、停止条件和 worker lease 决定。
    execution_mode: automated
    validator_refs: [06_runtime/src/runtime/kernel.ts, 06_runtime/src/runtime/store.ts, 06_runtime/src/worker.ts]
    test_refs: [06_runtime/tests/kernel.test.ts, 06_runtime/tests/store.test.ts]
    business_support_allowed: false
  EVIDENCE-TRUTH-001:
    source_ref: 03_agent_capability/contracts/research_provenance_contract.yaml
    requirement: 资料真实性、充分性与比较口径需要领域事实核查。
    execution_mode: human_required
    rationale: 确定性校验只能验证来源留痕、哈希与引用完整性，不能代替领域事实判断。
    validator_refs: []
    test_refs: []
    business_support_allowed: false
  REASONING-MEANING-001:
    source_ref: 05_control_evaluation/05_evals/rubrics/research_quality.md
    requirement: 推理是否具有经济含义与投研增量必须通过独立评测判断。
    execution_mode: semantic_review
    rationale: Runtime 纪律诊断只定位缺口，不产生正式 R、U、delta、S、C。
    validator_refs: [06_runtime/src/evaluation/report-quality-evaluator.ts]
    test_refs: [06_runtime/tests/report-quality-evaluator.test.ts]
    business_support_allowed: false
  GOV-RULE-EVALUATION-EXPLICIT-001: {source_ref: 05_control_evaluation/01_rules/contracts/public_contract.yaml#reasoning_trace_contract, business_support_allowed: false}
  GOV-REASONING-TRACE-001: {source_ref: 05_control_evaluation/01_rules/contracts/public_contract.yaml#reasoning_trace_contract, business_support_allowed: false}
  GOV-RULE-EVALUATION-TRACE-001: {source_ref: 03_agent_capability/02_skills/judgment_reasoning/references/A00_裁决总则.md, business_support_allowed: false}
  REASONING-REVISION-001:
    source_ref: 05_control_evaluation/01_rules/contracts/public_contract.yaml#incremental_update_contract
    requirement: 推理与报告修订必须创建新版本、保留 superseded 历史并局部失效可达下游。
    execution_mode: automated
    validator_refs: [06_runtime/src/runtime/kernel.ts, 06_runtime/src/runtime/store.ts]
    test_refs: [06_runtime/tests/kernel.test.ts, 06_runtime/tests/store.test.ts]
    business_support_allowed: false
  FIN-MODEL-INTEGRITY-001:
    source_ref: 05_control_evaluation/01_rules/policies/financial_model_integrity_policy.yaml
    requirement: 财务模型必须按受治理的单位归一、派生指标、勾稽容差和估值阻断条件执行；失败不能被模型或 UI 覆盖。
    execution_mode: automated
    validator_refs: [06_runtime/src/research/financial-model-contract.ts, 06_runtime/src/research/deterministic-financial-model.ts]
    test_refs: [06_runtime/tests/financial-capability.test.ts, 06_runtime/tests/financial-model-rules-projection.test.ts]
    business_support_allowed: false
  GOV-MODEL-DATA-EGRESS-001:
    source_ref: 05_control_evaluation/01_rules/policies/model_data_egress_policy.yaml
    requirement: 模型上下文必须按全部来源的受治理权限聚合；受限或未知权限仅允许本地模型，缺少必需来源不得出境。
    execution_mode: automated
    validator_refs: [06_runtime/src/providers/model-data-policy.ts, 06_runtime/src/providers/model-gateway.ts]
    test_refs: [06_runtime/tests/model-data-policy.test.ts, 06_runtime/tests/model-data-egress-rules-projection.test.ts, 06_runtime/tests/model-gateway.test.ts]
    business_support_allowed: false
  GOV-CAPABILITY-ACTIVATION-001:
    source_ref: 05_control_evaluation/01_rules/policies/capability_activation_policy.yaml
    requirement: 候选能力进入生产 Release 必须携带受治理的可比案例、盲评和零严重回归证据；仅已有基线可带明示理由，候选不得借此豁免。
    execution_mode: automated
    validator_refs: [06_runtime/src/capabilities/registry.ts, 06_runtime/scripts/audit-cutover.ts]
    test_refs: [06_runtime/tests/financial-capability.test.ts, 06_runtime/tests/domain-projection.test.ts]
    business_support_allowed: false
  GOV-CHANGE-DEPOSITION-001:
    source_ref: 05_control_evaluation/01_rules/policies/change_deposition_policy.yaml
    requirement: 实质修改必须先归类至本体、确定性规则、方法/Skill、任务证据、评测资产或执行机制，并登记权威、执行与验证引用；不得只落在 Runtime。
    execution_mode: automated
    validator_refs: [05_control_evaluation/04_verifiers/validate_change_deposition_policy.py]
    test_refs: [05_control_evaluation/04_verifiers/tests/test_change_deposition_policy.py]
    business_support_allowed: false
  GOV-SIGNAL-EVIDENCE-ADMISSION-001:
    source_ref: 05_control_evaluation/01_rules/policies/signal_evidence_admission_policy.yaml
    requirement: 信号连接器输出只能作为发现和原文核验线索；未重新冻结可定位原文的标题、摘要和链接不得直接进入 SourceSnapshot、EvidenceFact 或 Judgment。
    execution_mode: automated
    validator_refs: [06_runtime/src/tools/signal-evidence-admission.ts]
    test_refs: [06_runtime/tests/signal-evidence-admission.test.ts, 05_control_evaluation/04_verifiers/tests/test_signal_evidence_admission_policy.py]
    business_support_allowed: false
  GOV-SOURCE-DOCUMENT-ATTESTATION-001:
    source_ref: 05_control_evaluation/01_rules/policies/source_document_attestation_policy.yaml
    requirement: 完整原始文件指纹与可定位摘录哈希必须分离；一旦声明文件指纹，哈希、字节数和媒体类型均需通过确定性校验，且不得替代摘录定位。
    execution_mode: automated
    validator_refs: [06_runtime/src/tools/source-result-adapter.ts, 06_runtime/src/governance/provenance-verifier.ts, 06_runtime/src/semantic/provenance-store.ts]
    test_refs: [06_runtime/tests/source-result-adapter.test.ts, 06_runtime/tests/researcher-material.test.ts]
    business_support_allowed: false
  GOV-VALIDATION-OUTCOME-001: {source_ref: 05_control_evaluation/01_rules/contracts/public_contract.yaml#artifact_contract, business_support_allowed: false}
  GOV-VALIDATION-TIME-001: {source_ref: 05_control_evaluation/01_rules/contracts/public_contract.yaml#artifact_contract, business_support_allowed: false}
  GOV-SOURCE-TRACE-001: {source_ref: 05_control_evaluation/01_rules/contracts/public_contract.yaml#reasoning_trace_contract, business_support_allowed: false}
  GOV-SOURCE-ACCESS-001: {source_ref: 03_agent_capability/02_skills/evidence_research/references/README.md, business_support_allowed: false}
  GOV-CLAIM-STRUCTURE-001: {source_ref: 05_control_evaluation/01_rules/contracts/public_contract.yaml#reasoning_trace_contract, business_support_allowed: false}
  GOV-JUDGMENT-READINESS-001: {source_ref: 05_control_evaluation/01_rules/contracts/public_contract.yaml#method_application_contract, business_support_allowed: false}
  GOV-ACTION-APPROVAL-001: {source_ref: 01_semantic_knowledge/01_ontology/kinetics/policies.yaml#policies.HighRiskResearcherApproval, business_support_allowed: false}

runtime_rules:
  RT-OPERATION-REGISTRY-001: {source_ref: 01_semantic_knowledge/01_ontology/kinetics/action_types.yaml, business_support_allowed: false}
  RT-METHOD-STATUS-001: {source_ref: 06_runtime/src/runtime/node-catalog.ts, business_support_allowed: false}
  RT-METHOD-NO-SILENT-DROP-001: {source_ref: 06_runtime/src/runtime/node-catalog.ts, business_support_allowed: false}
  RT-TASK-NODE-TRANSITION-001: {source_ref: 06_runtime/src/runtime/kernel.ts, business_support_allowed: false}

retired_rule_ids:
  rule_evaluation_is_explicit:
    prior_authority: formal_ontology
    status: moved-to-governance
    replaced_by: GOV-RULE-EVALUATION-EXPLICIT-001
    reason: 该规则检查记录结构是否完整，属于治理合同，不表达投研世界中的稳定语义。

prohibitions:
  - A01—A10 不得登记为正式本体规则，只能通过 MethodApplication 影响判断。
  - governance_rules 与 runtime_rules 不得出现在商业判断的 RuleEvaluation.rule_ref 中。
  - Runtime 操作必须按 formal_rule_refs、method_refs、governance_rule_refs、runtime_rule_refs 分栏引用，禁止使用无归属的 rule_refs。
  - execution_surface=unimplemented 的正式规则不得被文案或 Runtime REQUIRED_RULES 宣称为已重算挡门规则。
  - 不得再用 semantic_endpoint_compatibility 表示判断链引用检查；该语义属于 judgment_reference_integrity。
