method_assets:
  kb04:A00: {source_ref: 03_agent_capability/02_skills/judgment_reasoning/references/A00_裁决总则.md, capability: adjudication}
  kb04:A01: {source_ref: 03_agent_capability/02_skills/judgment_reasoning/references/A01_状态判断.md, capability: adjudication}
