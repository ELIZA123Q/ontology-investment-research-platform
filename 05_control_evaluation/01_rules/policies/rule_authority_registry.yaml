  evidence_scope_time_alignment:
    source_ref: 01_semantic_knowledge/01_ontology/models/evidence.yaml#rules
    rule_class: evidence_constraint
    execution_surface: runtime_semantic_execution
    blocking: true
  no_direct_evidence_to_judgment:
    source_ref: 01_semantic_knowledge/01_ontology/models/evidence.yaml#rules
    rule_class: evidence_constraint
    execution_surface: runtime_semantic_execution
    blocking: true
  judgment_reference_integrity:
    source_ref: 01_semantic_knowledge/01_ontology/models/judgment.yaml#rules
    rule_class: semantic_constraint
    execution_surface: runtime_semantic_execution
    blocking: true
  judgment_evidence_threshold:
    source_ref: 01_semantic_knowledge/01_ontology/models/judgment.yaml#rules
    rule_class: evidence_constraint
    execution_surface: runtime_semantic_execution
    blocking: true
  judgment_status_consistency:
    source_ref: 01_semantic_knowledge/01_ontology/models/judgment.yaml#rules
    rule_class: state_consistency
    execution_surface: runtime_semantic_execution
    blocking: true
  expectation_projection_integrity:
    source_ref: 01_semantic_knowledge/01_ontology/models/judgment.yaml#rules
    rule_class: semantic_constraint
