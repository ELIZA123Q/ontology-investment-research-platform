schema_name: five_domain_authority_index
schema_version: 2.0.0
status: active
architecture_principle: 确定性负责边界，Agent 负责路径

rule: |
  五域是后台职责边界，不决定产品导航、Agent 数量或任务必经步骤。
  Runtime 只能组合 typed Research Task Nodes；禁止恢复固定 01→05 controller。
  Agent/Skill/Tool 唯一可执行 manifest 位于 06_runtime/src/capabilities/registry.ts。
  AI 原生心智分层与映射见 05_control_evaluation/01_架构/architecture.yaml。
  顶层目录已 1:1 对齐心智名；禁止新建 09 Data/Evidence 写入口或把 Runtime 嵌进 Context。

ai_native_architecture: 05_control_evaluation/01_架构/architecture.yaml
human_architecture: 05_control_evaluation/01_架构/00_五域系统骨架.md

domains:
  semantic:
    registry: 01_semantic_knowledge/registry.yaml
    write_entry: 01_semantic_knowledge/
    read_primary:
      - 01_semantic_knowledge/01_ontology/platform_registry.yaml
      - 01_semantic_knowledge/02_dictionary/registry.yaml
      - 01_semantic_knowledge/03_knowledge_graph/registry.yaml
      - 01_semantic_knowledge/01_ontology/models/evidence.yaml
    runtime_contract: 06_runtime/src/semantic/graph-contracts.ts
  task:
    registry: 02_scenario_task/registry.yaml
    write_entry: 02_scenario_task/
    runtime_node_catalog: 06_runtime/src/runtime/node-catalog.ts
    runtime_planner: 06_runtime/src/runtime/planner.ts
    optional_template: 02_scenario_task/04_workflows/deep_research/
  capability:
    registry: 03_agent_capability/registry.yaml
    write_entry: 03_agent_capability/
    executable_manifest: 06_runtime/src/capabilities/registry.ts
    method_resources: 03_agent_capability/05_method_libraries/
    mcp_registry: 03_agent_capability/04_protocols/mcp/registry.yaml
  execution:
    registry: 04_context_state/registry.yaml
    write_entry: 04_context_state/
    kernel: 06_runtime/src/runtime/kernel.ts
    store: 06_runtime/src/runtime/store.ts
    worker: 06_runtime/src/worker.ts
    historical_workspace: 04_context_state/03_workspace/
  governance:
    registry: 05_control_evaluation/registry.yaml
    write_entry: 05_control_evaluation/
    rules: 05_control_evaluation/11_rules/registry.yaml
    permissions: 05_control_evaluation/13_permissions/registry.yaml
    evals: 05_control_evaluation/14_evals/registry.yaml
    verifiers: 05_control_evaluation/15_verifiers/registry.yaml
    runtime_verifiers: 06_runtime/src/governance/verifiers.ts
  app:
    registry: 07_workspace/registry.yaml
    implementation: 06_runtime/app/
    workbench_url: http://127.0.0.1:3000

runtime_truth:
  persisted_business_objects:
    - Conversation
    - Task/TaskNode
    - Artifact
    - Event
    - Approval
    - MemoryRecord
  event_projections:
    - Message
    - Trace
  temporary_objects:
    - ContextPackage
  technical_recovery:
    - Checkpoint
    - RuntimeJob
    - ToolExecution
    - ModelCallCache

forbidden_legacy_patterns:
  - 06_runtime/agents
  - 06_runtime/skills
  - 06_runtime/workflow
  - 06_runtime/runner
  - 06_runtime/storage
  - .claude/skills/*/SKILL.md
  - fixed_stage_controller
  - duplicated_skill_body
