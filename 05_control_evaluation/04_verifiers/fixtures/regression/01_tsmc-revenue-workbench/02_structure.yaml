judgment_units:
  - judgment_unit_id: JU-01
    title: 2024年全年营收同比是否增长
    question: 2024年台积电全年合并营收是否高于2023年全年合并营收？即(2024全年营收 - 2023全年营收) / 2023全年营收 > 0？
    statement: 2024年台积电全年合并营收是否高于2023年全年合并营收？即(2024全年营收 - 2023全年营收) / 2023全年营收 > 0？
    judgment_type: trend_direction
    ontology_node_ids:
      - task_local:tsmc_revenue
      - task_local:yoy_growth_fy2024
    evidence_requirements: &a1
      - 台积电官方2023年1-12月各月营收公告（或2023年Q4法人说明会中的全年营收汇总）
      - 台积电官方2024年1-12月各月营收公告（或2025年1月法人说明会中的2024全年营收汇总）
      - 两期营收数据必须同币种（新台币）、同口径（合并报表）、涵盖完全对应的12个月
      - 如使用月度营收加总，需确认加总结果与官方季度/年度汇总一致
      - 如存在官方数据修订，以截至2025-01-16的最新公告为准
      - 至少一个独立交叉验证来源（如台积电官网投资者关系页面、台湾证券交易所MOPS）
    evidence_requirement_refs: *a1
  - judgment_unit_id: JU-02
    title: 2024年Q4营收同比增速是否高于全年同比增速
    question: 2024年Q4营收同比增速是否高于2024年全年营收同比增速？即[(2024Q4营收 - 2023Q4营收) / 2023Q4营收] >
      [(2024全年营收 - 2023全年营收) / 2023全年营收]？
    statement: 2024年Q4营收同比增速是否高于2024年全年营收同比增速？即[(2024Q4营收 - 2023Q4营收) / 2023Q4营收] >
      [(2024全年营收 - 2023全年营收) / 2023全年营收]？
    judgment_type: trend_direction
    ontology_node_ids:
      - task_local:tsmc_revenue
      - task_local:yoy_growth_fy2024
      - task_local:yoy_growth_q4_2024
    evidence_requirements: &a2
      - JU-01所需全部数据
      - 台积电官方2023年10-12月各月营收公告（或2023年Q4季度营收数据）
      - 台积电官方2024年10-12月各月营收公告（或2024年Q4季度营收数据/2025年1月法人说明会数据）
      - Q4季度营收与全年营收必须使用同一数据源和同一币种
      - 增速计算需保留足够精度（至少小数点后一位），避免四舍五入导致方向误判
      - 若增速差异小于0.5个百分点，需额外标注精度限制
    evidence_requirement_refs: *a2
variables:
  - id: tsmc_revenue
    name: 台积电合并营收观测
    category: 财务观测
    definition: 台积电官方公告的月度或季度合并营收金额，单位为新台币（可辅以美元口径核对）。涵盖2023年1月至2024年12月的完整月度序列，以及据此汇总的季度和年度总额。
    variable_kind: observable
    anchors:
      - 台积电月度营收公告（每月10日前公布上月营收）
      - 台积电季度合并财务报表
      - 台积电法人说明会简报及新闻稿
    ontology_node_id: task_local:tsmc_revenue
    role: 主观测变量——所有期间营收的原始数据来源
  - id: yoy_growth_fy2024
    name: 2024全年营收同比增速
    category: 财务比率
    definition: (2024年1-12月台积电合并营收合计 - 2023年1-12月台积电合并营收合计) /
      2023年1-12月台积电合并营收合计。以百分比表示，保留至少一位小数。
    variable_kind: derived
    anchors:
      - tsmc_revenue
    ontology_node_id: task_local:yoy_growth_fy2024
    role: JU-01目标变量——判断全年营收同比是否增长的直接依据
  - id: yoy_growth_q4_2024
    name: 2024 Q4营收同比增速
    category: 财务比率
    definition: (2024年10-12月台积电合并营收合计 - 2023年10-12月台积电合并营收合计) /
      2023年10-12月台积电合并营收合计。以百分比表示，保留至少一位小数。
    variable_kind: derived
    anchors:
      - tsmc_revenue
    ontology_node_id: task_local:yoy_growth_q4_2024
    role: JU-02比较变量之一——Q4同比增速
  - id: q4_vs_fy_growth_spread
    name: Q4增速与全年增速之差
    category: 财务比率
    definition: yoy_growth_q4_2024 -
      yoy_growth_fy2024。正数表示Q4增速高于全年增速，负数表示Q4增速低于全年增速。以百分点表示。
    variable_kind: derived
    anchors:
      - yoy_growth_fy2024
      - yoy_growth_q4_2024
    ontology_node_id: task_local:q4_vs_fy_growth_spread
    role: JU-02判断变量——增速差的符号决定方向判断
paths:
  - id: P-01
    statement: "台积电官方月度营收公告 → 按期间汇总（2023全年、2024全年、2023Q4、2024Q4） → 计算同比增速 →
      方向判断（JU-01: 全年增速>0?；JU-02: Q4增速>全年增速?）"
    variable_ids:
      - tsmc_revenue
      - yoy_growth_fy2024
      - yoy_growth_q4_2024
      - q4_vs_fy_growth_spread
  - id: P-02
    statement: 反证与削弱路径：若官方数据存在口径变更（如合并范围变化、收入确认政策调整）、重大一次性收入影响可比性、或截至2025-01-16的数据为初步数据且后续发生修订，则判断确定性降级或标记为暂不可判断
    variable_ids:
      - tsmc_revenue
      - yoy_growth_fy2024
      - yoy_growth_q4_2024
counter_evidence_directions:
  - 数据来源非台积电官方公告（如第三方汇总、分析师估算、新闻媒体二手引用），不得作为主判断依据
  - 货币换算导致方向矛盾：新台币口径显示增长但美元口径显示下降，或反之——以新台币口径为准但需明确记录差异
  - 口径不一致：2023年与2024年数据存在合并范围变化、会计政策变更或收入确认方式调整
  - 存在重大非经常性收入扭曲某一期营收，但台积电通常单独披露此类项目
  - 数据修订：截至2025-01-16的公告数据为初步数据，后续可能被修订；若修订幅度超过1%则需重新判断
  - 月度营收加总与官方季度/年度汇总存在差异（月度营收为简易合并，季度财报为完整合并，可能存在调整）
competing_explanations:
  - explanation_id: CE-WB-1
    statement: Q4增速高于全年增速可能因为2023 Q4基数异常低（而非2024 Q4表现特别强），这不改变方向判断本身但限制对加速增长的解读
  - explanation_id: CE-WB-2
    statement: 汇率波动导致新台币口径增速与美元口径增速方向或幅度不同——台积电以新台币为记账本位币
  - explanation_id: CE-WB-3
    statement: 半导体行业季节性：Q4通常为台积电全年营收最高季度，同比增速比较不受季节性直接影响，但基数效应需注意
