schema_name: governance_permission_registry
schema_version: 1.2.0
status: migrating

authority:
  answers: 你能做什么（表达强度、来源访问、人工门）。
  write_entry: 05_control_evaluation/13_permissions/
  read_primary: 05_control_evaluation/13_permissions/registry.yaml
  source_fragments:
    - 05_control_evaluation/02_合同/judgment_threshold_policy.yaml
    - 03_agent_capability/05_method_libraries/03_取证/B00_来源选择与使用边界.md
  implementation: deferred_no_rbac

permission_axes:
  - id: expression_strength
    source: 05_control_evaluation/02_合同/judgment_threshold_policy.yaml
    description: 允许表达的最大判断强度 / 角色
  - id: source_access_scope
    source: 03_agent_capability/05_method_libraries/03_取证/B00_来源选择与使用边界.md
    description: MCP/来源访问范围与准入
  - id: approval_gate
    source: 02_scenario_task/03_roles/registry.yaml
    description: 各阶段人工确认门
  - id: memory_write
    source: 04_context_state/02_memory/contract.yaml
    description: 跨任务 Memory 写入资格（契约层）

matrix:
  - identity: researcher
    may:
      - confirm_stage_outputs
      - request_supplement
      - export_workbench
      - write_user_preferences_memory
    may_not:
      - bypass_independent_review
      - claim_research_gain_without_eval_gate
      - promote_single_run_judgment_to_memory_truth
  - identity: reviewer
    may:
      - independent_semantic_review
      - block_formal_publish
      - propose_validated_failure_mode
    may_not:
      - silently_rewrite_judgments_without_trace
      - approve_as_researcher
  - identity: system_job
    may:
      - run_deterministic_stages
      - acquire_within_budget
      - index_theme_history_refs
    may_not:
      - approve_human_gates
      - invent_sources_without_acquisition
      - write_secrets_to_memory

notes:
  - wave4: 最小权限矩阵已冻结；不改 runtime 鉴权实现。
  - wave5: 增加 memory_write 轴与矩阵项；仍不引入完整 RBAC。
