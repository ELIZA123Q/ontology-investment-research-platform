schema_name: control_evaluation_domain_registry
schema_version: 3.0.0
status: active

authority:
  answers: 什么允许发生，以及发生得是否合规、有无研究价值。
  write_entry: 05_control_evaluation/
  read_primary:
    - 05_control_evaluation/01_rules/registry.yaml
    - 05_control_evaluation/02_identity/registry.yaml
    - 05_control_evaluation/03_permissions/registry.yaml
    - 05_control_evaluation/04_verifiers/registry.yaml
    - 05_control_evaluation/05_evals/registry.yaml

subdomains:
  rules: {target: 05_control_evaluation/01_rules, status: active}
  identity: {target: 05_control_evaluation/02_identity, status: active}
  permissions: {target: 05_control_evaluation/03_permissions, status: active}
  verifiers: {target: 05_control_evaluation/04_verifiers, status: active}
  evals: {target: 05_control_evaluation/05_evals, status: active}

boundary:
  project_architecture: 06_runtime/ARCHITECTURE.md
  contract_rule: contract follows owner; this registry only indexes control-plane-owned assets.

notes:
  - Verifier ≠ Eval。
  - 05 不保存“跨域合同垃圾桶”；跨域使用不改变合同的所有权。
  - Runtime 消费控制面规则，不在 Runtime 内平行定义规则值域。
  - vNext 是唯一现行 Runtime；旧固定五阶段实现与包校验仅保留在 Git 历史中。
