schema_name: ontology_action_execution_audit_schema
schema_version: 2.0.0
status: active
authority: runtime_governance_audit
namespace: core.audit
runtime_type: 06_runtime/src/contracts.ts#ActionExecution
runtime_store: 06_runtime/src/ontology/store.ts
description: >-
  vNext Action 执行审计记录。它不是投研世界对象，不得作为 ResearchCase
  同级业务实体，也不得替代 Runtime 的 ActionExecution 类型。

object_types:
  ActionExecution:
    label_zh: 动作执行记录
    label_en: Action Execution
    description: 一次 Action apply 的请求、预检、操作者、审批、编辑结果与失败信息。
    primary_key: id
    title_property: actionType
    attributes:
      actionType: {type: string, required: true}
      actionVersion: {type: string, required: true}
      status: {type: enum, required: true, allowed_values: [applied, rejected, failed]}
      actorType: {type: enum, required: true, allowed_values: [researcher, agent, system, ontology_admin]}
      actorId: {type: string, required: true}
      conversationId: {type: string, required: false}
      taskId: {type: string, required: false}
      idempotencyKey: {type: string, required: true}
      knowledgeLockId: {type: string, required: false}
      approvalId: {type: string, required: false}
      request: {type: object, required: true}
      preview: {type: object, required: true}
      edits: {type: array, required: true}
      outputRefs: {type: array, required: true}
      invalidatedRefs: {type: array, required: true}
      error: {type: string, required: false}
      createdAt: {type: datetime, required: true}
      completedAt: {type: datetime, required: false}

relation_types:
  actionEditedObject: {source_types: [ActionExecution], target_types: [ontology_object], inverse_of: objectEditedByAction}
  objectEditedByAction: {source_types: [ontology_object], target_types: [ActionExecution], inverse_of: actionEditedObject}
