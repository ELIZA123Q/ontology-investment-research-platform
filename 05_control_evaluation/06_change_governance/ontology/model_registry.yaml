schema_name: ontology_governance_model_registry
schema_version: 2.0.0
status: active
fingerprint_algorithm: sha256_over_ordered_repository_path_and_raw_bytes
meta_schema: meta_schema.yaml
model_files:
  - models/shared.yaml
  - models/asset.yaml
  - models/change.yaml
  - models/relation.yaml
  - models/action.yaml
  - models/policy.yaml
instance_graphs:
  - 05_control_evaluation/06_change_governance/ontology/instances/governance_instance_graph.yaml
runtime_contract:
  status_object_type: ChangeProposal
  status_property: status
  action_section: action_types
  action_log_object_type: GovernanceActionLog
compatibility_projections:
  - 05_control_evaluation/06_change_governance/ontology/compat/governance_control_contract.yaml
  - 05_control_evaluation/06_change_governance/ontology/compat/governed_asset_registry.yaml
formal_ontology_registration: forbidden
