schema_name: investment_research_rule_authority_registry
schema_version: 1.1.0
status: active
description: >
  规则唯一权威归属表；正式约束、研究方法、治理检查和运行控制不得混用。
  formal_ontology_rules 必须声明 execution_surface 与 blocking，避免「登记了却未执行」的空洞。

authority_contract:
  formal_ontology:
    definition: 跨任务稳定成立的语义、证据和状态一致性约束。
    allowed_rule_classes: [semantic_constraint, evidence_constraint, state_consistency]
    business_support_mode: RuleEvaluation
    execution_surface_values:
      - runtime_semantic_execution
      - runtime_graph_contract
      - unimplemented
  methods:
    definition: 回答如何研究、何时适用和最多能判断到哪里的可版本化方法资产。
    business_support_mode: MethodApplication
  governance:
    definition: 合同、字段、追溯、版本和发布完整性检查。
    business_support_mode: forbidden
  runtime:
    definition: 状态转换、执行、编排和操作注册表完整性控制。
    business_support_mode: forbidden

