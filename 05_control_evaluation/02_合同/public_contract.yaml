schema_name: controlled_research_chain_public_contract
schema_version: 1.3.0
status: active
formal_ontology_version: 3.0.0
ontology_meta_schema_version: 1.0.0
legacy_readonly_contract_versions: []
legacy_migration_policy:
  mode: direct-to-latest
  current_contract: 1.3.0
  legacy_samples_retained: false
  legacy_publish_compatibility: false
  rule: 所有新运行必须使用 Ontology 3.0 与 Public Contract 1.3；旧字段只能在迁移映射中出现，不得进入正式产物。

# 这里只维护跨阶段共享语义。阶段内部字段继续由 01—05 各自规范维护。
ownership:
  public_contract:
    - trace_id_patterns
    - stage_statuses
    - validity_statuses
    - publish_statuses
    - scope_relations
    - aggregation_outcomes
    - update_actions
    - evidence_wave_classifications
    - stage_attempt_states
    - object_validity_propagation
    - scope_graph
    - claim_scope
    - cross_stage_references
    - judgment_method_routes
    - method_application_contract
    - reasoning_trace_contract
    - incremental_update_contract
    - rule_usage_contract
    - replay_contract
    - semantic_baseline_contract
  formal_ontology:
    - object_types
    - relation_types
    - state_variables
    - evidence_profiles
    - state_and_event_types
    - research_scenario_types
    - stable_domain_rules
    - judgment_level_criterion_templates
    - evidence_recipes
    - source_profiles
    - proxy_indicators
  knowledge_bases:
    - reusable_methods
    - method_applicability
    - method_specific_gates
  stage_specs:
    - stage_internal_fields
    - researcher_readable_explanations
  notes:
    - 运行路由枚举（stage_status / task_disposition / quality_status）保持运行合同，不新建治理域本体。
    - 03_agent_capability/05_method_libraries/00_登记 声明方法能力、适用条件和候选关系；本合同只约束跨阶段合法性与允许路由值域。
    - 本次方法选择由 06_runtime/src/runtime/planner.ts 提议、由 kernel 执行并写入 Artifact 与 RunEvent；合同层不得预先写死本次选择。
    - judgment_method_routes 为跨阶段方法路由合法性合同；judgment_type 值域仍由一级本体类型约束。
    - 参数归属清单见 parameter_authority_matrix.yaml；覆盖率指已登记参数权威唯一，不是一切皆本体。
    - 二级 evidence_quality_dimensions / event_type_taxonomy 与 04 handoff 审计枚举见矩阵 not_promoted，本期不升格为 ontology_rule_param。

# 跨阶段主链与标识：本块为唯一机器权威；阶段规范只解释本阶段如何使用。
# 主链：01 核心问题 → 02 P/JU/候选方法 → 03 ER/EV/方法输入 → 04 MA/C → 05 EX
cross_stage_references:
  primary_chain: [Q, P, JU, ER, EV, MA, C, RC, EX]
  objects:
    Q:
      field: question_id
      created_in: stage_02
      note: 问题树子问题
    JU:
      field: judgment_unit_id
      created_in: stage_02
      note: 全链主键，后续不得重编号
    P:
      field: path_id
      created_in: stage_02
      inherited_by: stage_04
      note: Stage02 任务级有序路径投影；必须显式绑定状态变量与 JudgmentUnit，不是一级本体对象；新建使用 P-nn，已有 PATH-* 修复时保持稳定 ID
    ER:
      field: evidence_requirement_id
      created_in: stage_02
      inherited_by: stage_03
      note: 规范主键仅 ER-nn；反证可另用 CER-nn；ER-JU-nn 只可作 03 计划汇总行
    EV:
      field: evidence_id
      created_in: stage_03
    MA:
      field: application_id
      candidates_created_in: stage_02
      evidence_bound_in: stage_03
      finalized_in: stage_04
      note: 每个关键判断至少有一项 selected/executed、rejected、blocked 或 degraded 的显式方法记录
    C:
      field: claim_id
      created_in: stage_04
      note: 不用 CL-；CL- 仅用于 01 澄清问题
    RC:
      field: change_gate_register[].gate_id
      created_in: stage_04
      note: 新运行用 RC-nn；兼容历史 GATE- / G-
    EX:
      field: expression_id
      created_in: stage_05
  required_links:
    - P_to_JU
    - P_to_StateVariable
    - C_to_JU
    - JU_to_ER_for_critical_or_important
    - ER_to_EV_or_GAP
    - JU_to_MA
    - MA_to_EV_for_executed_methods
    - C_to_MA
    - EX_to_C
    - EX_to_MA
  researcher_body_rule: 主链编号不得大量进入 05 研究员交付正文；追溯留在表达审计 YAML。

trace_id_patterns:
  task_id: '^JTASK-[A-Z0-9][A-Z0-9_-]+$'
  run_id: '^(?:RUN|EXEC)-[A-Z0-9][A-Z0-9_-]+$'
  Q: '^Q-\d+$'
  P: '^(?:P-\d+|PATH-[A-Z0-9][A-Z0-9_-]*)$'
  JU: '^JU-\d+$'
  ER: '^ER-\d+$'
  EV: '^EV-\d+$'
  MA: '^MA-\d+$'
  C: '^C-(?:\d+|[A-Z0-9][A-Z0-9_-]*)$'
  RC: '^(?:RC|GATE|G)-\d+$'
  EX: '^EX-\d+$'
  CER: '^CER-\d+$'

business_authority_refs:
  judgment_types: 01_semantic_knowledge/01_ontology/models/judgment.yaml#object_types.JudgmentUnit.attributes.judgment_type.allowed_values
  judgment_levels: 01_semantic_knowledge/01_ontology/models/judgment.yaml#object_types.Judgment.attributes.level.allowed_values
  path_readiness_statuses: 05_control_evaluation/02_合同/judgment_threshold_policy.yaml#path_readiness_caps.@keys
  path_result_statuses: 05_control_evaluation/02_合同/judgment_threshold_policy.yaml#path_result_statuses
  source_authority_levels: 05_control_evaluation/02_合同/judgment_threshold_policy.yaml#source_authority_levels
  source_tiers: 01_semantic_knowledge/01_ontology/models/evidence.yaml#object_types.SourceDocument.attributes.source_tier.allowed_values
  confidence_levels: 01_semantic_knowledge/01_ontology/models/judgment.yaml#object_types.Judgment.attributes.confidence.allowed_values
  basket_roles: 05_control_evaluation/02_合同/judgment_threshold_policy.yaml#operational_basket_roles

legacy_judgment_type_migration:
  trend_or_phase: trend_direction
  mechanism_transmission: null
  object_comparison: object_differentiation
  valuation_expectation: null
  risk_reassessment: null
  note: null 表示旧类型语义不唯一，必须返回 02 重新拆分，禁止自动迁移。

stage_statuses: [not_started, in_progress, complete, blocked, returned]
validity_statuses: [current, stale, revalidation_required, missing]
publish_statuses: [PUBLISHABLE, RETURN_REQUIRED, STAGE_READY, INCOMPLETE_CHAIN]

# 以下枚举由公共校验器计算或校验；阶段产物不得另行定义同名语义。
scope_relations: [same, narrower, broader, overlap, incomparable]
aggregation_outcomes: [synchronized, dominant, differentiated, insufficient]
update_actions: [new, maintain, enhance, weaken, block, revise, retire]

# 以下枚举只控制运行路由，不定义新的业务变量、证据强度或推理权重。
evidence_wave_classifications:
  - task_contract_revision
  - reasoning_structure_revision
  - evidence_update
  - presentation_revision
  - no_semantic_delta
stage_attempt_states: [pending, committed, superseded]

# 语义基线不承载研究逻辑；它证明正式结果使用了哪个本体内容基线、
# 围绕哪些语义对象组织，以及阶段投影是否与正式实例图一致。
semantic_baseline_contract:
  schema_name: controlled_research_semantic_baseline
  schema_version: 1.0.0
  canonical_file: semantic_context.yaml
  instance_graph_file: business_instance_graph.yaml
  required_for_run_modes: [production]
  fixture_compatibility: 历史 fixture 可无语义基线只读回归；不得以 fixture 身份生成新生产结果。
  required_stages: [stage_01, stage_02, stage_03, stage_04, stage_05]
  required_context_fields:
    - schema_version
    - stage
    - ontology_versions
    - ontology_fingerprint
    - declared_object_ids
    - referenced_semantic_ids
    - resolved_semantic_ids
    - task_local_ids
    - unresolved_semantic_ids
    - reference_coverage
    - resolution_status
  identity:
    ontology_fingerprint_algorithm: sha256_over_ordered_ontology_model_paths_and_bytes
    model_registry_ref: 01_semantic_knowledge/01_ontology/platform_registry.yaml#semantic_models
  set_rules:
    - referenced_semantic_ids 必须由 resolved_semantic_ids 与 unresolved_semantic_ids 无交集地完整划分。
    - task_local_ids 必须是 resolved_semantic_ids 的子集，且全部使用 task_local:* 命名空间。
    - 所有 ID 列表必须去重并按字典序排序，禁止靠顺序掩盖语义漂移。
  derived_rules:
    - reference_coverage 必须等于 resolved / referenced；无引用时为 1。
    - resolution_status 只能由引用集合派生为 complete、partial 或 not_applicable。
  production_publish_rules:
    - 五阶段 ontology_fingerprint 必须完全一致并等于当前正式本体内容指纹。
    - 五阶段 ontology_versions 必须等于当前正式本体模型版本集合。
    - unresolved_semantic_ids 必须全部为空，Stage02—05 引用解析率必须为 100%。
    - Stage02—04 已批准产物必须通过正式实例图投影指纹读取门，禁止 legacy fallback。
    - run_manifest 必须同时绑定 semantic_context.yaml 与 business_instance_graph.yaml 的内容哈希。
    - 实例图必须声明 ontology_authority_graph_v1，并包含 Stage02—04 全部投影指纹。

scope_graph:
  schema_version: 1.0.0
  dimensions: [object, geography, customer, metric, time]
  node_contract:
    required_fields: [scope_ref, label, dimensions, parent_scope_ref]
    parent_rule: 除根节点外，每个范围节点必须引用同一图中的唯一父节点；图必须无环。
    dimension_rule: dimensions 只能使用受控维度，值必须为非空字符串列表。
  relation_rule: same/narrower/broader 由父子可达关系计算；无可达关系时，按维度交集派生 overlap 或 incomparable。

claim_scope:
  required_fields: [scope_ref, exclusions, time_basis]
  rule: Claim 或表达的范围必须引用 02 冻结的 scope_graph 节点，排除项与时间口径属于范围合同的一部分。

method_namespaces:
  evidence: kb03
  reasoning: kb04
  rule: 跨阶段产物中的方法引用必须带命名空间；知识库内部文件名可继续使用 A01—A10。

method_application_contract:
  schema_version: 1.2.0
  canonical_stage_field: method_applications
  deprecated_stage_fields:
    method_application_candidates: replaced_by_method_applications
    method_input_bindings: replaced_by_method_applications
    method_application_register: replaced_by_method_applications
  statuses: [candidate, selected, executed, rejected, blocked, degraded]
  capability_types: [judgment_structure, evidence, adjudication]
  per_judgment_unit_required_capabilities: [judgment_structure, evidence, adjudication]
  required_fields:
    - application_id
    - method_id
    - method_version
    - capability_type
    - target_question_refs
    - target_judgment_unit_refs
    - target_ontology_object_refs
    - status
    - precondition_checks
    - input_evidence_refs
    - output_signal_refs
    - output_judgment_refs
    - execution_summary
    - applicability_boundary
    - limitations
    - counter_example_refs
    - provenance
    - alternatives
  precondition_check_required_fields: [precondition_id, result, evidence_refs, reason]
  alternative_required_fields: [method_id, decision, reason]
  provenance_required_fields: [stage, source_application_id, actor, recorded_at]
  immutable_fields:
    - application_id
    - method_id
    - method_version
    - capability_type
    - target_question_refs
    - target_judgment_unit_refs
  additive_only_fields: [target_ontology_object_refs]
  stage_field_ownership:
    stage_02:
      creates: [application_id, method_id, method_version, capability_type, target_question_refs, target_judgment_unit_refs, target_ontology_object_refs, applicability_boundary, alternatives]
      allowed_statuses: [candidate]
      forbidden_nonempty: [input_evidence_refs, output_signal_refs, output_judgment_refs, execution_summary]
    stage_03:
      updates: [status, precondition_checks, input_evidence_refs, limitations, counter_example_refs, alternatives, provenance]
      allowed_statuses: [candidate, selected, rejected, blocked, degraded]
      forbidden_statuses: [executed]
      note: 必须完整继承 02 的全部 MA；未进入取证的裁决候选保持 candidate，禁止省略。
    stage_04:
      updates: [status, precondition_checks, input_evidence_refs, output_signal_refs, output_judgment_refs, execution_summary, limitations, counter_example_refs, alternatives, provenance]
      allowed_statuses: [executed, rejected, blocked, degraded]
      note: 必须完整继承 03 的全部 MA 并收敛为终态；只有 executed 可以支撑 Judgment。
    stage_05:
      creates: []
      updates: []
      projection_fields: [source_method_application_refs]
      note: 只能引用 04 中 executed 的 MA，不得复制、创建或改写 MA。
  allowed_transitions:
    candidate: [candidate, selected, executed, rejected, blocked, degraded]
    selected: [selected, executed, rejected, blocked, degraded]
    executed: [executed]
    rejected: [rejected]
    blocked: [blocked]
    degraded: [degraded, executed, rejected, blocked]
  rules:
    - 02 必须为每个 JudgmentUnit 同时登记 judgment_structure、evidence、adjudication 三类 MA；不得到 03/04 临时补建。
    - 02 只能创建 candidate；03 不得确认 executed；04 必须把全部方法收敛为终态。
    - 03 的 evidence MA 必须收敛为 selected/rejected/blocked/degraded，不得以 candidate 掩盖未执行取证。
    - 03 和 04 必须完整继承上一阶段全部 application_id，禁止静默删除或临时新增。
    - immutable_fields 不得跨阶段变化；target_ontology_object_refs 只允许追加，不允许删除。
    - provenance.source_application_id 在 02 必须为空，在 03/04 必须等于当前 application_id，以声明继承来源。
    - executed 必须至少绑定一项输入证据以及一项输出信号或判断。
    - rejected/blocked/degraded 必须填写失败前置条件或明确原因，并记录可用替代方法。
    - 方法应用属于运行合同，不得写入正式本体 rules、action_types、functions 或 logic_flows。
    - 04 的每个关键 Judgment 必须反向引用至少一项 adjudication MA；正常判断至少一项为 executed，J0 必须引用已收敛裁决 MA。
    - 05 只能引用 04 已存在且被来源 Judgment 使用的 MethodApplication，并必须保留 adjudication MA 追溯；禁止新增或改变状态。
    - 05 的 Markdown 是结构化 report_claims、来源 Judgment、边界与来源的确定性投影；模型自由正文不得直接进入发布包。

reasoning_trace_contract:
  schema_version: 1.0.0
  minimum_chain: [EvidenceFact, Signal, Hypothesis, RuleEvaluation, MethodApplication, Judgment, ReasoningTrace, Expression]
  rule_evaluation_required_fields: [rule_evaluation_id, rule_ref, input_refs, condition_results, result]
  condition_result_required_fields: [condition_id, expression, input_refs, outcome, rationale]
  judgment_required_refs: [evidence_refs, signal_refs, hypothesis_refs, rule_evaluation_refs, method_application_refs]
  reasoning_trace_required_fields: [trace_id, judgment_ref, node_refs, created_at]
  field_ownership:
    stage_03: [EvidenceClaim, EvidenceFact, EvidenceAssessment, EvidenceBasket]
    stage_04: [Signal, Hypothesis, RuleEvaluation, Judgment, ReasoningTrace]
    stage_05: [Expression]
  rules:
    - 每个 Signal 必须绑定具体 EvidenceFact，并指向至少一个 Hypothesis；EvidenceBasket 不能替代事实级绑定。
    - 每个 Hypothesis 必须具有至少一个 Signal 和可观测证伪条件。
    - RuleEvaluation 只能引用正式本体规则；治理检查、运行控制和方法规则不得支撑商业判断。
    - 每个 condition_result 必须包含具体输入引用；其 input_refs 必须包含于 RuleEvaluation.input_refs，且不得仅引用 EvidenceBasket。
    - 仅写 matched 或只写汇总 result 的 RuleEvaluation 无效。
    - 每个 Judgment 必须同时引用 EvidenceFact、Signal、Hypothesis、RuleEvaluation 和至少一个 executed adjudication MethodApplication；J0 按不可判断路径引用已收敛裁决 MA。
    - Judgment.evidence_refs 必须被其 Signal 或 RuleEvaluation 的事实级输入覆盖，禁止证据绕过中间推理步骤。
    - ReasoningTrace.node_refs 必须覆盖 Judgment 的全部直接引用和 Judgment 自身。
    - 05 Expression 只能引用其来源 Judgment 已使用的具体 EvidenceFact 和 executed MethodApplication，不得引用整个 EvidenceBasket 或产生新语义对象。

rule_usage_contract:
  schema_version: 1.0.0
  authority_registry: 05_control_evaluation/02_合同/rule_authority_registry.yaml
  design_time:
    ontology_rules: 本体中的语义约束、证据约束与状态一致性约束；声明适用边界，不预置本次结论。
    method_rules: 03_agent_capability/05_method_libraries/02–04 中的判断结构、取证策略与裁决原则；可复用、可版本化。
  runtime:
    method_application: 本次实际选用与应用的方法记录（MA-nn）；02 建 candidate，03 绑定证据，04 确认 executed/rejected/blocked/degraded。
    rule_evaluation: 本次规则执行结果（RE-nn）；记录规则引用、版本、输入、逐项条件结果与证据引用。
  distinction: 设计态回答「何时可以这样判断、何时不能」；运行态回答「本次实际怎样判断、前提是否满足、结论停在哪里」。禁止把设计态方法正文当作本次已执行结论。

replay_contract:
  schema_version: 1.0.0
  authority_rule: 结构化 YAML/CSV 与 run_manifest 是运行真相；Markdown 是可编辑展示层，不得作为唯一追溯来源。
  minimum_trace_chain: [Q, JU, ER, EV, MA, C, EX]
  version_tracking: run_manifest.versions 记录 contract、ontology、kb02、kb03、kb04 与各阶段 schema 版本；阶段产物 hash 与 attempt 支持波次回放。
  replay_without_markdown: 仅凭 run_manifest + 各阶段结构化产物，应能回答本次对象、所用方法版本、绑定证据、裁决边界与结论强度，无需阅读 05 研报正文。
  reference_samples:
    v3_with_method_application: 04_context_state/03_workspace/02_V3样例

runtime_objects:
  - Task
  - Run
  - MethodApplication
  - StageArtifact
  - StageAttempt
  - ValidationIssue
  - EvidenceWave
  - OntologyDependencyProjection
  - IterationPlan

publish_semantics:
  quality_pass: 研究过程与阶段合同是否合格
  publishable: 当前产物是否可正式交付；只能由总校验器派生
  judgment_level: 单条判断的证据与推理强度
  directional_conclusion_available: 是否存在可表达的方向性结论
  insufficient_can_publish: true

stale_propagation:
  stage_01: [stage_02, stage_03, stage_04, stage_05]
  stage_02: [stage_03, stage_04, stage_05]
  stage_03: [stage_04, stage_05]
  stage_04: [stage_05]
  stage_05: []

# 对象级传播是阶段 stale 的依据；箭头表示“上游变化使下游需要重算”。
# ReportClaim 是 04/05 发布投影，不扩展一级正式本体。
object_validity_propagation:
  formal_object_types:
    - EvidenceClaim
    - EvidenceFact
    - EvidenceAssessment
    - EvidenceBasket
    - Observation
    - Event
    - Signal
    - MarketExpectation
    - Hypothesis
    - RuleEvaluation
    - Judgment
    - ReasoningTrace
    - ExpectationGap
    - AssetImpact
  runtime_projection_types: [ReportClaim, Expression, MethodApplication]
  dependency_order:
    - [EvidenceClaim_or_EvidenceFact, EvidenceAssessment_or_EvidenceBasket_or_MethodApplication_or_Observation_or_Event_or_Signal_or_MarketExpectation]
    - [Observation_or_Event_or_Signal, Hypothesis]
    - [Hypothesis, RuleEvaluation]
    - [RuleEvaluation, Judgment]
    - [MethodApplication, Judgment]
    - [Judgment, ReasoningTrace_or_Expression]
    - [Judgment, ExpectationGap_or_AssetImpact]
    - [MarketExpectation, ExpectationGap]
    - [ExpectationGap_or_AssetImpact, ReportClaim]
  authority_rule: 每条依赖必须引用正式本体 Relation；只有 ReportClaim 边允许 stageProjection。
  invalidation_rule: 只传播到可达下游对象，不因同属一个阶段而使无关对象 stale。

incremental_update_contract:
  schema_version: 1.1.0
  required_fields: [update_id, new_evidence, changed_roots, direct_impacts, propagation_edges, affected_graph, recompute_stages, structural_checkpoint_required, full_rerun_required, expected_judgment_change]
  propagation_edge_required_fields: [source_ref, target_ref, dependency_type]
  dependency_types: [basket_membership, method_input, signal_input, hypothesis_input, rule_input, method_support, judgment_dependency, trace_projection, expression_projection]
  object_actions: [maintain, stale, revalidate, recompute, supersede]
  stage_by_object:
    EvidenceAssessment: '03'
    EvidenceBasket: '03'
    evidence_MethodApplication: '03'
    Signal: '04'
    Hypothesis: '04'
    RuleEvaluation: '04'
    adjudication_MethodApplication: '04'
    Judgment: '04'
    ReasoningTrace: '04'
    Expression: '05'
  rules:
    - changed_roots 记录新增、修订或失效的事实根；新增事实本身是 current，不自动列入 stale。
    - direct_impacts 必须列出新根通过语义匹配直接影响的既有对象；不得只写阶段号。
    - affected_graph.stale 必须等于 direct_impacts 在实际依赖图上的可达闭包，既不能漏传播，也不能把不可达对象标为 stale。
    - propagation_edges 必须解释 stale 闭包中实际使用的依赖边，并引用已存在对象。
    - remains_current 不得与 stale 相交，且其中对象不得从 direct_impacts 可达。
    - recompute_stages 只能由 stale 对象所属阶段派生；局部证据更新默认按 03→04→05 的受影响子集重算。
    - full_rerun_required 只有在结构边界、判断单元或本体依赖发生变化且 structural_checkpoint_required 为 true 时才允许为 true。
    - 共享上游对象会使全部可达判断失效；若希望局部更新，必须先把语义不同的 Hypothesis、Signal 或 EvidenceBasket 拆开。

iteration_semantics:
  evidence_unit: frozen_batch
  existing_structure_route: stage_03_then_affected_stage_04
  structural_discovery_route: full_stage_02_quality_gate_then_affected_stage_03_and_stage_04
  task_contract_route: stage_01
  presentation_only_route: stage_05
  immutable_reasoning_revision_relation: supersedes_trace
  immutable_reasoning_revision_action: runtime_revision_operation
  convergence_rule: 无待处理结构触发、无关键 stale 对象、attempt 哈希为 current、冲突已 resolved/contested/blocked，且最新波次未改变关键判断或路径。
  forbidden_rule: 禁止用固定最大循环次数替代语义收敛。
