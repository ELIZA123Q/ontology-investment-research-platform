document_type: model_profile_registry
schema_version: 1.0.0
# 单供应商 DeepSeek：评测用 deepseek-v4-pro，生产/下游用 deepseek-v4-flash。
# 两个互异 model_id → single_vendor_comparative；不得外推 formal_full 跨模型可靠率。
# 运行时必须显式传 --max-new-requests，避免预算失控。
run_mode: single_vendor
profiles:
  producer:
    model_id: deepseek-v4-flash
    provider_family: deepseek
    command: [python3, 05_control_evaluation/05_evals/runners/http_model_adapter.py, --profile, producer]
  judge_a:
    model_id: deepseek-v4-pro
    provider_family: deepseek
    command: [python3, 05_control_evaluation/05_evals/runners/http_model_adapter.py, --profile, judge_a]
  judge_b:
    model_id: deepseek-v4-pro
    provider_family: deepseek
    command: [python3, 05_control_evaluation/05_evals/runners/http_model_adapter.py, --profile, judge_b]
  downstream_a:
    model_id: deepseek-v4-pro
    provider_family: deepseek
    command: [python3, 05_control_evaluation/05_evals/runners/http_model_adapter.py, --profile, downstream_a]
  downstream_b:
    model_id: deepseek-v4-pro
    provider_family: deepseek
    command: [python3, 05_control_evaluation/05_evals/runners/http_model_adapter.py, --profile, downstream_b]
role_bindings:
  producer: producer
  judges: [judge_a, judge_b]
  downstream_models: [downstream_a, downstream_b]
isolation_notes:
  - 单供应商 pilot：评测与下游共用 deepseek-v4-pro，生产使用 deepseek-v4-flash；仅形成有边界的供应商内比较，不得外推 formal_full。
  - 真实运行必须带 --max-new-requests；本轮校准预检上限为 10。
