schema_name: semantic_migration_ledger
schema_version: 1.0.0
status: active
description: >
  语义域架构/文件迁移账本。记录路径与模型归属变更，不构成词典权威，
  也不由 dictionary 宣布 ontology 边界。正式语义以 01_ontology 为准。

migrations:
  - id: MIG_DICT_PROSE_TO_ONTOLOGY
    since: "2026-08-10"
    kind: path_move
    from: 01_semantic_knowledge/02_dictionary/00–03_*.md
    to: 01_semantic_knowledge/01_ontology/00–03_*.md
    note: 本体可读规范迁回 ontology；dictionary 只保留归一化 YAML。

  - id: MIG_SCENARIO_CATALOG
    since: "4.0"
    kind: model_boundary
    from: 01_semantic_knowledge/01_ontology/models/scenario.yaml
    to: 02_scenario_task/02_scenarios/types.yaml
    note: >
      场景类型目录移出正式本体 Object Model。若 prose/3.0 说明仍写 scenario.yaml
      为核心模型，以 platform_registry.yaml 与本账本对照，不以 dictionary 为准。

  - id: MIG_RESEARCH_SCOPE_OPERATIONAL
    since: "4.0"
    kind: model_boundary
    from: semantic model (historical prose placement)
    to: models/operational.yaml → ResearchScope
    note: >
      ResearchScope 现属 operational 模型。dictionary 不得单独宣布该归属变更；
      以 ontology 机器入口为准。

  - id: MIG_KG_CONTRACT_SLIM
    since: "2026-08-10"
    kind: path_move
    from: >
      01_semantic_knowledge/03_knowledge_graph/contracts/*.{ts} +
      01_semantic_knowledge/03_knowledge_graph/validators/*.py
    to: >
      01_semantic_knowledge/03_knowledge_graph/contracts/*.yaml（合同）;
      已删除的旧 stage→graph 物化器;
      05_control_evaluation/04_verifiers/knowledge_graph/（实例图校验）;
      05_control_evaluation/04_verifiers/legacy_compat/（历史样例兼容）
    note: >
      Knowledge Graph 收窄为图纸规范：只回答图类型、节点边表示、双视图区分、
      投影/追溯策略。禁止 materializer 仅因同处 ResearchScope 推断业务关系。
      正式图与 Workflow/Stage02–04 解耦；Research Provenance 与 Execution Trace 分离。
      Runtime 边界仍为 06_runtime/src/semantic/graph-contracts.ts。

authority:
  semantic: 01_semantic_knowledge/01_ontology/platform_registry.yaml
  normalization: 01_semantic_knowledge/02_dictionary/registry.yaml
  this_file: architecture_migration_record_only
