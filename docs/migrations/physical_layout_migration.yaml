schema_name: physical_layout_migration
schema_version: 1.0.0
status: completed
completed_at: 2026-08-10
authority: docs/architecture/architecture.yaml
kind: one_to_one_top_level_rename

principle: |
  仅做心智名与顶层目录 1:1 对齐。不新建 08_asset_evolution / 09_data_evidence 写入口；
  Runtime 保持独立承载层，不嵌进 Context & State。

renames:
  - from: 01_semantic
    to: 01_semantic_knowledge
  - from: 02_tasks
    to: 02_scenario_task
  - from: 03_capabilities
    to: 03_agent_capability
  - from: 04_execution
    to: 04_context_state
  - from: 05_governance
    to: 05_control_evaluation
  - from: 07_runtime
    to: 06_runtime
  - from: 06_app
    to: 06_runtime/app

unchanged_domain_keys:
  - semantic
  - task
  - capability
  - execution
  - governance
  - app

not_created:
  - 08_asset_evolution  # 仍挂 05_control_evaluation 知识闭环合同
  - 09_data_evidence    # 横切通道，无独立 write_entry

follow_ups:
  - 跑 validate_project / runtime tests / typecheck
  - Asset Evolution 升独立目录：等知识闭环运行证据后再议
