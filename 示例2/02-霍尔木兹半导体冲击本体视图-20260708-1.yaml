judgment_units:
- judgment_unit_id: JU-01
  statement: 可方向性确认双路径拆分成立：通道冲击可缓释，氦气路径更持久
  linked_questions:
  - Q-01
  - Q-02
  linked_paths:
  - P-01
  minimum_verification_condition: 通道扰动证据与氦气份额/设施损伤线索同时存在
  required_counter_checks:
  - 停火后设施损伤是否同步消失
  downgrade_rule_if_not_met: directional_only
  evidence_profile_refs:
  - event_facts
  - capacity_supply
  md_section: '5'
- judgment_unit_id: JU-02
  statement: 氦气约束持续性高于油价一阶冲击
  linked_questions:
  - Q-02
  linked_paths:
  - P-01
  minimum_verification_condition: 卡塔尔份额数量级、修复周期类表述、油价回落对比
  required_counter_checks:
  - 氦气现货与合约是否无压力
  downgrade_rule_if_not_met: directional_only
  evidence_profile_refs:
  - capacity_supply
  - pricing_economics
  md_section: '5'
- judgment_unit_id: JU-03
  statement: 韩台先进制造对氦气库存与配给敏感（条件性）
  linked_questions:
  - Q-03
  linked_paths:
  - P-01
  minimum_verification_condition: 进口依赖数量级加至少一项厂侧/库存代理
  required_counter_checks:
  - 无配给无投片调整则削弱
  downgrade_rule_if_not_met: conditional_only
  evidence_profile_refs:
  - inventory_cycle
  - capacity_supply
  md_section: '5'
- judgment_unit_id: JU-04
  statement: 中国三类对象必须分拆映射，不得笼统受益或受损
  linked_questions:
  - Q-04
  linked_paths:
  - P-02
  minimum_verification_condition: 三类对象各自有映射口径与限制
  required_counter_checks:
  - 是否出现用板块涨跌替代三类拆分
  downgrade_rule_if_not_met: directional_only
  evidence_profile_refs:
  - object_mapping
  md_section: '5'
- judgment_unit_id: JU-05
  statement: 可给出进口依赖与份额数量级边界，不得给出精确减产吨数
  linked_questions:
  - Q-05
  linked_paths:
  - P-01
  - P-02
  minimum_verification_condition: 全球约1/3、韩国约2/3、中国超60%等公开数量级边界
  required_counter_checks:
  - 同源转述冲突不得假装已确认
  downgrade_rule_if_not_met: conditional_only
  evidence_profile_refs:
  - quantitative_boundary
  md_section: '5'
- judgment_unit_id: JU-06
  statement: 中国具体公司收入幅度与全球 fab 减产百分比暂不可判断
  linked_questions:
  - Q-05
  linked_paths:
  - P-02
  minimum_verification_condition: 需可追溯产量或收入损失证据
  required_counter_checks:
  - 公开材料是否仅有转述估算
  downgrade_rule_if_not_met: insufficient
  evidence_profile_refs:
  - company_impact
  md_section: '5'
path_design:
  main_paths:
  - path_id: P-01
    name: 通道可缓释冲击与氦气结构性约束双路径
    description: 从事件冲击切开航运/能源与氦气硬约束，落到韩台制造端敏感度与数量级边界
    linked_judgment_units:
    - JU-01
    - JU-02
    - JU-03
    - JU-05
    nodes:
    - node_id: N-01
      name: 海峡航运与能源冲击状态
      role: start
      question: 通航与油价冲击是否仍主导且是否可缓释
      required_state_variables:
      - strait_transit_status
      - energy_price_pulse
      required_instance_requirements:
      - IR-01
      required_evidence_requirements:
      - ER-01
      failure_action: downgrade
    - node_id: N-02
      name: 氦气供给与设施损伤
      role: precondition
      question: 卡塔尔相关氦气是否形成结构性约束
      required_state_variables:
      - helium_supply_share
      - facility_repair_horizon
      required_instance_requirements:
      - IR-02
      - IR-03
      required_evidence_requirements:
      - ER-02
      failure_action: downgrade
    - node_id: N-03
      name: 韩台先进制造暴露
      role: transmission
      question: 库存与配给是否显示制造端敏感
      required_state_variables:
      - fab_helium_inventory_weeks
      - fab_allocation_or_wafer_start
      required_instance_requirements:
      - IR-04
      required_evidence_requirements:
      - ER-03
      failure_action: downgrade
    - node_id: N-04
      name: 数量级测算边界
      role: outcome
      question: 可公开支撑的依赖边界到哪一级
      required_state_variables:
      - import_dependency_boundary
      required_instance_requirements:
      - IR-03
      - IR-04
      required_evidence_requirements:
      - ER-05
      failure_action: downgrade
  - path_id: P-02
    name: 中国三类对象映射与误读风险
    description: 把中国半导体资产拆为先进制造暴露、气体替代、设计设备情绪，并挡住精确公司影响越界
    linked_judgment_units:
    - JU-04
    - JU-05
    - JU-06
    nodes:
    - node_id: N-05
      name: 中国三类对象映射
      role: transmission
      question: 三类对象各自影响方向是什么
      required_state_variables:
      - cn_advanced_helium_exposure
      - cn_gas_substitution_progress
      - cn_design_equipment_sentiment_map
      required_instance_requirements:
      - IR-05
      - IR-06
      - IR-07
      required_evidence_requirements:
      - ER-04
      failure_action: stop
    - node_id: N-06
      name: 精确公司/ fab 影响可得性
      role: stop
      question: 是否存在可追溯精确减产或收入影响
      required_state_variables:
      - precise_fab_loss_availability
      required_instance_requirements:
      - IR-05
      required_evidence_requirements:
      - ER-06
      failure_action: stop
  weakening_conditions:
  - condition_id: W-01
    statement: 有条件通航、停火与油价回落削弱通道路径权重
    linked_paths:
    - P-01
    distinguish_evidence:
    - 通航天数
    - Brent 回落
    effect_on_04: 通道路径降为对比项，不取消氦气路径
  blocking_conditions:
  - condition_id: B-01
    statement: 先进厂无配给无投片调整且氦气价格合约无异常
    linked_paths:
    - P-01
    distinguish_evidence:
    - 厂侧运营
    - 氦气现货合约
    effect_on_04: 制造端硬约束路径不足
  competing_explanations:
  - explanation_id: CE-01
    statement: 冲击被市场主要定价为油价与板块情绪，而非工艺气体硬约束
    distinguish_from_main_path: 对照氦气份额、修复周期与厂侧配给，而非只看 Brent 与股价
    required_evidence:
    - 油价回落并存氦气约束线索
    - 设计设备涨跌缺乏订单证据
    effect_on_04: 写入预期差，不得作为供应链主结论
