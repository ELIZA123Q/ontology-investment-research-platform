judgment_units:
  - judgment_unit_id: JU-01
    judgment_name: 现行管制有效供给约束
    judgment_type: policy_impact_judgment
    statement: 现行规则是否对目标设备、客户和服务形成可执行且持续的供给约束
    linked_questions: [Q-01, Q-02]
    linked_paths: [P-01]
    target_path_node_ids: [N-01, N-02]
    target_state_variables: [SV-01, SV-02, SV-08]
    target_anchor_objects: [OBJ-US-CONTROL-SET, OBJ-CN-SEMI-EQP]
    decision_relevance: core
    expected_04_output_type: full_reasoning_ready
    required_evidence_roles:
      primary_support: required
      cross_validation: required
      counter_evidence: required
      blocking_condition: required
      proxy_indicator: not_allowed
      background_evidence: optional
    required_evidence_categories: [policy, event]
    required_counter_categories: [policy, supply]
    candidate_evidence_recipe_tags: [geopolitical_export_control, policy_execution]
    minimum_verification_condition: 至少两项美国官方规则或现行法规加一项执行或处罚证据并检查许可、豁免和成熟制程供货反证
    minimum_validation_conditions:
      - 正式规则的生效日期和适用范围可追溯
      - 当前执行或处罚证据可复核
      - 许可、豁免和仍可供货类别已检查
    required_counter_checks:
      - 检查海外厂商在中国的成熟制程设备收入与供货表述
      - 检查被暂停或尚未生效的规则是否被误纳入基线
    forbidden_shortcuts:
      - 用新闻标题替代规则原文
      - 用实体清单数量直接推断行业收入
    proxy_policy: not_allowed
    evidence_gap_policy: 规则范围或执行缺失时停止方向判断
    downgrade_rule_if_not_met: insufficient
    evidence_profile_refs: [EP-POLICY-01, EP-SUPPLY-COUNTER-01]
    md_section: "5"
  - judgment_unit_id: JU-02
    judgment_name: 供给缺口到国产商业转化
    judgment_type: event_impact_judgment
    statement: 海外供给缺口是否转化为国产设备验证、复购、跨线复制和经营兑现
    linked_questions: [Q-03, Q-04]
    linked_paths: [P-01]
    target_path_node_ids: [N-03, N-04]
    target_state_variables: [SV-03, SV-04, SV-05]
    target_anchor_objects: [OBJ-CN-SEMI-EQP]
    decision_relevance: core
    expected_04_output_type: directional_only
    required_evidence_roles:
      primary_support: required
      cross_validation: required
      counter_evidence: required
      blocking_condition: required
      proxy_indicator: allowed_with_limit
      background_evidence: optional
    required_evidence_categories: [demand, order, financial]
    required_counter_categories: [demand, financial]
    candidate_evidence_recipe_tags: [equipment_validation_scale, fab_spending]
    minimum_verification_condition: 行业设备支出加至少两类国产设备公司的验证或重复订单及收入毛利证据
    minimum_validation_conditions:
      - 中国设备需求池有行业或晶圆厂证据
      - 客户验证与重复采购不以首台或样机替代
      - 收入与毛利或验收成本同时检查
    required_counter_checks:
      - 检查资本开支高位回落
      - 检查毛利率、验收和研发投入对利润的抵消
    forbidden_shortcuts:
      - 把订单等同收入
      - 把份额等同利润
    proxy_policy: allowed_but_must_discount_confidence
    evidence_gap_policy: 缺少客户级复购和统一口径时限制为方向判断
    downgrade_rule_if_not_met: conditional_only
    evidence_profile_refs: [EP-DEMAND-01, EP-COMMERCIALIZATION-01]
    md_section: "5"
  - judgment_unit_id: JU-03
    judgment_name: 设备类别与代表公司分化
    judgment_type: expectation_gap_judgment
    statement: 未来十二个月不同设备类别和代表公司受益强弱是否由商业化成熟度而非管制紧迫性决定
    linked_questions: [Q-04, Q-05]
    linked_paths: [P-01, P-02]
    target_path_node_ids: [N-04, N-05, N-07]
    target_state_variables: [SV-04, SV-05, SV-06, SV-07]
    target_anchor_objects: [OBJ-CN-SEMI-EQP]
    decision_relevance: core
    expected_04_output_type: directional_only
    required_evidence_roles:
      primary_support: required
      cross_validation: required
      counter_evidence: required
      blocking_condition: required
      proxy_indicator: allowed_with_limit
      background_evidence: optional
    required_evidence_categories: [order, financial, exposure]
    required_counter_categories: [supply, financial]
    candidate_evidence_recipe_tags: [category_company_cross_section, upstream_dependency]
    minimum_verification_condition: 至少五个设备类别和六家代表公司有产品阶段、量产复购或经营数据并披露不可比边界
    minimum_validation_conditions:
      - 类别按量产成熟度和收入质量比较
      - 代表公司只作为样本不外推至全部行业
      - 光刻等高缺口类别缺少公开量产证据时不得上调
    required_counter_checks:
      - 检查关键部件与软件受限
      - 检查低价导入和研发费用对利润质量影响
    forbidden_shortcuts:
      - 用技术传闻排序
      - 用单一收入增速代表全部受益
    proxy_policy: allowed_but_must_discount_confidence
    evidence_gap_policy: 公司和类别口径不统一时只给分组方向排序
    downgrade_rule_if_not_met: conditional_only
    evidence_profile_refs: [EP-CATEGORY-01, EP-FINANCIAL-01]
    md_section: "5"
  - judgment_unit_id: JU-04
    judgment_name: 未来十二个月行业逻辑更新
    judgment_type: expectation_gap_judgment
    statement: 现行管制会改写国产替代投资逻辑还是只提高战略必要性并强化对商业兑现质量的要求
    linked_questions: [Q-01, Q-02, Q-03, Q-04, Q-05]
    linked_paths: [P-01, P-02]
    target_path_node_ids: [N-05, N-06, N-07]
    target_state_variables: [SV-01, SV-02, SV-03, SV-04, SV-05, SV-06, SV-07, SV-08]
    target_anchor_objects: [OBJ-CN-SEMI-EQP]
    decision_relevance: core
    expected_04_output_type: directional_only
    required_evidence_roles:
      primary_support: required
      cross_validation: required
      counter_evidence: required
      blocking_condition: required
      proxy_indicator: allowed_with_limit
      background_evidence: optional
    required_evidence_categories: [policy, demand, order, financial, exposure]
    required_counter_categories: [policy, supply, financial]
    candidate_evidence_recipe_tags: [integrated_logic_update, scenario_gate]
    minimum_verification_condition: 前三个判断单元均可使用且规则再扩围、支出下修、上游受限和海外供货四类改判闸门可跟踪
    minimum_validation_conditions:
      - 政策事实与商业兑现分别判断
      - 竞争解释和阻断条件已检查
      - 未来规则生效日与当前基线分开
    required_counter_checks:
      - 检查规则许可化或放松
      - 检查晶圆厂支出下降
      - 检查国内厂商上游受限
    forbidden_shortcuts:
      - 政策收紧直接推导全部类别全面受益
      - 行业需求增长直接推导个股收益
    proxy_policy: allowed_but_must_discount_confidence
    evidence_gap_policy: 任一关键中介缺失时降级为条件判断或暂不可判断
    downgrade_rule_if_not_met: insufficient
    evidence_profile_refs: [EP-INTEGRATED-01]
    md_section: "5"

path_design:
  main_paths:
    - path_id: P-01
      name: 现行管制到国产设备商业兑现主路径
      description: 从规则范围和执行强度出发，穿透海外可得性、中国设备支出、国产验证复购、交付验收到类别和公司分化
      linked_judgment_units: [JU-01, JU-02, JU-03, JU-04]
      nodes:
        - node_id: N-01
          name: 现行规则与执行
          role: start
          question: 哪些设备、实体、最终用途和许可规则当前已经生效并实际执行
          required_state_variables: [SV-01, SV-08]
          required_instance_requirements: [IR-01]
          required_evidence_requirements: [ER-01, ER-02]
          failure_action: stop
        - node_id: N-02
          name: 海外设备实际可得性
          role: precondition
          question: 目标类别的设备、备件和服务是否真实收缩而非仍可许可供货
          required_state_variables: [SV-02]
          required_instance_requirements: [IR-02]
          required_evidence_requirements: [ER-03]
          failure_action: downgrade
        - node_id: N-03
          name: 中国设备需求池
          role: transmission
          question: 晶圆厂投资和设备支出是否在未来十二个月维持可争取需求
          required_state_variables: [SV-03]
          required_instance_requirements: [IR-03]
          required_evidence_requirements: [ER-04]
          failure_action: downgrade
        - node_id: N-04
          name: 国产验证与复购
          role: transmission
          question: 国产设备是否从首台和验证转为重复订单与跨线复制
          required_state_variables: [SV-04, SV-07]
          required_instance_requirements: [IR-04]
          required_evidence_requirements: [ER-05, ER-06]
          failure_action: switch_path
        - node_id: N-05
          name: 经营兑现与受益分化
          role: outcome
          question: 收入、毛利、验收和服务能力是否支持类别与公司强弱差异
          required_state_variables: [SV-05, SV-07]
          required_instance_requirements: [IR-05]
          required_evidence_requirements: [ER-06, ER-07]
          failure_action: downgrade
    - path_id: P-02
      name: 上游受限与周期回落反向路径
      description: 管制也可能限制国产设备关键部件和软件，同时中国设备支出高位回落会抵消替代窗口
      linked_judgment_units: [JU-03, JU-04]
      nodes:
        - node_id: N-06
          name: 国产整机上游依赖
          role: precondition
          question: 关键零部件、软件和技术服务是否因管制限制国产整机稳定交付
          required_state_variables: [SV-06]
          required_instance_requirements: [IR-06]
          required_evidence_requirements: [ER-08]
          failure_action: stop
        - node_id: N-07
          name: 反向约束后的净效应
          role: validation
          question: 政策窗口、资本开支和上游受限的合并净效应如何改变行业逻辑
          required_state_variables: [SV-03, SV-05, SV-06, SV-08]
          required_instance_requirements: [IR-03, IR-05, IR-06]
          required_evidence_requirements: [ER-02, ER-04, ER-07, ER-08]
          failure_action: downgrade
  weakening_conditions:
    - condition_id: W-01
      statement: 中国设备支出在未来十二个月持续下修且国内客户扩产和技术升级项目推迟
      linked_paths: [P-01]
      distinguish_evidence: [ER-04]
      effect_on_04: 核心结论降为条件判断
    - condition_id: W-02
      statement: 国产设备收入增长但毛利、验收周期或现金质量明显恶化
      linked_paths: [P-01]
      distinguish_evidence: [ER-07]
      effect_on_04: 降低受益强度并重排类别和公司
  blocking_conditions:
    - condition_id: B-01
      statement: 国产设备关键零部件、软件或服务受限导致无法持续交付或通过客户再验证
      linked_paths: [P-02]
      distinguish_evidence: [ER-08]
      effect_on_04: 对受影响类别停止正向推导
    - condition_id: B-02
      statement: 规则大范围许可化或海外成熟制程设备供给恢复使替代紧迫性显著下降
      linked_paths: [P-01]
      distinguish_evidence: [ER-02, ER-03]
      effect_on_04: 政策增量路径被阻断
  competing_explanations:
    - explanation_id: CE-01
      statement: 国产设备增长主要由AI、存储和中国晶圆厂资本开支周期驱动而非出口管制升级
      distinguish_from_main_path: 比较受限和非受限类别、政策时点、设备支出与公司产品结构
      required_evidence: [ER-03, ER-04, ER-06]
      effect_on_04: 保留周期贡献并限制政策归因
    - explanation_id: CE-02
      statement: 份额提升来自低价导入或政策采购但未形成利润和现金质量
      distinguish_from_main_path: 比较收入、毛利、研发费用、验收和经营现金
      required_evidence: [ER-07]
      effect_on_04: 将逻辑从份额转向经营质量

