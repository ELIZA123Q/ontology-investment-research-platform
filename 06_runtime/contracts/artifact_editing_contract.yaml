schema_name: artifact_editing_contract
schema_version: 1.0.0
status: active

purpose: >-
  约束研究员对结构化中间制品的直接编辑、确认、版本冲突与下游重算，
  使工作台不是纯对话界面，同时禁止 UI 绕过专业证据链和 Runtime 状态机。

edit_request:
  required: [artifact_id, expected_version, changes]
  concurrency: optimistic_lock
  conflict_status: 409
  patch_scope: top_level_fields_declared_by_ui_surface_editable_fields

editable_artifacts:
  judgment:
    fields_when_evidence_sufficient: [statement, confidence, changeConditions]
    fields_when_evidence_insufficient: [changeConditions]
    after_edit: [supersede_pending_judgment_approval, create_new_judgment_confirmation, invalidate_descendants]
  report:
    fields: [summary, boundary]
    after_edit: [invalidate_descendants, queue_deterministic_audit]

non_editable_by_generic_patch:
  - evidence_fact
  - source_snapshot
  - formal_claim
  - ontology_object
  - task_graph_nodes
reason: >-
  证据与正式语义对象只能通过 Source Capture、Verifier 或 Ontology Action 变更；
  计划节点调整必须重新经过 PlannerProposal Compiler，不能做普通字段 PATCH。

milestone_approvals:
  - kind: plan_confirmation
    pauses_before: task_execution
  - kind: evidence_confirmation
    condition: evidence_sufficient
    pauses_before: judgment
  - kind: judgment_confirmation
    condition: judgment_disposition_review_required
    pauses_before: report_composition

invariants:
  - 每次编辑创建同一 artifact_id 的新版本，历史版本不可覆盖。
  - 业务 Artifact 与对应 UiSurface 必须在同一数据库事务中创建新版本。
  - expected_version 必须等于当前最新版本；冲突时不得自动合并或最后写入者覆盖。
  - editable_fields 是确定性白名单；Agent 与前端不得自行扩大。
  - 暂不可判断的 Judgment 不能通过直接编辑升级为 supported，只能修改改判条件。
  - Judgment 修改后必须重新人工确认，下游 Report 与 Audit 才能继续。
  - 被新版本取代的审批必须拒绝迟到决策并返回冲突，不能重新排队旧版本。
  - Report 修改后必须重新运行确定性 Claim/引用审计。
  - artifact.edited 与 artifact.recompute_queued 必须写入 append-only Event。

runtime_mapping:
  store_revision: 06_runtime/src/runtime/store.ts#reviseArtifact
  orchestration: 06_runtime/src/runtime/kernel.ts#reviseArtifact
  http_api: 06_runtime/app/vnext/artifacts/[id]/route.ts#PATCH
  trusted_surface: 06_runtime/app/components/surface-registry.tsx
  milestone_pause: 06_runtime/src/runtime/kernel.ts#requestMilestoneApproval

verification:
  tests:
    - 06_runtime/tests/store.test.ts
    - 06_runtime/tests/kernel.test.ts
  commands: [npm_test, npm_run_typecheck, npm_run_build]
