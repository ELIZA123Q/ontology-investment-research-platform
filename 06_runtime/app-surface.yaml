schema_name: app_surface_registry
schema_version: 3.0.0
status: active
source_of_truth: 06_runtime/app
workbench_url: http://127.0.0.1:3000
routes:
  - path: /api/v2/health
    file: 06_runtime/app/api/v2/health/route.ts
  - path: /api/v2/research-cases
    file: 06_runtime/app/api/v2/research-cases/route.ts
  - path: /api/v2/research-cases/{id}
    file: 06_runtime/app/api/v2/research-cases/[id]/route.ts
  - path: /api/v2/research-cases/{id}/events
    file: 06_runtime/app/api/v2/research-cases/[id]/events/route.ts
  - path: /api/v2/research-cases/{id}/commands
    file: 06_runtime/app/api/v2/research-cases/[id]/commands/route.ts
  - path: /api/v2/artifacts/{id}
    file: 06_runtime/app/api/v2/artifacts/[id]/route.ts
  - path: /api/v2/connectors/ingest
    file: 06_runtime/app/api/v2/connectors/ingest/route.ts
  - path: /
    file: 06_runtime/app/page.tsx
  - path: /research/{id}
    file: 06_runtime/app/research/[conversationId]/page.tsx
  - path: /ontology/objects/{type}/{id}/actions
    file: 06_runtime/app/ontology/objects/[type]/[id]/actions/route.ts
  - path: /ontology/actions/{actionType}/preview
    file: 06_runtime/app/ontology/actions/[actionType]/preview/route.ts
  - path: /ontology/actions/{actionType}/apply
    file: 06_runtime/app/ontology/actions/[actionType]/apply/route.ts
  - path: /ontology/action-executions/{id}
    file: 06_runtime/app/ontology/action-executions/[id]/route.ts
  - path: /ontology/research-cases/{id}/graph
    file: 06_runtime/app/ontology/research-cases/[id]/graph/route.ts
notes:
  - 首页仅创建和查看公司研究案例，工程对象不作为主导航。
  - 研究工作台按非线性决策脊柱展示范围、证据、KPI、模型、判断、估值、报告与审计。
  - UI 只消费 Case Snapshot，状态、门槛和编辑权限来自 04–05 投影。
  - Ontology/Agent/Skill/Tool/Eval 不作为研究员主导航。
  - 正式语义写入只能经过 Ontology Action preview/apply 接口。
  - 制品编辑只能通过 /api/v2/research-cases/{id}/commands，并要求 expectedVersion 和 idempotencyKey。
  - 关键证据和 Judgment 会暂停等待研究员确认；报告编辑后自动重新审计。
  - 研究员材料通过独立抽屉结构化录入来源、发布主体、原文定位与摘录；不能用聊天文本绕过 SourceSnapshot 和 evidence_confirmation。
  - 计划面展示受治理的章节级方法蓝图；报告面展示 MethodApplication、方法输入事实数量和缺口。
