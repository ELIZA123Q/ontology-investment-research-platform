document_type: research_quality_metrics
schema_version: 1.3.0
purpose: >
  研究质量评测的核心指标。终点命中与研究质量分开评价：命中预期终点只说明方向未明显走错，
  不能自动说明证据充分、推理可复核、交付可直接使用。不以统一生成 05 或 PUBLISHABLE 为充分/必要条件。

separation_of_checks:
  endpoint_hit:
    meaning: 实际判断终点是否与评审参考预期一致（或落在可接受终点集合内）
    alone_not_sufficient: true
  research_quality:
    meaning: 六项核心指标 + 硬失败检查；决定 overall 是否通过
    note: 终点命中且六项全“通过”才可能直接通过；终点命中但存在实质证据/交付缺口时应为修改后通过或不通过。

grade_scale:
  - 通过: 没有实质性问题
  - 轻微问题: 不影响主要结论，仅文字/排版/次要表述，可简单修改
  - 明显问题: 影响判断质量或可复核性，需要返工；总体不得直接标为通过
  - 失败: 偷换问题、无证据结论、忽略反证、错误发布或强度越权
  - 不适用: 仅用于 evaluation_status=not_yet_eligible 的未启用任务；不计入指标分母

scoring_notes_rule: >
  六项说明必须能证明逐项检查：至少点出（1）哪条证据支持哪项判断，
  （2）路径在哪个环节成立或断开，（3）至少一项关键反证及其裁决，
  （4）相对 evaluation_scope 是否缺必需产物。禁止多题复用同一套空泛套话。

core_metrics:
  - metric_id: 问题保持
    evaluates: 有没有偷换对象、范围、时间和最终要回答的问题
    look_at:
      - 01 需求合同与原始用户问题
      - 04 判断简报首句与主结论
      - 05 标题/首页（若 evaluation_scope 要求）
    grade_guide:
      通过: 对象、时间、范围、问题意图一致
      轻微问题: 措辞漂移但不改变研究主线
      明显问题: 范围扩大或收窄改变了可回答问题
      失败: 偷换核心对象或核心问题

  - metric_id: 证据支撑
    evaluates: 重要判断是否有真正能够支持它的证据，且可复核
    look_at:
      - 04 关键观点与 03 准入证据的对应
      - 评审参考「最低证据锚点」的必须确认 / 可接受代理 / 必须声明缺口
      - 来源、日期、原文定位或等价可追溯信息是否足以让第三方复核
    grade_guide:
      通过: 重要判断均有合格证据支撑，关键锚点已覆盖且可复核
      轻微问题: 次要表述证据偏弱但已标明；不影响阶段/方向主结论
      明显问题: 重要判断主要依赖单侧不可独立核验来源、缺关键引用定位，或缺口未按要求声明却仍支撑结论
      失败: 决定性结论没有证据

  - metric_id: 推理成立
    evaluates: 从证据到结论的中间路径是否成立
    look_at:
      - 路径分段、中介节点、时滞与阻断条件
      - 是否跳步或用叙事补机制
    grade_guide:
      通过: 路径可复核，弱点已说明
      轻微问题: 个别次要环节论证偏薄
      明显问题: 关键中介缺失仍当作全链成立
      失败: 关键路径不成立却输出主结论

  - metric_id: 反证处理
    evaluates: 是否主动寻找并正确处理反向证据与竞争解释
    look_at:
      - 评审参考中「若未处理则不得通过」的关键反证是否被触及并裁决
      - 冲突是否入账并影响强度
    grade_guide:
      通过: 至少写明一项关键反证及其裁决结果；其余重要反证已识别
      轻微问题: 次要反证遗漏但不改主结论边界
      明显问题: 重要反证轻描淡写
      失败: 明确反证被忽略

  - metric_id: 判断强度
    evaluates: 是否把方向判断说成确认，或在证据不足时强行下结论
    look_at:
      - 实际判断强度与证据/路径条件是否匹配
      - 是否走错终点（该争议/阻断/暂不可判断/削弱/01退回却强行确认）
      - 是否落在评审参考「结论边界」内
    grade_guide:
      通过: 强度与边界匹配，该降级则降级
      轻微问题: 个别措辞略强但整体克制
      明显问题: 多处强度上浮
      失败: 超出证据强度表达，或错误发布

  - metric_id: 交付可用性
    evaluates: 在 evaluation_scope 规定的终点产物范围内，研究员是否可直接使用
    by_endpoint:
      成立或条件成立: 结论、依据、边界、跟踪项是否能直接使用
      争议: 分歧来源、两侧证据和消解条件是否清楚
      暂不可判断: 缺什么证据、如何补证、何时可改判是否清楚
      阻断: 缺失对象、关系、变量及返回环节是否明确
      削弱: 相对原命题削弱了什么、依据是什么、还剩什么可保留
      01退回: 为什么不能受理、用户需要补充或拆分什么
    grade_guide:
      通过: 范围内产物可直接使用或仅需措辞润色
      轻微问题: 需小幅补充边界或跟踪项
      明显问题: 终点对了但缺少 scope 内必需产物或关键可复核附件，仍需较大返工
      失败: 产物不可用，或把错误终点当作成品交付
    note: >
      是否因缺少完整 05 扣分，完全取决于该题 evaluation_scope.required_artifacts。
      不得事后临时决定；未列入 required_artifacts 的阶段产物不得扣分。
      不得因“没有完整 05”自动降低阻断/暂不可判断/争议/01退回的交付可用性。

operational_records:
  note: 保留记录，不纳入质量总分
  items:
    - record_id: 运行时间与成本
      fields: [wall_clock_minutes, human_minutes, model_or_tool_cost_cny]
    - record_id: 增量更新复用程度
      applicable_when: run_type == 增量更新
      fields: [可继承结构清单, 实际复用说明, 是否不必要全量重做]
    - record_id: 独立审阅
      fields: [independence_status, independent_reviewer_id, independent_review_ref]
      note: self_check 仅作内部基线，不得当作正式独立评测结论。

hard_fail_conditions:
  description: 出现任意一项，本次评测直接不通过。
  items:
    - 偷换核心问题
    - 关键事实错误
    - 决定性结论没有证据
    - 应阻断时仍强行发布
    - 明确反证被忽略
    - 超出证据强度表达
    - 走错终点
    - 核心判断落在轮廓之外且无合理分歧依据
    - 信息截止日穿越（使用截止日后信息）

evaluation_status:
  scored: active 且信息截止日已到，正式进入质量评分
  not_yet_eligible: planned 或截止日未到；overall 必须为 null；核心指标一律「不适用」；不进入通过率分母
  note: 不得把「正确识别为未启用」记成六项通过或 overall=暂不启用。

overall_decision:
  levels:
    - 通过: >
        evaluation_status=scored；无硬失败；终点命中（或落在可接受终点内）；
        核心结论、证据链、反证与判断强度均无实质缺口；六项仅为通过或文字/排版类轻微问题。
        终点命中本身不足以构成通过。
    - 修改后通过: >
        evaluation_status=scored；无硬失败；终点基本正确；
        但存在关键引用缺失、scope 内必需产物缺失、样本/客户侧边界不清、
        或一类重要反证处理不足等实质缺口（通常对应至少一项明显问题）。
        本级表示“返工后可过”，不是“已返工验收通过”。
    - 不通过: >
        触发硬失败；任一项失败；两项及以上明显问题；走错终点；
        证据无法支持结论；强度越权；忽略决定性反证；截止日穿越；
        或应停止却继续推理。
  statistics_rule: >
    通过率分母仅含 evaluation_status=scored 的任务。
    锚定基线题（T01/T02）可单独报告，不与盲测/新题混报为“泛化通过率”。
    self_check 评分须在纪要中标明，不得表述为独立审阅结论。
