document_type: research_value_eval_suite
schema_version: 2.1.0
suite_id: RV-EVAL-PILOT-20260715
title: 研究价值代理评测体系四题校准试点
status: calibration_pilot
primary_outcomes: [R, U, delta]
guardrails: [S, C]
cases:
  - case_id: RV-T01
    path: cases/RV-T01/case.yaml
    stratum: report_value
  - case_id: RV-T02
    path: cases/RV-T02/case.yaml
    stratum: report_value
  - case_id: RV-T07
    path: cases/RV-T07/case.yaml
    stratum: restraint
  - case_id: RV-T08
    path: cases/RV-T08/case.yaml
    stratum: restraint
run_policy:
  intensity: formal_full
  judge_models: 2
  repetitions_per_judge: 3
  seeds: [11, 22, 33]
  prompt_variants: [A, B]
  candidate_order_balance: [D_first, baseline_first, D_first, baseline_first, D_first, baseline_first]
  reliability_threshold: R2
  suppress_suite_proxy_rate_below: C2
  no_composite_score: true
  generation_fairness:
    same_producer_model: true
    length_tolerance: 0.15
    same_max_output_tokens: true
    same_generation_count: true
    similar_temperature: true
    note: 主对比基线与系统产物必须同证据、同生产模型族、相近长度与token预算；仅控制长度±15%不足。
contexts:
  A: 原始问题（弱基线，观察裸模型）
  B: 原始问题与冻结证据包（原始材料能力）
  C: 原始问题与同证据直接生成报告（主对比基线，不使用02/03/04流程）
  D: 原始问题与系统允许的最终产物
  E: 原始问题、系统产物与关键冻结证据（诊断信息上限）
pairwise_baselines:
  same_evidence_direct: 同证据条件下直接生成完整报告（主对比）
  evidence_summary: 同证据条件下普通摘要稿（主对比）
weak_baselines:
  question_only: 仅根据问题直答（弱基线，不得作为流程价值主证据）
pilot_light_profile:
  note: 首轮区分能力时可选用轻量配置；正式发布仍用formal_full。
  repetitions_per_judge: 1
  skip_contexts: [A, E]
  skip_weak_baseline_pairwise: true
  defer_wilson_on_secondary_metrics: true
  keep:
    - C校准（缺陷、错杀、关键扰动）
    - 两评测模型独立裁决
    - U复述、更新、跟踪
    - delta相对同证据直出与摘要
    - S模型分歧与候选顺序
expansion_gate:
  calibration_minimum: C2
  sealed_independence_minimum: dual_route_independent
  case_mix_required:
    - 正常成功案例
    - 诱导失败案例（写得好但主判断错）
    - 边界越级案例
  note: 试点通过后按冻结证据与双轨密封契约准备度扩展；不得把四题结果外推为系统研究可靠率。
future_expert_review:
  required_for_pilot: false
  target_sample_rate: [0.05, 0.10]
  fields: [reviewer_id_hash, blind_case_id, R, U, hardest_error, rationale, reviewed_at]
  current_status: not_collected
