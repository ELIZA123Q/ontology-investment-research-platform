    new_information: 三类产品价格、订单和库存连续两个季度同步转弱，新增合格供给同时兑现。
    expected_action: reopen_question
    affected_claims: [T08-C1, T08-C2]
  - scenario_id: T08-U2
    new_information: 只有消费端NAND转弱，HBM和服务器DRAM订单仍强。
    expected_action: maintain_abstention
    affected_claims: [T08-C1, T08-C2]
downstream_required_units:
