    statement: 当前证据不足以给出三类产品的统一结束月份。
    criticality: primary
    strength_ceiling: R3
    minimum_evidence_basket: [T08-E01, T08-E02, T08-E03]
  - claim_id: T08-C2
    statement: 三类产品与应用节奏不同步，单一价格或产能节点不能外推全体。
    criticality: primary
    strength_ceiling: R3
    minimum_evidence_basket: [T08-E01, T08-E02, T08-E04]
  - claim_id: T08-C3
    statement: 2027年附近的供给节点只是验证窗口，不是已确认的周期结束日。
    criticality: boundary
    strength_ceiling: R3
    minimum_evidence_basket: [T08-E03]
allowed_disagreements:
  - 可对未来共同窗口的宽度有不同估计，但不能编造单一月份。
strongest_counterevidence:
  - 若未来跨产品价格、订单、库存和合格供给连续同步转弱，统一窗口可能变得可讨论。
