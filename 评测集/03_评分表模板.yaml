document_type: research_quality_scorecard
schema_version: 1.3.0
# 复制到 04_评测结果/EVAL-Txx-YYYYMMDD.yaml 后填写。
# 评分前先完成运行；评分时再打开任务卡「评审参考」。
# 终点命中与研究质量分开填；planned / 未到期任务用 not_yet_eligible，勿写入虚假通过。

evaluation_status: scored  # scored | not_yet_eligible

metadata:
  eval_task_id: EVAL-Txx
  execution_id: ""
  scored_at: ""
  scorer_id: ""
  producer_id: ""
  artifact_dir: ""
  ontology_snapshot_ref: ""
  methodology_ref: ""
  evaluation_scope_applied:
    terminal_stage: ""
    required_artifacts: []

independence:
  independence_status: ""  # independent | self_check | unknown
  independent_reviewer_id: ""
  independent_review_ref: ""
  notes: ""

endpoint_check:
  expected_judgment_status: ""  # 成立 / 条件成立 / 争议 / 阻断 / 暂不可判断 / 削弱 / 01退回
  actual_endpoint: ""
  matched: null
  core_judgment_within_outline: null
  notes: ""
  # 终点命中 ≠ 研究质量通过

hard_fail:
  triggered: false
  items: []
  notes: ""

core_metrics:
  问题保持:
    结果: ""  # 通过 / 轻微问题 / 明显问题 / 失败 / 不适用
    说明: ""  # 须任务特定，禁止空泛套话
  证据支撑:
    结果: ""
    说明: ""  # 须点出关键锚点或缺口
  推理成立:
    结果: ""
    说明: ""  # 须点出路经哪一段成立/断开
  反证处理:
    结果: ""
    说明: ""  # 至少写明一项关键反证及其裁决
  判断强度:
    结果: ""
    说明: ""
  交付可用性:
    结果: ""
    说明: ""  # 对照 evaluation_scope；未要求的产物不得扣分

evidence_audit:
  # 最小可复核信息；正式评测建议填满。self_check 试跑至少填 notes。
  checked_items: []
  # 每项建议含: claim_or_fact / source_or_ref / as_of_or_publish_date / locator / supports_which_judgment / opened_by_scorer
  notes: ""

operational_records:
  运行时间与成本:
    wall_clock_minutes: null
    human_minutes: null
    model_or_tool_cost_cny: null
    说明: ""
  增量更新复用程度:
    applicable: false
    说明: ""

overall:
  结果: ""  # 通过 / 修改后通过 / 不通过；not_yet_eligible 时必须为 null
  主要问题: ""
  返工项: ""
  改进建议: ""
  reliability_note: ""  # 如：本卡为方法自检，非正式独立评测
