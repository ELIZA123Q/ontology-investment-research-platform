task_id: EVAL-T15
title: 代理订单指标下国产前道设备需求传导
task_status: active
dimensions:
  task_type: 传导路径
  evidence_state: 代理指标为主
  ontology_state: 弱覆盖
  report_type: 行业动态点评
  run_type: 首次运行
  expected_outcome: 条件成立
评测基线:
  ontology_snapshot_ref: ONTOLOGY-20260713
  methodology_ref: STAGE-01-05@20260713
任务输入:
  用户问题: 以 2025-12-31 前招标、中标、海关与渠道调研等公开信息为限，判断国产前道刻蚀/薄膜设备需求是否正在向设备商收入传导。请标明目前能证实到哪一步。
  对象: 国产前道刻蚀/薄膜设备：需求 → 订单代理 → 收入
  时间范围: 2025 年传导进展
  信息截止日: '2025-12-31'
  研究范围: 行业动态点评；传导路径条件判断。
  已知材料: 公开招标中标、海关与调研（截止日前）。
  可用信息范围: 信息截止日前公开信息；正式订单披露若缺失须基于可得信息判断并说明。
  特别约束:
  - 清楚区分招标/中标/验收/收入等环节
  - 不做个股买卖建议
  - 不得使用信息截止日之后的信息
评审参考:
  预期判断状态: 条件成立
  预期核心判断轮廓:
  - 须标明传导已证实到哪一节点、卡在哪一节点
  - 中标或框架协议不得直接写成收入已确认
  - 代理指标局限与可能的重复统计须说明
  允许的合理分歧:
  - 对“更接近验收还是收入确认”的判断可不同，只要不断点含糊
  - 对刻蚀与薄膜谁更领先可有不同排序
  必须识别的问题:
  - 传导断点在哪里
  - 代理指标能否支撑收入环节
  关键反证:
    若未处理则不得直接通过:
    - 中标取消
    - 框架未提货
    - 渠道重复统计
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - 订单或招投标等代理需求指标的来源与定义
    可接受代理:
    - 收入确认滞后的公开说明
    必须声明缺口:
    - 代理订单≠已确认收入；须声明时滞与转化风险
  不允许出现的结论: &id001
  - 仅凭中标确认收入传导已成立
  通过标准:
  - 条件成立 + 断点清楚
  - 反证处理
  - 强度克制
  结论边界:
    可接受终点:
    - 条件成立
    禁止表达: *id001
regression_group: capability
evaluation_scope:
  terminal_stage: '04'
  required_artifacts:
  - '04'
  note: 质量评测以判断简报为终点；不因缺少完整05扣分。
