task_id: EVAL-T10
title: 中芯国际国产湿电子化学品导入的阶段含义
task_status: active
dimensions:
  task_type: 事件影响
  evidence_state: 充分
  ontology_state: 弱覆盖
  report_type: 主题深度研究
  run_type: 首次运行
  expected_outcome: 条件成立
评测基线:
  ontology_snapshot_ref: ONTOLOGY-20260713
  methodology_ref: STAGE-01-05@20260713
任务输入:
  用户问题: 以 2025 年 12 月 31 日前关于中芯国际导入国产湿电子化学品的公开信息为限，判断该事件处于什么阶段，以及对国产湿电子化学品放量判断意味着什么。
  对象: 国产湿电子化学品在中芯国际的导入阶段
  时间范围: 事件发生至信息截止日的阶段判断
  信息截止日: '2025-12-31'
  研究范围: 事件影响与阶段判断；主题深度研究。
  已知材料: 公司/产业链公开公告与报道（截止日前）。
  可用信息范围: 信息截止日前公开信息
  特别约束:
  - 阶段判断须有公开依据
  - 不做个股目标价或买卖建议
  - 不得使用信息截止日之后的信息
评审参考:
  预期判断状态: 条件成立
  预期核心判断轮廓:
  - 须把事件定位到验证、小批量或规模采购等可区分阶段
  - 仅有导入/认证类公告时，不得等同于规模化放量已确认
  - 若放量证据不足，应保留条件并写明还需什么证据
  允许的合理分歧:
  - 对更接近小批量还是早期放量的措辞可不同，只要不越级到确认放量
  - 对后续跟踪指标选择可不同
  必须识别的问题:
  - 事件处于哪一阶段
  - 放量证据是否存在
  关键反证:
    若未处理则不得直接通过:
    - 仅试点线
    - 双供但不提升份额
    - 再认证风险
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - 国产湿电子化学品厂商侧导入/认证/供应类公开披露
    可接受代理:
    - 产业链报道（须标明非中芯官方口径）
    必须声明缺口:
    - 中芯官方份额、全产线覆盖或采购量拆解缺失时必须声明
    - 不得把供应商自我披露单独写成客户侧规模放量已确认
  不允许出现的结论: &id001
  - 仅凭导入公告确认规模化放量已成立
  通过标准:
  - 条件化结论落在轮廓内
  - 反证处理
  - 未越权升档
  结论边界:
    可接受终点:
    - 条件成立
    禁止表达: *id001
regression_group: capability
evaluation_scope:
  terminal_stage: '04'
