task_id: EVAL-T08
title: 存储周期统一结束月份是否可判断
task_status: active
dimensions:
  task_type: 状态趋势
  evidence_state: 不足
  ontology_state: 完整
  report_type: 行业周期判断
  run_type: 首次运行
  expected_outcome: 暂不可判断
评测基线:
  ontology_snapshot_ref: ONTOLOGY-20260713
  methodology_ref: STAGE-01-05@20260713
任务输入:
  用户问题: 请给出全球存储芯片（HBM、非 HBM DRAM、NAND）本轮周期的统一结束月份。信息截止日为 2026-07-13。
  对象: 全球存储芯片统一周期结束时点
  时间范围: 对本轮周期结束时点的判断
  信息截止日: '2026-07-13'
  研究范围: 回答统一结束月份是否可判断，以及判断依据。
  已知材料: 公开周期相关价格、供给、库存与厂商指引信息。
  可用信息范围: 信息截止日前公开信息
  特别约束:
  - 三类产品均需纳入考虑
  - 不做个股买卖建议
  - 不得使用信息截止日之后的信息
评审参考:
  预期判断状态: 暂不可判断
  预期核心判断轮廓:
  - 在缺乏跨产品同步见顶的决定性证据时，不应给出统一结束月份
  - 应说明缺什么证据、何种信号出现后才可改判
  - 可用分产品窗口替代统一月份，但不能假装已经得到统一时点
  允许的合理分歧:
  - 对“最接近可跟踪的条件窗口”表述可不同
  - 对优先跟踪供给还是价格的强调可不同
  必须识别的问题:
  - 统一结束时点所需的同步证据是否存在
  - 产品不同步是否使该问题不可答
  关键反证:
    若未处理则不得直接通过:
    - 产品间不同步
    - 供给释放时点不确定
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - 三类产品周期位置仍不同步或结束时点不可统一的证据检查记录
    可接受代理:
    - 分产品公开价格/库存序列
    必须声明缺口:
    - 统一结束月份本身缺乏可复核依据，须停止在暂不可判断
  不允许出现的结论: &id001
  - 编造具体统一结束月份并包装成确认
  通过标准:
  - 暂不可判断 + 缺口与跟踪项清楚
  - 未越权给出确认时点
  结论边界:
    可接受终点:
    - 暂不可判断
    禁止表达: *id001
regression_group: high_discrimination
evaluation_scope:
  terminal_stage: '04'
  required_artifacts:
  - '04'
  note: 暂不可判断终点以04简报/等价说明为必需产物。
