document_type: research_quality_task_card
schema_version: 1.3.0
task_id: EVAL-T03
title: 中际旭创一季报是否改写增长假设
task_status: active
dimensions:
  task_type: 假设更新
  evidence_state: 充分
  ontology_state: 完整
  report_type: 公司业绩点评
  run_type: 首次运行
  expected_outcome: 成立
评测基线:
  ontology_snapshot_ref: ONTOLOGY-20260713
  methodology_ref: STAGE-01-05@20260713
任务输入:
  用户问题: 以中际旭创 2026 年一季报及 2026 年 4 月 30 日前公开信息为限，判断业绩是否超预期，以及这是否改变“AI 光模块高景气支撑业绩”的原有增长假设。请区分需求景气、份额/产品结构与交付确认节奏。
  对象: 中际旭创（300308.SZ）
  时间范围: 2026 年一季度经营结果；对原假设的更新判断
  信息截止日: '2026-04-30'
  研究范围: 公司业绩点评；归因与假设更新；不做目标价或仓位建议。
  已知材料: 公司定期报告、业绩说明会/公开交流纪要（截止日前）、同业可比公开信息。
  可用信息范围: 信息截止日前公司与交易所公开披露及可核对的公开事实
  特别约束:
  - 必须先归因再更新假设
  - 不得使用 2026-04-30 之后的信息
  - 不做评级、目标价或买卖建议
评审参考:
  预期判断状态: 成立
  预期核心判断轮廓:
  - 须明确超预期是否存在，以及主要来自需求景气、份额/结构还是交付节奏
  - 须据此给出原增长假设维持、上修或局部修正的具体方向，不能只写“成立”二字
  - 若节奏因素占主导，不得把结论写成需求景气已被全面证实
  允许的合理分歧:
  - 对各驱动因素权重排序可不同，但须有证据对应
  - 对后续一至两个季度跟踪指标选择可不同
  必须识别的问题:
  - 超预期来源是景气还是节奏
  - 原增长假设应如何更新
  关键反证:
    若未处理则不得直接通过:
    - 交付提前确认导致的一次性抬升
    - 结构变化而无量的增长
    - 成本或 ASP 压力
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - 2026年一季报或同等正式披露中的收入/利润关键数字
    - 对超预期来源的归因依据
    可接受代理:
    - 管理层公开交流中对需求或订单的表述
    必须声明缺口:
    - 若分产品披露不足，须声明结构判断的边界
  不允许出现的结论: &id001
  - 未归因就宣称原假设已被全面证实
  - 给出评级、目标价或买卖建议
  通过标准:
  - 核心判断落在轮廓内，而非仅匹配终点标签
  - 重要判断有财报/公开信息支撑
  - 反证有处理
  结论边界:
    可接受终点:
    - 成立
    - 条件成立
    禁止表达: *id001
regression_group: capability
evaluation_scope:
  terminal_stage: '04'
  required_artifacts:
  - '04'
  note: 本题回归评测以04判断简报为终点；完整05非必需。若升为表达层基准题须改 scope。
