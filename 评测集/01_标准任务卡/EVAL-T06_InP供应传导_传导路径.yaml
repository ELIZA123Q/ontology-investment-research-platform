task_id: EVAL-T06
title: InP 供应约束向光芯片光模块传导
task_status: active
dimensions:
  task_type: 传导路径
  evidence_state: 充分
  ontology_state: 完整
  report_type: 主题深度研究
  run_type: 首次运行
  expected_outcome: 条件成立
评测基线:
  ontology_snapshot_ref: ONTOLOGY-20260713
  methodology_ref: STAGE-01-05@20260713
任务输入:
  用户问题: 以 2025 年 12 月 31 日前公开信息为限，判断 InP（磷化铟）供应或出口约束是否已经、或在可观察时滞内可能传导到光芯片与光模块的供给或交付。请按材料、芯片、模块分段说明。
  对象: InP 材料 → 光芯片 → 光模块
  时间范围: 截至信息截止日的已发生约束与可观察传导窗口
  信息截止日: '2025-12-31'
  研究范围: 传导路径判断；主题深度研究；不做统一买卖建议。
  已知材料: 公开贸易/政策线索、厂商供应说明、产业链公开报道（截止日前）。
  可用信息范围: 信息截止日前公开信息
  特别约束:
  - 分段说明材料到模块的传导，避免跳步
  - 若涉及公司影响须分化说明
  - 不得使用信息截止日之后的信息
评审参考:
  预期判断状态: 条件成立
  预期核心判断轮廓:
  - 须分别判断上游约束、中游暴露、下游兑现是否打通
  - 中间节点证据不足时不得宣称全链已确认传导
  - 须给出时滞、库存缓冲或替代等边界条件
  允许的合理分歧:
  - 对传导时滞的季度估计可不同
  - 对哪些模块厂商暴露更高可有不同排序
  必须识别的问题:
  - 上游约束事实是否成立
  - 中游暴露与下游兑现是否打通
  关键反证:
    若未处理则不得直接通过:
    - 库存缓冲
    - 材料/工艺替代
    - 需求侧吸收
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - InP 出口许可或供应约束的公开事实
    - 至少一段中游（光芯片/外延）暴露信号
    可接受代理:
    - 价格急涨或交期压力报道（标明代理）
    必须声明缺口:
    - 下游模块交付若无统一可复核中断统计，不得宣称全链确认
  不允许出现的结论: &id001
  - 无中介证据却宣称全链已传导确认
  通过标准:
  - 分段路径可复核并落在轮廓内
  - 反证与时滞有处理
  结论边界:
    可接受终点:
    - 条件成立
    禁止表达: *id001
regression_group: capability
