任务输入:
  用户问题: 承接 EVAL-T03 对中际旭创增长假设的判断，以 2026 年半年报及 2026 年 8 月 31 日前公开信息为限，判断原“AI 光模块高景气支撑业绩”命题是否仍然成立，或已被削弱/不再维持。
  对象: 中际旭创（300308.SZ）
  时间范围: 2026 年半年报相对一季报/原命题的更新
  信息截止日: '2026-08-31'
  研究范围: 公司业绩点评；命题维持、增强、削弱或不再维持。
  已知材料: EVAL-T03 已确认的问题结构与原命题；本窗口新财报与公开点评。
  可用信息范围: 继承未变结构；仅刷新截止日前公开披露。
  特别约束:
  - 记录继承项与变更项
  - 不得使用截止日后信息
  - 不做目标价或买卖建议
评审参考:
  预期判断状态: 削弱
  预期核心判断轮廓:
  - 启用本卡前，评审须先核对半年报相对 EVAL-T03 是否出现明确削弱信号（如指引下修、需求后移、此前超预期被证伪为节奏因素、毛利/订单明显走弱）
  - 若存在上述削弱信号，终点应为削弱或不再维持原命题，并说明削弱了哪一部分
  - 若半年报反而显著强化原命题，不得为了凑标签强行判削弱；应改标本卡后再评
  允许的合理分歧:
  - 削弱程度表述（部分削弱 vs 命题不再维持）可不同，但须对应证据
  - 对后续哪个验证窗口最关键可不同
  必须识别的问题:
  - 新财报是否削弱原命题
  - 哪些部分仍可保留
  关键反证:
    若未处理则不得直接通过:
    - 仍支持原命题的订单或指引证据
    - 一次性因素已消除后的需求证据
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - 半年报相对原增长命题的可核对增量事实
    可接受代理:
    - 管理层表述
    必须声明缺口:
    - 启用前须人工确认确有削弱信号；无削弱则不得为削弱而削弱
  不允许出现的结论: &id001
  - 忽视削弱信号仍照抄旧结论
  - 借机输出目标价
  通过标准:
  - 敢于承认削弱且落在轮廓内
  - 问题保持
  - 复用情况记入运行记录
  启用前检查: available_after 到达后，先人工确认半年报是否具备削弱信号；不具备则改标，不启用本卡硬逼削弱。
  结论边界:
    可接受终点:
    - 削弱
    禁止表达: *id001
