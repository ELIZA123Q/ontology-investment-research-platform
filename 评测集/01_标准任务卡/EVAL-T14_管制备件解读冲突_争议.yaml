document_type: research_quality_task_card
schema_version: 1.3.0
task_id: EVAL-T14
title: 管制文本对维修备件覆盖的冲突解读
task_status: active
dimensions:
  task_type: 事件影响
  evidence_state: 冲突
  ontology_state: 完整
  report_type: 事件点评
  run_type: 首次运行
  expected_outcome: 争议
评测基线:
  ontology_snapshot_ref: ONTOLOGY-20260713
  methodology_ref: STAGE-01-05@20260713
任务输入:
  用户问题: 同一份美国对华半导体设备相关管制文本，在 2025-03-31 前的公开材料中，对“是否覆盖某类设备维修备件”存在不同解读。近端产业影响应如何判断？备件是否已全面受限？
  对象: 维修备件是否落入管制范围
  时间范围: 规则文本公布后至信息截止日的近端影响
  信息截止日: '2025-03-31'
  研究范围: 事件点评；评估不同解读下的近端影响是否可确认。
  已知材料: 公开规则文本、官方 FAQ、公开法律/产业解读。
  可用信息范围: 信息截止日前公开文本与解读
  特别约束:
  - 不同公开解读都应纳入分析
  - 不做股价交易建议
  - 不得使用信息截止日之后的信息
评审参考:
  预期判断状态: 争议
  预期核心判断轮廓:
  - 在权威解读冲突且缺乏足以消解冲突的执行事实时，不得确认备件已全面受限或全面不受限
  - 须说明冲突双方是什么、争点在哪里、何种证据可消解
  - 若发现冲突已被官方执行口径或海关事实消解，才可离开争议终点，并在记分中说明
  允许的合理分歧:
  - 对哪一方解读更接近文本字面可有不同倾向，只要不假装冲突已消失
  - 对近端观察指标选择可不同
  必须识别的问题:
  - 公开解读是否冲突
  - 冲突是否已被执行事实消解
  关键反证:
    若未处理则不得直接通过:
    - FAQ 与产业/法律备忘冲突
    - 缺少海关/执法侧观察
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - 原始管制文本定位
    - 至少两组相互冲突的公开解读，并含可复核定位（FAQ条目/段落/页码或等价锚点）
    可接受代理:
    - 律师/产业备忘（须可追溯）
    必须声明缺口:
    - 执行层/海关消解证据是否存在的检查记录；无消解则保持争议
  不允许出现的结论: &id001
  - 在冲突未消解时确认备件全面受限或全面不受限
  通过标准:
  - 终点为争议（除非有消解证据）
  - 两侧解读入账
  结论边界:
    可接受终点:
    - 争议
    禁止表达: *id001
regression_group: high_discrimination
evaluation_scope:
  terminal_stage: '04'
  required_artifacts:
  - '04'
  note: 争议题以04判断简报为终点；须含可复核的冲突文本定位。
