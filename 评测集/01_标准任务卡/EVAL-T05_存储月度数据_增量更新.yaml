title: 存储价格月度数据对原周期判断的增量更新
task_status: planned
dimensions:
  task_type: 状态趋势
  evidence_state: 充分
  ontology_state: 完整
  report_type: 行业动态点评
  run_type: 增量更新
  expected_outcome: 条件成立
available_after: '2026-08-15'
base_task_ref: EVAL-T01
评测基线:
  ontology_snapshot_ref: ONTOLOGY-20260713
  methodology_ref: STAGE-01-05@20260713
任务输入:
  用户问题: 在 EVAL-T01（或示例1）已有分产品周期判断基础上，纳入 2026 年 7 月中旬至 8 月 15 日期间新增的公开价格、出货与库存信息后，原结论应上修、维持还是削弱？请说明继承项与变更项。
  对象: 全球存储芯片（HBM / 非HBM DRAM / NAND），承接 EVAL-T01
  时间范围: 相对 EVAL-T01 的月度增量窗口
  信息截止日: '2026-08-15'
  研究范围: 行业动态点评；只回答增量是否改变原判断。
  已知材料: EVAL-T01/示例1 已确认的问题结构；本窗口新增公开产业数据。
  可用信息范围: 继承未变的问题结构；刷新本窗口公开信息。
  特别约束:
  - 记录继承项与变更项
  - 不得静默扩大到个股或新赛道
  - 不得使用信息截止日之后的信息
评审参考:
  预期判断状态: 条件成立
  预期核心判断轮廓:
  - 须明确哪些原结论可继承、哪些被本月数据改动
  - 单月波动不得直接升格为周期阶段切换确认
  - 仍须保持分产品，不得借增量合并三类产品
  允许的合理分歧:
  - 对“维持”与“小幅上修/削弱”的措辞边界可不同
  - 对哪一类产品信号更强可有不同强调
  必须识别的问题:
  - 单月波动 vs 趋势信号
  - 哪些结论可继承
  关键反证:
    若未处理则不得直接通过:
    - 单月噪声
    - 基数效应
    - 产品结构扭曲
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - 相对 EVAL-T01 的新增月度价格/库存公开数据
    可接受代理:
    - 厂商更新指引
    必须声明缺口:
    - 若增量不足以改判，须明确维持原条件边界
  不允许出现的结论: &id001
  - 借增量更新改写原核心问题
  - 无增量证据却大幅改判
  通过标准:
  - 终点为条件成立且落在轮廓内
  - 问题保持
  - 复用情况记入运行记录
  结论边界:
    可接受终点:
    - 条件成立
    禁止表达: *id001
