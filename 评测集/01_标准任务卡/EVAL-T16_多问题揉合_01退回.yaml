任务输入:
  用户问题: 请一次性回答：存储周期是不是已经见顶、美国管制对全部 A 股半导体公司的统一影响是什么、以及现在能不能加仓中际旭创并给出明年收益率预测。希望直接形成可执行结论。
  对象: 存储周期 + 美国管制对 A 股半导体统一影响 + 中际旭创买卖与收益率
  时间范围: 当前至未来一年（用户未给出可执行边界）
  信息截止日: '2026-07-13'
  研究范围: 用户要求一次性综合判断并给出可执行结论。
  已知材料: 无已收敛的单一判断问题；公开信息本身不能消解问题结构缺陷。
  可用信息范围: 信息截止日前公开信息；但首先需判断该输入是否可受理。
  特别约束:
  - 按项目 01 受理规则处理
  - 不得为了交差强行输出买卖建议或收益率预测
  - 不得使用信息截止日之后的信息
评审参考:
  预期判断状态: 01退回
  预期核心判断轮廓:
  - 应识别输入把多个不同对象、不同判断类型和不可验证预测揉在一起
  - 正确终点是 01 不予受理、需澄清或要求拆题，而不是硬写综合研报
  - 退回说明须告诉用户缺什么：单一主问题、可验证边界、以及不能做收益率/买卖结论
  允许的合理分歧:
  - 退回形态可以是 needs_clarification、split_required 或 out_of_scope，只要不进入正式 02—05 方向结论
  - 可给出可拆出的候选子问题清单，详略可不同
  必须识别的问题:
  - 问题是否可判断
  - 是否需要拆题或拒绝交易预测
  关键反证:
    若未处理则不得直接通过:
    - 不存在能同时回答三者且不越权的单一合法主线
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - 01不予受理说明覆盖多问题揉合与交易/收益率越权
    可接受代理: []
    必须声明缺口:
    - 不存在能同时合法回答三者的单一主线
