title: 管制是否改写国产设备替代逻辑
task_status: active
dimensions:
  task_type: 假设更新
  evidence_state: 充分
  ontology_state: 完整
  report_type: 主题深度研究
  run_type: 首次运行
  expected_outcome: 条件成立
anchor_example: 示例2
评测基线:
  ontology_snapshot_ref: ONTOLOGY-20260713
  methodology_ref: STAGE-01-05@20260713
任务输入:
  用户问题: 截至信息截止日已生效的美国对华半导体设备出口管制，在未来 12 个月内是否改变中国半导体设备国产替代逻辑的成立条件、兑现路径与类别受益结构？
  对象: 中国半导体设备行业（按设备类别分化）
  时间范围: 已生效规则存量 + 未来 12 个月兑现窗口
  信息截止日: '2026-07-10'
  研究范围: 假设更新：政策约束如何传导到验证、复购与类别受益；不评个股目标价。
  已知材料: 公开管制文本、产业验证与订单公开信息。
  可用信息范围: 信息截止日前公开政策与产业信息
  特别约束:
  - 不得把尚未生效规则当作当前事实
  - 优先看设备验证与订单等产业通道，不讨论短期股价
  - 不得使用信息截止日之后的信息
评审参考:
  预期判断状态: 条件成立
  预期核心判断轮廓:
  - 不能把管制直接等同于国产替代无条件加速
  - 须区分供给缺口、验证/复购与跨线复制等兑现环节
  - 须给出类别或部件约束下的分化，而不是全行业单一受益
  允许的合理分歧:
  - 对未来 12 个月哪一类设备兑现更快可有不同排序
  - 对部件瓶颈影响幅度可保留区间
  必须识别的问题:
  - 管制冲击与商业兑现之间存在中介环节
  - 类别与部件约束会导致分化
  关键反证:
    若未处理则不得直接通过:
    - 关键部件瓶颈
    - 验证通过不等于放量
    - 类别间兑现差异
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - 管制规则或实体清单的可核对增量/约束事实
    - 至少一类设备或替代路径的分化证据
    可接受代理:
    - 产业订单/验证节奏的公开报道（须标明代理属性）
    必须声明缺口:
    - 若缺少细分设备份额，不得写成全面替代已确认
  不允许出现的结论: &id001
  - 管制升级直接等于投资逻辑全面强化且无条件
  通过标准:
  - 假设更新而非事件复述
  - 核心判断落在轮廓内
  - 反证已处理
  结论边界:
    可接受终点:
    - 条件成立
    禁止表达: *id001
