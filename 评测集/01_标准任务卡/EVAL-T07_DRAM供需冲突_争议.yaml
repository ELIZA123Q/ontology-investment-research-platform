document_type: research_quality_task_card
schema_version: 1.3.0
task_id: EVAL-T07
title: DRAM 涨价与库存回升冲突下的景气判断
task_status: active
dimensions:
  task_type: 状态趋势
  evidence_state: 冲突
  ontology_state: 完整
  report_type: 行业周期判断
  run_type: 首次运行
  expected_outcome: 争议
评测基线:
  ontology_snapshot_ref: ONTOLOGY-20260713
  methodology_ref: STAGE-01-05@20260713
任务输入:
  用户问题: 以 2025 年上半年公开信息为限：非 HBM DRAM 报价与部分出货出现改善的同时，渠道或厂商库存也出现回升。全球非 HBM DRAM 是否已经进入可持续的景气改善阶段？
  对象: 全球非 HBM DRAM
  时间范围: 2025H1 状态判断
  信息截止日: '2025-06-30'
  研究范围: 行业周期判断；需综合价格、出货与库存等公开信息。
  已知材料: 公开报价、出货与库存报道。
  可用信息范围: 信息截止日前公开产业信息
  特别约束:
  - 价格/出货与库存两侧公开信息都应纳入分析
  - 不做个股买卖建议
  - 不得使用信息截止日之后的信息
评审参考:
  预期判断状态: 争议
  预期核心判断轮廓:
  - 在涨价/出货改善与库存回升同时成立且未裁决前，不得确认已进入可持续景气改善
  - 须说明冲突双方证据及其对阶段判断的含义
  - 可保留“改善信号存在但可持续性未确认”的争议表述
  允许的合理分歧:
  - 更偏向补库解释或更偏向需求改善解释，只要双方证据都处理
  - 对后续哪一两个验证指标最关键可不同
  必须识别的问题:
  - 两侧证据冲突是否已被权威数据消解
  - 补库/填货是否构成竞争解释
  关键反证:
    若未处理则不得直接通过:
    - 缺货后的主动补库
    - 涨价但需求未同步
    - 渠道压货
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - 支持景气改善的一侧公开证据
    - 支持库存回升/压力的冲突侧公开证据
    可接受代理:
    - 价格与库存的产业二手汇总（须双侧都有）
    必须声明缺口:
    - 冲突未消解时不得输出单边确认景气
  不允许出现的结论: &id001
  - 冲突未处理却确认景气切换成立
  通过标准:
  - 终点为争议且轮廓满足
  - 未强行发布方向确认
  结论边界:
    可接受终点:
    - 争议
    禁止表达: *id001
regression_group: high_discrimination
evaluation_scope:
  terminal_stage: '04'
  required_artifacts:
  - '04'
  note: 质量评测以判断简报为终点；不因缺少完整05扣分。
