title: 代理指标下的中国成熟制程稼动率趋势
task_status: active
dimensions:
  task_type: 状态趋势
  evidence_state: 代理指标为主
  ontology_state: 弱覆盖
  report_type: 行业动态点评
  run_type: 首次运行
  expected_outcome: 条件成立
评测基线:
  ontology_snapshot_ref: ONTOLOGY-20260713
  methodology_ref: STAGE-01-05@20260713
任务输入:
  用户问题: 以 2025 年 9 月 30 日前可获得的公开信息为限，判断中国大陆成熟制程晶圆代工稼动率是否呈现回升。可用信息包括但不限于用电、硅片出货、设备利用率调研等公开材料。
  对象: 中国大陆成熟制程晶圆代工稼动率
  时间范围: 2025 年截至三季度的趋势判断
  信息截止日: '2025-09-30'
  研究范围: 行业动态点评；说明判断依据、局限与可验证条件。
  已知材料: 公开宏观/产业序列与调研摘要（截止日前）。
  可用信息范围: 信息截止日前公开信息；若直接稼动率披露缺失，需基于可得信息作判断并说明依据。
  特别约束:
  - 清楚区分直接观测与间接推断
  - 不做个股买卖建议
  - 不得使用信息截止日之后的信息
评审参考:
  预期判断状态: 条件成立
  预期核心判断轮廓:
  - 若主要依赖代理指标，结论强度不得超过代理所能支持的范围
  - 须说明代理偏差、滞后或样本问题
  - 不得把代理指标写成已确认的官方稼动率事实
  允许的合理分歧:
  - 对回升幅度的表述可不同
  - 对哪一类代理更可信可有不同权重
  必须识别的问题:
  - 直接稼动率数据是否可得
  - 代理指标能支持到什么强度
  关键反证:
    若未处理则不得直接通过:
    - 用电含非晶圆负荷
    - 硅片出货含库存效应
    - 调研样本偏误
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - 所用代理指标的定义与来源
    - 代理与稼动率之间的映射假设
    可接受代理:
    - 设备/耗材/开工类公开代理
    必须声明缺口:
    - 无官方稼动率时必须声明代理局限
  不允许出现的结论: &id001
  - 把代理指标写成已确认的官方稼动率事实
  通过标准:
  - 条件成立且代理限制清楚
  - 反证有处理
  - 强度未升格为确认
  结论边界:
    可接受终点:
    - 条件成立
    禁止表达: *id001
