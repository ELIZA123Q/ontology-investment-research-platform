评测基线:
  ontology_snapshot_ref: ONTOLOGY-20260713
  methodology_ref: STAGE-01-05@20260713
任务输入:
  用户问题: 回放至 2024-06-30：仅使用当时可得的公开信息，判断当时 DRAM 与 NAND 分别处于什么周期位置。事后实际走势如需讨论，必须与“当时判断”分开记录。
  对象: 全球 DRAM / NAND（2024 年中视角）
  时间范围: 截至 2024-06-30 的当时状态判断
  信息截止日: '2024-06-30'
  研究范围: 历史回放；形成当时信息边界内的周期位置判断。
  已知材料: 截止日前公开价格、库存、厂商指引等。
  可用信息范围: 严格限制在信息截止日前公开信息
  特别约束:
  - 不得把截止日之后才知道的事实写入当时判断输入
  - 事后验证与原判断必须分开
  - 分产品判断 DRAM 与 NAND
评审参考:
  预期判断状态: 成立
  预期核心判断轮廓:
  - 须给出 2024 年中时点 DRAM、NAND 各自大致周期位置（例如去库存/底部修复/价格已改善但仍受限等，以当时公开证据为准）
  - 判断必须能被截止日前证据支持，不能用后见之明改写
  - DRAM 与 NAND 若当时已有分化，须写明，不得强行合并
  允许的合理分歧:
  - 对“底部修复”与“早周期回升”等邻近阶段用词可不同
  - 对当时主导变量（库存 vs 价格）强调可不同
  必须识别的问题:
  - 当时信息边界内周期位置是否可成立
  - 是否混入后见事实
  关键反证:
    若未处理则不得直接通过:
    - 后来才出现的供给冲击（不得进入原判断）
    - 后来的价格坍塌（不得进入原判断）
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - 仅使用 ≤2024-06-30 的公开信息的证据清单
    可接受代理:
    - 当时厂商指引与价格报道
    必须声明缺口:
    - 任何截止日后信息不得进入判断
  不允许出现的结论: &id001
  - 用 2024-06-30 之后的信息证明当时就该如何判断
  通过标准:
  - 当时判断落在轮廓内且可复核
  - 无后见混入
  结论边界:
    可接受终点:
    - 成立
    禁止表达: *id001
regression_group: high_discrimination
