title: 存储芯片分产品周期位置
task_status: active
dimensions:
  task_type: 状态趋势
  evidence_state: 充分
  ontology_state: 完整
  report_type: 行业周期判断
  run_type: 首次运行
  expected_outcome: 条件成立
anchor_example: 示例1
评测基线:
  ontology_snapshot_ref: ONTOLOGY-20260713
  methodology_ref: STAGE-01-05@20260713
任务输入:
  用户问题: 截至信息截止日，全球存储芯片中 HBM、非 HBM DRAM 与 NAND 分别处于什么供需与价格周期阶段？未来 6—24 个月哪些信号支持延续或转向？
  对象: 全球存储芯片（HBM / 非HBM DRAM / NAND）
  时间范围: 当前阶段定位 + 未来 6—24 个月条件窗口
  信息截止日: '2026-07-13'
  研究范围: 分产品周期位置、延续/转向条件；不做个股评级或买卖建议。
  已知材料: 公开产业数据、厂商指引、权威渠道价格与库存报道。
  可用信息范围: 信息截止日前公开披露与公开产业信息
  特别约束:
  - 必须分产品判断，不得用单一均值替代三类产品
  - 不做个股评级、目标价或仓位建议
  - 不得使用信息截止日之后的信息
评审参考:
  预期判断状态: 条件成立
  预期核心判断轮廓:
  - 三类产品应分开定位，不能合并为同一确认上行
  - 可对价格/订单可见度给出有证据的阶段性方向，但结束时点须保留条件或窗口
  - 须点出至少一类产品与其他产品的分化或不同步风险
  允许的合理分歧:
  - 对 2027H2—2028 供给释放时点的具体月份估计可不同
  - 对 NAND 消费端疲弱程度的表述强弱可不同
  必须识别的问题:
  - 三类产品周期位置可能不同步
  - 价格改善不等于周期已确认结束
  关键反证:
    若未处理则不得直接通过:
    - 消费端 NAND 仍弱
    - 未来合格新增供给窗口
    - 产品间不同步风险
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - HBM、非HBM DRAM、NAND 各自的价格或实现价公开序列/报道
    - 至少一类库存或交期类公开产业指标
    可接受代理:
    - 主要厂商指引或产能/供给相关公开说明
    必须声明缺口:
    - 若无法给出统一结束时点，须声明为条件窗口而非确认日
  不允许出现的结论: &id001
  - 给出无证据的统一结束日
  - 把三类产品写成同一确认上行
  通过标准:
  - 终点为条件成立，且核心判断落在轮廓内
  - 问题未被偷换成个股或交易建议
  - 关键反证有处理
  结论边界:
    可接受终点:
    - 条件成立
    禁止表达: *id001
