title: 2024年12月BIS管制公告近端影响
task_status: active
dimensions:
  task_type: 事件影响
  evidence_state: 充分
  ontology_state: 完整
  report_type: 事件点评
  run_type: 首次运行
  expected_outcome: 成立
评测基线:
  ontology_snapshot_ref: ONTOLOGY-20260713
  methodology_ref: STAGE-01-05@20260713
任务输入:
  用户问题: 以美国商务部工业与安全局（BIS）2024 年 12 月对华半导体相关出口管制规则增量及 2025 年 3 月 31 日前公开执行与产业反馈为限，判断未来 3—6 个月对国内晶圆厂设备可得性与国产设备订单节奏的可确认近端影响。
  对象: 2024-12 BIS 对华半导体出口管制规则增量
  时间范围: 公告后近端 3—6 个月
  信息截止日: '2025-03-31'
  研究范围: 事件点评；规则增量、近端产业影响与边界；不做股价交易建议。
  已知材料: 官方规则与 FAQ、公开交付/许可摩擦报道、产业公司公开说明（截止日前）。
  可用信息范围: 信息截止日前公开政策文本与公开产业信息
  特别约束:
  - 先确认相对既往规则的增量，再谈影响
  - 不得把市场情绪直接写成产业兑现
  - 不得使用信息截止日之后的信息
评审参考:
  预期判断状态: 成立
  预期核心判断轮廓:
  - 须先说明相对旧规的规则增量是否存在
  - 近端影响应落到设备可得性、许可/交付摩擦或订单节奏中的可观察项
  - 须给出影响边界（例如先进制程 vs 更广范围），不能写成无边界全面断供
  允许的合理分歧:
  - 对订单节奏变化幅度的定量区间可不同
  - 对哪些设备类别更敏感可有不同强调
  必须识别的问题:
  - 公告是否构成有效规则增量
  - 影响落点是可得性、许可还是订单预期
  关键反证:
    若未处理则不得直接通过:
    - 名义公告但相对旧规无实质增量
    - 影响主要限于先进制程
    - 短期情绪交易主导
    说明: 评分说明须至少点名其中一项及其裁决结果。
  最低证据锚点:
    必须确认:
    - 2024-12 BIS 规则相对旧规的可核对增量要点
    - 合规/生效时点
    可接受代理:
    - 截止日前近端产业/许可/交付反馈的公开报道
    必须声明缺口:
    - 不得把先进制程相关收紧外推为成熟制程全面断供
  不允许出现的结论: &id001
  - 未确认规则增量就断言全面断供
  - 输出买卖建议
  通过标准:
  - 事件事实与近端影响边界清楚，并落在轮廓内
  - 反证已处理
  结论边界:
    可接受终点:
    - 成立
    禁止表达: *id001
regression_group: capability
