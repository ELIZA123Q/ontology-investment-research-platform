document_type: research_value_metric_contract
schema_version: 2.0.0
no_composite_score: true
primary_outcomes:
  R:
    meaning: 冻结证据边界内核心判断是否值得相信
    levels:
      R0: 核心事实错误、无证据主结论、时间穿越或应弃答却强行确认
      R1: 证据或路径明显不足，只能作为待验证假设
      R2: 方向得到支持，但量化、范围、独立来源或反证仍有限制
      R3: 核心事实、最低证据组合、路径和反证均通过，表达未超过证据上限
    aggregation: 每次运行取主判断最低等级；六次裁决取保守中位数。
    probability: 六次案例裁决中R>=R2的比例，报告Wilson 90%区间；C<C2时抑制。
  U:
    meaning: 系统产物是否提升后续研究任务表现
    tasks:
      core_restatement: {threshold: 0.85, critical_misread_rate_max: 0.10}
      tracking_plan: {threshold: 0.80}
      information_update: {threshold: 0.75}
      research_questions: {threshold: 0.80}
    levels:
      U0: 无任务达到门槛，或出现致命误读
      U1: 一至两项任务达到门槛
      U2: 三项任务达到门槛且无致命误读
      U3: 四项任务均达到门槛且无致命误读
  delta:
    meaning: 系统产物相对问题直答、原始证据和普通摘要的增益
    outputs: [task_score_pp, error_reduction_rate, pairwise_win_rate, wilson_90_interval]
    provisional_gates:
      direct_report_win_rate_min: 0.60
      evidence_summary_win_rate_min: 0.55
      task_delta_must_be_positive: true
      errors_must_not_increase: true
guardrails:
  S:
    meaning: 模型、重复运行、提示表述和候选顺序变化下是否稳定
    levels:
      S3: 主要一致率至少80%，翻转率不高于10%，R跨度不超过一级
      S2: R一致率至少65%，下游一致率至少70%，翻转率不高于20%，无R0/R3对立
      S1: 存在明显模型或提示敏感性
      S0: 通过与失败基本对半，或出现R0/R3对立
  C:
    meaning: 评测器能否识别、定位并正确排序已知缺陷
    levels:
      C3: 严重缺陷召回至少90%，错杀不高于10%，排序至少90%，定位、严重度和裁决一致率至少80%
      C2: 严重缺陷召回至少80%，错杀不高于20%，排序至少80%，定位、严重度和裁决一致率至少70%
      C1: 缺陷召回至少60%，但不足以支持正式概率解释
      C0: 低于C1或评测隔离失效
diagnostics_only:
  reliability: [证据支撑, 推理成立, 反证处理, 判断强度]
  utility: [问题保持, 交付可用性]
  process: [终点命中, 截止日遵守, 模型角色隔离]
hard_failures:
  - 核心事实错误
  - 无来源核心判断
  - 主结论强度越级
  - 信息截止日穿越
  - 应争议或弃答却强行确认
  - 明确决定性反证被忽略
