document_type: sealed_adjudication_contract
schema_version: 1.0.0
case_id: RV-T02
not_a_reference_report: true
core_claims:
  - claim_id: T02-C1
    statement: 管制持续收紧，但属于分层、定向约束而非对中国设备需求的单一归零变量。
    criticality: primary
    strength_ceiling: R2
    minimum_evidence_basket: [T02-E01, T02-E02]
  - claim_id: T02-C2
    statement: 国产替代主逻辑未被逆转，但研究重点应转向按设备类别的商业兑现质量。
    criticality: primary
    strength_ceiling: R2
    minimum_evidence_basket: [T02-E02, T02-E03, T02-E04]
  - claim_id: T02-C3
    statement: 复购和批量订单比统一国产化率更能区分类别成熟度。
    criticality: primary
    strength_ceiling: R2
    minimum_evidence_basket: [T02-E03, T02-E04]
  - claim_id: T02-C4
    statement: 公司和设备类别之间不能由单一政策事件统一外推。
    criticality: boundary
    strength_ceiling: R3
    minimum_evidence_basket: [T02-E01, T02-E04]
allowed_disagreements:
  - 对具体设备类别排序可以不同，但必须给出复购、批量出货或客户验证依据。
  - 对政策约束强度可以不同，但不能从规则条目直接跳到收入结论。
strongest_counterevidence:
  - 上游受限部件与软件替代可能要求客户重新认证，拖慢交付或压缩毛利。
  - 高位设备需求可能包含扩产周期因素，不能全部归因于政策替代。
prohibited_expressions:
  - 所有国产设备公司同等受益
  - 管制条目增加直接导致国产设备收入同比增长
  - 用统一国产化率替代分设备商业成熟度
update_scenarios:
  - scenario_id: T02-U1
    new_information: 新规许可执行明显收紧，但某设备类别复购和收入确认没有同步改善。
    expected_action: differentiate
    affected_claims: [T02-C2, T02-C3]
  - scenario_id: T02-U2
    new_information: 多家客户重复采购同一国产设备，且交付毛利和验收周期稳定。
    expected_action: strengthen
    affected_claims: [T02-C3]
downstream_required_units:
  core_restatement: [政策状态, 需求平台, 类别分化, 商业兑现边界]
  tracking_plan: [许可执行, 晶圆厂资本开支, 重复订单, 收入确认, 部件与再认证]
  research_questions: [原厂复购, 晶圆厂验收, 专家部件约束与类别差异]

