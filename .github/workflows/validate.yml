name: Validate repository

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Install Python validation dependency
        run: python -m pip install -r governance/requirements.txt

      - name: Install Runtime dependencies
        run: npm --prefix runtime ci

      - name: Audit production dependencies
        run: npm --prefix runtime audit --omit=dev

      - name: Run engineering and contract validation
        run: python "governance/03_校验/validate_project.py"

      - name: Build Runtime
        run: npm --prefix runtime run build
