name: Validate repository

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: 06_runtime/package-lock.json

      - name: Install Python validation dependency
        run: python -m pip install -r 05_control_evaluation/requirements.txt

      - name: Install Runtime dependencies
        run: npm --prefix 06_runtime ci

      - name: Audit production dependencies
        run: npm --prefix 06_runtime audit --omit=dev

      - name: Run vNext engineering acceptance chain
        run: python 05_control_evaluation/04_verifiers/validate_project.py
