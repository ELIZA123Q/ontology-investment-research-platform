name: dynamic-research-dag

on:
  push:
    branches: [main, codex/dynamic-research-dag]
  pull_request:

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Provision locked dependencies
        run: uv sync --frozen
      - name: Run tests without network resolution
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SEMANTICA_PROGRESS: "false"
        run: uv run --frozen --offline pytest
      - name: Run architecture and graph validation without network resolution
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SEMANTICA_PROGRESS: "false"
        run: uv run --frozen --offline ir-platform validate
