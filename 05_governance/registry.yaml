schema_name: governance_domain_registry
schema_version: 1.0.0
status: active

authority:
  answers: Governance 总入口；子域见 rules/verifiers/evals/identity/permissions。
  write_entry: 05_governance/{rules,evals,verifiers,identity,permissions}/
  read_primary:
    - 05_governance/registry.yaml
    - 05_governance/11_rules/registry.yaml
    - 05_governance/15_verifiers/registry.yaml
    - 05_governance/14_evals/registry.yaml
    - 05_governance/12_identity/registry.yaml
    - 05_governance/13_permissions/registry.yaml

subdomains:
  rules:
    target: 05_governance/11_rules
    source: 05_governance/02_合同
    status: migrating
  verifiers:
    target: 05_governance/15_verifiers
    source: 05_governance/03_校验
    status: migrating
  evals:
    target: 05_governance/14_evals
    source: evaluation
    status: migrating
  identity:
    target: 05_governance/12_identity
    source: null
    status: migrating
  permissions:
    target: 05_governance/13_permissions
    source: 05_governance/02_合同/judgment_threshold_policy.yaml
    status: migrating

notes:
  - Verifier ≠ Eval。
  - 01_架构 / 05_元治理本体 仍属 governance，但不并入五子壳。
  - 旧路径 02_合同 / 03_校验 / evaluation 保留 compat 可读。
