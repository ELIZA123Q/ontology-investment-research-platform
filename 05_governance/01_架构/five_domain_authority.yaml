schema_name: five_domain_authority_index
schema_version: 2.0.0
status: active
architecture_principle: 确定性负责边界，Agent 负责路径

rule: |
  五域是后台职责边界，不决定产品导航、Agent 数量或任务必经步骤。
  Runtime 只能组合 typed Research Task Nodes；禁止恢复固定 01→05 controller。
  Agent/Skill/Tool 唯一可执行 manifest 位于 07_runtime/src/capabilities/registry.ts。

domains:
  semantic:
    registry: 01_semantic/registry.yaml
    write_entry: 01_semantic/
    read_primary:
      - 01_semantic/01_ontology/registry.yaml
      - 01_semantic/02_dictionary/registry.yaml
      - 01_semantic/03_knowledge_graph/registry.yaml
      - 01_semantic/04_evidence/registry.yaml
    runtime_contract: 07_runtime/src/semantic/graph-contracts.ts
  task:
    registry: 02_tasks/registry.yaml
    write_entry: 02_tasks/
    runtime_node_catalog: 07_runtime/src/runtime/node-catalog.ts
    runtime_planner: 07_runtime/src/runtime/planner.ts
    optional_template: 02_tasks/04_workflows/deep_research/
  capability:
    registry: 03_capabilities/registry.yaml
    write_entry: 03_capabilities/
    executable_manifest: 07_runtime/src/capabilities/registry.ts
    method_resources: 03_capabilities/05_method_libraries/
    mcp_registry: 03_capabilities/04_protocols/mcp/registry.yaml
  execution:
    registry: 04_execution/registry.yaml
    write_entry: 04_execution/
    kernel: 07_runtime/src/runtime/kernel.ts
    store: 07_runtime/src/runtime/store.ts
    worker: 07_runtime/src/worker.ts
    historical_workspace: 04_execution/03_workspace/
  governance:
    registry: 05_governance/registry.yaml
    write_entry: 05_governance/
    rules: 05_governance/11_rules/registry.yaml
    permissions: 05_governance/13_permissions/registry.yaml
    evals: 05_governance/14_evals/registry.yaml
    verifiers: 05_governance/15_verifiers/registry.yaml
    runtime_verifiers: 07_runtime/src/governance/verifiers.ts
  app:
    registry: 06_app/registry.yaml
    implementation: 07_runtime/app/
    workbench_url: http://127.0.0.1:3000

runtime_truth:
  persisted_business_objects:
    - Conversation
    - Task/TaskNode
    - Artifact
    - Event
    - Approval
    - MemoryRecord
  event_projections:
    - Message
    - Trace
  temporary_objects:
    - ContextPackage
  technical_recovery:
    - Checkpoint
    - RuntimeJob
    - ToolExecution
    - ModelCallCache

forbidden_legacy_patterns:
  - 07_runtime/agents
  - 07_runtime/skills
  - 07_runtime/workflow
  - 07_runtime/runner
  - 07_runtime/storage
  - .claude/skills/*/SKILL.md
  - fixed_stage_controller
  - duplicated_skill_body
