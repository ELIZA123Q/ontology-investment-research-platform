schema_name: ontology_v3_runtime_mapping
schema_version: 1.0.0
status: implemented
formal_ontology_version: 3.0.0
public_contract_version: 1.3.0
runtime_implementation_status: implemented
description: Ontology 3.0 与 Public Contract 1.3 的 Runtime 映射；MethodApplication、正式本体读取和运行操作注册表已实现。

mapping:
  ontology_objects: 07_runtime/adapters/ontology.ts
  external_data_profiles: 05_governance/02_合同/ontology_data_mapping_profiles.yaml
  external_data_profile_runtime: 07_runtime/src/semantic/graph-contracts.ts
  method_application: 07_runtime/src/runtime/kernel.ts
  runtime_operations: 05_governance/11_rules/runtime_operations.yaml
  evidence_wave: 02_tasks/04_workflows/deep_research/templates/evidence_wave.template.yaml
  invalidation_projection: 02_tasks/04_workflows/deep_research/templates/dependency_projection.template.yaml
  incremental_update_validator: 05_governance/03_校验/incremental_update.py

moved_legacy_resources:
  action_types:
    target: runtime_command_or_domain_service
    rule: 不作为本体类型暴露；执行结果必须写入运行实例或审计记录。
  functions:
    target: pure_function_or_adapter
    rule: 确定性、读写范围与副作用由 Runtime 类型约束。
  logic_flows:
    target: method_or_workflow_orchestrator
    rule: 研究方法进入 method_libraries，运行路径由 typed node catalog 与 planner 编译。

implemented_types:
  MethodApplication:
    source_contract: 05_governance/02_合同/public_contract.yaml#method_application_contract
    persistence: append-only per run
    identity: application_id
    status_transition: candidate -> selected -> executed | rejected | blocked | degraded
  InvalidationProjection:
    source_contract: 05_governance/02_合同/public_contract.yaml#object_validity_propagation
    requirement: 仅传播到关系图中可达的下游对象。
  IncrementalUpdate:
    source_contract: 05_governance/02_合同/public_contract.yaml#incremental_update_contract
    identity: update_id
    algorithm: changed_roots -> direct_impacts -> reachable stale closure -> affected stage subsets
    full_rerun_rule: 仅结构检查点命中时允许；普通证据更新局部优先
