schema_name: research_package_kinds
schema_version: 1.1.0
contract_version: 1.3.0
description: >
  研究知识与研究结果使用不同包类型。新工作台发布同时生产 formal_delivery_pack
  与 research_audit_pack；历史 formal_pack 只读兼容；
  workbench_export 仅作内部紧凑投影/回归；语义样例不得走正式中文命名包发现规则。
  routing_rules 是 detect_package_kind 的唯一路由权威。

kinds:
  formal_pack:
    schema_name: controlled_research_run_manifest
    schema_version: "1.3.0"
    layout: chinese_named_md_yaml
    validator: 05_governance/03_校验/validate_run.py
    discovery_markers:
      - "01-*投研需求说明-*.md"
    publishable: true
    generation_status: legacy_readonly
    notes: >
      研究员/发布主链；中文命名 MD + YAML。
      历史正式中文包；继续可读、可验证，但新运行不再生成。

  formal_delivery_pack:
    schema_name: formal_research_delivery_manifest
    schema_version: "1.0.0"
    layout: external_delivery
    validator: 07_runtime/engine/release_set.ts
    publishable: true
    generation_status: active
    notes: 对外交付；只含 05 正式报告、必要图表/表格、来源索引与简化知识溯源。

  research_audit_pack:
    schema_name: controlled_research_audit_manifest
    schema_version: "1.0.0"
    layout: internal_full_chain
    validator: 05_governance/03_校验/validate_run.py
    publishable: true
    generation_status: active
    contract_ref:
      schema_name: controlled_research_run_manifest
      schema_version: "1.3.0"
    notes: 内部审计；包含完整 01—05、证据快照、语义基线、交付副本与知识锁。

  knowledge_baseline:
    schema_name: portable_research_knowledge_manifest
    schema_version: "1.0.0"
    layout: portable_knowledge
    validator: 07_runtime/engine/knowledge_package.ts
    publishable: true
    notes: 完整正式知识基线；不得包含单次事实、证据、判断或报告。

  knowledge_task_slice:
    schema_name: portable_research_knowledge_manifest
    schema_version: "1.0.0"
    layout: portable_knowledge_subset
    validator: 07_runtime/engine/knowledge_package.ts
    publishable: false
    notes: 任务所需知识及依赖闭包；不得包含方法执行结果或研究结果。

  semantic_fixture:
    schema_name: controlled_research_run_manifest_v3
    schema_version: "1.0.0"
    layout: compact_v3_yaml
    validator: 05_governance/03_校验/validate_v3_samples.py
    discovery_markers:
      - 01_task.yaml
      - 02_structure.yaml
      - incremental_update.yaml
    publishable: false
    contract_ref:
      schema_name: controlled_research_run_manifest
      schema_version: "1.3.0"
    notes: Ontology 3.0 / Public Contract 1.3 黄金样例；紧凑 YAML，证明语义链而非发布排版。

  workbench_export:
    schema_name: controlled_research_run_manifest_workbench
    schema_version: "1.0.0"
    layout: compact_v3_yaml
    validator: 05_governance/03_校验/validate_workbench_package.py
    discovery_markers:
      - 01_task.yaml
      - 02_structure.yaml
      - package_kind.yaml
    publishable: false
    contract_ref:
      schema_name: controlled_research_run_manifest
      schema_version: "1.3.0"
    notes: >
      工作台紧凑投影/回归夹具。日常正式交付请走 formal_pack 导出；
      本类型仅供内部验收与 03_回归，不能替代正式中文命名包。

routing_rules:
  - if_manifest_package_kind_in: [formal_pack, formal_delivery_pack, research_audit_pack, knowledge_baseline, knowledge_task_slice, semantic_fixture, workbench_export]
  - if_manifest_schema_name: controlled_research_run_manifest
    then: formal_pack
  - if_manifest_schema_name: controlled_research_run_manifest_workbench
    then: workbench_export
  - if_manifest_schema_name: controlled_research_run_manifest_v3
    then: semantic_fixture
  - if_glob: "01-*投研需求说明-*.md"
    then: formal_pack
  - if_files_all: [01_task.yaml, 02_structure.yaml, package_kind.yaml]
    then: workbench_export
  - if_files_all: [01_task.yaml, 02_structure.yaml, incremental_update.yaml]
    then: semantic_fixture
  - if_files_all: [01_task.yaml, 02_structure.yaml]
    and_manifest_run_mode: workbench
    then: workbench_export
  - if_files_all: [01_task.yaml, 02_structure.yaml]
    then: semantic_fixture
