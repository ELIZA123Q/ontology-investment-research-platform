schema_name: ontology_evidence_wave
schema_version: 1.0.0
wave_id: "WAVE-<批次标识>"
wave_hash: ""
task_id: "<与 01/02 一致>"
run_id: "<与 run_manifest 一致>"
wave_status: frozen
frozen_at: "<ISO 8601>"
source_02_view_hash: "sha256:<02 task_context.view_hash>"

# 波次是一次冻结批次，不是单条来源。这里只保存正式证据对象引用。
evidence_refs: []

# delta 必须引用一级正式本体 Object / Relation；不允许在此定义业务变量。
ontology_deltas:
  - delta_id: "DELTA-01"
    operation: "<instantiate | revise | relate | retire>"
    resource_kind: "<object | relation>"
    ontology_ref: "<如 Observation、Signal、variableInfluencesVariable>"
    object_ref: "<本次实例或关系实例引用>"
    prior_object_ref: null
    evidence_refs: []
    affects_refs: []
    bindings:
      state_variable_refs: []
      hypothesis_refs: []
      path_refs: []
      judgment_unit_refs: []
      evidence_requirement_refs: []
      scope_refs: []
      competing_explanation_refs: []
      relation_type_refs: []
      object_type_refs: []

# 改变根问题、根范围、任务类型或判断落点会返回 01；其余结构变化返回 02。
task_contract_deltas: []

# 只允许 presentation./delivery./expression./stage_05. 前缀。
presentation_deltas: []
