profiles:
  memory_baseline:
    run_dir: 示例1-基线-20260713-1
    root_scope_ref: SCOPE-MEMORY-INDUSTRY
    scope_nodes:
      - {scope_ref: SCOPE-MEMORY-INDUSTRY, label: 全球存储芯片行业, parent_scope_ref: null, dimensions: {object: [memory_chip], geography: [global], customer: [all], metric: [demand_inventory_supply_price], time: [run_anchor_forward_6_24m]}}
      - {scope_ref: SCOPE-HBM, label: HBM, parent_scope_ref: SCOPE-MEMORY-INDUSTRY, dimensions: {object: [HBM]}}
      - {scope_ref: SCOPE-DRAM, label: 通用DRAM, parent_scope_ref: SCOPE-MEMORY-INDUSTRY, dimensions: {object: [commodity_DRAM]}}
      - {scope_ref: SCOPE-SERVER-DRAM, label: 服务器DRAM, parent_scope_ref: SCOPE-DRAM, dimensions: {object: [server_DRAM], customer: [server_customer]}}
      - {scope_ref: SCOPE-NAND, label: NAND, parent_scope_ref: SCOPE-MEMORY-INDUSTRY, dimensions: {object: [NAND]}}
      - {scope_ref: SCOPE-MEMORY-SUPPLY, label: 存储新增合格供给, parent_scope_ref: SCOPE-MEMORY-INDUSTRY, dimensions: {object: [qualified_memory_supply], metric: [capacity_yield_qualification]}}
    units:
      JU-01: {stable_claim_key: memory.industry.phase, scope_ref: SCOPE-MEMORY-INDUSTRY, role: parent}
      JU-02: {stable_claim_key: memory.hbm.phase, scope_ref: SCOPE-HBM, role: leaf}
      JU-03: {stable_claim_key: memory.dram.capacity_mechanism, scope_ref: SCOPE-DRAM, role: leaf}
      JU-04: {stable_claim_key: memory.nand.phase, scope_ref: SCOPE-NAND, role: leaf}
      JU-05: {stable_claim_key: memory.server_dram.price_phase, scope_ref: SCOPE-SERVER-DRAM, role: leaf, judgment_type: state_measurement}
      JU-06: {stable_claim_key: memory.supply.relief_window, scope_ref: SCOPE-MEMORY-SUPPLY, role: leaf, judgment_type: cycle_phase}
      JU-07: {stable_claim_key: memory.industry.end_window, scope_ref: SCOPE-MEMORY-INDUSTRY, role: leaf, judgment_type: cycle_phase}
    aggregation:
      aggregation_contract_ref: AGG-MEMORY-PHASE
      parent_judgment_unit_ref: JU-01
      required_child_judgment_unit_refs: [JU-02, JU-04, JU-05]
      dominant_child_judgment_unit_refs: []
    overall_claim_id: C-01
    parent_statement: 存储行业仍受供给约束，但 HBM、服务器 DRAM 与 NAND 的周期位置已经分化，不能生成统一阶段标签。
    claim_statement_overrides:
      C-05: 服务器 DRAM 历史价格上行已确认，但斜率放缓只支持高位消化观察。
    child_state_codes: {C-02: structural_expansion, C-04: enterprise_tight_consumer_weak, C-05: high_price_slope_watch}
    root_caveat: 分产品判断
    forbidden_pattern: 三类产品同步进入高位消化期

  memory_rerun:
    run_dir: 示例1
    inherits: memory_baseline
    overall_claim_id: C-01
    parent_statement: 存储行业仍受供给约束，但 HBM、服务器 DRAM 与 NAND 已进入内部高位分化，不能生成统一的高位消化阶段标签。
    claim_statement_overrides:
      C-05: 服务器 DRAM 涨价斜率放缓且部分美国 CSP 库存累积，只支持服务器 DRAM 高位消化观察。
    child_state_codes: {C-02: structural_expansion, C-04: enterprise_tight_consumer_weak, C-05: server_dram_digesting_watch}
    root_caveat: 内部高位分化
    forbidden_pattern: 存储芯片进入供给短缺下的高位消化期
    parent_profile: memory_baseline

  equipment_policy:
    run_dir: 示例2
    root_scope_ref: SCOPE-CN-SEMI-EQUIPMENT-THESIS
    scope_nodes:
      - {scope_ref: SCOPE-CN-SEMI-EQUIPMENT-THESIS, label: 中国半导体设备国产替代逻辑, parent_scope_ref: null, dimensions: {object: [cn_semiconductor_equipment], geography: [us_to_china], customer: [china_fabs], metric: [policy_supply_validation_commercialization], time: [forward_12m]}}
      - {scope_ref: SCOPE-EXPORT-CONTROL, label: 美国出口管制规则, parent_scope_ref: SCOPE-CN-SEMI-EQUIPMENT-THESIS, dimensions: {object: [export_control], metric: [rule_scope_enforcement]}}
      - {scope_ref: SCOPE-COMMERCIAL-REALIZATION, label: 国产设备商业兑现, parent_scope_ref: SCOPE-CN-SEMI-EQUIPMENT-THESIS, dimensions: {object: [domestic_equipment], metric: [validation_repurchase_profit]}}
      - {scope_ref: SCOPE-EQUIPMENT-CATEGORIES, label: 设备类别与公司分化, parent_scope_ref: SCOPE-CN-SEMI-EQUIPMENT-THESIS, dimensions: {object: [equipment_categories_companies], metric: [maturity_quality]}}
    units:
      JU-01: {stable_claim_key: equipment.policy.constraint, scope_ref: SCOPE-EXPORT-CONTROL, role: leaf}
      JU-02: {stable_claim_key: equipment.commercial.realization, scope_ref: SCOPE-COMMERCIAL-REALIZATION, role: leaf}
      JU-03: {stable_claim_key: equipment.category.differentiation, scope_ref: SCOPE-EQUIPMENT-CATEGORIES, role: leaf}
      JU-04: {stable_claim_key: equipment.thesis.overall, scope_ref: SCOPE-CN-SEMI-EQUIPMENT-THESIS, role: parent}
    aggregation:
      aggregation_contract_ref: AGG-EQUIPMENT-THESIS
      parent_judgment_unit_ref: JU-04
      required_child_judgment_unit_refs: [JU-01, JU-02, JU-03]
      dominant_child_judgment_unit_refs: []
    overall_claim_id: C-04
    parent_statement: 现行管制不会逆转国产替代主逻辑，但政策约束、类别成熟度与商业兑现并不同步，未来十二个月应输出结构分化而非同步受益。
    claim_statement_overrides: {}
    child_state_codes: {C-01: targeted_constraint, C-02: conditional_realization, C-03: maturity_differentiation}
    root_caveat: 所有类别同步兑现
    forbidden_pattern: 所有国产设备类别同步受益
