schema_name: ontology_reasoning
schema_version: 2.0.0
status: active
depends_on: [common.yaml, semantic.yaml, evidence.yaml]
description: 判断推理域的 Object、Relation、Action 及 Function、Logic、Rule 定义。

object_types:
  StateVariable:
    id: StateVariable
    name: 状态变量
    description: 可持续观察、比较或推导的业务维度。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 变量名称。}
      valueType: {type: enum, required: true, allowed_values: [number, boolean, category, text], description: 状态变量的值类型。}
      unit: {type: string, required: false, description: 变量单位。}
      measurementDefinition: {type: string, required: true, description: 观测或计算口径。}
      variableKind: {type: enum, required: true, allowed_values: [observed, derived, qualitative], description: 状态变量的形成方式。}
      semanticRefs: {type: array, required: false, description: 变量关联的语义对象。}
  Observation:
    id: Observation
    name: 观测
    description: 状态变量在特定业务时间的读数或明确来源估算。
    primary_key: id
    title_property: id
    validity: true
    properties:
      value: {type: any, required: true, description: 观测值。}
      unit: {type: string, required: false, description: 与变量口径一致的单位。}
      observedAt: {type: datetime, required: true, description: 业务观测时间。}
      valueStatus: {type: enum, required: true, allowed_values: [actual, estimate], description: 观测值是实际值或估算值。}
      evidenceRefs: {type: array, required: true, description: 支撑观测的证据。}
  Event:
    id: Event
    name: 研究事件
    description: 已发生或正在发生、能够影响研究对象或状态变量的外部事实。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 事件名称。}
      eventType: {type: string, required: true, description: 事件类别。}
      occurredAt: {type: datetime, required: true, description: 事件业务时间。}
      semanticRefs: {type: array, required: false, description: 事件关联的语义对象。}
      evidenceRefs: {type: array, required: true, description: 支撑事件的证据。}
  Hypothesis:
    id: Hypothesis
    name: 假设
    description: 对状态变量方向、条件和时间尺度的可证伪判断。
    primary_key: id
    title_property: statement
    validity: true
    properties:
      statement: {type: string, required: true, description: 可验证的假设陈述。}
      direction: {type: enum, required: true, allowed_values: [increase, decrease, stable, uncertain], description: 假设方向。}
      timeHorizon: {type: string, required: true, description: 假设适用时间尺度。}
      conditions: {type: array, required: false, description: 假设成立条件。}
      falsificationConditions: {type: array, required: true, description: 可使假设失效的条件。}
      premiseStatements: {type: array, required: false, description: 研究员明确声明但尚未被事实验证的前提或情景假设。}
  Signal:
    id: Signal
    name: 信号
    description: 对假设或判断起支持、跟踪、催化、削弱或阻断作用的信息。
    primary_key: id
    title_property: statement
    validity: true
    properties:
      statement: {type: string, required: true, description: 信号内容。}
      role: {type: enum, required: true, allowed_values: [support, catalyst, track, weaken, block], description: 信号对目标的作用角色。}
      strength: {type: enum, required: false, allowed_values: [low, medium, high], description: 信号强度。}
      observedAt: {type: datetime, required: true, description: 信号对应的业务时间。}
      evidenceRefs: {type: array, required: true, description: 支撑信号的证据。}
  Judgment:
    id: Judgment
    name: 判断
    description: 基于假设和信号形成的分级研究结论。
    primary_key: id
    title_property: statement
    validity: true
    properties:
      statement: {type: string, required: true, description: 判断内容。}
      judgmentLevel: {type: enum, required: true, allowed_values: [J0, J1, J2, J3, J4], description: 判断强度；仅事实和当前状态允许 J4。}
      judgmentStatus: {type: enum, required: true, allowed_values: [normal, weakened, contested], description: 判断状态，不参与强度排序。}
      claimMode: {type: enum, required: true, allowed_values: [unconditional, conditional], description: 判断是否依赖必须保留的显式条件。}
      targetClaimType: {type: enum, required: true, allowed_values: [historical_fact, current_state, causal_inference, directional_outlook, forecast, conditional_scenario], description: 判断主张类型。}
      conditions: {type: array, required: true, description: 条件性判断的成立条件；无条件判断为空数组。}
      scope: {type: object, required: true, description: 判断适用的时间、对象、地域和口径范围。}
      timeHorizon: {type: string, required: true, description: 判断适用时间尺度。}
      confidence: {type: enum, required: true, allowed_values: [low, medium, high, unknown], description: 判断置信度。}
      uncertainty: {type: array, required: true, description: 未解决的不确定性。}
      semanticRefs: {type: array, required: true, description: 判断关联的语义对象。}
  MarketExpectation:
    id: MarketExpectation
    name: 市场预期
    description: 特定截面下市场、管理层、研究者或价格隐含的预期。
    primary_key: id
    title_property: statement
    validity: true
    properties:
      statement: {type: string, required: true, description: 预期内容。}
      expectationType: {type: enum, required: true, allowed_values: [consensus, management, sell_side, buy_side_internal, researcher, price_implied, user_provided], description: 预期形成主体或类别。}
      expectationOwner: {type: string, required: true, description: 预期持有者、发布主体或形成主体。}
      expectationBasis: {type: string, required: true, description: 预期所依据的口径、数据、指引、模型或价格信号。}
      asOf: {type: datetime, required: true, description: 预期截面时间。}
      timeHorizon: {type: string, required: true, description: 预期适用时间尺度。}
      expectedValue: {type: any, required: false, description: 可结构化时记录预期值。}
      evidenceRefs: {type: array, required: true, description: 预期来源证据。}
  ExpectationGap:
    id: ExpectationGap
    name: 预期差
    description: 判断与特定预期在同一比较口径和时间尺度上的差异。
    primary_key: id
    title_property: statement
    validity: true
    properties:
      statement: {type: string, required: true, description: 预期差的可读说明。}
      direction: {type: enum, required: true, allowed_values: [above, below, aligned, incomparable], description: 判断相对预期的方向。}
      magnitude: {type: any, required: false, description: 可结构化时记录差异幅度。}
      comparisonBasis: {type: string, required: true, description: 用于比较的指标、口径或叙事依据。}
      asOf: {type: datetime, required: true, description: 比较所采用的截面时间。}
      timeHorizon: {type: string, required: true, description: 预期差适用的时间尺度。}
  AssetImpact:
    id: AssetImpact
    name: 资产影响
    description: 判断相对预期可能对资产产生的方向性影响。
    primary_key: id
    title_property: statement
    validity: true
    properties:
      statement: {type: string, required: true, description: 资产影响说明。}
      direction: {type: enum, required: true, allowed_values: [positive, negative, neutral, uncertain], description: 资产影响方向。}
      timeHorizon: {type: string, required: true, description: 影响适用时间尺度。}
      pricedInAssessment: {type: enum, required: true, allowed_values: [unpriced, partially_priced, priced, unknown], description: 影响被市场定价的程度。}
      impactMechanism: {type: string, required: true, description: 判断经何种基本面、预期差或估值机制影响资产。}
      impactConfidence: {type: enum, required: true, allowed_values: [low, medium, high, unknown], description: 从判断映射到资产影响的置信度。}
      sensitivityVariableRefs: {type: array, required: false, description: 资产影响主要敏感的状态变量引用。}
      riskSignalRefs: {type: array, required: false, description: 可能削弱或阻断资产影响的信号引用。}
  Scenario:
    id: Scenario
    name: 情景
    description: 一组条件、假设、推理路径和失效条件构成的未来状态组合。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 情景名称。}
      scenarioType: {type: enum, required: true, allowed_values: [base, upside, downside, stress], description: 情景类型。}
      assumptions: {type: array, required: true, description: 情景关键假设。}
      ruleRefs: {type: array, required: true, description: 情景使用的 Rule 标识。}
      triggerConditions: {type: array, required: true, description: 进入该情景的条件。}
      invalidationConditions: {type: array, required: true, description: 情景失效条件。}
  RuleEvaluation:
    id: RuleEvaluation
    name: 规则评价
    description: 一次正式推理运行中，对特定 Rule、输入和条件的命中、未命中、阻断或错误结果记录。
    primary_key: id
    title_property: id
    validity: false
    properties:
      ruleRef: {type: string, required: true, description: 被评价的正式 Rule 标识。}
      ruleVersion: {type: string, required: true, description: 被评价规则的版本或内容指纹。}
      evaluatedAt: {type: datetime, required: true, description: 规则评价时间。}
      inputRefs: {type: array, required: true, description: 本次评价读取的语义、证据和推理实例引用。}
      conditionResults: {type: array, required: true, description: 各项成立、削弱或阻断条件的公开评价结果。}
      status: {type: enum, required: true, allowed_values: [matched, not_matched, blocked, error], description: 规则评价结果状态。}
      resultSummary: {type: string, required: true, description: 规则输出或不产生输出的业务说明。}
      outputRefs: {type: array, required: false, description: 规则评价产生或影响的推理实例引用。}
      evidenceRefs: {type: array, required: true, description: 支撑本次规则评价的证据引用。}
  ReasoningTrace:
    id: ReasoningTrace
    name: 推理留痕
    description: 一次判断从输入、规则和函数到输出的可复核记录。
    primary_key: id
    title_property: id
    validity: false
    properties:
      evaluatedAt: {type: datetime, required: true, description: 本次推理的评估时间。}
      inputRefs: {type: array, required: true, description: 使用的语义、证据和推理输入引用。}
      steps: {type: array, required: true, description: 按顺序保存的公开处理步骤及其资源引用。}
      ruleRefs: {type: array, required: true, description: 本次推理应用的 Rule 标识。}
      functionRefs: {type: array, required: false, description: 本次推理调用的 Function 标识。}
      logicRefs: {type: array, required: false, description: 本次推理采用的 Logic 标识。}
      outputRefs: {type: array, required: true, description: 本次推理产生的输出引用。}
      status: {type: enum, required: true, allowed_values: [complete, partial, failed], description: 推理留痕完整状态。}
  ValidationRecord:
    id: ValidationRecord
    name: 事后验证记录
    description: 在原始推理完成后，根据后续结果验证 Hypothesis、Judgment 或 AssetImpact 是否兑现，并保留偏差和修订建议。
    primary_key: id
    title_property: id
    validity: false
    properties:
      validatedAt: {type: datetime, required: true, description: 执行事后验证的系统时间。}
      result: {type: enum, required: true, allowed_values: [validated, partially_validated, falsified, still_uncertain], description: 事后验证结果。}
      outcomeSummary: {type: string, required: true, description: 后续真实结果或当前仍无法确认的情况说明。}
      deviationReasons: {type: array, required: false, description: 预期与实际结果存在偏差时的原因。}
      revisionRequired: {type: boolean, required: true, description: 是否建议修订本体规则、变量、关系或情景。}
      revisionNotes: {type: string, required: false, description: 建议修订的对象、原因和边界；不自动执行修改。}
      nextCheckpoint: {type: string, required: false, description: 结果仍不确定时的下一验证点。}

relation_types:
  variableAnchoredOn:
    id: variableAnchoredOn
    name: 变量挂载对象
    description: 变量挂到稳定研究对象上。
    source_types: [StateVariable]
    target_types: [Organization, Industry, Segment, Company, Product, Material, ProcessStep, Asset, Region, Application, PolicyInstrument]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  observationOf:
    id: observationOf
    name: 观测绑定变量
    description: 观测属于某状态变量。
    source_types: [Observation]
    target_types: [StateVariable]
    direction: directed
    cardinality: many_to_one
    evidence_required: true
    properties: {}
  evidenceGroundsReasoning:
    id: evidenceGroundsReasoning
    name: 证据支撑推理
    description: 证据作为观测、事件、预期或信号的依据；该消费关系由推理域拥有。
    source_types: [EvidenceClaim, EvidenceFact]
    target_types: [Observation, Event, MarketExpectation, Signal]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties:
      groundingRole: {type: enum, required: true, allowed_values: [source, support, weaken, block], description: 证据对推理输入的支撑角色。}
  eventAnchoredOn:
    id: eventAnchoredOn
    name: 事件挂载对象
    description: 事件关联研究对象。
    source_types: [Event]
    target_types: [Organization, Industry, Segment, Company, Product, Material, ProcessStep, Asset, Region, Application, PolicyInstrument]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties: {}
  eventAffectsVariable:
    id: eventAffectsVariable
    name: 事件影响变量
    description: 事件对变量产生影响。
    source_types: [Event]
    target_types: [StateVariable]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      direction: {type: enum, required: true, allowed_values: [increase, decrease, stable, uncertain], description: 事件对变量的影响方向。}
      mechanism: {type: string, required: true, description: 影响机制。}
      timeLag: {type: string, required: false, description: 影响滞后。}
  variableInfluencesVariable:
    id: variableInfluencesVariable
    name: 变量传导
    description: 状态变量之间可复用的传导关系。
    source_types: [StateVariable]
    target_types: [StateVariable]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      direction: {type: enum, required: true, allowed_values: [increase, decrease, stable, uncertain], description: 变量传导方向。}
      mechanism: {type: string, required: true, description: 传导机制。}
      conditions: {type: array, required: true, description: 传导成立条件。}
      timeLag: {type: string, required: false, description: 传导滞后。}
  hypothesisAbout:
    id: hypothesisAbout
    name: 假设绑定变量
    description: 假设讨论某状态变量。
    source_types: [Hypothesis]
    target_types: [StateVariable]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  hypothesisBasedOn:
    id: hypothesisBasedOn
    name: 假设依据
    description: 假设可由事件、观测或证据主张触发；该关系表示形成依据，不代表假设已经得到验证。
    source_types: [Hypothesis]
    target_types: [Event, Observation, EvidenceClaim]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties:
      basisRole: {type: enum, required: false, allowed_values: [trigger, premise, context], description: 依据在假设形成中的作用。}
  hypothesisCompetesWith:
    id: hypothesisCompetesWith
    name: 假设竞争解释
    description: 两个假设是对同一现象的替代解释，可能部分并存但需要比较解释力。
    source_types: [Hypothesis]
    target_types: [Hypothesis]
    direction: symmetric
    cardinality: many_to_many
    evidence_required: false
    properties:
      competitionBasis: {type: string, required: true, description: 两个假设竞争解释的对象、范围或原因。}
  hypothesisContradicts:
    id: hypothesisContradicts
    name: 假设相互矛盾
    description: 两个假设的方向、前提或可观察结果互不相容。
    source_types: [Hypothesis]
    target_types: [Hypothesis]
    direction: symmetric
    cardinality: many_to_many
    evidence_required: false
    properties:
      contradictionBasis: {type: string, required: true, description: 两个假设不能同时成立的原因。}
  signalEvaluates:
    id: signalEvaluates
    name: 信号评价
    description: 信号支持、跟踪、催化、削弱或阻断目标。
    source_types: [Signal]
    target_types: [Hypothesis, Judgment]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      role: {type: enum, required: true, allowed_values: [support, catalyst, track, weaken, block], description: 信号对目标的作用角色。}
  judgmentBasedOn:
    id: judgmentBasedOn
    name: 判断依据
    description: 判断基于一个或多个假设。
    source_types: [Judgment]
    target_types: [Hypothesis]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties: {}
  expectationAbout:
    id: expectationAbout
    name: 预期指向
    description: 预期所指的语义对象或状态变量。
    source_types: [MarketExpectation]
    target_types: [Organization, Industry, Segment, Company, Product, Material, ProcessStep, Asset, Region, Application, PolicyInstrument, StateVariable]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties: {}
  gapComparesJudgment:
    id: gapComparesJudgment
    name: 预期差比较判断
    description: 预期差引用被比较的研究判断。
    source_types: [ExpectationGap]
    target_types: [Judgment]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  gapComparesExpectation:
    id: gapComparesExpectation
    name: 预期差比较预期
    description: 预期差引用作为比较基准的市场预期。
    source_types: [ExpectationGap]
    target_types: [MarketExpectation]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  impactDerivedFrom:
    id: impactDerivedFrom
    name: 资产影响来源
    description: 资产影响来源于判断。
    source_types: [AssetImpact]
    target_types: [Judgment]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  impactOnAsset:
    id: impactOnAsset
    name: 影响作用资产
    description: 资产影响作用到某个资产。
    source_types: [AssetImpact]
    target_types: [Asset]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  impactReferencesGap:
    id: impactReferencesGap
    name: 资产影响引用预期差
    description: 资产影响引用其所依据的预期差。
    source_types: [AssetImpact]
    target_types: [ExpectationGap]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  scenarioIncludesHypothesis:
    id: scenarioIncludesHypothesis
    name: 情景包含假设
    description: 情景包含按路径组织的假设；使用的 Rule 由 Scenario.ruleRefs 引用。
    source_types: [Scenario]
    target_types: [Hypothesis]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties:
      sequence: {type: integer, required: false, description: 在情景路径中的顺序。}
  judgmentUnderScenario:
    id: judgmentUnderScenario
    name: 情景下判断
    description: 判断只在指定情景及其条件下成立。
    source_types: [Judgment]
    target_types: [Scenario]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  impactUnderScenario:
    id: impactUnderScenario
    name: 情景下资产影响
    description: 资产影响只在指定情景及其条件下成立，并应与来源判断的情景一致。
    source_types: [AssetImpact]
    target_types: [Scenario]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  ruleEvaluationTargets:
    id: ruleEvaluationTargets
    name: 规则评价目标
    description: 规则评价指向本次被评价或受评价结果约束的变量、假设、判断或情景。
    source_types: [RuleEvaluation]
    target_types: [StateVariable, Hypothesis, Judgment, Scenario]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties: {}
  traceIncludesRuleEvaluation:
    id: traceIncludesRuleEvaluation
    name: 推理留痕包含规则评价
    description: 推理留痕按顺序引用本次正式使用的规则评价实例。
    source_types: [ReasoningTrace]
    target_types: [RuleEvaluation]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties:
      sequence: {type: integer, required: true, description: 规则评价在公开推理步骤中的顺序。}
  traceForJudgment:
    id: traceForJudgment
    name: 推理留痕对应判断
    description: 推理留痕记录某条判断的形成过程。
    source_types: [ReasoningTrace]
    target_types: [Judgment]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  validationOf:
    id: validationOf
    name: 验证目标
    description: 事后验证记录指向被验证的假设、判断或资产影响。
    source_types: [ValidationRecord]
    target_types: [Hypothesis, Judgment, AssetImpact]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties: {}
  validationUsesOutcome:
    id: validationUsesOutcome
    name: 验证使用后续结果
    description: 事后验证使用后续观测、事件或事实候选作为结果依据。
    source_types: [ValidationRecord]
    target_types: [Observation, Event, EvidenceFact]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties: {}
  validationReferencesTrace:
    id: validationReferencesTrace
    name: 验证引用原始留痕
    description: 事后验证引用当时形成判断的原始推理留痕，但不得修改该留痕。
    source_types: [ValidationRecord]
    target_types: [ReasoningTrace]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties: {}

action_types:
  DefineStateVariable:
    id: DefineStateVariable
    name: 定义状态变量
    description: 定义可观察或可推导的变量口径。
    target_types: [StateVariable]
    parameters: [name, valueType, unit, measurementDefinition, variableKind, semanticRefs]
    preconditions: [语义锚点存在或适用范围明确]
    effects: [create_StateVariable]
    outputs: [StateVariable]
    rule_refs: [semantic_anchor_required]
    function_ref: null
    logic_refs: []
    write_scope: [StateVariable, variableAnchoredOn]
  LinkEvidenceToReasoning:
    id: LinkEvidenceToReasoning
    name: 连接证据与推理
    description: 在检查证据状态、新鲜度和目标类型后，创建证据到推理输入对象的支撑关系。
    target_types: [evidenceGroundsReasoning]
    parameters: [evidenceRef, reasoningRef, groundingRole, evaluationTime]
    preconditions: [证据有效、新鲜度允许且目标类型合法]
    effects: [create_evidenceGroundsReasoning]
    outputs: [relation_ref]
    rule_refs: [no_direct_evidence_to_judgment]
    function_ref: null
    logic_refs: [FreshnessEvaluationLogic, EvidenceGroundingLogic]
    write_scope: [evidenceGroundsReasoning]
  ComputeDerivedObservation:
    id: ComputeDerivedObservation
    name: 计算派生观测
    description: 按已声明口径计算派生变量在特定时点的观测值。
    target_types: [Observation]
    parameters: [variableRef, inputVariableRefs, inputObservationRefs, formula, observedAt, evidenceRefs]
    preconditions: [目标变量的 variableKind 为 derived，输入观测时间可比]
    effects: [create_Observation, create_observationOf]
    outputs: [Observation]
    rule_refs: [evidence_grounding_required, time_alignment]
    function_ref: ComputeDerivedVariable
    logic_refs: []
    write_scope: [Observation, observationOf]
  RecordObservation:
    id: RecordObservation
    name: 记录观测
    description: 记录变量在特定业务时间的读数或估算。
    target_types: [Observation]
    parameters: [variableRef, value, unit, observedAt, valueStatus, evidenceRefs]
    preconditions: [变量存在且证据可追溯]
    effects: [create_Observation, create_observationOf]
    outputs: [Observation]
    rule_refs: [evidence_grounding_required, time_alignment]
    function_ref: null
    logic_refs: []
    write_scope: [Observation, observationOf]
  RegisterEvent:
    id: RegisterEvent
    name: 登记研究事件
    description: 将有证据支撑的已发生事实登记为研究事件。
    target_types: [Event]
    parameters: [name, eventType, occurredAt, semanticRefs, evidenceRefs]
    preconditions: [证据支撑已发生事实]
    effects: [create_Event, create_eventAnchoredOn]
    outputs: [Event]
    rule_refs: [evidence_grounding_required, semantic_anchor_required]
    function_ref: null
    logic_refs: []
    write_scope: [Event, eventAnchoredOn]
  FormHypothesis:
    id: FormHypothesis
    name: 形成假设
    description: 围绕有语义锚点的状态变量形成可证伪假设；已有证据不是创建候选假设的前置条件。
    target_types: [Hypothesis]
    parameters: [statement, variableRef, direction, timeHorizon, conditions, falsificationConditions, basisRefs, premiseStatements]
    preconditions: [状态变量及其语义锚点存在，方向、时间尺度和证伪条件完整]
    effects: [create_Hypothesis, create_hypothesisAbout, create_hypothesisBasedOn_if_provided]
    outputs: [Hypothesis]
    rule_refs: [semantic_anchor_required, hypothesis_falsifiability_required, time_alignment]
    function_ref: null
    logic_refs: [HypothesisAdmissionLogic]
    write_scope: [Hypothesis, hypothesisAbout, hypothesisBasedOn]
  RecordSignal:
    id: RecordSignal
    name: 记录信号
    description: 记录对假设或判断产生作用的信号。
    target_types: [Signal]
    parameters: [statement, role, strength, observedAt, targetRef, evidenceRefs]
    preconditions: [目标存在且信号角色相容]
    effects: [create_Signal, create_signalEvaluates]
    outputs: [Signal]
    rule_refs: [signal_role_compatibility, evidence_grounding_required]
    function_ref: null
    logic_refs: []
    write_scope: [Signal, signalEvaluates]
  EvaluateHypothesis:
    id: EvaluateHypothesis
    name: 评价假设
    description: 汇总信号并检查证伪和阻断条件。
    target_types: [Hypothesis]
    parameters: [hypothesisRef, signalRefs, evaluationTime]
    preconditions: [信号可追溯且时间可比]
    effects: [update_Hypothesis_status]
    outputs: [hypothesisEvaluation]
    rule_refs: [blocking_signal_precedence, time_alignment]
    function_ref: AggregateSignals
    logic_refs: [HypothesisEvaluationLogic]
    write_scope: [Hypothesis]
  ApplyInferenceRule:
    id: ApplyInferenceRule
    name: 应用推理规则
    description: 对输入对象检查规则条件，并把正式推理使用的结果实例化为 RuleEvaluation。
    target_types: [RuleEvaluation]
    parameters: [ruleRef, ruleVersion, inputRefs, targetRefs, evidenceRefs, evaluationTime]
    preconditions: [前提和所需证据齐备]
    effects: [create_RuleEvaluation, create_ruleEvaluationTargets_if_provided]
    outputs: [RuleEvaluation]
    rule_refs: [variable_propagation_inference, rule_evaluation_trace_required]
    function_ref: EvaluateRuleCondition
    logic_refs: [RuleEvaluationLogic]
    write_scope: [RuleEvaluation, ruleEvaluationTargets]
  FormJudgment:
    id: FormJudgment
    name: 形成判断
    description: 基于假设、信号和证据形成分级判断。
    target_types: [Judgment]
    parameters: [hypothesisRefs, signalRefs, timeHorizon, uncertainty, scenarioRef]
    preconditions: [假设已评价且证据门槛明确]
    effects: [create_Judgment, create_judgmentBasedOn, create_judgmentUnderScenario_if_provided]
    outputs: [Judgment]
    rule_refs: [judgment_evidence_threshold]
    function_ref: CalculateConfidence
    logic_refs: [JudgmentFormationLogic]
    write_scope: [Judgment, judgmentBasedOn, judgmentUnderScenario]
  RegisterExpectation:
    id: RegisterExpectation
    name: 登记市场预期
    description: 保存特定截面的可追溯预期。
    target_types: [MarketExpectation]
    parameters: [statement, expectationType, expectationOwner, expectationBasis, asOf, timeHorizon, expectedValue, evidenceRefs]
    preconditions: [来源和截面明确]
    effects: [create_MarketExpectation, create_expectationAbout]
    outputs: [MarketExpectation]
    rule_refs: [evidence_grounding_required, time_alignment]
    function_ref: null
    logic_refs: []
    write_scope: [MarketExpectation, expectationAbout]
  CompareWithExpectation:
    id: CompareWithExpectation
    name: 比较市场预期
    description: 对齐口径和时间尺度后比较判断与预期。
    target_types: [ExpectationGap]
    parameters: [judgmentRef, expectationRef, comparisonBasis, asOf, timeHorizon]
    preconditions: [对象和时间尺度可比]
    effects: [create_ExpectationGap, create_gapComparesJudgment, create_gapComparesExpectation]
    outputs: [ExpectationGap]
    rule_refs: [time_alignment]
    function_ref: CompareExpectation
    logic_refs: [ExpectationGapLogic]
    write_scope: [ExpectationGap, gapComparesJudgment, gapComparesExpectation]
  AssessAssetImpact:
    id: AssessAssetImpact
    name: 评估资产影响
    description: 基于判断、预期差和定价状态形成资产影响或降级结果。
    target_types: [AssetImpact]
    parameters: [judgmentRef, assetRef, expectationGapRef, pricedInAssessment, impactMechanism, impactConfidence, sensitivityVariableRefs, riskSignalRefs, scenarioRef]
    preconditions: [判断非 blocked、已比较预期、影响机制和置信度完整，情景与来源判断一致]
    effects: [create_or_downgrade_AssetImpact, create_impactDerivedFrom, create_impactOnAsset, create_impactReferencesGap, create_impactUnderScenario_if_provided]
    outputs: [AssetImpact, downgradeReason]
    rule_refs: [expectation_required_for_asset_impact, blocking_signal_precedence]
    function_ref: null
    logic_refs: [AssetImpactLogic]
    write_scope: [AssetImpact, impactDerivedFrom, impactOnAsset, impactReferencesGap, impactUnderScenario]
  ConstructScenario:
    id: ConstructScenario
    name: 构建情景
    description: 组织假设、规则、触发条件和失效条件。
    target_types: [Scenario]
    parameters: [name, scenarioType, hypothesisRefs, ruleRefs, triggerConditions, invalidationConditions]
    preconditions: [路径可追溯且内部不矛盾]
    effects: [create_Scenario, create_scenarioIncludesHypothesis]
    outputs: [Scenario]
    rule_refs: []
    function_ref: null
    logic_refs: [ScenarioReasoningLogic]
    write_scope: [Scenario, scenarioIncludesHypothesis]
  RecordReasoningTrace:
    id: RecordReasoningTrace
    name: 记录推理留痕
    description: 保存一次判断从输入到输出的公开可复核路径。
    target_types: [ReasoningTrace]
    parameters: [judgmentRef, evaluatedAt, inputRefs, ruleEvaluationRefs, steps, ruleRefs, functionRefs, logicRefs, outputRefs, status]
    preconditions: [所有资源引用存在，步骤顺序明确]
    effects: [create_ReasoningTrace, create_traceForJudgment, create_traceIncludesRuleEvaluation]
    outputs: [ReasoningTrace]
    rule_refs: [reasoning_trace_required, rule_evaluation_trace_required]
    function_ref: null
    logic_refs: [ReasoningTraceLogic]
    write_scope: [ReasoningTrace, traceForJudgment, traceIncludesRuleEvaluation]
  RecordValidation:
    id: RecordValidation
    name: 记录事后验证
    description: 根据后续真实结果验证假设、判断或资产影响，并追加偏差与修订建议，不覆盖原始推理留痕。
    target_types: [ValidationRecord]
    parameters: [targetRefs, outcomeRefs, traceRefs, validatedAt, result, outcomeSummary, deviationReasons, revisionRequired, revisionNotes, nextCheckpoint]
    preconditions: [验证目标存在，后续结果时间不早于原判断，验证结果与依据完整]
    effects: [create_ValidationRecord, create_validationOf, create_validationUsesOutcome_if_provided, create_validationReferencesTrace_if_provided]
    outputs: [ValidationRecord]
    rule_refs: [validation_outcome_required, validation_time_order]
    function_ref: null
    logic_refs: [ExPostValidationLogic]
    write_scope: [ValidationRecord, validationOf, validationUsesOutcome, validationReferencesTrace]

functions:
  ComputeDerivedVariable:
    id: ComputeDerivedVariable
    name: 派生变量计算
    description: 根据变量或观测及明确口径计算派生值。
    inputs: [variableRefs, observationRefs, formula]
    outputs: [derivedValue]
    reads: [StateVariable, Observation]
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  PropagateVariableImpact:
    id: PropagateVariableImpact
    name: 变量影响传播
    description: 沿变量传导关系计算目标变量影响候选。
    inputs: [sourceVariableChange, relationRefs, conditions]
    outputs: [targetVariableImpacts]
    reads: [StateVariable, variableInfluencesVariable]
    writes: []
    deterministic: false
    side_effects: false
    version: 1.0.0
  EvaluateRuleCondition:
    id: EvaluateRuleCondition
    name: 规则条件计算
    description: 检查推理规则前提和条件。
    inputs: [ruleRef, inputRefs]
    outputs: [ruleEvaluation]
    reads: [rule, reasoning_object]
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  AggregateSignals:
    id: AggregateSignals
    name: 信号聚合
    description: 汇总支持、催化、跟踪、削弱和阻断信号。
    inputs: [signalRefs, targetRef]
    outputs: [signalAssessment]
    reads: [Signal, signalEvaluates]
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  CalculateConfidence:
    id: CalculateConfidence
    name: 置信度计算
    description: 根据证据、信号、反证和规则结果计算可解释置信度。
    inputs: [evidenceRefs, signalRefs, ruleEvaluations]
    outputs: [confidence, confidenceBasis]
    reads: [reasoning_object, evidence_object]
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  CompareExpectation:
    id: CompareExpectation
    name: 预期比较
    description: 对齐口径和时间尺度后比较判断与预期。
    inputs: [Judgment, MarketExpectation]
    outputs: [expectationGapCandidate]
    reads: [Judgment, MarketExpectation]
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0

logic_flows:
  EvidenceGroundingLogic:
    id: EvidenceGroundingLogic
    name: 证据映射推理逻辑
    description: 消费证据域的新鲜度评价，校验目标类型后建立推理域支撑关系。
    inputs: [evidenceRef, reasoningRef, groundingRole, evaluationTime]
    steps:
      - {id: evaluate_freshness, uses: [FreshnessEvaluationLogic]}
      - {id: validate_target, rule_refs: [no_direct_evidence_to_judgment]}
      - {id: create_grounding, uses: [evidenceGroundsReasoning]}
    outputs: [relation_ref]
    fallback: 证据过期、状态无效或目标不允许时拒绝连接。
  EventToStateLogic:
    id: EventToStateLogic
    name: 事件到状态逻辑
    description: 从有证据支撑的事件识别受影响变量和假设候选。
    inputs: [Event, evidenceRefs, semanticRefs]
    steps:
      - {id: validate_evidence, rule_refs: [evidence_grounding_required]}
      - {id: validate_anchor, rule_refs: [semantic_anchor_required]}
      - {id: form_state_hypothesis, rule_refs: [event_to_state_inference], uses: [eventAffectsVariable]}
    outputs: [stateChange, Hypothesis]
    fallback: 证据不足时只保留 Event。
  HypothesisAdmissionLogic:
    id: HypothesisAdmissionLogic
    name: 假设准入逻辑
    description: 检查变量锚点、方向、时间尺度和证伪条件；有事件依据时可调用事件到状态推理，但不强制先有证据。
    inputs: [statement, variableRef, direction, timeHorizon, falsificationConditions, basisRefs, premiseStatements]
    steps:
      - {id: validate_anchor, rule_refs: [semantic_anchor_required]}
      - {id: validate_falsifiability, rule_refs: [hypothesis_falsifiability_required]}
      - {id: align_time, rule_refs: [time_alignment]}
      - {id: classify_basis, uses: [hypothesisBasedOn, Hypothesis.premiseStatements]}
      - {id: optional_event_inference, rule_refs: [event_to_state_inference], uses: [EventToStateLogic]}
    outputs: [Hypothesis, unresolvedBasis]
    fallback: 锚点或证伪条件不足时不创建 Hypothesis，只返回待补充项。
  StatePropagationLogic:
    id: StatePropagationLogic
    name: 状态传导逻辑
    description: 检查变量传导条件并计算方向和滞后。
    inputs: [sourceVariable, relationRefs, ruleRefs]
    steps:
      - {id: evaluate_conditions, function_ref: EvaluateRuleCondition, rule_refs: [variable_propagation_inference]}
      - {id: propagate_impact, function_ref: PropagateVariableImpact}
    outputs: [targetVariableImpacts]
    fallback: 条件不明时输出 uncertain。
  HypothesisEvaluationLogic:
    id: HypothesisEvaluationLogic
    name: 假设评价逻辑
    description: 汇总信号并按阻断优先原则评价假设。
    inputs: [Hypothesis, signalRefs]
    steps:
      - {id: aggregate_signals, function_ref: AggregateSignals}
      - {id: apply_blocking, rule_refs: [blocking_signal_precedence]}
      - {id: align_time, rule_refs: [time_alignment]}
    outputs: [hypothesisEvaluation]
    fallback: 冲突未解时保持 contested。
  JudgmentFormationLogic:
    id: JudgmentFormationLogic
    name: 判断形成逻辑
    description: 检查证据门槛并形成分级判断。
    inputs: [hypothesisRefs, signalRefs, evidenceRefs]
    steps:
      - {id: check_competing_hypotheses, uses: [hypothesisCompetesWith, hypothesisContradicts]}
      - {id: check_threshold, rule_refs: [judgment_evidence_threshold]}
      - {id: calculate_confidence, function_ref: CalculateConfidence}
    outputs: [Judgment]
    fallback: 缺证时降为 observation 或 insufficient_evidence。
  ExpectationGapLogic:
    id: ExpectationGapLogic
    name: 预期差逻辑
    description: 对齐对象和时间后比较判断与预期。
    inputs: [Judgment, MarketExpectation]
    steps:
      - {id: align_time, rule_refs: [time_alignment]}
      - {id: compare, function_ref: CompareExpectation}
    outputs: [ExpectationGap]
    fallback: 不可比时不形成正式差异。
  AssetImpactLogic:
    id: AssetImpactLogic
    name: 资产影响逻辑
    description: 检查阻断、预期和定价后形成资产影响。
    inputs: [Judgment, ExpectationGap, Asset, scenarioRef, impactMechanism, impactConfidence]
    steps:
      - {id: check_blocking, rule_refs: [blocking_signal_precedence]}
      - {id: require_expectation, rule_refs: [expectation_required_for_asset_impact]}
      - {id: check_scenario_consistency, uses: [judgmentUnderScenario, impactUnderScenario]}
      - {id: describe_impact, uses: [impactDerivedFrom, impactOnAsset, impactReferencesGap]}
    outputs: [AssetImpact, downgradeReason]
    fallback: 无预期或已定价时降级。
  ScenarioReasoningLogic:
    id: ScenarioReasoningLogic
    name: 情景推演逻辑
    description: 组织可追溯的假设和规则路径。
    inputs: [hypothesisRefs, ruleRefs, triggerConditions]
    steps:
      - {id: order_path, uses: [scenarioIncludesHypothesis]}
      - {id: set_invalidation, uses: [Scenario.invalidationConditions]}
    outputs: [Scenario]
    fallback: 路径冲突时拒绝成型。
  RuleEvaluationLogic:
    id: RuleEvaluationLogic
    name: 规则评价逻辑
    description: 解析正式 Rule，校验输入和证据，计算条件并保存可由推理留痕引用的 RuleEvaluation。
    inputs: [ruleRef, ruleVersion, inputRefs, targetRefs, evidenceRefs, evaluationTime]
    steps:
      - {id: validate_traceability, rule_refs: [rule_evaluation_trace_required]}
      - {id: evaluate_conditions, function_ref: EvaluateRuleCondition}
      - {id: record_targets, uses: [ruleEvaluationTargets]}
    outputs: [RuleEvaluation]
    fallback: 输入、规则版本或证据引用不足时生成 error 状态评价，不允许相关判断进入正式输出。
  ReasoningTraceLogic:
    id: ReasoningTraceLogic
    name: 推理留痕逻辑
    description: 将本次推理使用的输入、Rule、Function、Logic 和输出组织为公开可复核记录。
    inputs: [judgmentRef, inputRefs, ruleEvaluationRefs, steps, ruleRefs, functionRefs, logicRefs, outputRefs]
    steps:
      - {id: validate_references, rule_refs: [reasoning_trace_required]}
      - {id: require_rule_evaluations, rule_refs: [rule_evaluation_trace_required], uses: [traceIncludesRuleEvaluation]}
      - {id: order_public_steps, uses: [traceForJudgment]}
    outputs: [ReasoningTrace]
    fallback: 引用不完整时生成 partial 留痕，不得进入正式输出。
  ExPostValidationLogic:
    id: ExPostValidationLogic
    name: 事后验证逻辑
    description: 对齐原始推理时点与后续结果，分类兑现程度并形成修订建议，同时保持原始留痕不可变。
    inputs: [targetRefs, outcomeRefs, traceRefs, validatedAt, result, revisionRequired]
    steps:
      - {id: validate_time_order, rule_refs: [validation_time_order]}
      - {id: validate_outcome_basis, rule_refs: [validation_outcome_required]}
      - {id: preserve_original_trace, uses: [validationReferencesTrace]}
      - {id: record_target_and_outcome, uses: [validationOf, validationUsesOutcome]}
    outputs: [ValidationRecord]
    fallback: 结果不足时只允许 still_uncertain，并记录下一验证点。

rules:
  no_direct_evidence_to_judgment:
    id: no_direct_evidence_to_judgment
    name: 证据不得直达判断
    description: 证据只能直接支撑允许的推理输入对象，不得直接支撑判断或资产影响。
    rule_type: blocking
    applies_to: [evidenceGroundsReasoning]
    condition: targetType 属于 Observation、Event、MarketExpectation 或 Signal。
    result: 允许创建支撑关系。
    priority: 100
    failure_handling: reject_grounding
  event_to_state_inference:
    id: event_to_state_inference
    name: 事件到状态推理
    description: 将有证据支撑的事件影响转化为状态变化和假设候选。
    rule_type: inference
    applies_to: [Event, eventAffectsVariable, StateVariable, Hypothesis]
    condition: Event 有有效证据和语义锚点，且 eventAffectsVariable 的机制与方向完整。
    result: 产生状态变化和 Hypothesis 候选。
    priority: 60
    failure_handling: keep_event_only
    version: 1.0.0
    input_types: [Event, StateVariable]
    output_types: [Hypothesis]
    required_evidence: [EvidenceClaim, EvidenceFact]
    counter_conditions: [事件未发生, 影响机制不成立]
    time_lag: 由 eventAffectsVariable.timeLag 声明。
  variable_propagation_inference:
    id: variable_propagation_inference
    name: 变量传导推理
    description: 沿满足条件的变量传导关系形成目标变量影响候选。
    rule_type: inference
    applies_to: [StateVariable, Observation, variableInfluencesVariable]
    condition: 源变量变化已有观测，传导条件满足，且不存在有效阻断条件。
    result: 产生目标变量方向、滞后和影响候选。
    priority: 60
    failure_handling: no_propagation
    version: 1.0.0
    input_types: [StateVariable, Observation]
    output_types: [StateVariable]
    required_evidence: [EvidenceClaim, EvidenceFact]
    counter_conditions: [传导条件不成立, 存在有效阻断信号]
    time_lag: 由 variableInfluencesVariable.timeLag 声明。
  semantic_anchor_required:
    id: semantic_anchor_required
    name: 语义锚点要求
    description: 推理对象应关联稳定语义对象或明确适用范围。
    rule_type: validation
    applies_to: [StateVariable, Event, Hypothesis, Judgment]
    condition: 对象的 semanticRefs 非空，或 Hypothesis 通过 hypothesisAbout 指向具有 variableAnchoredOn 的 StateVariable，或存在明确宏观适用范围。
    result: 允许进入后续推理。
    priority: 70
    failure_handling: keep_candidate
  hypothesis_falsifiability_required:
    id: hypothesis_falsifiability_required
    name: 假设可证伪要求
    description: 候选假设不强制已有验证证据，但必须具备变量锚点、方向、时间尺度和可观察的证伪条件。
    rule_type: validation
    applies_to: [Hypothesis, hypothesisAbout]
    condition: hypothesisAbout 指向有效 StateVariable，direction 和 timeHorizon 非空，falsificationConditions 至少一项。
    result: 允许创建候选 Hypothesis。
    priority: 90
    failure_handling: return_missing_requirements
  evidence_grounding_required:
    id: evidence_grounding_required
    name: 证据支撑要求
    description: 动态事实、预期和信号必须有证据。
    rule_type: validation
    applies_to: [Observation, Event, Signal, MarketExpectation]
    condition: evidenceRefs 非空且证据状态允许使用。
    result: 允许创建动态推理对象。
    priority: 90
    failure_handling: reject_or_downgrade
  time_alignment:
    id: time_alignment
    name: 时间尺度对齐
    description: 比较对象的业务时间和时间尺度必须可比。
    rule_type: validation
    applies_to: [Observation, Hypothesis, Judgment, MarketExpectation]
    condition: 业务时间、截面和 timeHorizon 可比较。
    result: 允许比较或聚合。
    priority: 80
    failure_handling: split_or_stop_comparison
  signal_role_compatibility:
    id: signal_role_compatibility
    name: 信号角色兼容
    description: Signal.role 必须与 signalEvaluates.role 一致。
    rule_type: validation
    applies_to: [Signal, signalEvaluates]
    condition: 对象角色和关系角色相同且目标类型允许。
    result: 允许创建信号关系。
    priority: 80
    failure_handling: reject_relation
  blocking_signal_precedence:
    id: blocking_signal_precedence
    name: 阻断信号优先
    description: 有效阻断信号优先于支持或催化信号。
    rule_type: blocking
    applies_to: [Hypothesis, Judgment, AssetImpact]
    condition: 存在未失效且适用当前时间尺度的 block 信号。
    result: 目标结论置为 blocked。
    priority: 100
    failure_handling: block_conclusion
  judgment_evidence_threshold:
    id: judgment_evidence_threshold
    name: 判断证据门槛
    description: 根据证据、信号、竞争解释和反证确定判断等级。
    rule_type: scoring
    applies_to: [Judgment]
    condition: 输入链完整，并已检查支持、削弱、阻断、hypothesisCompetesWith、hypothesisContradicts 和未解决不确定性。
    result: 产生 judgmentLevel、judgmentStatus、claimMode 和 confidence。
    priority: 70
    failure_handling: lower_level_and_confidence
  expectation_required_for_asset_impact:
    id: expectation_required_for_asset_impact
    name: 资产影响必须比较预期
    description: 未与可比预期比较时不得形成高置信资产影响。
    rule_type: blocking
    applies_to: [AssetImpact]
    condition: AssetImpact 通过 impactReferencesGap 引用有效 ExpectationGap，时间尺度可比，impactMechanism 与 impactConfidence 完整，存在情景时与来源 Judgment 一致。
    result: 允许形成资产影响。
    priority: 100
    failure_handling: output_fundamental_observation_only
  reasoning_trace_required:
    id: reasoning_trace_required
    name: 推理链可追溯
    description: 输入、规则、Function、关系和结论必须可追溯。
    rule_type: validation
    applies_to: [Judgment, ReasoningTrace]
    condition: 输入、公开步骤、Rule、Function、Logic 和输出引用完整，且存在 traceForJudgment。
    result: 允许进入正式输出。
    priority: 90
    failure_handling: keep_internal_candidate
  rule_evaluation_trace_required:
    id: rule_evaluation_trace_required
    name: 正式推理必须记录规则评价
    description: 进入正式判断的规则使用结果必须保存 Rule、版本、输入、条件结果、证据和状态，并由 ReasoningTrace 引用。
    rule_type: validation
    applies_to: [RuleEvaluation, ReasoningTrace, traceIncludesRuleEvaluation]
    condition: RuleEvaluation 的 ruleRef、ruleVersion、inputRefs、conditionResults、evidenceRefs 和 status 完整，且正式 ReasoningTrace 至少引用一项 RuleEvaluation。
    result: 允许规则评价参与正式推理留痕。
    priority: 95
    failure_handling: keep_internal_candidate
  validation_outcome_required:
    id: validation_outcome_required
    name: 事后验证结果依据要求
    description: 已验证、部分验证或证伪必须有后续结果依据；仍不确定必须说明缺口或下一验证点。
    rule_type: validation
    applies_to: [ValidationRecord, validationUsesOutcome]
    condition: result 为 validated、partially_validated 或 falsified 时 outcomeRefs 非空；result 为 still_uncertain 时 outcomeSummary 或 nextCheckpoint 非空。
    result: 允许记录事后验证。
    priority: 100
    failure_handling: downgrade_to_still_uncertain_or_reject
  validation_time_order:
    id: validation_time_order
    name: 事后验证时间顺序
    description: 后续结果不得早于原始判断或推理评估时点，事后信息不得回写覆盖原始留痕。
    rule_type: blocking
    applies_to: [ValidationRecord, ReasoningTrace, validationUsesOutcome]
    condition: 结果业务时间不早于目标判断时点，validatedAt 不早于 ReasoningTrace.evaluatedAt，且原始 ReasoningTrace 不被修改。
    result: 允许追加 ValidationRecord 和修订建议。
    priority: 100
    failure_handling: reject_validation
