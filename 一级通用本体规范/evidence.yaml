    deterministic: true
    side_effects: false
    version: 1.0.0
  ValidateProxyIndicatorFunction:
    id: ValidateProxyIndicatorFunction
    name: 代理指标校验
    description: 校验代理逻辑、有效条件、失效条件、置信折扣和披露要求。
    inputs: [ProxyIndicator, EvidenceRequirement]
    outputs: [proxyValidation]
    reads: [ProxyIndicator, EvidenceRequirement]
    writes: []
    deterministic: true
    side_effects: false
