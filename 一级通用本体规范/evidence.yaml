logic_flows:
  SourceToClaimLogic:
    id: SourceToClaimLogic
    name: 来源到主张逻辑
    description: 从可定位来源形成分类清楚的最小主张。
    inputs: [SourceDocument, contentRange]
    steps:
      - {id: validate_source, rule_refs: [source_traceability]}
      - {id: extract_claims, function_ref: ExtractClaims}
      - {id: validate_atomicity, rule_refs: [claim_atomicity]}
    outputs: [EvidenceClaim]
    fallback: 无法定位时不生成正式主张。
  ClaimToFactLogic:
    id: ClaimToFactLogic
    name: 主张到事实逻辑
    description: 对齐主张并形成可追溯事实候选。
    inputs: [claimRefs]
    steps:
      - {id: normalize, function_ref: NormalizeClaimValue}
      - {id: count_independent_sources, rule_refs: [original_source_independence]}
      - {id: separate_source_claim_reliability, rule_refs: [source_claim_reliability_separation]}
      - {id: detect_conflict, function_ref: DetectEvidenceConflict, rule_refs: [conflict_preservation]}
      - {id: validate_support, rule_refs: [fact_requires_claim]}
    outputs: [EvidenceFact, conflict_record]
    fallback: 冲突未解时保持 conflicted。
  ConflictHandlingLogic:
    id: ConflictHandlingLogic
    name: 证据冲突处理逻辑
    description: 区分冲突、替代和失效，不静默覆盖证据。
    inputs: [evidenceRefs]
    steps:
      - {id: detect_conflict, function_ref: DetectEvidenceConflict}
      - {id: preserve_conflict, rule_refs: [conflict_preservation]}
      - {id: classify_outcome, uses: [conflictsWith, supersedes, invalidates]}
    outputs: [conflict_record, supersede_candidate, invalidation_candidate]
    fallback: 无法裁定时只记录冲突。
  FreshnessEvaluationLogic:
    id: FreshnessEvaluationLogic
    name: 证据新鲜度逻辑
    description: 根据业务时间和有效期判断证据当前适用性。
    inputs: [evidenceRef, evaluationTime]
    steps:
      - {id: require_business_time, rule_refs: [business_time_required]}
      - {id: calculate_freshness, function_ref: CalculateEvidenceFreshness}
    outputs: [freshness]
    fallback: 时间缺失时降低可信度。
  JudgmentToEvidenceRequirementLogic:
    id: JudgmentToEvidenceRequirementLogic
    name: 判断到证据需求逻辑
    description: 把判断类型和证据角色拆成可执行证据需求。
    inputs: [judgmentUnitRef, judgmentType]
    steps:
      - {id: validate_judgment_type, rule_refs: [judgment_type_required]}
      - {id: derive_requirements, function_ref: DeriveEvidenceRequirements}
      - {id: validate_requirement, rule_refs: [evidence_requirement_required]}
    outputs: [EvidenceRequirement]
    fallback: 判断类型或证据角色缺失时退回 02。
  EvidenceRecipeMatchingLogic:
    id: EvidenceRecipeMatchingLogic
    name: 取证配方匹配逻辑
    description: 为证据需求匹配可复用取证配方。
    inputs: [EvidenceRequirement, recipeTags]
    steps:
      - {id: require_recipe_before_acquisition, rule_refs: [recipe_before_acquisition]}
      - {id: match_recipe, function_ref: MatchEvidenceRecipeFunction}
      - {id: create_recipe_link, uses: [requirementUsesRecipe]}
    outputs: [EvidenceRecipe]
    fallback: 无配方时不得 high_quality_pass。
  EvidenceBasketEvaluationLogic:
    id: EvidenceBasketEvaluationLogic
    name: 证据篮子评价逻辑
    description: 检查必需篮子、反证篮子和实际证据填充状态。
    inputs: [EvidenceRequirement, EvidenceBasket, EvidenceClaim, EvidenceFact]
    steps:
      - {id: validate_mandatory_basket, rule_refs: [mandatory_basket_required]}
      - {id: validate_counter_basket, rule_refs: [counter_basket_required]}
      - {id: evaluate_basket, function_ref: EvaluateEvidenceBasketFunction}
    outputs: [basket_readiness]
    fallback: 必需篮子缺失时降级 04 使用上限。
  SourceProfileMatchingLogic:
    id: SourceProfileMatchingLogic
    name: 来源画像匹配逻辑
    description: 检查来源画像、来源层级和取数通道是否满足证据需求。
    inputs: [EvidenceRequirement, SourceProfile, AcquisitionChannel, SourceDocument]
    steps:
      - {id: require_source_profile, rule_refs: [source_profile_required]}
      - {id: match_source_profile, function_ref: MatchSourceProfileFunction}
      - {id: validate_source_tier, rule_refs: [source_tier_must_match_requirement]}
      - {id: validate_channel, rule_refs: [acquisition_channel_must_be_allowed]}
    outputs: [source_profile_match]
    fallback: 来源画像或通道不匹配时不得作为正式硬证据。
  ProxyIndicatorValidationLogic:
    id: ProxyIndicatorValidationLogic
    name: 代理指标校验逻辑
    description: 检查代理指标是否可用、必须披露且不能替代直接证据。
    inputs: [ProxyIndicator, EvidenceRequirement]
    steps:
      - {id: validate_proxy, function_ref: ValidateProxyIndicatorFunction}
      - {id: require_disclosure, rule_refs: [proxy_must_be_disclosed]}
      - {id: forbid_replacement, rule_refs: [proxy_cannot_replace_direct_evidence]}
    outputs: [proxyValidation]
    fallback: 代理未披露时不得作为事实使用。
  EvidenceReadinessAssessmentLogic:
    id: EvidenceReadinessAssessmentLogic
    name: 证据准入评估逻辑
    description: 根据需求、配方、篮子、来源、代理、冲突和反证生成 04 使用上限。
    inputs: [EvidenceRequirement, EvidenceRecipe, EvidenceBasket, ProxyIndicator]
    steps:
      - {id: require_stop_condition, rule_refs: [stop_condition_must_be_recorded]}
      - {id: assess_readiness, function_ref: AssessEvidenceReadinessFunction}
      - {id: limit_04_output, rule_refs: [readiness_limits_04_output]}
    outputs: [EvidenceReadinessAssessment]
    fallback: 无准入评估时 04 不得形成方向性观点。

rules:
  source_traceability:
    id: source_traceability
    name: 来源可追溯
    description: 来源和主张位置必须可访问或可复核。
    rule_type: validation
    applies_to: [SourceDocument, EvidenceClaim]
    condition: SourceDocument.location 非空，EvidenceClaim.locator 非空。
    result: 允许来源或主张进入后续处理。
    priority: 100
    failure_handling: keep_candidate_or_reject
  claim_atomicity:
    id: claim_atomicity
    name: 主张最小化
    description: 一条主张只表达一个核心断言。
    rule_type: validation
    applies_to: [EvidenceClaim]
    condition: statement 不混合多个对象、时间、数值或因果断言。
    result: 允许主张归一。
    priority: 90
    failure_handling: split_claim
  source_claim_reliability_separation:
    id: source_claim_reliability_separation
    name: 来源与主张可靠性分离
    description: 来源可靠性不得直接复制为主张可信度。
    rule_type: scoring
    applies_to: [SourceDocument, EvidenceClaim]
    condition: claimConfidence 独立考虑主张类型、位置、冲突和独立来源。
    result: 产生独立主张可信度。
    priority: 80
    failure_handling: recalculate_claim_confidence
  fact_requires_claim:
    id: fact_requires_claim
    name: 事实必须有主张支撑
    description: 事实候选至少由一条有效主张支撑。
    rule_type: validation
    applies_to: [EvidenceFact]
    condition: 至少存在一条 factSupportedByClaim。
    result: 允许创建事实候选。
    priority: 100
    failure_handling: reject_fact
  original_source_independence:
    id: original_source_independence
    name: 独立来源追溯
    description: 转述同一原始来源不得重复计算独立来源。
    rule_type: scoring
    applies_to: [EvidenceClaim]
    condition: 按 originalSourceId 或可追溯来源去重。
    result: 产生独立来源计数。
    priority: 70
    failure_handling: merge_source_count
  conflict_preservation:
    id: conflict_preservation
    name: 冲突保留
    description: 未裁决冲突不得删除任一方或静默覆盖。
    rule_type: blocking
    applies_to: [EvidenceClaim, EvidenceFact]
    condition: 存在未解决 conflictsWith。
    result: 证据状态保持 conflicted。
    priority: 100
    failure_handling: preserve_both_sides
  business_time_required:
    id: business_time_required
    name: 业务时间完整
    description: 动态内容必须有业务时间或明确说明缺失。
    rule_type: validation
    applies_to: [EvidenceClaim, EvidenceFact]
    condition: businessTime 非空，或 claimType 表明该内容没有业务时间。
    result: 允许新鲜度评价。
    priority: 80
    failure_handling: lower_confidence
  judgment_type_required:
    id: judgment_type_required
    name: 判断类型必填
    description: 02 交接给 03 的判断单元必须声明 judgment_type。
    rule_type: validation
    applies_to: [EvidenceRequirement]
    condition: targetJudgmentUnitId 和判断类型非空。
    result: 允许拆解证据需求。
    priority: 100
    failure_handling: return_to_02
  evidence_requirement_required:
    id: evidence_requirement_required
    name: 正式取证前必须有证据需求
    description: 没有 EvidenceRequirement，不准登记正式取证结果。
    rule_type: blocking
    applies_to: [EvidenceRequirement, EvidenceClaim, EvidenceFact]
    condition: EvidenceClaim 和 EvidenceFact 可追溯到至少一个 EvidenceRequirement。
    result: 允许进入正式证据链。
    priority: 100
    failure_handling: reject_formal_acquisition
  recipe_before_acquisition:
    id: recipe_before_acquisition
    name: 取证前必须匹配配方
    description: 没有 EvidenceRecipe，不得标记 high_quality_pass。
    rule_type: blocking
    applies_to: [EvidenceRequirement, EvidenceRecipe]
    condition: requirementUsesRecipe 已建立或记录无配方降级理由。
    result: 允许执行取证配方。
    priority: 95
    failure_handling: downgrade_quality
  mandatory_basket_required:
    id: mandatory_basket_required
    name: 必需证据篮子必查
    description: 必需篮子不满足，不得给 04 强方向判断。
    rule_type: blocking
    applies_to: [EvidenceRequirement, EvidenceBasket, EvidenceReadinessAssessment]
    condition: 必需 EvidenceBasket 状态为 met，或 EvidenceReadinessAssessment 已降级。
    result: 允许判断单元进入对应使用上限。
    priority: 100
    failure_handling: downgrade_or_block_04_output
  counter_basket_required:
    id: counter_basket_required
    name: 反证篮子必查
    description: 反证篮子未检查，不得方向性输出。
    rule_type: blocking
    applies_to: [EvidenceRequirement, EvidenceBasket, EvidenceReadinessAssessment]
    condition: counterCheckStatus 为 checked/met/not_applicable。
    result: 允许方向性或条件性输出。
    priority: 100
    failure_handling: restrict_to_insufficient_or_conditional
  source_profile_required:
    id: source_profile_required
    name: 来源画像必填
    description: 正式证据必须匹配来源画像，不能只登记笼统来源名称。
    rule_type: validation
    applies_to: [SourceProfile, SourceDocument, EvidenceRequirement]
    condition: SourceDocument.sourceProfileId 或 sourceMatchesSourceProfile 存在。
    result: 允许来源参与证据篮子。
    priority: 90
    failure_handling: keep_as_lead_or_background
  proxy_must_be_disclosed:
    id: proxy_must_be_disclosed
    name: 代理指标必须披露
    description: 代理指标在 04/05 中必须说明代理性质和限制。
    rule_type: validation
    applies_to: [ProxyIndicator, EvidenceClaim, EvidenceFact]
    condition: requiredDisclosure 非空，且关联证据 usageLimit 说明代理限制。
    result: 允许代理指标受限使用。
    priority: 100
    failure_handling: reject_as_fact
  proxy_cannot_replace_direct_evidence:
    id: proxy_cannot_replace_direct_evidence
    name: 代理不能替代直接证据
    description: 代理指标只能在直接变量不可得时受限使用，不能写成直接事实。
    rule_type: blocking
    applies_to: [ProxyIndicator, EvidenceReadinessAssessment]
    condition: cannotReplace 非空，且高代理依赖时 allowed04Output 不为 full_reasoning_ready。
    result: 降低置信上限。
    priority: 100
    failure_handling: discount_confidence
  source_tier_must_match_requirement:
    id: source_tier_must_match_requirement
    name: 来源层级必须匹配需求
    description: 来源层级低于需求时不得冒充硬事实。
    rule_type: validation
    applies_to: [EvidenceRequirement, SourceProfile, SourceDocument]
    condition: SourceProfile.sourceTier 和 SourceDocument.sourceTier 满足 minimumSourceTier。
    result: 允许作为对应证据角色使用。
    priority: 95
    failure_handling: downgrade_to_background_or_lead
  acquisition_channel_must_be_allowed:
    id: acquisition_channel_must_be_allowed
    name: 取数通道必须被允许
    description: 实际取数通道必须在证据需求允许范围内，并保留权限和留痕。
    rule_type: validation
    applies_to: [EvidenceRequirement, AcquisitionChannel, SourceDocument]
    condition: requirementAllowsAcquisitionChannel 存在，且 traceabilityLevel 满足需求。
    result: 允许来源进入正式证据记录。
    priority: 90
    failure_handling: reject_or_mark_restricted
  stop_condition_must_be_recorded:
    id: stop_condition_must_be_recorded
    name: 停止条件必须记录
    description: 03 必须记录何时停止补证、何时停止方向性推理。
    rule_type: validation
    applies_to: [EvidenceRequirement, EvidenceReadinessAssessment]
    condition: EvidenceRequirement.stopCondition 非空。
    result: 允许形成准入评估。
    priority: 90
    failure_handling: return_to_03
  readiness_limits_04_output:
    id: readiness_limits_04_output
    name: 准入评估限制 04 输出
    description: 04 的每条观点不得超过 EvidenceReadinessAssessment.allowed04Output。
    rule_type: blocking
    applies_to: [EvidenceReadinessAssessment]
    condition: allowed04Output 和 confidenceCeiling 已明确。
    result: 04 只能在上限内表达观点。
    priority: 100
    failure_handling: block_overreach
