action_types:
  RegisterSource:
    id: RegisterSource
    name: 登记来源
    description: 登记可定位来源并评估来源可靠性。
    target_types: [SourceDocument]
    parameters: [title, sourceType, publisher, publisherRef, publishedAt, location, accessScope]
    preconditions: [来源可定位]
    effects: [create_SourceDocument, set_sourceReliability, create_sourcePublishedBy_if_provided]
    outputs: [SourceDocument]
    rule_refs: [source_traceability]
    function_ref: AssessSourceReliability
    logic_refs: []
    write_scope: [SourceDocument, sourcePublishedBy]
  ExtractClaim:
    id: ExtractClaim
    name: 抽取主张
    description: 从来源指定位置形成最小主张候选。
    target_types: [EvidenceClaim]
    parameters: [sourceRef, locator, contentRange]
    preconditions: [来源已登记]
    effects: [create_EvidenceClaim, create_claimCitesSource]
    outputs: [EvidenceClaim]
    rule_refs: [claim_atomicity, source_traceability]
    function_ref: ExtractClaims
    logic_refs: [SourceToClaimLogic]
    write_scope: [EvidenceClaim, claimCitesSource]
  NormalizeClaim:
    id: NormalizeClaim
    name: 归一主张
    description: 对齐主张中的对象、时间、数值和单位，不改变原始陈述。
    target_types: [EvidenceClaim]
    parameters: [claimRef, semanticRefs, unit, businessTime]
    preconditions: [主张可追溯]
    effects: [update_claim_normalization, create_claimAbout]
    outputs: [EvidenceClaim]
    rule_refs: [business_time_required]
    function_ref: NormalizeClaimValue
    logic_refs: []
    write_scope: [EvidenceClaim, claimAbout]
  SynthesizeFact:
    id: SynthesizeFact
    name: 归并事实候选
    description: 根据有效主张形成结构化事实候选。
    target_types: [EvidenceFact]
    parameters: [claimRefs, normalizationBasis, businessTime]
    preconditions: [至少一条有效主张]
    effects: [create_EvidenceFact, create_factSupportedByClaim]
    outputs: [EvidenceFact]
    rule_refs: [fact_requires_claim, original_source_independence, source_claim_reliability_separation, conflict_preservation]
    function_ref: AssessClaimConfidence
    logic_refs: [ClaimToFactLogic]
    write_scope: [EvidenceFact, factSupportedByClaim]
  RecordEvidenceConflict:
    id: RecordEvidenceConflict
    name: 记录证据冲突
    description: 建立冲突关系并保留双方证据。
    target_types: [conflictsWith]
    parameters: [leftEvidenceRef, rightEvidenceRef, conflictType, conflictScope]
    preconditions: [两项证据同类型且可比较]
    effects: [create_conflictsWith, mark_conflicted]
    outputs: [conflict_record]
    rule_refs: [conflict_preservation]
    function_ref: DetectEvidenceConflict
    logic_refs: [ConflictHandlingLogic]
    write_scope: [EvidenceClaim, EvidenceFact, conflictsWith]
  SupersedeEvidence:
    id: SupersedeEvidence
    name: 替代证据
    description: 用更具时效或权威性的同类型证据替代旧证据。
    target_types: [supersedes]
    parameters: [newEvidenceRef, oldEvidenceRef, reason, effectiveAt]
    preconditions: [新旧证据同类型且口径一致]
    effects: [create_supersedes, mark_old_superseded]
    outputs: [evidence_status]
    rule_refs: [conflict_preservation]
    function_ref: null
    logic_refs: [ConflictHandlingLogic]
    write_scope: [EvidenceClaim, EvidenceFact, supersedes]
  InvalidateEvidence:
    id: InvalidateEvidence
    name: 使证据失效
    description: 在存在明确反证或适用条件终止时使旧证据失效。
    target_types: [invalidates]
    parameters: [newEvidenceRef, oldEvidenceRef, reason, effectiveAt]
    preconditions: [存在明确反证或适用条件终止]
    effects: [create_invalidates, mark_old_invalidated]
    outputs: [evidence_status]
    rule_refs: [conflict_preservation]
    function_ref: null
    logic_refs: [ConflictHandlingLogic]
    write_scope: [EvidenceClaim, EvidenceFact, invalidates]
  CreateEvidenceRequirement:
    id: CreateEvidenceRequirement
    name: 创建证据需求
    description: 根据判断单元交接字段创建本次证据需求。
    target_types: [EvidenceRequirement]
    parameters: [judgmentUnitRef, judgmentType, requiredEvidenceRoles, requiredEvidenceCategories]
    preconditions: [判断类型已声明, 必需证据角色已声明]
    effects: [create_EvidenceRequirement]
    outputs: [EvidenceRequirement]
    rule_refs: [judgment_type_required, evidence_requirement_required]
    function_ref: DeriveEvidenceRequirements
    logic_refs: [JudgmentToEvidenceRequirementLogic]
    write_scope: [EvidenceRequirement]
  MatchEvidenceRecipe:
    id: MatchEvidenceRecipe
    name: 匹配取证配方
    description: 根据判断类型和需求匹配 03 取证策略库配方。
    target_types: [requirementUsesRecipe]
    parameters: [requirementRef, judgmentType, recipeTags]
    preconditions: [证据需求已创建]
    effects: [create_requirementUsesRecipe]
    outputs: [EvidenceRecipe]
    rule_refs: [recipe_before_acquisition]
    function_ref: MatchEvidenceRecipeFunction
    logic_refs: [EvidenceRecipeMatchingLogic]
    write_scope: [requirementUsesRecipe]
  CreateEvidenceBasket:
    id: CreateEvidenceBasket
    name: 创建证据篮子
    description: 根据证据需求和取证配方创建必需、反证和代理篮子。
    target_types: [EvidenceBasket]
    parameters: [requirementRef, recipeRef, basketRole]
    preconditions: [证据需求和取证配方已存在]
    effects: [create_EvidenceBasket, create_requirementRequiresBasket]
    outputs: [EvidenceBasket]
    rule_refs: [mandatory_basket_required, counter_basket_required]
    function_ref: EvaluateEvidenceBasketFunction
    logic_refs: [EvidenceBasketEvaluationLogic]
    write_scope: [EvidenceBasket, requirementRequiresBasket]
  RegisterSourceProfile:
    id: RegisterSourceProfile
    name: 登记来源画像
    description: 登记稳定来源画像和禁用用途。
    target_types: [SourceProfile]
    parameters: [sourceProfileName, sourceTier, sourceCategory, allowedClaimTypes]
    preconditions: [来源画像可描述]
    effects: [create_SourceProfile]
    outputs: [SourceProfile]
    rule_refs: [source_profile_required]
    function_ref: MatchSourceProfileFunction
    logic_refs: [SourceProfileMatchingLogic]
    write_scope: [SourceProfile]
  RegisterAcquisitionChannel:
    id: RegisterAcquisitionChannel
    name: 登记取数通道
    description: 登记取数通道、权限和留痕要求。
    target_types: [AcquisitionChannel]
    parameters: [channelName, channelType, permissionRequirement, traceabilityLevel]
    preconditions: [通道留痕和权限要求明确]
    effects: [create_AcquisitionChannel]
    outputs: [AcquisitionChannel]
    rule_refs: [acquisition_channel_must_be_allowed]
    function_ref: null
    logic_refs: []
    write_scope: [AcquisitionChannel]
  RegisterProxyIndicator:
    id: RegisterProxyIndicator
    name: 登记代理指标
    description: 登记代理指标、有效条件、失效条件和披露要求。
    target_types: [ProxyIndicator]
    parameters: [proxyFor, proxyLogic, validConditions, invalidConditions]
    preconditions: [直接证据不可得或不足]
    effects: [create_ProxyIndicator, create_proxySupportsRequirement]
    outputs: [ProxyIndicator]
    rule_refs: [proxy_must_be_disclosed, proxy_cannot_replace_direct_evidence]
    function_ref: ValidateProxyIndicatorFunction
    logic_refs: [ProxyIndicatorValidationLogic]
    write_scope: [ProxyIndicator, proxySupportsRequirement]
  AssessBasketReadiness:
    id: AssessBasketReadiness
    name: 评价证据篮子就绪度
    description: 评价证据篮子是否满足质量、来源、反证和冲突要求。
    target_types: [EvidenceBasket]
    parameters: [basketRef, evidenceRefs, sourceRefs]
    preconditions: [证据篮子已创建]
    effects: [update_EvidenceBasket_status]
    outputs: [basket_readiness]
    rule_refs: [mandatory_basket_required, counter_basket_required, source_tier_must_match_requirement]
    function_ref: EvaluateEvidenceBasketFunction
    logic_refs: [EvidenceBasketEvaluationLogic]
    write_scope: [EvidenceBasket]
  AssessEvidenceReadiness:
    id: AssessEvidenceReadiness
    name: 评价证据准入
    description: 综合证据需求、配方、篮子、来源、代理和冲突形成 04 使用上限。
    target_types: [EvidenceReadinessAssessment]
    parameters: [judgmentUnitRef, requirementRefs, basketRefs, recipeRef]
    preconditions: [证据需求、配方和篮子均已记录]
    effects: [create_EvidenceReadinessAssessment, create_readinessAssessesRequirement, create_readinessEvaluatesBasket]
    outputs: [EvidenceReadinessAssessment]
    rule_refs: [readiness_limits_04_output, stop_condition_must_be_recorded]
    function_ref: AssessEvidenceReadinessFunction
    logic_refs: [EvidenceReadinessAssessmentLogic]
    write_scope: [EvidenceReadinessAssessment, readinessAssessesRequirement, readinessEvaluatesBasket]

