    inputs: [sourceType, publisher, traceability]
    outputs: [sourceReliability]
    reads: [SourceDocument]
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  AssessClaimConfidence:
    id: AssessClaimConfidence
    name: 主张可信度评价
    description: 结合来源、主张类型、冲突和独立来源评价可信度。
    inputs: [EvidenceClaim, sourceReliability, conflictRefs, independentSourceCount]
    outputs: [claimConfidence, confidenceBasis]
    reads: [SourceDocument, EvidenceClaim, EvidenceFact]
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  DetectEvidenceConflict:
    id: DetectEvidenceConflict
    name: 证据冲突检测
    description: 识别口径、数值、时间或方向冲突。
    inputs: [evidenceRefs]
    outputs: [conflictCandidates]
    reads: [EvidenceClaim, EvidenceFact]
    writes: []
    deterministic: false
    side_effects: false
    version: 1.0.0
  CalculateEvidenceFreshness:
    id: CalculateEvidenceFreshness
    name: 证据新鲜度计算
    description: 根据业务时间、有效期和评估时点判断适用性。
    inputs: [businessTime, validFrom, validTo, evaluationTime]
    outputs: [freshness]
    reads: [EvidenceClaim, EvidenceFact]
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  DeriveEvidenceRequirements:
    id: DeriveEvidenceRequirements
    name: 判断单元到证据需求拆解
    description: 根据判断类型、证据角色、证据类别和禁用捷径生成证据需求候选。
    inputs: [judgmentUnitRef, judgmentType, requiredEvidenceRoles, requiredEvidenceCategories]
    outputs: [evidenceRequirements]
    reads: [rule]
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  MatchEvidenceRecipeFunction:
    id: MatchEvidenceRecipeFunction
    name: 取证配方匹配
    description: 根据 judgment_type 和配方标签匹配取证策略库。
    inputs: [EvidenceRequirement, recipeTags]
    outputs: [matchedRecipe]
    reads: [EvidenceRequirement, EvidenceRecipe]
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  EvaluateEvidenceBasketFunction:
    id: EvaluateEvidenceBasketFunction
    name: 证据篮子评价
    description: 评价证据篮子是否满足来源层级、独立来源、反证、冲突和代理要求。
    inputs: [EvidenceBasket, EvidenceClaim, EvidenceFact, SourceDocument]
    outputs: [basketStatus, usageLimit]
    reads: [EvidenceBasket, EvidenceClaim, EvidenceFact, SourceDocument]
    writes: []
    deterministic: false
    side_effects: false
    version: 1.0.0
  MatchSourceProfileFunction:
    id: MatchSourceProfileFunction
    name: 来源画像匹配
    description: 判断来源画像是否满足证据需求的来源层级、内容域和禁用用途要求。
    inputs: [EvidenceRequirement, SourceProfile, AcquisitionChannel]
    outputs: [sourceProfileMatch]
    reads: [EvidenceRequirement, SourceProfile, AcquisitionChannel]
