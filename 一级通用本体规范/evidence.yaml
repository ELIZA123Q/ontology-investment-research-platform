    description: 对齐对象、时间、数值和单位。
    inputs: [EvidenceClaim, semanticRefs, targetUnit]
    outputs: [normalizedClaim]
    reads: [EvidenceClaim, semantic_object]
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  AssessSourceReliability:
    id: AssessSourceReliability
