schema_name: ontology_evidence
schema_version: 1.0.0
status: active
depends_on: [common.yaml, semantic.yaml]
description: 证据域的 Object、Relation、Action 及 Function、Logic、Rule 定义。

object_types:
  SourceDocument:
    id: SourceDocument
    name: 来源文档
    description: 原始材料、数据文件或人工记录的来源载体。
    primary_key: id
    title_property: title
    validity: true
    properties:
      title: {type: string, required: true, description: 来源标题或稳定名称。}
      sourceType: {type: enum, required: true, allowed_values: [filing, report, news, transcript, dataset, policy, manual, other], description: 来源载体类型。}
      publisher: {type: string, required: false, description: 发布者或来源机构。}
      publishedAt: {type: datetime, required: false, description: 来源发布时间。}
      location: {type: string, required: true, description: 文件、链接或其他稳定定位。}
      accessScope: {type: enum, required: true, allowed_values: [public, internal, restricted], description: 来源访问范围。}
      sourceReliability: {type: enum, required: true, allowed_values: [low, medium, high, unknown], description: 来源可靠程度。}
      sourceProfileId: {type: string, required: false, description: 本次或来源库匹配的来源画像 ID。}
      sourceTier: {type: enum, required: false, allowed_values: [L1, L2, L3, L4, L5, L6, L7], description: 来源层级。}
      acquisitionChannelId: {type: string, required: false, description: 来源取得通道 ID。}
      contentDomainTags: {type: array, required: false, description: 来源覆盖的内容领域标签。}
      independenceGroupId: {type: string, required: false, description: 独立来源组 ID。}
      methodologyStatus: {type: enum, required: false, allowed_values: [transparent, partially_transparent, opaque, not_applicable], description: 方法透明度状态。}
      accessPermissionStatus: {type: enum, required: false, allowed_values: [allowed, licensed, restricted, denied, unknown], description: 访问与使用权限状态。}
      usageRestriction: {type: string, required: false, description: 来源可用边界和禁用用途。}
      sourceFreshnessStatus: {type: enum, required: false, allowed_values: [current, stale, expired, unknown], description: 来源时效状态。}
      status: {type: enum, required: true, allowed_values: [candidate, active, invalidated, superseded], description: 来源生命周期状态。}
      createdAt: {type: datetime, required: true, description: 来源登记时间。}
  EvidenceClaim:
    id: EvidenceClaim
    name: 证据主张
    description: 从来源中提取的一条最小、可定位的说法。
    primary_key: id
    title_property: statement
    validity: true
    properties:
      statement: {type: string, required: true, description: 一条最小可复核说法。}
      claimType: {type: enum, required: true, allowed_values: [reported_fact, data_point, estimate, forecast, guidance, author_judgment, assumption, unverified, correction], description: 主张内容类型。}
      locator: {type: string, required: true, description: 页码、段落、表格单元格或记录位置。}
      businessTime: {type: datetime, required: false, description: 主张所描述事项的业务时间。}
      claimConfidence: {type: enum, required: true, allowed_values: [low, medium, high, unknown], description: 主张可信度。}
      originalSourceId: {type: string, required: false, description: 转述内容追溯到的原始来源。}
      evidenceRequirementIds: {type: array, required: false, description: 满足的证据需求 ID。}
      evidenceBasketIds: {type: array, required: false, description: 填充的证据篮子 ID。}
      evidenceRole: {type: enum, required: false, allowed_values: [primary_support, cross_validation, counter_evidence, blocking_condition, proxy_indicator, background_evidence], description: 本主张在本次判断中的证据角色。}
      contentDomain: {type: string, required: false, description: 主张所属内容领域。}
      statementType: {type: enum, required: false, allowed_values: [reported_fact, data, estimate, forecast, guidance, opinion, assumption, proxy], description: 主张陈述性质。}
      proxyIndicatorId: {type: string, required: false, description: 如果是代理证据，对应代理指标 ID。}
      isCounterEvidence: {type: boolean, required: false, description: 是否作为反证使用。}
      isCrossValidation: {type: boolean, required: false, description: 是否作为交叉验证使用。}
      confidenceCeiling: {type: enum, required: false, allowed_values: [low, medium, high], description: 该主张能支撑的最高置信上限。}
      usageLimit: {type: string, required: false, description: 该主张的使用限制。}
      status: {type: enum, required: true, allowed_values: [candidate, active, conflicted, invalidated, superseded], description: 主张生命周期状态。}
      createdAt: {type: datetime, required: true, description: 主张形成时间。}
  EvidenceFact:
    id: EvidenceFact
    name: 证据事实
    description: 由一条或多条主张归一得到的结构化事实候选。
    primary_key: id
    title_property: statement
    validity: true
    properties:
      statement: {type: string, required: true, description: 归一后的事实候选。}
      factType: {type: enum, required: true, allowed_values: [occurrence, measurement, attribute, relationship], description: 事实候选类型。}
      businessTime: {type: datetime, required: true, description: 事实候选对应的业务时间。}
      normalizedValue: {type: any, required: false, description: 可结构化时记录的归一值。}
      unit: {type: string, required: false, description: 归一值单位。}
      factConfidence: {type: enum, required: true, allowed_values: [low, medium, high], description: 事实候选可信度。}
      evidenceRequirementIds: {type: array, required: false, description: 满足的证据需求 ID。}
      evidenceBasketIds: {type: array, required: false, description: 填充的证据篮子 ID。}
      factRole: {type: enum, required: false, allowed_values: [primary_support, cross_validation, counter_evidence, blocking_condition, proxy_indicator, background_evidence], description: 事实候选在本次判断中的角色。}
      sourceIndependenceStatus: {type: enum, required: false, allowed_values: [independent, same_group, mixed, unknown], description: 支撑来源独立性状态。}
      proxyDependency: {type: enum, required: false, allowed_values: [none, low, moderate, high, proxy_only], description: 是否依赖代理指标。}
      counterStatus: {type: enum, required: false, allowed_values: [not_checked, checked, supports_counter, not_applicable], description: 反证状态。}
      conflictStatus: {type: enum, required: false, allowed_values: [no_material_conflict, minor_conflict, material_conflict, unresolved_conflict, contested], description: 冲突状态。}
      requirementSatisfactionStatus: {type: enum, required: false, allowed_values: [met, partial, not_met, blocked], description: 对证据需求的满足状态。}
      confidenceCeiling: {type: enum, required: false, allowed_values: [low, medium, high], description: 该事实候选能支撑的最高置信上限。}
      allowed04Usage: {type: enum, required: false, allowed_values: [full_reasoning_ready, directional_only, conditional_only, insufficient, blocked, contested], description: 04 可使用上限。}
      usageLimit: {type: string, required: false, description: 该事实候选的使用限制。}
      status: {type: enum, required: true, allowed_values: [candidate, active, conflicted, invalidated, superseded], description: 事实候选生命周期状态。}
      createdAt: {type: datetime, required: true, description: 事实候选形成时间。}
  EvidenceRequirement:
    id: EvidenceRequirement
    name: 证据需求
    description: 从判断单元拆解出的本次必须取得的证据要求。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 证据需求名称。}
      targetJudgmentUnitId: {type: string, required: true, description: 对应 02 判断单元 ID。}
      targetPathNodeId: {type: string, required: false, description: 对应路径节点 ID。}
      targetStateVariableId: {type: string, required: false, description: 对应状态变量 ID。}
      requirementPurpose: {type: enum, required: true, allowed_values: [support, weaken, block, validate, cross_validate, counter, background], description: 证据需求目的。}
      evidenceRole: {type: enum, required: true, allowed_values: [primary_support, cross_validation, counter_evidence, blocking_condition, proxy_indicator, background_evidence], description: 证据角色。}
      requiredEvidenceCategory: {type: string, required: true, description: 必需证据类别。}
      requiredContentDomains: {type: array, required: true, description: 内容领域要求。}
      requiredObjectScope: {type: string, required: false, description: 对象范围。}
      requiredTimeScope: {type: string, required: false, description: 时间范围。}
      requiredGrain: {type: string, required: false, description: 粒度要求。}
      minimumQualityLevel: {type: enum, required: true, allowed_values: [Q1_background, Q2_reasoning_usable, Q3_directional_ready, Q4_report_grade], description: 最低证据质量。}
      minimumSourceTier: {type: enum, required: true, allowed_values: [L1, L2, L3, L4, L5, L6, L7], description: 最低来源层级。}
      minimumIndependentSourceCount: {type: integer, required: true, description: 最少独立来源数。}
      allowedProxy: {type: boolean, required: true, description: 是否允许代理指标。}
      stopCondition: {type: string, required: true, description: 停止补证或停止推理的条件。}
      missingPolicy: {type: string, required: true, description: 缺证据时如何处理。}
      allowed04OutputIfMet: {type: enum, required: true, allowed_values: [full_reasoning_ready, directional_only, conditional_only, insufficient, blocked, contested], description: 满足需求后 04 最高使用方式。}
      allowed04OutputIfMissing: {type: enum, required: true, allowed_values: [full_reasoning_ready, directional_only, conditional_only, insufficient, blocked, contested], description: 缺失时 04 降级方式。}
  EvidenceRecipe:
    id: EvidenceRecipe
    name: 取证配方
    description: 可复用取证策略在本体中的稳定引用。
    primary_key: id
    title_property: recipeName
    validity: true
    properties:
      recipeName: {type: string, required: true, description: 配方名称。}
      judgmentType: {type: string, required: true, description: 适用判断类型。}
      strategyLibraryRef: {type: string, required: true, description: 03 取证策略库文件引用。}
      strategyVersion: {type: string, required: true, description: 策略版本。}
      requiredBasketTypes: {type: array, required: true, description: 必需证据篮子类型。}
      mandatoryBasketTypes: {type: array, required: true, description: 强制篮子类型。}
      counterBasketTypes: {type: array, required: false, description: 反证篮子类型。}
      minimumPassRule: {type: string, required: true, description: 最低通过规则。}
      proxyRule: {type: string, required: false, description: 代理指标规则。}
      downgradeRule: {type: string, required: true, description: 降级规则。}
  EvidenceBasket:
    id: EvidenceBasket
    name: 证据篮子
    description: 判断单元所需的一组证据组合及其满足状态。
    primary_key: id
    title_property: basketType
    validity: true
    properties:
      basketType: {type: string, required: true, description: 证据篮子类型。}
      targetJudgmentUnitId: {type: string, required: true, description: 对应判断单元 ID。}
      basketRole: {type: enum, required: true, allowed_values: [primary_support, cross_validation, counter_evidence, blocking_condition, proxy_indicator, background_evidence], description: 篮子角色。}
      minimumSourceTier: {type: enum, required: true, allowed_values: [L1, L2, L3, L4, L5, L6, L7], description: 最低来源层级。}
      minimumIndependentSourceCount: {type: integer, required: true, description: 最少独立来源数。}
      allowedProxy: {type: boolean, required: true, description: 是否允许代理。}
      basketStatus: {type: enum, required: true, allowed_values: [met, partial, not_met, missing, contested, blocked, not_applicable], description: 篮子满足状态。}
      conflictStatus: {type: enum, required: true, allowed_values: [no_material_conflict, minor_conflict, material_conflict, unresolved_conflict, contested, not_checked, not_applicable], description: 冲突状态。}
      counterCheckStatus: {type: enum, required: true, allowed_values: [met, partial, checked, not_checked, not_applicable, missing, blocked], description: 反证检查状态。}
      qualityLevel: {type: enum, required: true, allowed_values: [Q1_background, Q2_reasoning_usable, Q3_directional_ready, Q4_report_grade], description: 篮子质量等级。}
      usageLimit: {type: string, required: false, description: 使用限制。}
      gapAction: {type: string, required: false, description: 缺口补齐动作。}
  SourceProfile:
    id: SourceProfile
    name: 来源画像
    description: 稳定来源类型能支持什么证据、不能支持什么用途。
    primary_key: id
    title_property: sourceProfileName
    validity: true
    properties:
      sourceProfileName: {type: string, required: true, description: 来源画像名称。}
      sourceTier: {type: enum, required: true, allowed_values: [L1, L2, L3, L4, L5, L6, L7], description: 来源层级。}
      sourceCategory: {type: string, required: true, description: 来源类别。}
      typicalContentDomains: {type: array, required: true, description: 常见内容领域。}
      allowedClaimTypes: {type: array, required: true, description: 允许支持的主张类型。}
      allowedEvidenceRoles: {type: array, required: true, description: 允许支持的证据角色。}
      forbiddenUses: {type: array, required: true, description: 禁用用途。}
      methodologyTransparency: {type: enum, required: true, allowed_values: [high, medium, low, unknown], description: 方法透明度。}
      updateFrequency: {type: string, required: false, description: 更新频率。}
      independenceGroupRule: {type: string, required: true, description: 独立来源计数规则。}
      accessScope: {type: enum, required: true, allowed_values: [public, internal, restricted, licensed], description: 访问范围。}
      defaultReliability: {type: enum, required: true, allowed_values: [low, medium, high, unknown], description: 默认可靠性。}
      requiredLocatorLevel: {type: string, required: true, description: 定位留痕要求。}
  AcquisitionChannel:
    id: AcquisitionChannel
    name: 取数通道
    description: 获取来源或数据的方式及留痕、权限和失败模式。
    primary_key: id
    title_property: channelName
    validity: true
    properties:
      channelName: {type: string, required: true, description: 通道名称。}
      channelType: {type: string, required: true, description: 通道类型。}
      supportedContentDomains: {type: array, required: true, description: 支持内容领域。}
      repeatability: {type: enum, required: true, allowed_values: [high, medium, low], description: 可复现程度。}
      traceabilityLevel: {type: string, required: true, description: 留痕要求。}
      permissionRequirement: {type: string, required: true, description: 权限要求。}
      typicalFailureModes: {type: array, required: false, description: 常见失败模式。}
      allowedUsage: {type: array, required: true, description: 允许用途。}
      forbiddenUsage: {type: array, required: true, description: 禁用用途。}
  ProxyIndicator:
    id: ProxyIndicator
    name: 代理指标
    description: 在直接证据不可得时用于代理状态变量或需求的指标及折扣规则。
    primary_key: id
    title_property: proxyIndicatorName
    validity: true
    properties:
      proxyIndicatorName: {type: string, required: true, description: 代理指标名称。}
      proxyFor: {type: string, required: true, description: 被代理对象、变量或需求。}
      targetStateVariableId: {type: string, required: false, description: 目标状态变量 ID。}
      targetRequirementId: {type: string, required: false, description: 目标证据需求 ID。}
      proxyLogic: {type: string, required: true, description: 代理逻辑。}
      validConditions: {type: array, required: true, description: 代理有效条件。}
      invalidConditions: {type: array, required: true, description: 代理失效条件。}
      confidenceDiscount: {type: string, required: true, description: 置信折扣。}
      cannotReplace: {type: array, required: true, description: 不能替代的直接证据。}
      requiredDisclosure: {type: string, required: true, description: 04/05 必须披露的限制。}
  EvidenceReadinessAssessment:
    id: EvidenceReadinessAssessment
    name: 证据准入评估
    description: 对判断单元证据需求、篮子、来源、反证、代理和冲突的准入结论。
    primary_key: id
    title_property: targetJudgmentUnitId
    validity: true
    properties:
      targetJudgmentUnitId: {type: string, required: true, description: 对应判断单元 ID。}
      targetRecipeId: {type: string, required: true, description: 采用的取证配方 ID。}
      supportStatus: {type: enum, required: true, allowed_values: [met, partial, checked, not_checked, not_applicable, missing, blocked], description: 支持证据状态。}
      crossValidationStatus: {type: enum, required: true, allowed_values: [met, partial, checked, not_checked, not_applicable, missing, blocked], description: 交叉验证状态。}
      counterStatus: {type: enum, required: true, allowed_values: [met, partial, checked, not_checked, not_applicable, missing, blocked], description: 反证检查状态。}
      conflictStatus: {type: enum, required: true, allowed_values: [no_material_conflict, minor_conflict, material_conflict, unresolved_conflict, contested, not_checked, not_applicable], description: 冲突状态。}
      sourceQualityStatus: {type: string, required: true, description: 来源质量状态。}
      proxyDependencyStatus: {type: enum, required: true, allowed_values: [none, low, moderate, high, proxy_only, not_applicable], description: 代理依赖状态。}
      overallReadinessStatus: {type: enum, required: true, allowed_values: [full_reasoning_ready, directional_only, conditional_only, insufficient, blocked, contested], description: 整体准入状态。}
      allowed04Output: {type: enum, required: true, allowed_values: [full_reasoning_ready, directional_only, conditional_only, insufficient, blocked, contested], description: 04 最高使用方式。}
      confidenceCeiling: {type: enum, required: true, allowed_values: [low, medium, high], description: 04 置信上限。}
      forbidden04Outputs: {type: array, required: false, description: 禁止 04 输出。}
      gapAction: {type: string, required: false, description: 缺口动作。}
      assessmentReason: {type: string, required: true, description: 准入理由。}

relation_types:
  claimCitesSource:
    id: claimCitesSource
    name: 主张引用来源
    description: 主张来自来源中的具体位置。
    source_types: [EvidenceClaim]
    target_types: [SourceDocument]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties:
      locator: {type: string, required: true, description: 主张在来源中的位置。}
  sourcePublishedBy:
    id: sourcePublishedBy
    name: 来源由组织发布
    description: 来源文档由可稳定识别的组织机构发布；publisher 文本继续保留原始展示值。
    source_types: [SourceDocument]
    target_types: [Organization]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  claimAbout:
    id: claimAbout
    name: 主张涉及对象
    description: 主张涉及某个稳定语义对象；状态变量通过推理域的观测或事件间接关联。
    source_types: [EvidenceClaim]
    target_types: [Concept, Organization, Industry, Segment, Company, Product, Material, ProcessStep, Asset, FinancialInstrument, Identifier, IdentificationScheme, TradingVenue, Listing, RoleAssignment, Region, Application, PolicyInstrument]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties:
      mentionRole: {type: string, required: false, description: 目标在主张中的角色。}
  factSupportedByClaim:
    id: factSupportedByClaim
    name: 事实由主张支撑
    description: 事实候选由一条或多条主张支撑。
    source_types: [EvidenceFact]
    target_types: [EvidenceClaim]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties:
      supportRole: {type: enum, required: true, allowed_values: [primary, corroborating, contextual], description: 主张对事实候选的支撑角色。}
  factAbout:
    id: factAbout
    name: 事实涉及对象
    description: 事实候选描述某个稳定语义对象；状态变量通过推理域的观测或事件间接关联。
    source_types: [EvidenceFact]
    target_types: [Concept, Organization, Industry, Segment, Company, Product, Material, ProcessStep, Asset, FinancialInstrument, Identifier, IdentificationScheme, TradingVenue, Listing, RoleAssignment, Region, Application, PolicyInstrument]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties: {}
  conflictsWith:
    id: conflictsWith
    name: 证据冲突
    description: 两项同类型证据存在尚未裁决的矛盾。
    source_types: [EvidenceClaim, EvidenceFact]
    target_types: [EvidenceClaim, EvidenceFact]
    direction: symmetric
    cardinality: many_to_many
    evidence_required: false
    same_type_required: true
    properties:
      conflictType: {type: string, required: true, description: 冲突类别。}
      conflictScope: {type: string, required: false, description: 冲突范围。}
  supersedes:
    id: supersedes
    name: 证据替代
    description: 新证据替代同类型旧证据。
    source_types: [EvidenceClaim, EvidenceFact]
    target_types: [EvidenceClaim, EvidenceFact]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    same_type_required: true
    properties:
      supersedeReason: {type: string, required: true, description: 替代原因。}
  invalidates:
    id: invalidates
    name: 证据失效
    description: 新证据使同类型旧证据不再适用。
    source_types: [EvidenceClaim, EvidenceFact]
    target_types: [EvidenceClaim, EvidenceFact]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    same_type_required: true
    properties:
      invalidationReason: {type: string, required: true, description: 失效原因。}
  requirementUsesRecipe:
    id: requirementUsesRecipe
    name: 证据需求使用取证配方
    description: 本次证据需求采用某个取证配方。
    source_types: [EvidenceRequirement]
    target_types: [EvidenceRecipe]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  recipeRequiresBasket:
    id: recipeRequiresBasket
    name: 配方要求证据篮子
    description: 取证配方要求某类证据篮子。
    source_types: [EvidenceRecipe]
    target_types: [EvidenceBasket]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties:
      basketRequirementRole: {type: enum, required: true, allowed_values: [mandatory, optional, counter], description: 篮子要求角色。}
  requirementRequiresBasket:
    id: requirementRequiresBasket
    name: 证据需求要求证据篮子
    description: 单项证据需求要求某个证据篮子。
    source_types: [EvidenceRequirement]
    target_types: [EvidenceBasket]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties:
      basketRole: {type: enum, required: true, allowed_values: [primary_support, cross_validation, counter_evidence, blocking_condition, proxy_indicator, background_evidence], description: 篮子角色。}
  requirementRequiresSourceProfile:
