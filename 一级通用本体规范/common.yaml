schema_name: ontology_common
schema_version: 1.0.0
status: active
description: 投研本体公共元模型，定义 Object、Relation、Action、Function、Logic、Rule 的共同结构。

resource_contracts:
  object_type:
    purpose: 定义具有独立身份、属性和生命周期的业务名词。
    required_fields: [id, name, description, primary_key, title_property, properties]
    optional_fields: [extends]
  property:
    purpose: 定义对象、关系、动作参数或输出中的有类型字段。
    required_fields: [name, type, required, description]
    optional_fields: [allowed_values]
    conditional_requirements:
      - when: type == enum
        requires: [allowed_values]
  relation_type:
    purpose: 定义对象类型之间可查询的有向语义连接。
    required_fields: [id, name, description, source_types, target_types, cardinality, properties]
  action_type:
    purpose: 定义有参数、前置条件和效果的领域行为。
    required_fields:
      [id, name, description, target_types, parameters, preconditions, effects, outputs, rule_refs, function_ref, write_scope]
  function:
    purpose: 定义可调用的计算、查询、归一或复杂变更能力。
    required_fields:
      [id, name, description, inputs, outputs, reads, writes, deterministic, side_effects, version]
  logic_flow:
    purpose: 定义可声明、可测试和可复用的业务或推理流程。
    required_fields:
      [id, name, description, inputs, steps, outputs, fallback]
  rule:
    purpose: 定义原子化、声明式的条件和约束。
    required_fields:
      [id, name, description, rule_type, applies_to, condition, result, priority, failure_handling]
    optional_fields:
      [version, input_types, output_types, required_evidence, counter_conditions, time_lag]

reference_direction:
  canonical_rule: 调用方保存正向引用；被调用方的 called_by 关系由正向引用派生，不重复维护。
  action:
    owns: [effects, write_scope]
    references: [rule_refs, logic_refs, function_ref]
  logic:
    owns: [steps, outputs, fallback]
    references: [rule_refs, function_ref, uses]
  function:
    owns: [inputs, outputs, reads, writes, side_effects]
    write_boundary: Function 只有在 Action 调用且写入目标位于 Action.write_scope 时才能修改正式对象或关系。
  rule:
    owns: [condition, result, failure_handling]
    invocation: 由 Action 的 rule_refs 或 Logic step 的 rule_refs 调用。

object_type_inheritance:
  declaration: 子类型通过 extends 保存唯一父类型引用；父类型可直接实例化，也可由子类型继承。
  identity_rule: 同一现实主体只创建一个最具体类型实例；Company 实例同时满足 Organization 端点，不再创建重复 Organization 实例。
  property_rule: 子类型继承父类型属性；同名属性不得重复定义为冲突类型。
  endpoint_rule: 关系允许父类型作为端点时，其所有子类型实例均兼容该端点。
  validation: extends 必须指向已存在对象类型，继承链不得形成环。

data_types:
  scalar: [string, integer, number, boolean, date, datetime, any]
  compound: [array, object, enum, object_ref, semantic_ref, reasoning_ref, evidence_ref]

shared_object_properties:
  id:
    type: string
    required: true
    description: 对象实例的稳定唯一标识。
  description:
    type: string
    required: true
    description: 对象含义或边界。
  validFrom:
    type: datetime
    required: false
    description: 对象开始有效的业务时间。
  validTo:
    type: datetime
    required: false
    description: 对象结束有效的业务时间。

shared_relation_properties:
  id:
    type: string
    required: true
    description: 关系实例的稳定唯一标识。
  sourceId:
    type: object_ref
    required: true
    description: 起点对象。
  targetId:
    type: object_ref
    required: true
    description: 终点对象。
  validFrom:
    type: datetime
    required: false
    description: 关系开始有效的业务时间。
  validTo:
    type: datetime
    required: false
    description: 关系结束有效的业务时间。

common_enums:
  cardinality: [one_to_one, one_to_many, many_to_one, many_to_many]
  rule_type: [validation, inference, scoring, blocking]
  confidence: [low, medium, high, unknown]
  conclusion_level: [insufficient_evidence, observation, supported, contested, blocked]
  signal_role: [support, catalyst, track, weaken, block]
  direction: [increase, decrease, stable, positive, negative, neutral, uncertain]

layer_model:
  semantic:
    purpose: 定义稳定对象、属性和结构关系。
    may_depend_on: []
  evidence:
    purpose: 定义来源、主张、事实候选及证据关系。
    may_depend_on: [semantic]
  reasoning:
    purpose: 定义状态、事件、假设、信号、判断、定价比较、事后验证、推理留痕和推理能力。
    may_depend_on: [semantic, evidence]

object_role_families:
  stable_semantics: [Concept, Organization, Company, Industry, Segment, Product, Material, ProcessStep, Asset, Region, Application, PolicyInstrument]
  evidence: [SourceDocument, EvidenceClaim, EvidenceFact]
  state_and_fact: [StateVariable, Observation, Event]
  hypothesis_and_judgment: [Hypothesis, Signal, Judgment]
  pricing_comparison: [MarketExpectation, ExpectationGap, AssetImpact]
  scenario_and_record: [Scenario, ReasoningTrace, ValidationRecord]
  note: 以上是按本体职责和推理角色划分的对象族；Object、Relation、Action、Function、Logic、Rule 属于元模型资源，不与业务对象并列。

cross_layer_constraints:
  - id: semantic_contains_stable_meaning_only
    description: 时点数值、变化方向、单次事件和判断不得写入语义层。
  - id: evidence_does_not_create_judgment
    description: 证据只能由推理域关系直接支撑 Observation、Event、MarketExpectation 或 Signal，不得直接创建 Judgment 或 AssetImpact。
  - id: reasoning_requires_traceable_inputs
    description: 动态推理对象必须可回到语义锚点、证据或明确前提。
  - id: presentation_must_not_upgrade_conclusion
    description: 报告或展示不得补造证据、改变规则或提升 Judgment 已有的结论等级。
  - id: function_write_requires_action
    description: Function 修改正式对象或关系时必须由 Action 调用，并受 Action.write_scope 约束。
  - id: single_authoritative_effect
    description: 同一 Action 效果只能由声明式 effect/rule 或 Function-backed 实现，不得重复定义。
  - id: logic_is_explicit_workflow
    description: Logic 只描述可检查的输入、步骤、输出和降级路径，不表示模型内部思维过程。
  - id: layer_dependency_is_acyclic
    description: 层间依赖固定为 common → semantic → evidence → reasoning，禁止下层反向引用上层对象或能力。
  - id: enum_requires_allowed_values
    description: 所有 type 为 enum 的字段必须声明非空 allowed_values，枚举取值不得只写在 description 中。
  - id: object_inheritance_preserves_identity
    description: 子类型继承父类型能力但不复制现实对象身份；父子类型实例不得为同一主体重复建档。
  - id: hypothesis_requires_falsifiability
    description: Hypothesis 必须有变量锚点、方向、时间尺度和证伪条件，但不强制已有验证证据。
  - id: validation_preserves_original_trace
    description: ValidationRecord 只能追加事后验证结果和修订建议，不得覆盖原始 ReasoningTrace。

modeling_granularity:
  - id: separate_type_and_instance
    description: 核心 schema 只定义通用类型，不包含行业、公司、事件、日期或数值实例。
  - id: separate_core_and_extension
    description: 跨行业稳定内容进入核心；行业特有内容进入行业扩展。
  - id: object_when_identity_is_required
    description: 需要独立身份、关系引用或生命周期时建对象，否则建属性。
  - id: reify_complex_relation
    description: 关系需要独立身份、丰富属性或生命周期时升级为对象。
  - id: separate_stable_and_dynamic
    description: 稳定结构进入语义层，时点值和变化进入推理层。
  - id: separate_claim_fact_judgment
    description: 材料说法是 Claim，归一结果是 Fact，分析解释是 Hypothesis 或 Judgment。
  - id: separate_relation_and_rule
    description: Relation 表达连接，Rule 表达条件成立时的约束或推论。
  - id: separate_action_and_function
    description: Action 定义业务意图和允许效果，Function 实现计算或复杂执行。
  - id: avoid_duplicate_authority
    description: 同一语义只保留一个权威类型、关系、规则或效果实现。
  - id: preserve_traceability
    description: 动态对象、推理结果和重要关系必须保留时间、证据和适用条件。
