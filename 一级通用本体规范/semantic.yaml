schema_name: ontology_semantic
schema_version: 1.0.0
status: active
depends_on: [common.yaml]
description: 语义结构域的 Object、Relation、Action 及 Function、Logic、Rule 定义。

object_types:
  Concept:
    id: Concept
    name: 概念
    description: 管理术语定义、适用范围和概念边界，不自动等同于现实对象。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 概念名称。}
      aliases: {type: array, required: false, description: 可归一到该概念的别名。}
      definition: {type: string, required: true, description: 当前本体采用的术语定义。}
      inclusionCriteria: {type: array, required: false, description: 纳入该概念的条件。}
      exclusionCriteria: {type: array, required: false, description: 排除该概念的条件。}
  Industry:
    id: Industry
    name: 产业
    description: 可独立描述的产业分类。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 产业名称。}
      aliases: {type: array, required: false, description: 产业别名。}
      classificationLevel: {type: string, required: false, description: 产业分类层级。}
  Segment:
    id: Segment
    name: 产业链环节
    description: 产业链中具有相对稳定功能的位置。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 环节名称。}
      aliases: {type: array, required: false, description: 环节别名。}
      segmentRole: {type: string, required: false, description: 环节的稳定功能。}
  Organization:
    id: Organization
    name: 组织机构
    description: 可独立识别并承担发布、监管、标准制定、行业协调、研究或其他公共职能的组织主体；商业公司使用其子类型 Company。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 组织常用名称。}
      aliases: {type: array, required: false, description: 组织别名、缩写或多语言名称。}
      legalName: {type: string, required: false, description: 组织正式登记名称。}
      organizationKind: {type: enum, required: false, allowed_values: [government_agency, regulator, standards_body, industry_association, exchange, multilateral_organization, research_institution, nonprofit, other], description: 非公司组织的稳定类型；Company 由子类型本身表达。}
  Company:
    id: Company
    name: 公司
    description: 以商业经营为主要身份的组织主体，继承 Organization 的身份字段和父类型端点能力。
    extends: Organization
    primary_key: id
    title_property: name
    validity: true
    properties: {}
  Product:
    id: Product
    name: 产品
    description: 被生产、使用、交易或交付的产品或产品类别。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 产品名称。}
      aliases: {type: array, required: false, description: 产品别名。}
      productCategory: {type: string, required: false, description: 产品类别。}
  Material:
    id: Material
    name: 材料
    description: 产品或工序使用的原料、部件或投入品。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 材料名称。}
      aliases: {type: array, required: false, description: 材料别名。}
      materialCategory: {type: string, required: false, description: 材料或投入品类别。}
  ProcessStep:
    id: ProcessStep
    name: 工序
    description: 生产、加工、验证或交付过程中的稳定步骤。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 工序名称。}
      aliases: {type: array, required: false, description: 工序别名。}
      processRole: {type: string, required: false, description: 工序承担的功能。}
  Region:
    id: Region
    name: 地区与管辖范围
    description: 可稳定引用的地理、经济区域或监管适用范围；不表示下游需求市场、证券交易所或临时政策事件。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 地区或管辖范围名称。}
      aliases: {type: array, required: false, description: 地区别名或常用简称。}
      regionType: {type: enum, required: true, allowed_values: [global, country, region, subnational, regulatory_jurisdiction, economic_area], description: 地理或管辖范围类型。}
  Application:
    id: Application
    name: 应用与下游场景
    description: 产品被使用的稳定下游用途、终端应用或需求场景；不替代产品身份或产业分类。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 应用或下游场景名称。}
      aliases: {type: array, required: false, description: 应用别名或常用简称。}
      applicationCategory: {type: string, required: false, description: 应用的通用分类。}
  PolicyInstrument:
    id: PolicyInstrument
    name: 政策与监管工具
    description: 具有稳定身份、发布主体和适用范围的政策、法律、法规、监管规则、管制措施、补贴机制或行业标准；发布、修订、执行、延期和失效属于 Event。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 政策或监管工具名称。}
      aliases: {type: array, required: false, description: 政策简称、旧称或常用别名。}
      canonicalIdentifier: {type: string, required: false, description: 法案号、文件号、规则编号或标准编号。}
      instrumentType: {type: enum, required: true, allowed_values: [law, regulation, regulatory_rule, policy_program, subsidy_scheme, control_measure, industry_standard, guidance, other], description: 政策与监管工具类型。}
      scopeDescription: {type: string, required: true, description: 工具的稳定适用主题和边界，不包含当前执行强弱判断。}
  Asset:
    id: Asset
    name: 资产
    description: 判断最终可以关联的股票、债券、商品或其他资产标的。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 资产名称。}
      aliases: {type: array, required: false, description: 资产别名。}
      assetClass: {type: enum, required: true, allowed_values: [equity, bond, commodity, fund, index, currency, derivative, other], description: 资产类别。}
      symbol: {type: string, required: false, description: 市场识别代码。}

relation_types:
  conceptBroaderThan:
    id: conceptBroaderThan
    name: 概念上位
    description: 起点是终点的上位概念。
    source_types: [Concept]
    target_types: [Concept]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties: {}
  conceptOverlapsWith:
    id: conceptOverlapsWith
    name: 概念交叉
    description: 两个概念存在交叉范围。
    source_types: [Concept]
    target_types: [Concept]
    direction: symmetric
    cardinality: many_to_many
    evidence_required: false
    properties:
      overlapScope: {type: string, required: false, description: 交叉范围。}
  conceptExcludes:
    id: conceptExcludes
    name: 概念排除
    description: 当前口径明确排除目标概念。
    source_types: [Concept]
    target_types: [Concept]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties:
      exclusionBasis: {type: string, required: false, description: 排除依据。}
  conceptMapsToObject:
    id: conceptMapsToObject
    name: 概念映射对象
    description: 概念映射到现实对象。
    source_types: [Concept]
    target_types: [Organization, Industry, Segment, Company, Product, Material, ProcessStep, Asset, Region, Application, PolicyInstrument]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties:
      mappingRole: {type: enum, required: true, allowed_values: [exact, broader, narrower, related], description: 概念与对象的映射角色。}
  subIndustryOf:
    id: subIndustryOf
    name: 子产业归属
    description: 子产业归属上级产业。
    source_types: [Industry]
    target_types: [Industry]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  subRegionOf:
    id: subRegionOf
    name: 地区层级归属
    description: 起点地区或管辖范围属于目标地区或更高层级范围。
    source_types: [Region]
    target_types: [Region]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  segmentBelongsToIndustry:
    id: segmentBelongsToIndustry
    name: 环节归属产业
    description: 环节归属产业。
    source_types: [Segment]
    target_types: [Industry]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  companyBelongsToIndustry:
    id: companyBelongsToIndustry
    name: 公司归属产业
    description: 公司属于或主要参与某产业。
    source_types: [Company]
    target_types: [Industry]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      membershipRole: {type: string, required: false, description: 公司在产业中的角色。}
  companyParticipatesInSegment:
    id: companyParticipatesInSegment
    name: 公司参与环节
    description: 公司参与某产业链环节。
    source_types: [Company]
    target_types: [Segment]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      participationRole: {type: string, required: false, description: 参与角色。}
  companyOperatesInRegion:
    id: companyOperatesInRegion
    name: 公司经营地区
    description: 公司在某地区具有相对稳定的总部、注册、生产、销售或服务活动；地区风险暴露由 companyExposedToRegion 表达。
    source_types: [Company]
    target_types: [Region]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      operationRole: {type: enum, required: true, allowed_values: [headquarters, registered_office, production, sales, service, other], description: 公司在该地区的实际经营或注册角色。}
  organizationLocatedIn:
    id: organizationLocatedIn
    name: 组织机构所在地
    description: 组织机构的总部、注册地、主要办公地或职权所在辖区；Company 可作为 Organization 子类型使用该关系。
    source_types: [Organization]
    target_types: [Region]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      locationRole: {type: enum, required: true, allowed_values: [headquarters, registered_office, principal_office, jurisdictional_scope, other], description: 组织与地区的稳定位置或职权角色。}
  companyExposedToRegion:
    id: companyExposedToRegion
    name: 公司地区暴露
    description: 公司对某地区存在长期收入、需求、供应链、监管或融资暴露；时点占比和敏感度进入推理域。
    source_types: [Company]
    target_types: [Region]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      exposureChannel: {type: enum, required: true, allowed_values: [revenue, demand, supply_chain, regulatory, financing, other], description: 公司地区暴露的长期渠道。}
  companySuppliesCompany:
    id: companySuppliesCompany
    name: 公司供应公司
    description: 起点公司长期向目标公司提供产品、制造、分销或服务；具体订单和收入占比不进入该关系。
    source_types: [Company]
    target_types: [Company]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    derived_inverse: customerOf
    properties:
      supplyScope: {type: string, required: true, description: 稳定供应的产品、服务或业务范围。}
      suppliedProductRefs: {type: array, required: false, description: 可解析时引用被供应的 Product。}
      supplyRole: {type: enum, required: true, allowed_values: [direct_supplier, indirect_supplier, contract_manufacturer, distributor, service_provider], description: 供应关系角色。}
  productProducedBy:
    id: productProducedBy
    name: 产品由公司生产
    description: 产品由公司生产或经营。
    source_types: [Product]
    target_types: [Company]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      productionRole: {type: string, required: false, description: 生产或经营角色。}
  productBelongsToSegment:
    id: productBelongsToSegment
    name: 产品归属环节
    description: 产品归属某产业链环节。
    source_types: [Product]
    target_types: [Segment]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties: {}
  subApplicationOf:
    id: subApplicationOf
    name: 应用层级归属
    description: 起点应用属于目标上位应用或下游场景。
    source_types: [Application]
    target_types: [Application]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  applicationBelongsToIndustry:
    id: applicationBelongsToIndustry
    name: 应用归属产业
    description: 应用或下游场景归属于某产业范围。
    source_types: [Application]
    target_types: [Industry]
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties: {}
  productUsedInApplication:
    id: productUsedInApplication
    name: 产品用于应用
    description: 产品被用于某个稳定的下游应用或终端场景。
    source_types: [Product]
    target_types: [Application]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      usageRole: {type: string, required: false, description: 产品在应用中的用途或角色。}
  companyExposedToApplication:
    id: companyExposedToApplication
    name: 公司应用暴露
    description: 公司对某个下游应用或终端场景存在长期业务暴露；时点收入占比或变化仍进入推理域。
    source_types: [Company]
    target_types: [Application]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      exposureType: {type: string, required: false, description: 公司对该应用的暴露类别。}
  policyIssuedBy:
    id: policyIssuedBy
    name: 政策由组织发布
    description: 政策或监管工具由具有正式权限的组织发布、制定或通过。
    source_types: [PolicyInstrument]
    target_types: [Organization]
    direction: directed
    cardinality: many_to_one
    evidence_required: true
    properties: {}
  policyAdministeredBy:
    id: policyAdministeredBy
    name: 政策由组织执行
    description: 政策或监管工具由一个或多个组织负责执行、监管、解释或维护。
    source_types: [PolicyInstrument]
    target_types: [Organization]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      administrationRole: {type: enum, required: true, allowed_values: [enforcement, supervision, interpretation, implementation, maintenance], description: 组织对政策工具的执行角色。}
  policyAppliesIn:
    id: policyAppliesIn
    name: 政策适用地区
    description: 政策或监管工具在某地理、经济区域或监管辖区内适用。
    source_types: [PolicyInstrument]
    target_types: [Region]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties: {}
  policyAppliesTo:
    id: policyAppliesTo
    name: 政策适用对象
    description: 政策或监管工具稳定适用于组织、产业、环节、产品、材料、工序或应用；当前影响强弱进入推理域。
    source_types: [PolicyInstrument]
    target_types: [Organization, Industry, Segment, Product, Material, ProcessStep, Application]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      applicabilityRole: {type: enum, required: false, allowed_values: [regulated, supported, restricted, required, exempted, referenced], description: 政策对目标的稳定适用角色，不代表当前影响结论。}
  materialUsedInProduct:
    id: materialUsedInProduct
    name: 产品使用材料
    description: 材料被产品使用。
    source_types: [Material]
    target_types: [Product]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      usageRole: {type: string, required: false, description: 材料的使用角色。}
  processBelongsToSegment:
    id: processBelongsToSegment
    name: 工序归属环节
    description: 工序归属某产业链环节。
    source_types: [ProcessStep]
    target_types: [Segment]
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  processProducesProduct:
    id: processProducesProduct
    name: 工序产出产品
    description: 工序产生或加工产品。
    source_types: [ProcessStep]
    target_types: [Product]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      outputRole: {type: string, required: false, description: 工序对产品的作用。}
  upstreamOf:
    id: upstreamOf
    name: 上游关系
    description: 起点在稳定业务结构中位于终点上游。
    source_types: [Segment, Product, Material, ProcessStep]
    target_types: [Segment, Product, Material, ProcessStep]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      pathRole: {type: string, required: false, description: 上下游路径角色。}
  dependsOn:
    id: dependsOn
    name: 结构性依赖
    description: 起点对终点存在结构性依赖。
    source_types: [Company, Product, ProcessStep]
    target_types: [Product, Material, ProcessStep]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      dependencyKind: {type: string, required: false, description: 依赖类别。}
      criticality: {type: enum, required: false, allowed_values: [low, medium, high], description: 依赖关键性。}
  substitutesFor:
    id: substitutesFor
    name: 替代关系
    description: 起点可以在特定范围替代终点。
    source_types: [Product, Material]
    target_types: [Product, Material]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      substitutionScope: {type: string, required: false, description: 可替代范围。}
  competesWith:
    id: competesWith
    name: 竞争关系
    description: 两者存在稳定竞争关系。
    source_types: [Company, Product, Material]
    target_types: [Company, Product, Material]
    direction: symmetric
    cardinality: many_to_many
    evidence_required: true
    properties:
      competitionScope: {type: string, required: false, description: 竞争范围。}
  companyLinkedToAsset:
    id: companyLinkedToAsset
    name: 公司映射资产
    description: 公司与可交易资产之间的映射。
    source_types: [Company]
    target_types: [Asset]
    direction: directed
    cardinality: one_to_many
    evidence_required: true
    properties:
      linkRole: {type: string, required: false, description: 发行、控制或其他映射角色。}
  assetExposedTo:
    id: assetExposedTo
    name: 资产业务暴露
    description: 资产对业务对象存在结构性暴露。
    source_types: [Asset]
    target_types: [Industry, Segment, Company, Product, Material, Region, Application]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      exposureType: {type: string, required: false, description: 暴露类别。}

action_types:
  DefineConcept:
    id: DefineConcept
    name: 定义概念
    description: 创建或补充术语定义和边界。
    target_types: [Concept]
    parameters: [name, definition, inclusionCriteria, exclusionCriteria]
    preconditions: [术语可识别]
    effects: [create_or_update_Concept]
    outputs: [Concept]
    rule_refs: [concept_definition_required]
    function_ref: NormalizeTerm
    logic_refs: [ConceptAdmissionLogic]
    write_scope: [Concept]
  ResolveConceptBoundary:
    id: ResolveConceptBoundary
    name: 裁定概念边界
    description: 记录概念纳入或排除边界。
    target_types: [Concept]
    parameters: [conceptRef, boundaryQuestion, decision, basis]
    preconditions: [Concept 已存在]
    effects: [update_Concept_boundary]
    outputs: [Concept]
    rule_refs: [concept_object_separation]
    function_ref: null
    logic_refs: [ConceptAdmissionLogic]
    write_scope: [Concept]
  RegisterSemanticObject:
    id: RegisterSemanticObject
    name: 登记语义对象
    description: 解析身份后创建稳定语义对象。
    target_types: [Organization, Industry, Segment, Company, Product, Material, ProcessStep, Asset, Region, Application, PolicyInstrument]
    parameters: [objectType, name, description, properties]
    preconditions: [身份可解析且未重复]
    effects: [create_semantic_object]
    outputs: [semantic_object_ref]
    rule_refs: [unique_identity, organization_kind_required]
    function_ref: ResolveEntityIdentity
    logic_refs: [ObjectIdentityResolutionLogic]
    write_scope: [Organization, Industry, Segment, Company, Product, Material, ProcessStep, Asset, Region, Application, PolicyInstrument]
  ReviseSemanticObject:
    id: ReviseSemanticObject
    name: 修订语义对象
    description: 在不改变对象身份的前提下修订允许属性。
    target_types: [Concept, Organization, Industry, Segment, Company, Product, Material, ProcessStep, Asset, Region, Application, PolicyInstrument]
    parameters: [objectRef, changedProperties, basis]
    preconditions: [对象存在且类型不变]
    effects: [update_allowed_properties]
    outputs: [semantic_object_ref]
    rule_refs: [stable_semantics_only]
    function_ref: null
    logic_refs: []
    write_scope: [Concept, Organization, Industry, Segment, Company, Product, Material, ProcessStep, Asset, Region, Application, PolicyInstrument]
  MergeSemanticObjects:
    id: MergeSemanticObjects
    name: 合并语义对象
    description: 合并被确认属于同一实体的同类型对象。
    target_types: [Concept, Organization, Industry, Segment, Company, Product, Material, ProcessStep, Asset, Region, Application, PolicyInstrument]
    parameters: [primaryObjectRef, mergedObjectRefs, basis]
    preconditions: [对象同类型且身份一致]
    effects: [merge_properties, preserve_reference_mapping]
    outputs: [primary_object_ref]
    rule_refs: [unique_identity]
    function_ref: DetectDuplicateObject
    logic_refs: [ObjectIdentityResolutionLogic]
    write_scope: [Concept, Organization, Industry, Segment, Company, Product, Material, ProcessStep, Asset, Region, Application, PolicyInstrument]
  DeprecateSemanticObject:
    id: DeprecateSemanticObject
    name: 废弃语义对象
    description: 终止对象当前定义的有效期并保留历史。
    target_types: [Concept, Organization, Industry, Segment, Company, Product, Material, ProcessStep, Asset, Region, Application, PolicyInstrument]
    parameters: [objectRef, reason, invalidAt]
    preconditions: [对象存在]
    effects: [set_validTo, mark_deprecated]
    outputs: [object_status]
    rule_refs: [stable_semantics_only]
    function_ref: null
    logic_refs: []
    write_scope: [Concept, Organization, Industry, Segment, Company, Product, Material, ProcessStep, Asset, Region, Application, PolicyInstrument]
  CreateSemanticRelation:
    id: CreateSemanticRelation
    name: 创建语义关系
    description: 创建端点、基数和稳定性均合法的语义关系。
    target_types: [semantic_relation]
    parameters: [relationType, sourceRef, targetRef, properties]
    preconditions: [端点及基数合法]
    effects: [create_semantic_relation]
    outputs: [relation_ref]
    rule_refs: [relation_endpoint_compatibility, complex_relation_reification]
    function_ref: ValidateRelationEndpoints
    logic_refs: [SemanticRelationAdmissionLogic]
    write_scope: [semantic_relation]
  ReviseSemanticRelation:
    id: ReviseSemanticRelation
    name: 修订语义关系
    description: 修订关系轻量属性或有效期。
    target_types: [semantic_relation]
    parameters: [relationRef, changedProperties, basis]
    preconditions: [关系存在且端点合法]
    effects: [update_relation_properties]
    outputs: [relation_ref]
    rule_refs: [relation_endpoint_compatibility, complex_relation_reification]
    function_ref: ValidateRelationEndpoints
    logic_refs: [SemanticRelationAdmissionLogic]
    write_scope: [semantic_relation]
  RemoveSemanticRelation:
    id: RemoveSemanticRelation
    name: 移除语义关系
    description: 终止语义关系有效期并保留历史。
    target_types: [semantic_relation]
    parameters: [relationRef, reason, invalidAt]
    preconditions: [关系存在]
    effects: [set_relation_validTo]
    outputs: [relation_status]
    rule_refs: [relation_endpoint_compatibility]
    function_ref: null
    logic_refs: []
    write_scope: [semantic_relation]

functions:
  NormalizeTerm:
    id: NormalizeTerm
    name: 术语归一
    description: 将名称和别名归一为候选标准术语。
    inputs: [name, aliases, language]
    outputs: [normalizedTerm]
    reads: [Concept]
    writes: []
    deterministic: false
    side_effects: false
    version: 1.0.0
  ResolveEntityIdentity:
    id: ResolveEntityIdentity
    name: 实体消歧
    description: 判断对象候选是否对应已有实体。
    inputs: [objectType, name, properties, candidateRefs]
    outputs: [identityResolution]
    reads: [semantic_object]
    writes: []
    deterministic: false
    side_effects: false
    version: 1.0.0
  DetectDuplicateObject:
    id: DetectDuplicateObject
    name: 重复对象检测
    description: 返回重复对象候选及相似度。
    inputs: [objectRefs]
    outputs: [duplicateCandidates]
    reads: [semantic_object]
    writes: []
    deterministic: false
    side_effects: false
    version: 1.0.0
  ValidateRelationEndpoints:
    id: ValidateRelationEndpoints
    name: 关系端点校验
    description: 校验端点类型、方向和基数。
    inputs: [relationType, sourceRef, targetRef]
    outputs: [validationResult]
    reads: [semantic_object, semantic_relation]
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0

logic_flows:
  ConceptAdmissionLogic:
    id: ConceptAdmissionLogic
    name: 概念准入逻辑
    description: 从术语说明形成概念或边界问题。
    inputs: [term, scopeDescription]
    steps:
      - {id: normalize, function_ref: NormalizeTerm}
      - {id: validate_definition, rule_refs: [concept_definition_required]}
      - {id: separate_concept_object, rule_refs: [concept_object_separation]}
    outputs: [Concept, boundaryIssue]
    fallback: 定义不足时不准入。
  ObjectIdentityResolutionLogic:
    id: ObjectIdentityResolutionLogic
    name: 对象身份解析逻辑
    description: 解析对象身份并处理重复候选。
    inputs: [objectCandidate]
    steps:
      - {id: resolve_identity, function_ref: ResolveEntityIdentity}
      - {id: detect_duplicate, function_ref: DetectDuplicateObject}
      - {id: validate_unique, rule_refs: [unique_identity]}
    outputs: [newObjectCandidate, existingObjectRef, mergeCandidate]
    fallback: 无法确定时保持候选。
  SemanticRelationAdmissionLogic:
    id: SemanticRelationAdmissionLogic
    name: 语义关系准入逻辑
    description: 校验关系端点、稳定性和对象化要求。
    inputs: [relationCandidate]
    steps:
      - {id: validate_endpoints, function_ref: ValidateRelationEndpoints, rule_refs: [relation_endpoint_compatibility]}
      - {id: validate_stability, rule_refs: [stable_semantics_only]}
      - {id: check_reification, rule_refs: [complex_relation_reification]}
    outputs: [admittedRelation, rejectionReason]
    fallback: 动态关系转交推理域。

rules:
  concept_definition_required:
    id: concept_definition_required
    name: 概念定义完整性
    description: 概念定义和边界必须可理解。
    rule_type: validation
    applies_to: [Concept]
    condition: definition 非空，且纳入或排除口径不存在自相矛盾。
    result: Concept 可进入准入判断。
    priority: 50
    failure_handling: reject_admission
  concept_object_separation:
    id: concept_object_separation
    name: 概念与对象分离
    description: 术语口径不得直接替代现实对象身份。
    rule_type: validation
    applies_to: [Concept, semantic_object]
    condition: 只有需要独立引用和关系连接时才映射为对象。
    result: 保持 Concept 或形成对象候选。
    priority: 60
    failure_handling: keep_as_concept
  stable_semantics_only:
    id: stable_semantics_only
    name: 只保存稳定语义
    description: 语义域不得承载时点值、方向变化或判断。
    rule_type: blocking
    applies_to: [semantic_object, semantic_relation]
    condition: 候选内容包含时点值、变化方向、事件或判断。
    result: 阻止写入语义域。
    priority: 100
    failure_handling: route_to_reasoning
  unique_identity:
    id: unique_identity
    name: 身份唯一性
    description: 同一类型和身份键不得产生重复正式对象。
    rule_type: validation
    applies_to: [semantic_object]
    condition: 候选身份与现有对象不重复。
    result: 允许创建对象。
    priority: 80
    failure_handling: return_existing_or_merge_candidate
  organization_kind_required:
    id: organization_kind_required
    name: 非公司组织类型完整
    description: 直接以 Organization 建档的非公司主体必须声明组织类型；Company 由子类型身份表达，无需重复声明。
    rule_type: validation
    applies_to: [Organization]
    condition: objectType 为 Company，或 organizationKind 使用允许枚举值。
    result: 允许组织主体进入身份解析。
    priority: 75
    failure_handling: return_missing_organization_kind
  relation_endpoint_compatibility:
    id: relation_endpoint_compatibility
    name: 关系端点兼容
    description: 起点、终点和基数必须符合关系定义。
    rule_type: validation
    applies_to: [semantic_relation]
    condition: sourceType、targetType 和 cardinality 均合法。
    result: 允许创建或修订关系。
    priority: 90
    failure_handling: reject_relation_change
  complex_relation_reification:
    id: complex_relation_reification
    name: 复杂关系对象化
    description: 复杂关系应升级为具有独立身份的对象。
    rule_type: validation
    applies_to: [semantic_relation]
    condition: 关系不需要独立身份、丰富属性、生命周期或被其他关系引用。
    result: 允许保持普通关系。
    priority: 70
    failure_handling: reify_as_object
