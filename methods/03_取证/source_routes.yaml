registry_type: evidence_source_route_registry
schema_version: 1.1.0
updated_at: 2026-07-29

# 本表是 B01/B02/OPS 的机器可执行投影。EvidenceProfile 仍以业务参数图为权威；
# 这里仅声明“到哪里、按什么顺序、用什么检索词、如何核验”。
defaults:
  preferred_channels: [public_web]
  verification_mode: quote_snapshot
  fallback_policy: search_then_fetch_then_gap
  max_queries_per_requirement: 2

routes:
  - id: semiconductor_demand_orders
    domains: [semiconductor]
    evidence_profile_ids: [demand_orders]
    judgment_types: [state_measurement, trend_direction, cycle_phase, mechanism_validation, causal_attribution, transmission_path]
    evidence_roles: [support, counter, context, boundary]
    match_terms: [需求, 出货, 订单, 资本开支, AI服务器, PC, 手机, smartphone, shipment, demand, order, capex]
    query_card_refs:
      - methods/03_取证/OPS_半导体真实来源查询与口径手册.md#需求与订单
    producers:
      - { name: IDC, domain: idc.com, tier: S4, authority_type: industry_provider }
      - { name: WSTS, domain: wsts.org, tier: S3, authority_type: industry_provider }
      - { name: SIA, domain: semiconductors.org, tier: S3, authority_type: industry_provider }
      - { name: TrendForce, domain: trendforce.com, tier: S4, authority_type: industry_provider }
      - { name: Counterpoint, domain: counterpointresearch.com, tier: S4, authority_type: industry_provider }
      - { name: Micron, domain: investors.micron.com, tier: S2, authority_type: company_disclosure }
      - { name: Samsung, domain: news.samsung.com, tier: S2, authority_type: company_disclosure }
      - { name: SK_hynix, domain: news.skhynix.com, tier: S2, authority_type: company_disclosure }
    query_terms: [shipments, demand, orders, capex, guidance]

  - id: semiconductor_capacity_supply
    domains: [semiconductor]
    evidence_profile_ids: [capacity_supply, manufacturing_yield]
    judgment_types: [state_measurement, trend_direction, cycle_phase, mechanism_validation, causal_attribution, transmission_path]
    evidence_roles: [support, counter, context, boundary]
    match_terms: [产能, 供给, 投片, 晶圆, 利用率, 良率, 封装, 交期, capacity, wafer, yield, utilization]
    query_card_refs:
      - methods/03_取证/OPS_半导体真实来源查询与口径手册.md#产能与供给
    producers:
      - { name: SEMI, domain: semi.org, tier: S3, authority_type: industry_provider }
      - { name: TSMC, domain: investor.tsmc.com, tier: S2, authority_type: company_disclosure }
      - { name: Micron, domain: investors.micron.com, tier: S2, authority_type: company_disclosure }
      - { name: Samsung, domain: news.samsung.com, tier: S2, authority_type: company_disclosure }
      - { name: SK_hynix, domain: news.skhynix.com, tier: S2, authority_type: company_disclosure }
      - { name: TrendForce, domain: trendforce.com, tier: S4, authority_type: industry_provider }
    query_terms: [capacity, wafer allocation, utilization, yield, production]

  - id: semiconductor_inventory
    domains: [semiconductor]
    evidence_profile_ids: [inventory_cycle]
    judgment_types: [state_measurement, trend_direction, cycle_phase]
    evidence_roles: [support, counter, context, boundary]
    match_terms: [库存, 去库, 补库, 渠道, 覆盖期, inventory, destocking, restocking]
    query_card_refs:
      - methods/03_取证/OPS_半导体真实来源查询与口径手册.md#库存
    producers:
      - { name: TrendForce, domain: trendforce.com, tier: S4, authority_type: industry_provider }
      - { name: IDC, domain: idc.com, tier: S4, authority_type: industry_provider }
      - { name: Counterpoint, domain: counterpointresearch.com, tier: S4, authority_type: industry_provider }
      - { name: Micron, domain: investors.micron.com, tier: S2, authority_type: company_disclosure }
      - { name: Samsung, domain: news.samsung.com, tier: S2, authority_type: company_disclosure }
    query_terms: [inventory, channel inventory, customer inventory, days]

  - id: semiconductor_pricing
    domains: [semiconductor]
    evidence_profile_ids: [pricing_economics]
    judgment_types: [state_measurement, trend_direction, cycle_phase, impact_realization, object_differentiation]
    evidence_roles: [support, counter, context, boundary]
    match_terms: [价格, 报价, 合约价, 现货价, 成本, 毛利率, pricing, contract price, spot price, margin]
    query_card_refs:
      - methods/03_取证/OPS_半导体真实来源查询与口径手册.md#价格与成本
    producers:
      - { name: TrendForce, domain: trendforce.com, tier: S4, authority_type: industry_provider }
      - { name: Micron, domain: investors.micron.com, tier: S2, authority_type: company_disclosure }
      - { name: Samsung, domain: news.samsung.com, tier: S2, authority_type: company_disclosure }
      - { name: SK_hynix, domain: news.skhynix.com, tier: S2, authority_type: company_disclosure }
      - { name: Sandisk, domain: investor.sandisk.com, tier: S2, authority_type: company_disclosure }
    query_terms: [contract price, spot price, pricing, gross margin]

  - id: semiconductor_technology_qualification
    domains: [semiconductor]
    evidence_profile_ids: [technology_route, qualification_commercialization]
    judgment_types: [mechanism_validation, causal_attribution, transmission_path, object_differentiation, impact_realization]
    evidence_roles: [support, counter, context, boundary]
    match_terms: [技术路线, 代际, 微缩, 认证, 送样, 量产, 客户验证, HBM, qualification, mass production, roadmap]
    query_card_refs:
      - methods/03_取证/OPS_半导体真实来源查询与口径手册.md#技术与量产
    producers:
      - { name: JEDEC, domain: jedec.org, tier: S3, authority_type: industry_provider }
      - { name: IEEE, domain: ieee.org, tier: S3, authority_type: industry_provider }
      - { name: Micron, domain: investors.micron.com, tier: S2, authority_type: company_disclosure }
      - { name: Samsung, domain: news.samsung.com, tier: S2, authority_type: company_disclosure }
      - { name: SK_hynix, domain: news.skhynix.com, tier: S2, authority_type: company_disclosure }
      - { name: TSMC, domain: investor.tsmc.com, tier: S2, authority_type: company_disclosure }
    query_terms: [roadmap, qualification, customer validation, mass production, reliability]

  - id: semiconductor_company_execution
    domains: [semiconductor]
    evidence_profile_ids: [company_exposure_execution, competition_structure]
    judgment_types: [object_differentiation, impact_realization, expectation_gap, valuation_impact]
    evidence_roles: [support, counter, context, boundary]
    match_terms: [公司, 收入, 利润, 现金流, 指引, 市占率, 份额, 竞争, revenue, earnings, guidance, market share]
    preferred_channels: [mcp, public_web]
    mcp_channels: [cninfo, datayes-stock-finoper-mcp, datayes-stock-mkt-mcp]
    verification_mode: structured_or_quote
    query_card_refs:
      - methods/03_取证/OPS_MCP查询快速参考.md
      - methods/03_取证/OPS_通用真实来源查询与回退手册.md
    producers:
      - { name: SEC, domain: sec.gov, tier: S1, authority_type: official }
      - { name: CNINFO, domain: cninfo.com.cn, tier: S1, authority_type: official }
      - { name: Micron, domain: investors.micron.com, tier: S2, authority_type: company_disclosure }
      - { name: Samsung, domain: news.samsung.com, tier: S2, authority_type: company_disclosure }
      - { name: SK_hynix, domain: news.skhynix.com, tier: S2, authority_type: company_disclosure }
      - { name: TSMC, domain: investor.tsmc.com, tier: S2, authority_type: company_disclosure }
    query_terms: [earnings, annual report, quarterly results, guidance, revenue, margin]

  - id: semiconductor_market_expectations
    domains: [semiconductor]
    evidence_profile_ids: [market_expectations]
    judgment_types: [expectation_gap, valuation_impact]
    evidence_roles: [support, counter, context, boundary]
    match_terms: [预期, 一致预期, 预测修正, 估值, 定价, expectation, consensus, revision, valuation]
    preferred_channels: [mcp, public_web]
    mcp_channels: [datayes-stock-mkt-mcp]
    verification_mode: structured_or_quote
    query_card_refs:
      - methods/03_取证/A07_市场预期与定价.md
      - methods/03_取证/OPS_MCP查询快速参考.md
    producers:
      - { name: SEC, domain: sec.gov, tier: S1, authority_type: official }
      - { name: CNINFO, domain: cninfo.com.cn, tier: S1, authority_type: official }
      - { name: Nasdaq, domain: nasdaq.com, tier: S4, authority_type: public_secondary }
      - { name: CompaniesMarketCap, domain: companiesmarketcap.com, tier: S5, authority_type: public_secondary }
    query_terms: [consensus, estimate revision, valuation, earnings expectation, price reaction]

  - id: semiconductor_policy
    domains: [semiconductor]
    evidence_profile_ids: [policy_trade]
    judgment_types: [state_measurement, mechanism_validation, causal_attribution, transmission_path, impact_realization]
    evidence_roles: [support, counter, context, boundary]
    match_terms: [政策, 法规, 出口管制, 许可, 制裁, 补贴, rule, regulation, export control, license]
    preferred_channels: [mcp, public_web]
    mcp_channels: [china-policy]
    verification_mode: quote_snapshot
    query_card_refs:
      - methods/03_取证/OPS_地缘规则与冲击查询手册.md
    producers:
      - { name: BIS, domain: bis.gov, tier: S1, authority_type: official }
      - { name: Federal_Register, domain: federalregister.gov, tier: S1, authority_type: official }
      - { name: GOV_CN, domain: gov.cn, tier: S1, authority_type: official }
      - { name: MOFCOM, domain: mofcom.gov.cn, tier: S1, authority_type: official }
    query_terms: [rule, regulation, effective date, license, scope]

  - id: semiconductor_counter
    domains: [semiconductor]
    evidence_profile_ids: [counter_evidence]
    judgment_types: [state_measurement, trend_direction, cycle_phase, mechanism_validation, causal_attribution, transmission_path, object_differentiation, impact_realization, expectation_gap, valuation_impact]
    evidence_roles: [counter]
    match_terms: [反证, 竞争解释, 下修, 延迟, 取消, 库存上升, 需求转弱, counter, slowdown, delay, cancel]
    query_card_refs:
      - methods/03_取证/A08_反证与竞争解释.md
    producers:
      - { name: TrendForce, domain: trendforce.com, tier: S4, authority_type: industry_provider }
      - { name: IDC, domain: idc.com, tier: S4, authority_type: industry_provider }
      - { name: Counterpoint, domain: counterpointresearch.com, tier: S4, authority_type: industry_provider }
      - { name: WSTS, domain: wsts.org, tier: S3, authority_type: industry_provider }
      - { name: SIA, domain: semiconductors.org, tier: S3, authority_type: industry_provider }
    query_terms: [downside, slowdown, inventory increase, delay, cancellation, weak demand]
