registry_type: evidence_source_route_registry
schema_version: 1.1.0
updated_at: 2026-07-29

# 本表是 B01/B02/OPS 的机器可执行投影。EvidenceProfile 仍以业务参数图为权威；
# 这里仅声明“到哪里、按什么顺序、用什么检索词、如何核验”。
defaults:
  preferred_channels: [public_web]
  verification_mode: quote_snapshot
  fallback_policy: search_then_fetch_then_gap
  max_queries_per_requirement: 2

routes:
  - id: semiconductor_demand_orders
    domains: [semiconductor]
    evidence_profile_ids: [demand_orders]
    judgment_types: [state_measurement, trend_direction, cycle_phase, mechanism_validation, causal_attribution, transmission_path]
    evidence_roles: [support, counter, context, boundary]
    match_terms: [需求, 出货, 订单, 资本开支, AI服务器, PC, 手机, smartphone, shipment, demand, order, capex]
    query_card_refs:
      - methods/03_取证/OPS_半导体真实来源查询与口径手册.md#需求与订单
    producers:
      - { name: IDC, domain: idc.com, tier: S4, authority_type: industry_provider }
      - { name: WSTS, domain: wsts.org, tier: S3, authority_type: industry_provider }
      - { name: SIA, domain: semiconductors.org, tier: S3, authority_type: industry_provider }
      - { name: TrendForce, domain: trendforce.com, tier: S4, authority_type: industry_provider }
      - { name: Counterpoint, domain: counterpointresearch.com, tier: S4, authority_type: industry_provider }
      - { name: Micron, domain: investors.micron.com, tier: S2, authority_type: company_disclosure }
      - { name: Samsung, domain: news.samsung.com, tier: S2, authority_type: company_disclosure }
      - { name: SK_hynix, domain: news.skhynix.com, tier: S2, authority_type: company_disclosure }
      # 国内晶圆厂（中芯国际/华虹等）资本开支与订单：补齐原清单只覆盖海外存储/代工厂的缺口
      - { name: CNINFO, domain: cninfo.com.cn, tier: S1, authority_type: official }
      - { name: SMIC, domain: investor.smic.com, tier: S2, authority_type: company_disclosure }
      - { name: SINA_Finance, domain: sina.com.cn, tier: S4, authority_type: public_secondary }
      - { name: Eastmoney, domain: eastmoney.com, tier: S4, authority_type: public_secondary }
    query_terms: [shipments, demand, orders, capex, guidance]

  - id: semiconductor_capacity_supply
    domains: [semiconductor]
    evidence_profile_ids: [capacity_supply, manufacturing_yield]
    judgment_types: [state_measurement, trend_direction, cycle_phase, mechanism_validation, causal_attribution, transmission_path]
    evidence_roles: [support, counter, context, boundary]
    match_terms: [产能, 供给, 投片, 晶圆, 利用率, 良率, 封装, 交期, capacity, wafer, yield, utilization]
    query_card_refs:
      - methods/03_取证/OPS_半导体真实来源查询与口径手册.md#产能与供给
    producers:
      - { name: SEMI, domain: semi.org, tier: S3, authority_type: industry_provider }
      - { name: TSMC, domain: investor.tsmc.com, tier: S2, authority_type: company_disclosure }
      - { name: Micron, domain: investors.micron.com, tier: S2, authority_type: company_disclosure }
      - { name: Samsung, domain: news.samsung.com, tier: S2, authority_type: company_disclosure }
      - { name: SK_hynix, domain: news.skhynix.com, tier: S2, authority_type: company_disclosure }
      - { name: TrendForce, domain: trendforce.com, tier: S4, authority_type: industry_provider }
      # 国内晶圆厂（中芯国际/华虹等）产能与利用率：补齐原清单只覆盖海外存储/代工厂的缺口
      - { name: CNINFO, domain: cninfo.com.cn, tier: S1, authority_type: official }
      - { name: SMIC, domain: investor.smic.com, tier: S2, authority_type: company_disclosure }
      - { name: SINA_Finance, domain: sina.com.cn, tier: S4, authority_type: public_secondary }
      - { name: Eastmoney, domain: eastmoney.com, tier: S4, authority_type: public_secondary }
    query_terms: [capacity, wafer allocation, utilization, yield, production]

