# 本文件由迁移工具生成；v2 启用后为对应域的机器权威。
schema_name: investment_research_semantic_ontology
schema_version: 3.0.0
status: active
depends_on:
- common.yaml
description: 跨行业投研严格语义本体；不包含证据、任务、推理、动作或运行状态。
object_types:
  Concept:
    id: Concept
    name: 概念
    description: 管理术语定义、适用范围和概念边界，不自动等同于现实对象。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 概念名称。
      aliases:
        type: array
        required: false
        description: 可归一到该概念的别名。
      definition:
        type: string
        required: true
        description: 当前本体采用的术语定义。
      inclusionCriteria:
        type: array
        required: false
        description: 纳入该概念的条件。
      exclusionCriteria:
        type: array
        required: false
        description: 排除该概念的条件。
  Industry:
    id: Industry
    name: 产业
    description: 可独立描述的产业分类。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 产业名称。
      aliases:
        type: array
        required: false
        description: 产业别名。
      classificationLevel:
        type: string
        required: false
        description: 产业分类层级。
  Segment:
    id: Segment
    name: 产业链环节
    description: 产业链中具有相对稳定功能的位置。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 环节名称。
      aliases:
        type: array
        required: false
        description: 环节别名。
      segmentRole:
        type: string
        required: false
        description: 环节的稳定功能。
  Organization:
    id: Organization
    name: 组织机构
    description: 可独立识别并承担发布、监管、标准制定、行业协调、研究或其他公共职能的组织主体；商业公司使用其子类型 Company。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 组织常用名称。
      aliases:
        type: array
        required: false
        description: 组织别名、缩写或多语言名称。
      legalName:
        type: string
        required: false
        description: 组织正式登记名称。
      organizationKind:
        type: enum
        required: false
        allowed_values:
        - government_agency
        - regulator
        - standards_body
        - industry_association
        - exchange
        - multilateral_organization
        - research_institution
        - nonprofit
        - other
        description: 非公司组织的稳定类型；Company 由子类型本身表达。
  Company:
    id: Company
    name: 公司
    description: 以商业经营为主要身份的组织主体，继承 Organization 的身份字段和父类型端点能力。
    extends: Organization
    primary_key: id
    title_property: name
    validity: true
    properties: {}
  Product:
    id: Product
    name: 产品
    description: 被生产、使用、交易或交付的产品或产品类别。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 产品名称。
      aliases:
        type: array
        required: false
        description: 产品别名。
      productCategory:
        type: string
        required: false
        description: 产品类别。
  Material:
    id: Material
    name: 材料
    description: 产品或工序使用的原料、部件或投入品。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 材料名称。
      aliases:
        type: array
        required: false
        description: 材料别名。
      materialCategory:
        type: string
        required: false
        description: 材料或投入品类别。
  ProcessStep:
    id: ProcessStep
    name: 工序
    description: 生产、加工、验证或交付过程中的稳定步骤。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 工序名称。
      aliases:
        type: array
        required: false
        description: 工序别名。
      processRole:
        type: string
        required: false
        description: 工序承担的功能。
  Region:
    id: Region
    name: 地区与管辖范围
    description: 可稳定引用的地理、经济区域或监管适用范围；不表示下游需求市场、证券交易所或临时政策事件。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 地区或管辖范围名称。
      aliases:
        type: array
        required: false
        description: 地区别名或常用简称。
      regionType:
        type: enum
        required: true
        allowed_values:
        - global
        - country
        - region
        - subnational
        - regulatory_jurisdiction
        - economic_area
        description: 地理或管辖范围类型。
  Application:
    id: Application
    name: 应用与下游场景
    description: 产品被使用的稳定下游用途、终端应用或需求场景；不替代产品身份或产业分类。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 应用或下游场景名称。
      aliases:
        type: array
        required: false
        description: 应用别名或常用简称。
      applicationCategory:
        type: string
        required: false
        description: 应用的通用分类。
  PolicyInstrument:
    id: PolicyInstrument
    name: 政策与监管工具
    description: 具有稳定身份、发布主体和适用范围的政策、法律、法规、监管规则、管制措施、补贴机制或行业标准；发布、修订、执行、延期和失效属于 Event。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 政策或监管工具名称。
      aliases:
        type: array
        required: false
        description: 政策简称、旧称或常用别名。
      canonicalIdentifier:
        type: string
        required: false
        description: 法案号、文件号、规则编号或标准编号。
      instrumentType:
        type: enum
        required: true
        allowed_values:
        - law
        - regulation
        - regulatory_rule
        - policy_program
        - subsidy_scheme
        - control_measure
        - industry_standard
        - guidance
        - other
        description: 政策与监管工具类型。
      scopeDescription:
        type: string
        required: true
        description: 工具的稳定适用主题和边界，不包含当前执行强弱判断。
  PolicyRequirement:
    id: PolicyRequirement
    name: 政策要求
    label_zh: 政策要求
    description: 政策或监管工具内部可稳定引用的一条要求、禁令、许可、定义或程序条款；用于锚定“哪条规定了什么”，不承载章条排版结构，也不表示当前执法强度。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 要求名称或摘要标题。
      requirementCode:
        type: string
        required: false
        description: 条款号、条目号或内部稳定编号。
      requirementKind:
        type: enum
        required: true
        allowed_values:
        - obligation
        - prohibition
        - permission
        - definition
        - procedure
        - other
        description: 要求类型。
      status:
        type: enum
        required: true
        allowed_values:
        - active
        - superseded
        - withdrawn
        description: 该要求当前是否仍作为有效语义单元；被替代时通过 requirementSupersededBy 指向后继。
      statement:
        type: string
        required: true
        description: 要求的稳定语义摘要，不是原文全文仓库。
  TechnicalConstraint:
    id: TechnicalConstraint
    name: 技术约束
    label_zh: 技术约束
    description: 对对象特性施加的可复核约束条件，如数值区间、枚举取值、符合性引用或逻辑表达式；由政策要求或其他稳定规范引用，不表示一次观测读数。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 约束名称。
      constraintForm:
        type: enum
        required: true
        allowed_values:
        - numeric_range
        - enum_value
        - logical_expression
        - conformance
        description: 约束形式。
      minValue:
        type: number
        required: false
        description: 数值下限；constraintForm=numeric_range 时使用。
      maxValue:
        type: number
        required: false
        description: 数值上限；constraintForm=numeric_range 时使用。
      unit:
        type: string
        required: false
        description: 测量单位。
      allowedValues:
        type: array
        required: false
        description: 允许枚举值；constraintForm=enum_value 时使用。
      expression:
        type: string
        required: false
        description: 逻辑表达式或符合性说明；constraintForm 为 logical_expression 或 conformance 时使用。
  Asset:
    id: Asset
    name: 资产
    description: 判断最终可以关联的股票、债券、商品、基金、指数、货币或其他资产标的；可发行、识别、上市或结算的金融合约使用子类型 FinancialInstrument。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 资产名称。
      aliases:
        type: array
        required: false
        description: 资产别名。
      assetClass:
        type: enum
        required: true
        allowed_values:
        - equity
        - bond
        - commodity
        - fund
        - index
        - currency
        - derivative
        - other
        description: 资产类别。
  FinancialInstrument:
    id: FinancialInstrument
    name: 金融工具
    description: 具有合约、证券、基金份额、衍生品或其他金融工具身份，可被发行、识别、上市、结算或作为底层资产引用的资产；价格、估值、收益和交易动作不进入本对象。
    extends: Asset
    primary_key: id
    title_property: name
    validity: true
    properties:
      instrumentKind:
        type: enum
        required: true
        allowed_values:
        - equity_security
        - debt_security
        - fund_share
        - derivative_contract
        - index_instrument
        - currency_instrument
        - commodity_contract
        - other
        description: 金融工具的稳定类型。
      isNegotiable:
        type: boolean
        required: false
        description: 是否具备可转让或可交易属性。
      issueJurisdictionRef:
        type: object_ref
        required: false
        description: 发行或设立适用的 Region 引用。
      denominationCurrencyRef:
        type: object_ref
        required: false
        description: 计价货币引用，通常指向 assetClass=currency 的 Asset。
      instrumentStatus:
        type: enum
        required: false
        allowed_values:
        - active
        - suspended
        - matured
        - redeemed
        - delisted
        - inactive
        - unknown
        description: 工具生命周期状态；时点价格和涨跌不进入该字段。
  Identifier:
    id: Identifier
    name: 识别码
    description: 在某个识别体系或上下文中用于识别语义对象的代码、编号或符号；当代码体系、发布者或生命周期需要追踪时建成对象。
    primary_key: id
    title_property: value
    validity: true
    properties:
      value:
        type: string
        required: true
        description: 原始识别值。
      normalizedValue:
        type: string
        required: false
        description: 规范化后的识别值。
      identifierKind:
        type: enum
        required: true
        allowed_values:
        - ticker
        - isin
        - cusip
        - sedol
        - lei
        - mic
        - exchange_symbol
        - internal_code
        - regulatory_code
        - other
        description: 识别码类型。
      validInContext:
        type: string
        required: false
        description: 识别值适用的市场、辖区、交易场所或业务上下文。
  IdentificationScheme:
    id: IdentificationScheme
    name: 识别体系
    description: 定义识别码规则、适用范围和管理主体的稳定体系，例如 ISIN、LEI、MIC、交易所代码或内部主数据编码。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 识别体系名称。
      aliases:
        type: array
        required: false
        description: 识别体系别名或缩写。
      schemeKind:
        type: enum
        required: true
        allowed_values:
        - security_identification
        - legal_entity_identification
        - market_identification
        - exchange_symbol
        - internal
        - regulatory
        - other
        description: 识别体系类型。
      schemeCode:
        type: string
        required: false
        description: 体系自身的稳定代码或缩写。
      jurisdictionRef:
        type: object_ref
        required: false
        description: 体系适用的 Region 引用。
  TradingVenue:
    id: TradingVenue
    name: 交易场所
    description: 可稳定识别的交易所、场外市场、替代交易系统或市场分段；运营主体使用关系连接，不与 Organization 混建同一身份。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 交易场所或市场分段名称。
      aliases:
        type: array
        required: false
        description: 交易场所别名或缩写。
      venueKind:
        type: enum
        required: true
        allowed_values:
        - exchange
        - otc_market
        - multilateral_trading_facility
        - alternative_trading_system
        - market_segment
        - other
        description: 交易场所类型。
  Listing:
    id: Listing
    name: 上市挂牌
    description: 金融工具在特定交易场所或市场分段上的上市、挂牌或交易准入安排；上市状态变化事件仍由推理域 Event 表达。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 上市或挂牌安排名称。
      listingStatus:
        type: enum
        required: true
        allowed_values:
        - active
        - suspended
        - delisted
        - pending
        - unknown
        description: 上市挂牌生命周期状态。
      primaryListing:
        type: boolean
        required: false
        description: 是否为主要上市地或主挂牌安排。
  RoleAssignment:
    id: RoleAssignment
    name: 角色承担
    description: 记录某一组织在特定对象或上下文中承担的稳定角色；用于区分实体身份与发行人、承销商、管理人、运营方、受益所有人等角色。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 角色承担记录名称。
      roleType:
        type: enum
        required: true
        allowed_values:
        - issuer
        - underwriter
        - sponsor
        - guarantor
        - asset_manager
        - fund_manager
        - market_operator
        - beneficial_owner
        - shareholder
        - administrator
        - custodian
        - other
        description: 组织承担的角色类型。
      contextType:
        type: enum
        required: true
        allowed_values:
        - instrument_issuance
        - listing
        - ownership
        - market_operation
        - fund_operation
        - policy_administration
        - supply_chain
        - other
        description: 角色成立的业务上下文。
      roleDescription:
        type: string
        required: false
        description: 角色边界、职责或适用范围。
  ResearchMetric:
    id: ResearchMetric
    name: 研究指标定义
    description: 可跨研究任务复用的状态或指标语义定义；具体读数、方向、证据与判断属于运行记录。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 指标名称。
      category:
        type: string
        required: true
        description: 稳定指标类别。
      definition:
        type: string
        required: true
        description: 不含时点读数的稳定定义。
      variableKind:
        type: string
        required: false
        description: 定量、定性或派生指标。
      anchorTypes:
        type: array
        required: true
        description: 允许锚定的稳定语义对象类型。
relation_types:
  conceptBroaderThan:
    id: conceptBroaderThan
    name: 概念上位
    description: 起点是终点的上位概念。
    source_types:
    - Concept
    target_types:
    - Concept
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties: {}
  conceptOverlapsWith:
    id: conceptOverlapsWith
    name: 概念交叉
    description: 两个概念存在交叉范围。
    source_types:
    - Concept
    target_types:
    - Concept
    direction: symmetric
    cardinality: many_to_many
    evidence_required: false
    properties:
      overlapScope:
        type: string
        required: false
        description: 交叉范围。
  conceptExcludes:
    id: conceptExcludes
    name: 概念排除
    description: 当前口径明确排除目标概念。
    source_types:
    - Concept
    target_types:
    - Concept
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties:
      exclusionBasis:
        type: string
        required: false
        description: 排除依据。
  conceptMapsToObject:
    id: conceptMapsToObject
    name: 概念映射对象
    description: 概念映射到现实对象。
    source_types:
    - Concept
    target_types:
    - Organization
    - Industry
    - Segment
    - Company
    - Product
    - Material
    - ProcessStep
    - Asset
    - FinancialInstrument
    - Identifier
    - IdentificationScheme
    - TradingVenue
    - Listing
    - RoleAssignment
    - Region
    - Application
    - PolicyInstrument
    - PolicyRequirement
    - TechnicalConstraint
    direction: directed
    cardinality: many_to_many
    evidence_required: false
    properties:
      mappingRole:
        type: enum
        required: true
        allowed_values:
        - exact
        - broader
        - narrower
        - related
        description: 概念与对象的映射角色。
  subIndustryOf:
    id: subIndustryOf
    name: 子产业归属
    description: 子产业归属上级产业。
    source_types:
    - Industry
    target_types:
    - Industry
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  subRegionOf:
    id: subRegionOf
    name: 地区层级归属
    description: 起点地区或管辖范围属于目标地区或更高层级范围。
    source_types:
    - Region
    target_types:
    - Region
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  segmentBelongsToIndustry:
    id: segmentBelongsToIndustry
    name: 环节归属产业
    description: 环节归属产业。
    source_types:
    - Segment
    target_types:
    - Industry
    direction: directed
    cardinality: many_to_one
    evidence_required: false
    properties: {}
  companyBelongsToIndustry:
    id: companyBelongsToIndustry
    name: 公司归属产业
    description: 公司属于或主要参与某产业。
    source_types:
    - Company
    target_types:
    - Industry
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      membershipRole:
        type: string
        required: false
        description: 公司在产业中的角色。
  companyParticipatesInSegment:
    id: companyParticipatesInSegment
    name: 公司参与环节
    description: 公司参与某产业链环节。
    source_types:
    - Company
    target_types:
    - Segment
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      participationRole:
        type: string
        required: false
        description: 参与角色。
  companyOperatesInRegion:
    id: companyOperatesInRegion
    name: 公司经营地区
    description: 公司在某地区具有相对稳定的总部、注册、生产、销售或服务活动；地区风险暴露由 companyExposedToRegion 表达。
    source_types:
    - Company
    target_types:
    - Region
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      operationRole:
        type: enum
        required: true
        allowed_values:
        - headquarters
        - registered_office
        - production
        - sales
        - service
        - other
        description: 公司在该地区的实际经营或注册角色。
  organizationLocatedIn:
    id: organizationLocatedIn
    name: 组织机构所在地
    description: 组织机构的总部、注册地、主要办公地或职权所在辖区；Company 可作为 Organization 子类型使用该关系。
    source_types:
    - Organization
    target_types:
    - Region
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      locationRole:
