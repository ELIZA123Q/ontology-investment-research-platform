    name: 终端需求强度
    category: demand
    definition: 终端行业、应用或工作负载对半导体功能和数量的需求强弱。
    variableKind: qualitative_or_derived
    anchorTypes:
    - Application
    - Industry
    - Product
- id: customer_capex_intensity
