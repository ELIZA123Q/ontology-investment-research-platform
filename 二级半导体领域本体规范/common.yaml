schema_name: semiconductor_domain_common
schema_version: 1.0.0
status: active
description: >-
  半导体领域本体的公共声明。该本体继承平台语义、推理和证据边界，
  只补充半导体投研中稳定、可复用的领域语言与判断结构。

depends_on:
  - ../一级通用本体规范/common.yaml
  - ../一级通用本体规范/semantic.yaml
  - ../一级通用本体规范/evidence.yaml
  - ../一级通用本体规范/reasoning.yaml

domain_scope:
  domain: semiconductor
  scope_type: industry
  scope_name: 核心半导体产业
  included:
    - 半导体研发、EDA、IP、设计与设计服务
    - 半导体设备、关键子系统、零部件与材料
    - 晶圆、掩模、前道制造、后道制造、封装与测试
    - 逻辑、存储、模拟、分立器件、光电子、传感器与执行器
    - 硅基、化合物半导体、特色工艺、先进封装和新型器件路线
    - 下游应用、商业模式、地域暴露、政策与供应链韧性
  adjacent_only:
    - 显示面板
    - 光伏电池与组件
    - 印制电路板
    - 电子整机制造
  excluded:
    - 具体公司、证券、工厂、产品型号或客户名单
    - 实时股价、财务数值、订单、库存、价格、交期或良率读数
    - 已发生事件、已确认观测、研究观点或投资结论
    - 买卖建议、目标价、收益率预测或仓位建议
    - 数据接口、运行配置、任务编排和系统部署信息

inheritance:
  platform_resources_reused:
    semantic_objects:
      - Concept
      - Organization
      - PolicyInstrument
      - Industry
      - Segment
      - Company
      - Product
      - Material
      - ProcessStep
      - Asset
      - FinancialInstrument
      - Identifier
      - IdentificationScheme
      - TradingVenue
      - Listing
      - RoleAssignment
      - Region
      - Application
    reasoning_objects:
      - StateVariable
      - Observation
      - Event
      - Hypothesis
      - Signal
      - Judgment
      - MarketExpectation
      - ExpectationGap
      - AssetImpact
      - Scenario
      - ReasoningTrace
      - ValidationRecord
    evidence_objects:
      - SourceDocument
      - EvidenceClaim
      - EvidenceFact
  platform_rules_reused:
    - 类型与实例分离
    - 稳定结构与动态状态分离
    - 主张、事实、观测与判断分离
    - 支持证据与反证同时保留
    - 判断必须具备语义锚点、业务时间和证据链
    - 展示不得创造事实或提升结论等级
  domain_objects_added:
    - TechnologyRoute
    - ManufacturingFacility
  domain_objects_not_added:
    - Equipment
    - DemandSource
    - Jurisdiction

platform_alignment:
  notes:
    - 公司总部或注册地使用一级 organizationLocatedIn；生产、销售、服务和监管暴露使用 companyOperatesInRegion。
    - 设备复用 Product 与 equipmentCategory，不新增 Equipment 对象。
    - 产品分类拆为 productDomain、semiconductorDeviceCategory、memoryProductCategory、equipmentCategory、moduleSystemCategory 五轴。
    - 半导体相关证券、基金份额、指数或衍生品复用一级 FinancialInstrument；证券代码、交易代码、LEI、MIC 和内部编码使用 Identifier 与 IdentificationScheme。

modeling_principles:
  - id: domain_structure_not_database
    statement: 领域本体定义可复用结构，不收录现实世界全量样本。
  - id: controlled_taxonomy_not_instance_catalog
    statement: 分类体系只定义允许使用的类别和层级，不预置公司或产品实例。
  - id: decision_variable_not_metric_field
    statement: 状态变量必须能够参与判断、比较和传导，不得退化为指标字段清单。
  - id: observation_not_variable
    statement: 价格、收入、库存、交期、良率等具体读数属于 Observation，不属于变量定义。
  - id: stable_relation_not_dynamic_judgment
    statement: 稳定依赖、归属和适用关系进入语义域；方向变化和影响强弱进入推理域。
  - id: business_language_not_rule_engine
    statement: 传导模板使用业务语言表达，不包含阈值、表达式或执行器配置。
  - id: evidence_by_variable
    statement: 证据要求围绕判断变量组织，变量到 profile 的绑定由推理域单向引用。
  - id: counter_evidence_first_class
    statement: 每个判断变量和传导模板都必须定义削弱或阻断条件。

naming_conventions:
  machine_keys: snake_case
  type_names: PascalCase
  relation_names: lowerCamelCase
  display_language: zh-CN
  identifier_policy: >-
    YAML 中仅使用稳定的类型键、分类键、变量键和模板键；不得使用日期流水号、
    bundle ID、对象实例 ID 或环境相关标识。

controlled_vocabulary_contract:
  value_required_fields: [id, name, description]
  hierarchy_fields: [parent_id]
  lifecycle: active
  multi_classification_allowed: true
  notes:
    - 同一产品可同时包含逻辑、模拟或存储功能，分类不得强制互斥。
    - 同一公司可同时承担多个商业角色，角色应描述业务事实而非公司标签。
    - 技术路线与产品类别分离；采用进度、渗透率和成熟度属于推理变量。
    - 同一分类轴内遵循最细粒度优先；跨轴可多选，同轴父子项不作为并列判断依据。
    - 领域扩展字段使用 semiconductor 前缀，不得覆盖一级通用属性名。

reference_basis:
  authority_sources:
    - name: WSTS
      purpose: 器件大类与全球半导体市场统计分类校准
    - name: SEMI
      purpose: 设备、材料、电子设计、制造、封装与测试分类校准
    - name: IEEE International Roadmap for Devices and Systems
      purpose: 异构集成、制程、器件架构、互连、封装与新型计算路线校准
    - name: NIST CHIPS for America
      purpose: 材料与设备供应链、设施专业化、地域集中风险校准

prohibited_keys:
  - runtime_index
  - manifest
  - loading_profile
  - output_contract
  - data_bindings
  - evidence_slots
  - object_refs
  - variable_refs
  - relation_refs
  - rule_refs
  - validation_report

quality_gates:
  semantic:
    - 六类半导体器件、完整价值链、主要工艺、设备、材料、商业模式和需求来源均有分类。
    - 新增对象都有独立身份、关系需求和明确边界。
    - 每条新增关系都声明合法端点、方向、基数和证据要求。
    - 领域扩展字段不与一级通用属性名冲突。
  reasoning:
    - 状态变量 46 个，全部标注 variable_role 和 evidence_profile_ref。
    - 传导模板 28 条，含锚点对齐、方向逻辑、证据 profile 和默认竞争解释。
    - base、upside、downside、stress 四类结果情景与九类业务场景标签均有验证点和证伪点。
  evidence:
    - 12 类证据 profile；变量绑定由推理域单向引用。
    - 高误判变量具备最低证据覆盖规则。
    - 支持证据、反证、竞争解释、时间匹配和来源独立性均有约束。

resource_counts:
  state_variables: 46
  propagation_templates: 28
  evidence_profiles: 12
  scenario_templates: 4
  business_scenario_tags: 9
