schema_name: semiconductor_domain_business_instances
schema_version: 1.0.0
depends_on:
- ../一级通用本体规范/evidence.yaml
- ../一级通用本体规范/reasoning.yaml
business_instance_graph:
  schema_name: ontology_business_instance_graph
  schema_version: 1.0.0
  authority: business_parameters
  objects:
  - id: demand_orders
    type: EvidenceProfile
    properties:
      id: demand_orders
      name: 需求、资本开支与订单证据
      supporting_evidence:
      - 终端产品、系统部署、使用量、出货或利用率的实际数据
      - 客户预算、资本开支指引、项目清单、招标和采购进度
      - 订单覆盖期、排产、出货、交付和收入确认的连续记录
      - 至少一个下游来源与一个供应链来源的交叉验证
      counter_evidence:
      - 终端销量、利用率或预算下修
      - 订单取消、延迟拉货、重复下单或非约束性意向
      - 渠道库存增加但终端需求未改善
      - 资本开支投向与目标半导体需求无关
      competing_explanations:
      - 订单增长来自补库存而非终端需求
      - 出货增长来自提前备货或价格促销
      - 收入增长来自并表、汇率或会计确认而非量价改善
      scope_checks:
      - 终端与供应链口径一致
      - 订单产品和地域一致
      - 业务时间与交付窗口对齐
      freshness_guidance: 订单和库存宜按月度或季度更新；资本开支在指引、预算或项目变化时更新。
      minimum_requirements:
      - 至少一条需求端证据
      - 至少一条订单或交付证据
      - 明确业务时间
      downgrade_conditions:
      - 仅有预测或管理层表态
      - 缺少订单交付验证
      - 证据超过一个主要行业周期
    projection:
      section: evidence_profiles
      index: 0
  - id: capacity_supply
    type: EvidenceProfile
    properties:
      id: capacity_supply
      name: 产能、供给与韧性证据
      supporting_evidence:
      - 有效产能、利用率、维护停机、产品切换和良率资料
      - 扩产建设、设备搬入、试产、认证和量产阶段证据
      - 交期、分配、供应中断、许可和物流记录
      - 多供、替代供应、库存覆盖和恢复时间资料
      - 关键设备、材料和子系统依赖的穿透分析
      counter_evidence:
      - 名义产能高但良率或产品结构不匹配
      - 存在可快速切换的闲置产能
      - 替代供应已认证并具备规模
      - 表面多供实际共享同一上游或地域单点
      competing_explanations:
      - 交期延长来自物流或客户排产而非产能不足
      - 扩产来自政策或战略储备而非需求确认
      - 供应紧张来自短期停机而非结构性缺口
      scope_checks:
      - 名义产能与有效产能分离
      - 设施和产品规格匹配
      - 地域和许可范围一致
      freshness_guidance: 供给中断和交期需事件级更新；扩产按建设和量产里程碑更新。
      minimum_requirements:
      - 产能或设施证据
      - 交期或利用率证据
      - 库存或替代供应检查
      downgrade_conditions:
      - 只有扩产公告
      - 缺少良率认证
      - 无法确认产品或地域范围
    projection:
      section: evidence_profiles
      index: 1
  - id: manufacturing_yield
    type: EvidenceProfile
    properties:
      id: manufacturing_yield
      name: 制造、良率、周期与可靠性证据
      supporting_evidence:
      - 跨批次良率、缺陷密度、返工、报废和过程能力资料
      - 设备状态、工艺窗口、量测、材料一致性和统计过程控制
      - 投料至出货的周期、在制品、排队和瓶颈工序资料
      - 可靠性测试、认证、现场失效率、退货和失效分析
      - 试产、爬坡和高量产阶段的可比记录
      counter_evidence:
      - 良率仅来自样品批次或不可比产品
      - 良率提升伴随性能、可靠性或测试覆盖下降
      - 周期缩短来自减少检验或推迟返工
      - 客户退货、召回、参数漂移或重大质量事故
      competing_explanations:
      - 单位成本变化来自材料、折旧或产品组合而非良率
      - 周期变化来自物流和客户验收而非制造
      - 质量改善来自筛选加强而非制程改善
      scope_checks:
      - 产品和工艺代际一致
      - 试产与量产阶段分离
      - 良率和可靠性口径一致
      freshness_guidance: 量产爬坡期宜按批次或月度更新；成熟工艺可按季度或重大异常更新。
      minimum_requirements:
      - 至少两个连续制造时点
      - 质量或可靠性验证
      - 对应工艺和产品范围
      downgrade_conditions:
      - 只有单点良率
      - 缺少量产规模
      - 缺少可靠性或客户验证
    projection:
      section: evidence_profiles
      index: 2
  - id: inventory_cycle
    type: EvidenceProfile
    properties:
      id: inventory_cycle
      name: 库存周期与缓冲证据
      supporting_evidence:
      - 供应商、渠道、客户和终端的多层库存
      - 库存覆盖期、在途库存、安全库存和消耗速度
      - 补库、去库、采购和出货之间的时间序列
      - 库存规格、地域、质量和可替换性说明
      counter_evidence:
      - 账面库存不可用于目标产品或地域
      - 新旧产品切换导致库存口径失真
      - 委托加工、寄售和在途库存重复计算
      - 终端需求与渠道出货显著背离
      competing_explanations:
      - 库存上升来自主动备货或供应风险管理
      - 库存下降来自减产而非需求改善
      - 补库来自新品切换而非行业复苏
      scope_checks:
      - 库存所有权清楚
      - 产品规格匹配
      - 多层库存不重复
      - 业务时间一致
      freshness_guidance: 周期变化较快时按月度更新，稳定阶段至少按季度更新。
      minimum_requirements:
      - 至少两个产业链层级
      - 明确覆盖期或消耗速度
      - 终端需求对照
      downgrade_conditions:
      - 仅有单家公司账面库存
      - 缺少规格可用性
      - 缺少时间序列
    projection:
      section: evidence_profiles
      index: 3
  - id: pricing_economics
    type: EvidenceProfile
    properties:
      id: pricing_economics
      name: 价格、成本、定价权与利润池证据
      supporting_evidence:
      - 报价、合同价、成交价和产品组合的可比变化
      - 材料、折旧、能源、人工、物流和合规成本拆分
      - 涨价或降价的实际兑现、客户流失和份额变化
      - 各产业链环节收入、毛利、资本强度和现金流变化
      - 合同调价、长协、最低采购和成本转嫁机制
      counter_evidence:
      - 挂牌价变化未体现在成交或财务结果
      - 产品组合、汇率、并购或会计口径造成表观价格变化
      - 成本上升被良率、生产率或设计优化抵消
      - 涨价后需求或份额显著下降
      competing_explanations:
      - 毛利变化来自产品结构而非定价权
      - 利润迁移来自周期错配或一次性项目
      - 价格上涨来自短期供给事故而非结构性壁垒
      scope_checks:
      - 产品规格和合同周期一致
      - 含税与币种口径一致
      - 价格与数量分离
      freshness_guidance: 价格和成本按合同或报价周期更新；利润池按报告期和周期阶段更新。
      minimum_requirements:
      - 成交或合同证据
      - 成本或份额证据
      - 竞争和需求影响检查
      downgrade_conditions:
      - 只有渠道报价
      - 无成交验证
      - 无法拆分产品组合或汇率影响
    projection:
      section: evidence_profiles
      index: 4
  - id: technology_route
    type: EvidenceProfile
    properties:
      id: technology_route
      name: 技术路线、微缩与替代证据
      supporting_evidence:
      - 权威路线图、标准、论文、专利和技术白皮书
      - 同口径性能、功耗、面积、成本、可靠性和良率比较
      - 原型、试产、客户验证、量产和生态成熟度证据
      - 工艺、设备、材料、软件和供应链依赖
      - 真实采用、替代范围、复购和份额迁移
      counter_evidence:
      - 只有实验室结果或不可比基准
      - 性能提升以成本、功耗、可靠性或良率恶化为代价
      - 缺少设计工具、软件、材料、设备或测试生态
      - 新旧路线实际互补而非替代
      competing_explanations:
      - 性能提升来自产品规模或软件优化而非器件路线
      - 采用增长来自补贴、稀缺或客户多供策略
      - 传统路线继续改善并保持成本优势
      scope_checks:
      - 相同工作负载和成熟阶段
      - 系统级与器件级指标分离
      - 量产与原型分离
      freshness_guidance: 按路线图、重大验证、试产和量产节点更新。
      minimum_requirements:
      - 技术依据
      - 同口径比较
      - 制造或客户验证
      - 替代边界
      downgrade_conditions:
      - 仅有概念发布
      - 无量产或客户验证
      - 基准不可比
    projection:
      section: evidence_profiles
      index: 5
  - id: qualification_commercialization
    type: EvidenceProfile
    properties:
      id: qualification_commercialization
      name: 认证、采用、量产与本地替代证据
      supporting_evidence:
      - 送样、测试、资格认证、设计导入、定点和采购阶段记录
      - 工艺冻结、产线认证、良率、质量和供应商准备
      - 量产出货、重复采购、跨客户扩散和售后质量
      - 本地替代产品的关键上游依赖、成本和规模能力
      counter_evidence:
      - 只有送样、意向或非约束性合作
      - 认证范围不覆盖量产规格或目标客户
      - 量产受制于良率、材料、设备、测试或质量
      - 本地替代仍依赖同一受限核心投入
      competing_explanations:
      - 客户认证只用于议价或多供备份
      - 小批量采购来自试验而非商业化
      - 份额增长来自低价而非技术或供应优势
      scope_checks:
      - 客户和产品规格明确
      - 认证阶段不混用
      - 采购与量产时间对齐
      freshness_guidance: 按认证、定点、量产和复购里程碑更新。
      minimum_requirements:
      - 至少一个客户验证节点
      - 量产准备证据
      - 采购或复购证据
      downgrade_conditions:
      - 只有公司自述
      - 无客户或交付验证
      - 仍停留在样品阶段
      stage_vocabulary_ref: commercialization_stages
      stage_guidance: 观察必须标明所处商业化阶段，不得将样品阶段等同于量产或复购。
    projection:
      section: evidence_profiles
      index: 6
  - id: competition_structure
    type: EvidenceProfile
    properties:
      id: competition_structure
      name: 竞争结构、切换成本与壁垒证据
      supporting_evidence:
      - 市场参与者、份额、产能、定价和产品差异化
      - 客户认证周期、重新设计、软件迁移和可靠性责任
      - 技术、资本、专利、人才、生态和规模经济门槛
      - 招标、客户切换、新进入者量产和退出案例
      counter_evidence:
      - 市场规模扩大吸收新增供给
      - 产品和客户分层使表面竞争者不可直接替代
      - 新进入者只有规划产能而无认证和量产
      - 接口标准化和多供认证降低切换成本
      competing_explanations:
      - 份额变化来自区域或产品组合差异
      - 价格变化来自成本或周期而非竞争行为
      - 高利润来自暂时供给约束而非长期壁垒
      scope_checks:
      - 市场边界一致
      - 份额和产品口径一致
      - 名义参与者与有效供给者分离
      freshness_guidance: 按产品周期、重大扩产、招标、并购和价格行为更新。
      minimum_requirements:
      - 至少两类竞争主体
      - 价格或份额证据
      - 客户切换或进入壁垒证据
      downgrade_conditions:
      - 市场边界模糊
      - 只有规划和宣传
      - 无客户或量产验证
    projection:
      section: evidence_profiles
      index: 7
  - id: policy_trade
    type: EvidenceProfile
    properties:
      id: policy_trade
      name: 产业政策、贸易管制与合规证据
      supporting_evidence:
      - 政策、法律、规则、清单、许可和执法原文
      - 适用产品、技术、性能、最终用途、主体和地域范围
      - 预算、执行机构、项目清单、审批和处罚记录
      - 企业合规流程、许可周期、拒绝率和实际交易变化
      - 多边协调、豁免、过渡期和政策修订
      counter_evidence:
      - 政策尚未生效、预算未落实或执行主体不明确
      - 目标对象不在适用范围或符合豁免许可
      - 许可恢复、政策收窄、撤回或执法宽松
      - 替代来源、库存或本地供应缓冲影响
      competing_explanations:
      - 产业变化来自周期、需求或技术路线而非政策
      - 企业影响来自自身经营或客户结构
      - 市场已提前交易政策预期
      scope_checks:
      - 引用正式版本
      - 生效时间明确
      - 产品性能和最终用途匹配
      - 地域与主体匹配
      freshness_guidance: 政策发布、解释、许可和执法变化时立即更新，并保留旧版本有效期。
      minimum_requirements:
      - 政策原文
      - 适用范围分析
      - 至少一条执行或企业影响证据
      - 豁免检查
      downgrade_conditions:
      - 只有媒体转述
      - 无法确认适用范围
      - 政策未生效或缺少执行证据
    projection:
      section: evidence_profiles
      index: 8
  - id: company_exposure_execution
    type: EvidenceProfile
    properties:
      id: company_exposure_execution
      name: 公司暴露、执行与业绩弹性证据
      supporting_evidence:
      - 业务、产品、客户、地域和技术路线收入或利润结构
      - 产能、良率、供应链、交付、质量、验收和收入确认
      - 量、价、产品组合、利用率、成本、费用和资本开支拆分
      - 经营现金流、营运资金和资本效率变化
      - 公司披露与客户、供应商或行业数据交叉验证
      - 客户集中度、单一客户订单波动与客户议价能力对暴露和执行的影响
      counter_evidence:
      - 相关业务占比或利润贡献低
      - 公司同时暴露于受益和受损路线形成内部对冲
      - 订单无法交付、验收或确认收入
      - 折旧、费用、营运资金或资本开支抵消利润改善
      - 客户集中但合同长期锁定或客户结构多元形成对冲
      competing_explanations:
      - 财务变化来自并购、汇率、税收或一次性项目
      - 份额变化来自客户结构而非竞争力
      - 行业景气改善但公司执行或产品组合落后
      scope_checks:
      - 业务分部与产业对象映射
      - 财务和运营周期对齐
      - 关联交易和并购影响剔除
      freshness_guidance: 按财报、订单交付、产能和重大经营事件更新。
      minimum_requirements:
      - 业务暴露证据
      - 执行交付证据
      - 财务或现金流验证
      - 至少一个竞争解释
      downgrade_conditions:
      - 只有公司标签
      - 无业务贡献口径
      - 只有订单无交付或财务验证
    projection:
      section: evidence_profiles
      index: 9
  - id: market_expectations
    type: EvidenceProfile
    properties:
      id: market_expectations
      name: 市场预期、预期差与定价证据
      supporting_evidence:
      - 同期一致预期、管理层指引、研究者预期和价格隐含预期
      - 估值、价格、成交、波动、持仓和资金流变化
      - 预期修正的时间、方向、幅度和覆盖范围
      - 事件窗口、基准收益和混杂事件排查
      - 基本面判断与预期对象、口径和时间尺度的对应关系
      counter_evidence:
      - 预期样本少、陈旧或口径不一致
      - 资产价格由宏观、风格、流动性或其他事件驱动
      - 事件前已出现显著价格和预期调整
      - 估值变化来自利率或风险偏好而非盈利预期
      competing_explanations:
      - 价格反应来自市场整体或行业轮动
      - 文本预期与真实仓位或价格隐含预期不一致
      - 基本面变化已被提前泄露或交易
      scope_checks:
      - 预期截面早于判断验证
      - 对象和时间尺度一致
      - 使用合适市场基准
      freshness_guidance: 重大事件、财报、预期修正和显著价格变化时更新。
      minimum_requirements:
      - 至少一种明确预期基准
      - 事件前预期截面
      - 基本面比较
      - 价格或估值验证
      - 混杂事件检查
      downgrade_conditions:
      - 缺少事件前预期截面
      - 不可比口径
      - 只观察资产涨跌而无基本面比较
      pre_event_cross_section_required: true
      alignment_requirements:
      - 同对象
      - 同口径
      - 同时间尺度
      - 预期截面早于判断验证事件
    projection:
      section: evidence_profiles
      index: 10
  - id: counter_evidence
    type: EvidenceProfile
    properties:
      id: counter_evidence
      name: 反证与竞争解释证据
      supporting_evidence:
      - 直接否定核心前提的高可靠事实或观测
      - 来自独立来源、同一业务时间和同一适用范围的相反证据
      - 能解释同一现象的替代机制及其验证材料
      - 历史回放中反复导致传导失效的条件
      counter_evidence:
      - 所谓反证与目标对象、时间或口径不一致
      - 反证只影响幅度或节奏，不否定方向
      - 多条反证实际来自同一原始来源
      - 反证已经失效、被更正或被后续事实替代
      competing_explanations:
      - 周期、库存、价格、技术、竞争、政策和市场预期均可能解释同一现象
      - 公司执行与行业方向可能分离
      - 短期事件与长期结构变化可能同时存在
      scope_checks:
      - 明确反证作用对象
      - 区分削弱和阻断
      - 与支持证据使用同一比较口径
      freshness_guidance: 每次判断形成、升级或出现新材料时重新扫描。
      minimum_requirements:
      - 至少一个主动寻找的竞争解释
      - 明确证伪条件
      - 记录未解决冲突
      downgrade_conditions:
      - 未进行反证搜索
      - 反证来源不可追溯
      - 无法判断反证作用范围
