schema_name: semiconductor_domain_reasoning
schema_version: 1.0.0
status: active
depends_on:
- common.yaml
- semantic.yaml
- evidence.yaml
- ../一级通用本体规范/reasoning.yaml
description: 半导体领域的事件分类、判断型状态变量、业务传导模板和通用情景骨架。
reasoning_type_extensions:
  StateVariable:
    allowed_anchor_types:
    - Industry
    - Segment
    - Company
    - Product
    - Material
    - ProcessStep
    - Asset
    - FinancialInstrument
    - Identifier
    - IdentificationScheme
    - TradingVenue
    - Listing
    - RoleAssignment
    - Organization
    - PolicyInstrument
    - TechnologyRoute
    - Application
    - ManufacturingFacility
    - Region
  Event:
    allowed_anchor_types:
    - Industry
    - Segment
    - Company
    - Product
    - Material
    - ProcessStep
    - Asset
    - FinancialInstrument
    - Identifier
    - IdentificationScheme
    - TradingVenue
    - Listing
    - RoleAssignment
    - Organization
    - PolicyInstrument
    - TechnologyRoute
    - Application
    - ManufacturingFacility
    - Region
    event_category_ref: event_type_taxonomy
  Scenario:
    scenario_template_ref: scenario_templates
default_qualitative_scale:
  values:
  - very_low
  - low
  - neutral
  - high
  - very_high
  - uncertain
  direction_values:
  - increase
  - decrease
  - stable
  - divergent
  - uncertain
  rule: 定性等级必须由带业务时间的 Observation 或 Signal 支撑，不得直接视为事实。
event_type_taxonomy:
  demand_forecast_change:
    id: demand_forecast_change
    name: 需求或预测变化
    description: 终端需求、行业预测或客户需求展望发生变化。
  customer_capex_change:
    id: customer_capex_change
    name: 客户资本开支变化
    description: 下游客户或系统建设资本开支发生变化。
  order_shipment_change:
    id: order_shipment_change
    name: 订单与出货变化
    description: 订单、取消、排产、出货或交付计划发生变化。
  inventory_cycle_change:
    id: inventory_cycle_change
    name: 库存周期变化
    description: 产业链补库、去库、库存积压或库存短缺发生变化。
  price_lead_time_change:
    id: price_lead_time_change
    name: 价格与交期变化
    description: 产品或投入品价格、报价、交期和分配机制发生变化。
  capacity_investment_change:
    id: capacity_investment_change
    name: 产能与投资变化
    description: 新建、扩建、减产、关停或设备投资发生变化。
  yield_process_change:
    id: yield_process_change
    name: 良率与工艺变化
    description: 良率、制程能力、缺陷控制或生产节拍发生变化。
  product_launch_roadmap_change:
    id: product_launch_roadmap_change
    name: 产品与路线图变化
    description: 产品发布、架构升级、路线图调整或迭代延期。
  qualification_mass_production_change:
    id: qualification_mass_production_change
    name: 认证与量产变化
    description: 客户验证、认证、设计导入或量产状态发生变化。
  technology_breakthrough_setback:
    id: technology_breakthrough_setback
    name: 技术突破或受阻
    description: 技术性能、成本、可靠性或可制造性出现突破或挫折。
  supply_disruption_recovery:
    id: supply_disruption_recovery
    name: 供应中断与恢复
    description: 事故、灾害、停产、物流、质量或原料问题造成供应变化。
  competitive_action:
    id: competitive_action
    name: 竞争行为
    description: 降价、扩产、产品切换、并购或客户争夺等竞争行为。
  industrial_policy_change:
    id: industrial_policy_change
    name: 产业政策变化
    description: 补贴、税收、研发、采购或本地化政策发生变化。
  trade_export_control_change:
    id: trade_export_control_change
    name: 贸易与出口管制变化
    description: 出口许可、进口限制、关税、制裁或投资审查发生变化。
  environmental_safety_change:
    id: environmental_safety_change
    name: 环境健康安全监管变化
    description: 化学品、排放、能源、水资源或职业安全要求发生变化。
  standard_certification_change:
    id: standard_certification_change
    name: 标准与认证变化
    description: 行业标准、接口规范、可靠性或产品认证要求发生变化。
  intellectual_property_legal_change:
    id: intellectual_property_legal_change
    name: 知识产权与法律变化
    description: 专利许可、诉讼、禁令或技术授权发生变化。
  market_expectation_repricing:
    id: market_expectation_repricing
    name: 市场预期重定价
    description: 一致预期、估值、拥挤度或价格隐含预期发生变化。
business_instance_graph_ref: business_instances.yaml

reasoning_constraints:
- id: no_direct_event_to_asset
  statement: 事件不得绕过状态变量、假设、反证和预期比较直接形成资产影响。
- id: no_direct_demand_to_profit
  statement: 需求增强必须经过供给、价格、成本、竞争、公司暴露和执行能力后才能讨论业绩。
- id: no_direct_policy_to_beneficiary
  statement: 政策发布必须经过预算、执行、适用范围和产业变量后才能讨论公司影响。
- id: no_direct_launch_to_revenue
  statement: 产品或技术发布必须经过认证、量产、交付和客户采用后才能讨论收入兑现。
- id: blocking_precedence
  statement: 命中核心前提的有效阻断信号优先于一般支持信号。
- id: scenario_is_template_not_runtime_pack
  statement: scenario_templates 只定义通用变量组合，不包含对象实例、数据绑定或运行步骤。
