# --- semantic_constraints ---
semantic_constraints:
  - id: product_multi_axis_allowed
    statement: 产品可同时使用 productDomain、semiconductorDeviceCategory、memoryProductCategory、equipmentCategory 和 moduleSystemCategory，不强制单一分类。
  - id: equipment_is_product_with_equipment_category
    statement: 半导体设备复用 Product，不另建 Equipment 对象；必须填写 equipmentCategory。
  - id: application_not_customer_instance
    statement: Application 表示稳定需求类型，不得写入具体客户名称或单次项目。
  - id: facility_capability_not_capacity_observation
    statement: ManufacturingFacility 只记录稳定能力；产能、利用率和投产进度进入推理域。
  - id: technology_route_not_adoption_state
    statement: TechnologyRoute 定义技术边界；成熟度、采用率和替代速度进入推理域。
  - id: policy_instrument_not_event_instance
    statement: policy_instrument_category 只提供政策工具分类；有时间和证据的政策事实才创建 Event。
  - id: finest_grain_within_axis
    statement: >-
      同一分类轴内遵循最细粒度优先：能确认 HBM 时不再将 memory 作为并列分类；
      父类仅用于层级归属或细类未知时的兜底。跨轴可多选，同轴父子项不作为并列判断依据。
  - id: abf_is_packaging_material_not_route
    statement: ABF 归入封装材料分类，不与技术路线混放。
  - id: no_level_one_property_override
    statement: 领域扩展不得覆盖一级 segmentRole、materialCategory、processRole、applicationCategory 属性名。
  - id: facility_use_specialized_relations
    statement: ManufacturingFacility 的稳定结构优先使用 facility* 专门关系，不使用 upstreamOf 泛化表达。
