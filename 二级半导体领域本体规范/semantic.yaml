# 人读目录见同目录 *.md；本文件为机器权威定义。
# 分区注释仅便于浏览，不改变 schema。
schema_name: semiconductor_domain_semantic
schema_version: 1.0.0
status: active
depends_on:
  - common.yaml
  - ../一级通用本体规范/semantic.yaml
description: 半导体领域的语义对象扩展、稳定关系和受控分类体系。

# --- object_type_extensions（类型扩展）---
object_type_extensions:
  Industry:
    description: 在平台产业对象上补充半导体产业层级和相邻产业边界。
    properties:
      semiconductorIndustryRole:
        type: enum
        required: false
        vocabulary_ref: controlled_vocabularies.industry_role
        description: 半导体产业中的稳定角色。
  Segment:
    description: 使用产业链角色分类描述设计、供给、制造、封测和需求端位置。
    properties:
      semiconductorSegmentRole:
        type: enum
        required: false
        vocabulary_ref: controlled_vocabularies.semiconductor_value_chain_segment_role
        description: 半导体产业链环节角色。
  Company:
    description: 公司实例由后续任务进入；领域本体只增加可多选的商业模式分类。
    properties:
      businessModelRoles:
        type: array
        required: false
        item_vocabulary_ref: controlled_vocabularies.business_model_role
        description: 公司在半导体价值链中长期承担的商业角色，可多选。
  Product:
    description: 产品按领域、器件、存储、设备、模组五轴分类。
    properties:
      productDomain:
        type: enum
        required: false
        vocabulary_ref: controlled_vocabularies.product_domain
        description: 半导体产品所属领域总类。
      semiconductorDeviceCategory:
        type: array
        required: false
        item_vocabulary_ref: controlled_vocabularies.semiconductor_device_category
        description: 半导体器件功能分类，可多选。
      memoryProductCategory:
        type: array
        required: false
        item_vocabulary_ref: controlled_vocabularies.memory_product_category
        description: 存储产品细分类，可多选。
      equipmentCategory:
        type: enum
        required: false
        vocabulary_ref: controlled_vocabularies.equipment_category
        description: 当产品为半导体设备时使用的设备类别。
      moduleSystemCategory:
        type: array
        required: false
        item_vocabulary_ref: controlled_vocabularies.module_system_category
        description: 电子模组与系统组件分类，可多选。
  Material:
    description: 材料按前道、后道、封装、设施和器件材料分类。
    properties:
      semiconductorMaterialCategory:
        type: enum
        required: false
        vocabulary_ref: controlled_vocabularies.semiconductor_material_category
        description: 半导体材料类别。
      materialCompositionAxis:
        type: array
        required: false
        item_vocabulary_ref: controlled_vocabularies.material_composition_axis
        description: 材料主要组成元素或化合物体系，可多选。
  ProcessStep:
    description: 工序覆盖设计、掩模、晶圆制造、封装测试、认证和可靠性环节。
    properties:
      semiconductorProcessCategory:
        type: enum
        required: false
        vocabulary_ref: controlled_vocabularies.semiconductor_process_category
        description: 半导体工序类别。
  Application:
    description: 复用一级 Application 表达稳定终端行业、系统形态、应用场景和工作负载，并补充半导体需求分类。
    properties:
      semiconductorApplicationCategory:
        type: enum
        required: false
        vocabulary_ref: controlled_vocabularies.semiconductor_application_category
        description: 半导体需求对应的终端应用类别。
      demandRole:
        type: string
        required: false
        description: 该应用驱动半导体需求的稳定方式。
  Region:
    description: 复用一级 Region 表达公司、设施、政策、贸易、许可和市场准入的地理或监管范围。

# --- object_types（对象类型）---
object_types:
  TechnologyRoute:
    id: TechnologyRoute
    name: 技术路线
    description: >-
      可被稳定识别并跨产品、工序和材料复用的制程、器件架构、互连、封装或系统集成路线。
      路线的采用进度、成熟度和替代强度属于推理域，不作为本对象的静态属性。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 技术路线名称。}
      aliases: {type: array, required: false, description: 技术路线别名。}
      routeCategory:
        type: enum
        required: true
        vocabulary_ref: controlled_vocabularies.technology_route_category
        description: 技术路线类别。
      definition: {type: string, required: true, description: 路线的稳定技术边界。}
      applicableScope: {type: string, required: true, description: 路线适用的器件、工序或应用范围。}
  ManufacturingFacility:
    id: ManufacturingFacility
    name: 制造设施
    description: 具有独立位置、运营主体和工艺能力的半导体研发、制造、封装测试或关键投入品设施。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name: {type: string, required: true, description: 设施名称。}
      aliases: {type: array, required: false, description: 设施别名。}
      facilityCategory:
        type: enum
        required: true
        vocabulary_ref: controlled_vocabularies.facility_category
        description: 设施类别。
      capabilityScope: {type: string, required: true, description: 设施可稳定提供的工艺或产出范围。}

# --- relation_type_extensions（关系扩展）---
relation_type_extensions:
  conceptMapsToObject:
    add_target_types: [TechnologyRoute, ManufacturingFacility]
  policyAppliesTo:
    add_target_types: [TechnologyRoute, ManufacturingFacility]
  requirementAppliesTo:
    add_target_types: [TechnologyRoute, ManufacturingFacility]
  identifierIdentifiesObject:
    add_target_types: [TechnologyRoute, ManufacturingFacility]
  upstreamOf:
    add_source_types: [TechnologyRoute]
    add_target_types: [TechnologyRoute]
  dependsOn:
    add_source_types: [TechnologyRoute, ManufacturingFacility]
    add_target_types: [TechnologyRoute, Product, Material, ProcessStep]
  assetExposedTo:
    add_target_types: [TechnologyRoute, ManufacturingFacility]
  roleAppliesToObject:
    add_target_types: [TechnologyRoute, ManufacturingFacility]

# --- relation_types（关系类型）---
relation_types:
  technologyRouteAppliesTo:
    id: technologyRouteAppliesTo
    name: 技术路线适用于
    description: 技术路线适用于特定产业链环节、产品或工序。
    source_types: [TechnologyRoute]
    target_types: [Segment, Product, ProcessStep]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      applicationRole: {type: string, required: true, description: 路线在目标对象中的稳定作用。}
  technologyRouteDependsOn:
    id: technologyRouteDependsOn
    name: 技术路线依赖
    description: 技术路线结构性依赖产品、材料、工序或另一技术路线。
    source_types: [TechnologyRoute]
    target_types: [Product, Material, ProcessStep, TechnologyRoute]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      dependencyKind: {type: string, required: true, description: 设计、设备、材料、工艺、互连或生态依赖。}
      criticality: {type: enum, required: false, description: low、medium、high 或 critical。}
  technologyRouteCanSubstituteFor:
    id: technologyRouteCanSubstituteFor
    name: 技术路线可替代
    description: 起点路线在明确范围内可替代目标路线；仅表示可替代范围，实际替代进度进入推理域。
    source_types: [TechnologyRoute]
    target_types: [TechnologyRoute]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      substitutionScope: {type: string, required: true, description: 性能、成本、功耗、尺寸或供应范围。}
  processUsesEquipment:
    id: processUsesEquipment
    name: 工序使用设备
    description: 工序稳定使用某类设备产品。
    source_types: [ProcessStep]
    target_types: [Product]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      equipmentRole: {type: string, required: true, description: 设备在工序中的作用。}
  processUsesMaterial:
    id: processUsesMaterial
    name: 工序使用材料
    description: 工序稳定使用某类半导体材料。
    source_types: [ProcessStep]
    target_types: [Material]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      materialRole: {type: string, required: true, description: 材料在工序中的用途。}
  facilityOperatedBy:
    id: facilityOperatedBy
    name: 设施由组织运营
    description: 制造设施由组织拥有、运营或控制。
    source_types: [ManufacturingFacility]
    target_types: [Organization]
    direction: directed
    cardinality: many_to_one
    evidence_required: true
    properties:
      operationRole: {type: string, required: false, description: 所有、运营、合资或受托管理。}
  facilityLocatedIn:
    id: facilityLocatedIn
    name: 设施位于地区
    description: 制造设施位于某一 Region。
    source_types: [ManufacturingFacility]
    target_types: [Region]
    direction: directed
    cardinality: many_to_one
    evidence_required: true
    properties: {}
  facilitySupportsProcess:
    id: facilitySupportsProcess
    name: 设施支持工序
    description: 制造设施具备支持某类工序的稳定能力。
    source_types: [ManufacturingFacility]
    target_types: [ProcessStep]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      capabilityRole: {type: string, required: true, description: 研发、试产、量产、封装、测试或验证能力。}
  facilityProducesProduct:
    id: facilityProducesProduct
    name: 设施生产产品
    description: 制造设施具备生产或加工某类产品的稳定能力。
    source_types: [ManufacturingFacility]
    target_types: [Product]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      productionRole: {type: string, required: false, description: 晶圆制造、封装、测试、材料或设备生产。}
  facilityUsesTechnologyRoute:
    id: facilityUsesTechnologyRoute
    name: 设施采用技术路线
    description: 制造设施具备采用某技术路线的稳定能力；当前利用率和量产进度进入推理域。
    source_types: [ManufacturingFacility]
    target_types: [TechnologyRoute]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      capabilityBoundary: {type: string, required: true, description: 路线适用的设施能力边界。}
  facilityProducesMaterial:
    id: facilityProducesMaterial
    name: 设施生产材料
    description: 制造设施具备生产或加工某类材料的稳定能力。
    source_types: [ManufacturingFacility]
    target_types: [Material]
    direction: directed
    cardinality: many_to_many
    evidence_required: true
    properties:
      productionRole: {type: string, required: false, description: 晶圆、气体、化学品、基板或其他材料生产。}

# --- controlled_vocabularies（受控词表）---
controlled_vocabularies:
  industry_role:
    description: 半导体领域及其相邻产业的层级角色。
    values:
      semiconductor_core: {id: semiconductor_core, name: 核心半导体产业, description: 半导体器件及其直接设计制造体系。}
      enabling_industry: {id: enabling_industry, name: 支撑产业, description: EDA、IP、设备、材料、设施与专业服务。}
      downstream_industry: {id: downstream_industry, name: 下游产业, description: 采购并集成半导体的终端行业。}
      adjacent_industry: {id: adjacent_industry, name: 相邻产业, description: 工艺或供应链相关但不属于核心半导体范围的产业。}

  semiconductor_value_chain_segment_role:
    description: 半导体价值链稳定环节。
    values:
      research_and_development: {id: research_and_development, name: 基础研发与工程开发, description: 材料、器件、工艺、架构和系统研究。}
      eda_and_ip: {id: eda_and_ip, name: EDA与IP, description: 设计自动化软件、设计IP和验证工具。}
      chip_design: {id: chip_design, name: 芯片设计, description: 产品定义、架构、逻辑电路、版图和设计验证。}
      design_service: {id: design_service, name: 设计服务, description: 设计外包、流片服务和工程支持。}
      mask_and_reticle: {id: mask_and_reticle, name: 掩模与光罩, description: 掩模版、光罩和相关数据准备。}
      semiconductor_equipment: {id: semiconductor_equipment, name: 半导体设备, description: 制造、封装、测试和量测设备。}
      equipment_subsystem: {id: equipment_subsystem, name: 设备子系统与零部件, description: 光源、真空、射频、电源、运动控制和气液输送等。}
      semiconductor_material: {id: semiconductor_material, name: 半导体材料, description: 晶圆制造、器件和封装所需材料。}
      wafer_and_substrate: {id: wafer_and_substrate, name: 晶圆与衬底, description: 硅片、绝缘体上硅及化合物半导体衬底。}
      front_end_fabrication: {id: front_end_fabrication, name: 前道晶圆制造, description: 在晶圆上形成器件和互连的制造过程。}
      specialty_fabrication: {id: specialty_fabrication, name: 特色与化合物半导体制造, description: 功率、模拟、射频、光电子、MEMS和特色工艺制造。}
      assembly_and_packaging: {id: assembly_and_packaging, name: 组装与封装, description: 切割、贴装、互连、封装及异构集成。}
      semiconductor_test: {id: semiconductor_test, name: 半导体测试, description: 晶圆测试、成品测试、可靠性和失效分析。}
      distribution_and_service: {id: distribution_and_service, name: 分销与专业服务, description: 渠道、物流、维护、认证和工程服务。}
      module_and_system: {id: module_and_system, name: 模组与系统集成, description: 将半导体集成为板卡、模组、子系统和整机。}
      downstream_application: {id: downstream_application, name: 下游应用, description: 形成最终半导体需求的终端行业和应用。}

  product_domain:
    description: 半导体产品所属领域总类。
    values:
      semiconductor_device: {id: semiconductor_device, name: 半导体器件, description: 逻辑、存储、模拟、分立、光电子、传感器等芯片产品。}
      semiconductor_equipment_product: {id: semiconductor_equipment_product, name: 半导体设备, description: 制造、封装、测试和量测设备。}
      semiconductor_software_ip: {id: semiconductor_software_ip, name: 半导体软件与IP, description: EDA软件、设计IP、固件和开发工具。}
      semiconductor_service: {id: semiconductor_service, name: 半导体制造与工程服务, description: 设计、代工、封装、测试、认证和工程服务。}
      electronic_module_subsystem: {id: electronic_module_subsystem, name: 电子模组与子系统, description: 集成半导体器件的模组、板卡和功能子系统。}

  semiconductor_device_category:
    description: 以稳定功能为主的半导体器件分类，允许一个产品归入多个类别。
    values:
      logic: {id: logic, name: 逻辑器件, description: 执行计算、控制或数字信号处理。}
      cpu: {id: cpu, name: 通用处理器, description: 通用指令处理器。, parent_id: logic}
      accelerator: {id: accelerator, name: 加速处理器, description: 面向图形、AI、网络或专用工作负载的加速器。, parent_id: logic}
      microcontroller: {id: microcontroller, name: 微控制器, description: 集成处理、存储和外设控制的控制器。, parent_id: logic}
      programmable_logic: {id: programmable_logic, name: 可编程逻辑, description: 可由用户配置逻辑功能的器件。, parent_id: logic}
      asic_soc: {id: asic_soc, name: ASIC与SoC, description: 面向专用功能或系统集成的逻辑器件。, parent_id: logic}
      digital_signal_processor: {id: digital_signal_processor, name: 数字信号处理器, description: 面向数字信号处理的专用处理器。, parent_id: logic}
      memory: {id: memory, name: 存储器件, description: 临时或持久保存数据与指令。}
      volatile_memory: {id: volatile_memory, name: 易失性存储, description: 断电后数据消失的存储类别。, parent_id: memory}
      nonvolatile_memory: {id: nonvolatile_memory, name: 非易失性存储, description: 断电后保留数据的存储类别。, parent_id: memory}
      stacked_memory: {id: stacked_memory, name: 堆叠与高带宽存储, description: 通过堆叠和宽接口提高带宽的存储类别。, parent_id: memory}
      emerging_memory: {id: emerging_memory, name: 新型存储, description: 基于新材料或新器件机制的存储类别。, parent_id: memory}
      analog: {id: analog, name: 模拟器件, description: 处理连续信号、电源或真实世界接口。}
      power_management: {id: power_management, name: 电源管理器件, description: 电压转换、稳压、充放电和电源控制。, parent_id: analog}
      data_converter: {id: data_converter, name: 数据转换器, description: 在模拟与数字信号之间转换。, parent_id: analog}
      amplifier: {id: amplifier, name: 放大器, description: 放大模拟、电源或射频信号。, parent_id: analog}
      interface_and_timing: {id: interface_and_timing, name: 接口与时钟器件, description: 信号接口、时钟、同步和驱动。, parent_id: analog}
      radio_frequency: {id: radio_frequency, name: 射频器件, description: 处理射频发射、接收、滤波和前端信号。, parent_id: analog}
      discrete: {id: discrete, name: 分立器件, description: 独立完成开关、整流、保护或功率控制功能。}
      diode: {id: diode, name: 二极管, description: 整流、稳压、保护或开关器件。, parent_id: discrete}
      transistor: {id: transistor, name: 晶体管, description: 独立的放大或开关器件。, parent_id: discrete}
      power_discrete: {id: power_discrete, name: 功率分立器件, description: 面向高电压、大电流和功率转换的器件。, parent_id: discrete}
      protection_device: {id: protection_device, name: 保护器件, description: 过压、过流和静电防护器件。, parent_id: discrete}
      optoelectronics: {id: optoelectronics, name: 光电子器件, description: 产生、调制、传输或探测光信号。}
      light_emitter: {id: light_emitter, name: 发光器件, description: LED、激光器等光源器件。, parent_id: optoelectronics}
      photodetector: {id: photodetector, name: 光探测器, description: 将光信号转换为电信号。, parent_id: optoelectronics}
      photonic_integrated_circuit: {id: photonic_integrated_circuit, name: 光子集成器件, description: 在芯片上集成光学功能的器件。, parent_id: optoelectronics}
      image_sensor: {id: image_sensor, name: 图像传感器, description: 将图像光信号转换为电子数据。, parent_id: optoelectronics}
      sensor_and_actuator: {id: sensor_and_actuator, name: 传感器与执行器, description: 感知物理世界或将电信号转换为动作。}
      mems_sensor: {id: mems_sensor, name: MEMS传感器, description: 基于微机电结构的惯性、压力、声学等传感器。, parent_id: sensor_and_actuator}
      environmental_sensor: {id: environmental_sensor, name: 环境与生物传感器, description: 感知温度、气体、化学或生物信号。, parent_id: sensor_and_actuator}
      mems_actuator: {id: mems_actuator, name: MEMS执行器, description: 基于微机电结构产生运动或调制作用。, parent_id: sensor_and_actuator}

  memory_product_category:
    description: 存储产品稳定细分类。
    values:
      dram: {id: dram, name: DRAM, description: 动态随机存取存储器。}
      nand: {id: nand, name: NAND Flash, description: 非易失性 NAND 闪存。}
      nor: {id: nor, name: NOR Flash, description: 非易失性 NOR 闪存。}
      hbm: {id: hbm, name: HBM, description: 高带宽堆叠存储器。}
      ddr: {id: ddr, name: DDR, description: 双倍数据速率同步 DRAM 系列。, parent_id: dram}
      lpddr: {id: lpddr, name: LPDDR, description: 低功耗 DDR 系列。, parent_id: dram}
      enterprise_ssd: {id: enterprise_ssd, name: 企业级SSD, description: 面向数据中心和企业存储的固态硬盘。}

  module_system_category:
    description: 电子模组与系统组件分类。
