schema_name: policies_engineering
schema_version: 0.1.0
namespace: investment_ontology
status: draft
depends_on:
  objects_schema: ../治理域/objects_governance.yaml
canonical_rule: YAML 是正式机器约束；Markdown 只负责解释和示例。
description: 投研本体 bundle 级文件契约、容器版本元数据、质量元数据、兼容字段和发布包约束。本文件独立于对象 schema，容器元数据与对象类型定义生命周期不同，分开管理。

domain_first_schema_layout:
  description: >
    核心 schema 的第一组织维度保持五个职责层：语义结构域、证据域、判断推理域、治理域、工程交付与Bundle契约。
    主流 Ontology 平台原语作为每个职责层内部的第二维，用来约束单域文件不要继续膨胀。
    现有 objects_*.yaml / relations_*.yaml / actions_*.yaml / policies_*.yaml 在兼容期内保留；
    新增公共内容应按本布局归位，旧文件可通过 schema_parts 或 alias 聚合到瘦身入口。
  first_dimension_domains: [语义结构域, 证据域, 判断推理域, 治理域, 工程交付与Bundle契约]
  second_dimension_primitives: [objects, relations, actions, rules, events, contracts, functions]
  recommended_domain_files:
    required: [objects.yaml, relations.yaml, actions.yaml, rules.yaml, contracts.yaml]
    optional: [functions.yaml]
    note: ActionFollowup 契约已迁入 actions.yaml 的 side_effects；events.yaml 仅保留 deprecated 占位。
    maximum_core_files_per_domain: 8
  contract_policy_boundary:
    contract: 稳定接口与不变量，例如 ID、必填字段、manifest 字段、输出边界、relation 公共字段和兼容版本。
    policy: 运行策略与裁决方式，例如证据新鲜度、晋升门槛、阻断、降级、review queue、生产准入和 LLM 编排边界。
    physical_file_rule: 可以在同一个 contracts.yaml 内用 contracts、policies、rules 顶层块合并承载，但不得让 policy 覆盖 contract 的含义。
  domain_rules_layout:
    recommended_files:
      语义结构域: schemas/语义结构域/rules.yaml
      判断推理域: schemas/判断推理域/rules.yaml
      证据域: schemas/证据域/rules.yaml
      治理域: schemas/治理域/rules.yaml
    top_level_rule_sets:
      - inference_rules
      - validation_rules
      - quality_rules
      - scoring_rules
      - promotion_rules
      - blocking_rules
      - action_preconditions
      - trigger_rules
      - permission_rules
    naming_rule: rules 是声明式门槛、推理条件、评分、晋升、阻断和动作前置条件；logic 只用于 LogicFunction/LogicBlock 等执行资产命名。
  reasoning_rules_layout:
    recommended_file: schemas/判断推理域/rules.yaml
    compatibility_note: InferenceRule 是 Rule Registry 中 rule_type=inference 的兼容型资产对象；新规则优先登记到对应域 rules.yaml。
  domain_action_followup_layout:
    canonical_contract: actions_*.yaml#side_effects.trigger_followup
    followup_object: ActionFollowup
    record_action: RecordActionFollowup
    deprecated_files:
      - schemas/语义结构域/events.yaml
      - schemas/判断推理域/events.yaml
      - schemas/证据域/events.yaml
      - schemas/治理域/events.yaml
    boundary: >
      ActionFollowup 是 Action side effect 的落库形态，不是独立 schema 桶。
      判断推理域 Event 继续表示外部政策、订单、价格、技术和公司等研究事件。
    automate_boundary: 数据新鲜度、Monitor 命中等非 Action 触发链走 AutomateFlow，不写入 Action side_effects。
  governance_functions_layout:
    recommended_file: schemas/治理域/functions.yaml
    object_types: [LogicFunction, LogicBlock, AutomateFlow, EvalCase, EvalSuite, EvalRun, EvalResult, MetricSnapshot]
    boundary: functions 可读取 objects、relations、rules、policies 并输出结构化结果或 ActionProposal；不得绕过 Action 直接写 shared 正式资产。

engineering_delivery_summary:
  description: 工程交付与Bundle契约的最小摘要，供消费端在不读取完整目录契约时判断资产位置和加载边界。
  bundle_role: bundle 是版本化、可校验、可复用的交付单元。
  v1_primary_bundle_type: industry_bundle
  directory_roles:
    shared: 正式资产区；只有通过准入、审核或补丁流程的资产进入。
    runtime_contracts: 正式运行契约区；只存加载、数据需求、输出和刷新策略，不存运行结果。
    scenario_packs: 加载视图或工作集；引用正式实体，不复制实体。
    bundle_workbenches: 本体生产工作台；承载材料、候选、审核、补丁和生产报告。
    team_workspaces: 团队判断工作区；承载 JudgmentRecord、复盘、运行记录和证据快照。
  consumption_rule: 消费型 Skill 默认只读取 bundle_summary、scenario_summary、loading_rules 和治理门禁摘要；生成、校验或发布 bundle 时才读取完整工程契约。

ontology_container_metadata:
  description: 每份 base_ontology、optimized_ontology 或 ontology_bundle 都应携带的容器级版本和质量元数据；它描述本体整体资产，不替代对象实例字段。
  required_fields:
    ontology_id:
      zh_name: 本体 ID
      type: string
      required: true
      description: 稳定本体资产标识，如 semiconductor、ai_chip_product_track。
    ontology_version:
      zh_name: 本体版本
      type: string
      required: true
      description: 建议使用语义化版本，如 1.0.0、1.1.0。
    parent_version:
      zh_name: 父版本
      type: string
      required: false
      description: 上一版本号；冷启动首版可为空字符串。
    created_by:
      zh_name: 创建来源
      type: string
      required: true
      description: 创建本体的 Skill、系统或人工来源。
    updated_by:
      zh_name: 更新来源
      type: string
      required: true
      description: 最近一次更新本体的 Skill、系统或人工来源。
    change_reason:
      zh_name: 版本变化原因
      type: string
      required: true
      description: 如 cold_start、material_optimization、gap_discovery_optimization、reasoning_feedback_optimization。
    bundle_type:
      zh_name: Bundle 类型
      type: enum
      enum: [core_contract, industry_bundle, theme_bundle, event_family_bundle, company_asset_bundle, scenario_pack, master, industry_extension, company_extension, event_package, evaluation_trace_package]
      required: true
      description: >
        区分本 bundle 在投研本体体系中的角色。v2 推荐使用
        core_contract、industry_bundle、theme_bundle、event_family_bundle、
        company_asset_bundle、scenario_pack；旧 master/industry_extension
        等值仅用于兼容存量 manifest。team workspace 不是 bundle_type，必须独立于正式 bundle。
    workspace_layer:
      zh_name: 工作空间层
      type: enum
      enum: [none]
      required: false
      description: 正式 bundle 不内嵌工作区，本字段仅保留 none 作为显式边界声明。
    extends:
      zh_name: 语义扩展基座
      type: array
      required: false
      description: >
        本 bundle 语义上扩展了哪些 bundle_id。
        master 类型可留空；其他类型应至少声明一个扩展基座。
        这与 parent_version 不同——parent_version 是版本继承关系（v1→v2），
        extends 是语义扩展关系（通用核心→半导体扩展）。
      items:
        type: string
    namespace:
      zh_name: 命名空间
      type: string
      required: true
      description: 本 bundle 的全局唯一命名空间，用于防止跨 bundle 对象 ID 冲突。建议格式 domain-topic，如 touyan-semiconductor。
    compatibility:
      zh_name: 兼容性声明
      type: object
      required: true
      description: 声明本 bundle 依赖的核心 schema 版本和兼容约束。
      properties:
        core_schema_version:
          zh_name: 核心 Schema 版本
          type: string
          required: true
          description: 本 bundle 遵循的 schemas/ 文件版本，如 0.1.0。
        min_consumer_version:
          zh_name: 最低消费端版本
          type: string
          required: false
          description: 读取本 bundle 所需的最低 Skill 或 Agent 版本。
        governance_capabilities:
          zh_name: 治理能力声明
          type: array
          required: false
          description: 本 bundle 的 governance.yaml 提供了哪些结构化治理能力。
          items:
            type: enum
            enum: [retrieval_policy, unresolved_items, review_queue, quality_gates, patch_management, action_audit]
    ontology_quality:
      zh_name: 本体质量指标
      type: object
      required: true
      description: 用于跟踪版本质量变化，避免以对象和关系规模代替质量。
      properties:
        coverage_score:
          type: number
          value_range: [0, 1]
          description: 对当前研究范围内对象、变量、关系、信号、情景和资产映射的覆盖度。
        evidence_score:
          type: number
          value_range: [0, 1]
          description: 来源、证据等级、事实观测和材料可追溯性的综合质量。
        temporal_evidence_score:
          type: number
          value_range: [0, 1]
          description: EvidenceEpisode、EvidenceClaim、有效期、失效记录和当前有效证据过滤的质量。
        patch_audit_score:
          type: number
          value_range: [0, 1]
          description: PatchRequest、PatchLedgerItem、合并理由、拒绝记录和版本演化审计的质量。
        consistency_score:
          type: number
          value_range: [0, 1]
          description: schema 合法性、关系端点一致性、重复和冲突控制质量。
        reasoning_score:
          type: number
          value_range: [0, 1]
          description: 本体支持链路推理、反证、情景路径和资产线索表达的能力。

bundle_directory_contract:
  description: 本体 bundle 的标准目录结构和文件约定。详细说明见 references/05_工程交付与Bundle契约.md；领域规范索引见 schemas/contract_index.yaml#human_reference_docs。
  formal_framework_asset_types:
    - asset_type: Scenario
      canonical_representation: scenario_packs/<scenario_id>/scenario_manifest.yaml
    - asset_type: StateVariable
      canonical_representation: shared/reasoning_assets/state_variables.yaml
    - asset_type: ConductionTemplate
      canonical_representation: shared/reasoning_assets/conduction_templates.yaml
    - asset_type: InferenceRule
      canonical_representation: shared/reasoning_assets/inference_rules.yaml
    - asset_type: Signal
      canonical_representation: shared/reasoning_assets/signal_patterns.yaml
    - asset_type: Counter
      canonical_representation: shared/reasoning_assets/counter_evidence_patterns.yaml
    - asset_type: RuntimeDataRequirement
      canonical_representation: scenario_packs/<scenario_id>/runtime_data_requirements.yaml
    - asset_type: EvidenceRequirement
      canonical_representation: scenario_packs/<scenario_id>/evidence_requirements.yaml
    - asset_type: OutputContract
      canonical_representation: scenario_packs/<scenario_id>/scenario_output_contract.yaml
  formal_asset_boundary: >
    正式 bundle 只发布已审核、可复用、可被推理消费的框架资产；判断记录、候选补丁、搜索材料、
    运行快照和复盘状态分别属于 bundle workbench 或 team workspace。
  canonical_directories:
    shared:
      description: 已审核、可复用、可被场景推理消费的正式行业框架资产。
    scenario_packs:
      description: 面向具体问题的加载视图、适用边界和场景契约。
    runtime_contracts:
      description: 正式运行入口、数据需求、输出契约和刷新策略；禁止存放任何运行结果。
  runtime_package_directory:
    description: 工作台消费 bundle 的唯一运行入口层；发布时必须完整且通过 validation。
    path: runtime_contracts/
    required_files:
      - runtime_index.yaml
      - runtime_loading_profile.yaml
      - runtime_context_card.md
      - runtime_output_contract.yaml
      - runtime_validation_report.json
  allowed_top_level_files:
    - 00_bundle_manifest.yaml
    - 01_bundle_summary.md
    - objects.yaml
    - relations.yaml

release_package_slimming_contract:
  description: release_package 是给消费端使用的瘦身交付物，不保留构建过程、临时报告、系统文件或缓存。
  exclude_path_parts: [_artifacts, __pycache__, staging, research_memory, application_workspace, team_workspaces, bundle_workbenches]
  exclude_file_names: [.DS_Store]
  retired_path_parts: [_artifacts, application_workspace]
  include_by_default: [00_bundle_manifest.yaml, 01_bundle_summary.md, runtime_contracts, shared, scenario_packs]
  required_runtime_files:
    - runtime_contracts/runtime_index.yaml
    - runtime_contracts/runtime_validation_report.json
  rules:
    - bundle workbench 与 team workspace 永远不进入 release_package。
    - source_registry、source_search_log、production_reports、证据快照和迁移脚本不进入 release_package。
    - 空占位文件只允许由 scaffold 生成；release_package 中保留的 YAML 应是入口、索引、引用、规则或非空实例文件。

instance_validation_contract:
  description: 三个写入面分别校验；正式 bundle 校验不得读取 team workspace 或 bundle workbench。
  canonical_script: scripts/validate_bundle.py
  minimal_fixture: fixtures/minimal_bundle
  team_workspace_script: scripts/validate_team_workspace.py
  team_workspace_fixture: fixtures/team_judgment_flow
  bundle_workbench_script: scripts/validate_bundle_workbench.py
  validation_scope:
    - allowed_top_level_files
    - object_instances
    - relation_instances
    - enum_fields
    - relation_endpoints
    - signal_role_relation_compatibility
    - judgment_required_relations
    - market_expectation_structured_value
    - classification_marking_propagation
    - as_of_reconstruction
    - derived_metric_function_contract
    - scenario_simulation_isolation
    - action_proposal_writeback_contract
    - formal_bundle_contains_no_workspace_state
    - formal_bundle_contains_no_candidate_workbench_state
    - object_view_reference_contract
    - logic_function_block_contract
    - evaluation_suite_contract
    - metric_snapshot_contract
  required_cli:
    command: python3 scripts/validate_bundle.py <bundle_path>
    success_output: "bundle validation: OK"
  quality_rules:
    - 核心规范的最低可用标准是 fixtures/minimal_bundle 能通过 validate_bundle.py，并覆盖语义锚点、证据、状态假设、信号、预期差、资产影响和复盘任务的最小判断链。
    - 本体包发布前必须通过 validate_core.py 和 validate_bundle.py。
    - validate_core.py 校验公共规范自身；validate_bundle.py 校验具体本体包实例。
    - 失败项应输出对象 ID、关系 ID、字段路径和修复建议。
    - 合规标记、as-of 时点、派生指标和情景模拟属于发布前必检门禁。
    - ActionProposal、ObjectViewSpec、LogicFunction、EvalSuite 和 MetricSnapshot 属于生产化能力门禁；存在实例时必须通过对应引用和生命周期校验。

temporal_evidence_contract:
  description: 动态上下文图谱只作为证据、运行记录和增量反馈层的设计参考；正式对象、关系、动作和推理语义仍以稳定本体主干 ontology_bundle_vN 为准。
  canonical_location:
    in_bundle: [shared/evidence_index/source_documents.yaml, shared/evidence_index/evidence_episodes.yaml, shared/evidence_index/evidence_claims.yaml, shared/evidence_index/evidence_facts.yaml]
    candidate_and_processing: bundle_workbenches/<bundle_id>/staging/
    reports: bundle_workbenches/<bundle_id>/production_reports/
  workbench_files:
    - bundle_workbenches/<bundle_id>/staging/candidate_claims.yaml
    - bundle_workbenches/<bundle_id>/staging/candidate_facts.yaml
    - bundle_workbenches/<bundle_id>/production_reports/evidence_graph_validation_report.md
  rules:
    - EvidenceEpisode 表示一次材料、历史案例、推理反馈、评测反馈或结构化数据摄入，不是正式业务对象。
    - EvidenceClaim 是最小证据主张单元，必须可追溯 episode、来源位置、业务时间和系统摄入时间。
    - EvidenceFact 是 claim 归并后的结构化事实候选，不能绕过优化 Skill 直接写入正式对象或关系。
    - 失效事实必须保留历史，通过 invalidatedAt、invalidatedBy、supersedes 或 claimInvalidatesClaim 表达，不得物理删除。
    - 推理应用默认只使用目标 business_time 下当前有效且未被失效的 claim；历史回放可查询当时曾经有效的 claim。

patch_ledger_contract:
  description: 本体增量演化使用 workbench 内的 append-only patch ledger；正式 bundle 只保留已审核资产及 asset_provenance 摘要。
  canonical_location:
    ledger: bundle_workbenches/<bundle_id>/production_reports/patch_ledger.yaml
    candidate_requests: bundle_workbenches/<bundle_id>/patch_requests/
    reports: bundle_workbenches/<bundle_id>/production_reports/
  workbench_files:
    - bundle_workbenches/<bundle_id>/patch_requests/
    - bundle_workbenches/<bundle_id>/production_reports/patch_merge_report.md
  rules:
    - PatchRequest 可以来自缺口发现、历史回放、评测、推理反馈或人工修订。
    - PatchRequest 只能表达候选改动；证据与运行记录层不能直接修改正式本体。
    - 本体优化 Skill 是唯一正式合并者，合并、拒绝、延后或失败都必须追加 PatchLedgerItem。
    - 每个 patch ledger 项应记录 baseOntologyVersion、baseHash、operation、targetFile、targetPath、targetId、evidenceEpisodeIds、evidenceClaimIds、mergeStatus 和 mergeReason。

inference_run_contract:
  description: 推理运行记录用于复盘 Agent 如何调用稳定本体主干和动态证据层。
  canonical_location: team_workspaces/<workspace_id>/runs/<run_id>/
  file_pattern: inference_run_{id}.yaml
  rules:
    - 每次推理必须记录 question、businessTime、ontologyVersion、centerObjects、usedEvidenceClaimIds、excludedInvalidClaimIds、reasoningChain、confidence 和 ontologyFeedback。
    - 推理反馈需要进入本体生产闭环时，应生成 PatchRequest 或 ontology_feedback，而不是直接改本体。

compatibility_contract:
  description: 旧式单文件 JSON（base_ontology.json、optimized_ontology.json）与 bundle 目录结构的兼容规则。
  rules:
    - 所有任务型 Skill 读写本体时必须优先支持 ontology_bundle_vN/ 或 base_ontology_bundle/，再兼容旧 JSON。
    - 旧 JSON 的 ontology_container_metadata 字段应与本文件定义一致；不一致时以 bundle 版为准。
    - _compat/ 目录下的转换脚本负责旧格式到 bundle 格式的迁移，不得在业务 Skill 中内联转换逻辑。

task_skill_schema_snapshot_contract:
  description: 任务型 Skill 运行时只解析 canonical core root；不维护本地公共 schema 镜像。
  manifest_file: core_manifest.json
  required_manifest_fields:
    core_schema_version:
      type: string
      source: root core_manifest.json.core_version
      description: 任务型 Skill 绑定的核心规范版本，不等同于各 YAML 的 schema_version。
    schema_snapshot_policy.mode:
      type: enum
      enum: [canonical_core_only]
      description: 公共 schema 只从 canonical_core_root 读取，不在任务目录保留副本。
    schema_snapshot_policy.mirrored_files:
      type: array
      required_value: []
      description: 方案 A 下必须为空；禁止在任务 schemas/ 下复制 canonical schema。
    schema_snapshot_policy.task_local_only_files:
      type: array
      description: 任务专属输出 schema、管线 adapter 等本地文件。
    runtime_schema_resolution.preferred_runtime_order:
      type: array
      required_value: [canonical_core_root, target_bundle_local_schemas]
      description: 运行时先解析核心规范根目录，再看目标 bundle 本地 schema。
    runtime_schema_resolution.offline_fallback:
      type: enum
      enum: [none]
      required_value: none
      description: 不回落到任务目录内的公共 schema 副本。
    runtime_schema_resolution.core_adapter:
      type: path
      required_value: schemas/core_adapter.yaml
      description: 每个任务型 Skill 的稳定输入输出契约到核心 schema 的适配层。
  canonical_schema_files_ref: scripts/schema_manifest.py:CANONICAL_SCHEMA_FILES
  validator: scripts/validate_task_schema_snapshots.py
  adapter_policy:
    role: task_io_to_core_mapping
    required_skill_dirs: [00-研究需求探索, 01-信息与数据搜索, 03-冷启动, 15-本体资产生产, 16-证据归一]
    rule: core_adapter.yaml 是每个任务型 Skill 的稳定输入输出字段到 canonical core 的映射层；不得在 SKILL.md 或业务正文里散落核心字段别名。
  domain_naming_policy:
    canonical_domains: [语义结构域, 判断推理域, 证据域, 治理域, 工程交付与Bundle契约]
    forbidden_local_schema_dirs_ref: schemas/common.yaml.deprecated_domain_aliases
    deprecated_aliases_ref: schemas/common.yaml.deprecated_domain_aliases
  validation_rules:
    - 每个任务型 Skill manifest 的 core_schema_version 必须等于根 core_manifest.json.core_version。
    - schema_snapshot_policy.mode 必须为 canonical_core_only。
    - schema_snapshot_policy.mirrored_files 必须为空数组。
    - runtime_schema_resolution.preferred_runtime_order 必须为 [canonical_core_root, target_bundle_local_schemas]。
    - runtime_schema_resolution.offline_fallback 必须为 none。
    - 任务 schemas/ 下不得存在 canonical_schema_files_ref 列出的公共 schema 副本。
    - task_local_only_files 只能声明任务输出 schema 或 core_adapter.yaml。
    - 每个任务型 Skill 都必须声明 schemas/core_adapter.yaml。
    - 旧域目录不得在任务型 schemas/ 下残留。
  external_skill_deployment:
    description: >
      外置 Codex Skill（如 ~/.codex/skills/touyan-*）不维护 canonical schema 副本；
      运行时通过 TOUYAN_CORE_ROOT 或 sibling 布局读取本仓库根目录 schemas/。
    core_root_env: TOUYAN_CORE_ROOT
    core_root_resolver: scripts/resolve_core_root.py:find_core_root
    version_pin_checker: scripts/verify_external_core_pin.py
    deployment_modes:
      in_repo:
        layout: 任务目录与核心规范同仓库；canonical_core_root 为 ".."
        resolver_fallback: skill_root.parent
      external:
        layout: Skill 单独拷贝到 ~/.codex/skills/ 或 submodule
        required_env: TOUYAN_CORE_ROOT
        forbidden: 在 Skill 目录复制 canonical_schema_files_ref 列出的公共 schema
    rules:
      - 外置 Skill 必须能解析到含 scripts/validate_bundle.py 的核心规范根目录。
      - 有 core_manifest.json 时，core_schema_version 必须等于根 core_manifest.json.core_version。
      - schema_snapshot_policy.mode 必须为 canonical_core_only；mirrored_files 必须为空。
      - 禁止在 Skill 目录保留 canonical schema 镜像；仅允许 task_local_only_files。

bundle_type_contract:
  description: >
    v1 默认只生成一种生产型主包 industry_bundle。industry_bundle 是完整产业图谱、
    行业推理能力、证据索引和治理复盘的主工作包。theme_bundle、event_family_bundle
    和 company_asset_bundle 保留为 advanced/future 拆包形态或外部引用形态，不作为
    默认模板产物。
  default_generation_bundle_type: industry_bundle
  advanced_future_bundle_types: [theme_bundle, event_family_bundle, company_asset_bundle]
  types:
    core_contract:
      role: 核心规范包。
      contains: [SKILL.md, schemas, references, scripts, fixtures, public_schema, public_enums, public_actions, validation_rules]
      excludes: [行业实例, 公司实例, 产品实例, 材料实例, 资产实例, 具体事件, 具体投研判断]
    industry_bundle:
      role: 正式行业判断框架发布包，沉淀可复用产业语义、变量、传导逻辑、信号、反证和场景契约。
      contains: [concept_layer, semantic_objects, semantic_relations, reasoning_assets, capability_index, evidence_index, governance, reuse_assets, scenario_packs, runtime_contracts]
      release_rule: shared 只允许已通过准入门禁的正式资产；候选和生产过程只存在于外置 bundle workbench。
      routing_rule: 消费端按 scenario_first 读取正式框架与当次 RuntimeEvidenceSnapshot，禁止读取 workbench 或 team workspace。
    theme_bundle:
      role: advanced/future 跨行业主题包，通过 external_refs 引用多个行业包；v1 默认先沉淀在主 industry_bundle 的 concept_layer、reasoning_assets、reuse_assets 或 scenario_pack 中。
      contains: [theme_concepts, cross_bundle_refs, cross_domain_relations, scenario_paths, market_expectations, theme_judgments, review_assets]
      constraints:
        - 不复制 owner 属于 industry_bundle 的行业对象。
    event_family_bundle:
      role: advanced/future 事件族包，沉淀一类事件的通用变量、信号、反证和模板；v1 默认先沉淀在主 industry_bundle 的 reasoning_assets 或 reuse_assets 中。
      contains: [event_templates, trigger_patterns, typical_state_variables, signal_patterns, counter_evidence_patterns, review_metrics, inference_rules, conduction_templates]
    company_asset_bundle:
      role: advanced/future 公司或资产框架包，沉淀长期稳定的公司/资产引用、暴露关系和可复用反证；人的历史判断与复盘留在 team workspace。
      contains: [company_refs, asset_refs, asset_exposure_relations, reusable_counter_evidence, market_expectations]
      excludes: [JudgmentRecord, runtime_evidence_snapshot, review_process_record, personal_note]
      constraints:
        - 不替代行业包定义产业链结构，只引用行业包中的产业对象和关系。
    scenario_pack:
      role: 业务 bundle 内部的加载视图或工作集，不是完整独立 bundle。
      contains: [scenario_manifest.yaml, object_refs.yaml, relation_refs.yaml, variable_refs.yaml, evidence_refs.yaml, rule_refs.yaml, loading_rules.yaml]
      excludes: [完整对象定义, 完整公司描述, 重复产品定义, 重复资产定义]

bundle_manifest_contract:
  description: 所有 bundle 统一使用 00_bundle_manifest.yaml；不提供 JSON manifest 兼容读取，避免双重事实源。
  required_fields:
    bundle_id: string
    bundle_type: enum_ref:bundleType
    namespace: string
    scope_type: enum_ref:scopeType
    scope_name: string
    core_schema_version: string
    bundle_version: string
    status: enum_ref:bundleStatus
    release_profile: enum[production_ready, workbench]
    owner: string
    depends_on: array
    imports: array
    exports: array
    write_policy: object
    dedup_policy: object
    validation_policy: object
  optional_fields:
    classification_mapping: object
    external_refs: array
    loading_summary_policy: object
    summary_assets: array
    runtime_entry: object
    runtime_status: enum[published, draft, deprecated]
    compatible_runner_version: string
  runtime_entry_fields:
    runtime_index: runtime_contracts/runtime_index.yaml
    validation_report: runtime_contracts/runtime_validation_report.json
    loading_profile: runtime_contracts/runtime_loading_profile.yaml
    context_card: runtime_contracts/runtime_context_card.md
    output_contract: runtime_contracts/runtime_output_contract.yaml
  write_policy:
    shared_admission_policy: production_gate_required
    default_generated_status: candidate
    active_requires_review: true
    cross_bundle_write_requires_patch: true
  release_profile_policy:
    production_ready:
      description: 可直接消费的发布包。shared 中不得出现 candidate、draft、review_pending、no_evidence 或抽取/迁移过程字段；未达门槛内容进入外置 bundle workbench。
      shared_allowed_statuses: [active, confirmed]
      forbidden_shared_process_fields: [operation, reviewNote, extractionConfidence, missing_steps, missingSteps, verified_steps, verifiedSteps, historicalReplayStatus, source_candidate_id]
      scenario_loading_rule: 不得加载 bundle_workbenches 或 team_workspaces。
    workbench:
      description: 研究过程工作包。可保留候选和过程字段，但不得登记或宣称为 production_ready。
  dedup_policy:
    object_key: object_type + normalized_name + scope
    relation_key: relation_type + source_id + target_id
    source_key: canonicalSourceId
    variable_key: category + normalizedKey + observed_on
  validation_policy:
    require_namespace_unique: true
    require_owner_bundle_id: true
    require_relation_endpoints_resolvable: true
    require_external_refs_resolvable: true
    require_patch_for_external_owner_change: true

bundle_type_required_modules:
  industry_bundle: [concept_layer, semantic_objects, semantic_relations, reasoning_assets, reasoning_assets/state_variables, capability_index, evidence_index, governance, reuse_assets, scenario_packs, runtime_contracts]
  theme_bundle: [depends_on, imports, external_refs, cross_domain_relations_or_scenario_paths, scenario_packs, reasoning_assets]
  event_family_bundle: [event_templates, typical_state_variables, signal_patterns, counter_evidence_patterns, review_metrics, inference_rules_or_conduction_templates]
  company_asset_bundle: [company_refs_or_asset_refs, asset_exposure_relations, market_expectations]

bundle_type_module_resolution:
  description: >
    将 bundle_type_required_modules 中的必填 token 解析为机器可执行检查。
    check=path 表示目录或文件必须存在；check=manifest_field 表示 manifest
    字段必须存在且非空。any_of 表示至少存在一个路径。
  concept_layer:
    check: path
    path: shared/concept_layer/
  semantic_objects:
    check: path
    path: shared/semantic_objects/
  semantic_relations:
    check: path
    path: shared/semantic_relations/
  reasoning_assets/state_variables:
    check: path
    path: shared/reasoning_assets/state_variables.yaml
  reasoning_assets:
    check: path
    path: shared/reasoning_assets/
  capability_index:
    check: path
    path: shared/_index/capability_index.yaml
  evidence_index:
    check: path
    path: shared/evidence_index/
  governance:
    check: path
    path: shared/governance/asset_provenance.yaml
  reuse_assets:
    check: path
    path: shared/reuse_assets/
  runtime_contracts:
    check: path
    path: runtime_contracts/
  depends_on:
    check: manifest_field
    field: depends_on
  imports:
    check: manifest_field
    field: imports
  external_refs:
    check: manifest_field
    field: external_refs
  cross_domain_relations_or_scenario_paths:
    check: path
    any_of:
      - shared/semantic_relations/
      - shared/reasoning_assets/scenario_paths.yaml
  scenario_packs:
    check: path
    path: scenario_packs/
  event_templates:
    check: path
    any_of:
      - shared/reasoning_assets/event_templates.yaml
      - shared/semantic_objects/events.yaml
  typical_state_variables:
    check: path
    path: shared/reasoning_assets/state_variables.yaml
  signal_patterns:
    check: path
    any_of:
      - shared/reasoning_assets/signal_patterns.yaml
      - shared/reasoning_assets/signals.yaml
  counter_evidence_patterns:
    check: path
    any_of:
      - shared/reasoning_assets/counter_evidence_patterns.yaml
      - shared/evidence_index/counter_evidence_patterns.yaml
  inference_rules_or_conduction_templates:
    check: path
    any_of:
      - shared/reasoning_assets/inference_rules.yaml
      - shared/reasoning_assets/conduction_templates.yaml
  company_refs_or_asset_refs:
    check: path
    any_of:
      - shared/semantic_objects/companies.yaml
      - shared/semantic_objects/assets.yaml
  asset_exposure_relations:
    check: path
    path: shared/semantic_relations/asset_exposure_relations.yaml
  market_expectations:
    check: path
    path: shared/reasoning_assets/market_expectations.yaml

business_bundle_structure_contract:
  description: industry_bundle_template 只生成正式发布面；生产工作台和团队工作区使用独立模板与校验器。
  canonical_template: templates/industry_bundle_template/
  workbench_template: templates/bundle_workbench_template/
  team_workspace_template: templates/team_workspace_template/
  default_generation_bundle_type: industry_bundle
  advanced_bundle_split_rule: 主题、事件族或公司资产跨多个行业复用价值很高时，先在 bundle workbench 标记 promotion_candidate，再由治理流程拆成独立 advanced bundle。
  root_files: [00_bundle_manifest.yaml]
  shared:
    concept_layer: [concept_scheme.yaml, concepts.yaml, concept_boundaries.yaml]
    semantic_objects: [industries.yaml, segments.yaml, companies.yaml, products.yaml, materials.yaml, assets.yaml]
    semantic_relations: [concept_relations.yaml, industry_relations.yaml, segment_relations.yaml, company_relations.yaml, product_relations.yaml, material_relations.yaml, asset_exposure_relations.yaml]
    evidence_index: [source_documents.yaml, evidence_episodes.yaml, evidence_claims.yaml, evidence_facts.yaml, evidence_matrix.yaml, runtime_evidence_index.yaml]
    reasoning_assets: [state_variables.yaml, state_variable_observations.yaml, state_variable_propagations.yaml, state_changes.yaml, reasoning_relations.yaml, inference_rules.yaml, conduction_templates.yaml, scenario_paths.yaml, market_expectations.yaml, judgment_outputs.yaml, asset_impacts.yaml, investment_theses.yaml, monitors.yaml, event_templates.yaml, signal_patterns.yaml, counter_evidence_patterns.yaml]
    governance: [asset_provenance.yaml]
    reuse_assets: [reusable_objects.yaml, reusable_evidence.yaml, reusable_rules.yaml, reusable_scenario_paths.yaml, reusable_review_findings.yaml]
    _index: [bundle_summary.yaml, asset_index.yaml, capability_index.yaml, relation_index.yaml, evidence_summary.yaml, rule_summary.yaml, runtime_asset_registry.yaml]
  runtime_contracts:
    root_files: [runtime_index.yaml, runtime_loading_profile.yaml, runtime_context_card.md, runtime_output_contract.yaml, runtime_validation_report.json]
  scenario_packs:
    required_per_scenario: [scenario_manifest.yaml, object_refs.yaml, relation_refs.yaml, variable_refs.yaml, evidence_refs.yaml, rule_refs.yaml, loading_rules.yaml, runtime_data_requirements.yaml, scenario_summary.yaml]
  external_workbench_ref: bundle_workbenches/<bundle_id>/
  external_team_workspace_ref: team_workspaces/<workspace_id>/

team_workspace_contract_ref:
  canonical_contract: schemas/工程交付与Bundle契约/contracts_workspace.yaml.team_workspace_contract
  judgment_record_contract: schemas/工程交付与Bundle契约/contracts_workspace.yaml.judgment_record_contract
  promotion_assessment_contract: schemas/工程交付与Bundle契约/contracts_workspace.yaml.promotion_assessment_contract
  runtime_evidence_snapshot_contract: schemas/工程交付与Bundle契约/contracts_workspace.yaml.runtime_evidence_snapshot_contract

research_memory_contract:
  description: research_memory 是 bundle workbench 内的叙述生产层，不属于正式 bundle，也不参与正式推理加载。
  placement: bundle_workbenches/<bundle_id>/research_memory/
  layer_separation:
    wiki: Markdown 叙述层，供人和 AI 整理、交叉链接、暴露矛盾，不被推理 Skill 直接当作 active 资产消费。
    staging: workbench 内的结构化候选，进入审核。
    shared: 通过准入后由受治理动作写入正式 owner bundle。
  canonical_location: bundle_workbenches/<bundle_id>/research_memory/
  files:
    memory_rules: bundle_workbenches/<bundle_id>/research_memory/MEMORY_RULES.md
    raw_readme: bundle_workbenches/<bundle_id>/research_memory/raw/README.md
    wiki_index: bundle_workbenches/<bundle_id>/research_memory/wiki/index.md
    ingest_log: bundle_workbenches/<bundle_id>/research_memory/wiki/ingest_log.md
    gaps: bundle_workbenches/<bundle_id>/research_memory/wiki/gaps.md
    contradictions: bundle_workbenches/<bundle_id>/research_memory/wiki/contradictions.md
    ontology_candidates: bundle_workbenches/<bundle_id>/research_memory/wiki/ontology_candidates.md
  topic_subdir_policy: 只在存在实际主题内容时创建分类子目录，禁止为了预留结构创建空骨架目录。
  write_rules:
    - research_memory/raw 只保存原始材料引用、hash、来源位置、摄入时间和权限标记；原文不可改写。
    - 每次 ingest 或整理新材料后，必须更新 research_memory/wiki/index.md 和 research_memory/wiki/ingest_log.md。
    - 团队判断和复盘分别只进入 team workspace 的 judgments/ 与 retrospects/；workbench 不得建立平行的判断日志或复盘日历。
    - 需要将判断整理为框架候选时，只能在 bundle workbench 生成候选资产或 PatchRequest，不得直接写入 shared active 资产。
    - 新发现的对象、状态变量、事件原型、传导链路、反证、催化剂和材料缺口先进入 research_memory/wiki，不直接写入 shared active 资产。
    - 所有判断性描述必须保留 source_refs、business_time、learned_at、confidence、counter_evidence_status 和 markings。
    - research_memory/wiki/ontology_candidates.md 只保存可晋升候选，不得被判断推理 Skill 当作 active 资产消费。
  promotion_flow:
    - 从 wiki 提炼候选并汇总到 research_memory/wiki/ontology_candidates.md。
    - 写入 bundle_workbenches/<bundle_id>/staging/candidate_*.yaml，并保留来源、反证状态、owner_bundle_id 和 proposed_by。
    - 需要结构性修改时生成 PatchRequest；需要审核或复盘时生成 ReviewRecord。
    - 通过端点解析、证据追溯、反证检查、历史回放或人工审核后，才能合入 shared/* 或提交 owner bundle 补丁。
  relation_typing_rule:
    description: wiki 双链或自然语言关系不能直接成为正式 Relation；晋升时必须映射为核心 schema 已定义关系或 bundle 明确扩展的类型化关系。
    examples: [supports, weakens, blocks, transmits, triggers, priced_in, contradicts]

scenario_pack_contract:
  description: scenario_pack 是推理时按需加载和场景模型运行的入口，只引用 shared 资产，不复制完整实体；必须绑定 ScenarioModel 或声明内联 orchestration_steps。
  required_files: [scenario_manifest.yaml, object_refs.yaml, relation_refs.yaml, variable_refs.yaml, evidence_refs.yaml, rule_refs.yaml, loading_rules.yaml, runtime_data_requirements.yaml]
  runtime_files:
    - scenario_runtime_index.yaml
    - scenario_context_card.md
    - scenario_output_contract.yaml
    - scenario_validation_report.json
  scenario_manifest_fields: [scenario_id, scenario_name, parent_bundle_id, scope, owner, status, created_at, updated_at]
  ref_files_rule:
    - object_refs.yaml 只保存对象 ID、owner_bundle_id、ref_reason 和必要摘要。
    - relation_refs.yaml 只保存关系 ID、端点摘要和必要证据摘要。
    - variable_refs.yaml、evidence_refs.yaml、rule_refs.yaml 同样只保存引用和摘要，不复制完整定义。
    - runtime_data_requirements.yaml 只保存运行时查证问题、evidence slot 引用、新鲜度策略引用、数据变化事件策略和缺证降级规则，不保存当期事实值。
  local_rule_policy:
    - scenario_pack 可以拥有场景局部规则。
    - 若局部规则具备行业复用价值，应通过 PatchRequest 合入 shared/reasoning_assets。
  scenario_overlay_contract:
    description: >
      scenario_local 是已审核、可被正式运行时加载的场景限定扩展，不是第二套 shared 事实源。
      只要存在 scenario_local/，同级必须存在 scenario_overlay.yaml 声明文件、
      资产类型、场景适用边界与跨场景晋升目标。
    overlay_file: scenario_overlay.yaml
    overlay_type: scenario_overlay
    required_fields: [scenario_id, overlay_type, overlay_status, overlay_files, promotion_policy]
    overlay_file_required_fields: [path, asset_kind, status, promotion_target, rationale]
    allowed_asset_kinds: [objects, relations, variables, rules, evidence_slots, scenario_paths, events]
    rules:
      - scenario_local 下的每个 YAML 文件必须在 scenario_overlay.yaml.overlay_files 中登记。
      - ref_kind=scenario_local 只能指向已登记 overlay 文件。
      - 具备跨场景复用价值的 overlay 资产必须通过 PatchRequest 或 staging 晋升到 shared。
      - 标准 scenario pack 仍以 refs 为主；scenario_local 不得复制已存在于 shared 的同 ID 定义。
      - production_ready bundle 的 overlay_status 和所有 overlay 文件 status 必须为 active。
      - production_ready bundle 的 scenario_local 不得包含 candidate、draft、review_pending 或 scenario_active 的 recordStatus。
      - scenario_local 中的场景限定边界由 active_scope=scenario_only 和 asset_status=scenario_active 表达，recordStatus 仍必须为 active 或 confirmed。
  runtime_data_requirements_contract:
    description: >
      标准 scenario_pack 的运行时数据需求契约。该文件引用 evidence_refs.yaml
      中的 evidence slot，并引用 policies_governance.retrieval_policy.freshness_policy
      中的新鲜度分层；它不替代 EvidenceClaim、EvidenceFact 或
      StateVariableObservation，也不新增平行证据状态字段。
    required_fields: [scenario_id, source_mode_policy, runtime_required_data, runtime_evidence_snapshot_output, evidence_field_mapping, historical_reference_policy]
    runtime_required_data_item_fields: [questions, evidence_slot_refs, freshness_policy_ref, freshness_event_policy, preferred_source_forms, minimum_independent_sources, required_for_formal_judgment, on_missing]
    allowed_on_missing: [block_with_gap, downgrade_to_observation, lower_confidence, observation_only, block_conclusion]
    evidence_slot_ref_rule: evidence_slot_refs 如非空，必须能在同目录 evidence_refs.yaml 中解析到 ref_kind=evidence_slot 的条目。
    freshness_policy_ref_rule: freshness_policy_ref 必须指向 policies_governance.retrieval_policy.freshness_policy 的 high_freshness、medium_freshness 或 low_freshness。
    freshness_event_policy:
      description: >
        运行时数据新鲜度变化应优先发 ActionFollowup，驱动监控、补证、重跑推理或审核；
        ontology_feedback 只用于结构缺口，不用于普通数据刷新、过期或缺当期数据。
      required_fields: [emit_on, event_refs, downstream_actions, no_ontology_feedback_on_data_change]
      allowed_emit_on: [observation_recorded, freshness_changed, stale_detected, requirement_breached]
      allowed_event_refs:
        - reasoning.followup.create_state_variable_observation.state_variable_observation_recorded
        - reasoning.followup.create_state_variable_observation.data_freshness_changed
        - governance.followup.record_action_followup.data_stale_detected
        - governance.followup.record_action_followup.data_requirement_breached
    evidence_field_mapping:
      source_document_fields: [canonicalSourceId, sourceForm, sourceReliability, capturedAt]
      evidence_claim_fields: [claimStatus, validTo, invalidatedAt, supersededBy]
      evidence_fact_fields: [factStatus, sourceClaimIds, confidenceScore]
      observation_fields: [observationTime, observationSourceName, sourceStatementType, recordedAt, direction, baselineValue, deltaValue, confidenceScore]
    historical_reference_policy:
      analogy_only_not_runtime_evidence: true
    source_mode_policy:
      primary_mode: public_sources
      manual_supplement_allowed: true
      manual_input_rule: 人工补录必须记录提供者、时间、事实原句、适用范围和可验证状态，且不得自动提升证据等级。
    runtime_evidence_snapshot_output:
      contract_ref: schemas/工程交付与Bundle契约/contracts_workspace.yaml#runtime_evidence_snapshot_contract
      path_template: team_workspaces/<workspace_id>/runtime_evidence_snapshots/<run_id>.json
      bundle_write_forbidden: true
      formal_runtime_input: true
      persistence_scope: per_run
  evidence_slot_binding_quality_contract:
    description: >
      evidence slot 的 fully_bound 只表示槽位已绑定证据，不表示证据足够可信。
      运行时须同时评估 source_quality、conflict_status、freshness 和 fact_status，
      避免"绑定数量越多越可靠"的误判。
    required_when_binding_status: fully_bound
    fields:
      binding_status:
        type: enum
        enum: [unbound, partially_bound, fully_bound]
        required: true
      source_quality:
        type: object
        required: true
        properties:
          independent_source_count:
            type: integer
          high_reliability_source_count:
            type: integer
          primary_source_count:
            type: integer
          secondary_source_count:
            type: integer
          source_form_breakdown:
            type: object
            description: 按 sourceForm 统计，如 official_page、broker_page、repost_page。
      conflict_status:
        type: enum
        enum: [none, minor, material, blocking]
        required: true
      freshness:
        type: object
        required: true
        properties:
          oldest_source_age_days:
            type: integer
          freshness_tier:
            type: enum
            enum: [high, medium, low, stale]
      fact_status:
        type: object
        required: true
        properties:
          active_fact_count:
            type: integer
          candidate_fact_count:
            type: integer
          conflicted_fact_count:
            type: integer
      trust_score:
        type: enum
        enum: [high, medium_high, medium, medium_low, low, insufficient]
        required: true
        description: 综合绑定质量后的可信度，不得仅由 bound 数量推导。
    downgrade_rules:
      - when: conflict_status=blocking
        action: block_tracking_upgrade
      - when: freshness.freshness_tier=stale
        action: downgrade_to_observation
      - when: source_quality.independent_source_count < minimum_independent_sources
        action: lower_confidence
  loading_rules_schema:
    fields: [entry_files, scenario_model_ref, orchestration_steps, deterministic_checks, llm_allowed_decisions, llm_forbidden_decisions, required_schema_files, required_shared_assets, optional_assets, max_context_budget, fallback_on_missing, validation_before_reasoning]
    scenario_model_rule: scenario_model_ref 和 orchestration_steps 至少存在一个；生产级场景推荐二者同时存在，前者指向可复用 ScenarioModel，后者记录本场景实例化步骤。
    deterministic_rule: deterministic_checks 必须覆盖证据有效性、反证、市场预期、预期差、催化剂和写回权限中与本场景相关的检查。
    llm_boundary_rule: llm_allowed_decisions 与 llm_forbidden_decisions 必须声明，且不得允许 LLM 直接写 shared 正式资产。
    default_priority: 先读 scenario_summary.yaml、loading_rules.yaml、runtime_data_requirements.yaml 和 scenario_model_ref，再读取引用文件，最后按需读取完整 shared 资产。

bundle_registry_contract:
  recommended_location: registries/bundle_registry.yaml
  generation_script: scripts/generate_bundle_registry.py
  description: 由核心清单和各 bundle manifest 汇总生成，统一登记 bundle_id、bundle_type、namespace、owner、current_version、depends_on、status 和可引用范围，用于判断跨包冲突应提交给谁审核。
  required_fields: [bundle_id, bundle_type, namespace, owner, current_version, status]
  optional_fields: [scope_type, scope_name, depends_on, exports, allowed_consumers, review_owner]

loading_summary_contract:
  description: 摘要类 token 只用于导航和裁剪上下文，不替代 schema、对象、关系、证据和审计原文。所有摘要必须可追溯到源文件 hash。
  common_summary_fields: [summary_hash, source_hashes, last_refreshed_at, coverage_scope, known_gaps]
  bundle_summary:
    recommended_path: shared/_index/bundle_summary.yaml
    fields: [bundle_id, bundle_version, scope_summary, researcher_readable_summary, owner, exported_modules, scenario_index, key_object_index, key_relation_index, key_rule_index, evidence_coverage_summary, dependency_summary, known_gaps, source_hashes, last_refreshed_at, summary_hash]
    researcher_readable_summary:
      description: 每个 bundle_version 必须提供研究员可先读的一屏简要版，用自然语言说明本版本能解决什么研究问题、典型问法、明确不回答的问题、相比上一版的主要变化、证据状态、适用边界、关键风险或缺口，以及建议继续读取的入口。它是版本导读和问题范围契约，不替代正式对象、关系、证据、规则和审计记录。人类可读 Markdown（01_bundle_summary.md、runtime_context_card.md）必须由 generate_runtime_package.py 从本段派生，不得手改不同步。
      required_fields: [version_headline, research_use, what_you_can_ask, what_we_cannot_answer, how_to_ask, major_changes, evidence_status, usable_boundaries, key_risks_or_gaps, suggested_next_reading]
      optional_fields: []
      what_you_can_ask_item_fields: [topic, summary, example_questions, what_you_get]
      writing_rules:
        - version_headline 应用一句话说明本版本定位和研究主线，不写内部字段堆砌。
        - research_use 应说明研究员可以用本版本完成的具体研究动作，并明确不输出买卖建议或目标价。
        - what_you_can_ask 按场景或主题分组；每组至少 2 条 example_questions，并说明 what_you_get。
        - what_we_cannot_answer 至少 3 条，写清典型超范围问题及原因。
        - how_to_ask 教用户如何把问题收窄到可路由范围。
        - major_changes 应聚焦相对上一版本的研究含义变化；首版说明本版首次建立的能力。工程术语可放此处，不放正文导读。
        - evidence_status 应说明证据覆盖、可信度、时效性和明显缺口，避免 slot id 和工程状态枚举。
        - usable_boundaries 应明确适用范围、不适用范围和不能据此下结论的地方。
        - key_risks_or_gaps 应保留尚未解决的结构、证据或推理风险，用自然语言。
        - suggested_next_reading 优先指向 scenario_context_card.md；不要只列裸 yaml 路径。
        - 正文禁止使用 consumable、fully_bound、ScenarioModel、PatchRequest 等工程术语；示例问句用完整中文。
      derived_markdown:
        bundle_summary_md: 01_bundle_summary.md
        runtime_context_card: runtime_contracts/runtime_context_card.md
        generator_script: scripts/generate_runtime_package.py
        generator_functions: [build_runtime_context_card]
  asset_index:
    recommended_path: shared/_index/asset_index.yaml
    fields: [bundle_id, object_count_by_type, key_assets, external_refs, owner_bundle_id, known_gaps, source_hashes, summary_hash]
  capability_index:
    recommended_path: shared/_index/capability_index.yaml
    description: 能力层导航入口，声明 bundle 能被 AI 调用的投研能力、绑定的 ScenarioModel/LogicFunction、所需 refs、确定性门禁和失败降级方式。
    fields: [bundle_id, bundle_version, capability_layer_contract, items, known_gaps, source_hashes, summary_hash]
    item_required_fields: [capability_id, input_contract, output_contract, bound_scenario_models, required_refs, deterministic_gates, failure_behavior]
    writing_rules:
      - capability_index 只做导航和加载裁剪，不复制完整对象、证据或规则。
      - bound_scenario_models 必须指向 ScenarioModel；bound_logic_functions 如存在，必须指向 LogicFunction.functionId。
      - 输出契约必须引用 schemas/common.yaml.global_research_output_boundary。
      - failure_behavior 必须使用 common_enums.failureBehavior。
  relation_index:
    recommended_path: shared/_index/relation_index.yaml
    fields: [bundle_id, relation_count_by_type, key_relations, cross_bundle_edges, dangling_relation_count, known_gaps, source_hashes, summary_hash]
  evidence_summary:
    recommended_path: shared/_index/evidence_summary.yaml
    fields: [bundle_id, source_count, claim_count, fact_count, evidence_coverage_by_object_type, conflicting_claim_count, stale_evidence_count, source_hashes, summary_hash]
  rule_summary:
    recommended_path: shared/_index/rule_summary.yaml
    fields: [bundle_id, rule_count_by_category, active_rule_ids, draft_rule_ids, deprecated_rule_ids, function_backed_rule_ids, required_scenario_refs, source_hashes, summary_hash]
  scenario_summary:
    recommended_path: scenario_packs/<scenario_id>/scenario_summary.yaml
    fields: [scenario_id, scenario_goal, researcher_readable_summary, question_coverage, entry_objects, key_variables, key_rules, evidence_summary, default_loading, known_gaps, source_hashes, last_refreshed_at, summary_hash]
    researcher_readable_summary:
      description: 每个正式 scenario_pack 必须提供场景级一屏导读，说明本场景覆盖范围、可问问题、不回答问题、提问方式、输出级别和材料缺口。人类可读 Markdown（scenario_context_card.md）由 generate_runtime_package.py 派生。
      required_fields: [scenario_headline, what_this_covers, what_you_can_ask, what_we_cannot_answer, how_to_ask, what_you_get_overall, evidence_status, known_gaps]
      what_you_can_ask_item_fields: [topic, example_questions, what_you_get]
      writing_rules:
        - scenario_goal 用一句人话描述场景用途，不写 Skill 消费或内部输出枚举。
        - what_you_can_ask 与 question_coverage / question_map 的问法保持一致或为其超集。
        - what_we_cannot_answer 写清本场景不接的问题类型。
        - what_you_get_overall 用自然语言说明输出级别（观察、跟踪、资产影响候选等）及是否需人工复核。
        - 正文禁止工程术语堆砌；详细规范见 15-本体资产生产/references/摘要与问题范围编写要求.md
      derived_markdown:
        scenario_context_card: scenario_packs/<scenario_id>/scenario_context_card.md
        generator_script: scripts/generate_runtime_package.py
        generator_functions: [build_scenario_context_card]
  consumption_rules:
    - 下游 Skill 默认先读摘要和 loading_rules。
    - 摘要命中后再按引用读取完整对象、关系、证据、规则或审计记录。
    - 推理和校验不得只依据摘要做最终判断。
    - 摘要 hash 与源文件 hash 不一致时，消费型 Skill 必须降级为 normal/deep 加载或阻断并记录缺口。
    - light 模式只允许盘点、定位和缺口报告，不允许形成最终判断链。
