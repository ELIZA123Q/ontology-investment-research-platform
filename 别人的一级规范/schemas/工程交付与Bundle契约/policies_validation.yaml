schema_name: policies_validation
schema_version: 0.1.0
namespace: investment_ontology
status: draft
depends_on:
  common: ../common.yaml
  governance_policy: ../治理域/policies_governance.yaml
canonical_rule: YAML 是正式机器约束；Python 校验器只负责解释和执行本文件声明的通用门禁。
description: >
  Bundle 校验器使用的机器可读门禁索引。业务语义、角色相容性、运行时字段要求、
  生产准入、AI 洞见晋升、校准指标和可复用规则准入均在此声明；
  validate_bundle.py 只保留加载、遍历、引用解析、表达式执行和错误报告能力。

validation_policy:
  interpreter_boundary:
    yaml_owned_gate_sections:
      - runtime_data_requirements
      - production_shared_gate
      - signal_role_compatibility
      - judgment_asset_promotion
      - reasoning_rule_gate
      - conduction_contract_gate
      - scenario_path_gate
      - ai_origin_gate
      - metric_calibration_gate
      - scenario_model_gate
      - automate_flow_gate
      - logic_function_gate
      - enum_deprecation_gate
      - action_side_effect_gate
      - rule_file_shape_gate
      - rule_registry_gate
      - action_followup_side_effect_gate
      - action_followup_gate
      - action_rule_binding_gate
      - function_boundary_gate
      - scenario_overlay_gate
      - release_package_gate
      - runtime_package_gate
      - runtime_asset_exposure_gate
    python_hard_rules:
      - yaml_parse_and_duplicate_key_detection
      - safe_path_resolution
      - file_traversal_and_instance_collection
      - base_schema_required_field_and_enum_execution
      - relation_endpoint_and_cardinality_execution
      - manifest_hash_and_snapshot_execution
      - schema_file_group_aggregation_execution
      - release_package_file_traversal

  runtime_data_requirements:
    source_mode_primary_allowed: [public_sources]
    manual_supplement_required_value: true
    runtime_evidence_snapshot_contract_ref: schemas/工程交付与Bundle契约/contracts_workspace.yaml#runtime_evidence_snapshot_contract
    runtime_evidence_snapshot_path_template: runtime-local://runs/<run_id>/runtime_evidence_snapshot.json
    freshness_policy_refs:
      - policies_governance.retrieval_policy.freshness_policy.high_freshness
      - policies_governance.retrieval_policy.freshness_policy.medium_freshness
      - policies_governance.retrieval_policy.freshness_policy.low_freshness
    on_missing_allowed:
      - block_with_gap
      - downgrade_to_observation
      - lower_confidence
      - observation_only
      - block_conclusion
    freshness_event_emit_on_allowed:
      - observation_recorded
      - freshness_changed
      - stale_detected
      - requirement_breached
    freshness_event_required_fields: [rule_ref, emit_on, event_refs, downstream_actions, no_ontology_feedback_on_data_change]
    freshness_event_rule_ref: reasoning.trigger.runtime_data_freshness_change
    freshness_event_allowed_refs:
      - reasoning.followup.create_state_variable_observation.state_variable_observation_recorded
      - reasoning.followup.create_state_variable_observation.data_freshness_changed
      - governance.followup.record_action_followup.data_stale_detected
      - governance.followup.record_action_followup.data_requirement_breached
    evidence_field_mapping_required:
      source_document_fields: [canonicalSourceId, sourceForm, sourceReliability, capturedAt]
      evidence_claim_fields: [claimStatus, validTo, invalidatedAt, supersededBy]
      evidence_fact_fields: [factStatus, sourceClaimIds, confidenceScore]
      observation_fields: [observationTime, observationSourceName, sourceStatementType, recordedAt]

  production_shared_gate:
    admission_policy_ref: policies_governance.formal_asset_admission_policy
    active_or_confirmed_requires_governance: true
    forbidden_shared_statuses: [candidate, draft, review_pending]
    forbidden_shared_fields:
      - operation
      - reviewNote
      - extractionConfidence
      - candidateReason
      - proposedBy
      - proposedAt
      - patchRequestId
      - source_gap
      - pendingReview
    formal_shared_dirs:
      - shared/semantic_objects
      - shared/semantic_relations
      - shared/reasoning_assets
      - shared/evidence_index
      - shared/reuse_assets
      - shared/concept_layer

  rule_file_shape_gate:
    description: rules 文件只承载声明式规则，不得变成关系实例桶。
    rule_file_patterns: ["*_rules.yaml", "rules.yaml", "inference_rules.yaml"]
    forbidden_relation_only_top_level: true
    allowed_rule_top_level_keys:
      - items
      - rules
      - scenario_local_rules
      - inference_rules
      - validation_rules
      - quality_rules
      - scoring_rules
      - promotion_rules
      - blocking_rules
      - action_preconditions
      - trigger_rules
      - permission_rules
    inference_rules_item_type: InferenceRule

  rule_registry_gate:
    description: 各域 rules.yaml 采用轻量 Rule Registry；按 rule_binding 区分 Action 门禁、推理资产与 AutomateFlow 触发。
    canonical_files:
      - schemas/语义结构域/rules.yaml
      - schemas/判断推理域/rules.yaml
      - schemas/证据域/rules.yaml
      - schemas/治理域/rules.yaml
    allowed_rule_sets: [inference_rules, validation_rules, quality_rules, scoring_rules, promotion_rules, blocking_rules, action_preconditions, trigger_rules, permission_rules]
    required_rule_fields: [rule_id, rule_name, rule_type, rule_binding, execution, description, input_objects, condition, output, evidence_requirement, confidence_effect, failure_handling, owner, version, test_cases]
    rule_type_values: [inference, validation, quality, scoring, promotion, blocking, action_precondition, trigger, permission]
    rule_binding_values: [action, inference_asset, automate_flow]
    rule_binding_by_rule_type:
      validation: action
      quality: action
      promotion: action
      blocking: action
      action_precondition: action
      permission: action
      inference: inference_asset
      scoring: inference_asset
      trigger: automate_flow
    action_binding_required_fields: [used_by_actions]
    inference_binding_required_fields: [asset_types, consumed_by_actions]
    automate_binding_required_fields: [trigger_sources, condition_refs]
    execution_values: [declarative, declarative_with_optional_function_ref, functionRef]

  action_followup_side_effect_gate:
    description: >
      ActionFollowup 契约归属各域 actions_*.yaml 的 side_effects(type=trigger_followup)。
      events.yaml 已废弃；校验器从 Action 聚合事件定义，不再读取 event_model。
    required_side_effect_fields: [type, event_id, event_name, followup_kind, terminal_handling, allowed_next_actions, payload_fields, payload_contract]
    required_followup_payload_fields: [triggeringActionAuditId, targetObjectIds, payloadSummary]
    event_type_enum_ref: actionFollowupKind
    deprecated_event_files:
      - schemas/语义结构域/events.yaml
      - schemas/判断推理域/events.yaml
      - schemas/证据域/events.yaml
      - schemas/治理域/events.yaml
    deprecated_event_file_required_status: deprecated

  action_followup_gate:
    description: ActionFollowup 只记录 Action 完成后可路由的后续信号，不替代外部研究 Event 或 ActionAudit。
    object_type: ActionFollowup
    event_type_enum_ref: actionFollowupKind
    status_enum_ref: actionFollowupStatus
    required_fields: [eventName, eventType, eventStatus, emittedAt, emittedByActionType, triggeringActionAuditId, payloadSummary]
    terminal_handling_values: [no_followup_required, trigger_next_action, enqueue_review, create_patch_request_candidate, block_next_action]

  action_rule_binding_gate:
    description: >
      Rule Registry 是 Action 校验规则的复用库，不是与 Action 平行的第四套逻辑。
      rule_binding=action 的规则必须通过 rule_refs 与 used_by_actions 双向绑定；
      rule_binding=inference_asset 的规则通过 inference_consumer_rule_refs 与 inference_binding.consumed_by_actions 双向绑定；
      inference_asset / automate_flow 规则不得出现在 action.rule_refs。
    require_bidirectional_binding: true
    require_inference_consumer_binding: true
    action_bound_rule_binding: action
    inference_bound_rule_binding: inference_asset
    checked_action_groups: [state_transition, review, retrospect]
    required_for_checked_groups: [effects, failure_handling, output_contract]
    audit_output_required: true
    documented_gate_actions:
      AddSignal:
        required_sections: [effects, failure_handling, output_contract, rule_refs]
        required_rule_refs:
          - reasoning.validation.signal_role_relation_compatibility
      UpgradeJudgmentToActive:
        required_sections: [effects, failure_handling, output_contract, rule_refs]
        required_rule_refs:
          - reasoning.promotion.judgment_active_gate
          - reasoning.blocking.active_blocking_signal
      ValidateEvidenceFact:
        required_sections: [effects, failure_handling, output_contract, rule_refs]
        required_rule_refs:
          - evidence.action_precondition.fact_claim_support_required
      CreateJudgmentOutput:
        required_sections: [effects, failure_handling, output_contract, inference_consumer_rule_refs]
        required_inference_consumer_rule_refs:
          - reasoning.scoring.confidence_composition.minimum_chain
    rule_ref_allowed_prefixes: [semantic., reasoning., evidence., governance., rules., policies_, schemas/语义结构域/rules.yaml, schemas/判断推理域/rules.yaml, schemas/证据域/rules.yaml, schemas/治理域/rules.yaml]

  function_boundary_gate:
    description: >
      明确 LogicFunction 在 Action 执行、Rule Registry、InferenceRule 资产与 Scenario 编排四层中的边界；
      简单门禁走 rule_refs，复杂校验走 validation_checks(mode=function)，执行型 Action 走白名单 function_ref。
    validation_check_modes: [declarative, function]
    validation_check_required_fields: [check_id, mode]
    validation_check_declarative_requires: [rule_ref]
    validation_check_function_requires: [function_ref]
    function_ref_required_fields: [functionId, functionVersion, inputContract, outputContract]
    function_ref_indirect_required_fields: [source_field, contract_ref]
    function_backed_actions:
      - ComputeDerivedMetric
      - RunSimulation
      - CompareSimulations
      - EvaluateMonitor
      - ResolveObjectSet
    function_backed_action_requires_sections: [function_ref, effects, failure_handling, output_contract]
    forbid_function_ref_on_non_function_backed_actions: true
    forbid_validation_checks_function_on_function_backed_actions: true
    inference_binding_optional_fields: [function_refs, canonical_inference_rule_ids]
    inference_rule_function_ref_requires_link: true
    forbid_action_bound_rule_function_ref: true

  scenario_overlay_gate:
    description: scenario_local 只允许作为正式声明过的场景局部覆盖层；否则 scenario_pack 必须只保留 refs。
    local_directory: scenario_local
    required_manifest: scenario_overlay.yaml
    overlay_type: scenario_overlay
    overlay_files_required: true
    overlay_files_must_live_under: scenario_local/

  release_package_gate:
    description: production release 包不得携带构建产物、缓存或桌面系统文件。
    forbidden_names: [.DS_Store]
    forbidden_path_parts: [_artifacts, __pycache__, staging]

  runtime_package_gate:
    description: >
      发布给工作台消费的 bundle 必须具备完整 runtime_contracts 层并通过 validation_report 门禁。
      校验器在 bundle 声明 runtime_entry 或 runtime_status=published 时执行。
    trigger_when_any:
      - manifest.runtime_entry present
      - manifest.runtime_status == published
    required_files:
      - runtime_contracts/runtime_index.yaml
      - runtime_contracts/runtime_loading_profile.yaml
      - runtime_contracts/runtime_validation_report.json
    scenario_runtime_files:
      - scenario_runtime_index.yaml
      - scenario_output_contract.yaml
      - scenario_validation_report.json
    checks:
      - manifest_exists
      - runtime_index_exists
      - scenario_index_exists
      - all_refs_resolvable
      - no_staging_assets_in_runtime
      - all_required_assets_confirmed
      - output_contract_exists
      - evidence_trace_available
    validation_report_required_status: passed
    forbidden_runtime_path_parts: [staging, research_memory, _artifacts, bundle_workbenches, team_workspaces]

  runtime_asset_exposure_gate:
    description: runtime_asset_registry 只登记可被正式运行时加载的 active/confirmed 资产，不保留候选或审核中资产的隐藏条目。
    registry_path: shared/_index/runtime_asset_registry.yaml
    loadable_requires:
      record_status: [active, confirmed]
      confirmation_status: [confirmed]
      include_in_runtime: true
    forbidden_confirmation_status: [candidate, needs_review, rejected]
    summary_max_chars: 200

  signal_role_compatibility:
    validation: [supportsHypothesis, supportsJudgment]
    catalyst: [catalyzesJudgment]
    tracking: [tracksHypothesis, tracksJudgment]
    weakening: [weakensHypothesis, weakensJudgment]
    blocking: [blocksHypothesis]

  judgment_asset_promotion:
    upgraded_judgment_statuses: [watchlist, active, formalTrigger]
    reusable_status_fields:
      InferenceRule: ruleStatus
      ConductionTemplate: templateStatus
      ScenarioPath: templateStatus
    promotion_source_fields: [sourceJudgmentIds, originJudgmentIds]
    promotion_container_fields: [properties, extensionFields]

  reasoning_rule_gate:
    deprecated_status: deprecated
    function_backed_requires: [functionRef]
    required_contract_fields: [enforcement_contract, failure_behavior]
    active_rule_required_sections:
      - inputObjectTypes
      - inputBindings
      - outputContract
    output_contract_required_audit: true
    forbidden_active_sections:
      - logicBlocks
    legacy_rule_logic_block_required_fields: [blockId, blockType, onFailure]

  conduction_contract_gate:
    required_structured_fields:
      - sourceVariableId
      - targetVariableId
      - direction
      - sign
      - lagRange
      - confidencePrior
      - evidenceRefs
    active_requires_structured_contract: true

  scenario_path_gate:
    active_status_field: templateStatus
    active_status_value: active
    active_required_contract_fields: [inputContract, outputContract]
    structured_condition_fields: [conditionId, format, expression]

  ai_origin_gate:
    origin_field: originType
    ai_origin_value: ai_derived
    staging_statuses: [candidate, draft, review_pending]
    forbidden_active_statuses: [active, confirmed]
    required_promotion_evidence:
      - evidenceRefs
      - counterEvidenceRefs
      - expectationRefs
      - reviewRecordIds
    failure: ai_derived asset cannot be active or confirmed without promotion review

  marking_propagation_gate:
    derived_types:
      - EvidenceFact
      - StateVariableObservation
      - Signal
      - JudgmentOutput
      - AssetImpact
      - DerivedMetric
      - ScenarioSimulation
      - SimulatedImpact

  metric_calibration_gate:
    calibration_metric_names:
      - hit_rate
      - brier_score
      - calibration_error
      - false_positive_rate
      - avg_lag_error
      - coverage_rate
    calibration_subject_types:
      - InferenceRule
      - ConductionTemplate
      - ScenarioPath
    required_fields: [metricName, metricWindow, measuredAt, value, unit, subjectType, subjectId]

  scenario_model_gate:
    deterministic_step_types: [deterministic_check, rule_check]
    llm_step_types: [llm_route, llm_reasoning]
    action_proposal_output_refs: [ActionProposal, candidate_patch_request]
    asset_impact_required_checks: [market_expectation, expectation_gap, counter_evidence]
    function_step_type: invoke_function
    function_tool_type: logic_function
    forbidden_active_step_types: [llm_reasoning, action_proposal, report_render]

  automate_flow_gate:
    required_fields: [triggerRefs, targetFunctionId, targetActionTypes, outputContract, reviewPolicy]
    monitor_trigger_source_type: Monitor
    trigger_relation_type: automateTriggeredBy
    function_relation_type: automateInvokesFunction
    proposal_relation_type: automateEmitsProposal
    trigger_refs_field: triggerRefs
    target_function_field: targetFunctionId
    target_action_types_field: targetActionTypes
    require_monitor_relation_for_monitor_source: true
    require_function_relation: true

  logic_function_gate:
    active_status_field: functionStatus
    active_status_value: active
    eval_suite_status_field: evalSuiteStatus
    eval_suite_active_status: active
    eval_suite_function_field: targetFunctionId
    eval_suite_case_field: evalCaseIds
    require_active_eval_suite_for_active_function: true

  enum_deprecation_gate:
    required_fields_policy_path: identity_and_governance.enum_deprecation_policy.required_fields_for_deprecation
    allowed_states_policy_path: identity_and_governance.enum_deprecation_policy.deprecation_states
    active_write_forbidden_states: [deprecated_pending_migration, retired]

  action_side_effect_gate:
    explicit_side_effects_required: true
    empty_side_effects_allowed: true
    require_for_action_groups: [review, retrospect, state_transition]
    require_for_effect_fields: [effects, state_transitions]
    require_for_name_fragments: [Patch, Proposal, Review, Approve, Execute, Supplement]

  capability_gate:
    judgment_record_capabilities: [CaptureJudgment]
    conditional_judgment_record_capabilities: [AnalyzeEventImpact]
    required_judgment_record_contract:
      contractRef: schemas/工程交付与Bundle契约/contracts_workspace.yaml#judgment_record_contract
      pathTemplate: team_workspaces/<workspace_id>/judgments/<record_id>.yaml
      formalRuntimeLoading: false
    ordinary_question_persistence: disabled
