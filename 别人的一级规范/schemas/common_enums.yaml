schema_name: common_enums
schema_version: 0.1.0
namespace: investment_ontology
status: draft
canonical_rule: YAML 是正式机器约束；Markdown 只负责解释和示例。
description: 投研本体公共定义——时间类型、ID规则、公共枚举、公共契约、域映射、状态变量类别、去重策略、关系公共约束和动作公共约束。本文件被所有域专属 objects_*.yaml、relations_*.yaml、actions_*.yaml 和 policies_*.yaml 引用。actor_roles、trigger_types、action_groups 和 audit_policy 属于跨域公共动作定义，只在 common.yaml 定义；各域 actions 文件只定义本域动作并引用这些公共约束。

object_categories:
  conceptual_definition:
    zh_name: 概念定义类
    description: 定义研究范围、术语、边界、同义词和概念到业务对象的映射依据。
  research_target:
    zh_name: 研究标的类
    description: 现实世界锚点，承载产业、公司、产品、材料和资产标的。
  observable_dimension:
    zh_name: 可观测维度类
    description: 定义可观察变量、观测事实和变量之间的传导逻辑。
  research_reasoning:
    zh_name: 研究推理类
    description: 承载事件、假设、信号、判断、资产影响和长期命题。
  source_and_record:
    zh_name: 来源与记录类
    description: 支撑来源追溯、动作留痕、审核和复盘。

object_domains:
  description: >
    域→类别的显式映射。域（domain）是投研工作流的四个阶段，
    每个域包含一个或多个对象类别（category）。relations.yaml 的
    relation_groups[*].domain 和 actions.yaml 的域分段注释均引用此枚举。
  domains:
    语义结构域:
      zh_name: 语义结构域
      description: 定义研究范围、术语边界、研究标的及标的间结构关系。
      categories: [conceptual_definition, research_target]
      object_types:
        - ConceptScheme
        - Concept
        - ConceptBoundary
        - Industry
        - Segment
        - Company
        - Product
        - Material
        - Asset
        - ObjectSet
    判断推理域:
      zh_name: 判断推理域
      description: 承载可观测维度定义、观测数据、变量传导、事件、假设、信号、判断、资产影响和投资命题。
      categories: [observable_dimension, research_reasoning]
      object_types:
        - StateVariable
        - StateVariableObservation
        - StateVariablePropagation
        - DerivedMetric
        - Event
        - StateHypothesis
        - Signal
        - JudgmentOutput
        - MarketExpectation
        - AssetImpact
        - InvestmentThesis
        - ScenarioModel
        - InferenceRule
        - ConductionTemplate
        - ScenarioPath
        - Monitor
        - ScenarioSimulation
        - HypotheticalInput
        - SimulatedImpact
    证据域:
      zh_name: 证据域
      description: 支撑来源追溯、证据摄入、主张抽取与事实归并。
      categories: [source_and_record]
      object_types:
        - SourceDocument
        - EvidenceEpisode
        - EvidenceClaim
        - EvidenceFact
    治理域:
      zh_name: 治理域
      description: 承载变更管理、审核记录、推理运行轨迹和审计日志。
      categories: [source_and_record, research_reasoning]
      object_types:
        - PatchRequest
        - PatchLedgerItem
        - ActionProposal
        - LogicFunction
        - LogicBlock
        - AutomateFlow
        - ObjectViewSpec
        - EvalCase
        - EvalSuite
        - EvalRun
        - EvalResult
        - MetricSnapshot
        - InferenceRun
        - RuleApplication
        - ReasoningStep
        - ActionFollowup
        - ActionAudit
        - ReviewRecord
  domain_enum:
    description: relations.yaml、actions.yaml 和其他 consumer 可引用的域枚举值。
    values: [语义结构域, 判断推理域, 证据域, 治理域, 工程交付与Bundle契约]

deprecated_domain_aliases:
  description: 历史域名只作为迁移解释存在；任务型本地 schemas/ 不得保留旧域目录。
  aliases:
    本体域:
      canonical_domain: 语义结构域
      status: deprecated
    推理域:
      canonical_domain: 判断推理域
      status: deprecated
    治理与工程域:
      canonical_domain: 治理域
      status: deprecated

