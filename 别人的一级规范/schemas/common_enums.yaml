  revenue_quality: 收入质量
  asset_pricing: 资产定价
  operating_efficiency: 运营效率
  product_competitiveness: 产品竞争力
  governance_and_risk: 治理与风险

variable_dedup_rules:
  description: StateVariable 去重与归并策略。配合 StateVariable.normalizedKey 字段，防止不同 agent 或不同轮次创建语义相同的变量。
  strategies:
    - strategy: exact_normalizedKey_match
      priority: 1
      description: normalizedKey 完全匹配的 StateVariable 视为同一变量，合并时保留最早创建的 ID。
      auto_execute: true
      action: merge_to_earliest_id
    - strategy: name_category_scope_match
      priority: 2
      description: name 编辑距离 < 3 且 category 和 observedOn scope 相同时，标记为疑似重复，进入 governance review_queue。
      auto_execute: false
      action: flag_for_review
    - strategy: edit_distance_match
      priority: 3
      description: name 编辑距离 < 3 且 category 相同但 scope 不同时，标记为候选重复，不自动合并。
      auto_execute: false
      action: flag_for_review
  merge_authority:
    description: 只有 ontology_core 或 industry_extension 层的 StateVariable 可作为归一化基准。
    layer_priority:
      - ontology_core
      - industry_extension
      - team_workspace
    fields_to_preserve_on_merge: [id, createdAt, sourceType]
    fields_to_update_on_merge: [description, observationFrequency, referenceBaseline, normalizedKey]
  conflict_resolution:
    description: 当两个归并策略产生不同结果时，进入 governance review_queue（reviewType=conflict_review）。


reasoning_pattern_taxonomy:
  description: >
    可复用推理结构的伞契约。核心规范使用 StateVariablePropagation、
    ConductionTemplate 和 ScenarioPath 承载不同层级的推理结构，避免在多个对象中重复表达同一类逻辑。
  shared_contract:
    inputs: 显式声明消费的变量、事件、观测、证据、关系或情景参数。
    logic: 使用结构化条件、传导逻辑、路径节点或规则块表达，不把复杂逻辑写入 Action。
    outputs: 声明可能产生的假设、信号、判断、资产影响、模拟产物、补丁或审计记录。
    status: 使用 ruleStatus 或 templateStatus 管理 draft、active、deprecated 等生命周期。
  pattern_types:
    state_variable_propagation:
      object_type: StateVariablePropagation
      purpose: 表达变量到变量的可复用因果或方向传导逻辑，也承接原 StateChange 的方向性状态变化模式。
    conduction_template:
      object_type: ConductionTemplate
      purpose: 表达推理执行时从变量 A 推导变量 B 需要检查的信号、反证、边界条件和时滞。
    scenario_path:
      object_type: ScenarioPath
      purpose: 表达从当前状态到未来结果的条件路径、关键假设、互斥情景和证伪条件。
  migration_policy:
    deprecated_object_type: StateChange
    preferred_object_type: StateVariablePropagation
    operation: migrate
    rule: 新实例不得创建 StateChange；原 StateChange.sourceVariableId、direction、magnitude、boundaryConditions、affectedVariables 迁入 StateVariablePropagation 的传导字段和 propagatesFrom/propagatesTo 关系。

