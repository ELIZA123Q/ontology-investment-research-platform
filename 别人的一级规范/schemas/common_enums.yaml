field_type_notes:
  string: 自由文本。
  enum: 必须取 enum 中的一个值。
  number: 数值。
  datetime: ISO-8601 日期或日期时间。
  time_window: 时间区间或可解释的期限描述。
  array: 列表。
  object_ref: 对象引用，正式关联应优先用 relations.yaml 中的关系表达。
  any: 审计快照，允许保存结构化或非结构化旧值和新值。
