schema_name: objects_governance_run_audit
schema_version: 0.1.0
namespace: investment_ontology
status: draft
depends_on: ../common.yaml
canonical_rule: YAML 是正式机器约束；Markdown 只负责解释和示例。
description: 投研治理域对象类型定义——推理运行与轨迹（InferenceRun/RuleApplication/ReasoningStep）、审计与审核（ActionAudit/ReviewRecord）。公共枚举和域映射见 common.yaml。
relation_direction_note: optional_relations 中的 sourceOf 表示该对象允许被 SourceDocument -> object 的来源关系追溯；不表示该对象作为 sourceOf 的 source。

# ============================================================
# 域四：治理域 — 推理运行、审计与复盘
# ============================================================

object_types:
  InferenceRun:
    zh_name: 推理运行记录
    category: source_and_record
    managed_by: system
    description: 记录一次投研推理调用的输入问题、业务时间、本体版本、使用证据、排除证据、推理链和反馈。
    lifecycle_field: runStatus
    initial_state: null
    terminal_states: [completed, partial, blocked, failed]
    fields:
      question:
        zh_name: 用户问题
        type: string
        required: true
      businessTime:
        zh_name: 推理业务时间
        type: datetime
        time_type: business_time
        required: false
      runMode:
        zh_name: 运行模式
        type: enum
        enum_ref: runMode
        required: false
        default: live
      asOfTime:
        zh_name: 时点重建基准
        type: datetime
        time_type: business_time
        required: false
        required_when: runMode in [replay, backtest]
        description: 历史回放和回测只能消费 learnedAt <= asOfTime 的对象、证据和观测。
      ontologyVersion:
        zh_name: 本体版本
        type: string
        required: true
      centerObjects:
        zh_name: 中心对象
        type: array
        required: false
      usedRelationIds:
        zh_name: 使用关系 ID
        type: array
        required: false
      usedEvidenceClaimIds:
        zh_name: 使用证据 Claim ID
        type: array
        required: false
      excludedInvalidClaimIds:
        zh_name: 排除的失效 Claim ID
        type: array
        required: false
      excludedByAsOf:
        zh_name: 时点门禁排除项
        type: array
        required: false
        description: 因 learnedAt > asOfTime 或回退 observedAt 不满足时点重建而被排除的对象 ID。
      reasoningChain:
        zh_name: 推理链摘要
        type: array
        required: false
      confidence:
        zh_name: 推理置信度
        type: enum
        enum: [high, medium, low]
        required: false
      runStatus:
        zh_name: 运行状态
        type: enum
        enum_ref: inferenceRunStatus
        required: true
        description: >
          initializing — 正在解析问题、匹配概念和入口对象；
          retrieving — 正在按 retrieval_policy.traversal_order 遍历图谱；
          evaluating — 正在逐层检查 layer_gates；
          completed — 全部 gates 通过，产生完整推理链；
          partial — 部分 gates 通过，有缺口但产生部分结论；
          blocked — 某 gate 的 blocking_condition 触发，停止；
          failed — 系统错误、本体不可用或条件评估异常。
      ontologyFeedback:
        zh_name: 本体反馈
        type: array
        required: false
        description: >
          runStatus 为 blocked 或 failed 时必填，记录阻塞/失败原因及缺失项；
          runStatus 为 partial 时建议填写缺口描述；
          runStatus 为 completed 时可选。
      candidatePatchRequestIds:
        zh_name: 候选补丁请求 ID
        type: array
        required: false
      runAt:
        zh_name: 运行时间
        type: datetime
        time_type: system_time
        required: true
        generated_by: system
    required_relations: []
    optional_relations: [runAppliesRule, runContainsStep, sourceOf]
    quality_rules:
      - InferenceRun 是运行日志，不是正式投研结论或发布判断。
      - 推理排除失效证据时，应记录 excludedInvalidClaimIds。
      - runMode 为 replay 或 backtest 时必须声明 asOfTime，并执行 as_of_reconstruction 门禁。

  # —— RuleApplication：单次规则调用记录 ——
  RuleApplication:
    zh_name: 规则应用记录
    category: research_reasoning
    managed_by: system
    description: 记录推理过程中一条 InferenceRule 被调用的完整上下文：触发了哪个 StateVariablePropagation、消费了哪些 Signal、检查了哪些反证、市场预期、预期差、时间尺度和 Catalyst 条件、得出了什么结论、引用了哪些证据。这是推理链路可评测、可归因的最小单元。
    immutable: true
    fields:
      rule_id:
        zh_name: 推理规则 ID
        type: string
        required: true
        description: 指向推理规则实例。
      inference_run_id:
        zh_name: 所属推理运行 ID
        type: object_ref
        required: true
        description: 指向 InferenceRun 实例，用于关联同一次推理调用的所有规则应用。
      step_order:
        zh_name: 执行顺序
        type: integer
        required: true
        description: 在同一次 InferenceRun 中的执行序号，从 1 开始。
      input_event_id:
        zh_name: 输入事件 ID
        type: object_ref
        required: false
        description: 触发此规则的事件实例。
      input_state_changes:
        zh_name: 输入状态变化
        type: array
        required: false
        description: 此规则消费的 StateVariablePropagation 或 StateVariablePropagation 实例 ID 列表。
      consumed_signals:
        zh_name: 消费的信号
        type: array
        required: false
        description: 此规则使用的 Signal 实例 ID 列表，含 signalRole。
        items:
          type: object
          properties:
            signal_id:
              type: object_ref
            signal_role:
              type: enum
              enum: [validation, catalyst, tracking, weakening, blocking]
            weight:
              type: enum
              enum: [primary, supporting, weak]
      checked_counters:
        zh_name: 检查的反证
        type: array
        required: false
        description: 此规则检查过的 weakening/blocking Signal 实例 ID 列表及结论。
        items:
          type: object
          properties:
            counter_id:
              type: object_ref
            counter_type:
              type: enum
              enum: [weakening, blocking]
            check_result:
              type: enum
              enum: [active_and_valid, inactive, invalidated, superseded, not_applicable]
            action_taken:
              type: enum
              enum: [suppress_conclusion, lower_confidence, noted_only, ignored]
      market_expectation_checked:
        zh_name: 市场预期检查
        type: boolean
        required: false
      market_expectation_result:
        zh_name: 市场预期检查结果
        type: string
        required: false
      market_expectation_ids:
        zh_name: 市场预期 ID
        type: array
        required: false
        description: 本次规则应用对比或引用的 MarketExpectation 实例。
      expectation_gap_checked:
        zh_name: 预期差检查
        type: boolean
        required: false
      expectation_gap_result:
        zh_name: 预期差检查结果
        type: string
        required: false
      time_horizon_checked:
        zh_name: 时间尺度检查
        type: boolean
        required: false
      catalyst_checked:
        zh_name: 催化剂检查
        type: boolean
        required: false
      catalyst_result:
        zh_name: 催化剂检查结果
        type: string
        required: false
      conclusion:
        zh_name: 规则结论
        type: string
        required: true
        description: 此规则应用产生的中继结论（不是最终 AssetImpact）。
      confidence:
        zh_name: 结论置信度
        type: enum
        enum: [high, medium, low]
        required: true
      inputConfidence:
        zh_name: 输入置信度明细
        type: object
        required: false
        description: 本次规则应用消费的各输入对象、信号或传导边的离散/数值置信度。
      evidenceIndependence:
        zh_name: 证据独立性明细
        type: object
        required: false
        description: independentSourceCount、独立来源 ID 和去重依据。
      freshnessAdjustment:
        zh_name: 新鲜度调整
        type: object
        required: false
        description: 按 freshness policy 和 business time delta 计算的新鲜度衰减。
      counterEvidenceAdjustment:
        zh_name: 反证调整
        type: object
        required: false
        description: weakening/blocking 证据对结论置信度的惩罚或阻断结果。
      historicalCalibrationWeight:
        zh_name: 历史校准权重
        type: number
        required: false
        description: 来自 MetricSnapshot 的规则、模板或情景路径历史校准权重。
      outputConfidenceScore:
        zh_name: 输出置信度分数
        type: number
        value_range: [0, 1]
        required: false
      confidenceCompositionMethod:
        zh_name: 置信度组合方法
        type: string
        required: false
        description: 引用 common.public_contracts.confidence_composition.chain_method.default 或行业覆盖策略。
      evidence_refs:
        zh_name: 证据引用
        type: array
        required: false
        description: 支撑此规则结论的 EvidenceClaim 或 EvidenceFact ID 列表。
      trace_id:
        zh_name: 轨迹 ID
        type: string
        required: true
        generated_by: system
        description: 本 RuleApplication 的唯一标识，格式 RA-YYYYMMDD-serial。
      created_at:
        zh_name: 创建时间
        type: datetime
        time_type: system_time
        required: true
        generated_by: system
    required_relations: []
    optional_relations: [applicationConsumesSignal, sourceOf]
    quality_rules:
      - RuleApplication 是推理过程记录，不是正式投研结论或发布判断。
      - 每个 RuleApplication 必须能追溯到其所属的 InferenceRun。
      - checked_counters 为空时，应在 conclusion 或 quality_rules 中说明「无反证检查步骤」，避免沉默跳过。
      - consumed_signals 为空时，推理 Skill 应在 ontology_feedback 中标记可能的信号缺失。

  # —— ReasoningStep：原子推理步 ——
  ReasoningStep:
    zh_name: 推理步骤
    category: research_reasoning
    managed_by: system
    description: 记录推理链中一个原子操作：从哪些对象出发、沿哪条关系跳转、到达了哪些对象、消费了哪些证据、在什么条件下做出了什么中间决策。比 RuleApplication 更细粒度——RuleApplication 记录「一条规则如何被应用」，ReasoningStep 记录「图谱中的一次跳转或一次匹配」。
    immutable: true
    fields:
      inference_run_id:
        zh_name: 所属推理运行 ID
        type: object_ref
        required: true
      step_order:
        zh_name: 步骤序号
        type: integer
        required: true
        description: 在同一次 InferenceRun 中的执行序号。
      step_type:
        zh_name: 步骤类型
        type: enum
        enum:
          - concept_resolution
          - entry_point_match
          - relation_traversal
          - evidence_retrieval
          - signal_evaluation
          - counter_check
          - hypothesis_formation
          - judgment_formation
          - asset_impact_derivation
          - gap_detection
          - fallback
        required: true
      input_object_ids:
        zh_name: 输入对象 ID
        type: array
        required: false
        description: 此步骤的起始对象实例。
      relations_traversed:
        zh_name: 遍历的关系
        type: array
        required: false
        description: 此步骤中使用的关系类型和实例 ID。
        items:
          type: object
          properties:
            relation_type:
              type: string
            relation_id:
              type: object_ref
      output_object_ids:
        zh_name: 输出对象 ID
        type: array
        required: false
        description: 此步骤到达的目标对象实例。
      evidence_consumed:
        zh_name: 消费的证据
        type: array
        required: false
        description: 此步骤使用的 EvidenceClaim 或 EvidenceFact ID。
      decision:
        zh_name: 步骤决策
        type: string
        required: false
        description: 此步骤的判断或选择。
      confidence:
        zh_name: 步骤置信度
        type: enum
        enum: [high, medium, low]
        required: false
      rule_application_id:
        zh_name: 关联规则应用 ID
        type: object_ref
        required: false
        description: 如果此步骤是某次 RuleApplication 的一部分，指向该 RuleApplication。
      trace_id:
        zh_name: 轨迹 ID
        type: string
        required: true
        generated_by: system
        description: 本 ReasoningStep 的唯一标识，格式 RS-YYYYMMDD-serial。
      created_at:
        zh_name: 创建时间
        type: datetime
        time_type: system_time
        required: true
        generated_by: system
    quality_rules:
      - ReasoningStep 记录图谱导航路径，不替代 RuleApplication 的规则消费语义。
      - step_type=gap_detection 时必须记录缺失的对象类型、关系类型或证据类型。
      - step_type=fallback 时必须记录触发降级的原因和降级后的替代路径。
    required_relations: []
    optional_relations: [sourceOf]

  ActionFollowup:
    zh_name: 动作后续信号
    category: source_and_record
    managed_by: system
    description: >
      记录 Action 执行后产生的后续信号，用于串联下游动作、自动化、审核和复盘。
      ActionFollowup 不是研究事件；外部政策、订单、价格、技术或公司事实仍使用判断推理域 Event。
    immutable: true
    fields:
      eventName:
        zh_name: 事件名称
        type: string
        required: true
      eventType:
        zh_name: 后续信号类型
        type: enum
        enum_ref: actionFollowupKind
        required: true
      eventStatus:
        zh_name: 事件消费状态
        type: enum
        enum_ref: actionFollowupStatus
        required: true
        default: emitted
      emittedAt:
        zh_name: 事件发出时间
        type: datetime
        time_type: system_time
        required: true
        generated_by: system
      emittedByActionType:
        zh_name: 发出事件的动作类型
        type: string
        required: true
      triggeringActionAuditId:
        zh_name: 触发来源动作记录
        type: object_ref
        required: true
      targetObjectIds:
        zh_name: 相关对象 ID
        type: array
        required: false
      payloadSummary:
        zh_name: 载荷摘要
        type: string
        required: true
        description: 只保存可审计摘要，不保存凭证、密钥、完整敏感载荷或外部系统私密响应。
      terminalHandling:
        zh_name: 终止或后续处理
        type: enum
        enum: [no_followup_required, trigger_next_action, enqueue_review, create_patch_request_candidate, block_next_action]
        required: true
      nextActionType:
        zh_name: 后续动作类型
        type: string
        required: false
      failureReason:
        zh_name: 失败原因
        type: string
        required: false
    required_relations: []
    optional_relations: [followupEmittedBy, followupTriggersProposal, sourceOf]
    quality_rules:
      - ActionFollowup 是动作后续信号，不得替代判断推理域 Event。
      - ActionFollowup 必须能追溯到 ActionAudit；缺少 triggeringActionAuditId 时不得触发后续动作。
      - ActionFollowup 只能触发 ActionProposal、ReviewRecord、PatchRequest 候选或 AutomateFlow，不得直接修改 shared 正式资产。

  ActionAudit:
    zh_name: 动作记录
    category: source_and_record
    managed_by: system
    description: 本体中每次操作的完整记录；系统自动生成，创建后不可修改。
    immutable: true
    fields:
      actionType:
        zh_name: 动作类型
        type: string
        required: true
      performedBy:
        zh_name: 执行人
        type: string
        required: true
      performedAt:
        zh_name: 执行时间
        type: datetime
        time_type: system_time
        required: true
        generated_by: system
      targetObject:
        zh_name: 被操作对象
        type: object_ref
        required: true
      targetField:
        zh_name: 被修改字段
        type: string
        required: false
      previousValue:
        zh_name: 修改前值
        type: any
        required: false
      newValue:
        zh_name: 修改后值
        type: any
        required: false
      previousState:
        zh_name: 操作前状态
        type: string
        required: false
      newState:
        zh_name: 操作后状态
        type: string
        required: false
      actionReason:
        zh_name: 操作原因
        type: string
        required: true
      evidenceRefs:
        zh_name: 操作依据引用
        type: array
        required: false
        source_note: 由 03 半导体示例反推补充。
      executionStatus:
        zh_name: 执行结果
        type: enum
        enum: [success, failed]
        required: true
    required_relations: [auditFor]
    optional_relations: [sourceOf]

  ReviewRecord:
    zh_name: 审核记录
    category: source_and_record
    managed_by: reviewer_or_system
    description: 对象、动作、状态变更、补丁、合规裁决或复盘是否被认可的统一记录；具体语义由 reviewType 区分。
    fields:
      reviewType:
        zh_name: 审核类型
        type: enum
        enum_ref: reviewType
        required: true
      reviewResult:
        zh_name: 审核结论
        type: enum
        enum_ref: reviewResult
        required: true
      reviewNotes:
        zh_name: 审核意见
        type: string
        required: false
      fundamentalCorrect:
        zh_name: 基本面判断正确性
        type: enum
        enum_ref: retrospectDimensionResult
        required: false
        only_for_reviewType: retrospect
      timingCorrect:
        zh_name: 时间节点判断正确性
        type: enum
        enum_ref: retrospectDimensionResult
        required: false
        only_for_reviewType: retrospect
      catalystEffective:
        zh_name: 催化信号有效性
        type: enum
        enum_ref: retrospectDimensionResult
        required: false
        only_for_reviewType: retrospect
      assetImpactRealized:
        zh_name: 资产影响兑现情况
        type: enum
        enum_ref: retrospectDimensionResult
        required: false
        only_for_reviewType: retrospect
      outcomeStatus:
        zh_name: 后验结果状态
        type: enum
        enum_ref: retrospectOutcomeStatus
        required: false
        only_for_reviewType: retrospect
      actualOutcomeSummary:
        zh_name: 后验结果摘要
        type: string
        required: false
        only_for_reviewType: retrospect
        description: 记录实际发生了什么，包括基本面、价格、时间和路径表现。
      reviewBusinessTime:
        zh_name: 复盘业务时间
        type: datetime
        time_type: business_time
        required: false
        only_for_reviewType: retrospect
      asOfTime:
        zh_name: 复盘时点基准
        type: datetime
        time_type: business_time
        required: false
        only_for_reviewType: retrospect
        description: 复盘使用的当时可见信息基准；不得消费晚于该时点获知的证据。
      retrospectHorizonBucket:
        zh_name: 复盘时间尺度
        type: enum
        enum_ref: timeHorizonBucket
        required: false
        only_for_reviewType: retrospect
      expectationGapReviewed:
        zh_name: 预期差复盘
        type: string
        required: false
        only_for_reviewType: retrospect
        description: 复盘当时判断相对市场共识的预期差是否真实存在、是否按预期收敛。
      pricingReviewed:
        zh_name: 定价状态复盘
        type: string
        required: false
        only_for_reviewType: retrospect
        description: 复盘判断兑现时市场是否已提前定价、过度反应或仍未反映。
      scenarioReviewed:
        zh_name: 情景路径复盘
        type: string
        required: false
        only_for_reviewType: retrospect
        description: 复盘实际路径更接近 base、upside 还是 downside，以及分叉原因。
      effectiveEvidenceIds:
        zh_name: 有效证据 ID
        type: array
        required: false
        only_for_reviewType: retrospect
        description: 复盘确认真正有效的证据、信号或观测 ID。
      overlookedCounterEvidenceIds:
        zh_name: 被忽略反证 ID
        type: array
        required: false
        only_for_reviewType: retrospect
        description: 复盘发现当时应重视但被忽略的 weakening/blocking 证据或信号 ID。
      methodRevisionSuggestion:
        zh_name: 方法修正建议
        type: string
        required: false
        only_for_reviewType: retrospect
        description: 对下次判断、规则或本体结构的修正建议。
      feedbackScope:
        zh_name: 复盘反馈范围
        type: enum
        enum_ref: reviewFeedbackScope
        required: false
        only_for_reviewType: retrospect
        description: personal_method_revision 留在个人台账和 bias_log；ontology_gap 才允许进入本体优化聚合门禁。
      aggregationKey:
        zh_name: 聚合键
        type: string
        required: false
        only_for_reviewType: retrospect
        description: 对同类偏误、缺口或结构问题的归并键，用于判断是否达到反哺本体阈值。
      structuralGap:
        zh_name: 是否结构性缺口
        type: boolean
        required: false
        only_for_reviewType: retrospect
        description: 明确为本体结构缺口时，可不等累计阈值而进入 PatchRequest 审核。
      aggregationEvidenceCount:
        zh_name: 聚合证据次数
        type: integer
        required: false
        only_for_reviewType: retrospect
        description: 同一 aggregationKey 在台账或复盘记录中的累计出现次数。
      followupPatchRequestIds:
        zh_name: 后续补丁请求 ID
        type: array
        required: false
        only_for_reviewType: retrospect
        description: 因复盘触发的候选 PatchRequest。
      reviewedBy:
        zh_name: 审核人
        type: string
        required: true
      reviewedAt:
        zh_name: 审核时间
        type: datetime
        time_type: system_time
        required: true
        generated_by: system
    required_relations: [reviewFor]
    optional_relations: [sourceOf]
    quality_rules:
      - ReviewRecord 是统一记录对象，不代表所有审核都具有相同语义；消费端必须读取 reviewType 判断用途。
      - admission_review/evidence_review/conflict_review/status_review/patch_review/compliance_review/retrospect 应分别对应准入、证据、冲突、状态、补丁、合规和后验复盘场景。
      - reviewType=retrospect 时，后验字段不得回写污染原判断、原证据或原推理运行的创建时点。
