schema_name: relations_governance
schema_version: 0.1.0
namespace: investment_ontology
status: draft
depends_on:
  common_schema: ../common.yaml
  objects_schema: objects_governance.yaml
canonical_rule: YAML 是正式机器约束；Markdown 只负责解释和示例。
description: 投研治理域关系类型定义——补丁触发、来源追溯、审核记录、推理运行结构关系。

relation_defaults:
  direction: directed
  history_policy: preserve_history
  deletion_policy: no_physical_delete_without_migration
  relation_instance_id_pattern: "REL-{YYYYMMDD}-{serial}"
  relation_status_values: [candidate, confirmed, archived]
  required_instance_fields: [id, type, sourceId, targetId, recordStatus]
  inheritance_rule: 实例文件可在容器级声明默认 recordStatus；若关系实例未显式填写 recordStatus，可继承容器默认值。正式入库时系统应补齐为实例字段。
  inverse_of_note: >
    关系类型中的 inverse_of 字段为可选项，声明该关系的逻辑反向关系名。
    当两方关系类型均已定义时，inverse_of 直接引用对方关系类型名；
    当反向关系未实例化时（如 companyBelongsToIndustry 的逆 industryContainsCompany），
    inverse_of 仅声明逆关系名供推理引擎做双向遍历推导，不要求实例化该逆关系。

relation_types:
  claimTriggersPatch:
    zh_name: 主张触发补丁请求
    group: source_and_record_relations
    source_types: [EvidenceClaim]
    target_types: [PatchRequest]
    direction: directed
    cardinality: many_to_many
    description: EvidenceClaim 触发新增、修改、废弃、补证或延后的候选补丁请求。
    properties:
      triggerReason:
        zh_name: 触发原因
        type: enum
        enum: [new_object, new_relation, new_signal, invalidation, evidence_gap, reasoning_feedback, replay_failure, evaluation_failure]
        required: true
      priorityHint:
        zh_name: 优先级提示
        type: enum
        enum: [high, medium, low]
        required: false

  factTriggersPatch:
    zh_name: Fact 触发补丁请求
    group: source_and_record_relations
    source_types: [EvidenceFact]
    target_types: [PatchRequest]
    direction: directed
    cardinality: many_to_many
    description: EvidenceFact 触发候选补丁请求。v1.1 新增。与 claimTriggersPatch 互补。
    properties:
      triggerReason:
        zh_name: 触发原因
        type: enum
        enum: [new_object, new_relation, new_signal, invalidation, evidence_gap, reasoning_feedback, replay_failure, evaluation_failure]
        required: true
      priorityHint:
        zh_name: 优先级提示
        type: enum
        enum: [high, medium, low]
        required: false

  automateTriggeredBy:
    zh_name: 自动化流由监控触发
    group: governance_relations
    source_types: [AutomateFlow]
    target_types: [Monitor]
    direction: directed
    cardinality: many_to_many
    description: AutomateFlow 声明由哪些 Monitor、计划或事件触发；Monitor 触发场景必须显式连边，便于图谱检索自动化入口。
    properties:
      triggerRole:
        zh_name: 触发角色
        type: enum
        enum: [primary, fallback, supplemental]
        required: true

  automateInvokesFunction:
    zh_name: 自动化流调用函数
    group: governance_relations
    source_types: [AutomateFlow]
    target_types: [LogicFunction]
    direction: directed
    cardinality: many_to_one
    description: AutomateFlow 调用目标 LogicFunction；具体执行步骤仍由 LogicFunction/LogicBlock 承载。
    properties:
      invocationRole:
        zh_name: 调用角色
        type: enum
        enum: [target, fallback]
        required: true

  automateEmitsProposal:
    zh_name: 自动化流生成提案
    group: governance_relations
    source_types: [AutomateFlow]
    target_types: [ActionProposal]
    direction: directed
    cardinality: one_to_many
    description: AutomateFlow 产生或关联可审核 ActionProposal；正式写回仍由 ActionProposal 审核与 ActionAudit 承接。
    properties:
      emissionRole:
        zh_name: 产出角色
        type: enum
        enum: [candidate, review_output, executed_output]
        required: true

  sourceOf:
    zh_name: 文档是某对象来源（跨域通用兜底关系）
    group: source_and_record_relations
    source_types: [SourceDocument]
    target_types:
      - Industry
      - ConceptScheme
      - Concept
      - ConceptBoundary
      - Segment
      - Company
      - Product
      - Material
      - Asset
      - StateVariable
      - StateVariableObservation
      - StateVariablePropagation
      - Event
      - StateHypothesis
      - Signal
      - JudgmentOutput
      - MarketExpectation
      - AssetImpact
      - InvestmentThesis
      - EvidenceEpisode
      - EvidenceClaim
      - EvidenceFact
      - PatchRequest
      - PatchLedgerItem
      - ActionProposal
      - LogicFunction
      - LogicBlock
      - AutomateFlow
      - ObjectViewSpec
      - EvalCase
      - EvalSuite
      - EvalRun
      - EvalResult
      - MetricSnapshot
      - InferenceRun
      - ActionFollowup
      - ActionAudit
      - ReviewRecord
    direction: directed
    cardinality: many_to_many
    description: 来源文档是某对象、动作记录或审核记录的信息来源。跨域通用兜底关系。证据域内部优先使用 episodeFromSource、claimCitesSource、factSupportedByClaim 等精确关系。
    properties:
      sourceRole:
        zh_name: 来源角色
        type: enum
        enum: [primary, evidence, cross_validation, audit_basis, review_basis, template_basis]
        required: true
      excerptLocation:
        zh_name: 摘录位置
        type: string
        required: false

  auditFor:
    zh_name: 动作记录对应对象
    group: source_and_record_relations
    source_types: [ActionAudit]
    target_types:
      - Industry
      - ConceptScheme
      - Concept
      - ConceptBoundary
      - Segment
      - Company
      - Product
      - Material
      - Asset
      - StateVariable
      - StateVariableObservation
      - StateVariablePropagation
      - Event
      - StateHypothesis
      - Signal
      - JudgmentOutput
      - MarketExpectation
      - AssetImpact
      - InvestmentThesis
      - SourceDocument
      - EvidenceEpisode
      - EvidenceClaim
      - EvidenceFact
      - PatchRequest
      - PatchLedgerItem
      - ActionProposal
      - LogicFunction
      - LogicBlock
      - AutomateFlow
      - ObjectViewSpec
      - EvalCase
      - EvalSuite
      - EvalRun
      - EvalResult
      - MetricSnapshot
      - InferenceRun
      - ActionFollowup
      - ReviewRecord
    direction: directed
    cardinality: many_to_one
    description: 动作记录针对被创建、修改或状态变更的对象。
    properties:
      changeScope:
        zh_name: 变更范围
        type: enum
        enum: [create, update_field, update_state, create_relation, update_relation, review, retrospect]
        required: true

  reviewFor:
    zh_name: 审核记录对应对象
    group: source_and_record_relations
    source_types: [ReviewRecord]
    target_types:
      - StateHypothesis
      - Signal
      - JudgmentOutput
      - MarketExpectation
      - AssetImpact
      - InvestmentThesis
      - PatchRequest
      - PatchLedgerItem
      - ActionProposal
      - LogicFunction
      - AutomateFlow
      - ObjectViewSpec
      - EvalRun
      - EvalResult
      - InferenceRun
      - ActionAudit
      - ActionFollowup
    direction: directed
    cardinality: many_to_one
    description: 审核记录针对某对象、动作记录或复盘记录。
    properties:
      reviewScope:
        zh_name: 审核范围
        type: enum
        enum: [admission, state_transition, signal_status_update, retrospect, supplement]
        required: true

  runAppliesRule:
    zh_name: 推理运行应用规则
    group: governance_relations
    source_types: [InferenceRun]
    target_types: [RuleApplication]
    direction: directed
    cardinality: one_to_many
    description: 推理运行记录包含某次规则应用；一次 InferenceRun 可产生多条 RuleApplication。
    properties: {}

  runContainsStep:
    zh_name: 推理运行包含步骤
    group: governance_relations
    source_types: [InferenceRun]
    target_types: [ReasoningStep]
    direction: directed
    cardinality: one_to_many
    description: 推理运行记录包含某个原子推理步骤；一次 InferenceRun 可产生多条 ReasoningStep。
    properties: {}

  applicationConsumesSignal:
    zh_name: 规则应用消费信号
    group: governance_relations
    source_types: [RuleApplication]
    target_types: [Signal]
    direction: directed
    cardinality: many_to_many
    description: 规则应用记录消费了某信号；用于追溯信号在推理规则中的使用情况。
    properties: {}

  followupEmittedBy:
    zh_name: 后续信号由动作记录发出
    group: governance_relations
    source_types: [ActionFollowup]
    target_types: [ActionAudit]
    direction: directed
    cardinality: many_to_one
    description: ActionFollowup 必须能追溯到产生它的 ActionAudit。
    properties:
      eventRole:
        zh_name: 事件关系角色
        type: enum
        enum: [emitted_by, caused_by]
        required: true

  followupTriggersProposal:
    zh_name: 后续信号触发动作提案
    group: governance_relations
    source_types: [ActionFollowup]
    target_types: [ActionProposal]
    direction: directed
    cardinality: one_to_many
    description: ActionFollowup 触发后续可审核 ActionProposal；正式写回仍由 ActionProposal 和 ActionAudit 承接。
    properties:
      triggerReason:
        zh_name: 触发原因
        type: string
        required: true
