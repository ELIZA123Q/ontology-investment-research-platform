schema_name: objects_governance_logic
schema_version: 0.1.0
namespace: investment_ontology
status: draft
depends_on: ../common.yaml
canonical_rule: YAML 是正式机器约束；Markdown 只负责解释和示例。
description: 投研治理域对象类型定义——函数化能力、自动化流、对象视图、评测用例、评测运行和生产化指标。公共枚举和域映射见 common.yaml。
relation_direction_note: optional_relations 中的 sourceOf 表示该对象允许被 SourceDocument -> object 的来源关系追溯；不表示该对象作为 sourceOf 的 source。

# ============================================================
# 域四：治理域 — 函数化能力与生产化治理
# ============================================================

object_types:
  LogicFunction:
    zh_name: AI 逻辑函数
    category: source_and_record
    managed_by: system_or_researcher
    description: 可发布、可评测、可监控的函数化 AI 能力；由多个 LogicBlock 组成，读对象、证据和规则，输出结构化结果或 ActionProposal。
    lifecycle_field: functionStatus
    initial_state: draft
    terminal_states: [deprecated, superseded]
    fields:
      functionId:
        zh_name: 函数 ID
        type: string
        required: true
      functionVersion:
        zh_name: 函数版本
        type: string
        required: true
      functionStatus:
        zh_name: 函数状态
        type: enum
        enum_ref: functionStatus
        required: true
        default: draft
      orchestrationRole:
        zh_name: 编排角色
        type: enum
        enum_ref: orchestrationRole
        required: true
      executionScope:
        zh_name: 执行权限域
        type: enum
        enum_ref: executionScope
        required: true
      inputContract:
        zh_name: 输入契约
        type: object
        required: true
      outputContract:
        zh_name: 输出契约
        type: object
        required: true
      outputType:
        zh_name: 输出类型
        type: enum
        enum_ref: functionOutputType
        required: true
      blockRefs:
        zh_name: 逻辑块引用
        type: array
        required: true
      allowedActionTypes:
        zh_name: 可调用动作类型
        type: array
        required: false
      writePermission:
        zh_name: 写权限
        type: enum
        enum_ref: functionWritePermission
        required: true
      reviewPolicy:
        zh_name: 审核策略
        type: string
        required: true
    required_relations: []
    optional_relations: [sourceOf]
    quality_rules:
      - writePermission 不是 read_only 时必须声明 allowedActionTypes 和 reviewPolicy。
      - LogicFunction 的 blockRefs 必须能解析到同包 LogicBlock。

  LogicBlock:
    zh_name: 逻辑函数块
    category: source_and_record
    managed_by: system
    description: LogicFunction 内部的离散执行步骤；每个块只处理读取、检索、转换、模型交互、校验、提案或渲染中的一类任务。
    fields:
      blockId:
        zh_name: 块 ID
        type: string
        required: true
      functionId:
        zh_name: 所属函数 ID
        type: string
        required: true
      blockType:
        zh_name: 块类型
        type: enum
        enum_ref: logicBlockType
        required: true
      toolType:
        zh_name: 工具类型
        type: enum
        enum_ref: orchestrationToolType
        required: true
      inputRefs:
        zh_name: 输入引用
        type: array
        required: true
      outputRef:
        zh_name: 输出引用
        type: string
        required: true
      onFailure:
        zh_name: 失败处理
        type: enum
        enum_ref: blockFailureHandling
        required: true
    required_relations: []
    optional_relations: [sourceOf]

  ObjectViewSpec:
    zh_name: 对象视图规格
    category: source_and_record
    managed_by: system_or_researcher
    description: 围绕某类对象组织关键信息、关联对象、指标、证据、Action 和历史运行记录的应用入口规格。
    lifecycle_field: viewStatus
    initial_state: draft
    terminal_states: [deprecated]
    fields:
      viewName:
        zh_name: 视图名称
        type: string
        required: true
      targetObjectType:
        zh_name: 目标对象类型
        type: enum
        enum_ref: objectViewTargetType
        required: true
      viewStatus:
        zh_name: 视图状态
        type: enum
        enum_ref: objectViewStatus
        required: true
      primarySections:
        zh_name: 主区块
        type: array
        required: true
      relatedObjectTypes:
        zh_name: 关联对象类型
        type: array
        required: false
      keyMetricRefs:
        zh_name: 关键指标引用
        type: array
        required: false
      allowedActionTypes:
        zh_name: 可执行动作类型
        type: array
        required: false
      sampleObjectIds:
        zh_name: 样例对象 ID
        type: array
        required: false
    required_relations: []
    optional_relations: [sourceOf]
    quality_rules:
      - ObjectViewSpec 只定义对象中心入口，不复制对象实例。
      - allowedActionTypes 必须引用已定义 Action。

  AutomateFlow:
    zh_name: 自动化流
    category: source_and_record
    managed_by: system_or_researcher
    description: 对齐 Automate 类平台能力的版本化自动化资产；声明触发条件、调用的 LogicFunction 和允许生成的 ActionProposal，不内联执行编排。
    lifecycle_field: automateFlowStatus
    initial_state: draft
    terminal_states: [deprecated]
    fields:
      flowName:
        zh_name: 自动化流名称
        type: string
        required: true
      automateFlowStatus:
        zh_name: 自动化流状态
        type: enum
        enum: [draft, active, paused, deprecated]
        required: true
        default: draft
      triggerSourceType:
        zh_name: 触发来源类型
        type: enum
        enum: [Monitor, schedule, manual, external_event]
        required: true
      triggerRefs:
        zh_name: 触发来源引用
        type: array
        required: true
      conditionRefs:
        zh_name: 条件引用
        type: array
        required: false
        description: 引用 policy、quality gate、Monitor condition 或 scenario loading rule，不复制条件 DSL。
      targetFunctionId:
        zh_name: 目标函数 ID
        type: string
        required: true
        description: 指向 LogicFunction.functionId。
      targetActionTypes:
        zh_name: 目标动作类型
        type: array
        required: true
        description: 自动化流允许生成 ActionProposal 的 Action 类型列表。
      outputContract:
        zh_name: 输出契约
        type: object
        required: true
      failure_behavior:
        zh_name: 失败处理
        type: enum
        enum_ref: failureBehavior
        required: true
      reviewPolicy:
        zh_name: 审核策略
        type: string
        required: true
    required_relations: []
    optional_relations: [sourceOf]
    quality_rules:
      - AutomateFlow 只声明触发和调用，不内联 Function 步骤。
      - targetFunctionId 必须解析到 LogicFunction.functionId。
      - targetActionTypes 必须引用已定义 Action；写回必须产生 ActionProposal、ReviewRecord 或 ActionAudit。

  EvalCase:
    zh_name: 评测用例
    category: source_and_record
    managed_by: system_or_researcher
    description: 用于测试 LogicFunction、ActionProposal 生成或推理输出稳定性的单个输入和期望。
    lifecycle_field: evalCaseStatus
    initial_state: draft
    terminal_states: [archived]
    fields:
      evalCaseName:
        zh_name: 用例名称
        type: string
        required: true
      evalCaseStatus:
        zh_name: 用例状态
        type: enum
        enum_ref: evalCaseStatus
        required: true
      inputPayload:
        zh_name: 输入载荷
        type: object
        required: true
      expectedOutcome:
        zh_name: 期望结果
        type: object
        required: true
      scoringRubric:
        zh_name: 评分规则
        type: string
        required: true
      targetFunctionId:
        zh_name: 目标函数 ID
        type: string
        required: false
    required_relations: []
    optional_relations: [sourceOf]

  EvalSuite:
    zh_name: 评测集
    category: source_and_record
    managed_by: system_or_researcher
    description: 多个 EvalCase 的版本化集合，用于比较函数、提示词或模型变化。
    lifecycle_field: evalSuiteStatus
    initial_state: draft
    terminal_states: [archived]
    fields:
      evalSuiteName:
        zh_name: 评测集名称
        type: string
        required: true
      evalSuiteStatus:
        zh_name: 评测集状态
        type: enum
        enum_ref: evalSuiteStatus
        required: true
      evalCaseIds:
        zh_name: 用例 ID 列表
        type: array
        required: true
      targetFunctionId:
        zh_name: 目标函数 ID
        type: string
        required: false
        description: active EvalSuite 必须指向被评测的 LogicFunction.functionId。
      ownerRole:
        zh_name: 维护角色
        type: string
        required: true
    required_relations: []
    optional_relations: [sourceOf]

  EvalRun:
    zh_name: 评测运行
    category: source_and_record
    managed_by: system
    description: 一次评测集运行记录，记录目标函数、运行时、状态和结果。
    lifecycle_field: evalRunStatus
    initial_state: created
    terminal_states: [completed, failed]
    fields:
      evalSuiteId:
        zh_name: 评测集 ID
        type: object_ref
        required: true
      targetFunctionId:
        zh_name: 目标函数 ID
        type: string
        required: true
      runStatus:
        zh_name: 运行状态
        type: enum
        enum_ref: evalRunStatus
        required: true
      runAt:
        zh_name: 运行时间
        type: datetime
        time_type: system_time
        required: true
      modelOrRuntime:
        zh_name: 模型或运行时
        type: string
        required: true
      resultIds:
        zh_name: 结果 ID 列表
        type: array
        required: false
    required_relations: []
    optional_relations: [sourceOf]

  EvalResult:
    zh_name: 评测结果
    category: source_and_record
    managed_by: system
    description: 单个 EvalCase 在某次 EvalRun 中的评分结果和退化判断。
    fields:
      evalRunId:
        zh_name: 评测运行 ID
        type: object_ref
        required: true
      evalCaseId:
        zh_name: 评测用例 ID
        type: object_ref
        required: true
      resultStatus:
        zh_name: 结果状态
        type: enum
        enum_ref: evalResultStatus
        required: true
      score:
        zh_name: 得分
        type: number
        required: true
      passed:
        zh_name: 是否通过
        type: boolean
        required: true
      summary:
        zh_name: 结果摘要
        type: string
        required: true
    required_relations: []
    optional_relations: [sourceOf]

  MetricSnapshot:
    zh_name: 指标快照
    category: source_and_record
    managed_by: system
    description: 记录函数、Action、评测或推理运行的成功率、失败率、耗时、通过率等生产化指标。
    fields:
      metricName:
        zh_name: 指标名称
        type: string
        required: true
      metricStatus:
        zh_name: 指标状态
        type: enum
        enum_ref: metricStatus
        required: true
      metricWindow:
        zh_name: 指标窗口
        type: enum
        enum_ref: metricWindow
        required: true
      measuredAt:
        zh_name: 观测时间
        type: datetime
        time_type: system_time
        required: true
      value:
        zh_name: 指标值
        type: number
        required: true
      unit:
        zh_name: 单位
        type: string
        required: true
      subjectType:
        zh_name: 指标对象类型
        type: string
        required: true
      subjectId:
        zh_name: 指标对象 ID
        type: string
        required: true
    required_relations: []
    optional_relations: [sourceOf]
