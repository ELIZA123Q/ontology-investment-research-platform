schema_name: policies_governance
schema_version: 0.1.0
namespace: investment_ontology
status: draft
depends_on:
  objects_schema: objects_governance.yaml
  relations_schema: relations_governance.yaml
canonical_rule: YAML 是正式机器约束；Markdown 只负责解释和示例。
description: 投研本体治理层契约，定义检索策略、质量检查、未解析项、缺证项和人工复核队列的结构。本文件是推理 Skill 检索策略的权威机器可读来源；Markdown 中的遍历描述仅为辅助说明。

# ============================================================
# governance_minimum_loop — 最小治理闭环
# ============================================================
governance_minimum_loop:
  description: >
    治理域的最小闭环保证每一次写入、升级、复盘和发布前置判断都有可追溯路径；
    它不要求所有对象一次性进入正式本体包。
  canonical_flow:
    - step: candidate_capture
      inputs: [candidate_object, candidate_relation, candidate_evidence, candidate_judgment, candidate_rule]
      outputs: [staging_item, ActionProposal, PatchRequest]
    - step: admission_check
      inputs: [candidate_asset]
      outputs: [ReviewRecord]
    - step: review_decision
      decisions: [approve, supplementRequired, reject, quarantine]
      outputs: [ReviewRecord, review_queue_item]
    - step: write_or_stage
      outputs: [shared_asset, staging_asset]
    - step: audit
      outputs: [ActionAudit]
    - step: retrospect
      triggers: [time_window_end, run_partial_blocked_failed, review_due]
      outputs: [ReviewRecord]
    - step: patch_if_structural
      condition: ontology_gap_or_structuralGap
      outputs: [PatchRequest]
    - step: patch_ledger
      outputs: [PatchLedgerItem]
    - step: reuse_or_release
      outputs: [shared_reuse_assets, bundle_version]
  object_roles:
    ActionProposal: 写回前的可执行动作提案。
    ActionAudit: 写回后的动作审计。
    ReviewRecord: 审核、状态确认或复盘结论。
    PatchRequest: 结构性资产变更请求。
    PatchLedgerItem: 补丁处理账本。
  ai_agent_rule: AI Agent 不得直接改正式资产；需要写回时，应先生成 ActionProposal 或 PatchRequest，再由策略、审核或 owner 执行。

# ============================================================
# formal_asset_admission_policy — 正式资产准入最低凭证
# ============================================================
formal_asset_admission_policy:
  description: >
    本策略只定义 candidate/draft/review_pending 晋升为 active/confirmed 的最低凭证，
    不引入额外审批层。未满足最低凭证时，资产继续停留在 staging、review_queue、
    research_memory 或 PatchRequest 候选中。
  scope:
    formal_shared_dirs:
      - shared/semantic_objects
      - shared/semantic_relations
      - shared/reasoning_assets
      - shared/evidence_index
      - shared/reuse_assets
      - shared/concept_layer
  candidate_to_active_or_confirmed_requires:
    - evidence_trace: 具备 evidenceRefs、source refs、caseSignature 或明确说明的人工来源链路。
    - counter_evidence_or_gap: 已记录反证检查、冲突状态，或明确声明仍存在的证据缺口。
    - admission_review: 具备 ReviewRecord(reviewType=admission) 或 owner 明确确认的等价审核记录。
    - write_audit: 正式 shared 写入或结构性变更必须产生 ActionAudit、PatchRequest 或 PatchLedgerItem 之一。
  forbidden_shortcuts:
    - ai_derived_direct_to_active
    - single_unreviewed_judgment_to_formal_rule
    - personal_method_revision_direct_to_patch_request
    - source_summary_without_locator_to_confirmed_fact
  minimalism_rule: 不为每类资产新增独立审批流；优先复用 ReviewRecord、ActionAudit、PatchRequest 和 PatchLedgerItem。

# ============================================================
# layered_reading_policy — 分层读取规则
# ============================================================
layered_reading_policy:
  description: 不同类型 Skill 按任务目标加载治理域内容，避免把工程交付契约作为所有任务的默认上下文。
  default_for_consumer_skills:
    load: [governance_minimum_loop, asset_consumption_gate, review_queue, action_proposal_policy, retrospect_trigger_policy]
    defer_until_needed: [bundle_directory_contract, release_package_slimming_contract, bundle_registry, evaluation_policy, metrics_policy]
  task_profiles:
    judgment_record_capture:
      default_read: [team_workspace_governance_gate, ReviewRecord, Monitor, retrospect_trigger_policy]
      read_when_needed: [bundle_release_contract, cross_bundle_governance, metrics_policy]
    event_impact_analysis:
      default_read: [ActionProposal, InferenceRun, RuleApplication, asset_consumption_gate]
      read_when_needed: [ontology_feedback_aggregation_gate, PatchLedgerItem]
    evidence_normalization_and_patch:
      default_read: [PatchRequest, review_queue, unresolved_items, quality_gates]
      read_when_needed: [logic_function_policy, action_side_effect_governance]
    ontology_optimization:
      default_read: [PatchRequest, PatchLedgerItem, ReviewRecord, reuse_asset_policy]
      read_when_needed: [team_workspace_governance_gate]
    bundle_release:
      default_read: [manifest, schema, shared, scenario_packs, runtime_contracts, registry, validation_scripts]
      read_when_needed: [bundle_workbench_contract, team_workspace_governance_gate]
    production_evaluation:
      default_read: [logic_function_policy, evaluation_policy, metrics_policy]
      read_when_needed: [team_workspace_governance_gate, scenario_pack_binding]
  rule: 只有任务涉及发布、校验、跨包引用或工程生成时，才加载完整工程契约。

# ============================================================
# asset_consumption_gate — Skill 使用资产前的消费门禁
# ============================================================
asset_consumption_gate:
  description: 消费门禁不决定资产是否入库，而决定当前任务是否可以使用该资产、以什么置信度使用、是否需要降级或阻断。
  checks:
    - check_id: status_available
      pass_condition: 资产处于 active、approved、published 或当前任务允许读取的状态。
      on_failure: downgrade_to_reference_or_block_formal_output
    - check_id: permission_available
      pass_condition: 当前用户、任务和输出场景满足 markings、license_scope 与 information_barrier 要求。
      on_failure: hide_redact_block_or_enqueue_compliance_review
    - check_id: as_of_available
      pass_condition: 回放、复盘或历史验证只使用 asOfTime 当时可见信息。
      on_failure: invalid_replay_or_reload_as_of
    - check_id: version_available
      pass_condition: bundle、schema、规则和引用版本兼容。
      on_failure: compatibility_review_or_block
    - check_id: scenario_match
      pass_condition: 资产适用于当前行业、主题、对象或场景。
      on_failure: lower_weight_or_skip_loading
    - check_id: evidence_freshness
      pass_condition: 证据业务时间、有效期和采集时间满足任务要求。
      on_failure: lower_confidence_request_evidence_or_block_upgrade
    - check_id: judgment_status
      pass_condition: 判断状态满足当前输出层级要求。
      on_failure: candidate_reference_only_no_formal_asset_impact
    - check_id: rule_status
      pass_condition: 规则、模板或情景路径已审核，或当前任务显式允许试运行。
      on_failure: candidate_analysis_only

# ============================================================
# skill_consumption_runtime_policy — 消费型 Skill 标准运行链路
# ============================================================
skill_consumption_runtime_policy:
  description: >
    定义消费型 Skill 如何从用户输入出发，按最小必要上下文读取 bundle，
    经过门禁和规则后输出候选判断、观察结论、补证任务或回流反馈。
  domain_dependencies:
    semantic_domain: 识别对象、边界、关系、ObjectSet 和正式语义锚点。
    reasoning_domain: 使用状态变量、状态假设、信号、判断、市场预期、预期差、资产影响候选、规则和情景路径。
    evidence_domain: 使用来源、主张、事实候选、业务时间、新鲜度、冲突状态和权限标记。
    governance_domain: 使用准入门禁、消费门禁、ReviewRecord、ActionProposal、PatchRequest、审计和复盘规则。
    engineering_delivery: 使用 bundle_summary、capability_index、scenario_pack、loading_rules、registry 和目录路径。
  canonical_flow:
    - step: receive_user_input
      inputs: [question, event, researcher_judgment]
      outputs: [task_intent]
    - step: select_entry_capability
      examples: [CaptureJudgment, AnalyzeEventImpact, RunCounterCheck, EvaluateMarketExpectationGap]
      outputs: [capability_id]
    - step: read_navigation_indexes
      required_refs: [bundle_summary.yaml, capability_index.yaml]
      outputs: [candidate_scenario_model, required_refs]
    - step: choose_scenario_or_pack
      inputs: [ScenarioModel, scenario_pack]
      outputs: [loading_plan]
    - step: load_minimum_refs
      required_refs: [loading_rules.yaml]
      outputs: [minimal_context]
    - step: run_deterministic_gates
      gates: [object_gate, relation_gate, evidence_gate, counter_gate, expectation_gate, permission_gate, as_of_gate, version_gate]
      outputs: [gate_result]
    - step: invoke_logic
      inputs: [LogicFunction, InferenceRule, ConductionTemplate]
      outputs: [InferenceRun, RuleApplication]
    - step: generate_outputs
      allowed_outputs: [JudgmentOutput_candidate, observation, expectation_gap, AssetImpact_candidate, evidence_task, ActionProposal]
    - step: write_runtime_tracking
      condition: user_explicitly_requests_tracking_or_retrospect
      required_outputs: [JudgmentRecord, judgment_record_ledger]
      destination: team_workspaces/<workspace_id>/judgments/
      ordinary_question_persistence: forbidden
    - step: feedback_structural_gap
      condition: structural_gap_detected
      outputs: [ontology_feedback, candidate_patch_request]
    - step: retrospect
      trigger: review_due_or_time_window_end
      outputs: [ReviewRecord]
  write_boundary: 消费型 Skill 只能生成运行时视图、候选判断、动作提案、补证任务和候选回流；正式写入必须由治理动作承接。

# ============================================================
# skill_consumption_boundary_policy — 消费型 Skill 越界限制
# ============================================================
skill_consumption_boundary_policy:
  forbidden_direct_actions:
    - modify_formal_bundle
    - write_candidate_object_to_shared
    - promote_single_judgment_record_to_formal_rule
    - convert_single_failed_retrospect_to_formal_patch_request
    - generate_trade_execution_advice
  allowed_gap_outputs:
    - ontology_feedback
    - candidate_patch_request
    - evidence_task
    - ReviewRecord
    - ActionProposal
  formal_change_rule: 正式对象、关系、规则、模板和 bundle 版本变更必须经过治理与工程规范承接。

# ============================================================
# clarification_escalation_policy — 追问用户的限制
# ============================================================
clarification_escalation_policy:
  rule: >
    只有当缺失信息会导致入口能力无法选择、研究对象无法定位或输出边界无法判断时，
    才向用户追问；其他缺口优先通过降级、补证任务、ontology_feedback 或 ActionProposal 承接。
  cases:
    - condition: missing_required_object
      preferred_handling: downgrade_with_candidate_object_and_record_gap
    - condition: missing_evidence
      preferred_handling: observation_only_and_create_evidence_task
    - condition: missing_market_expectation
      preferred_handling: no_high_confidence_asset_impact_and_mark_expectation_pending
    - condition: user_question_cannot_be_routed
      preferred_handling: ask_user_for_clarification
    - condition: permission_or_output_boundary_unclear
      preferred_handling: block_or_enqueue_manual_review

# ============================================================
# consumption_failure_feedback_policy — 消费失败回流规则
# ============================================================
consumption_failure_feedback_policy:
  description: 消费失败不等于直接改库；消费型 Skill 只定位缺口、说明降级原因、保留来源链路并提交候选反馈。
  failure_types:
    - failure_type: missing_object_or_unresolved_target
      consumer_handling: downgrade_to_candidate_object_or_concept_anchor
      feedback_outputs: [ontology_feedback.unresolved_object, unresolved_item, candidate_patch_request]
    - failure_type: missing_state_variable
      consumer_handling: observation_only_no_synthetic_observation
      feedback_outputs: [ontology_feedback.missing_state_variable, candidate_patch_request]
    - failure_type: missing_relation_or_chain
      consumer_handling: keep_partial_chain_and_gap_position_no_formal_relation_write
      feedback_outputs: [ontology_feedback.missing_relation, ActionProposal, candidate_patch_request]
    - failure_type: insufficient_rule_template_or_scenario_path
      consumer_handling: downgrade_to_manual_analysis_note
      feedback_outputs: [ReviewRecord, candidate_patch_request]
    - failure_type: stale_missing_or_conflicted_evidence
      consumer_handling: lower_confidence_block_upgrade_or_create_evidence_task
      feedback_outputs: [evidence_task, conflict_review, ReviewRecord]
    - failure_type: missing_or_incomparable_market_expectation
      consumer_handling: no_high_confidence_asset_impact
      feedback_outputs: [expectation_evidence_task, observation]
    - failure_type: permission_as_of_or_version_unavailable
      consumer_handling: block_redact_reload_as_of_or_enqueue_review
      feedback_outputs: [compliance_review, version_compatibility_review, ActionAudit]
    - failure_type: repeated_retrospect_gap
      consumer_handling: aggregate_case_memory_before_patch
      feedback_outputs: [bias_log, case_memory, PatchRequest]

# ============================================================
# retrieval_policy — 推理 Skill 的机器可读检索契约
# ============================================================
# 目的：让推理 Skill 不再只依赖 Markdown 散文描述遍历规则，
# 而是读取本段结构化配置，按统一策略执行、评测和版本对比。
# 缺失 retrieval_policy 时，推理 Skill 使用自身的默认遍历规则。

retrieval_policy:
  description: 定义推理 Skill 如何从用户问题出发，沿图结构检索、遍历、验证和生成结论。

  # —— 图入口：用户问题先映射到哪些对象类型 ——
  entry_points:
    description: 推理 Skill 解析用户问题后，优先匹配的对象类型和匹配优先级。
    type: array
    items:
      type: object
      properties:
        object_type:
          type: enum
          enum_ref: all_object_types
          description: 可作为检索入口的对象类型。
        match_priority:
          type: integer
          description: 匹配优先级，1 最高。
        match_strategy:
          type: enum
          enum: [exact_name, alias_match, concept_map, keyword_vector, composite]
          description: 如何从用户输入匹配到该类型的实例。
        required_context:
          type: array
          description: 使用该入口前必须确认的上下文（如 industry、company）。
    cardinality: 1..*

  # —— 图遍历顺序：从入口对象沿哪些关系逐步展开 ——
  traversal_order:
    description: 有序的遍历阶段列表。每个阶段定义从当前对象类型沿哪些关系跳转到下一层对象。
    type: array
    items:
      type: object
      properties:
        stage:
          type: integer
          description: 遍历阶段序号，从 1 开始。
        name:
          type: string
          description: 阶段名称，如 event_to_prototype。
        from_types:
          type: array
          items: string
          description: 当前阶段起点的对象类型。
        via_relations:
          type: array
          items: string
          description: 从起点出发使用的关系类型。
        to_types:
          type: array
          items: string
          description: 遍历到达的目标对象类型。
        required:
          type: boolean
          description: 是否必须成功遍历到此阶段才能继续。
        on_failure:
          type: enum
          enum: [skip_and_continue, abort_with_gap, use_fallback, observation_only]
          description: 此阶段遍历失败时的处理方式。
    cardinality: 1..*

  # —— 必查项：推理链路中必须检查的信号、反证和状态 ——
  required_checks:
    description: 在推理链路的每个关键节点，必须执行的结构化检查。
    type: array
    items:
      type: object
      properties:
        check_id:
          type: string
          description: 检查项唯一标识。
        check_type:
          type: enum
          enum: [signal_check, counter_check, market_expectation_check, expectation_gap_check, time_horizon_check, catalyst_check, evidence_freshness_check, boundary_check, retrospect_feedback_check]
          description: 检查类型。
        at_stage:
          type: integer
          description: 在哪个遍历阶段执行此检查。
        target_relation:
          type: string
          description: 检查时需要检索的关系类型。
        required_for_conclusion:
          type: boolean
          description: 此项检查通过是否作为得出结论的必要条件。
        on_missing:
          type: enum
          enum: [block_conclusion, lower_confidence, record_gap, observation_only]
          description: 检查未通过时的处理方式。

  # —— 来源权威分级 ——
  source_authority_ranking:
    description: 证据来源的可信度分层。推理 Skill 在选取 evidence claim 时应优先使用高权威来源。
    type: object
    properties:
      high:
        description: 可独立作为事实依据的来源。
        source_types: [company_announcement, financial_report, regulator_document, exchange_filing, court_document]
      medium:
        description: 需要交叉验证才可作为事实依据的来源。
        source_types: [sell_side_report, industry_database, credit_rating_report, consulting_report, academic_paper]
      low:
        description: 仅作为线索或参考，不得单独作为事实依据的来源。
        source_types: [media_news, social_content, ai_summary, forum_post, unverified_leak]

  # —— 时效策略：不同类型数据的新鲜度要求 ——
  freshness_policy:
    description: 推理 Skill 在选取 evidence 时应考虑的时效约束。
    type: object
    properties:
      high_freshness:
        description: 必须在推理 business_time 附近（如 7 天内）的数据。
        applies_to: [market_price_signal, trading_volume, order_announcement, earnings_release, policy_change]
      medium_freshness:
        description: 应在一定时间窗口内（如 90 天）的数据。
        applies_to: [industry_data_update, company_guidance, sell_side_estimate, macro_indicator]
      low_freshness:
        description: 相对稳定，不要求高频更新的数据。
        applies_to: [industry_structure, product_specification, technology_roadmap, company_profile, regulation_framework]

  # —— 降级策略：检索失败或信息不足时的处理 ——
  fallback_policy:
    description: 当检索策略无法完整执行时的降级规则。
    type: array
    items:
      type: object
      properties:
        condition:
          type: string
          description: 触发降级的条件。
        action:
          type: enum
          enum: [observation_only, partial_chain_with_gaps, concept_level_only, abort_with_feedback, ask_user_for_clarification]
          description: 降级后的处理方式。
        max_confidence:
          type: enum
          enum: [low]
          description: 降级模式下的最大置信度。

  # —— 阻断规则：触发时抑制或限制推理结论 ——
  blocking_rules:
    description: 在某些条件下推理结论必须被抑制或降级。
    type: array
    items:
      type: object
      properties:
        rule_id:
          type: string
          description: 阻断规则唯一标识。
        condition:
          type: string
          description: 触发阻断的条件表达式。
        effect:
          type: enum
          enum: [suppress_conclusion, observation_only, require_manual_review, lower_confidence_to_low, block_asset_impact]
          description: 阻断后的效果。

  # —— 产物策略：运行产物与生产产物分区落盘 ——
  runtime_artifact_policy:
    description: 推理运行和当次证据快照写入 team workspace；搜索生产、评测和补丁报告写入 bundle workbench。
    type: object
    properties:
      reasoning_runs_path:
        type: string
        default: team_workspaces/<workspace_id>/runs/
        description: 推理运行日志落盘路径。
      search_logs_path:
        type: string
        default: bundle_workbenches/<bundle_id>/sources/
        description: 框架生产与证据归一的检索日志落盘路径。
      evaluation_runs_path:
        type: string
        default: bundle_workbenches/<bundle_id>/production_reports/
        description: 生产与框架评测结果落盘路径。
      action_audits_path:
        type: string
        default: bundle_workbenches/<bundle_id>/production_reports/action_audits/
        description: 高频 ActionAudit 明细落盘路径。
      runtime_evidence_snapshots_path:
        type: string
        default: team_workspaces/<workspace_id>/runtime_evidence_snapshots/
        description: 当次推理证据快照；不得写入正式 bundle。
      retention_policy:
        type: object
        description: 产物保留策略。
        properties:
          reasoning_runs_days:
            type: integer
            default: 90
            description: 推理运行日志保留天数。
          search_logs_days:
            type: integer
            default: 30
            description: 检索日志保留天数。
          evaluation_runs_days:
            type: integer
            default: 180
            description: 评测结果保留天数。
      forbidden_locations:
        type: array
        description: 不得写入运行产物的模块路径。
        items:
          type: string
        default: [objects.yaml, relations.yaml, state_variables.yaml, observations.yaml, hypotheses.yaml, signals.yaml, judgments.yaml, asset_impacts.yaml, source_documents.yaml, evidence_claims.yaml, evidence_facts.yaml, governance.yaml]

# ============================================================
# action_proposal_policy — 人和 AI 共同写回的提案契约
# ============================================================
action_proposal_policy:
  description: >
    ActionProposal 是人或 AI Agent 提交业务事务的统一入口。所有修改对象、
    关系、证据、推理状态或治理状态的写回，都必须引用已定义 Action，
    并按风险进入自动执行、研究员确认或审核队列。
  required_fields: [proposedActionType, proposalStatus, riskLevel, reviewRequirement, executionScope, writebackMode, inputPayload, proposalReason]
  risk_routing:
    low:
      allowed_review_requirements: [none, researcher_confirm]
      allowed_writeback_modes: [proposal_only, staged_review, approved_action, direct_writeback]
    medium:
      allowed_review_requirements: [researcher_confirm, reviewer_confirm]
      allowed_writeback_modes: [proposal_only, staged_review, approved_action]
    high:
      allowed_review_requirements: [reviewer_confirm, owner_confirm]
      allowed_writeback_modes: [proposal_only, staged_review, approved_action]
    core_change_required:
      allowed_review_requirements: [owner_confirm]
      allowed_writeback_modes: [proposal_only, staged_review]
  execution_rules:
    - proposedActionType 必须存在于 actions_*.yaml。
    - proposalStatus=executed 必须有 ActionAudit.auditFor 指向该 ActionProposal。
    - high 和 core_change_required 风险必须有 ReviewRecord.reviewFor。
    - direct_writeback 只允许 riskLevel=low 且 reviewRequirement=none 或 researcher_confirm。
    - 执行前必须重新检查 markings、owner_bundle_id、targetIds、as-of 和 Action preconditions。
  failure_destinations: [review_queue, supplementRequired, failed, block_next_action]

# ============================================================
# action_patch_boundary — 动作提案与补丁请求边界
# ============================================================
action_patch_boundary:
  description: ActionProposal 与 PatchRequest 都是候选变更入口，但解决的问题不同，不能互相替代。
  ActionProposal:
    solves: 一次具体动作是否可以执行。
    focus: can_execute
    examples: [CreateOntologyObject, ActivateSignal, UpgradeJudgmentToActive]
    required_followup: proposalStatus=executed 时必须有 ActionAudit。
  PatchRequest:
    solves: 正式资产结构是否需要变更。
    focus: should_change_ontology_or_bundle
    examples: [merge_duplicate_company_object, revise_inference_rule, add_state_variable]
    required_followup: accepted_or_rejected 时必须追加 PatchLedgerItem 或 ReviewRecord。
  PatchLedgerItem:
    solves: 补丁最终怎么处理。
    focus: patch_outcome_accounting
    examples: [merged, rejected, deferred, failed, rollback, migrated]
  rules:
    - ActionProposal 可关联 PatchRequest，但不能代表结构性补丁已被接受。
    - PatchRequest 可要求后续 ActionProposal 执行具体动作，但不能绕过动作审计。
    - core_change_required 的 ActionProposal 应优先转为 PatchRequest 或进入 owner review。

# ============================================================
# review_record_semantics — ReviewRecord 语义分层
# ============================================================
review_record_semantics:
  description: ReviewRecord 是统一记录对象，reviewType 决定它是准入、证据、冲突、状态、复盘、补丁还是合规裁决。
  review_types:
    admission_review:
      purpose: 准入审核。
      targets: [Object, Relation, InferenceRule, ConductionTemplate, ScenarioPath]
    evidence_review:
      purpose: 证据审核。
      targets: [SourceDocument, EvidenceClaim, EvidenceFact]
    conflict_review:
      purpose: 冲突裁决。
      targets: [Concept, Relation, EvidenceClaim, EvidenceFact, StateVariable]
    status_review:
      purpose: 状态升级或降级确认。
      targets: [Signal, StateHypothesis, JudgmentOutput, InvestmentThesis]
    retrospect:
      purpose: 判断、资产影响、命题或推理运行复盘。
      targets: [JudgmentOutput, AssetImpact, InvestmentThesis, InferenceRun]
    patch_review:
      purpose: 补丁审核。
      targets: [PatchRequest, PatchLedgerItem]
    compliance_review:
      purpose: 权限、信息墙、许可范围和 markings 裁决。
      targets: [SourceDocument, EvidenceClaim, EvidenceFact, DerivedMetric, JudgmentOutput, AssetImpact]
  compatibility_aliases:
    admission: admission_review
    state_upgrade: status_review
    signal_status_update: status_review
    boundary_review: conflict_review
    barrier_review: compliance_review
    marking_downgrade: compliance_review
  rule: 消费端不得只看 ReviewRecord.reviewResult；必须结合 reviewType、reviewFor 目标和业务时点解释。

# ============================================================
# object_view_policy — 对象中心应用入口契约
# ============================================================
object_view_policy:
  description: ObjectViewSpec 定义研究员围绕一个真实业务对象查看状态、证据、指标、历史和可执行动作的中心入口。
  required_sections: [identity, current_state, related_objects, evidence, signals, actions, history]
  target_object_types: [Industry, Segment, Company, Product, Material, Asset, StateVariable, JudgmentOutput, ScenarioPath, ObjectSet]
  view_taxonomy:
    ObjectSet:
      role: object_collection
      source_domain: 语义结构域
      description: 可复用对象集合或规则型成员集合，为批量加载、监控订阅和场景入口提供对象范围。
      owns: [membership_rule, explicit_members, refresh_policy]
      does_not_own: [display_layout, judgment_lifecycle, copied_object_fields]
    ObjectViewSpec:
      role: object_centered_view_spec
      source_domain: 治理域
      description: 围绕一个目标对象或 ObjectSet 的展示规格、字段引用、动作入口和加载规则。
      owns: [view_sections, field_refs, allowed_actions, loading_rules]
      does_not_own: [formal_object_values, independent_judgment_truth]
  hierarchy_rule: >
    ObjectSet 定义对象范围，ObjectViewSpec 定义正式可复用的视图规格；团队判断的展示与流程状态由外部
    JudgmentRecord 承载，不新增本体对象类型，也不得把工作区视图实例写入正式 bundle。
  validation_rules:
    - targetObjectType 必须是 objectViewTargetType 中的值。
    - allowedActionTypes 必须引用已定义 Action。
    - sampleObjectIds 如存在，必须能解析到同类型对象。
    - 视图不得复制完整对象，只保存展示规格、字段引用和加载规则。

# ============================================================
# team_workspace_governance_gate — 团队工作区晋升门禁
# ============================================================
team_workspace_governance_gate:
  description: team workspace 是团队判断与运行状态工作区，不是 shared 正式资产区。
  default_status: workspace_context
  default_runtime_loading: forbidden
  allowed_uses: [candidate_production, explicit_thesis_validation, judgment_tracking, retrospect_analysis, bias_logging, audit_trace]
  forbidden_uses:
    - audited_fact_source
    - formal_rule_source
    - formal_judgment_source
    - direct_asset_impact_basis
  promotion_requirements:
    - ReviewRecord.reviewFor 指向原 JudgmentOutput、AssetImpact 或 JudgmentRecord 引用的正式对象。
    - reviewType=retrospect 或 admission_review。
    - 晋升为 InferenceRule、ConductionTemplate、ScenarioPath 或 reusable_review_findings 前，必须满足 ontology_feedback_aggregation_gate 或明确 owner approval。
    - 进入 shared/ 或 shared/reuse_assets/ 前必须生成 ActionAudit 或 PatchLedgerItem。
  rule: 普通推理不得读取 team workspace；只有明确的跟踪或复盘任务可读取指定 JudgmentRecord，且不得把它当作已审核事实、正式规则或正式判断。

# ============================================================
# logic_function_policy — 函数化 AI 能力契约
# ============================================================
logic_function_policy:
  description: LogicFunction 把 AI 能力发布为可调用、可评测、可监控的函数；复杂流程拆成 LogicBlock。
  context_minimization:
    - 每个 LogicBlock 只读取当前步骤必要字段。
    - 函数运行必须记录 loaded_assets 或等价字段。
    - deterministic_check、transform、apply_action 等确定性 block 应优先于 LLM 交互。
  writeback_rules:
    - writePermission=read_only 时不得输出 ActionProposal。
    - writePermission=propose_action 时只能创建 ActionProposal。
    - writePermission=execute_approved_action 时只能执行 proposalStatus=approved 的 ActionProposal。
  version_rules:
    - functionVersion 变化必须可追溯。
    - 发布为 active 前必须至少绑定一个 EvalSuite。

productionization_scope_policy:
  description: 函数化能力、自动化流和评测指标属于生产化治理能力，不是最小判断流闭环的必需对象。
  initial_priority_objects: [ActionProposal, ReviewRecord, InferenceRun, PatchRequest]
  production_objects: [LogicFunction, LogicBlock, AutomateFlow, EvalCase, EvalSuite, EvalRun, EvalResult, MetricSnapshot]
  rules:
    - MVP 阶段可以只保留 production_objects 的对象定义和发布约束。
    - 没有生产化发布需求时，不要求每次判断流都创建 LogicFunction、AutomateFlow、EvalSuite 或 MetricSnapshot。
    - 一旦 production_objects 出现实例，必须通过 evaluation_policy、metrics_policy 和 logic_function_policy 的引用校验。

# ============================================================
# evaluation_policy — 函数、提案和推理输出评测契约
# ============================================================
evaluation_policy:
  description: EvalCase、EvalSuite、EvalRun 和 EvalResult 用于比较函数、提示词、模型或规则变化，避免只靠主观试用。
  minimum_suite_requirements:
    - 每个 active EvalSuite 至少包含一个 EvalCase。
    - EvalCase 必须有 inputPayload、expectedOutcome 和 scoringRubric。
    - EvalRun 必须指向 EvalSuite 和 targetFunctionId。
    - EvalResult 必须指向 EvalRun 和 EvalCase，并记录 score、passed 和 summary。
  required_scenarios:
    - 正常完整链路。
    - 缺证据降级。
    - 反证阻断。
    - 高风险 ActionProposal 进入审核。
    - markings 或 as-of 过滤。

# ============================================================
# metrics_policy — 生产化运行指标契约
# ============================================================
metrics_policy:
  description: MetricSnapshot 记录函数、Action、评测或推理运行的生产指标，支持监控、调试和回滚判断。
  recommended_metrics:
    - function_success_rate
    - function_failure_rate
    - action_proposal_approval_rate
    - blocked_or_partial_run_rate
    - p95_latency_ms
    - eval_pass_rate
    - review_backlog_count
  calibration_metrics:
    description: 对 InferenceRule、ConductionTemplate 和 ScenarioPath 长期累计的预测校准指标。
    subject_types: [InferenceRule, ConductionTemplate, ScenarioPath]
    metric_names:
      - hit_rate
      - brier_score
      - calibration_error
      - false_positive_rate
      - avg_lag_error
      - coverage_rate
    consumed_by: common.public_contracts.confidence_composition.modifiers.historical_calibration_weight
  retrospect_to_metric_flow:
    trigger: ReviewRecord.reviewType=retrospect
    outputs: [MetricSnapshot]
    rules:
      - 复盘结论结算后，应为被消费的 InferenceRule、ConductionTemplate 或 ScenarioPath 追加 MetricSnapshot。
      - MetricSnapshot.subjectType 必须是被校准对象类型，subjectId 必须指向被校准对象。
      - 后续推理运行读取校准指标时，应在 RuleApplication.historicalCalibrationWeight 中记录权重。
  validation_rules:
    - MetricSnapshot.value 必须是数字。
    - metricWindow 必须声明统计窗口。
    - subjectType 和 subjectId 必须能定位指标对象或运行目标。
    - calibration_metrics.metric_names 中的指标只能绑定 InferenceRule、ConductionTemplate 或 ScenarioPath。

# ============================================================
# orchestration_policy — LLM 编排与确定性门禁边界
# ============================================================
orchestration_policy:
  description: >
    LLM 是运行时编排器，负责路由问题、选择加载路径、归纳上下文、
    生成解释或 ActionProposal；Ontology、Policy、Gate、Action 和 Audit
    是状态、权限、事实和写回的权威约束。
  llm_allowed_decisions:
    - 选择适用的 ScenarioModel 或 scenario_pack。
    - 选择本步骤需要读取的对象、关系、证据、规则和字段。
    - 生成自然语言解释、问题拆解、候选链路或 ActionProposal 草案。
    - 在证据不足时选择降级路径并记录 gap。
  llm_forbidden_decisions:
    - 直接把候选对象、关系、证据、判断或资产影响写入 shared 正式资产。
    - 绕过 layer_gates、required_checks、markings、as-of 或 review_queue。
    - 在缺少市场预期、反证或催化剂校验时输出完整资产影响判断。
    - 以自然语言关系替代显式 Relation、Policy、InferenceRule 或 ScenarioModel。
  deterministic_required_for:
    - evidence_validity
    - counter_evidence
    - signal_strength
    - market_expectation
    - expectation_gap
    - catalyst
    - asset_impact
    - writeback_permission
  failure_handling:
    deterministic_check_failed: [block_with_gap, lower_confidence, observation_only, enqueue_review]
    llm_boundary_violation: [block_next_action, enqueue_review]
    missing_context: [partial_chain_with_gaps, ask_user_for_clarification]

# ============================================================
# scenario_model_policy — 场景模型准入与运行契约
# ============================================================
scenario_model_policy:
  description: ScenarioModel 是场景路由资产，定义某类投研问题进入后如何选入口、加载上下文、执行确定性门禁、检查规则并调用 LogicFunction；解释、渲染和 ActionProposal 草案生成由 LogicFunction/LogicBlock 承担。
  required_fields: [name, scenarioModelType, entryObjectTypes, orchestrationSteps, deterministicChecks, fallbackPolicy, outputContracts, reviewPolicy]
  required_step_types:
    - llm_route
    - graph_query
    - evidence_lookup
    - deterministic_check
  recommended_step_types:
    - rule_check
    - invoke_function
  validation_rules:
    - orchestrationSteps 至少包含一个 deterministic_check 或 rule_check。
    - deterministic_check 必须引用 policyRefs。
    - rule_check 必须引用 ruleRefs 或 policyRefs。
    - invoke_function 步骤必须使用 toolType=logic_function，并引用可解析 LogicFunction.functionId。
    - active ScenarioModel 不得内联 llm_reasoning、action_proposal 或 report_render 步骤。
    - llm_route 步骤必须声明 llmDecisionBoundary，且不得为 forbidden 以外的写回权限。
    - outputContracts 如包含 AssetImpact，必须同时包含 market_expectation_check、expectation_gap_check 和 counter_check。
    - allowedActionTypes 必须引用已定义 Action。
  scenario_pack_binding:
    - loading_rules.yaml 应声明 scenario_model_ref 或内联 orchestration_steps。
    - scenario_model_ref 指向本 bundle 或可解析 external_ref 中的 ScenarioModel。
    - scenario_pack 局部 orchestration_steps 只能收窄或实例化 ScenarioModel，不得绕过其 deterministicChecks；复杂执行步骤应调用 LogicFunction。

# ============================================================
# variable_registry — StateVariable 去重注册表
# ============================================================
# v1.2 新增。配合 objects.yaml 中 StateVariable.normalizedKey 字段和
# variable_dedup_rules，定义跨 agent、跨轮次的 StateVariable 去重和归并策略。

variable_registry:
  description: >
    StateVariable 去重注册表模式。当多个 agent 或多次运行创建语义相同的
    StateVariable 时，通过变量注册表统一识别和归并，防止传导链断裂。

  dedup_rules:
    - rule_id: VR_DEDUP_1
      priority: 1
      zh_name: normalizedKey 精确匹配
      description: normalizedKey 完全相同的 StateVariable 视为重复，自动归并到最早创建的实例。
      action: merge_to_earliest_id
      auto_execute: true

    - rule_id: VR_DEDUP_2
      priority: 2
      zh_name: 名称+类别+范围匹配
      description: name 相似（编辑距离 < 3）且 category 和 observedOn scope 目标相同。
      action: flag_for_review
      auto_execute: false

    - rule_id: VR_DEDUP_3
      priority: 3
      zh_name: 观测对象+类别匹配
      description: observedOn 指向同一目标对象且 category 相同，但 name 差异较大。
      action: flag_for_review
      auto_execute: false

  normalized_key_pattern:
    format: "{category}_{name}_{scope}_NORMALIZED"
    example: "profitability_gross_margin_semiconductor_NORMALIZED"
    generation_rule: >
      category 使用 state_variable_categories 的英文 key（小写下划线）；
      name 使用 StateVariable.name 的小写下划线形式（英文或拼音）；
      scope 使用 variableScope 或 observedOn 的主要对象类型。

  merge_strategies:
    - strategy: keep_earliest
      description: 保留最早创建的 StateVariable，将后续重复实例的观测和关系迁移到最早实例。
    - strategy: keep_highest_layer
      description: 保留正式资产治理层最高的（ontology_core > industry_extension）；team workspace 记录不参与正式对象去重或归并。

  conflict_resolution:
    description: 当两个归并策略产生不同结果时，进入 governance review_queue。
    review_type: conflict_review
    escalation_rule: 归并冲突超过 14 天未解决时，自动升级并通知行业负责人。

# ============================================================
# unresolved_items — governance.yaml 的未解析项契约
# ============================================================
unresolved_items:
  description: 本体内所有暂未决策、未映射、未完成的内容集中管理于此。
  categories:
    - name: unmapped_concepts
      description: scopeStatus=in_scope 但没有 conceptMapsToObject 映射的 Concept。
    - name: unresolved_boundaries
      description: 暂无法裁定的概念边界（原 defer 状态）。
    - name: dangling_relations
      description: 关系端点无法解析到 objects.yaml 中已存在实例的关系。
    - name: missing_evidence
      description: 对象或关系缺少可追溯来源的证据引用。
    - name: orphan_claims
      description: 无法追溯到 EvidenceEpisode 或 SourceDocument 的 EvidenceClaim。
    - name: conflicting_claims
      description: 多个 EvidenceClaim 对同一事实给出矛盾主张。
    - name: stale_signals
      description: 已过期但仍被引用的 Signal。
    - name: invalid_rule_reference
      description: 引用了 deprecated 或不存在的 InferenceRule。
    - name: unresolved_patch
      description: 长期未处理的 PatchRequest。

# ============================================================
# review_queue — 人工复核队列契约
# ============================================================
review_queue:
  description: 需要人工审核确认的待处理项。
  item_types:
    - type: admission_review
      description: 新候选对象、关系或证据是否可正式入库。
    - type: state_upgrade_review
      description: Hypothesis/JudgmentOutput/InvestmentThesis 状态升级是否合理。
    - type: signal_status_review
      description: Signal 的 weakening/withdrawn/invalidated 状态变更。
    - type: retrospect_review
      description: 个人判断到期复盘、资产影响复盘或历史回放复盘结论；具体语义由 target 对象和 review_context 区分。
    - type: boundary_review
      description: 概念边界裁定。
    - type: patch_review
      description: PatchRequest 接受、拒绝或递延审核。
    - type: conflict_review
      description: 证据冲突、概念冲突、关系冲突裁定。
    - type: deprecation_review
      description: 对象、规则、关系、证据或判断废弃审核。
    - type: barrier_review
      description: 信息墙、MNPI 或数据许可冲突审核。
    - type: marking_downgrade_review
      description: 合规标记降级审核。

# ============================================================
# classification_marking_policy — 合规标记传播与信息墙
# ============================================================
classification_marking_policy:
  description: 派生对象必须继承输入对象的最严格 markings；标记下泄和信息墙冲突必须阻断。
  applies_to: [EvidenceFact, StateVariableObservation, Signal, JudgmentOutput, AssetImpact, DerivedMetric, SimulatedImpact]
  propagation_ref: common.public_contracts.classification_markings.propagation_rule
  gates:
    no_marking_downgrade:
      rule: 派生对象 confidentiality 不得低于任一输入对象。
      failure: block_next_action
      review_queue_type: marking_downgrade_review
    no_barrier_conflict:
      rule: 跨互斥 information_barrier 的派生结果必须标记为 conflict 并进入 barrier_review。
      failure: enqueue_review
      review_queue_type: barrier_review
    no_license_leak:
      rule: license_scope=no_redistribution 或 vendor_restricted 的输入不得进入可分发 exports。
      failure: block_next_action
      review_queue_type: barrier_review

# ============================================================
# retrospect_trigger_policy — 判断与资产影响到期复盘触发契约
# ============================================================
retrospect_trigger_policy:
  description: 定义 JudgmentOutput、AssetImpact、InvestmentThesis 和 InferenceRun 何时进入复盘队列，保证判断结果可校验、可归因、可沉淀。
  trigger_sources:
    - source_object: JudgmentOutput
      trigger_fields: [expectedEvidenceDate, timeHorizon, horizonBucket]
      trigger_condition: expectedEvidenceDate 已到期，或 timeHorizon / horizonBucket 对应窗口结束。
      review_queue_type: retrospect_review
      review_target_relation: reviewFor
    - source_object: AssetImpact
      trigger_fields: [timeHorizon, horizonBucket, expectationGapStatus, pricedInAssessment]
      trigger_condition: 资产影响窗口结束，或价格/基本面结果已可观测。
      review_queue_type: retrospect_review
      review_target_relation: reviewFor
    - source_object: InvestmentThesis
      trigger_fields: [thesisStatus, createdAt]
      trigger_condition: active 命题达到定期复盘周期，或核心 JudgmentOutput 已结算。
      review_queue_type: retrospect_review
      review_target_relation: reviewFor
    - source_object: InferenceRun
      trigger_fields: [runStatus, ontologyFeedback]
      trigger_condition: runStatus 为 partial、blocked 或 failed，且缺口超过治理 SLA。
      review_queue_type: retrospect_review
      review_target_relation: reviewFor
  output_contract:
    review_object: ReviewRecord
    reviewType: retrospect
    required_fields:
      - reviewResult
      - reviewedBy
      - reviewedAt
      - outcomeStatus
      - effectiveEvidenceIds
      - overlookedCounterEvidenceIds
      - expectationGapReviewed
      - pricingReviewed
    optional_outputs:
      - bias_log_entry
      - personal_method_revision
      - PatchRequest_after_aggregation_gate
      - InferenceRule
      - ConductionTemplate
      - ScenarioPath
  quality_rules:
    - 复盘队列项必须绑定明确 targetObjectId，并通过 reviewFor 连接原判断、资产影响、命题或运行记录。
    - 复盘结论为 partially_realized、not_realized、inverted 或 unassessable 时，应记录规则修正建议或补证要求。
    - 单条个人判断复盘默认只写 methodRevisionSuggestion 和 bias_log_entry，不直接生成 PatchRequest。
    - 只有通过 ontology_feedback_aggregation_gate 的 ontology_gap 才允许写 followupPatchRequestIds 或生成 PatchRequest。
    - 经复盘确认有效且通过聚合或治理门禁的规则、模板和情景路径可进入复用资产池。

# ============================================================
# ontology_feedback_aggregation_gate — 复盘反哺本体聚合门禁
# ============================================================
ontology_feedback_aggregation_gate:
  description: 单次判断复盘默认沉淀为团队方法修正；只有同类缺口累计出现或被行业 owner 标记为结构性本体缺口时，才允许生成候选资产或 PatchRequest。
  applies_to: [ReviewRecord.reviewType=retrospect, team_workspace.bias_log]
  default_feedback_scope: personal_method_revision
  ontology_gap_scope: ontology_gap
  aggregation_threshold_default: 3
  aggregation_fields:
    feedback_scope_field: feedbackScope
    aggregation_key_field: aggregationKey
    structural_gap_field: structuralGap
    occurrence_count_field: aggregationEvidenceCount
    patch_field: followupPatchRequestIds
  destinations:
    personal_method_revision:
      write_to: [ReviewRecord.methodRevisionSuggestion, team_workspaces/<workspace_id>/bias/log.yaml]
      patch_request_allowed: false
    ontology_gap:
      write_to: [ReviewRecord.methodRevisionSuggestion, review_queue, PatchRequest]
      patch_request_allowed_when:
        - aggregationEvidenceCount >= aggregation_threshold_default
        - structuralGap = true
  validation_rules:
    - feedbackScope=personal_method_revision 时 followupPatchRequestIds 必须为空。
    - followupPatchRequestIds 非空时 feedbackScope 必须为 ontology_gap。
    - followupPatchRequestIds 非空时必须声明 aggregationKey。
    - followupPatchRequestIds 非空时必须满足 aggregationEvidenceCount >= aggregation_threshold_default 或 structuralGap=true。
    - 达到门槛只允许在 bundle workbench 生成候选资产或 PatchRequest，不得自动写入正式 bundle。
    - bias/log.yaml 采用 append-only 语义，不能直接修改 shared/ 正式资产。

# ============================================================
# retrospect_context_policy — 个人复盘与本体历史回放边界
# ============================================================
retrospect_context_policy:
  description: 区分 per-record 的团队判断复盘和 per-ontology 的历史回放校验，避免把一次判断失误直接解释成本体结构缺陷。
  judgment_record_retrospect:
    target: JudgmentRecord 引用的 JudgmentOutput 或 AssetImpact
    grain: per_record
    primary_location: team_workspaces/<workspace_id>/judgments/ledger.yaml
    outputs: [ReviewRecord, bias_log_entry, personal_method_revision]
    patch_request_rule: 必须通过 ontology_feedback_aggregation_gate 后才可生成 PatchRequest。
  ontology_historical_replay:
    target: InferenceRun、InferenceRule、ConductionTemplate 或 ScenarioPath
    grain: per_ontology_or_rule
    primary_location: optimization_report.historical_validation 或 EvalRun/EvalResult
    outputs: [EvalResult, ReviewRecord, candidate_patch_request]
    patch_request_rule: 作为本体优化任务处理，仍需 owner review。
  intersection_rule: 二者只在判断复盘被聚合为 ontology_gap，或历史回放明确引用具体 JudgmentRecord 样本时相交。

# ============================================================
# quality_gates — 质量门禁
# ============================================================
quality_gates:
  description: 本体在发布、评测或推理使用前必须通过的检查项。
  gates:
    - gate_id: concept_object_mapping
      description: 所有 in_scope Concept 必须有 conceptMapsToObject 映射。
      severity: error
    - gate_id: traceability_backlink
      description: 非 candidate 的正式对象必须具备可追溯来源；事实性对象和判断对象必须具备证据链，治理/工程/schema 类对象必须具备治理来源或动作审计。
      severity: error
    - gate_id: relation_endpoint_resolution
      description: 所有关系端点必须能解析到存在的对象实例。
      severity: error
    - gate_id: no_duplicate_ids
      description: 无重复实例 ID。
      severity: error
    - gate_id: state_machine_validity
      description: 所有对象状态在其定义的状态机内有效。
      severity: error
    - gate_id: signal_role_relation_compatibility
      description: Signal.signalRole 与其使用的关系类型兼容。
      severity: error
    - gate_id: evidence_freshness_check
      description: 推理、评测和历史回放使用证据时必须执行新鲜度过滤。
      severity: error
    - gate_id: patch_audit_integrity
      description: 合并、拒绝、递延和回滚必须有 PatchLedgerItem 或 ActionAudit。
      severity: error
    - gate_id: unresolved_item_indexing
      description: 未解析项必须记录类型、目标、责任人、优先级和处理状态。
      severity: warning
    - gate_id: artifact_separation
      description: 推理运行、搜索日志、评测结果不得写入本体主体模块。
      severity: error

# ============================================================
# cross_bundle_governance — 跨包冲突治理
# ============================================================
cross_bundle_governance:
  description: >
    定义业务 bundle 之间的 owner、引用、补丁、冲突和版本迁移规则。
    一个资产只能有一个 owner bundle；其他 bundle 可以引用、扩展或提交补丁，
    但不得复制并各自维护。

  ownership_policy:
    required_owner_field: owner_bundle_id
    applies_to: [Object, Relation, StateVariable, InferenceRule, ConductionTemplate, ScenarioPath, SourceDocument, EvidenceClaim, EvidenceFact, JudgmentOutput, AssetImpact, ReviewRecord]
    rules:
      - 每个资产必须声明 owner_bundle_id；核心规范包中的 schema 类型除外。
      - 跨包使用只能 external_ref 引用 owner 资产，不得复制对象。
      - namespace + stable id + normalizedKey 用于跨包去重。
      - AI 生成资产默认 candidate、draft、supplementRequired 或 review_pending，不得直接 active。

  cross_bundle_patch_policy:
    description: 修改外部 owner_bundle 资产时，当前 bundle 只能生成 PatchRequest，不得直接写入 active 区。
    required_fields: [source_bundle_id, owner_bundle_id, target_asset_id, operation, rationale, evidence_refs]
    allowed_operations: [add, modify, retire, merge, split, supplement_evidence, revise_relation, add_blocking_signal, reject, defer, migrate]
    review_owner_rule: PatchRequest 由 owner_bundle_id 对应的 owner 或 review_owner 审核。
    merge_rule: 合并、拒绝、延后、失败、回滚和迁移都必须追加 PatchLedgerItem。
    direct_write_rule: 非 owner bundle 不得写入外部资产的 active、confirmed 或 deprecated 状态；只能写入本 bundle 的 PatchRequest、unresolved_items 或 review_queue。
    generated_asset_rule: AI 生成的跨包候选资产默认进入 staging，recordStatus 为 candidate、draft 或 review_pending。

  external_ref_contract:
    fields: [ref_id, owner_bundle_id, owner_bundle_version, target_id, target_type, ref_purpose, loaded_fields, summary_hash]
    rules:
      - external_ref 是只读引用；如需改变目标资产，创建 PatchRequest。
      - external_ref 应记录 owner_bundle_version，推理运行再记录实际消费版本。
      - 引用不可解析时进入 unresolved_items.invalid_external_ref 或 review_queue。

  relation_governance:
    required_relation_fields: [id, source_id, target_id, relation_type, direction, recordStatus, evidenceRefs]
    rules:
      - 关系必须有稳定 relation id、source_id、target_id、relation_type 和 evidenceRefs。
      - 关系端点跨 bundle 时必须能解析 external_ref 或 registry 依赖。
      - 不得凭对象排序、行业常识或 positionInChain 自动补关系。
      - 显式关系的业务属性允许通过 relationProperties、domainSpecificProperties 或 scenarioProperties 扩展。

  conflict_review:
    description: 冲突不得覆盖删除，必须保留双方证据并进入未解析项或审核队列。
    conflict_targets: [Object, Relation, EvidenceClaim, EvidenceFact, StateVariable, InferenceRule, ScenarioPath]
    required_handling:
      - 冲突记录进入 unresolved_items 或 review_queue。
      - Claim / Fact 冲突必须保留双方证据，并通过 conflict_review 裁决。
      - 解决结果为 merged、rejected、deferred、rollback 或 migrate 时必须写 PatchLedgerItem。
      - 版本迁移必须生成 operation=migrate 的 PatchRequest，并记录 PatchLedgerItem。

  inference_run_traceability:
    description: 推理运行必须记录消费了哪些 bundle、场景和资产，保证链路可回放。
    required_fields: [bundle_id, bundle_version, scenario_id, loaded_assets, loaded_summaries, external_refs]
    failure_rule: 如果 loaded_assets 不完整，InferenceRun.runStatus 应为 partial、blocked 或 failed，并记录 ontologyFeedback。

  as_of_gate:
    description: 历史回放和回测必须按 asOfTime 重建当时可见信息，防止 look-ahead bias。
    applies_to: [InferenceRun, ReviewRecord]
    rule: runMode 为 replay 或 backtest 时，所有消费对象、证据和观测必须满足 learnedAt <= asOfTime；缺 learnedAt 时回退 observedAt。
    failure: block_next_action
    invalid_status: invalid_replay
    required_audit_fields: [asOfTime, excludedByAsOf, violatedAssetIds]

action_side_effect_governance:
  description: Action 副作用治理契约。副作用只能作为动作结果被记录和触发，不得绕过 ActionAudit、ReviewRecord 或 PatchRequest。
  allowed_side_effects:
    emit_notification:
      required_fields: [recipient_role, notification_reason, target_object_id, payload_summary]
      audit_target: ActionAudit
    enqueue_review:
      required_fields: [review_queue_type, target_object_id, reason, owner_bundle_id]
      audit_target: ReviewRecord
    create_patch_request:
      required_fields: [source_bundle_id, owner_bundle_id, target_asset_id, operation, rationale]
      audit_target: PatchRequest
    trigger_followup:
      required_fields: [event_name, event_type, source_action_audit_id, payload_summary, terminal_handling]
      audit_target: ActionFollowup
    trigger_next_action:
      required_fields: [next_action_type, trigger_reason, required_inputs]
      audit_target: ActionAudit
    call_external_task:
      required_fields: [external_task_type, endpoint_or_system, payload_summary, failure_policy]
      audit_target: ActionAudit
      restrictions:
        - 核心规范只记录外部任务契约，不保存凭证、密钥或完整敏感载荷。
        - 外部任务失败不得静默重试；必须记录 failure_reason 和 next_action。
  rules:
    - 每个 side_effect 必须归属于一个 Action。
    - side_effect 产生的新审核、补丁或任务必须能回溯到原 ActionAudit。
    - ActionFollowup 只记录动作后续信号和后续触发线索，不替代外部研究 Event、ActionAudit 或 ReviewRecord。
    - 通知和外部任务不得直接修改 owner bundle 的 active 资产。

# ============================================================
# patch_conflict_detection — 补丁冲突检测与乐观锁
# ============================================================
# v1.2 新增。当前 PatchRequest/PatchLedgerItem 使用 append-only 账本，
# 但缺少并发修改的冲突检测。本段定义基于 baseHash 的乐观锁策略。

patch_conflict_detection:
  description: >
    补丁冲突检测与乐观锁机制。当多个优化流程同时生成针对同一本体的
    PatchRequest 时，基于 baseHash 的乐观锁防止并发修改冲突。

  optimistic_locking:
    enabled: true
    lock_field: PatchLedgerItem.baseHash
    algorithm: SHA256
    scope: 整个 base ontology bundle 在补丁应用前的 SHA256 哈希
    check_on_merge: true
    conflict_resolution:
      - strategy: reject_and_retry
        description: >
          当合并时发现 baseHash 与当前本体哈希不匹配（本体已被其他补丁修改），
          拒绝当前补丁，要求基于最新本体重新生成 PatchRequest。
        applicable_when: mergeStatus == not_started
      - strategy: auto_rebase
        description: >
          对于不会产生冲突的操作（如 add、supplement_evidence），
          自动基于最新本体重新计算合并参数，无需人工介入。
        applicable_when: operation in [add, supplement_evidence]
      - strategy: manual_resolve
        description: >
          对于可能冲突的操作（如 modify、retire、split、merge），
          标记 mergeStatus=failed 并记录冲突详情，进入 review_queue。
        applicable_when: operation in [modify, retire, split, merge, revise_relation]

  conflict_records:
    description: 冲突记录结构
    fields:
      conflictId:
        zh_name: 冲突 ID
        type: string
        pattern: PCF-YYYYMMDD-serial
      detectedAt:
        zh_name: 冲突检测时间
        type: datetime
        time_type: system_time
      originalBaseHash:
        zh_name: 原始 baseHash
        type: string
      currentBaseHash:
        zh_name: 当前 baseHash
        type: string
      conflictingPatchIds:
        zh_name: 冲突补丁 ID
        type: array
        items: object_ref
      resolution:
        zh_name: 冲突解决方式
        type: enum
        enum: [rejected, rebased, manually_resolved, deferred]
      resolutionNote:
        zh_name: 解决说明
        type: string

  priority_rules:
    description: 冲突不可自动解决时的人工裁决优先级。
    rules:
      - priority: 1
        criterion: human_override
        description: 人工明确标记为优先的 PatchRequest
      - priority: 2
        criterion: evidence_quality
        description: 证据等级更高（evidenceLevel）的 PatchRequest
      - priority: 3
        criterion: recency
        description: 基于更新版本的 baseHash 的 PatchRequest
      - priority: 4
        criterion: automated
        description: 系统默认合并策略（仅对 add/supplement_evidence 操作）

# ============================================================
# quality_gates_cross_reference — 质量门禁与校验清单映射
# ============================================================
# v1.2 新增。建立 governance.yaml 的 10 项 quality_gates 与
  # references/04_治理域规范.md §7 准入、消费与质量门禁的双向映射。

quality_gates_cross_reference:
  description: quality_gates 与 references/04_治理域规范.md §7 准入、消费与质量门禁的对应关系。
  note: >
    quality_gates 面向机器执行的门禁检查；
    §7 准入、消费与质量门禁面向人工校验的步骤指引。
    两者是同一组质量目标的两种消费视图，应保持同步。

  mappings:
    - gate_id: concept_object_mapping
      checklist_sections: ["§13.10 跨模块一致性 — 概念映射检查"]
      checklist_item_ids: [13.1, 13.10]

    - gate_id: traceability_backlink
      checklist_sections: ["§13.6 证据可追溯性", "§13.3 对象质量"]
      checklist_item_ids: [13.3, 13.6]

    - gate_id: relation_endpoint_resolution
      checklist_sections: ["§13.4 关系质量"]
      checklist_item_ids: [13.4]

    - gate_id: no_duplicate_ids
      checklist_sections: ["§13.3 对象质量"]
      checklist_item_ids: [13.3]

    - gate_id: state_machine_validity
      checklist_sections: ["§13.3 对象质量"]
      checklist_item_ids: [13.3]

    - gate_id: signal_role_relation_compatibility
      checklist_sections: ["§13.5 可观测维度与推理链"]
      checklist_item_ids: [13.5]

    - gate_id: evidence_freshness_check
      checklist_sections: ["§13.7 Temporal Evidence Layer 合规"]
      checklist_item_ids: [13.7]

    - gate_id: patch_audit_integrity
      checklist_sections: ["§13.8 Patch Ledger 审计"]
      checklist_item_ids: [13.8]

    - gate_id: unresolved_item_indexing
      checklist_sections: ["§13.11 治理与合规边界"]
      checklist_item_ids: [13.11]

    - gate_id: artifact_separation
      checklist_sections: ["§13.1 Bundle 结构完整性", "§13.9 推理运行记录"]
      checklist_item_ids: [13.1, 13.9]

# ============================================================
# 治理动作与 actions 的关系
# ============================================================
governance_action_audit_policy:
  description: >
    治理动作的审计遵循 actions 的 audit_policy：
    - 每个治理动作执行后创建 ActionAudit。
    - 需要审核的治理动作（ProposeLayerPromotion、ResolveConflictingClaims 等）
      同时创建 ReviewRecord。
    - 治理动作的 ActionAudit.targetObject 指向被治理的对象（Concept、Relation 等）。
    - governance_actions 中的动作不应绕过 actions 中定义的领域动作直接修改对象状态。
      例如 ProposeLayerPromotion 修改 governanceLayer 时必须通过标准的 Update 类动作执行字段变更。
