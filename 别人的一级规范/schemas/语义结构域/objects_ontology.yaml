schema_name: objects_ontology
schema_version: 0.1.0
namespace: investment_ontology
status: draft
depends_on:
  common_schema: ../common.yaml
canonical_rule: YAML 是正式机器约束；Markdown 只负责解释和示例。
description: 投研语义结构域对象类型定义——概念层（ConceptScheme/Concept/ConceptBoundary）和研究标的层（Industry/Segment/Company/Product/Material/Asset）。公共枚举和域映射见 common.yaml。
relation_direction_note: optional_relations 中的 sourceOf 表示该对象允许被 SourceDocument -> object 的来源关系追溯；不表示该对象作为 sourceOf 的 source。

# ============================================================
# 域一：语义结构域 — 概念层 + 研究标的
# ============================================================

concept_layer_structure:
  description: 概念层是本体中最靠近研究范围定义的一层，负责回答"研究什么、边界在哪、术语怎么归一"。它不替代业务对象（Industry、Segment、Product 等），只为业务对象的生成和边界判断提供术语口径。
  hierarchy:
    - level: 1
      type: ConceptScheme
      role: 某一行业、主题或研究范围的概念口径集合，是概念层的顶层容器。
      cardinality: 每个行业或主题本体最多一个主 ConceptScheme；多体系并存时必须说明适用边界。
    - level: 2
      type: Concept
      role: 用自然语言定义研究范围中的术语、主题、技术、环节或相邻概念，并声明其在当前本体中的范围状态。
      relationship_to_scheme: conceptInScheme（必填）
    - level: 3
      type: ConceptBoundary
      role: 记录某概念在当前本体中纳入、排除、相邻或交叉的边界判断及依据。
      relationship_to_concept: boundaryForConcept（必填）

concept_to_object_mapping:
  description: 概念层到稳定语义对象层的映射规则。概念定义研究范围和术语口径，业务对象承载具体实例。映射关系通过 conceptMapsToObject 表达。
  rules:
    - 每个 scopeStatus=in_scope 的 Concept 必须映射到稳定语义对象，或进入 governance.yaml 的未解析项/边界审核。
    - conceptMapsToObject 只能指向 Industry、Segment、Company、Product、Material、Asset 或 ObjectSet，不直接指向 Event、StateVariable、Signal、JudgmentOutput 等运行时或推理对象。
    - conceptMapsToObject 的角色由 conceptMappingRole 枚举约束，明确映射目的（如 maps_to_industry、maps_to_product 等）。
    - adjacent 与 overlap 概念只能约束边界和映射，不能自动生成业务对象。
  mapping_roles:
    - defines_scope
    - maps_to_industry
    - maps_to_segment
    - maps_to_product
    - maps_to_material
    - maps_to_company
    - maps_to_asset
    - maps_to_object_set
    - alias_only

cross_ontology_alignment:
  description: 跨本体对齐策略。当同一 Concept 在不同本体中出现时，通过 alignment 声明其语义关系。
  strategies:
    - strategy: equivalent
      description: 两个本体中的概念语义等价，可互操作。
    - strategy: narrower_in_source
      description: 源本体中的概念比目标本体中更窄（更具体）。
    - strategy: broader_in_source
      description: 源本体中的概念比目标本体中更宽（更泛化）。

concept_conflict_resolution:
  description: 概念层冲突类型与裁决规则。
  conflict_types:
    - type: scope_conflict
      description: 同一概念在不同本体中被标记为不同的 scopeStatus。
      resolution: 以最新确认的 ConceptBoundary 为准；无边界裁定时进入 governance 未解析项。
    - type: definition_conflict
      description: 同一概念在不同本体中有不同的 definition 或术语口径。
      resolution: 以绑定 SourceDocument 且 definitionStatus=reviewed 的概念为准；均为 draft 时保留争议记录。
    - type: mapping_conflict
      description: 同一概念映射到不同类型的业务对象。
      resolution: 以 mappingRole 约束裁定；role=defines_scope 的概念优先。
    - type: boundary_conflict
      description: 两个 ConceptBoundary 对同一概念的纳入/排除给出相反裁定。
      resolution: 进入 governance review_queue，由行业负责人裁定。

concept_quality_rules:
  description: 概念层的全局质量约束。对象类型级别的 quality_rules 见各对象类型定义。
  rules:
    - id: concept_layer_not_content_dump
      description: 概念层只定义研究范围、术语口径和边界裁定，不写入行业百科内容。半导体、光通信、硅光等具体概念实例应进入对应行业本体的 concept_layer 实例文件。
    - id: core_spec_defines_structure_only
      description: 核心规范只定义概念层结构（本文件）和概念对象类型，不写死任何行业的具体概念实例。
    - id: concept_definition_vs_object_description
      description: Concept.definition 只写术语口径（涵盖范围、排除边界、与易混淆术语的区别），不得复制对应 Object.description 的内容。校验时若两者文本高度近似，标记为跨模块复写（WARN）。
    - id: key_concepts_must_have_source
      description: 关键概念必须绑定 SourceDocument；无权威来源时保持 candidate 或 disputed。
    - id: boundary_not_investment_conclusion
      description: 边界裁定不得直接生成投资结论；只能约束后续对象生成、检索、评测和推理范围。
    - id: no_dangling_in_scope_concepts
      description: scopeStatus=in_scope 的 Concept 必须映射到稳定语义对象，或进入 governance 未解析项；名词、主题和术语不得自动升级成正式对象。

concept_machine_validation_rules:
  - id: concept_hierarchy_types_exist
    description: 概念层 hierarchy 引用的类型必须存在于 objects.yaml 中。
  - id: concept_mapping_targets_valid
    description: conceptMapsToObject 的目标类型必须是稳定语义对象类型，不得直接映射到 Event、StateVariable、Signal 或 JudgmentOutput。
  - id: concept_scope_status_valid
    description: Concept.scopeStatus 必须在 conceptScopeStatus 枚举内。
  - id: boundary_decision_valid
    description: ConceptBoundary.decisionType 必须在 boundaryDecisionType 枚举内（不包含 defer，无法裁定的概念统一进入 governance）。
  - id: no_empty_in_scope_concept_definition
    description: scopeStatus=in_scope 的 Concept.definition 不得为空或仅占位符。

object_types:
  ConceptScheme:
    zh_name: 概念体系
    category: conceptual_definition
    managed_by: industry_owner
    description: 某一行业、主题或研究范围的概念口径集合，用于约束后续对象生成、边界判断和术语归一。
    fields:
      name:
        zh_name: 名称
        type: string
        required: true
      scopeName:
        zh_name: 范围名称
        type: string
        required: true
      schemeVersion:
        zh_name: 概念体系版本
        type: string
        required: true
      description:
        zh_name: 描述
        type: string
        required: true
      language:
        zh_name: 语言
        type: string
        required: false
      authorityPolicy:
        zh_name: 权威来源策略
        type: string
        required: true
    required_relations: []
    optional_relations: [sourceOf]
    quality_rules:
      - ConceptScheme 只定义某个本体的概念范围和术语口径，不把具体行业百科写入核心规范。
      - 每个行业或主题本体最多应有一个主 ConceptScheme；多体系并存时必须说明适用边界。

  Concept:
    zh_name: 概念
    category: conceptual_definition
    managed_by: industry_owner
    description: 用自然语言定义研究范围中的术语、主题、技术、环节或相邻概念，并说明其在当前本体中的纳入状态。
    fields:
      name:
        zh_name: 名称
        type: string
        required: true
      definition:
        zh_name: 定义
        type: string
        required: true
      conceptType:
        zh_name: 概念类型
        type: enum
        enum: [industry_scope, supply_chain_scope, product_or_technology, material_or_input, company_role, policy_theme, macro_theme, event_theme, asset_scope, term]
        required: true
      scopeStatus:
        zh_name: 当前本体范围状态
        type: enum
        enum: [in_scope, out_of_scope, adjacent, overlap, disputed, unknown]
        required: true
      aliases:
        zh_name: 同义词与别名
        type: array
        required: false
      englishName:
        zh_name: 英文名
        type: string
        required: false
      inclusionRationale:
        zh_name: 纳入理由
        type: string
        required: false
      exclusionRationale:
        zh_name: 排除理由
        type: string
        required: false
      definitionStatus:
        zh_name: 定义状态
        type: enum
        enum: [draft, source_supported, reviewed, deprecated]
        required: true
        default: draft
      sourceRequirement:
        zh_name: 来源要求
        type: string
        required: false
    required_relations: [conceptInScheme]
    optional_relations: [conceptBroaderThan, conceptNarrowerThan, conceptIncludes, conceptOverlapsWith, conceptExcludes, conceptMapsToObject, sourceOf]
    quality_rules:
      - Concept 回答”这个词是什么意思、在不在当前本体范围内、为什么”，不得替代 Industry、Segment、Product 等业务对象。
      - Concept.definition 只写术语口径（涵盖范围、排除边界、与易混淆术语的区别），不得复制对应 Object.description 的内容。校验时若两者文本高度近似，标记为跨模块复写（WARN）。
      - 关键概念必须绑定 SourceDocument；无权威来源时保持 candidate 或 disputed。
      - adjacent 与 overlap 概念只能约束边界和映射，不能自动生成业务对象。
      - 每个 scopeStatus=in_scope 的 Concept 必须映射到稳定语义对象，或进入 governance.yaml 的未解析项；名词、主题和术语不得自动升级成正式对象。

  ConceptBoundary:
    zh_name: 概念边界裁定
    category: conceptual_definition
    managed_by: industry_owner
    description: 记录某概念在当前本体中纳入、排除、相邻、交叉或延后的边界判断及依据。
    fields:
      title:
        zh_name: 标题
        type: string
        required: true
      decisionType:
        zh_name: 裁定类型
        type: enum
        enum: [include, exclude, adjacent, overlap]
        required: true
        description: 只放有结论的裁定。暂无法裁定（原 defer）统一进入 governance.yaml 的未解析项，不在 concepts 层留悬空裁定。
      decisionText:
        zh_name: 裁定说明
        type: string
        required: true
      appliesToScope:
        zh_name: 适用范围
        type: string
        required: true
      boundaryCondition:
        zh_name: 边界条件
        type: string
        required: false
      reviewNote:
        zh_name: 复核说明
        type: string
        required: false
    required_relations: [boundaryForConcept]
    optional_relations: [sourceOf]
    quality_rules:
      - ConceptBoundary 必须能解释为什么某概念被纳入、排除、标记为相邻或交叉。
      - 暂无法裁定的概念（原 defer）统一进入 governance.yaml 的未解析项，不在 concepts 层留悬空裁定。这样保证概念层只放已决策内容，governance 集中管理所有待定项。
      - 边界裁定不得直接生成投资结论；只能约束后续对象生成、检索、评测和推理范围。

  Industry:
    zh_name: 产业
    category: research_target
    managed_by: data_admin
    description: 宏观产业分类，如半导体、新能源。
    fields:
      name:
        zh_name: 名称
        type: string
        required: true
      description:
        zh_name: 描述
        type: string
        required: false
      classificationStandard:
        zh_name: 分类标准
        type: string
        required: false
    required_relations: []
    optional_relations: [subIndustryOf]

  Segment:
    zh_name: 产业链环节
    category: research_target
    managed_by: data_admin
    description: 产业链中可独立分析的位置，如上游设备、中游制造、下游应用。
    fields:
      name:
        zh_name: 名称
        type: string
        required: true
      positionInChain:
        zh_name: 链条位置
        type: enum
        enum: [upstream, midstream, downstream, cross_chain, other]
        required: false
      description:
        zh_name: 描述
        type: string
        required: false
    required_relations: [segmentBelongsToIndustry]
    optional_relations: [segmentConnectsToSegment]

  Company:
    zh_name: 公司
    category: research_target
    managed_by: data_admin
    description: 核心研究主体。
    fields:
      name:
        zh_name: 名称
        type: string
        required: true
      shortName:
        zh_name: 简称
        type: string
        required: false
        source_note: 由 03 半导体示例反推补充。
      ticker:
        zh_name: 证券代码
        type: string
        required: false
      description:
        zh_name: 描述
        type: string
        required: false
    required_relations: [companyBelongsToIndustry, companyParticipatesInSegment]
    optional_relations: [companyLinkedToAsset, companyRelatesToCompany]

  Product:
    zh_name: 产品
    category: research_target
    managed_by: data_admin
    description: 公司的具体产品、产品线或关键产品。
    fields:
      name:
        zh_name: 名称
        type: string
        required: true
      description:
        zh_name: 描述
        type: string
        required: false
      productRole:
        zh_name: 产品角色
        type: enum
        enum: [finished_product, component, subassembly, material_form, technology_route, service, unknown]
        required: false
        description: component 表示 BOM 部件（如 EML、DSP、TIA），与 productUsesProduct 配合定位供应链物理结构。
    required_relations: [productProducedBy, productBelongsToSegment]
    optional_relations: [productRelatesToProduct]

  Material:
    zh_name: 材料
    category: research_target
    managed_by: data_admin
    description: 关键原材料或投入品。
    fields:
      name:
        zh_name: 名称
        type: string
        required: true
      materialType:
        zh_name: 材料类型
        type: string
        required: false
      description:
        zh_name: 描述
        type: string
        required: false
    required_relations: [materialBelongsToIndustry, materialUsedInSegment]
    optional_relations: [materialUsedInProduct, materialRelatesToMaterial]

  ProcessStep:
    zh_name: 工艺步骤
    category: research_target
    managed_by: industry_owner
    description: 供应链中的制造或验证步骤，如外延、晶圆制造、测试、模块组装，用于定位产能瓶颈与 lead time。
    fields:
      name:
        zh_name: 名称
        type: string
        required: true
      processType:
        zh_name: 工艺类型
        type: enum
        enum: [epitaxy, wafer_fabrication, chip_testing, module_assembly, reliability_validation, packaging, other]
        required: true
      typicalLeadTimeRange:
        zh_name: 典型交期范围
        type: string
        required: false
      description:
        zh_name: 描述
        type: string
        required: false
    required_relations: []
    optional_relations: []

  SupplyConstraint:
    zh_name: 供应约束
    category: research_target
    managed_by: industry_owner
    description: 可定位的供给瓶颈对象，将"瓶颈"从判断词落实为 material_shortage、capacity_shortage、yield_constraint 等可追踪实体。
    fields:
      name:
        zh_name: 名称
        type: string
        required: true
      constraintType:
        zh_name: 约束类型
        type: enum
        enum: [material_shortage, capacity_shortage, yield_constraint, qualification_constraint, export_approval_constraint, logistics_constraint, other]
        required: true
      severity:
        zh_name: 严重程度
        type: enum
        enum: [blocking, tightening, monitoring, easing, resolved, unknown]
        required: false
      description:
        zh_name: 描述
        type: string
        required: false
    required_relations: []
    optional_relations: []

  Asset:
    zh_name: 资产标的
    category: research_target
    managed_by: data_admin
    description: 判断最终作用的投资标的，如股票、债券、期货。
    fields:
      name:
        zh_name: 名称
        type: string
        required: true
      assetType:
        zh_name: 资产类型
        type: enum
        enum: [equity, bond, futures, fund, index, commodity, fx, other]
        required: true
      ticker:
        zh_name: 交易代码
        type: string
        required: false
      market:
        zh_name: 交易市场
        type: string
        required: false
    required_relations: []
    optional_relations: [assetLinkedToIndustry, assetExposedToTarget]

  ObjectSet:
    zh_name: 对象集合
    category: research_target
    managed_by: researcher_or_system
    description: 可复用、可命名的对象集合（研究篮子/cohort）。成员可由显式枚举或过滤规则确定，用作批量资产影响、监控订阅和复用资产的承载单元。
    fields:
      name:
        zh_name: 集合名称
        type: string
        required: true
      setType:
        zh_name: 集合类型
        type: enum
        enum_ref: objectSetType
        required: true
      memberObjectType:
        zh_name: 成员对象类型
        type: enum
        enum_ref: objectSetMemberType
        required: true
      selectionRule:
        zh_name: 选择规则
        type: object
        required: false
        description: setType 包含 rule_based 时必填；复用 InferenceRule.triggerCondition 的 expression 结构。
      refreshPolicy:
        zh_name: 刷新策略
        type: enum
        enum: [static, on_demand, on_input_change]
        required: true
      memberCountSnapshot:
        zh_name: 成员数量快照
        type: integer
        required: false
        generated_by: system
      lastResolvedAt:
        zh_name: 最近解析时间
        type: datetime
        time_type: system_time
        required: false
        generated_by: system
    required_relations: []
    optional_relations: [setContainsMember, sourceOf]
    quality_rules:
      - rule_based 集合必须声明 selectionRule；static_enumerated 集合的每个成员必须通过 setContainsMember 显式列出。
      - ObjectSet 是研究视图和批量分析入口，不替代 Company、Asset、Product 等正式对象。
