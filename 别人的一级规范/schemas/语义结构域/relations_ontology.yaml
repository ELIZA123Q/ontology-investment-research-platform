schema_name: relations_ontology
schema_version: 0.1.0
namespace: investment_ontology
status: draft
depends_on:
  common_schema: ../common.yaml
  objects_schema: objects_ontology.yaml
canonical_rule: YAML 是正式机器约束；Markdown 只负责解释和示例。
description: 投研语义结构域关系类型定义——概念定义类关系、研究标的类关系和标的图谱类关系。

relation_defaults:
  direction: directed
  history_policy: preserve_history
  deletion_policy: no_physical_delete_without_migration
  relation_instance_id_pattern: "REL-{YYYYMMDD}-{serial}"
  relation_status_values: [candidate, confirmed, rejected, archived]
  required_instance_fields: [id, type, sourceId, targetId, recordStatus]
  inheritance_rule: 实例文件可在容器级声明默认 recordStatus；若关系实例未显式填写 recordStatus，可继承容器默认值。正式入库时系统应补齐为实例字段。
  inverse_of_note: >
    关系类型中的 inverse_of 字段为可选项，声明该关系的逻辑反向关系名。
    正式维护优先保存主关系；反向关系可由查询视图或推理引擎派生。
    当两方关系类型均已定义时，inverse_of 直接引用对方关系类型名；
    当反向关系未实例化时（如 companyBelongsToIndustry 的逆 industryContainsCompany），
    inverse_of 仅声明逆关系名供推理引擎做双向遍历推导，不要求实例化该逆关系。

relation_types:
  conceptInScheme:
    zh_name: 概念属于概念体系
    group: conceptual_relations
    source_types: [Concept]
    target_types: [ConceptScheme]
    direction: directed
    cardinality: many_to_one
    description: 概念属于某个行业、主题或研究范围的概念体系。
    properties:
      schemeRole:
        zh_name: 体系角色
        type: enum
        enum: [root, primary, secondary, adjacent, excluded]
        required: true

  conceptBroaderThan:
    zh_name: 概念上位于概念
    group: conceptual_relations
    source_types: [Concept]
    target_types: [Concept]
    direction: directed
    cardinality: many_to_many
    inverse_of: conceptNarrowerThan
    description: 源概念是目标概念的上位概念。
    properties:
      hierarchyBasis:
        zh_name: 层级依据
        type: string
        required: false

  conceptNarrowerThan:
    zh_name: 概念下位于概念
    group: conceptual_relations
    source_types: [Concept]
    target_types: [Concept]
    direction: directed
    cardinality: many_to_many
    inverse_of: conceptBroaderThan
    description: 源概念是目标概念的下位概念；正式维护以 conceptBroaderThan 为主，本关系通常由反向查询视图或推理引擎派生。若显式记录，必须校验与 conceptBroaderThan 端点一致。
    properties:
      hierarchyBasis:
        zh_name: 层级依据
        type: string
        required: false

  conceptIncludes:
    zh_name: 概念包含概念
    group: conceptual_relations
    source_types: [Concept]
    target_types: [Concept]
    direction: directed
    cardinality: many_to_many
    description: 源概念在当前本体口径下包含目标概念。
    properties:
      inclusionBasis:
        zh_name: 包含依据
        type: string
        required: true

  conceptOverlapsWith:
    zh_name: 概念与概念交叉
    group: conceptual_relations
    source_types: [Concept]
    target_types: [Concept]
    direction: symmetric_single_edge
    cardinality: many_to_many
    description: 两个概念存在交叉范围，但任一方不完全包含另一方。
    properties:
      overlapBasis:
        zh_name: 交叉依据
        type: string
        required: true
      overlapScope:
        zh_name: 交叉范围
        type: string
        required: true

  conceptExcludes:
    zh_name: 概念排除概念
    group: conceptual_relations
    source_types: [Concept]
    target_types: [Concept]
    direction: directed
    cardinality: many_to_many
    description: 源概念在当前本体口径下明确排除目标概念。
    properties:
      exclusionBasis:
        zh_name: 排除依据
        type: string
        required: true

  boundaryForConcept:
    zh_name: 边界裁定对应概念
    group: conceptual_relations
    source_types: [ConceptBoundary]
    target_types: [Concept]
    direction: directed
    cardinality: many_to_many
    description: 概念边界裁定适用于某个概念。
    properties:
      boundaryRole:
        zh_name: 边界角色
        type: enum
        enum: [subject, included, excluded, adjacent, overlap, deferred]
        required: true

  conceptMapsToObject:
    zh_name: 概念映射到本体对象
    group: conceptual_relations
    source_types: [Concept]
    target_types: [Industry, Segment, Company, Product, Material, Asset, ObjectSet]
    direction: directed
    cardinality: many_to_many
    description: 概念映射到稳定语义对象；概念负责术语口径，业务对象或对象集合负责图谱锚定。不得直接映射到状态变量、信号、事件或判断。
    properties:
      mappingRole:
        zh_name: 映射角色
        type: enum
        enum: [defines_scope, maps_to_industry, maps_to_segment, maps_to_product, maps_to_material, maps_to_company, maps_to_asset, maps_to_object_set, alias_only]
        required: true
      mappingBasis:
        zh_name: 映射依据
        type: string
        required: true

  subIndustryOf:
    zh_name: 归属上级产业
    group: research_target_relations
    source_types: [Industry]
    target_types: [Industry]
    direction: directed
    cardinality: many_to_one
    inverse_of: industryContainsSubIndustry
    description: 子产业属于上级产业。
    properties:
      hierarchyLevel:
        zh_name: 层级
        type: string
        required: false

  segmentBelongsToIndustry:
    zh_name: 环节所属产业
    group: research_target_relations
    source_types: [Segment]
    target_types: [Industry]
    direction: directed
    cardinality: many_to_one
    inverse_of: industryContainsSegment
    description: 产业链环节属于某产业。
    properties: {}

  companyBelongsToIndustry:
    zh_name: 公司所属产业
    group: research_target_relations
    source_types: [Company]
    target_types: [Industry]
    direction: directed
    cardinality: many_to_many
    inverse_of: industryContainsCompany
    description: 公司属于某产业。
    properties:
      classificationBasis:
        zh_name: 分类依据
        type: string
        required: false

  companyParticipatesInSegment:
    zh_name: 公司参与环节
    group: research_target_relations
    source_types: [Company]
    target_types: [Segment]
    direction: directed
    cardinality: many_to_many
    inverse_of: segmentHasParticipantCompany
    description: 公司参与某产业链环节。
    properties:
      participationRole:
        zh_name: 参与角色
        type: string
        required: true
      exposureDescription:
        zh_name: 敞口描述
        type: string
        required: false

  productProducedBy:
    zh_name: 产品由公司生产
    group: research_target_relations
    source_types: [Product]
    target_types: [Company]
    direction: directed
    cardinality: many_to_one
    inverse_of: companyProducesProduct
    description: 产品由某公司生产或经营。
    properties:
      productRole:
        zh_name: 产品角色
        type: string
        required: false

  productBelongsToSegment:
    zh_name: 产品所属环节
    group: research_target_relations
    source_types: [Product]
    target_types: [Segment]
    direction: directed
    cardinality: many_to_one
    inverse_of: segmentContainsProduct
    description: 产品属于某产业链环节。
    properties: {}

  materialBelongsToIndustry:
    zh_name: 材料所属产业
    group: research_target_relations
    source_types: [Material]
    target_types: [Industry]
    direction: directed
    cardinality: many_to_one
    inverse_of: industryContainsMaterial
    description: 材料属于某产业。
    properties: {}

  materialUsedInSegment:
    zh_name: 材料用于环节
    group: research_target_relations
    source_types: [Material]
    target_types: [Segment]
    direction: directed
    cardinality: many_to_many
    inverse_of: segmentUsesMaterial
    description: 材料用于某产业链环节。
    properties:
      usageRole:
        zh_name: 用途角色
        type: string
        required: false

  companyLinkedToAsset:
    zh_name: 公司对应资产
    group: research_target_relations
    source_types: [Company]
    target_types: [Asset]
    direction: directed
    cardinality: many_to_many
    description: 公司对应某资产标的。
    properties:
      listingRole:
        zh_name: 上市角色
        type: string
        required: false

  assetLinkedToIndustry:
    zh_name: 资产对应产业
    group: research_target_relations
    source_types: [Asset]
    target_types: [Industry]
    direction: directed
    cardinality: many_to_many
    description: 资产标的对应某产业。
    properties:
      exposureBasis:
        zh_name: 敞口依据
        type: string
        required: false

  segmentConnectsToSegment:
    zh_name: 环节连接环节
    group: target_graph_relations
    source_types: [Segment]
    target_types: [Segment]
    direction: directed
    cardinality: many_to_many
    description: 产业链环节之间的业务连接，用于显式表达上下游、使能、加工、组装、销售、替代、互补或竞争关系。
    properties:
      chainRelationType:
        zh_name: 链条关系类型
        type: enum
        enum: [supplies_to, enables, processes_into, assembles_into, sells_to, substitutes, complements, competes_with, drives_demand_for, constrains_supply_of]
        required: true
      transmissionStrength:
        zh_name: 传导强度
        type: enum
        enum: [strong, medium, weak, conditional, unknown]
        required: false
        description: 源环节变化对目标环节的典型传导强度；conditional 表示仅在 boundaryConditions 满足时成立。
      lagRange:
        zh_name: 结构化时滞范围
        type: object
        required: false
        properties:
          min:
            type: number
          max:
            type: number
          unit:
            type: enum
            enum: [day, week, month, quarter, year, event_driven, unknown]
          description:
            type: string
      applicableConditions:
        zh_name: 适用条件
        type: array
        required: false
        description: 关系成立所需的技术路线、客户结构或市场条件。
        items:
          type: string
      falsificationConditions:
        zh_name: 反证条件
        type: array
        required: false
        description: 满足任一条件时，该传导关系应被削弱、阻断或反转。
        items:
          type: string
      relationBasis:
        zh_name: 关系依据
        type: string
        required: false
      directionNote:
        zh_name: 方向说明
        type: string
        required: false

  companyRelatesToCompany:
    zh_name: 公司关联公司
    group: target_graph_relations
    source_types: [Company]
    target_types: [Company]
    direction: directed
    cardinality: many_to_many
    description: 公司之间的业务关系，用于显式表达供应、代工、渠道、合作、竞争、投资控制、授权等关系。
    properties:
      businessRelationType:
        zh_name: 公司业务关系类型
        type: enum
        enum: [supplies_to, manufactures_for, distributes_for, partners_with, competes_with, invests_in, controls, licenses_to]
        required: true
      relationBasis:
        zh_name: 关系依据
        type: string
        required: false
      directionNote:
        zh_name: 方向说明
        type: string
        required: false

  productRelatesToProduct:
    zh_name: 产品关联产品
    group: target_graph_relations
    source_types: [Product]
    target_types: [Product]
    direction: directed
    cardinality: many_to_many
    description: 产品之间的依赖、替代、互补、代际、部件、集成、竞争或使能关系。
    properties:
      productRelationType:
        zh_name: 产品关系类型
        type: enum
        enum: [depends_on, substitutes, complements, next_generation_of, component_of, integrates_with, competes_with, enables]
        required: true
      relationBasis:
        zh_name: 关系依据
        type: string
        required: false
      comparableCondition:
        zh_name: 可比条件
        type: string
        required: false
      dependencyStrength:
        zh_name: 依赖强度
        type: enum
        enum: [critical, major, minor, optional, unknown]
        required: false
        description: productRelationType=depends_on 或 component_of 时，源产品对目标产品的依赖强度。
      substitutionProfile:
        zh_name: 替代画像
        type: object
        required: false
        description: productRelationType=substitutes 时必填；描述替代边界而非简单 yes/no。
        properties:
          substitutionLayer:
            type: enum
            enum: [material, device, module, architecture, form_factor, unknown]
          performanceEquivalence:
            type: enum
            enum: [equivalent, partial, inferior, superior, unknown]
          costEquivalence:
            type: enum
            enum: [lower, comparable, higher, unknown]
          customerQualificationStage:
            type: enum
            enum: [concept, lab, pilot, qualification, production, unknown]
          timeToScale:
            type: string
          supplyCapacity:
            type: string
          reliabilityStatus:
            type: enum
            enum: [unverified, in_test, qualified, production_ready, unknown]
          substitutionRatio:
            type: string
            description: 可替代比例，如 0-30%、部分场景替代。

  productUsesProduct:
    zh_name: 产品使用产品（BOM）
    group: target_graph_relations
    source_types: [Product]
    target_types: [Product]
    direction: directed
    cardinality: many_to_many
    description: >
      产品级 BOM 依赖：源产品（如光模块）在组装或交付中使用目标产品（如激光器、调制器）作为关键部件。
      与 productRelatesToProduct.depends_on 相比，本关系专用于可定位的物理组成链路，要求填写 dependencyStrength、
      applicableRoutes 和 quantityRole，以支持供应链瓶颈定位。
    properties:
      dependencyStrength:
        zh_name: 依赖强度
        type: enum
        enum: [critical, major, minor, optional, unknown]
        required: true
      quantityRole:
        zh_name: 用量角色
        type: enum
        enum: [single_unit, per_channel, per_port, per_module, batch_input, unknown]
        required: false
      applicableRoutes:
        zh_name: 适用技术路线
        type: array
        required: false
        description: 如 EML、硅光、CPO；空表示全路线通用。
        items:
          type: string
      leadTimeSensitivity:
        zh_name: 交期敏感度
        type: enum
        enum: [high, medium, low, unknown]
        required: false
      relationBasis:
        zh_name: 关系依据
        type: string
        required: false

  materialUsedInProduct:
    zh_name: 材料用于产品
    group: target_graph_relations
    source_types: [Material]
    target_types: [Product]
    direction: directed
    cardinality: many_to_many
    description: 材料具体用于某产品，补充 materialUsedInSegment 的环节级表达。
    properties:
      usageRole:
        zh_name: 用途角色
        type: enum
        enum: [core_input, auxiliary_input, process_material, packaging_material, consumable, substrate]
        required: true
      relationBasis:
        zh_name: 关系依据
        type: string
        required: false

  productHasMaterialDependency:
    zh_name: 产品或技术路线存在材料依赖
    group: target_graph_relations
    source_types: [Product]
    target_types: [Material]
    direction: directed
    cardinality: many_to_many
    description: 产品、架构或技术路线对某类材料存在结构性依赖。增强、削弱、迁移、不确定等方向性变化属于判断推理域，应由 StateHypothesis、Signal、InferenceRule 或 ScenarioPath 表达。
    properties:
      dependencyRole:
        zh_name: 依赖角色
        type: enum
        enum: [core_input, enabling_input, auxiliary_input, process_material, route_specific_input, optional_input, substitutable_input, unknown]
        required: true
      relationBasis:
        zh_name: 关系依据
        type: string
        required: false
      boundaryCondition:
        zh_name: 边界条件
        type: string
        required: false
      dependencyIntensity:
        zh_name: 依赖强度量化提示
        type: object
        required: false
        description: 材料在产品或路线中的用量/成本/性能权重提示，供瓶颈定位而非直接下投资结论。
        properties:
          qualitativeStrength:
            type: enum
            enum: [critical, major, minor, optional, unknown]
          materialLayer:
            type: enum
            enum: [substrate, epitaxy, wafer, device, packaging, unknown]

  materialRelatesToMaterial:
    zh_name: 材料关联材料
    group: target_graph_relations
    source_types: [Material]
    target_types: [Material]
    direction: directed
    cardinality: many_to_many
    description: 材料之间的替代、前驱、伴生、工艺互补或产能竞争关系。
    properties:
      materialRelationType:
        zh_name: 材料关系类型
        type: enum
        enum: [substitutes, precursor_of, co_product_of, process_complement_of, capacity_competes_with]
        required: true
      relationBasis:
        zh_name: 关系依据
        type: string
        required: false

  assetExposedToTarget:
    zh_name: 资产暴露到标的对象
    group: target_graph_relations
    source_types: [Asset]
    target_types: [Industry, Segment, Company, Product, Material, Concept, ObjectSet]
    direction: directed
    cardinality: many_to_many
    description: 资产标的对产业、环节、公司、产品、材料、概念或对象集合的业务暴露关系。若暴露对象是状态变量、信号、催化剂或事件，应进入判断推理域。
    properties:
      exposureType:
        zh_name: 敞口类型
        type: enum
        enum: [revenue_exposure, cost_exposure, supply_chain_exposure, valuation_exposure, theme_exposure, policy_exposure, other, unknown]
        required: true
      exposureBasis:
        zh_name: 敞口依据
        type: enum
        enum: [annual_report, research_report, company_announcement, manual_judgment, index_constituent, rule_screen, other, unknown]
        required: true
      exposureStrength:
        zh_name: 敞口强度
        type: enum
        enum: [strong, medium, weak, unknown]
        required: false
      asOfDate:
        zh_name: 敞口确认日期
        type: date
        required: false

  setContainsMember:
    zh_name: 集合包含成员
    group: research_target_relations
    source_types: [ObjectSet]
    target_types: [Company, Asset, Product, Material, Segment, Industry]
    direction: directed
    cardinality: many_to_many
    description: 对象集合显式包含某成员对象。rule_based 集合也可保留解析快照成员。
    properties:
      membershipBasis:
        zh_name: 纳入依据
        type: string
        required: true
