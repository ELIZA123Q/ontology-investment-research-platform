schema_name: contracts_platform
schema_version: 1.0.0
namespace: investment_ontology
status: active
description: >
  OntoFactory InP v1 的 CLI 生产编排与发布契约。研究问答、用户会话和
  RuntimeEvidenceSnapshot 均由独立 OntoRuntime 持有。

factory_boundary:
  repository_role: OntoFactory
  answers_research_questions: false
  produces_final_research_report: false
  owns_user_conversation_state: false
  owns_runtime_evidence_snapshot: false
  formal_bundle_sole_writer: promote

production_orchestrator_contract:
  implementation: scripts/factory/production_orchestrator.py
  orchestrator_name: ProductionOrchestrator
  task_executor:
    implementation: scripts/factory/asset_production_executor.py
    name: AssetProductionExecutor
    formal_bundle_write_allowed: false
  sequence:
    - production_task
    - source_registry
    - evidence_normalization
    - candidate_asset_package
    - review_decision
    - promote
    - publish_runtime_package
  candidate_terminal: CandidateAssetPackage

factory_cli_contract:
  implementation: scripts/factory/factory_cli.py
  transport: blocking_cli
  commands:
    - produce
    - review
    - promote
    - publish
  asynchronous_api: deferred_to_v1_1

promotion_contract:
  implementation: scripts/factory/promotion.py
  consumes: ReviewDecision
  requires_review_status: approved
  emits: PromotionReceipt
  rejected_review_mutates_bundle: false

runtime_package_publish_contract:
  implementation: scripts/factory/compile_runtime_package.py
  validator: scripts/factory/validate_runtime_package.py
  output_location: runtime_packages/<scenario_id>/<package_version>/
  engineering_name: RuntimePackage
  display_alias: Skill 包
  factory_path_dependency_allowed: false

deferred_to_v1_1:
  - asynchronous_factory_api
  - generic_search_provider
  - generic_document_fetcher
  - multi_model_adapter
  - automatic_step_recovery
  - visualization_api
  - review_ui
