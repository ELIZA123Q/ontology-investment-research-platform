schema_name: common
schema_version: 0.1.0
namespace: investment_ontology
status: draft
canonical_rule: YAML 是正式机器约束；Markdown 只负责解释和示例。
description: 投研本体公共定义——时间类型、ID规则、公共枚举、公共契约、域映射、状态变量类别、去重策略、关系公共约束和动作公共约束。本文件被所有域专属 objects_*.yaml、relations_*.yaml、actions_*.yaml 和 policies_*.yaml 引用。actor_roles、trigger_types、action_groups 和 audit_policy 属于跨域公共动作定义，只在 common.yaml 定义；各域 actions 文件只定义本域动作并引用这些公共约束。

schema_parts:
  - schemas/common_identity.yaml
  - schemas/common_enums.yaml
  - schemas/public_contracts.yaml
