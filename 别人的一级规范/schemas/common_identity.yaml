schema_name: common_identity
schema_version: 0.1.0
namespace: investment_ontology
status: draft
canonical_rule: YAML 是正式机器约束；Markdown 只负责解释和示例。
description: 投研本体公共定义——时间类型、ID规则、公共枚举、公共契约、域映射、状态变量类别、去重策略、关系公共约束和动作公共约束。本文件被所有域专属 objects_*.yaml、relations_*.yaml、actions_*.yaml 和 policies_*.yaml 引用。actor_roles、trigger_types、action_groups 和 audit_policy 属于跨域公共动作定义，只在 common.yaml 定义；各域 actions 文件只定义本域动作并引用这些公共约束。

global_research_output_boundary:
  description: 投研本体体系只表达研究判断、证据、预期差、资产影响和复盘，不承接投资决策或交易执行。
  forbidden_output_types:
    - buy_or_sell_recommendation
    - target_price
    - return_forecast
    - position_sizing_advice
  forbidden_phrases_zh: [买卖建议, 目标价, 收益率预测, 仓位建议]
  reference_rule: 任务型 Skill 和 Markdown 文档只引用本契约，不再分别维护禁止输出清单。

time_types:
  business_time: 现实世界中事实、信号、判断或影响发生和生效的时间。
  system_time: 系统记录、创建、修改或审核对象的时间。

identity_and_governance:
  instance_id_rule: 所有实例必须有稳定 id；id 不承载业务结论，只用于引用。
  instance_id_pattern: "{namespace}-{prefix}-{YYYYMMDD}-{serial}"
  namespace_rule: namespace 由本体包 manifest 或运行上下文声明；跨本体包合并时保留来源 namespace，避免不同本体包中同类对象 ID 冲突。
  owner_bundle_rule: 每个业务资产实例必须声明 owner_bundle_id；非 owner bundle 只能通过 external_ref 引用、扩展或提交 PatchRequest，不得复制一份并各自维护。
  normalized_key_rule: 可去重资产应声明 normalizedKey 或在 bundle manifest 中声明生成规则；去重不得只依赖展示名称。
  relation_id_pattern: "REL-{YYYYMMDD}-{serial}"
  action_audit_id_pattern: "AA-{YYYYMMDD}-{serial}"
  review_record_id_pattern: "RR-{YYYYMMDD}-{serial}"
  object_id_prefixes:
    ConceptScheme: CS
    Concept: CON
    ConceptBoundary: CB
    Industry: IND
    Segment: SEG
    Company: COM
    Product: PRD
    Material: MAT
    Asset: AST
    ObjectSet: OS
    StateVariable: SV
    StateVariableObservation: OBS
    StateVariablePropagation: SVP
    DerivedMetric: DM
    Event: EVT
    StateHypothesis: SH
    Signal: SIG
    JudgmentOutput: JO
    MarketExpectation: MEXP
    AssetImpact: AI
    InvestmentThesis: TH
    ScenarioModel: SMOD
    SourceDocument: SRC
    EvidenceEpisode: EPI
    EvidenceClaim: ECL
    EvidenceFact: EF
    PatchRequest: PRQ
    PatchLedgerItem: PLI
    ActionProposal: APROP
    LogicFunction: LF
    LogicBlock: LB
    AutomateFlow: AF
    ObjectViewSpec: OVS
    EvalCase: EC
    EvalSuite: ES
    EvalRun: ERUN
    EvalResult: ERES
    MetricSnapshot: MS
    InferenceRule: IRL
    ConductionTemplate: CT
    ScenarioPath: SP
    Monitor: MON
    ScenarioSimulation: SIM
    HypotheticalInput: HYP
    SimulatedImpact: SIMP
    InferenceRun: IR
    RuleApplication: RA
    ReasoningStep: RS
    ActionFollowup: AFU
    ActionAudit: AA
    ReviewRecord: RR
  governance_layers:
    ontology_core: 本体层，全公司共享，改动需本体维护方评审。
    industry_extension: 行业扩展层，由行业负责人维护，可沉淀行业模板和行业特有变量。
    team_workspace: 团队工作区层，只承载人的判断、运行状态和复盘，不改变正式本体结构。
  common_fields_applied_to_all_object_types:
    inheritance_rule: 实例文件可在容器级声明默认值；若对象实例未显式填写 governanceLayer 或 recordStatus，可继承容器默认值。正式入库时系统应补齐为实例字段。
    id:
      zh_name: 实例 ID
      type: string
      required: true
      generated_by: system
    governanceLayer:
      zh_name: 治理层级
      type: enum
      enum: [ontology_core, industry_extension, team_workspace]
      required: true
      default: team_workspace
    recordStatus:
      zh_name: 记录状态
      type: enum
      enum: [candidate, draft, review_pending, active, confirmed, rejected, deprecated, superseded, quarantined, archived]
      required: true
      default: candidate
    owner_bundle_id:
      zh_name: Owner Bundle ID
      type: string
      required: false
      description: 业务资产的唯一维护归属。核心规范包对象可为空；业务 bundle 中的对象、关系、变量、规则、证据事实和判断资产应填写。
    external_ref:
      zh_name: 外部引用
      type: array
      required: false
      description: 指向其他 bundle 资产的只读引用；跨包使用应引用 owner 资产，不复制完整实体。
    markings:
      zh_name: 合规标记
      type: object
      required: false
      description: 引用 classification_markings 各维度取值；缺省继承 bundle manifest.default_markings。派生对象由系统按 propagation_rule 计算，不得手填低于输入的标记。
      properties:
        confidentiality:
          type: enum
          enum_ref: classification_markings.confidentiality
        information_barrier:
          type: enum
          enum_ref: classification_markings.information_barrier
        license_scope:
          type: enum
          enum_ref: classification_markings.license_scope
        derivedFrom:
          type: array
          description: 计算本标记所依据的输入对象 ID 列表，供审计回放。
    originType:
      zh_name: 来源血统类型
      type: enum
      enum_ref: originType
      required: false
      description: >
        标识实例最初由人工录入、来源抽取、系统计算还是 AI 派生。
        ai_derived 默认只能进入 candidate/draft/review_pending 或 staging；
        晋升正式资产必须经过证据、反证、预期差和复盘/审核门禁。
    normalizedKey:
      zh_name: 归一键
      type: string
      required: false
      description: 用于跨 Skill、跨 bundle 去重的稳定归一键，生成规则由公共契约或 bundle manifest 声明。
    properties:
      zh_name: 公共属性扩展槽
      type: object
      required: false
      description: 对象自身的通用扩展属性；不得承载应建模为显式关系的连接。
    domainProperties:
      zh_name: 领域属性扩展槽
      type: object
      required: false
      description: 行业 bundle 或主题 bundle 定义的领域属性。
    scenarioProperties:
      zh_name: 场景属性扩展槽
      type: object
      required: false
      description: scenario_pack 局部使用的属性；具备复用价值时应通过 PatchRequest 合入 owner bundle。
    extensionFields:
      zh_name: 扩展字段
      type: object
      required: false
      description: 向后兼容扩展槽；新增公共字段前可先在此试运行，稳定后再进入 schema。
    extractionConfidence:
      zh_name: AI 抽取置信度
      type: number
      required: false
      value_range: [0, 1]
    confirmedBy:
      zh_name: 确认人
      type: string
      required: false
    confirmedAt:
      zh_name: 确认时间
      type: datetime
      time_type: system_time
      required: false
    validFrom:
      zh_name: 有效开始时间
      type: datetime
      time_type: business_time
      required: false
      description: 事实、关系、信号、判断或证据在现实世界中开始适用的时间；不适用时留空。
    validTo:
      zh_name: 有效结束时间
      type: datetime
      time_type: business_time
      required: false
      description: 事实、关系、信号、判断或证据在现实世界中停止适用的时间；未知时留空。
    observedAt:
      zh_name: 观测时间
      type: datetime
      time_type: business_time
      required: false
      description: 来源材料声称、披露或观察到该事实的业务时间。
    learnedAt:
      zh_name: 系统获知时间
      type: datetime
      time_type: system_time
      required: false
      generated_by: system
      description: 系统把该对象、关系或证据纳入候选图谱的时间。
    invalidatedAt:
      zh_name: 失效记录时间
      type: datetime
      time_type: system_time
      required: false
      description: 该记录被新证据标记为不再适用的系统时间；历史记录不得物理删除。
    invalidatedBy:
      zh_name: 失效依据
      type: object_ref
      required: false
      description: 指向触发失效的 EvidenceClaim、EvidenceFact、Signal、PatchLedgerItem 或 ReviewRecord。
    supersedes:
      zh_name: 替代旧记录
      type: array
      required: false
      description: 当前记录替代的旧 claim、fact、signal、relation 或 patch ID。
    supersededBy:
      zh_name: 被新记录替代
      type: array
      required: false
      description: 替代当前记录的新 claim、fact、signal、relation 或 patch ID。
  naming_rules:
    - 英文字段名使用 lowerCamelCase；对象类型使用 PascalCase；关系和动作使用 lowerCamelCase 或 PascalCase，保持本文件已有命名。
    - zh_name 用于展示，不得作为机器主键。
    - 同一实例的 name/title 可修订，id 不可修订。
  enum_deprecation_policy:
    description: 公共枚举的废弃、迁移和兼容规则。枚举值变更必须先进入兼容期，再由迁移补丁收口。
    deprecation_states: [active, deprecated_pending_migration, retired]
    required_fields_for_deprecation:
      - enum_name
      - deprecated_value
      - preferred_value
      - migration_operation
      - effective_from
      - review_record_id
    migration_operation_enum_ref: patchOperation
    consumer_rule: consumer 读取枚举时接受 active 和 deprecated_pending_migration；写入新实例时使用 active 值；retired 值只允许在历史记录中保留。
    patch_rule: 枚举迁移必须生成 PatchRequest.operation=migrate，并由 PatchLedgerItem 记录迁移结果。

enum_deprecations:
  - enum_name: orchestrationStepType
    deprecated_value: llm_reasoning
    preferred_value: invoke_function
    migration_operation: migrate
    effective_from: core_v1_logic_function_convergence
    review_record_id: core-policy-logic-function-convergence
    deprecation_state: deprecated_pending_migration
    legacy_read_allowed: true
    active_write_allowed: false
  - enum_name: orchestrationStepType
    deprecated_value: action_proposal
    preferred_value: invoke_function
    migration_operation: migrate
    effective_from: core_v1_logic_function_convergence
    review_record_id: core-policy-logic-function-convergence
    deprecation_state: deprecated_pending_migration
    legacy_read_allowed: true
    active_write_allowed: false
  - enum_name: orchestrationStepType
    deprecated_value: report_render
    preferred_value: invoke_function
    migration_operation: migrate
    effective_from: core_v1_logic_function_convergence
    review_record_id: core-policy-logic-function-convergence
    deprecation_state: deprecated_pending_migration
    legacy_read_allowed: true
    active_write_allowed: false
