schema_name: policies_reasoning
schema_version: 0.1.0
namespace: investment_ontology
status: draft
depends_on:
  objects_schema: objects_reasoning.yaml
  relations_schema: relations_reasoning.yaml
canonical_rule: YAML 是正式机器约束；Markdown 只负责解释和示例。
description: >
  推理链六层之间的形式化门禁条件。定义从一层过渡到下一层时
  必须满足的结构化条件、最低证据等级、阻断条件和可机器校验的规则。

# ============================================================
# expression 原子类型说明
# ============================================================
expression_types:
  field_value:
    description: 对象字段值比较
    params:
      object_type: 对象类型（可选，用于非当前上下文的对象检查）
      field: 字段名
      operator: [eq, neq, gt, gte, lt, lte, in, not_in]
      value: 比较值或值数组

  relation_exists:
    description: 检查指定关系类型是否存在
    params:
      relation: 关系类型名（来自 relations.yaml）
      source_type: 源对象类型（可选）
      target_type: 目标对象类型（可选）
      min_count: 最小存在数量（默认 1）

  relation_or_field_exists:
    description: 检查多个关系或字段中至少满足 min_match 个
    params:
      relations: 关系类型名列表
      fields: 字段名列表
      min_match: 最少满足数量

  signal_count:
    description: 检查指定 role 的 Signal 数量
    params:
      signalRole: [validation, catalyst, tracking, weakening, blocking]
      relation: 效果关系类型
      min_count: 最少数量
      independent_sources_required: 是否要求独立来源（boolean）

  field_present:
    description: 检查字段非空
    params:
      object_type: 对象类型（可选）
      field: 字段名

  step_type_exists:
    description: 检查 ReasoningStep 中是否存在指定 step_type
    params:
      step_type: ReasoningStep.step_type 枚举值
      min_count: 最少出现次数

  composite:
    description: 逻辑组合条件
    params:
      operator: [and, or, not]
      conditions: 子条件表达式数组

# ============================================================
# 独立来源、冷启动准入与资产定价观测契约
# ============================================================
independent_source_criteria:
  description: 定义 signal_count.independent_sources_required=true 时如何判断 Signal 是否来自独立来源。
  source_trace_paths:
    - path: Signal -> signalBasedOnObservation -> StateVariableObservation -> sourceOf <- SourceDocument
      description: Signal 基于状态观测，观测可追溯到 SourceDocument。
    - path: Signal -> signalBasedOnEvent -> Event -> sourceOf <- SourceDocument
      description: Signal 基于事件，事件可追溯到 SourceDocument。
    - path: SourceDocument -> sourceOf -> Signal
      description: SourceDocument 直接作为 Signal 的来源。
  independence_rules:
    - rule_id: ISR_SOURCE_ID
      description: canonicalSourceId 不同的 SourceDocument 才能计为不同来源。
      required: true
    - rule_id: ISR_ORIGINAL_OWNER
      description: sourceOwner 不同，或 sourceForm 属于 original_pdf、official_page、data_feed、database_feed、original_file、research_report 时，可计为独立来源。
      required: true
    - rule_id: ISR_REPOST_INHERITANCE
      description: repost_page、ai_summary、manual_input 继承其原始来源 canonicalSourceId；缺少原始来源时只作为线索，不计入独立来源数量。
      required: true
    - rule_id: ISR_SAME_TEXT_CLUSTER
      description: 文本高度相似且引用同一原始材料的来源视为同源转载，只计 1 个独立来源。
      required: true
  output_fields:
    - independentSourceCount
    - independentSourceIds
    - sourceDedupBasis

cold_start_template_admission:
  description: 冷启动生成的 InferenceRule、ConductionTemplate 和 ScenarioPath 是候选资产；进入行业扩展层复用前必须通过准入审核。
  eligible_types: [InferenceRule, ConductionTemplate, ScenarioPath]
  initial_status:
    InferenceRule: draft
    ConductionTemplate: draft
    ScenarioPath: draft
  activation_contract:
    required_review:
      review_object: ReviewRecord
      reviewType: admission
      reviewResult: approved
      relation: reviewFor
    required_source:
      relation: sourceOf
      sourceRole: template_basis
    required_fields:
      - applicable_scope
      - boundary_conditions
      - owner
      - version
    activation_layer: industry_extension
    activation_result:
      InferenceRule.ruleStatus: active
      ConductionTemplate.templateStatus: active
      ScenarioPath.templateStatus: active
  quality_rules:
    - 冷启动模板可参与候选推理和材料需求生成。
    - active 模板可被 InferenceRun 正式消费并写入 RuleApplication。
    - 未通过 admission 审核的模板保留为 draft，不进入本体包的复用资产池。

asset_pricing_observation_contract:
  description: 资产价格、估值、成交和市场反应以 StateVariable(category=asset_pricing) 与 StateVariableObservation 表达，供 MarketExpectation 和 AssetImpact 处理定价反映状态。
  state_variable_category: asset_pricing
  recommended_variables:
    - close_price
    - return_window
    - valuation_multiple
    - trading_volume
    - turnover_rate
    - implied_expectation
  required_relations:
    - observedOn
    - observationBindsVariable
  consumption_paths:
    - StateVariableObservation -> expectationBasedOnObservation -> MarketExpectation
    - StateVariableObservation -> signalBasedOnObservation -> Signal
    - MarketExpectation -> impactReferencesExpectation -> AssetImpact
  quality_rules:
    - 资产价格读数只作为观测和定价状态依据，不直接生成交易指令。
    - 价格隐含预期应记录为 expectationType=implied_pricing 的 MarketExpectation。
    - AssetImpact.pricedInAssessment 应引用 MarketExpectation.pricingStatus 或填写 expectationGapBasis。

judgment_record_flow_policy:
  description: >
    JudgmentRecord 是 team workspace 中的工作流记录，用于在用户明确要求持续跟踪或复盘时承接人的判断；
    它不是本体对象，不参与正式 runtime 默认加载。普通问题只生成当次 JudgmentOutput 和
    RuntimeEvidenceSnapshot，不自动创建长期记录。
  initial_scope: team_judgment_workflow
  contract_ref: schemas/工程交付与Bundle契约/contracts_workspace.yaml#judgment_record_contract
  persistence_policy:
    ordinary_question: no_persistence
    explicit_tracking_or_retrospect: create_or_update_judgment_record
    formal_runtime_loading: false
  canonical_flow:
    - step: raw_capture
      input: manual_input
      output: JudgmentRecord
      required_shape: workspace_workflow_record
      note: 记录原话、作者、时间、锚点、假设、候选变量、所需数据和证伪条件，不自动转为正式证据。
    - step: claim_normalization
      input: JudgmentRecord
      output: candidate EvidenceClaim
      allowed_claim_types: [author_judgment, assumption, forecast]
      note: 仅在 bundle workbench 的证据归一流程中生成候选，不把作者判断自动升级为事实观测。
    - step: hypothesis_capture
      input: EvidenceClaim
      output: StateHypothesis
      allowed_initial_status: proposed
      note: 允许先记录方向、时间尺度、依据和证伪条件。
    - step: candidate_judgment
      input: StateHypothesis
      output: JudgmentOutput
      allowed_initial_status: candidate
      note: candidate 判断允许基于 proposed 假设；必须声明 timeHorizon 与 horizonBucket。
    - step: tracking
      input: JudgmentOutput
      output: Monitor
      allowed_trigger_actions: [emit_tracking_signal, emit_weakening_signal, enqueue_retrospect, emit_notification]
      note: 验证点和证伪条件进入 Monitor 或 ReviewRecord 待复盘。
    - step: retrospect
      input: JudgmentOutput
      output: ReviewRecord
      required_review_type: retrospect
      note: 到期后只在 ReviewRecord 写入后验结果，不回写污染原判断创建时点。
    - step: method_reuse
      input: ReviewRecord
      output: [candidate_asset, PatchRequest]
      note: aggregationKey 在至少三个独立判断或历史案例中出现，或被行业 owner 明确认定为结构性缺口后，也只能进入候选区，不得自动晋升正式资产。
  capture_gate:
    candidate_judgment:
      allowed_basis_hypothesis_status: [proposed, active]
      required_fields: [judgmentContent, timeHorizon, horizonBucket]
      forbidden_outputs: [buy_sell_recommendation, target_price, return_forecast, position_advice]
  upgrade_gate:
    upgraded_statuses: [watchlist, active, formalTrigger]
    requires_active_hypothesis: true
    inherits_layer_gate: FG_SIGNAL_TO_JUDGMENT
    note: 升级不是记录动作；升级仍需证据、反证、竞争解释、时间尺度和预期差门禁。
  rule_promotion_gate:
    source_field: sourceJudgmentIds_or_judgment_record_refs
    requires_review_record:
      relation: reviewFor
      reviewType: retrospect
    note: 从 JudgmentRecord 沉淀出的候选规则、模板或路径必须能追溯到对应复盘记录，并经正式准入审核后才可写入 owner bundle。

judgment_status_ladder:
  description: 判断状态分层，区分轻量记录、观察、生效、正式触发、结算、降级和阻断。
  statuses:
    candidate:
      minimum_requirements: [research_anchor, time_horizon, directional_hypothesis, initial_basis, falsification_criteria]
      allowed_usage: [record, track, wait_for_validation]
    watchlist:
      minimum_requirements: [next_validation_checkpoint_or_tracking_signal]
      allowed_usage: [monitor_registry]
    active:
      minimum_requirements: [one_validation_signal, competing_explanations_checked, active_basis_hypothesis, no_active_blocking_signal]
      allowed_usage: [internal_analysis, continuous_tracking]
    formalTrigger:
      minimum_requirements: [two_independent_validation_signals, expectation_gap_checked, asset_impact_gate_passed]
      allowed_usage: [formal_research_output, research_workflow_trigger]
    resolved:
      minimum_requirements: [retrospect_recorded]
      allowed_usage: [rule_reuse, method_revision, error_attribution]
    downgraded:
      minimum_requirements: [downgrade_reason_recorded]
      downgrade_reasons: [evidence_insufficient, expectation_not_comparable, competing_explanation_stronger, catalyst_insufficient, priced_in]
      allowed_usage: [history_retention, low_confidence_reference]
    blocked:
      minimum_requirements: [blocking_reason_recorded]
      blocking_reasons: [core_hypothesis_falsified, critical_condition_absent, active_blocking_signal]
      allowed_usage: [stop_asset_impact_upgrade, review_only]
    deprecated:
      minimum_requirements: [deprecation_reason_recorded]
      allowed_usage: [archive_only]
  expectation_gap_downgrade_rule:
    no_market_expectation:
      allowed_output: observation_level_judgment
      forbidden_output: high_confidence_asset_impact
    fuzzy_expectation:
      allowed_output: low_confidence_expectation_gap
    explicit_expectation_snapshot:
      allowed_output: formal_expectation_gap_judgment
    implied_pricing_with_asset_pricing_observation:
      allowed_output: asset_impact_and_retrospect

# ============================================================
# 层间门禁定义
# ============================================================
layer_gates:
  # Gate 1: 事实与观测层 → 状态理解层
  - gate_id: FG_FACT_TO_STATE
    from_layer: 事实与观测层
    from_layer_index: 1
    from_types: [Event, StateVariableObservation]
    to_layer: 状态理解层
    to_layer_index: 2
    to_types: [StateVariablePropagation, StateHypothesis]
    zh_name: 事实观测到状态理解门禁
    description: 事件或观测触发状态传导或假设形成时，必须满足的条件。

    trigger_conditions:
      - condition_id: fg1_event_affects_variable
        zh_name: 事件影响已定义的变量
        expression:
          type: relation_exists
          params:
            relation: eventAffectsVariable
            min_count: 1
        required: true
        on_failure: observation_only
        description: Event 必须通过 eventAffectsVariable 绑定至少一个 StateVariable。

      - condition_id: fg1_observation_binds_variable
        zh_name: 观测绑定已定义变量
        expression:
          type: relation_exists
          params:
            relation: observationBindsVariable
            min_count: 1
        required: true
        on_failure: abort_with_gap
        description: StateVariableObservation 必须通过 observationBindsVariable 绑定 StateVariable。

      - condition_id: fg1_observation_is_fact_or_estimate
        zh_name: 观测值为事实或估算
        expression:
          type: field_value
          params:
            object_type: StateVariableObservation
            field: valueType
            operator: in
            value: [actual, estimated]
        required: true
        on_failure: block_with_reason
        description: StateVariableObservation.valueType 必须是 actual 或 estimated；forecast、guidance、judgment 和 recommendation 应进入 Signal、StateHypothesis 或 MarketExpectation。

    required_evidence_level:
      minimum: single_source_candidate
      ideal: multi_source
      description: 形成 StateHypothesis 的观测至少需要单一来源候选，理想情况多来源支撑。

    blocking_conditions:
      - condition_id: fg1_blk_variable_not_defined
        description: StateVariableObservation 绑定的 StateVariable 不存在于本体中。
        action: abort_with_gap
    validation_rules:
      - rule_id: FG_FACT_STATE_V1
        zh_name: 观测必须绑定已定义变量
        description: observationBindsVariable 的目标必须为 objects.yaml 中存在的 StateVariable 类型。
        severity: error
      - rule_id: FG_FACT_STATE_V2
        zh_name: 事件必须具有明确的时间
        description: Event.eventTime 不得为空。
        severity: error

  # Gate 2: 状态理解层 → 信号验证层
  - gate_id: FG_STATE_TO_SIGNAL
    from_layer: 状态理解层
    from_layer_index: 2
    from_types: [StateVariablePropagation, StateHypothesis]
    to_layer: 信号验证层
    to_layer_index: 3
    to_types: [Signal]
    zh_name: 状态理解到信号验证门禁
    description: 状态假设形成后，信号被赋予验证/削弱/阻断角色时必须满足的条件。

    trigger_conditions:
      - condition_id: fg2_hypothesis_accepts_signal
        zh_name: 假设可接收信号
        expression:
          type: field_value
          params:
            object_type: StateHypothesis
            field: hypothesisStatus
            operator: in
            value: [proposed, active]
        required: true
        on_failure: block_with_reason
        description: proposed 假设可接收 validation、weakening 或 blocking 信号作为激活、修正或阻断依据；只有 active 假设可支撑 JudgmentOutput 升级。

      - condition_id: fg2_signal_has_source
        zh_name: 信号有证据来源
        expression:
          type: relation_or_field_exists
          params:
            relations: [signalBasedOnObservation, signalBasedOnEvent, sourceOf]
            min_match: 1
        required: true
        on_failure: lower_confidence
        description: Signal 必须能追溯到观测、事件或来源文档；sourceOf 的方向为 SourceDocument -> Signal。

      - condition_id: fg2_signal_role_matches_relation
        zh_name: 信号角色与效果关系匹配
        expression:
          type: relation_or_field_exists
          params:
            relations: [supportsHypothesis, supportsJudgment, catalyzesJudgment,
                        tracksHypothesis, tracksJudgment, weakensHypothesis,
                        weakensJudgment, blocksHypothesis]
            min_match: 1
        required: true
        on_failure: abort_with_gap
        description: Signal 必须建立至少一条与其 signalRole 兼容的效果关系（参见 objects.yaml 中 role_compatible_relations）。

    required_evidence_level:
      minimum: single_source_candidate
      description: Signal 必须至少有一条可追溯的证据来源。

    blocking_conditions:
      - condition_id: fg2_blk_conflicting_signal_active
        description: 存在 active 状态的矛盾信号（如同时有 validation 和 blocking 针对同一假设）。
        action: require_manual_review

    validation_rules:
      - rule_id: FG_STATE_SIG_V1
        zh_name: signalRole 与效果关系一致
        description: Signal 的 signalRole 必须与它建立的效果关系类型兼容（参见 relations.yaml 的 role_compatible_relations）。
        severity: error
      - rule_id: FG_STATE_SIG_V2
        zh_name: blocking 信号只作用于假设
        description: signalRole=blocking 的 Signal 只能通过 blocksHypothesis 作用于 StateHypothesis。
        severity: error

  # Gate 3: 信号验证层 → 判断与影响层
  - gate_id: FG_SIGNAL_TO_JUDGMENT
    from_layer: 信号验证层
    from_layer_index: 3
    from_types: [Signal]
    to_layer: 判断与影响层
    to_layer_index: 4
    to_types: [JudgmentOutput, MarketExpectation, AssetImpact]
    zh_name: 信号验证到判断影响门禁
    description: 信号积累到足够强度后，判断升级或资产影响派生时必须满足的条件。

    trigger_conditions:
      - condition_id: fg3_validation_signal_count
        zh_name: active 验证信号存在
        expression:
          type: composite
          params:
            operator: and
            conditions:
              - type: signal_count
                params:
                  signalRole: validation
                  relation: supportsJudgment
                  min_count: 1
                  independent_sources_required: false
              - type: field_value
                params:
                  field: judgmentStatus
                  operator: in
                  value: [watchlist]
        required: true
        on_failure: block_upgrade
        description: 判断从 watchlist 升级到 active 需要至少 1 条 validation 信号；两条独立验证信号是 formalTrigger 门槛。

      - condition_id: fg3_formal_trigger_validation_signal_count
        zh_name: formalTrigger 独立验证信号数量足够
        expression:
          type: composite
          params:
            operator: and
            conditions:
              - type: signal_count
                params:
                  signalRole: validation
                  relation: supportsJudgment
                  min_count: 2
                  independent_sources_required: true
              - type: field_value
                params:
                  field: judgmentStatus
                  operator: in
                  value: [active]
        required: false
        on_failure: block_formal_trigger
        description: 判断从 active 升级到 formalTrigger 需要至少 2 条独立来源的 validation 信号。

      - condition_id: fg3_competing_explanations_filled
        zh_name: 竞争解释已填写
        expression:
          type: field_present
          params:
            object_type: JudgmentOutput
            field: competingExplanations
        required: true
        on_failure: block_upgrade
        description: JudgmentOutput 进入 active 前必须填写 competingExplanations。

      - condition_id: fg3_basis_hypothesis_active
        zh_name: 基础假设为 active
        expression:
          type: field_value
          params:
            object_type: StateHypothesis
            field: hypothesisStatus
            operator: eq
            value: active
        required: true
        on_failure: block_upgrade
        description: 判断所基于的 StateHypothesis 必须为 active 状态。

      - condition_id: fg3_time_horizon_declared
        zh_name: 判断时间尺度已声明
        expression:
          type: composite
          params:
            operator: and
            conditions:
              - type: field_present
                params:
                  object_type: JudgmentOutput
                  field: timeHorizon
              - type: field_present
                params:
                  object_type: JudgmentOutput
                  field: horizonBucket
        required: true
        on_failure: block_upgrade
        description: JudgmentOutput 必须明确自然语言时间窗口和标准时间尺度。

      - condition_id: fg3_market_expectation_context
        zh_name: 预期上下文已检查
        expression:
          type: relation_exists
          params:
            relation: judgmentComparedWithExpectation
            source_type: JudgmentOutput
            target_type: MarketExpectation
            min_count: 1
        required: false
        on_failure: lower_confidence
        description: 形成资产影响前应尽量与 MarketExpectation 建立比较；无法取得预期时必须在 RuleApplication 中记录缺口并降低置信度。

    required_evidence_level:
      minimum: staged
      description: active 至少需要一条验证信号；formalTrigger 和可沉淀的正式判断需要多来源证据支撑。

    blocking_conditions:
      - condition_id: fg3_blk_active_blocking_signal
        description: 存在 active blocking Signal 作用于支撑该判断的 StateHypothesis。
        action: block_upgrade
      - condition_id: fg3_blk_no_asset_impact_without_judgment
        description: AssetImpact 无法在无关联 JudgmentOutput 的情况下独立创建。
        action: block_with_reason
      - condition_id: fg3_blk_asset_impact_without_time_horizon
        description: AssetImpact 缺少 timeHorizon 或 horizonBucket 时不得创建。
        action: block_with_reason

    validation_rules:
      - rule_id: FG_SIG_JUD_V1
        zh_name: 判断必须基于 active 假设
        description: basedOnHypothesis 指向的 StateHypothesis.hypothesisStatus 必须为 active。
        severity: error
      - rule_id: FG_SIG_JUD_V2
        zh_name: 资产影响必须从判断派生
        description: AssetImpact 必须通过 impactDerivedFrom 关系绑定到 JudgmentOutput。
        severity: error
      - rule_id: FG_SIG_JUD_V3
        zh_name: 判断必须带时间尺度
        description: JudgmentOutput 必须填写 timeHorizon 与 horizonBucket。
        severity: error
      - rule_id: FG_SIG_JUD_V4
        zh_name: 资产影响必须处理预期差
        description: AssetImpact 必须填写 expectationGapDirection；非 unknown 时应关联 MarketExpectation 或填写 expectationGapBasis。
        severity: warning

  # Gate 4: 判断与影响层 → 规则与模板层
  - gate_id: FG_JUDGMENT_TO_RULES
    from_layer: 判断与影响层
    from_layer_index: 4
    from_types: [JudgmentOutput, MarketExpectation, AssetImpact]
    to_layer: 规则与模板层
    to_layer_index: 5
    to_types: [InferenceRule, ConductionTemplate, ScenarioPath]
    zh_name: 判断影响到规则模板门禁
    description: 判断结论沉淀为可复用规则或模板时必须满足的条件。

    trigger_conditions:
      - condition_id: fg4_judgment_resolved
        zh_name: 判断已结算或过期
        expression:
          type: field_value
          params:
            object_type: JudgmentOutput
            field: judgmentStatus
            operator: in
            value: [resolved, expired]
        required: true
        on_failure: observation_only
        description: 只有已结算（resolved/expired）的判断才能沉淀为可复用规则。

      - condition_id: fg4_retrospect_recorded
        zh_name: 复盘结论已记录
        expression:
          type: relation_exists
          params:
            relation: reviewFor
            source_type: ReviewRecord
            target_type: JudgmentOutput
            min_count: 1
        required: true
        on_failure: require_manual_review
        description: 沉淀规则前应有复盘结论支撑。

    required_evidence_level:
      minimum: multi_source_supported
      description: 沉淀为可复用规则需要多来源支撑的证据。

    validation_rules:
      - rule_id: FG_JUD_RUL_V1
        zh_name: 规则输入输出类型必须存在
        description: InferenceRule.inputObjectTypes 和 outputObjectTypes 必须引用 objects.yaml 中存在的对象类型。
        severity: error
      - rule_id: FG_JUD_RUL_V2
        zh_name: 传导模板不得绕过传导逻辑
        description: ConductionTemplate 不得绕过 StateVariablePropagation 直接定义变量间因果。
        severity: error

  # Gate 5: 规则与模板层 → 运行轨迹层
  - gate_id: FG_RULES_TO_TRACE
    from_layer: 规则与模板层
    from_layer_index: 5
    from_types: [InferenceRule, ConductionTemplate, ScenarioPath]
    to_layer: 运行轨迹层
    to_layer_index: 6
    to_types: [InferenceRun, RuleApplication, ReasoningStep]
    zh_name: 规则模板到运行轨迹门禁
    description: 规则被推理运行时消费并生成轨迹记录时必须满足的条件。

    trigger_conditions:
      - condition_id: fg5_rule_active
        zh_name: 规则状态为 active
        expression:
          type: field_value
          params:
            object_type: InferenceRule
            field: ruleStatus
            operator: eq
            value: active
        required: true
        on_failure: abort_with_feedback
        description: 只有 active 状态的 InferenceRule 才能被推理运行引用。

      - condition_id: fg5_template_active
        zh_name: 模板状态为 active
        expression:
          type: field_value
          params:
            object_type: ConductionTemplate
            field: templateStatus
            operator: eq
            value: active
        required: false
        on_failure: use_fallback
        description: 优先使用 active 状态的 ConductionTemplate。

      - condition_id: fg5_ontology_version_recorded
        zh_name: 本体版本已记录
        expression:
          type: field_present
          params:
            object_type: InferenceRun
            field: ontologyVersion
        required: true
        on_failure: block_with_reason
        description: InferenceRun 必须记录 ontologyVersion，确保轨迹可复现。

    validation_rules:
      - rule_id: FG_RUL_TRA_V1
        zh_name: 废弃规则不得被引用
        description: ruleStatus=deprecated 的 InferenceRule 不得被新的 InferenceRun 引用。
        severity: error
      - rule_id: FG_RUL_TRA_V2
        zh_name: 运行轨迹必须可追溯
        description: 每个 RuleApplication 必须能追溯到其所属的 InferenceRun。
        severity: error

  # Gate 6: 运行轨迹层 → 事实与观测层（反馈闭环）
  - gate_id: FG_TRACE_TO_FEEDBACK
    from_layer: 运行轨迹层
    from_layer_index: 6
    from_types: [InferenceRun, RuleApplication, ReasoningStep]
    to_layer: 事实与观测层
    to_layer_index: 1
    to_types: [EvidenceEpisode, PatchRequest]
    zh_name: 运行轨迹到反馈闭环门禁
    description: 推理运行中的缺口、失败和反馈触发新一轮证据摄入或补丁请求的条件。

    trigger_conditions:
      - condition_id: fg6_gap_detected
        zh_name: 推理缺口已检测
        expression:
          type: step_type_exists
          params:
            step_type: gap_detection
            min_count: 1
        required: false
        on_failure: skip
        description: 推理过程中检测到对象、关系或证据缺口时触发反馈。

      - condition_id: fg6_run_blocked_or_failed
        zh_name: 推理运行阻塞或失败
        expression:
          type: field_value
          params:
            object_type: InferenceRun
            field: runStatus
            operator: in
            value: [blocked, failed]
        required: false
        on_failure: skip
        description: 推理运行未正常完成时触发反馈，记录阻塞原因。

    combined_trigger:
      operator: or
      description: fg6_gap_detected 或 fg6_run_blocked_or_failed 任一满足即可触发反馈闭环。

    outputs:
      - type: candidate_patch_request
        description: 缺口或失败可触发候选 PatchRequest 的创建建议。
      - type: ontology_feedback_record
        description: 运行反馈写入 InferenceRun.ontologyFeedback。

    required_evidence_level:
      minimum: no_evidence
      description: 反馈闭环是机制触发，不需要额外证据等级。

    validation_rules:
      - rule_id: FG_TRACE_FB_V1
        zh_name: 缺口步骤必须记录缺失类型
        description: step_type=gap_detection 的 ReasoningStep 必须记录缺失的对象类型、关系类型或证据类型。
        severity: warning

# ============================================================
# 门禁消费指引
# ============================================================
gate_consumption_guide:
  description: >
    推理 Skill（14-投研推理）在每次推理运行时，应按 traversal_order 遍历图谱，
    在每层边界检查对应的 layer_gate。门禁检查失败时，根据 on_failure 策略
    （block_upgrade / abort_with_gap / lower_confidence / observation_only / use_fallback / require_manual_review / skip）
    决定后续行为。

  consumer_responsibilities:
    - 每次层间过渡时，读取 schemas/判断推理域/policies_reasoning.yaml 的 layer_gates 检查对应 gate
    - 门禁不通过时，记录到 InferenceRun.ontologyFeedback 或 ReasoningStep.decision
    - 不得在门禁失败时静默跳过——必须显式记录原因和处理动作

  customizability:
    description: >
      行业扩展层（industry_extension）的本体可以在其自身的 governance.yaml 中
      覆盖 layer_gates 中的阈值（如 min_observations、min_signal_strength），
      但不得删除或绕过已定义的门禁。
    override_allowed_fields:
      - trigger_conditions 中的 min_count 值
      - required_evidence_level.minimum
      - blocking_conditions 中的 action（仅限从 block_with_reason 降级到 observation_only，不得反向）

action_gate_binding_policy:
  description: >
    actions_reasoning.yaml 中的状态流转动作只声明可执行模板和 effect 类型，
    具体阈值、信号数量、独立来源、预期差检查和升级门槛由本文件 layer_gates、
    InferenceRule、ConductionTemplate、ScenarioPath 或 bundle/scenario 扩展 policy 决定。
  action_bindings:
    ActivateSignal:
      gate_refs: [FG_STATE_TO_SIGNAL]
      allowed_effects: [update_fields, emit_audit, trigger_next_action]
      failure_destinations: [review_queue, block_next_action]
    CreateJudgmentOutput:
      gate_refs: [FG_SIGNAL_TO_JUDGMENT]
      default_status: candidate
      allowed_effects: [create_object, create_relation, emit_audit, trigger_next_action]
    UpgradeJudgmentToActive:
      gate_refs: [FG_SIGNAL_TO_JUDGMENT]
      threshold_refs: [fg3_validation_signal_count, fg3_competing_explanations_filled, fg3_basis_hypothesis_active, fg3_time_horizon_declared]
      overridable_by: [industry_bundle, theme_bundle, event_family_bundle, scenario_pack]
      non_overridable_rules:
        - 判断必须基于 active StateHypothesis。
        - active blocking Signal 存在时不得静默升级。
    UpgradeJudgmentToFormalTrigger:
      gate_refs: [FG_SIGNAL_TO_JUDGMENT]
      threshold_refs: [fg3_formal_trigger_validation_signal_count, fg3_market_expectation_context]
      non_overridable_rules:
        - formalTrigger 必须完成预期差检查。
        - formalTrigger 派生 AssetImpact 前必须通过资产影响门禁。
    CreateAssetImpact:
      gate_refs: [FG_SIGNAL_TO_JUDGMENT]
      threshold_refs: [fg3_market_expectation_context]
      allowed_effects: [create_object, create_relation, enqueue_review, emit_audit]
      failure_destinations: [review_queue, block_next_action]
  override_contract:
    fields: [policy_id, owner_bundle_id, scenario_id, base_gate_id, overridden_fields, override_reason, validFrom, validTo, review_record_id]
    rules:
      - 覆盖只能改变阈值或失败处理强度，不得删除公共必查项。
      - 覆盖必须有 owner_bundle_id；跨包覆盖必须通过 PatchRequest。
      - 覆盖被推理运行消费时，RuleApplication 必须记录 policy_id 或 rule_id。

# ============================================================
# 机器校验规则
# ============================================================
machine_validation_rules:
  - id: all_gates_have_trigger_conditions
    description: 所有 layer_gates 必须有至少一个 trigger_conditions。
    severity: error

  - id: gate_layer_indices_monotonic
    description: >
      对于非反馈闭环 gate（gate_id != FG_TRACE_TO_FEEDBACK），
      from_layer_index 必须 < to_layer_index。
    severity: error

  - id: gate_from_types_exist
    description: gate 中引用的 from_types 必须在 objects.yaml 的 object_types 中存在。
    severity: error

  - id: gate_to_types_exist
    description: gate 中引用的 to_types 必须在 objects.yaml 的 object_types 中存在。
    severity: error

  - id: gate_relations_exist
    description: >
      gate 的 expression.params 中引用的 relation 名称必须在 relations.yaml 的
      relation_types 中已定义。
    severity: error

  - id: gate_on_failure_actions_valid
    description: >
      on_failure 值必须在 [block_upgrade, abort_with_gap, abort_with_feedback,
      lower_confidence, observation_only, use_fallback, require_manual_review,
      block_with_reason, skip] 中。
    severity: error

  - id: gate_blocking_actions_valid
    description: >
      blocking_conditions 中的 action 值必须在
      [abort_with_gap, block_with_reason, require_manual_review, block_upgrade] 中。
    severity: error

  - id: gate_expression_type_valid
    description: >
      trigger_conditions 中 expression.type 必须在 expression_types 中已定义。
    severity: error

# ============================================================
# 推理判断生命周期状态机
# ============================================================
reasoning_judgment_lifecycle:
  description: >
    定义 candidate → observation → tracking → validated → invalidated/stale 的流转门槛。
    observation/tracking 是推理输出层级，不是 recordStatus；与 Event.eventStatus、Signal.signalStatus 协同。
  states:
    candidate:
      meaning: 有结构但证据未闭合或规则未触发。
      entry: 用户输入、材料初抽取、规则前置匹配。
      exit_to_observation:
        requires: [evidence_slot_bound_or_observation_recorded, no_blocking_counter]
    observation:
      meaning: 有证据支撑的单次或短期判断，尚未满足 tracking 双源与规则门槛。
      entry: 关键变量有 StateVariableObservation 且 evidence slot partially_bound 以上。
      exit_to_tracking:
        requires: [dual_independent_sources, required_checks_passed, no_blocking_counter, rule_trigger_matched]
      exit_to_invalidated:
        requires: [blocking_counter_evidence]
    tracking:
      meaning: 多期验证中的持续跟踪判断。
      entry: observation 升级且 RULE 门禁通过。
      exit_to_validated:
        requires: [multi_period_confirmation, outcome_aligned]
      exit_to_observation:
        requires: [weakening_counter_or_partial_reversal]
      exit_to_invalidated:
        requires: [blocking_counter_evidence]
    validated:
      meaning: 历史回放中结论兑现，可沉淀为复用资产。
      exit_to_stale:
        requires: [evidence_decay_rule_triggered, no_recent_update]
    invalidated:
      meaning: 反证成立或前提被否定。
      terminal: true
    stale:
      meaning: 证据过期或长期无更新。
      exit_to_candidate:
        requires: [fresh_evidence_ingested]
  human_review_required:
    - observation_to_tracking
    - tracking_to_validated
    - any_invalidation

# ============================================================
# 本体层级分离
# ============================================================
ontology_layer_separation:
  description: 避免产业事实层与投资判断层混杂，防止 MarketExpectation 污染基础行业本体推理流。
  layers:
    industry_fact:
      objects: [Industry, Segment, Company, Product, Material, ProcessStep, SupplyConstraint, StateVariable, StateVariableObservation, Event, EvidenceClaim, EvidenceFact]
      allowed_outputs: [observation, structured_propagation, bottleneck_localization]
    industry_reasoning:
      objects: [StateHypothesis, Signal, StateVariablePropagation, InferenceRule, ScenarioPath, SupplyConstraint]
      allowed_outputs: [tracking, falsification_conditions, scenario_branches]
    investment_interpretation:
      objects: [MarketExpectation, AssetImpact, JudgmentOutput, InvestmentThesis]
      allowed_outputs: [expectation_gap, valuation_reflection, catalyst]
      consumption_rule: 须消费 industry_reasoning 结论，不得与产业事实层混写在同一推理步。
  scenario_default_output_layer: industry_reasoning
  forbidden_in_industry_scenario:
    - AssetImpact_without_gap_gate
    - formal_judgment_without_review
