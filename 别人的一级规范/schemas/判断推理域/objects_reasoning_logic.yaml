schema_name: objects_reasoning_logic
schema_version: 0.1.0
namespace: investment_ontology
status: draft
depends_on: ../common.yaml

object_types:

  InferenceRule:
    zh_name: 推理规则
    category: research_reasoning
    managed_by: industry_owner
    description: 定义一条可复用的推理规则：在什么条件下、从哪些前提出发、经过什么逻辑、得出什么结论、需要哪些证据支持。InferenceRule
      是推理链路的可审计最小单元，同一条规则可被多次 InferenceRun 消费。
    lifecycle_field: ruleStatus
    initial_state: draft
    terminal_states:
    - deprecated
    - superseded
    fields:
      name:
        zh_name: 规则名称
        type: string
        required: true
      ruleCategory:
        zh_name: 规则分类
        type: enum
        enum_ref: ruleCategory
        required: true
      description:
        zh_name: 规则描述
        type: string
        required: true
      triggerCondition:
        zh_name: 触发条件
        type: object
        required: true
        description: '结构化的规则触发条件。旧 string 类型值在兼容期内可被 consumer 自动包装为 format=nl_description
          格式。

          '
        source_note: v1.2 从 type:string 改为 type:object，支持可机器评估的结构化条件。
        properties:
          format:
            zh_name: 条件格式
            type: enum
            enum:
            - threshold
            - duration
            - crossover
            - composite
            - nl_description
            - reference_to_rule
            required: true
            description: 'threshold — 阈值条件（如毛利率 > 30%）； duration — 持续时长条件（如连续 3 季度下降）；
              crossover — 交叉条件（如短期均线上穿长期均线）； composite — 复合条件（AND/OR/NOT 组合子条件）； nl_description
              — 纯自然语言描述（仅用于无法结构化的条件，不推荐）； reference_to_rule — 引用另一条 InferenceRule
              的 triggerCondition。

              '
          expression:
            zh_name: 条件表达式
            type: object
            required: true
            description: 根据 format 不同有不同的结构。
            properties:
              operator:
                zh_name: 操作符
                type: enum
                enum:
                - gt
                - gte
                - lt
                - lte
                - eq
                - neq
                - between
                - and
                - or
                - not
                - sequence
                - crossover
                - passthrough
                required: true
              operands:
                zh_name: 操作数
                type: array
                required: true
                description: 变量引用（{variableId}.{field} 或 {variableId}.observedValue）、常量值或子条件对象。
              referenceRuleId:
                zh_name: 引用规则 ID
                type: object_ref
                required: false
                description: format=reference_to_rule 时指向被引用的 InferenceRule。
          nlDescription:
            zh_name: 触发条件自然语言描述
            type: string
            required: false
            description: 人类可读的条件说明，不用于机器评估。
      inputObjectTypes:
        zh_name: 输入对象类型
        type: array
        required: true
        description: 规则消费的对象类型列表，如 [Event, StateVariable]。
      outputObjectTypes:
        zh_name: 输出对象类型
        type: array
        required: true
        description: 规则产生的对象类型列表，如 [StateHypothesis, Signal]。
      inputBindings:
        zh_name: 输入绑定
        type: array
        required: false
        description: 规则运行时消费的对象、变量、证据、关系或参数绑定；用于把自然语言规则转成可追踪输入。
        items:
          type: object
          properties:
            bindingId:
              zh_name: 绑定 ID
              type: string
              required: true
            bindingRole:
              zh_name: 绑定角色
              type: enum
              enum:
              - primary_object
              - context_object
              - variable
              - observation
              - evidence
              - relation
              - parameter
              required: true
            sourceType:
              zh_name: 来源类型
              type: enum
              enum:
              - object_ref
              - relation_ref
              - evidence_ref
              - runtime_parameter
              - scenario_ref
              required: true
            required:
              zh_name: 是否必需
              type: boolean
              required: true
            selector:
              zh_name: 选择器
              type: string
              required: false
              description: 引用 object_refs、variable_refs、evidence_refs、rule_refs 或运行时参数的路径。
      requiredRelations:
        zh_name: 必需关系
        type: array
        required: false
        description: 规则执行时必须存在的关系类型。
      logicDescription:
        zh_name: 推理逻辑
        type: string
        required: true
        description: 规则的核心推理逻辑。
      logicBlocks:
        zh_name: 遗留内联逻辑块
        type: array
        required: false
        legacy: true
        deprecated_since: core_v1_logic_function_convergence
        description: 遗留字段，仅用于读取旧包。active InferenceRule 不得再内联 logicBlocks；复杂执行逻辑必须通过
          functionRef 指向治理域 LogicFunction/LogicBlock。
        items:
          type: object
          properties:
            blockId:
              zh_name: 逻辑块 ID
              type: string
              required: true
            blockType:
              zh_name: 逻辑块类型
              type: enum
              enum:
              - filter
              - expression
              - aggregate
              - join
              - gate_check
              - rule_ref
              - function_ref
              - output_mapping
              required: true
            inputs:
              zh_name: 输入绑定
              type: array
              required: false
            expression:
              zh_name: 表达式
              type: object
              required: false
            outputBinding:
              zh_name: 输出绑定
              type: string
              required: false
            onFailure:
              zh_name: 失败处理
              type: enum
              enum:
              - block_conclusion
              - lower_confidence
              - enqueue_review
              - create_patch_request
              - observation_only
              required: true
      requiredSignals:
        zh_name: 所需信号角色
        type: array
        required: false
        description: 规则执行时必须检查的信号角色列表。
        items:
          type: object
          properties:
            signalRole:
              type: enum
              enum:
              - validation
              - catalyst
              - tracking
              - weakening
              - blocking
            requiredForConclusion:
              type: boolean
              description: 此信号是否作为得出结论的必要条件。
      requiredChecks:
        zh_name: 必需检查
        type: array
        required: false
        description: 规则执行时必须执行的反证、市场预期、催化剂等检查。
        items:
          type: enum
          enum:
          - counter_check
          - market_expectation_check
          - expectation_gap_check
          - time_horizon_check
          - catalyst_check
          - evidence_freshness_check
          - boundary_check
      confidenceModifiers:
        zh_name: 置信度调节
        type: array
        required: false
        description: 什么条件会提高或降低此规则的结论置信度。
        items:
          type: object
          properties:
            condition:
              type: string
            effect:
              type: enum
              enum:
              - increase_confidence
              - decrease_confidence
              - block_conclusion
            magnitude:
              type: enum
              enum:
              - strong
              - moderate
              - weak
      ruleStatus:
        zh_name: 规则状态
        type: enum
        enum_ref: ruleStatus
        required: true
        default: draft
      outputContract:
        zh_name: 输出契约
        type: object
        required: false
        description: 规则允许产生的对象、关系、状态变化、审计和补丁，不直接执行写入。
        properties:
          outputObjects:
            type: array
            required: false
          outputRelations:
            type: array
            required: false
          stateTransitions:
            type: array
            required: false
          actionRefs:
            type: array
            required: false
          requiredAudit:
            type: boolean
            required: true
      enforcement_contract:
        zh_name: 责任契约
        type: object
        required: true
        description: 引用 common.public_contracts.enforcement_contract，说明规则由 schema、policy、Skill
          或人工审核保证。
        properties:
          enforcement_levels:
            type: array
            required: true
            items:
              type: enum
              enum_ref: enforcementLevel
          primary_enforcer:
            type: enum
            enum_ref: enforcementLevel
            required: true
          notes:
            type: string
            required: false
      failure_behavior:
        zh_name: 失败处理
        type: enum
        enum_ref: failureBehavior
        required: true
        description: 规则整体失败或关键前提缺失时的处理方式；步骤级失败处理由 LogicFunction/LogicBlock 承担。
      executionMode:
        zh_name: 执行模式
        type: enum
        enum:
        - declarative
        - function_backed
        - human_review_required
        required: false
        default: declarative
      functionRef:
        zh_name: 函数引用
        type: object
        required: false
        description: executionMode=function_backed 时引用治理域 LogicFunction；函数承接复杂计算、检索、LLM
          解释或 ActionProposal 草案生成，不绕过 Action 和审计。
        properties:
          functionId:
            type: string
            required: true
          functionVersion:
            type: string
            required: true
          inputContract:
            type: object
            required: true
          outputContract:
            type: object
            required: true
      sourceBasis:
        zh_name: 来源依据
        type: string
        required: false
        description: 规则的来源——历史复盘总结、行业模板、研究员经验等。
      applicableScope:
        zh_name: 适用范围
        type: string
        required: false
        description: 规则适用的行业、公司类型或市场条件。
      supersedesRuleIds:
        zh_name: 替代的旧规则
        type: array
        required: false
      createdAt:
        zh_name: 创建时间
        type: datetime
        time_type: system_time
        required: true
        generated_by: system
      updatedAt:
        zh_name: 更新时间
        type: datetime
        time_type: system_time
        required: false
        generated_by: system
    quality_rules:
    - InferenceRule 不是投研结论，不输出买卖建议或目标价。
    - 规则触发条件必须可机器评估，不能仅依赖"研究员判断"类模糊表述。
    - 复杂逻辑应拆为 inputBindings、functionRef 和 outputContract；Action 只负责合法写入和审计。
    - function_backed 规则必须声明 functionRef，并在 RuleApplication 中记录输入、输出和失败原因。
    - active InferenceRule 不得携带 legacy logicBlocks；可执行步骤统一进入 LogicFunction/LogicBlock。
    - 每条规则必须声明 enforcement_contract 和 failure_behavior，避免把规则责任留给消费端自由猜测。
    - 规则状态为 deprecated 时，新的 InferenceRun 不得引用此规则。
    - supersedesRuleIds 中的旧规则必须存在且状态已变更为 deprecated 或 superseded。
  ConductionTemplate:
    zh_name: 传导模板
    category: research_reasoning
    managed_by: industry_owner
    description: 定义一条可复用的变量间传导模板。与 StateVariablePropagation（表达变量层面的因果逻辑）不同，ConductionTemplate
      是推理侧模板，表达"在推理过程中，当从变量 A 推导变量 B 时，应检查哪些信号、反证和边界条件"。
    fields:
      name:
        zh_name: 模板名称
        type: string
        required: true
      propagationId:
        zh_name: 关联传导逻辑
        type: object_ref
        required: false
        description: 关联的 StateVariablePropagation 实例 ID。
      fromVariableId:
        zh_name: 源变量
        type: object_ref
        required: true
      toVariableId:
        zh_name: 目标变量
        type: object_ref
        required: true
      inputContract:
        zh_name: 输入契约
        type: object
        required: true
        description: 传导模板执行时可消费的变量、观测、证据、信号、关系和运行时参数。
      outputContract:
        zh_name: 输出契约
        type: object
        required: true
        description: 传导模板允许产生的 StateHypothesis、Signal、JudgmentOutput、RuleApplication
          或缺口反馈；不直接写正式资产。
      conductionLogic:
        zh_name: 传导逻辑
        type: object
        required: true
        description: '结构化的传导逻辑定义。旧 string 类型值在兼容期内可被 consumer 自动包装为 format=nl_description
          格式。

          '
        source_note: v1.2 从 type:string 改为 type:object。
        properties:
          format:
            zh_name: 逻辑格式
            type: enum
            enum:
            - causal_chain
            - threshold
            - composite
            - nl_description
            required: true
            description: 'causal_chain — A → B 因果链； threshold — 阈值条件触发传导； composite
              — AND/OR/NOT 组合条件； nl_description — 纯自然语言描述（不推荐）。

              '
          expression:
            zh_name: 逻辑表达式
            type: object
            required: true
            properties:
              operator:
                zh_name: 操作符
                type: enum
                enum:
                - leads_to
                - when
                - and
                - or
                - not
                - if_then
                - passthrough
                required: true
              operands:
                zh_name: 操作数
                type: array
                required: true
                description: 变量引用或条件子对象。
          nlDescription:
            zh_name: 自然语言描述
            type: string
            required: false
            description: 人类可读的传导逻辑说明。
      requiredValidationSignals:
        zh_name: 必需验证信号
        type: array
        required: false
      requiredChecks:
        zh_name: 必需检查
        type: array
        required: false
        items:
          type: enum
          enum:
          - counter_check
          - market_expectation_check
          - expectation_gap_check
          - time_horizon_check
          - catalyst_check
          - evidence_freshness_check
          - boundary_check
      blockingConditions:
        zh_name: 阻断条件
        type: array
        required: false
        description: 会阻断此传导的条件列表。
      typicalLagRange:
        zh_name: 典型时滞范围
        type: string
        required: false
      historicalAccuracy:
        zh_name: 历史准确率
        type: string
        required: false
      templateStatus:
        zh_name: 模板状态
        type: enum
        enum_ref: templateStatus
        required: true
        default: draft
      createdAt:
        zh_name: 创建时间
        type: datetime
        time_type: system_time
        required: true
        generated_by: system
    quality_rules:
    - ConductionTemplate 不得绕过 StateVariablePropagation 直接定义变量间因果。
    - ConductionTemplate 采用输入、逻辑块/检查、输出三段式表达；Action 只负责合法写回和审计。
    - 阻断条件必须具体可检测，不能用"市场情绪变化"等模糊表述。
  ScenarioPath:
    zh_name: 情景路径
    category: research_reasoning
    managed_by: researcher
    description: 定义一条从当前状态到未来结果的情景路径。ScenarioPath 比 JudgmentOutput.scenarioTag 更丰富：它包含触发条件、关键假设、路径节点、概率估计和反证条件。支持多情景对比推理（base
      vs upside vs downside）。
    fields:
      name:
        zh_name: 路径名称
        type: string
        required: true
      scenarioType:
        zh_name: 情景类型
        type: enum
        enum_ref: scenarioType
        required: true
      description:
        zh_name: 路径描述
        type: string
        required: true
      inputContract:
        zh_name: 输入契约
        type: object
        required: false
        description: 路径判断可消费的状态变量、假设、证据、传导边、市场预期和运行时参数；ScenarioPath 不负责加载或编排。
      triggerConditions:
        zh_name: 触发条件
        type: array
        required: true
        description: 进入此情景路径需要满足的前置条件。
        source_note: v1.2 从 type:array of string 改为 type:array of object，支持结构化条件。
        items:
          type: object
          properties:
            conditionId:
              zh_name: 条件标识
              type: string
              required: true
              description: 条件的唯一标识，如 SP1-TC-001。
            format:
              zh_name: 条件格式
              type: enum
              enum:
              - threshold
              - event_occurrence
              - composite
              - nl_description
              required: true
            expression:
              zh_name: 条件表达式
              type: object
              required: true
              properties:
                operator:
                  type: enum
                  enum:
                  - gt
                  - gte
                  - lt
                  - lte
                  - eq
                  - neq
                  - and
                  - or
                  - not
                  - passthrough
                  required: true
                operands:
                  type: array
                  required: true
            nlDescription:
              zh_name: 自然语言描述
              type: string
              required: false
      keyAssumptions:
        zh_name: 关键假设
        type: array
        required: true
        description: 此情景路径依赖的核心假设（StateHypothesis ID 列表）。
      pathNodes:
        zh_name: 路径节点
        type: array
        required: false
        description: 路径上的关键状态节点，按时间顺序排列。
        items:
          type: object
          properties:
            nodeOrder:
              type: integer
            variableId:
              type: object_ref
            expectedState:
              type: string
            expectedTime:
              type: datetime
              time_type: business_time
            validationSignalIds:
              type: array
      estimatedProbability:
        zh_name: 估计概率
        type: number
        value_range:
        - 0
        - 1
        required: false
      falsificationConditions:
        zh_name: 证伪条件
        type: array
        required: true
        description: 满足任一条件即排除此情景路径。
        source_note: v1.2 与 triggerConditions 同步升级为结构化对象。
        items:
          type: object
          properties:
            conditionId:
              zh_name: 条件标识
              type: string
              required: true
            format:
              zh_name: 条件格式
              type: enum
              enum:
              - threshold
              - event_occurrence
              - composite
              - nl_description
              required: true
            expression:
              zh_name: 条件表达式
              type: object
              required: true
              properties:
                operator:
                  type: enum
                  enum:
                  - gt
                  - gte
                  - lt
                  - lte
                  - eq
                  - neq
                  - and
                  - or
                  - not
                  - passthrough
                  required: true
                operands:
                  type: array
                  required: true
            nlDescription:
              zh_name: 自然语言描述
              type: string
              required: false
      competingPaths:
        zh_name: 竞争路径
        type: array
        required: false
        description: 与此路径互斥的其他 ScenarioPath ID。
      terminalJudgmentIds:
        zh_name: 终点判断
        type: array
        required: false
        description: 此情景路径终点对应的 JudgmentOutput ID 列表。
      outputContract:
        zh_name: 输出契约
        type: object
        required: false
        description: 路径允许产出的候选判断、跟踪信号、RuleApplication、MetricSnapshot 或缺口反馈；正式写回必须经
          ActionProposal 和 ReviewRecord。
      templateStatus:
        zh_name: 模板状态
        type: enum
        enum_ref: templateStatus
        required: true
        default: draft
      createdAt:
        zh_name: 创建时间
        type: datetime
        time_type: system_time
        required: true
        generated_by: system
    quality_rules:
    - ScenarioPath 不是预测，是结构化的条件推理路径。
    - ScenarioPath 只声明路径条件和输出边界；编排、函数调用和写回由 ScenarioModel、LogicFunction、ActionProposal
      承担。
    - 每个 ScenarioPath 必须有至少一个 falsificationConditions。
    - 多情景路径（base/upside/downside）的 triggerConditions 应互斥。
  ScenarioModel:
    zh_name: 场景模型
    category: research_reasoning
    managed_by: researcher_or_system
    description: 定义某类投研问题出现时的处理算法和编排路径。ScenarioModel 不复制对象实例，而是声明入口、编排步骤、确定性校验、降级策略、输出契约和允许生成的
      ActionProposal。
    lifecycle_field: scenarioModelStatus
    initial_state: draft
    terminal_states:
    - deprecated
    - superseded
    fields:
      name:
        zh_name: 模型名称
        type: string
        required: true
      scenarioModelType:
        zh_name: 场景模型类型
        type: enum
        enum_ref: scenarioModelType
        required: true
      description:
        zh_name: 模型描述
        type: string
        required: true
      scenarioModelStatus:
        zh_name: 模型状态
        type: enum
        enum_ref: scenarioModelStatus
        required: true
        default: draft
      entryObjectTypes:
        zh_name: 入口对象类型
        type: array
        required: true
        description: 用户问题或事件优先解析到哪些对象类型。
      triggerQuestionPatterns:
        zh_name: 触发问题模式
        type: array
        required: false
        description: 适用本场景模型的问题、事件或材料类型。
      orchestrationSteps:
        zh_name: 编排步骤
        type: array
        required: true
        description: 场景路由、上下文加载、确定性门禁、规则检查和 LogicFunction 调用路径；LLM 解释、渲染和 ActionProposal
          生成进入 LogicFunction/LogicBlock。
        items:
          type: object
          properties:
            stepId:
              zh_name: 步骤 ID
              type: string
              required: true
            stepType:
              zh_name: 步骤类型
              type: enum
              enum_ref: orchestrationStepType
              required: true
            toolType:
              zh_name: 工具类型
              type: enum
              enum_ref: orchestrationToolType
              required: true
            required:
              zh_name: 是否必需
              type: boolean
              required: true
            inputRefs:
              zh_name: 输入引用
              type: array
              required: false
            outputRef:
              zh_name: 输出引用
              type: string
              required: true
            policyRefs:
              zh_name: 策略引用
              type: array
              required: false
            ruleRefs:
              zh_name: 规则引用
              type: array
              required: false
            functionRefs:
              zh_name: 函数引用
              type: array
              required: false
              description: stepType=invoke_function 时必须指向本场景模型 functionRefs 中声明的 LogicFunction.functionId。
            llmDecisionBoundary:
              zh_name: LLM 决策边界
              type: enum
              enum_ref: llmDecisionBoundary
              required: false
            onFailure:
              zh_name: 失败处理
              type: enum
              enum:
              - block_with_gap
              - lower_confidence
              - observation_only
              - enqueue_review
              - build_action_proposal
              - ask_user_for_clarification
              required: true
      deterministicChecks:
        zh_name: 确定性校验
        type: array
        required: true
        description: 本场景模型必须执行的门禁、规则或策略检查。
      functionRefs:
        zh_name: 函数引用
        type: array
        required: false
        description: 本场景模型可调用的 LogicFunction.functionId 列表；具体执行步骤通过 orchestrationSteps.stepType=invoke_function
          声明。
        items:
          type: string
      fallbackPolicy:
        zh_name: 降级策略
        type: enum
        enum:
        - block_with_gap
        - partial_chain_with_gaps
        - observation_only
        - ask_user_for_clarification
        required: true
      enforcement_contract:
        zh_name: 责任契约
        type: object
        required: true
        description: 引用 common.public_contracts.enforcement_contract，声明本场景模型中 schema、policy、Skill
          和人工审核各自负责的边界。
        properties:
          enforcement_levels:
            type: array
            required: true
            items:
              type: enum
              enum_ref: enforcementLevel
          primary_enforcer:
            type: enum
            enum_ref: enforcementLevel
            required: true
          notes:
            type: string
            required: false
      failure_behavior:
        zh_name: 失败处理
        type: enum
        enum_ref: failureBehavior
        required: true
        description: 本场景模型整体失败或关键门禁缺失时的处理方式；orchestrationSteps.onFailure 只描述单步失败。
      outputContracts:
        zh_name: 输出契约
        type: array
        required: true
        description: 允许输出的对象、报告、运行记录或提案类型。
      allowedActionTypes:
        zh_name: 允许动作类型
        type: array
        required: false
        description: 本场景模型允许生成提案或调用的 Action 类型。
      reviewPolicy:
        zh_name: 审核策略
        type: string
        required: true
      createdAt:
        zh_name: 创建时间
        type: datetime
        time_type: system_time
        required: true
        generated_by: system
    quality_rules:
    - ScenarioModel 是场景处理算法，不是完整实体复制或自然语言说明。
    - orchestrationSteps 必须至少包含一个确定性校验步骤。
    - active ScenarioModel 不得内联 llm_reasoning、action_proposal 或 report_render 步骤；这些执行步骤必须进入
      LogicFunction/LogicBlock，并由 invoke_function 调用。
    - invoke_function 步骤必须引用可解析的 LogicFunction.functionId。
    - ScenarioModel 必须声明 enforcement_contract 和 failure_behavior，资产影响候选必须经过反证、市场预期和预期差相关门禁。
    - 输出写回必须走 ActionProposal、ReviewRecord 和 ActionAudit。
