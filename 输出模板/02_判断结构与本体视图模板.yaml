schema_name: task_ontology_view
schema_version: 1.1.0

# 文件命名：02-<核心主题>本体视图-<YYYYMMDD>-<当日序号>.yaml
# 必须与配对研究逻辑文件使用相同核心主题、日期和序号。
# 本文件保存本体引用、路径节点、判断单元、实例需求、状态变量绑定、证据要求、候选、缺口索引和质量校验。

task_context:
  task_id: "<任务标识>"
  view_id: "<任务本体视图标识>"
  logic_id: "<研究逻辑文档标识>"
  generated_at: "<文档生成时间，ISO 8601；仅用于审计>"
  source_requirement_version: "<01 需求版本>"
  source_document: "<01 投研需求说明文件>"
  logic_document: "<同主题、同日期、同序号的研究逻辑文件名>"
  normalized_question: "<规范化判断问题>"
  judgment_landing: "<状态定位 | 趋势判断 | 阶段切换 | 影响强弱 | 路径成立性 | 假设验证与更新>"
  task_type:
    primary: "<01 规定的主任务类型>"
    secondary: []
  scope:
    time: "<时间范围>"
    time_policy:
      mode: "<rolling | fixed | event_relative>"
      anchor: "<execution_date | event_date | null>"
      anchor_value: null
      timezone: "Asia/Shanghai"
      lookback: null
      lookforward: null
      fixed_start: null
      fixed_end: null
      data_cutoff: "<execution_date | 固定日期>"
    geography: "<地域范围>"
    value_chain: "<产业链范围>"
    objects: []
    object_selection:
      mode: "<fixed | dynamic>"
      as_of: "<execution_date | 固定日期>"
      criteria: []
      count_or_coverage: null
      refresh_on_each_run: false
    exclusions: []

quality_control:
  quality_gate_ref: "00A_高质量产出判别标准.md#5.2"
  stage_status: "<aligned | needs_revision | returned_to_01>"
  quality_status: "draft"
  deterministic_check_status: "not_checked"
  semantic_review_status: "not_reviewed"
  return_required: false
  return_stage: null
  return_reasons: []

research_framework:
  logic_document_ref: "<与 task_context.logic_document 一致>"
  judgment_spine:
    statement: "<一句话说明本次真正要辨别的主矛盾和主导机制>"
    md_section: "1.3 核心判断"
  basis:
    source: "<independent | library_adapted | mixed>"
    md_section: "<如：3. 本次采用的分析框架>"
    alignment_summary: "<一句话；不重写问题树>"
  library_reference:
    library_ref: 02框架库/README.md
    library_version: 1.0.0
    consulted: []
    no_direct_reference_reason: ""
  minimum_question_tree:
    - question_id: "Q-01"
      question: "<子问题>"
      relation_to_overall: "<precondition | parallel | competing | stop_node>"
      sequence: 1
      failure_action: "<stop | downgrade | switch_to_competing_explanation | return_to_01_or_02>"
      md_section: "2.2"
  alignment_checks:
    independently_formed_in_md: false
    library_consulted_in_md: false
    judgment_spine_consistent_with_md: false
    problem_tree_consistent_with_md: false

ontology_sources:
  platform_ontology:
    name: ontology_platform
    version: 1.0.0
    schema_versions:
      common: 1.0.0
      semantic: 1.0.0
      evidence: 1.0.0
      reasoning: 1.0.0
    files: []
  domain_ontology:
    name: "<领域本体名称>"
    version: 1.0.0
    depends_on: ontology_platform
    files:
      - 二级半导体领域本体规范/common.yaml
      - 二级半导体领域本体规范/semantic.yaml
      - 二级半导体领域本体规范/evidence.yaml
      - 二级半导体领域本体规范/reasoning.yaml

judgment_units:
  - judgment_unit_id: "JU-01"
    judgment_name: "<判断单元名称>"
    judgment_type: "<industry_cycle_judgment | policy_impact_judgment | supply_chain_bottleneck_judgment | company_earnings_elasticity_judgment | valuation_rerating_judgment | event_impact_judgment | expectation_gap_judgment | risk_monitoring_judgment>"
    statement: "<04 可能输出的观点或边界>"
    linked_questions: ["Q-01"]
    linked_paths: []
    target_path_node_ids: []
    target_state_variables: []
    target_anchor_objects: []
    decision_relevance: "<core | supporting | monitoring>"
    expected_04_output_type: "<full_reasoning_ready | directional_only | conditional_only | insufficient | blocked | contested>"
    required_evidence_roles:
      primary_support: required
      cross_validation: required
      counter_evidence: required
      blocking_condition: required
      proxy_indicator: allowed_with_limit
      background_evidence: optional
    required_evidence_categories: []
    required_counter_categories: []
    candidate_evidence_recipe_tags: []
    minimum_verification_condition: "<最低验证条件>"
    minimum_validation_conditions: []
    required_counter_checks: []
    forbidden_shortcuts: []
    proxy_policy: "<not_allowed | allowed_but_must_discount_confidence | required_when_direct_data_unavailable>"
    evidence_gap_policy: "<缺证时 04 如何降级或停止>"
    downgrade_rule_if_not_met: "<directional_only | conditional_only | insufficient | blocked | contested>"
    evidence_profile_refs: []
    md_section: "5"

path_design:
  main_paths:
    - path_id: "P-01"
      name: "<主路径名称>"
      description: "<业务语言描述>"
      linked_judgment_units: ["JU-01"]
      nodes:
        - node_id: "N-01"
          name: "<节点名称>"
          role: "<start | precondition | transmission | outcome | validation | stop>"
          question: "<该节点要验证的问题>"
          required_state_variables: []
          required_instance_requirements: []
          required_evidence_requirements: []
          failure_action: "<stop | downgrade | switch_path>"
  weakening_conditions:
    - condition_id: "W-01"
      statement: "<削弱条件>"
      linked_paths: ["P-01"]
      distinguish_evidence: []
      effect_on_04: "<降低为倾向判断/条件判断等>"
  blocking_conditions:
    - condition_id: "B-01"
      statement: "<阻断条件>"
      linked_paths: ["P-01"]
      distinguish_evidence: []
      effect_on_04: "<路径停止/暂不可判断>"
  competing_explanations:
    - explanation_id: "CE-01"
      statement: "<竞争解释>"
      distinguish_from_main_path: "<如何区分>"
      required_evidence: []
      effect_on_04: "<保留竞争解释/降级/改判>"

ontology_bindings:
  selected_objects: []
  selected_relations: []
  selected_events: []
  selected_state_variables:
    - state_variable_id: ""
      name: ""
      ontology_ref: ""
      linked_judgment_units: []
      linked_path_nodes: []
      state_binding_refs: []
      observation_requirement_refs: []
      evidence_profile_refs: []
  propagation_templates: []
  inference_rules: []

instance_requirements:
  - requirement_id: "IR-01"
    target: "<对象/关系/事件/状态观测等>"
    purpose: "<支持/削弱/阻断/区分竞争解释>"
    linked_path_nodes: []
    linked_judgment_units: []
    minimum_fields: []
    scope_constraints: []

evidence_requirements:
  - evidence_requirement_id: "ER-01"
    target_judgment_unit_id: "JU-01"
    target_path_node_id: ""
    target_state_variable_id: ""
    linked_instance_requirement: "IR-01"
    requirement_purpose: "<support | weaken | block | validate | cross_validate | counter | background>"
    evidence_role: "<primary_support | cross_validation | counter_evidence | blocking_condition | proxy_indicator | background_evidence>"
    required_evidence_category: "<price | demand | supply | inventory | order | policy | financial | valuation | exposure | event | other>"
    required_content_domains: []
    required_object_scope: {}
    required_time_scope: ""
    required_grain: "<daily | monthly | quarterly | event_point | text_claim | cross_section | time_series>"
    minimum_quality_level: "<Q1_background | Q2_reasoning_usable | Q3_directional_ready | Q4_report_grade>"
    minimum_source_tier: "<S1 | S2 | S3 | S4 | S5 | S6 | S7 | S8；历史快照可用 L1-L7>"
    minimum_independent_source_count: 1
    mandatory_baskets: []
    counter_baskets: []
    allowed_proxy: false
    preferred_source_profiles: []
    allowed_acquisition_channels: []
    forbidden_sources: []
    required_freshness: ""
    required_traceability: ""
    required_comparability: ""
    stop_condition: ""
    missing_policy: "<continue_search | downgrade | block | return_to_02>"
    allowed_04_output_if_met: "<full_reasoning_ready | directional_only | conditional_only>"
    allowed_04_output_if_missing: "<conditional_only | insufficient | blocked | contested>"

candidate_structures:
  used: false
  items: []
  usage_boundary: ""
  effect_on_03: ""
  effect_on_04: ""

ontology_gaps:
  has_gap: false
  gap_note_ref: ""
  gap_ids: []
  highest_severity: "<none | low | medium | high | blocking>"
  blocks_evidence_preparation: false
  blocks_directional_reasoning: false

handoff_to_03:
  required_files:
    - "02-<核心主题>研究逻辑-<YYYYMMDD>-<当日序号>.md"
    - "02-<核心主题>本体视图-<YYYYMMDD>-<当日序号>.yaml"
  required_csv_or_snapshot_outputs:
    - 03_gate/state_variable_coverage.csv
    - 03_gate/path_readiness.csv
    - 01_plan/evidence_requirements.csv
    - 01_plan/evidence_recipe_matches.csv
    - 01_plan/evidence_baskets.csv
    - 03_gate/evidence_readiness_assessments.csv
    - 02_assets/evidence_records.csv
  special_limits: []

validation:
  checks:
    scope_consistent_with_01: false
    judgment_spine_present: false
    minimum_question_tree_present: false
    main_counter_competing_paths_present: false
    judgment_units_have_minimum_conditions: false
    state_variable_chain_complete: false
    evidence_requirements_executable_by_03: false
    md_yaml_consistent: false
  result: "<pass | fail>"
  return_required: false
  return_reasons: []
