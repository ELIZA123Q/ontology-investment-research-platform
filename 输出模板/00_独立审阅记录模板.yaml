document_type: independent_review_register
schema_version: 1.1.0

metadata:
  task_id: ""
  execution_id: ""
  producer_id: "<本次01—05产出责任人或团队标识>"

reviews:
  - review_id: REVIEW-01
    stage: "01"
    reviewer_id: "<独立审阅者标识>"
    reviewer_role: independent_research_reviewer
    reviewed_at: "<ISO-8601时间>"
    independence_declaration: independent_of_producer
    conflict_of_interest: none_declared
    review_summary: "<不少于30字，说明实际审阅了什么、为什么本阶段可以通过及尚存的非阻断限制>"
    decision: pass
    criteria_results:
      - criterion_id: question_alignment
        result: pass
        rationale: "<不少于20字，说明问题、对象、时间、范围和用途如何与原始需求一致>"
      - criterion_id: research_value
        result: pass
        rationale: "<不少于20字，说明可辨别的分歧、变量、影响路径和决策用途>"
      - criterion_id: scope_and_alternatives
        result: pass
        rationale: "<不少于20字，说明范围已收敛且支持、反证和竞争解释均已纳入>"
      - criterion_id: handoff_readiness
        result: pass
        rationale: "<不少于20字，说明02可以据此形成可执行的判断结构>"
    artifact_hashes:
      "01-<核心主题>投研需求说明-<YYYYMMDD>-<当日序号>.md": "sha256:<文件哈希>"

# 其余阶段按相同结构各写一条，且必须使用下列完整且唯一的 criterion_id：
# 02: judgment_structure, falsifiability, ontology_handoff, evidence_executability
# 03: evidence_fitness, source_provenance, counterevidence_and_limits, reasoning_permission
# 04: conclusion_evidence_alignment, competing_explanations, monitoring_and_reversibility, reader_usable_reasoning
# 05: conclusion_fidelity, argument_quality, source_material_traceability, reader_usability
