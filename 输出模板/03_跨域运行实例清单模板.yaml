document_type: cross_domain_runtime_instance_manifest
schema_version: 2.0.0

metadata:
  task_id: ""
  execution_id: ""
  source_02_view_ref: "02-<核心主题>本体视图-<YYYYMMDD>-<当日序号>.yaml"
  source_02_view_version: 1
  source_02_view_hash: ""
  snapshot_ref: "03-<核心主题>数据与证据快照-<YYYYMMDD>-<当日序号>/manifest.csv"
  frozen_at: ""

ontology_versions:
  platform:
    common: 2.0.0
    semantic: 1.0.0
    evidence: 2.0.0
    reasoning: 2.0.0
  domain:
    name: "<领域本体名称>"
    version: 1.0.0

manifest_role:
  stage: "03"
  included_domains: [semantic, evidence, reasoning_input]
  instance_only: true
  formal_ontology_mutated: false

domain_instances:
  semantic_domain:
    role: runtime_instances
    object_types: [Industry, PolicyInstrument, Company]
    files:
      objects: "<快照目录>/semantic_instances.csv"
      relations: "<快照目录>/semantic_relations.csv"
  evidence_domain:
    role: runtime_instances
    object_types: [SourceDocument, EvidenceClaim, EvidenceFact, EvidenceAssessment]
    files:
      source_documents: "<快照目录>/source_documents.csv"
      claims: "<快照目录>/evidence_claims.csv"
      facts: "<快照目录>/evidence_facts.csv"
      relations: "<快照目录>/evidence_relations.csv"
      assessments: "<快照目录>/evidence_assessments.csv"
  reasoning_domain:
    role: frozen_inputs_only
    object_types: [Observation, Event, MarketExpectation]
    files:
      inputs: "<快照目录>/reasoning_inputs.csv"

operational_files:
  source_retrievals: "<快照目录>/source_snapshot.csv"
  compatibility_projection: "<快照目录>/evidence_records.csv"

cross_domain_constraints:
  source_claim_fact_chain_complete: false
  assessment_targets_resolvable: false
  semantic_instances_runtime_only: true
  reasoning_inputs_frozen: false
  no_rule_evaluation_instances: true
  no_judgment_instances: true

candidate_feedback_ref: null

validation:
  result: "<pass | fail>"
  checked_at: ""
  issues: []
