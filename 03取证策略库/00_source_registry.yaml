# 系统接口文件：研究员通过 B_取证来源和“来源与指标经验卡”维护研究经验；
# 本注册表只负责稳定 ID、文件指向与自动校验，不作为日常找来源的入口。
registry_type: evidence_source_guidance_registry
schema_version: 1.2.0
updated_at: 2026-07-12

purpose: >
  作为 03 取证策略库的取证来源索引，指向推荐优先来源清单和来源分层规则。
  SourceProfile、SourceDocument、AcquisitionChannel、AccessScope、ArtifactType、ContentDomain
  的对象定义和规则由一级通用本体证据域承接，本文件不再维护独立来源画像目录。

ontology_contract:
  evidence_domain_schema: ../一级通用本体规范/evidence.yaml
  source_profile_object: SourceProfile
  source_document_object: SourceDocument
  source_document_profile_relation: sourceDocumentUsesProfile
  acquisition_channel_field: SourceDocument.acquisitionChannel
  access_scope_field: SourceDocument.accessScope
  artifact_type_field: SourceDocument.artifactType
  content_domain_field: SourceDocument.contentDomain
  hard_rules:
    - acquisition_channel_not_source_profile
    - access_scope_required_for_formal_evidence
    - artifact_type_drives_traceability
    - content_domain_must_match_basket

source_guidance_files:
  overview:
    description: 取证来源库定位、边界、调用顺序和非白名单原则
    file: B_取证来源/B00_取证来源总览.md
  tiering:
    description: S1-S8 来源分层、使用边界和 04 使用上限
    file: B_取证来源/B01_来源分层与使用边界.md
  general_sources:
    description: 跨行业通用来源清单与证据篮子映射
    file: B_取证来源/B02_通用来源清单与证据篮子映射.md
  industry_sources:
    description: 行业专用来源目录；行业供需、价格、库存、产能、份额、下游需求等专业变量优先进入此目录
    directory: B_取证来源/B03_行业专用来源
    current_files:
      semiconductor: B_取证来源/B03_行业专用来源/B03-IND-SEMI_半导体取证来源清单.md
  topic_sources:
    description: 跨行业专题来源目录；地缘冲击、制裁管制、供应链扰动、能源冲击等专题优先进入此目录
    directory: B_取证来源/B04_专题来源
    current_files:
      geopolitical: B_取证来源/B04_专题来源/B04-TOPIC-GEOPOLITICAL_地缘冲击取证来源清单.md

source_tier_scheme:
  values: [S1, S2, S3, S4, S5, S6, S7, S8]
  definition_ref: B_取证来源/B01_来源分层与使用边界.md

use_rules:
  - 先由 C_Evidence_Recipe 确定证据篮子，再由 A_取证规则明确执行方法，最后使用 B_取证来源选择推荐优先来源。
  - B02/B03/B04 是优先来源清单，不是封闭白名单。
  - 新来源可使用，但进入关键判断前必须补充来源生产者、内容领域、发布时间、业务时间、口径、权限、可复核路径和使用限制。
  - MCP、API、网页、人工上传、文件检索、数据库终端和内部系统只记录为 acquisition_channel，不得写成 source_profile。
  - AccessScope 不清时，不得进入正式证据包。
  - ArtifactType 决定原文定位、字段血缘、快照和复核要求。
  - ContentDomain 用于判断来源是否适合当前证据篮子。

source_selection_contract:
  required_dimensions:
    - claim_or_measurement_type
    - evidence_role
    - object_and_time_scope
    - methodology_transparency
    - required_locator_level
    - independence_group
    - update_and_revision_policy
    - access_and_expression_permission
    - acquisition_channel_and_fallback
  selection_rule: 选择能最直接证明当前篮子主张且可复核的来源，不按知名度或 S1-S8 数字机械排序。
  primary_source_failure_rule: 记录失败代码后按预设 fallback 顺序切换；替代来源改变直接性、口径或权限时必须重评质量上限。
  independence_rule: 同一原始数据、同一公司披露、同一数据库转售字段或同一新闻线索属于同一 independence_group。

source_profile_admission:
  required_fields:
    - source_name
    - source_tier
    - authority_type
    - typical_content_domains
    - allowed_claim_types
    - forbidden_use
    - methodology_transparency
    - independence_group
    - access_scope_default
    - common_limitations
    - required_locator_level
  statuses: [candidate, active, restricted, deprecated, retired]
  review_triggers:
    - 方法论、字段定义或样本发生重大变化
    - 来源停止更新、被替代或历史数据修订
    - 授权或引用边界变化
    - 多次任务出现不可解释冲突
    - 实际内容域偏离登记画像
