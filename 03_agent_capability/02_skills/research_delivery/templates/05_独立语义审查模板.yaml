# 可选的独立语义审查记录，不是研究员交付物，也不替代正式 Eval。
schema_name: independent_semantic_review
schema_version: 2.0.0

review_id: "ISR-<task_id>"
reviewed_at: "<ISO 8601>"

reviewer:
  reviewer_id: "<不同于 created_by 的审阅者 ID>"
  reviewer_type: "<human | model>"
  independent_from_producer: true

inputs:
  public_contract_version: 2.0.0
  task_id: "<Task ID>"
  artifact_refs:
    evidence_package: {artifact_id: "<ID>", version: 1, content_hash: "sha256:<hash>"}
    method_application: {artifact_id: "<ID>", version: 1, content_hash: "sha256:<hash>"}
    judgment: {artifact_id: "<ID>", version: 1, content_hash: "sha256:<hash>"}
    report: {artifact_id: "<ID>", version: 1, content_hash: "sha256:<hash>"}

checks:
  - check_id: local_evidence_not_globalized
    result: needs_human
    reason: "<局部证据是否被泛化到更大范围、更多对象或更长时间窗口>"
    return_to_artifact: judgment
  - check_id: competing_explanations_preserved
    result: needs_human
    reason: "<最强反证与竞争解释是否被 Judgment 和报告忠实保留>"
    return_to_artifact: judgment
  - check_id: incremental_update_is_local_first
    result: needs_human
    reason: "<更新是否只失效依赖图中的可达下游，而非无依据地重写全部制品>"
    return_to_artifact: research_plan
  - check_id: title_represents_major_scopes
    result: needs_human
    reason: "<标题是否代表主要范围和主要判断>"
    return_to_artifact: report
  - check_id: conditions_scope_and_prohibitions_preserved
    result: needs_human
    reason: "<报告是否保留正式 Judgment 的条件、范围、失效条件和禁写边界>"
    return_to_artifact: report
  - check_id: main_judgment_is_clear_and_prioritized
    result: needs_human
    reason: "<报告是否直接回答研究目标，并体现主次与强弱>"
    return_to_artifact: report
  - check_id: maximal_valid_judgment_is_expressed
    result: needs_human
    reason: "<在不越过证据边界的前提下，允许成立的判断是否表达充分>"
    return_to_artifact: report
  - check_id: uncertainty_is_concentrated_not_overloaded
    result: needs_human
    reason: "<不确定性是否集中在真正会改变判断的变量上>"
    return_to_artifact: report
  - check_id: research_edge_is_substantive
    result: needs_human
    reason: "<Research Edge 是否体现机制、对象分化或时间窗口上的真实增量>"
    return_to_artifact: report
  - check_id: key_unknowns_are_decision_relevant
    result: needs_human
    reason: "<关键未知是否会实质改变主判断>"
    return_to_artifact: report

verdict: needs_human
formal_eval_status: not_evaluated
