schema_name: capability_tools_registry
schema_version: 2.0.0
status: active
executable_manifest: 06_runtime/src/capabilities/registry.ts
tools:
  - tool_id: semantic.search
    risk: read
    idempotent: true
  - tool_id: source.discover
    risk: read
    idempotent: true
  - tool_id: source.capture
    risk: write
    idempotent: true
  - tool_id: financial.mcp
    risk: read
    idempotent: true
