schema_name: financial_model_artifact_contract
schema_version: 1.0.0
status: active

authority:
  canonical_artifact: financial_model
  editable_projection: XLSX 可由 canonical artifact 投影生成，但不是权威数据源
  scope: A 股基本面研究

required_fields:
  normalized_financials:
    - asOf
    - modelScope
    - entityRef
    - accountingBasis
    - currency
    - unit
    - historicalBoundary
    - observations
    - sourceArtifactRefs
  financial_model:
    - asOf
    - entityRef
    - accountingBasis
    - currency
    - unit
    - historicalBoundary
    - forecastBoundary
    - assumptions
    - formulaDependencies
    - scenarios
    - computedOutputs
    - reconciliations
    - audit
    - sourceArtifactRefs
  valuation_analysis:
    - asOf
    - financialModelRef
    - modelAuditRef
    - currency
    - unit
    - methods
    - assumptions
    - sensitivities
    - status
  thesis_state:
    - asOf
    - version
    - pillars
    - signals
    - catalysts
    - invalidationConditions
    - openEvidenceGaps
    - sourceArtifactRefs

model_invariants:
  - historicalBoundary.end <= asOf
  - forecastBoundary.start > historicalBoundary.end
  - 每一 forecast assumption 必须有 sourceArtifactRef 或明确标记为 analyst_assumption
  - formulaDependencies 的依赖项必须存在；禁止循环依赖
  - 三表勾稽失败时 audit.passed=false
  - 每股指标必须冻结 diluted/basic share basis 和期间
  - oneOffItems 与 adjusted/reporting basis 必须分开
  - 未通过 audit 的 financial_model 不得作为 valuation_analysis 的输入
  - 单位换算、派生指标、勾稽容差与估值阻断唯一权威为 financial_model_integrity_policy.yaml

consensus_boundary:
  authorized_consensus_required_fields: [provider, permissionScope, asOf, vintage, metricDefinition, unit, period]
  missing_behavior:
    comparison_status: not_authorized_or_not_vintaged
    blocked_claims: [beat_consensus, miss_consensus, above_consensus, below_consensus]
    allowed_comparisons: [company_guidance, internal_prior]

prohibitions:
  - 自动评级
  - 自动目标价
  - 自动仓位
  - 自动交易指令

runtime_mapping:
  rule_policy: 05_control_evaluation/01_rules/policies/financial_model_integrity_policy.yaml
  validator: 06_runtime/src/research/financial-model-contract.ts
  nodes: [financial_normalization, model_build_or_update, model_audit, valuation_analysis, thesis_update, independent_review]
  tests: 06_runtime/tests/financial-capability.test.ts
