schema_name: task_domain_registry
schema_version: 4.0.0
status: active

authority:
  answers: |
    02_scenario_task = 定义 Intent、Scenario 与 Task motif 如何组成 Research Problem Graph；
    不重定义语义类型，不负责能力实现，也不拥有 Execution TaskGraph。
  write_entry: 02_scenario_task/
  read_primary: 02_scenario_task/**/registry.yaml
  executable_node_catalog: 06_runtime/src/runtime/node-catalog.ts
  planner: 06_runtime/src/runtime/planner.ts

subdomains:
  problem_graph:
    registry: 02_scenario_task/00_problem_graph/registry.yaml
    status: active
  intents:
    registry: 02_scenario_task/01_intents/registry.yaml
    status: active
  scenarios:
    registry: 02_scenario_task/02_scenarios/registry.yaml
    status: active
  tasks:
    registry: 02_scenario_task/03_tasks/registry.yaml
    status: active
  roles:
    registry: 02_scenario_task/04_roles/registry.yaml
    status: active
  workflow_patterns:
    registry: 02_scenario_task/05_workflow_patterns/registry.yaml
    status: active

layers:
  catalog_nodes:
    - User Intent → 01_intents/
    - Scenario constraint → 02_scenarios/
    - Task Contract / graph motif → 03_tasks/
    - Role → 04_roles/
    - Workflow Pattern / frontier prior → 05_workflow_patterns/
  assembly_edges: 00_problem_graph/contract.yaml
  execution_projection: Planning Intent / Execution TaskGraph → 06_runtime

notes:
  - Intent、Scenario、Task Contract 是可组合图输入，不是固定主链或阶段。
  - Research Problem Graph（02）≠ Research Provenance Graph（01）≠ Execution TaskGraph（06）。
  - Deep Research 仅 workflow pattern prior，禁止固定 01→05 controller；历史正文已删除。
