schema_name: task_role_registry
schema_version: 3.1.0
status: active

authority:
  write_entry: 02_scenario_task/04_roles/
  role_catalog: 02_scenario_task/04_roles/roles.yaml
  agent_registry: 03_agent_capability/01_agents/registry.yaml

rules:
  - Role defines responsibility positions within a research task.
  - Role does not identify a concrete Agent.
  - Agent capability declares which roles an Agent can assume.
  - Runtime resolves the actual actor-role assignment during execution.
  - Human approval gates are not defined in the Role domain.
