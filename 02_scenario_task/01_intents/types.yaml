schema_name: research_intent_types
schema_version: 1.0.0
status: active
authority: 02_scenario_task/01_intents
description: |
  用户级研究意图（User Intent）：用户想完成哪一类研究目标。
  不等于 Runtime ResearchIntent（full_research / evidence_only / …）；后者是规划先验。

intent_types:
  investment_research:
    label_zh: 投研判断
    definition: 围绕标的、行业或事件形成可审计的投资相关判断
    typical_tasks: [cycle_judgment, event_impact, company_analysis, technology_route_analysis, value_chain_analysis]
  evidence_audit:
    label_zh: 证据审计
    definition: 用户明确只要核验/补齐证据链，不要求完整判断交付
    note: 映射到 Runtime ResearchIntent=evidence_only；不是 03_tasks 标准研究任务
  judgment_update:
    label_zh: 判断更新
    definition: 在已有研究基础上因新事实/新事件改判或复核
  delivery_only:
    label_zh: 仅交付表达
    definition: 判断已确认，只需合成可读交付物
