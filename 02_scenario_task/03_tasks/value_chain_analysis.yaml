schema_name: research_task_contract
schema_version: 3.0.0

task_id: value_chain_analysis
name: 产业链分析
description: 识别上下游结构、瓶颈与传导关系，判断影响方向而非泛泛描述产业链。

objective: >
  刻画上下游依赖结构、瓶颈位置与传导关系，区分名义供给与有效供给，
  并判断关键节点变化的影响方向与改判条件。

scope:
  applies_when:
    - 问题核心涉及上下游依赖、瓶颈、传导或供给约束
    - 需要区分结构位置与影响路径
    - 需要回答“卡在哪里 / 怎么传导 / 影响谁”
  excludes_when:
    - 仅要求列举产业链参与者名单
    - 核心是单一公司命题且不涉及上下游依赖
    - 仅要求描述单一事件而不涉及结构传导

judgment_requirements:
  - 上下游结构识别（关键节点与依赖方向）
  - 瓶颈识别（名义供给 vs 有效供给）
  - 传导关系（冲击如何沿链传递）
  - 对关键对象的影响方向
  - 主要反证与改判条件

expected_output:
  - structure_map
  - bottlenecks
  - transmission_paths
  - impact_direction
  - confidence
  - reversal_conditions

completion_criteria:
  - 已形成明确或“暂不可判断”的结构/瓶颈/传导结论
  - 结构识别、瓶颈、传导与影响方向均已覆盖或标明缺口
  - 已说明主要反证和改判条件

uncertainty_policy:
  allow_insufficient_evidence: true

graph_motif:
  root_question: value_chain_question
  judgment_unit_roles:
    - {id: structure_map, purpose: 识别关键节点与依赖方向, required: true}
    - {id: bottlenecks, purpose: 区分名义供给与有效供给并识别瓶颈, required: true}
    - {id: transmission_paths, purpose: 判断冲击如何沿依赖网络传递, required: true}
    - {id: impact_direction, purpose: 判断关键对象的影响方向, required: true}
    - {id: reversal_conditions, purpose: 登记反证与改判条件, required: true}
  edges:
    - {from: structure_map, to: bottlenecks, relation: informs}
    - {from: structure_map, to: transmission_paths, relation: requires}
    - {from: bottlenecks, to: transmission_paths, relation: informs}
    - {from: transmission_paths, to: impact_direction, relation: requires}
    - {from: reversal_conditions, to: impact_direction, relation: challenges}
    - {from: structure_map, to: value_chain_question, relation: aggregates}
    - {from: bottlenecks, to: value_chain_question, relation: aggregates}
    - {from: impact_direction, to: value_chain_question, relation: aggregates}
  competing_explanation_policy:
    required_for: [bottlenecks, transmission_paths, impact_direction]
    minimum: 1
  aggregation:
    mode: structure_path_and_impact_required
    required_units: [structure_map, bottlenecks, transmission_paths, impact_direction, reversal_conditions]
    allow_partial_with_gaps: true

capability_requirements:
  - structural_dependency_reasoning
  - bottleneck_identification
  - evidence_assessment
