schema_name: research_task_contract
schema_version: 3.0.0

task_id: technology_route_analysis
name: 技术路线分析
description: 评估技术路线的成熟度、替代性与商业化约束，并给出可证伪边界。

objective: >
  评估给定技术路线相对替代方案的成熟度、替代性与商业化约束，
  明确可证伪边界与改判条件。

scope:
  applies_when:
    - 问题核心是技术能力、成熟度、替代进度或商业化可行性
    - 存在可比较的技术路线或替代路径
    - 需要判断“能不能用 / 能不能放量 / 受什么约束”
  excludes_when:
    - 仅要求解释技术原理而不形成判断
    - 核心是公司财务或行业周期，技术只是背景
    - 没有可识别的技术边界或比较对象

judgment_requirements:
  - 技术边界与比较对象
  - 成熟度所处阶段
  - 相对替代路线的优劣势
  - 商业化与量产约束
  - 证伪边界与改判条件

expected_output:
  - technology_boundary
  - maturity_stage
  - substitution_assessment
  - commercialization_constraints
  - confidence
  - falsification_conditions

completion_criteria:
  - 已形成明确或“暂不可判断”的技术路线结论
  - 成熟度、替代性与商业化约束均已覆盖或标明缺口
  - 已给出可证伪边界与改判条件

uncertainty_policy:
  allow_insufficient_evidence: true

graph_motif:
  root_question: technology_route_question
  judgment_unit_roles:
    - {id: technology_boundary, purpose: 冻结技术边界与比较对象, required: true}
    - {id: maturity_stage, purpose: 判断成熟度阶段, required: true}
    - {id: substitution_assessment, purpose: 判断相对替代路线优劣, required: true}
    - {id: commercialization_constraints, purpose: 判断商业化与量产约束, required: true}
    - {id: falsification_conditions, purpose: 登记证伪边界与改判条件, required: true}
  edges:
    - {from: technology_boundary, to: maturity_stage, relation: requires}
    - {from: technology_boundary, to: substitution_assessment, relation: requires}
    - {from: maturity_stage, to: commercialization_constraints, relation: informs}
    - {from: commercialization_constraints, to: substitution_assessment, relation: informs}
    - {from: falsification_conditions, to: substitution_assessment, relation: challenges}
    - {from: maturity_stage, to: technology_route_question, relation: aggregates}
    - {from: substitution_assessment, to: technology_route_question, relation: aggregates}
    - {from: commercialization_constraints, to: technology_route_question, relation: aggregates}
  competing_explanation_policy:
    required_for: [substitution_assessment, commercialization_constraints]
    minimum: 1
  aggregation:
    mode: comparative_route_with_commercialization_gate
    required_units: [technology_boundary, maturity_stage, substitution_assessment, commercialization_constraints, falsification_conditions]
    allow_partial_with_gaps: true

capability_requirements:
  - technology_maturity_reasoning
  - comparative_assessment
  - evidence_assessment

runtime_projection:
  scenario_refs: [TechnologyRouteResearch]
  activation_terms: [技术, 路线, 成熟度, 良率, 商业化, 替代, 硅光, SiC, 碳化硅]
  unit_judgment_types:
    technology_boundary: state_measurement
    maturity_stage: cycle_phase
    substitution_assessment: object_differentiation
    commercialization_constraints: causal_attribution
    falsification_conditions: state_measurement
