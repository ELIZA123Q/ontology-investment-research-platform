schema_name: research_task_contract
schema_version: 3.0.0

task_id: company_analysis
name: 公司分析
description: >
  围绕明确的公司经营或业绩命题，形成可验证的公司层判断；
  不是对公司做无边界的全面尽调。

objective: >
  围绕明确的公司经营或业绩命题，判断其关键驱动、证据支持程度、
  业绩传导路径及改判条件。

scope:
  applies_when:
    - 问题中心是特定公司的经营状态、订单、业绩或竞争位置
    - 已有或可形成明确命题（例如订单兑现、份额变化、利润弹性）
    - 需要评估证据是否足以支撑该命题
  excludes_when:
    - 要求对公司做无命题的“全面研究”
    - 核心是行业周期、技术路线或产业链结构，公司只是举例对象
    - 仅要求核实单一公告或单一财务读数

task_layer: narrow_company_proposition
composition_rule: 可作为 company_coverage、earnings_update 或行业研究中的公司兑现分支复用；不得自动扩张为首次覆盖。

judgment_requirements:
  - 公司命题的明确表述与范围边界
  - 关键经营/业绩驱动变量
  - 证据对命题的支持程度与主要缺口
  - 从驱动到业绩的传导关系
  - 主要反证与改判条件

expected_output:
  - proposition
  - key_drivers
  - evidence_support_level
  - performance_transmission
  - confidence
  - reversal_conditions

completion_criteria:
  - 已形成明确或“暂不可判断”的公司命题结论
  - 关键驱动与传导已点明，而非罗列公司全貌
  - 关键判断均存在证据支撑或明确证据缺口
  - 已说明主要反证和改判条件

uncertainty_policy:
  allow_insufficient_evidence: true
  governed_outcomes: [completed_supported, completed_indeterminate, stopped_insufficient_evidence, blocked_permission, blocked_missing_source, blocked_policy]

graph_motif:
  root_question: company_proposition_question
  judgment_unit_roles:
    - {id: proposition_scope, purpose: 冻结公司命题与范围, required: true}
    - {id: key_drivers, purpose: 判断关键经营或业绩驱动, required: true}
    - {id: evidence_support, purpose: 判断证据支持程度与缺口, required: true}
    - {id: performance_transmission, purpose: 判断从驱动到业绩的传导, required: true}
    - {id: countercase_and_reversal, purpose: 登记反证与改判条件, required: true}
  edges:
    - {from: proposition_scope, to: evidence_support, relation: requires}
    - {from: key_drivers, to: performance_transmission, relation: informs}
    - {from: evidence_support, to: performance_transmission, relation: informs}
    - {from: countercase_and_reversal, to: proposition_scope, relation: challenges}
    - {from: key_drivers, to: company_proposition_question, relation: aggregates}
    - {from: evidence_support, to: company_proposition_question, relation: aggregates}
    - {from: performance_transmission, to: company_proposition_question, relation: aggregates}
  competing_explanation_policy:
    required_for: [key_drivers, performance_transmission]
    minimum: 1
  aggregation:
    mode: proposition_with_transmission_and_evidence_ceiling
    required_units: [proposition_scope, key_drivers, evidence_support, performance_transmission, countercase_and_reversal]
    allow_partial_with_gaps: true

capability_requirements:
  - company_operating_reasoning
  - financial_transmission_reasoning
  - evidence_assessment

runtime_projection:
  selection_priority: 10
  scenario_refs: [CompanyResearch]
  activation_terms: [公司, 企业, 经营, 收入, 利润, 订单, 份额, 竞争位置]
  default_when_no_match: true
  unit_judgment_types:
    proposition_scope: state_measurement
    key_drivers: causal_attribution
    evidence_support: state_measurement
    performance_transmission: transmission_path
    countercase_and_reversal: causal_attribution
