schema_name: research_task_contract
schema_version: 3.0.0

task_id: cycle_judgment
name: 周期判断
description: 对行业或子行业在给定时间窗内的景气周期状态形成可验证判断。

objective: >
  判断给定时间窗内行业或子行业所处周期状态、变化方向及潜在拐点，
  并明确判断依据与改判条件。

scope:
  applies_when:
    - 问题核心涉及行业景气状态、趋势或拐点
    - 需要综合多个周期变量判断共同变化
    - 需要回答“处于什么阶段 / 是否接近拐点”
  excludes_when:
    - 仅要求核实单一事实或单一指标读数
    - 仅要求描述某一事件本身而不涉及周期状态
    - 核心是公司经营命题而非行业周期命题

judgment_requirements:
  - 当前周期状态（上行 / 下行 / 筑底 / 见顶 / 拐点区间 / 暂不可判断）
  - 周期变化方向
  - 主要驱动变量及约束变量
  - 是否存在拐点及其确认条件
  - 主要反证与改判条件

expected_output:
  - cycle_state
  - direction
  - key_drivers
  - turning_point_assessment
  - confidence
  - reversal_conditions

completion_criteria:
  - 已形成明确或“暂不可判断”的周期结论
  - 关键判断均存在证据支撑或明确证据缺口
  - 已说明主要反证和改判条件

uncertainty_policy:
  allow_insufficient_evidence: true

graph_motif:
  root_question: cycle_question
  judgment_unit_roles:
    - {id: cycle_state, purpose: 判断当前周期位置, required: true}
    - {id: direction, purpose: 判断周期变化方向, required: true}
    - {id: drivers_and_constraints, purpose: 区分驱动变量与约束变量, required: true}
    - {id: turning_point, purpose: 判断拐点及确认条件, required: true}
    - {id: reversal_conditions, purpose: 登记反证与改判条件, required: true}
  edges:
    - {from: drivers_and_constraints, to: cycle_state, relation: informs}
    - {from: drivers_and_constraints, to: direction, relation: informs}
    - {from: cycle_state, to: turning_point, relation: requires}
    - {from: direction, to: turning_point, relation: requires}
    - {from: reversal_conditions, to: cycle_state, relation: challenges}
    - {from: cycle_state, to: cycle_question, relation: aggregates}
    - {from: direction, to: cycle_question, relation: aggregates}
    - {from: turning_point, to: cycle_question, relation: aggregates}
  competing_explanation_policy:
    required_for: [cycle_state, turning_point]
    minimum: 1
  aggregation:
    mode: required_units_with_explicit_block
    required_units: [cycle_state, direction, drivers_and_constraints, turning_point, reversal_conditions]
    allow_partial_with_gaps: true

capability_requirements:
  - temporal_state_reasoning
  - evidence_assessment
  - counterfactual_reasoning

runtime_projection:
  scenario_refs: [IndustryResearch]
  activation_terms: [行业, 景气, 周期, 库存, 价格, 供需, 拐点]
  unit_judgment_types:
    cycle_state: cycle_phase
    direction: trend_direction
    drivers_and_constraints: causal_attribution
    turning_point: cycle_phase
    reversal_conditions: state_measurement
