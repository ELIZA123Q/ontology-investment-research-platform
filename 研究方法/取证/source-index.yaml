    access_scope: public
    update_cadence: 月度
    independence_group: china_customs_primary
    required_locator_level: 商品编码、流向、伙伴、期间、金额或数量及查询时间
    known_limitations: [商品编码不等于行业分类, 出口目的地不等于最终消费地]
