    query_playbook_ref: OPS_通用真实来源查询与回退手册.md#QP-GEN-02
    access_scope: public
    update_cadence: 月度、季度与年度
    independence_group: china_official_statistics
    required_locator_level: 指标名、地区、频率、期间、单位与查询时间
    known_limitations: [累计与当月不可混用, 初值和修订值须区分]
    fallback_refs: [miit-electronics-operation]
    last_verified: 2026-09-15

  - id: china-customs-statistics
