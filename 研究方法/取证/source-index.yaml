    query_playbook_ref: OPS_通用真实来源查询与回退手册.md#QP-GEN-10
    access_scope: public
    update_cadence: 交易日或上游更新频率
    independence_group: upstream_market_data
    required_locator_level: 上游来源加函数、参数、字段与日期区间
    known_limitations: [聚合接口只用于发现和候选取数, 正式事实须保留真实上游来源与查询参数]
