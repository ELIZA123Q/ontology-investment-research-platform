schema_name: public_research_source_index
schema_version: 1.0.0
status: active
description: 只索引稳定来源族、正式入口与查询手册；不保存动态事实、当前数值或研究结论。

sources:
  - id: cninfo-disclosures
    producer: 深圳证券信息有限公司（巨潮资讯网）
    source_roles: [primary, baseline, mechanism, counter]
    markets: [A股]
    domains: [general]
    official_entry_url: https://www.cninfo.com.cn/new/commonUrl/pageOfSearch?url=disclosure/list/search
    query_playbook_ref: OPS_通用真实来源查询与回退手册.md#QP-GEN-04
    access_scope: public
    update_cadence: 事件级与法定报告期
    independence_group: issuer_primary_by_issuer_and_document_lineage
    required_locator_level: 公告编号加页码或表格
    known_limitations: [同一公告的交易所页和公司镜像不构成独立来源, 动态查询入口可能调整]
    fallback_refs: [sse-disclosures, szse-disclosures, bse-disclosures]
    last_verified: 2026-09-15

