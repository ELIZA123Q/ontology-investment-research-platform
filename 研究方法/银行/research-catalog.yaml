schema_name: bank_research_method_catalog
schema_version: 1.0.0
status: candidate
domain: bank
updated_at: 2026-09-15
purpose: A股银行、银行指数和银行ETF研究的领域扩展目录；只登记证据剖面、框架入口和停止条件，不保存当期事实或交易建议。

