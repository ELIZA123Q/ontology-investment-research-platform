principles:
  PR-001:
    lineage_id: PR-001
    version: 1
    supersedes: null
    status: candidate
    proposition: 完整A股权益研究以有信息截面、验证窗口和失效条件的可证伪投资命题为终点。
    applicability: 完整权益研究及研究更新；不代替事实核验或形成买卖、仓位和择时指令。
    market_scope: A_share
    modes: [full_research, research_update]
    falsifiers: [无法确定可观察的验证与失效信号时，退回研究问题而非强行形成命题]
    source_refs:
      - {kind: user_instruction, ref: 本任务已确认方案《建立你的A股权益投研方法论》}
