document_type: sealed_adjudication_contract
schema_version: 1.1.0
case_id: RV-T01
not_a_reference_report: true
provenance:
  independence_mode: pilot_manual
  limitation: 当前为试点人工密封契约；正式扩展案例必须改为双轨独立生成。
  dual_route_required_for_expansion: true
  framework_rules_usage: boundary_check_only
objective_checks:
  numeric_temporal_object_source_alignment: required
  minimum_evidence_exists: required
  no_post_cutoff_material: required
  no_prediction_as_fact: required
core_claims:
  - claim_id: T01-C1
    statement: DRAM与NAND处于价格强化阶段，但价格口径必须分开。
    criticality: primary
    strength_ceiling: R3
    minimum_evidence_basket: [T01-E01, T01-E04]
  - claim_id: T01-C2
    statement: HBM、通用DRAM与NAND不能合并为同一周期位置。
    criticality: primary
    strength_ceiling: R2
    minimum_evidence_basket: [T01-E03, T01-E04]
  - claim_id: T01-C3
    statement: HBM及服务器相关资源配置对通用产品形成方向性供给约束。
    criticality: supporting
    strength_ceiling: R2
    minimum_evidence_basket: [T01-E03, T01-E04]
  - claim_id: T01-C4
    statement: 企业级NAND强于消费端，不能外推为全NAND需求同步繁荣。
    criticality: primary
    strength_ceiling: R2
    minimum_evidence_basket: [T01-E04, T01-E05]
  - claim_id: T01-C5
    statement: 2027H2附近只能作为新增合格供给验证窗口，不能写成统一结束日。
    criticality: boundary
    strength_ceiling: R2
    minimum_evidence_basket: [T01-E06]
allowed_disagreements:
  - 对正常化窗口具体季度的估计可以不同，但必须保留良率、认证与稳定交付条件。
  - 对消费端压力程度可以不同，但不得外推为全部存储需求同步走弱。
strongest_counterevidence:
  - T01-E05所示消费需求破坏可能早于新增供给释放。
  - 客户预防性库存可能放大订单与价格信号。
prohibited_expressions:
  - 三类产品将在同一个确定月份结束周期
  - Micron实现价等于全行业合约价
  - 已确认无条件超周期
update_scenarios:
  - scenario_id: T01-U1
    new_information: DRAM合约价仍上涨，但客户库存连续两个季度上升且部分订单延迟拉货。
    expected_action: weaken
    affected_claims: [T01-C1, T01-C2]
  - scenario_id: T01-U2
    new_information: 新增产线良率、客户认证和稳定交付均早于基线兑现。
    expected_action: weaken
    affected_claims: [T01-C5]
downstream_required_units:
  core_restatement: [分产品阶段, 价格与订单依据, 消费端反证, 统一结束日不可确认]
  tracking_plan: [价格, 库存, 订单质量, HBM认证, 新增合格供给]
  research_questions: [原厂资源配置, 客户库存与拉货, 认证良率与供给兑现]

