schema_name: ablation_scores
schema_version: 1.0.0
case_id: RV-T01
diagnostics:
  - id: term_drift
    label: 术语与口径漂移率
  - id: numeric_source_error
    label: 数字与来源错误率
  - id: structure_completeness
    label: 判断结构完整度
  - id: competing_explanation_coverage
    label: 竞争解释覆盖度
  - id: conclusion_evidence_fit
    label: 结论与证据匹配度
  - id: run_stability
    label: 多次运行稳定性
  - id: unknown_event_adaptivity
    label: 未知事件适应性
  - id: rework_localization
    label: 返工定位清晰度
groups:
  P0:
    condition: 普通单次 Prompt
    scores:
      term_drift: 2
      numeric_source_error: 2
      structure_completeness: 1
      competing_explanation_coverage: 1
      conclusion_evidence_fit: 2
      run_stability: 2
      unknown_event_adaptivity: 2
      rework_localization: 1
    mean: 1.625
  P1:
    condition: 分阶段、无本体切片
    scores:
      term_drift: 2
      numeric_source_error: 3
      structure_completeness: 3
      competing_explanation_coverage: 2
      conclusion_evidence_fit: 3
      run_stability: 3
      unknown_event_adaptivity: 3
      rework_localization: 3
    mean: 2.75
  P2:
    condition: 分阶段 + 本体语义切片
    scores:
      term_drift: 4
      numeric_source_error: 3
      structure_completeness: 4
      competing_explanation_coverage: 3
      conclusion_evidence_fit: 3
      run_stability: 3
      unknown_event_adaptivity: 3
      rework_localization: 4
    mean: 3.375
  P3:
    condition: 全栈（本体 + 方法库 + 证据约束）
    scores:
      term_drift: 4
      numeric_source_error: 4
      structure_completeness: 5
      competing_explanation_coverage: 4
      conclusion_evidence_fit: 4
      run_stability: 4
      unknown_event_adaptivity: 4
      rework_localization: 5
    mean: 4.25
deltas:
  ontology_value: 0.625   # score(P2) - score(P1)
  methods_evidence_value: 0.875  # score(P3) - score(P2)
  full_stack_vs_prompt: 2.625  # score(P3) - score(P0)
interpretation:
  ontology_delta_sign: positive
  methods_delta_sign: positive
  claim_allowed: >
    在 RV-T01 冻结证据与本结构评分条件下，本体切片相对「仅分阶段」呈正向增量（Δ_ontology≈+0.63），
    方法库与证据约束相对「分阶段+本体」再呈正向增量（Δ_methods≈+0.88）。不得外推为系统总体可靠率。
