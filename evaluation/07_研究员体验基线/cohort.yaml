document_type: researcher_experience_baseline_cohort
schema_version: 1.0.0
cohort_id: RXB-SEMI-20260722
title: 半导体研究员体验前瞻基线
status: enrolling
domain: semiconductor
decision_supported: >-
  在保持研究质量护栏的前提下，判断本体工作台是否降低首次可用结论时间、人工操作与返工，
  并据此决定下一版本优先优化什么；不用于研究员个人绩效评价。

measurement_contract:
  version: research-experience-metrics-v1
  prospective_only: true
  run_created_event_required: true
  historical_backfill_allowed: false
  target_setting_after_completed_cases: 8
  targets_frozen: false
  targets: {}

comparison_contract:
  experimental_arm: ontology_workbench
  primary_baseline_arm: same_evidence_direct
  quality_contract: research_value_eval_suite_v2.1
  paired_by_case: true
  same_evidence_snapshot: true
  same_information_cutoff: true
  same_producer_model_family: true
  same_generation_budget: true
  blind_arm_labels_for_quality_review: true
  sequence_assignment: balanced_alternation

ontology_value_contract:
  comparison_target: ontology_constrained_workflow_contribution
  pure_ontology_causal_claim_allowed: false
  reason: >-
    实验臂同时包含本体、方法、证据治理与交互流程，不能把全部配对差异归因于本体本身；
    只能在确认本体规则和语义留痕真实执行后，分析“本体约束工作流”的贡献。
  required_runtime_measurements:
    - traceable_claim_ratio
    - judgment_method_trace_ratio
    - rule_evaluation_count
    - method_finalization_ratio
  outcome_dimensions:
    - 无来源主张控制
    - 反证与竞争解释
    - 结论边界
    - 可复盘性
  coverage_requirements:
    semantic_alignment: 2
    evidence_threshold: 2
    competing_explanation: 2
    causal_boundary: 1
    stage_scope_guard: 2
    incremental_invalidation: 2
    source_provenance: 1
    cross_run_comparability: 1
    forecast_boundary: 1

primary_case_policy:
  minimum_cases: 8
  maximum_cases: 12
  required_domain: semiconductor
  allowed_statuses: [planned, enrolled, running, completed, excluded]
  exclusions:
    - archive_or_ui_test
    - duplicated_question_or_run
    - synthetic_only
    - missing_run_created_event
    - evidence_snapshot_not_frozen
    - arm_inputs_not_comparable
  coverage_requirements:
    normal_success: 3
    conflict_stop: 2
    insufficient_stop: 2
    incremental_rejudgment: 2
    source_invalidation: 1

historical_anchors:
  - anchor_id: RXB-H01
    run_id: ac9e6a56-46fc-4f32-88a8-71cb22540d9c
    role: evidence_insufficiency_reference
    measurement_status: partial
    quantitative_cohort_eligible: false
    reason: 任务早于体验事件台账，只能验证正确停止和产物质量，不能还原操作与返工。
  - anchor_id: RXB-H02
    run_id: 536a5f6f-84ed-423a-9a52-be3bd0b25291
    role: bounded_directional_reference
    measurement_status: partial
    quantitative_cohort_eligible: false
    reason: 任务早于体验事件台账，只能验证首次结论和质量边界，不能进入前瞻体验分母。

primary_cases:
  - case_id: RXB-S01
    status: planned
    run_id: null
    real_task_origin: research_backlog
    decision_context: 核验发行人历史增长事实与可外推边界。
    information_cutoff: 2025-01-16
    question: >-
      截至 2025-01-16，台积电 2024 年全年营收是否同比增长，且第四季度同比增速是否高于全年；
      这些事实最多支持什么强度的经营方向判断？
    task_family: state_measurement
    ontology_value_hypotheses: [semantic_alignment, evidence_threshold, forecast_boundary]
    scenarios: [normal_success]
    allowed_terminals: [directional, correct_stop]
    evidence_snapshot_required: true
    paired_baseline_required: true

  - case_id: RXB-S02
    status: planned
    run_id: null
    real_task_origin: research_backlog
    decision_context: 在价格、库存和抢运信号冲突时决定是否形成周期判断。
    information_cutoff: 2025-06-30
    question: >-
      以 2025 年上半年公开信息为限，全球非 HBM DRAM 是否已进入可持续景气改善阶段；
      价格上修、库存回补、政策抢运和现货需求谨慎之间应如何裁决？
    task_family: cycle_judgment
    ontology_value_hypotheses: [competing_explanation, incremental_invalidation]
    scenarios: [conflict_stop, incremental_rejudgment]
    allowed_terminals: [directional, correct_stop]
    evidence_snapshot_required: true
    paired_baseline_required: true

  - case_id: RXB-S03
    status: planned
    run_id: null
    real_task_origin: research_backlog
    decision_context: 区分先进封装产能公告、资格验证与实际收入兑现。
    information_cutoff: 2025-04-30
    question: >-
      截至 2025-04-30，主要厂商披露的 CoWoS 扩产是否已转化为可核验的有效产能和收入贡献，
      还是证据仍只支持扩产计划与需求意向？
    task_family: capacity_realization
    ontology_value_hypotheses: [stage_scope_guard, evidence_threshold]
    scenarios: [insufficient_stop]
    allowed_terminals: [directional, correct_stop]
    evidence_snapshot_required: true
    paired_baseline_required: true

  - case_id: RXB-S04
    status: planned
    run_id: null
    real_task_origin: research_backlog
    decision_context: 在厂商口径不同的情况下比较 HBM 供需信号。
    information_cutoff: 2025-02-28
    question: >-
      截至 2025-02-28，SK 海力士、Micron 与 Samsung 对 HBM 供给、认证和销售的披露是否可直接比较，
      并足以支持 2025 年供给仍偏紧的方向判断？
    task_family: cross_company_comparability
    ontology_value_hypotheses: [cross_run_comparability, semantic_alignment, stage_scope_guard]
    scenarios: [normal_success, conflict_stop]
    allowed_terminals: [directional, correct_stop]
    evidence_snapshot_required: true
    paired_baseline_required: true

  - case_id: RXB-S05
    status: planned
    run_id: null
    real_task_origin: research_backlog
    decision_context: 评估政策冲击与国产设备商业兑现之间的因果边界。
    information_cutoff: 2025-03-31
    question: >-
      截至 2025-03-31，出口管制是否已经带来中国半导体设备厂商可核验的订单或收入兑现，
      哪些变化只能表述为替代机会而不能归因于政策？
    task_family: causal_attribution
    ontology_value_hypotheses: [causal_boundary, source_provenance]
    scenarios: [normal_success]
    allowed_terminals: [directional, correct_stop]
    evidence_snapshot_required: true
    paired_baseline_required: true

  - case_id: RXB-S06
    status: planned
    run_id: null
    real_task_origin: research_backlog
    decision_context: 新季度披露出现后判断旧有代工景气结论是否需要调整。
    information_cutoff: 2025-04-30
    question: >-
      在新增一季资本开支、产能利用率与价格披露后，成熟制程代工景气判断应保持、削弱还是改判；
      哪一条新证据真正改变了结论？
    task_family: incremental_update
    ontology_value_hypotheses: [incremental_invalidation, semantic_alignment]
    scenarios: [normal_success, incremental_rejudgment]
    allowed_terminals: [directional, correct_stop]
    evidence_snapshot_required: true
    paired_baseline_required: true

  - case_id: RXB-S07
    status: planned
    run_id: null
    real_task_origin: research_backlog
    decision_context: 防止把客户认证、送样或设计导入写成规模化收入事实。
    information_cutoff: 2025-03-31
    question: >-
      截至 2025-03-31，先进封装供应链中的客户认证、送样与设计导入信息，
      是否足以支持规模化量产或收入兑现判断？
    task_family: qualification_to_revenue
    ontology_value_hypotheses: [stage_scope_guard, evidence_threshold]
    scenarios: [insufficient_stop]
    allowed_terminals: [directional, correct_stop]
    evidence_snapshot_required: true
    paired_baseline_required: true

  - case_id: RXB-S08
    status: planned
    run_id: null
    real_task_origin: research_backlog
    decision_context: 裁决公司库存改善与渠道端谨慎是否指向同一周期阶段。
    information_cutoff: 2025-04-30
    question: >-
      截至 2025-04-30，模拟与 MCU 厂商的库存天数、订单趋势和渠道评论是否共同支持库存周期见底，
      还是对象与渠道差异要求保留争议？
    task_family: inventory_cycle
    ontology_value_hypotheses: [competing_explanation, cross_run_comparability]
    scenarios: [conflict_stop]
    allowed_terminals: [directional, correct_stop]
    evidence_snapshot_required: true
    paired_baseline_required: true

  - case_id: RXB-S09
    status: planned
    run_id: null
    real_task_origin: research_backlog
    decision_context: 验证关键来源失效时结论和下游表达是否局部降级。
    information_cutoff: 2025-01-31
    question: >-
      截至 2025-01-31，Intel Foundry 2024 年经营亏损是否较 2023 年扩大，
      且在关键公司披露来源被撤回或判定不可用后，哪些判断必须降级或停止？
    task_family: source_resilience
    ontology_value_hypotheses: [source_provenance, incremental_invalidation]
    scenarios: [normal_success, source_invalidation]
    allowed_terminals: [directional, correct_stop]
    evidence_snapshot_required: true
    paired_baseline_required: true

  - case_id: RXB-S10
    status: planned
    run_id: null
    real_task_origin: research_backlog
    decision_context: 约束从订单和指引到行业景气持续性的外推。
    information_cutoff: 2025-01-31
    question: >-
      截至 2025-01-31，ASML 的订单、积压订单与年度销售指引是否足以支持先进制程设备需求持续改善，
      哪些结论仍属于预测而非已实现事实？
    task_family: forecast_boundary
    ontology_value_hypotheses: [forecast_boundary, evidence_threshold]
    scenarios: [normal_success, incremental_rejudgment]
    allowed_terminals: [directional, correct_stop]
    evidence_snapshot_required: true
    paired_baseline_required: true
