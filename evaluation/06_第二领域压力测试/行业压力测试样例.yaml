    seed_scenario: 电价机制或燃料成本变化能否传导为电力运营利润改善
    judgment_types_expected: [mechanism_validation, transmission_path, impact_realization]
    required_evidence_profiles: [power_demand_utilization, tariff_mechanism, fuel_cost, cashflow_debt]
    must_block_if_missing: [结算电价, 利用小时, 入炉成本, 经营现金流]
    success_criteria:
      - 电源类型、区域和电价机制分开
      - 市场煤价不直接等于公司燃料成本
      - 至少检查补贴拖欠或资本开支反证
  - case_id: SD-PT-INS-001
    domain_label: insurance
    ontology_package: ../../ontology/02_领域/insurance
    question: 保费增长是否真正传导为保险公司价值、承保和利润改善？
    seed_scenario: 保费增长能否传导为保险公司价值与利润改善
    judgment_types_expected: [state_measurement, transmission_path, impact_realization]
    required_evidence_profiles: [life_new_business, pnc_underwriting, investment_return, solvency_capital]
    must_block_if_missing: [NBV或价值率, 综合成本率, 投资收益和资产配置, 偿付能力]
    success_criteria:
      - 寿险、财险和投资端分开
      - 原保费不直接写成价值增长
      - 至少检查低价值产品或投资波动反证
  - case_id: SD-PT-DEF-001
    domain_label: defense_industry
    ontology_package: ../../ontology/02_领域/defense_industry
