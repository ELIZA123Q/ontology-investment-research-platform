document_type: multi_domain_pressure_case_set
schema_version: 1.0.0
status: draft_domain_seed_cases
ontology_extension_allowed: false
industry_framework_allowed: false
evidence_policy:
  public_sources_only: true
  must_quote_verify: true
  must_keep_counter_evidence: true
  source_quick_ref: ../../methods/03_取证/B04_非半导体行业来源速查.md
cases:
  - case_id: SD-PT-DRUG-001
    domain_label: innovative_drug
    ontology_package: ../../ontology/02_领域/innovative_drug
    question: 单个已获批创新药在获批后 12 个月内是否进入商业化兑现阶段？
    seed_scenario: 创新药获批后能否形成商业化兑现
    judgment_types_expected: [state_measurement, transmission_path, impact_realization]
    required_evidence_profiles: [clinical_evidence, regulatory_status, reimbursement_access, commercialization, competitive_context]
    must_block_if_missing: [标签范围, 支付限制或价格, 处方或销售验证]
    success_criteria:
      - 获批、医保准入和销售兑现分层表达
      - 不把获批事件直接写成收入改善
      - 至少保留一条竞品或支付约束反证
  - case_id: SD-PT-SEC-001
    domain_label: securities
    ontology_package: ../../ontology/02_领域/securities
    question: A股市场活跃度改善是否已经能传导到证券公司经纪和利润弹性？
    seed_scenario: 市场活跃度改善能否传导为证券公司经营改善
    judgment_types_expected: [state_measurement, transmission_path, impact_realization]
    required_evidence_profiles: [market_activity, margin_financing, underwriting_cycle, business_mix_profit]
    must_block_if_missing: [佣金率或分部收入, 自营扰动, 成本或减值]
    success_criteria:
      - 指数、成交、两融、投行和公司利润分开
      - 行业活跃度不直接落到单家公司利润
      - 至少检查佣金率下行或自营亏损反证
  - case_id: SD-PT-BANK-001
    domain_label: banking
    ontology_package: ../../ontology/02_领域/banking
    question: 银行净息差压力是否已被资产质量和拨备改善抵消？
    seed_scenario: 净息差变化能否传导为银行利润改善
    judgment_types_expected: [state_measurement, causal_attribution, impact_realization]
    required_evidence_profiles: [net_interest_margin, asset_quality_migration, provision_capital, loan_demand_structure]
    must_block_if_missing: [资产负债重定价, 关注或逾期指标, 拨备和资本约束]
    success_criteria:
      - 息差、信用成本和资本约束分别判断
      - 不良率稳定不直接写成风险下降
      - 至少检查贷款结构和拨备释放反证
  - case_id: SD-PT-NEPE-001
    domain_label: new_energy_power_equipment
    ontology_package: ../../ontology/02_领域/new_energy_power_equipment
    question: 光伏或储能链价格企稳是否已进入企业盈利修复阶段？
    seed_scenario: 价格企稳能否传导为新能源设备企业盈利修复
    judgment_types_expected: [cycle_phase, transmission_path, impact_realization]
    required_evidence_profiles: [demand_tender_installation, supply_inventory_capacity, pricing_margin, delivery_cashflow]
    must_block_if_missing: [成交价或合同价, 库存和开工率, 公司毛利或现金流]
    success_criteria:
      - 报价、成交价、毛利和现金流分开
      - 中标不直接写成收入兑现
      - 至少检查成本同步上升或低价长单反证
  - case_id: SD-PT-RE-001
    domain_label: real_estate_chain
    ontology_package: ../../ontology/02_领域/real_estate_chain
    question: 地产政策放松是否已传导到销售、开工和地产链需求？
    seed_scenario: 地产政策放松能否传导为销售、开工和地产链兑现
    judgment_types_expected: [transmission_path, cycle_phase, impact_realization]
    required_evidence_profiles: [policy_financing, sales_inventory, construction_completion, developer_credit_cashflow]
    must_block_if_missing: [政策执行口径, 成交量价库存, 开工或竣工, 回款和信用]
    success_criteria:
      - 政策发布、成交改善和开工改善分层
      - 竣工改善不直接写成建材新增需求
      - 至少检查库存高企或信用压力反证
  - case_id: SD-PT-CONS-001
    domain_label: consumer_retail
    ontology_package: ../../ontology/02_领域/consumer_retail
    question: 渠道销售改善是否代表消费品牌真实动销和利润质量改善？
    seed_scenario: 渠道销售改善能否传导为消费品牌真实收入质量改善
    judgment_types_expected: [state_measurement, object_differentiation, impact_realization]
    required_evidence_profiles: [terminal_demand, channel_inventory, pricing_brand_power, financial_quality]
    must_block_if_missing: [终端动销, 渠道库存, 折扣率, 费用和现金流]
    success_criteria:
      - 发货、GMV、净收入和现金流分开
      - 大促战报不直接写成长期需求
      - 至少检查压货、折扣扩大或退货反证
  - case_id: SD-PT-INET-001
    domain_label: internet_platform
    ontology_package: ../../ontology/02_领域/internet_platform
    question: 单一平台业务线的用户或交易改善是否足以支撑收入与利润兑现？
    seed_scenario: 平台用户或交易改善能否传导为收入与利润兑现
    judgment_types_expected: [state_measurement, transmission_path, impact_realization]
    required_evidence_profiles: [user_engagement, monetization_efficiency, regulatory_boundary, profit_realization]
    must_block_if_missing: [业务线口径, 变现率, 费用或补贴, 分部利润]
    success_criteria:
      - 每次只验证广告、电商、游戏、云等单一业务线
      - 用户或GMV不直接推出收入和利润
      - 至少检查补贴、监管或费用反证
  - case_id: SD-PT-UTIL-001
    domain_label: utilities_power
    ontology_package: ../../ontology/02_领域/utilities_power
