document_type: model_profile_registry
schema_version: 1.0.0
# 单供应商 DeepSeek：当前统一 deepseek-v4-flash。
# 仅验证管线可跑通；不得外推区分能力或 formal_full 跨模型可靠率。
run_mode: single_vendor
profiles:
  producer:
    model_id: deepseek-v4-flash
    provider_family: deepseek
    command: [python3, evaluation/03_执行/http_model_adapter.py, --profile, producer]
  judge_a:
    model_id: deepseek-v4-flash
    provider_family: deepseek
    command: [python3, evaluation/03_执行/http_model_adapter.py, --profile, judge_a]
  judge_b:
    model_id: deepseek-v4-flash
    provider_family: deepseek
    command: [python3, evaluation/03_执行/http_model_adapter.py, --profile, judge_b]
  downstream_a:
    model_id: deepseek-v4-flash
    provider_family: deepseek
    command: [python3, evaluation/03_执行/http_model_adapter.py, --profile, downstream_a]
  downstream_b:
    model_id: deepseek-v4-flash
    provider_family: deepseek
    command: [python3, evaluation/03_执行/http_model_adapter.py, --profile, downstream_b]
role_bindings:
  producer: producer
  judges: [judge_a, judge_b]
  downstream_models: [downstream_a, downstream_b]
isolation_notes:
  - 单模型 pilot：全部角色共用 deepseek-v4-flash；仅验证管线，不得外推区分能力或正式可靠率。
  - pilot_light 通过后若要发布 formal_full 级结论，仍须满足多 model_id 的 official 档案（见 model_profiles.example.yaml）。
