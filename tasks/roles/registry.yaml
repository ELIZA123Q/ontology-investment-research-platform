schema_name: task_role_registry
schema_version: 1.0.0
status: active
source_of_truth: runtime/agents

roles:
  - role_id: intake_analyst
    maps_to_agent: runtime/agents/01_intake
    responsibility: 明确任务边界、对象、时间窗与可受理性
    human_gates: [scope_confirmation]
  - role_id: structure_analyst
    maps_to_agent: runtime/agents/02_structure
    responsibility: 搭建判断结构、本体视图与证据要求
    human_gates: [structure_confirmation]
  - role_id: evidence_reviewer
    maps_to_agent: runtime/agents/03_evidence
    responsibility: 证据采集、核验、覆盖与缺口判断
    human_gates: [evidence_fact_approval]
  - role_id: judgment_reviewer
    maps_to_agent: runtime/agents/04_judgment
    responsibility: 裁决强度、边界与改判条件
    human_gates: [judgment_approval]
  - role_id: delivery_editor
    maps_to_agent: runtime/agents/05_delivery
    responsibility: 输出表达与交付一致性
    human_gates: [delivery_approval]
  - role_id: independent_reviewer
    maps_to_agent: runtime/agents/reviewer
    responsibility: 独立语义审查与质量回路
    human_gates: [independent_review_pass]
