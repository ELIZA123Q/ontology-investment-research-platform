schema_name: deep_research_workflow_registry
schema_version: 1.0.0
status: active
workflow_id: deep_research
workflow_name: Deep Research Workflow
source_of_truth: runtime/workflow/stage_specs

stages:
  - stage_id: 01_intake
    stage_path: runtime/workflow/stage_specs/01_受理/01_投研判断任务受理与整理规范.md
    mirror_path: tasks/workflows/deep_research/stages/01_intake.md
  - stage_id: 02_structure
    stage_path: runtime/workflow/stage_specs/02_结构/02_判断结构与本体视图规范.md
    mirror_path: tasks/workflows/deep_research/stages/02_structure.md
  - stage_id: 03_evidence
    stage_path: runtime/workflow/stage_specs/03_证据/03_数据与证据准备规范.md
    mirror_path: tasks/workflows/deep_research/stages/03_evidence.md
  - stage_id: 04_judgment
    stage_path: runtime/workflow/stage_specs/04_判断/04_推理输出规范.md
    mirror_path: tasks/workflows/deep_research/stages/04_judgment.md
  - stage_id: 05_delivery
    stage_path: runtime/workflow/stage_specs/05_表达/05_投研表达与交付规范.md
    mirror_path: tasks/workflows/deep_research/stages/05_delivery.md

notes:
  - 01—05 为 Task 域下的推荐路径，不是系统一级骨架。
  - 迁移完成前，运行时与校验仍读取 runtime/workflow/stage_specs。
  - mirror_path 为任务域镜像路径，不代表机器权威已切换。
