schema_name: deep_research_workflow_registry
schema_version: 1.1.0
status: active
workflow_id: deep_research
workflow_name: Deep Research Workflow

authority:
  answers: Deep Research 阶段规范新增改动写入 tasks/workflows/deep_research/；runtime stage_specs 仅 compat 回放。
  write_entry: tasks/workflows/deep_research/
  read_primary: tasks/workflows/deep_research/
  compat_read:
    - runtime/workflow/stage_specs/

source_of_truth: tasks/workflows/deep_research
compat_source: runtime/workflow/stage_specs

stages:
  - stage_id: 01_intake
    stage_path: tasks/workflows/deep_research/stages/01_intake.md
    compat_path: runtime/workflow/stage_specs/01_受理/01_投研判断任务受理与整理规范.md
  - stage_id: 02_structure
    stage_path: tasks/workflows/deep_research/stages/02_structure.md
    compat_path: runtime/workflow/stage_specs/02_结构/02_判断结构与本体视图规范.md
  - stage_id: 03_evidence
    stage_path: tasks/workflows/deep_research/stages/03_evidence.md
    compat_path: runtime/workflow/stage_specs/03_证据/03_数据与证据准备规范.md
  - stage_id: 04_judgment
    stage_path: tasks/workflows/deep_research/stages/04_judgment.md
    compat_path: runtime/workflow/stage_specs/04_判断/04_推理输出规范.md
  - stage_id: 05_delivery
    stage_path: tasks/workflows/deep_research/stages/05_delivery.md
    compat_path: runtime/workflow/stage_specs/05_表达/05_投研表达与交付规范.md

notes:
  - 01—05 为 Task 域下的推荐路径，不是系统一级骨架。
  - runtime_contexts / coverage 默认读 stage_path（tasks 镜像）。
  - YAML 阶段模板优先 methods/templates/，runtime/*/模板 为 compat。
