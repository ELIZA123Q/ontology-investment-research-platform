stage: "01"
package_projection: workbench_zod
task_id: JTASK-WB-536a5f6f
question: 截至2025年1月16日，台积电（TSMC）2024年全年合并营收是否实现同比增长？2024年第四季度营收同比增速是否高于2024年全年营收同比增速？
normalized_question: 截至2025年1月16日，台积电（TSMC）2024年全年合并营收是否实现同比增长？2024年第四季度营收同比增速是否高于2024年全年营收同比增速？
core_object: 台积电（TSMC，2330.TW / TSM.N）合并营收
judgment_action: 验证两个方向判断：(1) 2024年全年营收同比是否增长；(2)
  2024年Q4营收同比增速是否高于2024年全年同比增速。两者均为可独立验证、可反证的二元判断。
time_scope:
  lookback: 2023年全年（1-12月）及2023年Q4（10-12月），作为同比基数
  as_of: 2025-01-16T23:59:59.999+08:00
  forward: 不适用——本任务为回顾性财务数据验证，不涉及前瞻预测
boundaries:
  - 地域：台积电合并报表口径（台湾主体 + 海外子公司），以台积电官方公告为准
  - 指标：仅「营收 / net revenue」，不涉及利润、毛利、费用、EPS 等其他财务指标
  - 时间：2024 自然年度（1-12 月）vs 2023 自然年度；2024 Q4（10-12 月）vs 2023 Q4
  - 数据来源：台积电官方月度营收公告、季度/年度合并财务报表、法人说明会简报，均为公开一级来源
  - 货币：以台积电公告币种为准（通常为新台币，可辅以美元口径核对但不改变判断方向）
exclusions: &a1
  - 不涉及毛利率、营业利润率、净利润等利润表其他科目
  - 不涉及制程节点营收拆分（N3/N5/N7 等）
  - 不涉及下游应用平台拆分（HPC/手机/IoT/汽车等）
  - 不涉及产能利用率、ASP、晶圆出货量等运营指标
  - 不涉及2025年业绩展望、资本开支、扩产计划等前瞻性内容
  - 不涉及台积电股价、估值、市场预期或投资建议
  - 不涉及竞争格局（三星、英特尔等）比较
report_type: 状态判断简报——快速核查型：以公开财务数据为唯一依据，给出两个子判断的方向结论（是/否），附关键数据与计算过程，明确证据来源和可复核路径
domain_supported: true
excluded_outputs: *a1
