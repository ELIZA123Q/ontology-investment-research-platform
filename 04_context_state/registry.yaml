schema_name: context_state_domain_registry
schema_version: 3.0.0
status: active

authority:
  answers:
    - context_contract
    - runtime_state_contract
    - memory_contract
    - workspace_contract
  write_entry: 04_context_state/
  read_primary:
    - 04_context_state/registry.yaml
    - 04_context_state/01_context/contract.yaml
    - 04_context_state/02_state/contract.yaml
    - 04_context_state/03_memory/contract.yaml
    - 04_context_state/04_workspace/contract.yaml
  does_not_answer:
    - executable_runtime_implementation
    - historical_sample_authority
    - regression_fixture_authority

implementation:
  runtime: 06_runtime
  kernel: 06_runtime/src/runtime/kernel.ts
  store: 06_runtime/src/runtime/store.ts
  worker: 06_runtime/src/worker.ts
  local_data: 06_runtime/.data/

subdomains:
  context:
    path: 04_context_state/01_context
    contract: 04_context_state/01_context/contract.yaml
    status: active
    implementation_status: partial_reference_manifest
  state:
    path: 04_context_state/02_state
    contract: 04_context_state/02_state/contract.yaml
    status: active
    implementation_status: partial_projection
  memory:
    path: 04_context_state/03_memory
    contract: 04_context_state/03_memory/contract.yaml
    status: active
    implementation_status: partial_storage
  workspace:
    path: 04_context_state/04_workspace
    contract: 04_context_state/04_workspace/contract.yaml
    status: active
    implementation_status: logical_contract_only

related_assets:
  research_examples: 05_control_evaluation/04_verifiers/fixtures/reference_runs/research_runs/
  regression_fixtures: 05_control_evaluation/04_verifiers/fixtures/regression/
  runtime_local_data: 06_runtime/.data/

principles:
  - Context 是当前调用视图，不是知识库
  - State 是运行实例当前状态，不是 Task 定义
  - Memory 是跨任务选择性记忆，不是正式知识权威
  - Workspace 是当前任务工作环境，不是历史样例库
  - Runtime 负责执行上述合同，但不属于本域
  - Event → Runtime；Checkpoint → Runtime；State Contract → 本域
