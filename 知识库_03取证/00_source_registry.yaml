operational_query_contract:
  verified_at_required: true
  required_dimensions:
    - formal_entry
    - query_parameters
    - required_locator
    - measure_definition
    - unit_and_denominator
    - classification_and_version
    - revision_or_vintage
    - fallback_sequence
    - fallback_effect
  fallback_levels:
    L0: 同一材料更换 acquisition channel，不改变 SourceProfile
    L1: 同一生产者更换 artifact，重评频率和业务时间
    L2: 更换独立生产者，重评方法、独立性和口径
    L3: 使用经校准代理，必须按 A09 记录失效条件并降低结论上限
  hard_rules:
    - homepage_only_is_not_reproducible_query
    - fallback_must_not_silently_change_measure
    - current_list_must_not_overwrite_historical_snapshot
    - derived_value_must_preserve_raw_value_and_formula

source_tier_scheme:
  values: [S1, S2, S3, S4, S5, S6, S7, S8]
  definition_ref: B_取证来源/B01_来源分层与使用边界.md

use_rules:
  - 先由 C_最低证据组合 确定证据类别，再由 A_取证规则明确执行方法，最后使用 B_取证来源选择推荐优先来源。
  - B02/B03/B04 是优先来源清单，不是封闭白名单。
  - 新来源可使用，但进入关键判断前必须补充来源生产者、内容领域、发布时间、业务时间、口径、权限、可复核路径和使用限制。
  - MCP、API、网页、人工上传、文件检索、数据库终端和内部系统只记录为 acquisition_channel，不得写成 source_profile。
  - AccessScope 不清时，不得进入正式证据包。
  - ArtifactType 决定原文定位、字段血缘、快照和复核要求。
  - ContentDomain 用于判断来源是否适合当前证据类别。

source_selection_contract:
  required_dimensions:
    - claim_or_measurement_type
    - evidence_role
    - object_and_time_scope
    - methodology_transparency
    - required_locator_level
    - independence_group
    - update_and_revision_policy
    - access_and_expression_permission
    - acquisition_channel_and_fallback
  selection_rule: 选择能最直接证明当前篮子主张且可复核的来源，不按知名度或 S1-S8 数字机械排序。
  primary_source_failure_rule: 记录失败代码后按预设 fallback 顺序切换；替代来源改变直接性、口径或权限时必须重评质量上限。
  independence_rule: 同一原始数据、同一公司披露、同一数据库转售字段或同一新闻线索属于同一 independence_group。

source_profile_admission:
  required_fields:
    - source_name
    - source_tier
    - authority_type
    - typical_content_domains
    - allowed_claim_types
    - forbidden_use
    - methodology_transparency
    - independence_group
    - access_scope_default
    - common_limitations
    - required_locator_level
  statuses: [candidate, active, restricted, deprecated, retired]
  review_triggers:
    - 方法论、字段定义或样本发生重大变化
    - 来源停止更新、被替代或历史数据修订
    - 授权或引用边界变化
    - 多次任务出现不可解释冲突
    - 实际内容域偏离登记画像
