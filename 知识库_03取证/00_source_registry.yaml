  tiering:
    description: S1-S8 来源分层、使用边界和 04 使用上限
    file: B_取证来源/B01_来源分层与使用边界.md
  general_sources:
    description: 跨行业通用来源清单与证据类别映射
    file: B_取证来源/B02_通用来源清单与证据类别映射.md
    current_files:
      operations: B_取证来源/B02-OPS_通用真实来源查询与回退手册.md
  industry_sources:
