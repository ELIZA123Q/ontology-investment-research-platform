# 系统接口文件：研究员通过 B_取证来源和“来源与指标经验卡”维护研究经验；
# 本注册表只负责稳定 ID、文件指向与自动校验，不作为日常找来源的入口。
registry_type: evidence_source_guidance_registry
schema_version: 1.4.0
updated_at: 2026-07-13

purpose: >
  作为 03 取证策略库的取证来源索引，指向推荐优先来源清单和来源分层规则。
  SourceProfile、SourceDocument、AcquisitionChannel、AccessScope、ArtifactType、ContentDomain
  的对象定义和规则由一级通用本体证据域承接，本文件不再维护独立来源画像目录。

ontology_contract:
  evidence_domain_schema: ../一级通用本体规范/evidence.yaml
  source_profile_object: SourceProfile
  source_document_object: SourceDocument
  source_document_profile_relation: sourceDocumentUsesProfile
  acquisition_channel_field: SourceDocument.acquisitionChannel
  access_scope_field: SourceDocument.accessScope
  artifact_type_field: SourceDocument.artifactType
  content_domain_field: SourceDocument.contentDomain
  hard_rules:
    - acquisition_channel_not_source_profile
    - access_scope_required_for_formal_evidence
    - artifact_type_drives_traceability
    - content_domain_must_match_basket

basket_contract:
  registry_ref: 00_basket_registry.yaml
  mapping_rule: B 类来源指引的机器映射键只能使用 Basket Registry 稳定 ID；具体机构或数据项可用“来源任务标签”描述，但必须明确其不是新的 basket_type。

