# 系统接口文件：研究员日常使用“已确认/较支持/条件成立/仅线索”四档语言；
# 库管理员在交付或自动校验时再映射到本文件的 Q0—Q4 和硬门槛。
registry_type: evidence_quality_gates
schema_version: 2.1.0
updated_at: 2026-07-13

evaluation_principles:
  - 来源可靠性、主张可信度、任务适配性和篮子完备性分别评价，不得合成一个来源分数替代。
  - 硬门槛优先于总分；任一关键硬门槛失败即阻断对应用途。
  - 关键 JudgmentUnit 采用 weakest_link，不以平均分或材料数量补偿必需篮子缺失。
  - 支持证据与反证使用对称的对象、时间和口径标准。
  - 未找到反证只说明当前检索未发现，必须同时记录检索范围和停止原因。

assessment_layers:
  source_document:
    question: 材料身份、权限、版本和定位是否合格
    output: SourceDocument metadata status
  evidence_claim_or_fact:
    question: 原子主张是否准确抽取、归一且适用于当前需求
    output: EvidenceAssessment
  evidence_basket:
    question: 类别、独立性、时间、对象和反证组合是否满足
    output: basket status and quality level
  path:
    question: 起点、中介、暴露、结果和阻断是否逐层准入
    output: path_readiness
  judgment_unit:
    question: 当前判断单元的最终 evidence_grade、反证结果和路径依据是什么
    output: EvidenceReadinessAssessment authority inputs
  package:
    question: 03 阶段是否已经完成
    output: manifest stage_status

conflict_resolution_protocol:
  compare_dimensions: [object_scope, business_time, metric_definition, unit, methodology, source_version, statement_nature, independence_group]
  resolution_order:
    - 先判断是否其实描述不同对象、时间、口径或状态
    - 再核对原始来源、修订版本和方法说明
    - 再比较直接性与任务适配，不按来源数量投票
    - 无法消解时保留双方并标记 contested
  forbidden_actions:
    - 删除不支持主观点的合格证据
    - 用较高来源层级自动覆盖更直接且口径匹配的证据
    - 对冲突数值取平均后假装冲突消失
    - 将同源转述计为多数意见

missing_data_protocol:
  distinguish: [not_found_in_current_scope, inaccessible, not_disclosed, not_applicable, structurally_unobservable, true_zero]
  rule: 缺失不得自动解释为零、不存在或没有影响。
  required_record: search_scope, attempted_sources, attempts, failure_code, fallback_action, stop_reason, effect_on_04

quality_dimensions:
  traceability:
    description: 是否能回到原始来源、字段、页码、查询参数、版本或内容指纹
    hard_gate: true
  source_directness:
    description: 来源是否接近原始事实或一手披露
    hard_gate: false
  independence:
    description: 是否与其他证据具有独立来源链，不属于同一转述链或同一原始来源
    hard_gate: false
  business_time:
    description: 是否具有业务时间、统计期或生效时间，且与判断窗口匹配
    hard_gate_for_dynamic_variables: true
  scope_fit:
    description: 对象、地区、产品、时间和指标口径是否匹配 02 判断单元
    hard_gate: true
  validity:
    description: 指标定义、单位、统计方法、数据生成方式是否适合目标用途
    hard_gate: true
  completeness:
    description: 身份、数值、单位、时间、来源、权限、口径等关键字段是否完整
    hard_gate: false
  consistency:
    description: 与其他来源、历史口径、本次冻结口径是否一致；不一致时是否解释
    hard_gate: false
  freshness:
    description: 发布时间、业务时间和更新频率是否满足判断窗口
    hard_gate: false
  permission:
    description: 来源获取和使用是否符合权限、授权、保密和引用边界
    hard_gate: true
  claim_type_separation:
    description: 是否区分事实、数据、估算、预测、指引、观点、假设
    hard_gate: true
  fit_for_judgment:
    description: 是否能支撑当前判断单元，而不是泛泛相关
    hard_gate: true

source_document_metadata_required:
  description: SourceDocument 进入正式证据包前的最低元数据要求
  required_fields:
    - source_document_id_or_source_id
    - title
    - source_profile_id
    - source_name
    - source_tier
    - content_domain
    - acquisition_channel
    - access_scope
    - artifact_type
    - captured_at
    - location
    - locator_or_field_lineage
    - usage_limit
    - source_reliability
  blocking_if_missing:
    - source_profile_id
    - acquisition_channel
    - access_scope
    - artifact_type
    - location
    - locator_or_field_lineage

quality_levels:
  Q0:
    semantic_name: Q0_unusable
    minimum_conditions:
      - traceability_missing_or_permission_invalid_or_scope_mismatch
  Q1:
    semantic_name: Q1_background
    minimum_conditions:
      - traceable
      - claim_type_clear
      - source_or_scope_has_material_limit
  Q2:
    semantic_name: Q2_conditional_usable
    minimum_conditions:
      - traceable
      - scope_fit
      - business_time_sufficient_if_dynamic
      - source_quality_explained
      - claim_type_clear
  Q3:
    semantic_name: Q3_directional_ready
    minimum_conditions:
      - Q2_conditions_met
      - mandatory_baskets_met
      - counter_check_done
      - major_conflicts_handled_or_downgraded
      - independent_cross_check_when_required
  Q4:
    semantic_name: Q4_decision_grade
    minimum_conditions:
      - Q3_conditions_met
      - mandatory_baskets_fully_met
      - independent_validation_sufficient
      - counter_and_competing_explanations_checked
      - material_conflicts_resolved_or_scope_bounded
      - scope_time_and_metric_fully_aligned
      - caveat_clear

delivery_readiness_contract:
  independence_rule: 图表、表格、排序表与报告表现力只进入 delivery_readiness，不得改变 Q0—Q4、机器派生的判断上限或 03 high_quality_pass。
  scope_rule: delivery_readiness 只回答素材有没有、是否可用、限制是什么；用不用、放在哪里、如何形成论证属于 05；不得输出章节建议、故事线、标题或投资要点。
  target_report_type_source: 01.delivery_archetype.primary
  statuses: [ready, partially_ready, not_ready]
  dimension_statuses: [ready, partial, missing, not_applicable]
  required_fields: [target_report_type, status, chart_readiness, table_readiness, source_annotation_readiness]
  applicability_rule: 图表或排序表仅在目标报告类型通常需要、且本次有相应展示需求时构成门槛；政策事件、供应链事故和公司公告分析可将不适用维度标记为 not_applicable。

# 判断上限和表达方式统一由运行校验/status_derivation.py 根据
# evidence_grade、机器归一化反证结果与 path_readiness_status 派生，本文件不复制映射。
derivation_contract:
  authority: 运行校验/status_derivation.py
  inputs: [evidence_grade, normalized_counterevidence_result, path_readiness_status]
  outputs: [maximum_judgment_level, evidence_permission, allowed_04_output, allowed_expression]
  rule: 本文件只定义 Q0—Q4 的证据质量条件，不复制 Q 到判断上限或报告表现力的映射。

channel_specific_checks:
  web:
    required_trace: [url, title, publisher, published_at, retrieved_at, locator_or_snapshot]
    common_risks: [page_changed, news_repost, missing_original_source]
  database_terminal:
    required_trace: [database_name, field_name, query_condition, export_time, data_cutoff, permission_scope]
    common_risks: [field_definition_unclear, exported_without_query_parameters]
  api:
    required_trace: [endpoint, parameters, response_time, api_version, raw_response_or_hash, field_lineage]
    common_risks: [version_change, field_mapping_error]
  mcp:
    required_trace: [connector_name, underlying_source_profile_or_source_document, parameters, response_time, raw_artifact_or_hash, field_lineage, access_scope]
    common_risks: [tool_success_mistaken_as_source_quality, missing_underlying_source]
  file_search:
    required_trace: [search_scope, matched_file, original_publisher_if_known, file_version_or_hash, locator, retrieved_at]
    common_risks: [unknown_origin, stale_copy, search_result_mistaken_as_source]
  file:
    required_trace: [filename, file_version, uploaded_at, original_publisher_if_known, page_or_sheet_or_cell_locator]
    common_risks: [unknown_origin, stale_copy]
  manual:
    required_trace: [interviewer_or_recorder, sample_description, note_time, business_time, permission_boundary]
    common_risks: [sample_bias, unverifiable_statement]
  internal_system:
    required_trace: [system_name, table_or_metric_name, query_condition, permission_scope, export_time, data_owner]
    common_risks: [permission_limit, field_definition_unclear, external_expression_limit]

usage_limit_rules:
  missing_traceability:
    evidence_grade_ceiling: Q0
    action: reject_or_keep_as_unusable_candidate
  permission_unclear:
    evidence_grade_ceiling: Q0
    action: block_formal_use
  dynamic_variable_without_business_time:
    evidence_grade_ceiling: Q1
    action: downgrade_and_request_time
  non_independent_cross_validation:
    evidence_grade_ceiling: Q2
    action: do_not_count_as_cross_check
  proxy_only_core_evidence:
    evidence_grade_ceiling: Q2
    action: require_proxy_disclosure_and_confidence_discount
  unresolved_conflict:
    counterevidence_result: contested
    action: preserve_conflict_and_limit_view
  missing_counter_check:
    counterevidence_result: not_checked
    action: no_high_quality_pass
  source_is_ai_summary:
    evidence_grade_ceiling: Q0
    action: trace_back_to_original_source
  mandatory_basket_missing:
    evidence_grade_ceiling: Q2
    action: apply_recipe_specific_downgrade
  critical_path_start_unconfirmed:
    path_action: block
    action: block_path
  unresolved_material_conflict:
    counterevidence_result: contested
    action: preserve_both_sides_and_state_discriminating_evidence
  non_reproducible_transformation:
    evidence_grade_ceiling: Q1
    action: preserve_raw_value_and_rebuild_transformation
  missing_search_scope_for_counter_check:
    counterevidence_result: not_checked
    action: counter_check_not_complete
