# 03 取证策略的机器合同。判断类型负责路由，Recipe 负责组合，Basket Registry 负责稳定命名。
registry_type: evidence_strategy_registry
schema_version: 2.0.0
updated_at: 2026-07-13

registry_refs:
  basket_registry: 00_basket_registry.yaml
  quality_gates: 00_quality_gates.yaml
  source_registry: 00_source_registry.yaml

execution_contract:
  required_02_judgment_unit_fields:
    - judgment_type
    - required_evidence_roles
  consumed_02_scope_fields:
    - candidate_claim
    - linked_paths
    - mandatory_evidence_baskets
    - alternative_explanation_refs
  upstream_binding_rule: 02 只说明问题类型、证据角色和任务范围；03 必须按 judgment_type_registry 自动匹配 default_recipe，不得要求 02 预先理解 03 配方库。
  recipe_match_output_fields:
    - matched_recipe
    - recipe_version
    - normalized_judgment_type
  recipe_override_fields:
    - recipe_override
    - override_reason
  recipe_override_rule: 仅当前置适用条件明确不成立时允许偏离默认配方；来源难取或手头已有材料不构成偏离理由。
  required_sequence:
    - freeze_scope
    - normalize_judgment_type
    - match_primary_recipe
    - instantiate_baskets
    - plan_sources_and_channels
    - acquire_and_preserve_raw_artifacts
    - extract_claims_and_normalize_facts
    - assess_evidence_and_counter_evidence
    - assess_basket_path_and_judgment_readiness
  primary_recipe_limit_per_judgment_unit: 1
  auxiliary_recipe_limit_per_judgment_unit: 1
  counter_rule_required_for_directional_use: A08
  proxy_rule_requires_parent_requirement: true
  task_recipe_instance_rule: 任务配方可使用 R-<TASK>-<JU> ID，但必须记录 parent_recipe_id 或在 strategy_library_ref 中保留父配方。

basket_contract:
  registry_ref: 00_basket_registry.yaml
  required_fields:
    - basket_type
    - basket_role
    - target_judgment_unit_id
    - target_requirement_ids
    - required_evidence_categories
    - minimum_source_tier
    - minimum_independent_source_count
    - required_time_coverage
    - required_object_coverage
    - required_content_domains
    - allowed_proxy
    - basket_status
    - conflict_status
    - counter_check_status
    - basket_quality
    - gap_action
  status_rule: 篮子状态由最薄弱的强制条件决定，材料数量不能补偿关键类别缺失。
  independence_rule: 同一原始来源、同一数据供应链或同一转述链只计一个 independence_group。
  counter_rule: counter 篮子必须记录检索范围与结果；未找到反证不等于反证不存在。

recipe_lifecycle:
  statuses: [draft, active, deprecated, retired]
  admission_requirements:
    - 覆盖至少两个任务或有明确的稳定判断类型依据
    - mandatory、counter、minimum_pass、downgrade、stop_rule 完整
    - 与 A 类规则、Basket Registry 和 B 类来源映射可解析
    - 至少有一个正例和一个失败或降级例
  change_requires_version_bump:
    - mandatory_baskets
    - minimum_pass_baskets
    - minimum_pass_rule
    - downgrade_rule
    - proxy_rule
    - stop_rule
  review_signal:
    - 连续任务频繁人工改写配方
    - 配方无法区分竞争解释
    - 关键篮子长期不可取得
    - 回测显示配方产生系统性误判

recipe_assessment_contract:
  result_values: [met, partial, unmet, blocked, contested]
  grade_rule: Recipe 与 Basket 检查结果只用于确定 evidence_grade，不得形成另一套输出等级或判断上限。
  contested_rule: 支持与反证在同对象、时间和口径下形成重大未解决冲突时，将 counterevidence_result 归一化为 contested。
  weakest_link_rule: 任一强制 Basket 未满足时，按规则降低 evidence_grade；关键路径不成立时更新 path_readiness_status。

constraint_derivation_contract:
  authority: ../运行校验/status_derivation.py
  assessment_scope: judgment_unit_final
  required_handoff_fields:
    - judgment_unit_id
    - evidence_grade
    - counterevidence_result
    - path_readiness_status
    - scope_limit
    - downgrade_reason
  aggregation_rule: 唯一矩阵按 evidence_grade × counterevidence_result × path_readiness_status 计算最大 J 与表达方式。
  downstream_rule: 04 只填写实际 judgment_level，且不得高于矩阵计算结果。

# 唯一判断类型词典。每个规范类型只有一个默认 Recipe；事实确认不需要组合配方。
judgment_type_registry:
  fact_confirmation:
    primary_rule: A01
    secondary_rules: [A08]
    default_recipe: null
    required_quality_level: Q3
  state_measurement:
    primary_rule: A02
    secondary_rules: [A09, A08]
    default_recipe: ER-STATE-01
    required_quality_level: Q2
  trend_or_phase:
    primary_rule: A03
    secondary_rules: [A02, A08, A09]
    default_recipe: ER-TREND-01
    required_quality_level: Q3
  cycle_phase:
    primary_rule: A03
    secondary_rules: [A02, A08, A09]
    default_recipe: ER-CYCLE-01
    required_quality_level: Q3
  causal_attribution:
    primary_rule: A04
    secondary_rules: [A02, A08]
    default_recipe: ER-ATTR-01
    required_quality_level: Q2
  mechanism_transmission:
    primary_rule: A04
    secondary_rules: [A01, A08]
    default_recipe: ER-TRANS-01
    required_quality_level: Q2
  object_comparison:
    primary_rule: A05
    secondary_rules: [A06, A08]
    default_recipe: ER-DIFF-01
    required_quality_level: Q3
  earnings_impact:
    primary_rule: A06
    secondary_rules: [A02, A08]
    default_recipe: ER-EARN-01
    required_quality_level: Q2
  valuation_expectation:
    primary_rule: A07
    secondary_rules: [A06, A08]
    default_recipe: ER-EXPECT-01
    required_quality_level: Q2
  risk_reassessment:
    primary_rule: A04
    secondary_rules: [A05, A08]
    default_recipe: ER-TRANS-01
    required_quality_level: Q2

# 仅用于读取旧版 02 案例；不是第二套判断分类，生成新任务时不得继续写这些标签。
judgment_type_migration_aliases:
  industry_cycle_judgment: {canonical_type: cycle_phase, status: deprecated}
  policy_impact_judgment: {canonical_type: mechanism_transmission, status: deprecated}
  supply_chain_bottleneck_judgment: {canonical_type: mechanism_transmission, status: deprecated}
  company_earnings_elasticity_judgment: {canonical_type: earnings_impact, status: deprecated}
  valuation_rerating_judgment: {canonical_type: valuation_expectation, status: deprecated}
  event_impact_judgment: {canonical_type: mechanism_transmission, status: deprecated}
  expectation_gap_judgment: {canonical_type: valuation_expectation, status: deprecated}
  risk_monitoring_judgment: {canonical_type: risk_reassessment, status: deprecated}

rules:
  A01:
    name: 事实确认取证规则
    file: A_取证规则/A01_事实确认取证规则.md
    primary_for: [fact_confirmation]
    basket_ids: [FACT_ORIGINAL_TEXT, FACT_ACTOR_SUBJECT, FACT_STATUS, SCOPE_BUSINESS_TIME, SCOPE_BOUNDARY, FACT_REVISION_VALIDITY, COUNTER_GENERAL]
  A02:
    name: 状态变量测量取证规则
    file: A_取证规则/A02_状态变量测量取证规则.md
    primary_for: [state_measurement]
    basket_ids: [STATE_DIRECT_INDICATOR, STATE_TIME_SCOPE, STATE_COMPARISON_BASELINE, COUNTER_GENERAL]
  A03:
    name: 趋势与阶段判断取证规则
    file: A_取证规则/A03_趋势与阶段判断取证规则.md
    primary_for: [trend_or_phase, cycle_phase]
    basket_ids: [TREND_COMPARABLE_SERIES, TREND_PERSISTENCE_SLOPE, STATE_COMPARISON_BASELINE, CYCLE_DEMAND, CYCLE_SUPPLY, CYCLE_INVENTORY_ORDER, CYCLE_PRICE, COUNTER_GENERAL]
  A04:
    name: 机制传导验证取证规则
    file: A_取证规则/A04_机制传导验证取证规则.md
    primary_for: [causal_attribution, mechanism_transmission, risk_reassessment]
    basket_ids: [ATTR_OBSERVED_CHANGE, ATTR_CANDIDATE_CAUSES, ATTR_TIME_ORDER, ATTR_EXPOSURE_COUNTERFACTUAL, TRANS_START_FACT, TRANS_INTERMEDIATE_NODE, TRANS_EXPOSED_SUBJECT, TRANS_OUTCOME_VARIABLE, TRANS_BLOCKER_COUNTER, COUNTER_GENERAL]
  A05:
    name: 对象分化比较取证规则
    file: A_取证规则/A05_对象分化比较取证规则.md
    primary_for: [object_comparison]
    basket_ids: [DIFF_COMPARABLE_BASIS, DIFF_EXPOSURE, DIFF_ELASTICITY, DIFF_EXECUTION_CONSTRAINT, COUNTER_GENERAL]
  A06:
    name: 财务影响测算取证规则
    file: A_取证规则/A06_财务影响测算取证规则.md
    primary_for: [earnings_impact]
    basket_ids: [FIN_EXPOSURE, FIN_VOLUME_PRICE_MIX, FIN_COST_MARGIN, FIN_CAPACITY_RECOGNITION, FIN_PARAMETER_PROVENANCE, FIN_COUNTER]
  A07:
    name: 市场预期与定价取证规则
    file: A_取证规则/A07_市场预期与定价取证规则.md
    primary_for: [valuation_expectation]
    basket_ids: [EXPECT_ADMITTED_FUNDAMENTAL_INPUT, EXPECT_PRIOR_CONSENSUS, EXPECT_ESTIMATE_REVISION, EXPECT_PRICE_REACTION, EXPECT_VALUATION_INPUTS, EXPECT_COUNTER]
  A08:
    name: 反证与竞争解释取证规则
    file: A_取证规则/A08_反证与竞争解释取证规则.md
    primary_for: [counter_explanation, falsification_check]
    basket_ids: [COUNTER_CONTRARY_EVIDENCE, COUNTER_ALTERNATIVE_EXPLANATION, COUNTER_BLOCKER, COUNTER_CONFLICT_CHECK]
  A09:
    name: 代理指标使用规则
    file: A_取证规则/A09_代理指标使用规则.md
    primary_for: [proxy_indicator, indirect_measurement]
    basket_ids: [PROXY_LOGIC, PROXY_VALID_CONDITION, PROXY_INVALID_CONDITION, PROXY_CROSS_CHECK, PROXY_CONFIDENCE_DISCOUNT]

evidence_recipes:
  ER-STATE-01:
    name: 状态判断最低证据组合
    version: 2.0.0
    status: active
    file: C_最低证据组合/01_核心判断最低证据组合.md
    primary_rule: A02
    applicable_judgment_types: [state_measurement]
    mandatory_baskets: [STATE_DIRECT_INDICATOR, STATE_TIME_SCOPE, STATE_COMPARISON_BASELINE, COUNTER_GENERAL]
    minimum_pass_baskets: [STATE_DIRECT_INDICATOR, STATE_TIME_SCOPE, STATE_COMPARISON_BASELINE, COUNTER_GENERAL]
    strong_validation_baskets: [STATE_INDEPENDENT_CROSS_CHECK, STATE_HISTORICAL_POSITION]
    counter_baskets: [STATE_OPPOSITE_INDICATOR, SCOPE_METHOD_CONFLICT]
    minimum_pass_rule: 直接指标可追溯且业务时间、范围、口径和比较基准匹配，反证已检查。
    high_quality_rule: 直接指标具备独立交叉验证、历史位置和修订检查，反向指标未形成重大冲突。
    proxy_rule: 允许代理但必须调用 A09；代理不能替代 STATE_DIRECT_INDICATOR 达到 full_reasoning_ready。
    source_rule: 主指标可追溯，交叉验证须来自独立生产链。
    stop_rule: 状态、口径、时间和反向检查已确定，继续取证不改变使用上限。
    downgrade_rule: 仅有代理指标时最高 conditional_only。
    positive_example: 同口径官方指标与独立行业数据共同确认目标对象在冻结时点的状态。
    failure_example: 只有无样本和业务时间的渠道反馈却外推全行业状态。
  ER-TREND-01:
    name: 趋势与阶段最低证据组合
    version: 2.0.0
    status: active
    file: C_最低证据组合/01_核心判断最低证据组合.md
    primary_rule: A03
    applicable_judgment_types: [trend_or_phase]
    mandatory_baskets: [TREND_COMPARABLE_SERIES, TREND_PERSISTENCE_SLOPE, STATE_COMPARISON_BASELINE, COUNTER_GENERAL]
    minimum_pass_baskets: [TREND_COMPARABLE_SERIES, TREND_PERSISTENCE_SLOPE, STATE_COMPARISON_BASELINE, COUNTER_GENERAL]
    strong_validation_baskets: [TREND_ADJACENT_VARIABLE, TREND_BREADTH_DIFFUSION]
    counter_baskets: [TREND_SEASONALITY, TREND_BASE_EFFECT, TREND_SERIES_BREAK, TREND_OPPOSITE_VARIABLE]
    minimum_pass_rule: 同口径多点序列形成持续性，比较基准明确且反证已检查。
    high_quality_rule: 序列通过季节性、基数、修订和相邻变量检查，趋势在预设窗口内持续。
    proxy_rule: 代理序列必须验证领先滞后稳定性；代理主导时最高 conditional_only。
    source_rule: 序列必须保留版本、修订和方法说明，跨来源不可拼接为伪长序列。
    stop_rule: 趋势标签、斜率、持续性、反证和切换条件均已确定。
    downgrade_rule: 无时间序列时只允许状态描述。
    positive_example: 连续多期同口径指标与相邻变量共同改善，并排除季节性和低基数。
    failure_example: 单月同比转正即称需求拐点。
  ER-CYCLE-01:
    name: 周期位置最低证据组合
    version: 2.0.0
    status: active
    file: C_最低证据组合/01_核心判断最低证据组合.md
    primary_rule: A03
    applicable_judgment_types: [cycle_phase]
    mandatory_baskets: [CYCLE_DEMAND, CYCLE_SUPPLY, CYCLE_INVENTORY_ORDER, CYCLE_PRICE, COUNTER_GENERAL]
    minimum_pass_baskets: [CYCLE_DEMAND, CYCLE_SUPPLY, CYCLE_INVENTORY_ORDER, CYCLE_PRICE, COUNTER_GENERAL]
    strong_validation_baskets: [CYCLE_COMPANY_MARGIN_GUIDANCE, CYCLE_CAPEX, CYCLE_LEADTIME_UTILIZATION]
    counter_baskets: [CYCLE_DEMAND_REVISION_DOWN, CYCLE_INVENTORY_REBUILD, CYCLE_CAPACITY_RELEASE, CYCLE_SEGMENT_DIVERGENCE]
    minimum_pass_rule: 四类核心篮子对象和窗口一致，符合预设阶段逻辑且反证已检查。
    high_quality_rule: 需求、供给、库存或订单、价格形成符合阶段定义的先后关系，企业信号完成验证。
    proxy_rule: 库存或订单可使用多代理三角验证，但单一交期或单一报价不能替代完整周期证据。
    source_rule: 需求、供给、库存或订单、价格尽量来自不同生产链并保持分项口径一致。
    stop_rule: 周期阶段、分项差异、切换条件和主要反证均已形成可观察结论。
    downgrade_rule: 任一核心篮子缺失时最高 conditional_only。
    positive_example: 分产品需求、供给、库存和价格按预设时序共振，企业毛利和稼动提供互补确认。
    failure_example: 用单一报价上涨确认全行业进入上行周期。
  ER-ATTR-01:
    name: 变化归因最低证据组合
    version: 2.0.0
    status: active
    file: C_最低证据组合/01_核心判断最低证据组合.md
    primary_rule: A04
    applicable_judgment_types: [causal_attribution]
    mandatory_baskets: [ATTR_OBSERVED_CHANGE, ATTR_CANDIDATE_CAUSES, ATTR_TIME_ORDER, ATTR_EXPOSURE_COUNTERFACTUAL, COUNTER_GENERAL]
    minimum_pass_baskets: [ATTR_OBSERVED_CHANGE, ATTR_CANDIDATE_CAUSES, ATTR_TIME_ORDER, ATTR_EXPOSURE_COUNTERFACTUAL, COUNTER_GENERAL]
    strong_validation_baskets: [ATTR_CROSS_OBJECT_DIFFERENCE, ATTR_HISTORICAL_ANALOGUE]
    counter_baskets: [ATTR_ALTERNATIVE_EXPLANATION, ATTR_LOW_EXPOSURE_SAME_RESULT, ATTR_COMMON_DRIVER]
    minimum_pass_rule: 主因时间在先且比至少一个竞争解释具有更强区分力。
    high_quality_rule: 主因具备时间先后、暴露差异或反事实支持，且替代解释不能同等解释结果。
    proxy_rule: 代理可用于暴露或中介，不得单独证明因果归因。
    source_rule: 候选原因采用相同对象、时间和口径比较，不按来源数量投票。
    stop_rule: 主解释与至少一个竞争解释已用预设区分信号比较。
    downgrade_rule: 无反事实或区分信号时标记 contested。
    positive_example: 高暴露对象在合理时滞后显著变化，低暴露对象未出现同类结果。
    failure_example: 因两个变量同期变化便认定单一主因。
  ER-TRANS-01:
    name: 机制与事件传导最低证据组合
    version: 2.0.0
    status: active
    file: C_最低证据组合/01_核心判断最低证据组合.md
    primary_rule: A04
    applicable_judgment_types: [mechanism_transmission, risk_reassessment]
    mandatory_baskets: [TRANS_START_FACT, TRANS_INTERMEDIATE_NODE, TRANS_EXPOSED_SUBJECT, TRANS_OUTCOME_VARIABLE, TRANS_BLOCKER_COUNTER]
    minimum_pass_baskets: [TRANS_START_FACT, TRANS_INTERMEDIATE_NODE, TRANS_EXPOSED_SUBJECT, TRANS_OUTCOME_VARIABLE, TRANS_BLOCKER_COUNTER]
    strong_validation_baskets: [TRANS_PATH_ENDPOINTS, TRANS_LAG_VALIDATION]
    counter_baskets: [TRANS_BUFFER, TRANS_SUBSTITUTION, TRANS_WEAK_EXECUTION, TRANS_NO_OUTCOME_CHANGE]
    minimum_pass_rule: 起点、中间节点、暴露、结果与阻断检查逐层准入。
    high_quality_rule: 关键边均有独立或互补证据，时间滞后合理，阻断条件与替代路径已检查。
    proxy_rule: 代理节点必须显式标识；关键中介完全依赖代理时路径最高 conditional_only。
    source_rule: 起点、暴露和结果优先使用不同角色的直接来源，关键边保留业务时间。
    stop_rule: 每个关键节点和边均可判定，或首个阻断节点已确认。
    downgrade_rule: 中间节点缺失时最高 conditional_only；起点不成立时 blocked。
    positive_example: 正式事件、主体行为、中介状态、真实暴露和结果变量按合理时滞逐层出现。
    failure_example: 从冲突新闻直接跳到公司显著受益或受损。
  ER-DIFF-01:
    name: 对象分化最低证据组合
    version: 2.0.0
    status: active
    file: C_最低证据组合/01_核心判断最低证据组合.md
    primary_rule: A05
    applicable_judgment_types: [object_comparison]
    mandatory_baskets: [DIFF_COMPARABLE_BASIS, DIFF_EXPOSURE, DIFF_ELASTICITY, DIFF_EXECUTION_CONSTRAINT, COUNTER_GENERAL]
    minimum_pass_baskets: [DIFF_COMPARABLE_BASIS, DIFF_EXPOSURE, DIFF_ELASTICITY, DIFF_EXECUTION_CONSTRAINT, COUNTER_GENERAL]
    strong_validation_baskets: [DIFF_SAME_WINDOW_OUTCOME, DIFF_SENSITIVITY]
    counter_baskets: [DIFF_METRIC_INCOMPARABILITY, DIFF_RANKING_REVERSAL, DIFF_REALIZATION_CONSTRAINT]
    minimum_pass_rule: 对象、指标和窗口可比，暴露、弹性和承接约束完整且排序稳健。
    high_quality_rule: 核心对象覆盖完整，排序通过口径、权重和窗口敏感性检查。
    proxy_rule: 代理暴露只能形成分组，不得单独形成精确排序。
    source_rule: 所有对象使用同口径或保留可复算桥接，unknown 与 zero 分开。
    stop_rule: 排序或分层在合理口径变化下稳定，或已确认只能描述差异。
    downgrade_rule: 无可比口径时不得排序。
    positive_example: 同窗口比较暴露、弹性和兑现约束后排序对多种合理权重保持稳定。
    failure_example: 按概念关联度或产业链标签给公司精确排序。
  ER-EARN-01:
    name: 财务影响最低证据组合
    version: 2.0.0
    status: active
    file: C_最低证据组合/01_核心判断最低证据组合.md
    primary_rule: A06
    applicable_judgment_types: [earnings_impact]
    mandatory_baskets: [FIN_EXPOSURE, FIN_VOLUME_PRICE_MIX, FIN_COST_MARGIN, FIN_CAPACITY_RECOGNITION, FIN_PARAMETER_PROVENANCE, FIN_COUNTER]
    minimum_pass_baskets: [FIN_EXPOSURE, FIN_VOLUME_PRICE_MIX, FIN_COST_MARGIN, FIN_CAPACITY_RECOGNITION, FIN_PARAMETER_PROVENANCE, FIN_COUNTER]
    strong_validation_baskets: [FIN_MODEL_RECONCILIATION, FIN_HISTORICAL_CALIBRATION, FIN_SCENARIO_SENSITIVITY, FIN_CASH_WORKING_CAPITAL]
    counter_baskets: [FIN_COST_OFFSET, FIN_INSUFFICIENT_VOLUME, FIN_RECOGNITION_TIMING, FIN_COLLECTION_RISK]
    minimum_pass_rule: 公司或分部暴露、量价结构、成本利润率、兑现确认和参数来源构成可复算财务桥，反证已检查。
    high_quality_rule: 财务桥与历史报表或管理层披露校准，情景参数、会计确认和现金影响已区分。
    proxy_rule: 卖方模型或行业均值只能作为情景参数，不能替代公司事实输入。
    source_rule: 公司事实输入与外部估算分开，公式、期间和会计口径可复算。
    stop_rule: 方向、弹性范围、关键假设、最敏感参数和抵消项已明确。
    downgrade_rule: 缺量价成本桥时只允许收入方向或更低。
    positive_example: 分部暴露经量价、成本、产能与确认桥接到利润和现金，并完成历史对账。
    failure_example: 行业价格上涨百分比直接等同公司利润上涨百分比。
  ER-EXPECT-01:
    name: 预期差与估值影响最低证据组合
    version: 2.0.0
    status: active
    file: C_最低证据组合/01_核心判断最低证据组合.md
    primary_rule: A07
    applicable_judgment_types: [valuation_expectation]
    mandatory_baskets: [EXPECT_ADMITTED_FUNDAMENTAL_INPUT, EXPECT_PRIOR_CONSENSUS, EXPECT_ESTIMATE_REVISION, EXPECT_PRICE_REACTION, EXPECT_VALUATION_INPUTS, EXPECT_COUNTER]
    minimum_pass_baskets: [EXPECT_ADMITTED_FUNDAMENTAL_INPUT, EXPECT_PRIOR_CONSENSUS, EXPECT_ESTIMATE_REVISION, EXPECT_PRICE_REACTION, EXPECT_VALUATION_INPUTS, EXPECT_COUNTER]
    strong_validation_baskets: [EXPECT_CONSENSUS_DISTRIBUTION, EXPECT_EVENT_BENCHMARK_CONTROL, EXPECT_PEER_HISTORY, EXPECT_CATALYST_REALIZATION]
    counter_baskets: [EXPECT_ALREADY_PRICED, EXPECT_SAMPLE_CHANGE, EXPECT_RISK_PREMIUM_BETA]
    minimum_pass_rule: 已准入基本面输入、事前预期、修订、相对价格反应、估值输入与反向定价检查完整。
    high_quality_rule: 使用事件前冻结的共识 vintage、相对收益和估值输入，排除市场或行业共振与样本变化。
    proxy_rule: 单篇研报、目标价或股价不能代理完整市场预期。
    source_rule: 事前预期必须可追溯至事件前 vintage，价格反应使用明确基准和窗口。
    stop_rule: 已能区分基本面变化、预期修订、价格反应和风险溢价，或确认无法判断预期差。
    downgrade_rule: 无事前基线时禁止预期差判断。
    positive_example: 冻结事前共识后观察预测修订、相对收益和估值输入变化，并控制市场共振。
    failure_example: 股价上涨后倒推市场此前低估且已充分计价。

recipe_presets:
  RP-POLICY-IMPACT-01:
    name: 政策影响组合预设
    recipes: [ER-TRANS-01, ER-DIFF-01, ER-EARN-01]
    use_rule: ER-EARN-01 仅在问题进入公司财务层时调用。
  RP-SUPPLY-SHOCK-01:
    name: 地缘或供给冲击组合预设
    recipes: [ER-TRANS-01, ER-STATE-01, ER-CYCLE-01]
    use_rule: ER-CYCLE-01 仅在需要判断持续价格或周期影响时调用。
  RP-TECH-SUB-01:
    name: 技术替代商业兑现组合预设
    recipes: [ER-TRANS-01, ER-DIFF-01, ER-EARN-01]
    use_rule: 按技术可行、认证导入、量产复购和财务兑现拆为多个 JudgmentUnit。

evidence_pattern_case_contract:
  storage_location: D_研究工作单/05_研究复盘与框架反馈.md
  required_fields: [case_id, case_name, source_task_ref, judgment_type, effective_recipe, most_effective_evidence, misjudgment_sources, added_counter_evidence, inaccessible_evidence, downstream_04_consumption_issue, learning_target, status]
  statuses: [candidate, validated, promoted, rejected]
  promotion_rule: 单一案例只能进入 candidate；至少两个独立任务重复出现且完成正例、失败或降级例复核后，才可提议修改 Recipe、来源经验或取证规则。
  immutability_rule: 案例保留当时判断、当时可得证据和后验结果，禁止用后验信息回填原证据包。

pilot_validation_plan:
  cases:
    - {case_type: industry_cycle, suggested_case: 存储芯片周期}
    - {case_type: geopolitical_shock, suggested_case: 地缘冲击对半导体的影响}
    - {case_type: company_earnings_elasticity, suggested_case: 单家公司业绩弹性}
  observe:
    - Recipe 是否漏项或被迫频繁 override
    - A 类规则是否缺少可执行步骤
    - B 类来源是否实际可获得且可追溯
    - 哪些关键证据结构性不可获取
    - 哪些 03 输出无法被 04 直接消费
