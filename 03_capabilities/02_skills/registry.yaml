schema_name: capability_skills_registry
schema_version: 2.0.0
status: active
executable_manifest: 07_runtime/src/capabilities/registry.ts
progressive_loading: metadata_then_instructions_then_resources
skills:
  - skill_id: research-framing
    purpose: 明确对象、期限、决策、成功标准与必要澄清
  - skill_id: research-method
    purpose: 选择研究、证伪与替代方法
    resources: 03_capabilities/05_method_libraries/02_研究框架
  - skill_id: evidence-assessment
    purpose: 评估证据相关性、可靠性、独立性与覆盖度
    resources: 03_capabilities/05_method_libraries/03_取证
  - skill_id: hypothesis-analysis
    purpose: 比较主假设、竞争解释、情景与可证伪信号
    resources: 03_capabilities/05_method_libraries/04_裁决
  - skill_id: research-writing
    purpose: 将已验证证据和判断写成边界清晰的研究制品
    resources: 03_capabilities/05_method_libraries/05_表达
rules:
  - 禁止按固定阶段把每个 Runtime 操作拆成 Skill
  - 禁止在本目录或 .claude 复制 Skill 正文
