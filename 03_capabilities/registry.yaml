schema_name: capability_domain_registry
schema_version: 1.1.0
status: active

authority:
  answers: Capability 权威入口是本文件；Agent/Skill 实现过渡期仍在 07_runtime/，本域只登记归属与协议边界。
  write_entry: 03_capabilities/
  read_primary: 03_capabilities/registry.yaml
  compat_read:
    - 07_runtime/agents/
    - 07_runtime/skills/
    - 90_compat/methods/03_取证/

source_of_truth:
  agents: 07_runtime/agents
  skills: 07_runtime/skills
  tool_adapters: 07_runtime/skills
  mcp_channels: 90_compat/methods/03_取证/mcp_channels.yaml

subdomains:
  agents:
    target: 03_capabilities/01_agents
    source: 07_runtime/agents
    status: migrating
  skills:
    target: 03_capabilities/02_skills
    source: 07_runtime/skills
    status: migrating
  tools:
    target: 03_capabilities/03_tools
    source: 07_runtime/skills
    status: migrating
  protocols_mcp:
    target: 03_capabilities/04_protocols/mcp
    source:
      - 90_compat/methods/03_取证/B03_MCP通道注册.md
      - 90_compat/methods/03_取证/OPS_MCP查询快速参考.md
    status: migrating
  protocols_a2a:
    target: 03_capabilities/04_protocols/a2a
    source: null
    status: shell
    registry: 03_capabilities/04_protocols/a2a/registry.yaml
    boundary: 03_capabilities/04_protocols/a2a/BOUNDARY.md
    implementation_allowed: false

notes:
  - Agent 组织能力；Skill/Tool 是能力本体；MCP/A2A 是协议边界。
  - 波次边界内仅重写入口层，不重写 runtime 业务实现。
  - 新增能力登记写入本域；勿在旧顶层另开平行权威。
  - wave3: agents/skills/tools/mcp 子注册表与合同镜像已落地；实现仍在 runtime。
  - wave5: A2A 仅边界+registry；禁止假实现。
