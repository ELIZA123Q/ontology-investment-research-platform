schema_name: app_surface_registry
schema_version: 2.0.0
status: active
source_of_truth: 07_runtime/app
workbench_url: http://127.0.0.1:3000
routes:
  - path: /
    file: 07_runtime/app/page.tsx
  - path: /vnext/conversations
    file: 07_runtime/app/vnext/conversations/route.ts
  - path: /vnext/conversations/{id}/messages
    file: 07_runtime/app/vnext/conversations/[id]/messages/route.ts
  - path: /vnext/conversations/{id}/events
    file: 07_runtime/app/vnext/conversations/[id]/events/route.ts
  - path: /vnext/tasks/{id}/{action}
    file: 07_runtime/app/vnext/tasks/[id]/[action]/route.ts
  - path: /vnext/approvals/{id}/decision
    file: 07_runtime/app/vnext/approvals/[id]/decision/route.ts
  - path: /vnext/artifacts/{id}
    file: 07_runtime/app/vnext/artifacts/[id]/route.ts
  - path: /ontology/objects/{type}/{id}/actions
    file: 07_runtime/app/ontology/objects/[type]/[id]/actions/route.ts
  - path: /ontology/actions/{actionType}/preview
    file: 07_runtime/app/ontology/actions/[actionType]/preview/route.ts
  - path: /ontology/actions/{actionType}/apply
    file: 07_runtime/app/ontology/actions/[actionType]/apply/route.ts
  - path: /ontology/action-executions/{id}
    file: 07_runtime/app/ontology/action-executions/[id]/route.ts
  - path: /ontology/research-cases/{id}/graph
    file: 07_runtime/app/ontology/research-cases/[id]/graph/route.ts
notes:
  - 主界面只有研究主题、连续对话与动态可信画布。
  - Ontology/Agent/Skill/Tool/Eval 不作为研究员主导航。
  - 正式语义写入只能经过 Ontology Action preview/apply 接口。
