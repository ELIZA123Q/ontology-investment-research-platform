schema_name: dynamic_research_execution_contract
schema_version: 1.0.0
status: active
description: 动态规则驱动研究计划、执行、修订与审批合同；所有对象均属于运行层，不属于语义本体。

authority:
  canonical_store: oxigraph
  scheduler_state: rebuild_from_execution_records
  in_memory_pipeline: disposable
  mutation_policy: append_only

definition_resources:
  CapabilityDefinition:
    authority: 研究能力/capabilities.yaml
    required_fields: [id, version, input_types, output_types, handler_ref, reads, writes, idempotent, max_retries, side_effects]
  LogicDefinition:
    authority: 研究能力/logics.yaml
    required_fields: [id, version, goal_types, input_types, nodes, completion_rule_refs, fallback_logic_refs]
  RuleDefinition:
    authority: 研究规则/rules.yaml
    required_fields: [id, version, kind, input_types, priority, when, then, failure_handling]

runtime_objects:
  ResearchRequest:
    description: 用户或系统提交的研究目标、范围和运行模式。
  NormalizedRequest:
    description: 经确定性规范化的任务输入。
  SemanticContext:
    description: 当次任务对语义类型、关系和词表的引用。
  PlanProposal:
    description: AI 或确定性规划器提出的非权威计划候选。
  ExecutionPlan:
    description: 通过确定性编译后获得执行资格的不可变 DAG。
  PlanRevision:
    description: 对既有计划的追加式修订；必须指向被替代计划。
  ExecutionNode:
    description: 单次计划中对一个已登记 Capability 的调用。
  ExecutionEdge:
    description: 节点之间的输入输出或控制依赖。
  ExecutionAttempt:
    description: 节点的一次执行结果；失败和重试不得覆盖。
  ExecutionBlock:
    description: 节点因输入缺失或激活规则不成立而停止的审计记录。
  CapabilityResult:
    description: 能力执行产生的候选或正式运行对象引用。
  ApprovalRequest:
    description: 发布节点创建的人工审批请求。
  ApprovalRecord:
    description: 人工对正式发布请求作出的批准或拒绝。

lifecycle_views:
  - request
  - design
  - evidence
  - reasoning
  - publication
view_rule: 生命周期视图只用于展示和筛选，不参与依赖、顺序、重试或回退计算。

execution_invariants:
  - AI 提案只能引用已登记 Capability、Logic 和 Rule。
  - 编译器必须拒绝未知能力、循环依赖、输入不可满足、越权写入和不可达目标。
  - 计划和修订一经写入不可修改；状态从 ExecutionAttempt 和 ApprovalRecord 重建。
  - 只有 idempotent=true 的能力允许自动重试，且不得超过 max_retries。
  - 正式 EvidenceFact 和 Judgment 只能由获得相应写权限的确定性能力创建。
  - PublishedReport 必须依赖 status=approved 的人工 ApprovalRecord。
  - 收敛由完成规则、阻断规则和目标满足决定，不得使用固定步骤数或循环次数。

provenance:
  entities: [SourceDocument, EvidenceClaim, EvidenceFact, Observation, Judgment, ReportClaim, PublishedReport]
  activities: [acquire, extract, normalize, synthesize_fact, evaluate_rule, execute_capability, generate_report]
  agents: [source_organization, researcher, model, executable]
  bundle_rule: 每次研究运行使用独立 prov:Bundle。
  lineage_requirement: 报告观点必须可反向追溯到 Judgment、RuleEvaluation、EvidenceFact、EvidenceClaim、SourceDocument 和原文位置。
