# 本文件由迁移工具生成；v2 启用后为对应域的机器权威。
schema_name: research_runtime_evidence
schema_version: 1.0.0
status: active
description: evidence 应用数据模型与运行关系；不是语义本体。
object_types:
  EvidenceProfile:
    id: EvidenceProfile
    name: 证据画像
    description: 可复用的证据类别、来源优先级、质量限制与缺失降级策略。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 画像名称。
      description:
        type: string
        required: true
        description: 适用边界。
      preferred_source_types:
        type: array
        required: true
        description: 优先来源类型。
      minimum_requirements:
        type: object
        required: true
        description: 最低证据要求。
      downgrade_rule:
        type: string
        required: true
        description: 缺失或受限时的降级规则。
  EvidenceBasketRequirement:
    id: EvidenceBasketRequirement
    name: 证据篮子需求
    description: 计划阶段冻结的证据组合门槛；不保存本次运行的满足状态。
    primary_key: id
    title_property: basket_type
    validity: true
    properties:
      basket_type:
        type: string
        required: true
        description: 篮子类型。
      target_judgment_unit_id:
        type: string
        required: true
        description: 目标判断单元。
      basket_role:
        type: enum
        required: true
        allowed_values:
        - primary_support
        - cross_validation
        - counter_evidence
        - blocking_condition
        - proxy_indicator
        - background_evidence
        description: 篮子角色。
      minimum_source_tier:
        type: enum
        required: true
        allowed_values:
        - S1
        - S2
        - S3
        - S4
        - S5
        - S6
        - S7
        - S8
        description: 最低来源层级。
      minimum_independent_source_count:
        type: integer
        required: true
        description: 最少独立来源数。
      allowed_proxy:
        type: boolean
        required: true
        description: 是否允许代理指标。
  SourceDocument:
    id: SourceDocument
    name: 来源文档
    description: 本次实际取得的原始材料、数据文件、接口响应、网页、人工记录或文件检索结果的来源载体。
    primary_key: id
    title_property: title
    validity: true
    properties:
      title:
        type: string
        required: true
        description: 来源标题或稳定名称。
      sourceProfileId:
        type: string
        required: false
        description: 匹配的稳定 SourceProfile ID；正式证据必须填写或建立 sourceDocumentUsesProfile。
      sourceName:
        type: string
        required: true
        description: 来源生产者、发布者或数据提供方名称。
      sourceTier:
        type: enum
        required: false
        allowed_values:
        - S1
        - S2
        - S3
        - S4
        - S5
        - S6
        - S7
        - S8
        description: 后台来源分类；研究员按知识库_03取证/B00—B02 选择适用来源。
      contentDomain:
        type: string
        required: false
        description: 本材料实际覆盖的内容领域。
      acquisitionChannel:
        type: enum
        required: true
        allowed_values:
        - web
        - database_terminal
        - api
        - mcp
        - file
        - manual
        - internal_system
        - file_search
        - other
        description: 本次材料取得方式；MCP、API、网页、人工上传、文件检索均属于获取通道。
      accessScope:
        type: enum
        required: true
        allowed_values:
        - public
        - licensed
        - internal
        - confidential
        - restricted
        - unknown
        description: 来源访问和使用边界；不清时不得进入正式证据包。
      artifactType:
        type: enum
        required: true
        allowed_values:
        - pdf
        - html
        - csv
        - xlsx
        - api_response
        - database_field
        - transcript
        - image
        - screenshot
        - note
        - table
        - other
        description: 本次实际取得的材料形态，决定原文定位、字段血缘、快照和复核要求。
      publisher:
        type: string
        required: false
        description: 发布者或来源机构。
      publishedAt:
        type: datetime
        required: false
        description: 来源发布时间。
      capturedAt:
        type: datetime
        required: true
        description: 本次捕获、下载、调用、上传或登记时间。
      businessTime:
        type: datetime
        required: false
        description: 材料描述事项的业务时间或统计期锚点。
      location:
        type: string
        required: true
        description: 文件、链接、数据库位置、接口端点或其他稳定定位。
      locator:
        type: string
        required: false
        description: 页码、段落、表格、字段、行列、接口参数或记录位置。
      methodologyNote:
        type: string
        required: false
        description: 来源方法论、样本、字段口径、统计规则或重要限制。
      usageLimit:
        type: string
        required: false
        description: 来源在本次证据包中的可用边界和禁用用途。
      sourceReliability:
        type: enum
        required: true
        allowed_values:
        - low
        - medium
        - high
        - unknown
        description: 来源本身的可靠程度，不得直接复制为主张可信度。
      sourceType:
        type: enum
        required: false
        allowed_values:
        - filing
        - report
        - news
        - transcript
        - dataset
        - policy
        - manual
        - regulatory_record
        - market_data
        - api_response
        - other
        description: 来源的业务内容类型；与实际取得形态 artifactType 分开。
      acquisitionChannelId:
        type: string
        required: false
        description: 可选的获取通道登记 ID。
      contentDomainTags:
        type: array
        required: false
        description: 来源同时覆盖多个内容领域时使用的标签集合。
      independenceGroupId:
        type: string
        required: false
        description: 独立来源组 ID。
      methodologyStatus:
        type: enum
        required: false
        allowed_values:
        - transparent
        - partially_transparent
        - opaque
        - not_applicable
        description: 方法透明度状态。
      accessPermissionStatus:
        type: enum
        required: false
        allowed_values:
        - allowed
        - licensed
        - restricted
        - denied
        - unknown
        description: 访问与使用权限状态。
      usageRestriction:
        type: string
        required: false
        description: 来源可用边界和禁用用途。
      sourceFreshnessStatus:
        type: enum
        required: false
        allowed_values:
        - current
        - stale
        - expired
        - unknown
        description: 来源时效状态。
      status:
        type: enum
        required: true
        allowed_values:
        - candidate
        - active
        - invalidated
        - superseded
        description: 来源生命周期状态。
      createdAt:
        type: datetime
        required: true
        description: 来源登记时间。
  EvidenceClaim:
    id: EvidenceClaim
    name: 证据主张
    description: 从来源中提取的一条最小、可定位的说法。
    primary_key: id
    title_property: statement
    validity: true
    properties:
      statement:
        type: string
        required: true
        description: 一条最小可复核说法。
      claimType:
        type: enum
        required: true
        allowed_values:
        - reported_fact
        - data_point
        - estimate
        - forecast
        - guidance
        - author_judgment
        - assumption
        - unverified
        - correction
        description: 主张内容类型。
      locator:
        type: string
        required: true
        description: 页码、段落、表格单元格或记录位置。
      businessTime:
        type: datetime
        required: false
        description: 主张所描述事项的业务时间。
      claimConfidence:
        type: enum
        required: true
        allowed_values:
        - low
        - medium
        - high
        - unknown
        description: 主张可信度。
      originalSourceId:
        type: string
        required: false
        description: 转述内容追溯到的原始来源。
      evidenceRequirementIds:
        type: array
        required: false
        description: 满足的证据需求 ID。
      evidenceBasketIds:
        type: array
        required: false
        description: 填充的证据篮子 ID。
      evidenceRole:
        type: enum
        required: false
        allowed_values:
        - primary_support
        - cross_validation
        - counter_evidence
        - blocking_condition
        - proxy_indicator
        - background_evidence
        description: 本主张在本次判断中的证据角色。
      contentDomain:
        type: string
        required: false
        description: 主张所属内容领域。
      statementType:
        type: enum
        required: false
        allowed_values:
        - reported_fact
        - data
        - estimate
        - forecast
        - guidance
        - opinion
        - assumption
        - proxy
        description: 主张陈述性质。
      proxyIndicatorId:
        type: string
        required: false
        description: 如果是代理证据，对应代理指标 ID。
      isCounterEvidence:
        type: boolean
        required: false
        description: 是否作为反证使用。
      isCrossValidation:
        type: boolean
        required: false
        description: 是否作为交叉验证使用。
      confidenceCeiling:
        type: enum
        required: false
        allowed_values:
        - low
        - medium
        - high
        description: 该主张能支撑的最高置信上限。
      usageLimit:
        type: string
        required: false
        description: 该主张的使用限制。
      status:
        type: enum
        required: true
        allowed_values:
        - candidate
        - active
        - conflicted
        - invalidated
        - superseded
        description: 主张生命周期状态。
      createdAt:
        type: datetime
        required: true
        description: 主张形成时间。
  EvidenceFact:
    id: EvidenceFact
    name: 证据事实
    description: 由一条或多条主张归一得到的结构化事实候选。
    primary_key: id
    title_property: statement
    validity: true
    properties:
      statement:
        type: string
        required: true
        description: 归一后的事实候选。
      factType:
        type: enum
        required: true
        allowed_values:
        - occurrence
        - measurement
        - attribute
        - relationship
        description: 事实候选类型。
      businessTime:
        type: datetime
        required: true
        description: 事实候选对应的业务时间。
      normalizedValue:
        type: any
        required: false
        description: 可结构化时记录的归一值。
      unit:
        type: string
        required: false
        description: 归一值单位。
      factConfidence:
        type: enum
        required: true
        allowed_values:
        - low
        - medium
        - high
        description: 事实候选可信度。
      evidenceRequirementIds:
        type: array
        required: false
        description: 满足的证据需求 ID。
      evidenceBasketIds:
        type: array
        required: false
        description: 填充的证据篮子 ID。
      factRole:
        type: enum
        required: false
        allowed_values:
        - primary_support
        - cross_validation
        - counter_evidence
        - blocking_condition
        - proxy_indicator
        - background_evidence
        description: 事实候选在本次判断中的角色。
      sourceIndependenceStatus:
        type: enum
        required: false
        allowed_values:
        - independent
        - same_group
        - mixed
        - unknown
        description: 支撑来源独立性状态。
      proxyDependency:
        type: enum
        required: false
        allowed_values:
        - none
        - low
        - moderate
        - high
        - proxy_only
        description: 是否依赖代理指标。
      counterStatus:
        type: enum
        required: false
        allowed_values:
        - not_checked
        - checked
        - supports_counter
        - not_applicable
        description: 反证状态。
      conflictStatus:
        type: enum
        required: false
        allowed_values:
        - no_material_conflict
        - minor_conflict
        - material_conflict
        - unresolved_conflict
        - contested
        description: 冲突状态。
      requirementSatisfactionStatus:
        type: enum
        required: false
        allowed_values:
        - met
        - partial
        - not_met
        - blocked
        description: 对证据需求的满足状态。
      confidenceCeiling:
        type: enum
        required: false
        allowed_values:
        - low
        - medium
        - high
        description: 该事实候选能支撑的最高置信上限。
      allowed04Usage:
        type: enum
        required: false
        allowed_values:
        - full_reasoning_ready
        - directional_only
        - conditional_only
        - insufficient
        - blocked
        - contested
        description: 04 可使用上限。
      usageLimit:
        type: string
        required: false
        description: 该事实候选的使用限制。
      status:
        type: enum
        required: true
        allowed_values:
        - candidate
        - active
        - conflicted
        - invalidated
        - superseded
        description: 事实候选生命周期状态。
      createdAt:
        type: datetime
        required: true
        description: 事实候选形成时间。
  EvidenceRequirement:
    id: EvidenceRequirement
    name: 证据需求
    description: 从判断单元拆解出的本次必须取得的证据要求。
    primary_key: id
    title_property: name
    validity: true
    properties:
      name:
        type: string
        required: true
        description: 证据需求名称。
      targetJudgmentUnitId:
        type: string
        required: true
        description: 对应 02 判断单元 ID。
      targetPathNodeId:
        type: string
        required: false
        description: 对应路径节点 ID。
      targetStateVariableId:
        type: string
        required: false
        description: 对应状态变量 ID。
      requirementPurpose:
        type: enum
        required: true
        allowed_values:
        - support
        - weaken
        - block
        - validate
        - cross_validate
        - counter
        - background
        description: 证据需求目的。
      evidenceRole:
        type: enum
        required: true
        allowed_values:
        - primary_support
        - cross_validation
        - counter_evidence
        - blocking_condition
        - proxy_indicator
        - background_evidence
        description: 证据角色。
      requiredEvidenceCategory:
        type: string
        required: true
        description: 必需证据类别。
      requiredContentDomains:
        type: array
        required: true
        description: 内容领域要求。
      requiredObjectScope:
        type: string
        required: false
        description: 对象范围。
      requiredTimeScope:
        type: string
        required: false
        description: 时间范围。
      requiredGrain:
        type: string
        required: false
        description: 粒度要求。
      minimumQualityLevel:
        type: enum
        required: true
        allowed_values:
        - Q1
        - Q2
        - Q3
        - Q4
        description: 最低证据质量，只表示可形成判断的强度，不表示报告展示能力。
      minimumSourceTier:
        type: enum
        required: true
        allowed_values:
        - S1
        - S2
        - S3
        - S4
        - S5
        - S6
        - S7
        - S8
        description: 最低来源层级。
      minimumIndependentSourceCount:
        type: integer
        required: true
        description: 最少独立来源数。
      allowedProxy:
        type: boolean
        required: true
        description: 是否允许代理指标。
      stopCondition:
        type: string
        required: true
        description: 停止补证或停止推理的条件。
      missingPolicy:
        type: string
        required: true
        description: 缺证据时如何处理。
      allowed04OutputIfMet:
        type: enum
        required: true
        allowed_values:
        - full_reasoning_ready
        - directional_only
        - conditional_only
        - insufficient
        - blocked
        - contested
        description: 满足需求后 04 最高使用方式。
      allowed04OutputIfMissing:
        type: enum
        required: true
        allowed_values:
        - full_reasoning_ready
        - directional_only
        - conditional_only
        - insufficient
        - blocked
        - contested
        description: 缺失时 04 降级方式。
  EvidenceRecipe:
    id: EvidenceRecipe
    name: 取证配方
    description: 可复用取证策略在本体中的稳定引用。
    primary_key: id
    title_property: recipeName
    validity: true
    properties:
      recipeName:
        type: string
        required: true
        description: 配方名称。
      judgmentType:
        type: string
        required: true
        description: 适用判断类型。
      strategyLibraryRef:
        type: string
        required: true
        description: 03 取证策略库文件引用。
      strategyVersion:
        type: string
        required: true
        description: 策略版本。
      requiredBasketTypes:
        type: array
        required: true
        description: 必需证据篮子类型。
      mandatoryBasketTypes:
        type: array
        required: true
        description: 强制篮子类型。
      counterBasketTypes:
        type: array
        required: false
        description: 反证篮子类型。
      minimumPassRule:
        type: string
        required: true
        description: 最低通过规则。
      proxyRule:
        type: string
        required: false
        description: 代理指标规则。
      downgradeRule:
        type: string
        required: true
        description: 降级规则。
  EvidenceBasket:
    id: EvidenceBasket
    name: 证据篮子
    description: 本次运行对某项 EvidenceBasketRequirement 的满足状态评估；计划门槛只保存在需求对象中。
    primary_key: id
    title_property: basketType
    validity: true
    properties:
      basketRequirementRef:
        type: string
        required: true
        description: 对应 EvidenceBasketRequirement 的稳定引用。
      basketType:
        type: string
        required: true
        description: 证据篮子类型（需求投影）。
      targetJudgmentUnitId:
        type: string
        required: true
        description: 对应判断单元 ID。
      basketRole:
        type: enum
        required: true
        allowed_values:
        - primary_support
        - cross_validation
        - counter_evidence
        - blocking_condition
        - proxy_indicator
        - background_evidence
        description: 篮子角色（需求投影）。
      basketStatus:
        type: enum
        required: true
        allowed_values:
        - met
        - partial
        - not_met
        - missing
        - contested
        - blocked
        - not_applicable
        description: 篮子满足状态。
      conflictStatus:
        type: enum
        required: true
        allowed_values:
        - no_material_conflict
        - minor_conflict
        - material_conflict
        - unresolved_conflict
        - contested
        - not_checked
        - not_applicable
        description: 冲突状态。
      counterCheckStatus:
        type: enum
        required: true
        allowed_values:
        - met
        - partial
        - checked
        - not_checked
        - not_applicable
        - missing
        - blocked
        description: 反证检查状态。
      qualityLevel:
        type: enum
        required: true
        allowed_values:
        - Q1
        - Q2
        - Q3
        - Q4
        description: 篮子质量等级，只表示可形成判断的强度，不表示报告展示能力。
      usageLimit:
        type: string
        required: false
        description: 使用限制。
      gapAction:
        type: string
        required: false
        description: 缺口补齐动作。
  SourceProfile:
    id: SourceProfile
    name: 来源画像
    description: 稳定来源生产者或来源类型，说明默认权威性、内容领域、允许主张类型、禁用用途和常见限制。
    primary_key: id
    title_property: sourceName
    validity: true
    properties:
      sourceName:
        type: string
        required: true
        description: 稳定来源生产者、发布者或来源类型名称。
      sourceTier:
        type: enum
        required: true
        allowed_values:
        - S1
        - S2
        - S3
        - S4
        - S5
        - S6
        - S7
        - S8
        description: 后台来源分类；研究员按知识库_03取证/B00—B02 选择适用来源。
      sourceCategory:
        type: string
        required: true
        description: 来源类别。
      authorityType:
        type: string
        required: true
        description: 权威类型，例如 official
        exchange: null
        company_disclosure: null
        licensed_database: null
        industry_provider: null
        research: null
        media: null
        ai_or_search_lead。: null
      typicalContentDomains:
        type: array
        required: true
        description: 常见内容领域。
      allowedClaimTypes:
        type: array
        required: true
        description: 允许支持的主张类型。
      forbiddenUse:
        type: array
        required: true
        description: 禁用用途。
      methodologyTransparency:
        type: enum
        required: true
        allowed_values:
        - high
        - medium
        - low
        - unknown
        description: 方法透明度。
      updateFrequency:
        type: string
        required: false
        description: 更新频率。
      independenceGroup:
        type: string
        required: true
        description: 独立来源组或默认去重规则。
      accessScopeDefault:
        type: enum
        required: true
        allowed_values:
        - public
        - licensed
        - internal
        - confidential
        - restricted
        - unknown
        description: 默认访问和使用边界。
      defaultReliability:
        type: enum
        required: true
        allowed_values:
        - low
        - medium
        - high
        - unknown
        description: 默认可靠性。
      commonLimitations:
        type: array
        required: true
        description: 常见限制、口径陷阱和降级触发条件。
      requiredLocatorLevel:
        type: string
        required: true
        description: 定位留痕要求。
  AcquisitionChannel:
    id: AcquisitionChannel
    name: 取数通道
    description: 获取来源或数据的方式及留痕、权限和失败模式。
    primary_key: id
    title_property: channelName
    validity: true
    properties:
      channelName:
        type: string
        required: true
        description: 通道名称。
      channelType:
        type: string
        required: true
        description: 通道类型。
      supportedContentDomains:
        type: array
        required: true
        description: 支持内容领域。
      repeatability:
        type: enum
        required: true
        allowed_values:
        - high
        - medium
        - low
        description: 可复现程度。
      traceabilityLevel:
        type: string
