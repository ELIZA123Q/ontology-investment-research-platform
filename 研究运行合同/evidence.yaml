        - high
        description: 04 置信上限。
      forbidden04Outputs:
        type: array
        required: false
        description: 禁止 04 输出。
      gapAction:
        type: string
        required: false
        description: 缺口动作。
      assessmentReason:
        type: string
        required: true
        description: 评估理由。
