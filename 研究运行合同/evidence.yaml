        required: false
        description: 目标证据需求 ID。
      proxyLogic:
        type: string
        required: true
        description: 代理逻辑。
      validConditions:
        type: array
        required: true
        description: 代理有效条件。
      invalidConditions:
        type: array
        required: true
        description: 代理失效条件。
      confidenceDiscount:
