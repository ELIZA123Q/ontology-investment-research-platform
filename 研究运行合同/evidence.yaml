    description: 在直接证据不可得时用于代理状态变量或需求的指标及折扣规则。
    primary_key: id
    title_property: proxyIndicatorName
    validity: true
    properties:
      proxyIndicatorName:
        type: string
        required: true
        description: 代理指标名称。
