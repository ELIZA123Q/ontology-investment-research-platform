schema_name: research_evidence_runtime_contract
schema_version: 2.0.0
status: active
description: 证据与观测的应用数据合同；对象可进入研究图，但不属于语义本体。

common_fields:
  required: [id, type, properties, recorded_at, bundle_id]
  bitemporal: [valid_from, valid_until, recorded_at, invalidated_at]
  revision_rule: 修订创建新 ID 并以 supersedes 指向旧版本；冲突版本并存。

object_types:
  SourceDocument:
    purpose: 一次实际取得且可定位的原始来源。
    required_properties: [title, source_type, locator, captured_at]
  EvidenceClaim:
    purpose: 从来源明确位置提取的最小、原子、未裁决主张。
    required_properties: [statement, source_ref, locator]
  EvidenceFact:
    purpose: 通过准入规则后形成的正式事实；保留口径、范围、时间和冲突状态。
    required_properties: [statement, claim_refs, valid_time, scope]
  EvidenceAssessment:
    purpose: 证据质量、独立性、时效、范围匹配和可用上限的评价。
    required_properties: [assessment_status, independent_source_count, lineage_complete]
  Observation:
    purpose: 某项 ResearchMetric 对特定语义对象在业务时间上的读数。
    required_properties: [metric_ref, anchor_ref, value, valid_time]

relation_types:
  claimCitesSource: {source: SourceDocument, target: EvidenceClaim}
  claimSupportsFact: {source: EvidenceClaim, target: EvidenceFact}
  factAssessedBy: {source: EvidenceFact, target: EvidenceAssessment}
  observationGroundedByFact: {source: EvidenceFact, target: Observation}
  observationMeasuresMetric: {source: Observation, target: ResearchMetric}

invariants:
  - 同源转述不得计为独立来源。
  - 原文位置缺失的主张不得升级为正式事实。
  - 冲突事实不得自动覆盖或静默选边。
  - 后取得的证据不得进入更早 recorded_at 截面。
