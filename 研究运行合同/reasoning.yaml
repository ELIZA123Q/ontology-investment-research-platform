schema_name: research_reasoning_runtime_contract
schema_version: 2.0.0
status: active
description: 假设、规则评价、判断和报告的应用数据合同；均不是语义本体。

object_types:
  Hypothesis:
    purpose: 可证伪的候选解释。
    required_properties: [statement, scope, falsifiers]
  Signal:
    purpose: 由事实或观测形成、可供规则消费的方向性输入。
    required_properties: [signal_type, direction, input_refs]
  RuleEvaluation:
    purpose: 对固定版本机器规则的一次不可变评价。
    required_properties: [rule_id, rule_version, matched, result]
  Judgment:
    purpose: 通过证据和规则门槛后的正式投研判断。
    required_properties: [statement, judgment_level, evidence_refs, rule_evaluation_refs, limitations]
  Scenario:
    purpose: 带条件和边界的运行时情景，不表示现实世界事实。
    required_properties: [name, assumptions, trigger_conditions]
  ExpectationGap:
    purpose: 新信息与明确事前市场预期截面之间的差异。
    required_properties: [baseline_ref, new_information_refs, direction]
  AssetImpact:
    purpose: 正式判断对资产假设、现金流或估值输入的映射结果。
    required_properties: [asset_ref, judgment_refs, impact_boundary]
  ReasoningTrace:
    purpose: 从输入、规则到输出的追加式推理审计。
    required_properties: [input_refs, rule_evaluation_refs, output_refs]
  ValidationRecord:
    purpose: 结构、规则、权限或发布校验结果。
    required_properties: [validator, status, target_refs]
  DraftReport:
    purpose: 尚未获得人工发布批准的报告草稿。
    required_properties: [judgment_refs]
  ReportClaim:
    purpose: 报告中的一条表达观点，必须引用正式 Judgment。
    required_properties: [statement, judgment_ref]
  PublishedReport:
    purpose: 经人工批准后形成的正式交付投影。
    required_properties: [judgment_refs, approval_ref, publish_status]

relation_types:
  factGroundsHypothesis: {source: EvidenceFact, target: Hypothesis}
  factGroundsRuleEvaluation: {source: EvidenceFact, target: RuleEvaluation}
  ruleEvaluationSupportsJudgment: {source: RuleEvaluation, target: Judgment}
  factGroundsJudgment: {source: EvidenceFact, target: Judgment}
  judgmentRealizesAssetImpact: {source: Judgment, target: AssetImpact}
  judgmentExpressedAsClaim: {source: Judgment, target: ReportClaim}
  reportContainsClaim: {source: PublishedReport, target: ReportClaim}

invariants:
  - AI 只能生成候选 Hypothesis、候选主张或计划提案，不能直接生成正式 EvidenceFact、Judgment 或 PublishedReport。
  - Judgment 等级不得超过证据质量规则给出的上限。
  - ReportClaim 必须逐条连接正式 Judgment，且不得扩大范围、确定性或时效。
  - 正式发布必须引用 status=approved 且 approver_type=human 的 ApprovalRecord。
