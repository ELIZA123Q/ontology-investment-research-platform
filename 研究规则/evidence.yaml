# 本文件由迁移工具生成；v2 启用后为对应域的机器权威。
schema_name: research_evidence_execution_rules
schema_version: 1.0.0
status: active
description: evidence 动作、函数、流程与确定性规则；不是语义本体。
action_types:
  RegisterSource:
    id: RegisterSource
    name: 登记来源
    description: 登记本次实际取得的 SourceDocument，并评估来源可靠性、权限、材料形态和留痕要求。
    target_types:
    - SourceDocument
    parameters:
    - title
    - sourceProfileId
    - sourceName
    - sourceTier
    - contentDomain
    - acquisitionChannel
    - accessScope
    - artifactType
    - publisher
    - publisherRef
    - publishedAt
    - capturedAt
    - businessTime
    - location
    - locator
    preconditions:
    - 来源可定位
    - 权限边界已判断
    - 材料形态已识别
    effects:
    - create_SourceDocument
    - set_sourceReliability
    - create_sourceDocumentUsesProfile_if_provided
    - create_sourcePublishedBy_if_provided
    outputs:
    - SourceDocument
    rule_refs:
    - source_traceability
    - source_profile_required
    - acquisition_channel_not_source_profile
    - access_scope_required_for_formal_evidence
    - artifact_type_drives_traceability
    function_ref: AssessSourceReliability
    logic_refs: []
    write_scope:
    - SourceDocument
    - sourceDocumentUsesProfile
    - sourcePublishedBy
  ExtractClaim:
    id: ExtractClaim
    name: 抽取主张
    description: 从来源指定位置形成最小主张候选。
    target_types:
    - EvidenceClaim
    parameters:
    - sourceRef
    - locator
    - contentRange
    preconditions:
    - 来源已登记
    effects:
    - create_EvidenceClaim
    - create_claimCitesSource
    outputs:
    - EvidenceClaim
    rule_refs:
    - claim_atomicity
    - source_traceability
    function_ref: ExtractClaims
    logic_refs:
    - SourceToClaimLogic
    write_scope:
    - EvidenceClaim
    - claimCitesSource
  NormalizeClaim:
    id: NormalizeClaim
    name: 归一主张
    description: 对齐主张中的对象、时间、数值和单位，不改变原始陈述。
    target_types:
    - EvidenceClaim
    parameters:
    - claimRef
    - semanticRefs
    - unit
    - businessTime
    preconditions:
    - 主张可追溯
    effects:
    - update_claim_normalization
    - create_claimAbout
    outputs:
    - EvidenceClaim
    rule_refs:
    - business_time_required
    function_ref: NormalizeClaimValue
    logic_refs: []
    write_scope:
    - EvidenceClaim
    - claimAbout
  SynthesizeFact:
    id: SynthesizeFact
    name: 归并事实候选
    description: 根据有效主张形成结构化事实候选。
    target_types:
    - EvidenceFact
    parameters:
    - claimRefs
    - normalizationBasis
    - businessTime
    preconditions:
    - 至少一条有效主张
    effects:
    - create_EvidenceFact
    - create_factSupportedByClaim
    outputs:
    - EvidenceFact
    rule_refs:
    - fact_requires_claim
    - original_source_independence
    - source_claim_reliability_separation
    - conflict_preservation
    function_ref: AssessClaimConfidence
    logic_refs:
    - ClaimToFactLogic
    write_scope:
    - EvidenceFact
    - factSupportedByClaim
  RecordEvidenceConflict:
    id: RecordEvidenceConflict
    name: 记录证据冲突
    description: 建立冲突关系并保留双方证据。
    target_types:
    - conflictsWith
    parameters:
    - leftEvidenceRef
    - rightEvidenceRef
    - conflictType
    - conflictScope
    preconditions:
    - 两项证据同类型且可比较
    effects:
    - create_conflictsWith
    - mark_conflicted
    outputs:
    - conflict_record
    rule_refs:
    - conflict_preservation
    function_ref: DetectEvidenceConflict
    logic_refs:
    - ConflictHandlingLogic
    write_scope:
    - EvidenceClaim
    - EvidenceFact
    - conflictsWith
  SupersedeEvidence:
    id: SupersedeEvidence
    name: 替代证据
    description: 用更具时效或权威性的同类型证据替代旧证据。
    target_types:
    - supersedes
    parameters:
    - newEvidenceRef
    - oldEvidenceRef
    - reason
    - effectiveAt
    preconditions:
    - 新旧证据同类型且口径一致
    effects:
    - create_supersedes
    - mark_old_superseded
    outputs:
    - evidence_status
    rule_refs:
    - conflict_preservation
    function_ref: null
    logic_refs:
    - ConflictHandlingLogic
    write_scope:
    - EvidenceClaim
    - EvidenceFact
    - supersedes
  InvalidateEvidence:
    id: InvalidateEvidence
    name: 使证据失效
    description: 在存在明确反证或适用条件终止时使旧证据失效。
    target_types:
    - invalidates
    parameters:
    - newEvidenceRef
    - oldEvidenceRef
    - reason
    - effectiveAt
    preconditions:
    - 存在明确反证或适用条件终止
    effects:
    - create_invalidates
    - mark_old_invalidated
    outputs:
    - evidence_status
    rule_refs:
    - conflict_preservation
    function_ref: null
    logic_refs:
    - ConflictHandlingLogic
    write_scope:
    - EvidenceClaim
    - EvidenceFact
    - invalidates
  CreateEvidenceRequirement:
    id: CreateEvidenceRequirement
    name: 创建证据需求
    description: 根据判断单元交接字段创建本次证据需求。
    target_types:
    - EvidenceRequirement
    parameters:
    - judgmentUnitRef
    - judgmentType
    - requiredEvidenceRoles
    - requiredEvidenceCategories
    preconditions:
    - 判断类型已声明
    - 必需证据角色已声明
    effects:
    - create_EvidenceRequirement
    outputs:
    - EvidenceRequirement
    rule_refs:
    - judgment_type_required
    - evidence_requirement_required
    function_ref: DeriveEvidenceRequirements
    logic_refs:
    - JudgmentToEvidenceRequirementLogic
    write_scope:
    - EvidenceRequirement
  MatchEvidenceRecipe:
    id: MatchEvidenceRecipe
    name: 匹配取证配方
    description: 根据判断类型和需求匹配 03 取证策略库配方。
    target_types:
    - requirementUsesRecipe
    parameters:
    - requirementRef
    - judgmentType
    - recipeTags
    preconditions:
    - 证据需求已创建
    effects:
    - create_requirementUsesRecipe
    outputs:
    - EvidenceRecipe
    rule_refs:
    - recipe_before_acquisition
    function_ref: MatchEvidenceRecipeFunction
    logic_refs:
    - EvidenceRecipeMatchingLogic
    write_scope:
    - requirementUsesRecipe
  CreateEvidenceBasket:
    id: CreateEvidenceBasket
    name: 创建证据篮子
    description: 根据证据需求和取证配方创建必需、反证和代理篮子。
    target_types:
    - EvidenceBasket
    parameters:
    - requirementRef
    - recipeRef
    - basketRole
    preconditions:
    - 证据需求和取证配方已存在
    effects:
    - create_EvidenceBasket
    - create_requirementRequiresBasket
    outputs:
    - EvidenceBasket
    rule_refs:
    - mandatory_basket_required
    - counter_basket_required
    function_ref: EvaluateEvidenceBasketFunction
    logic_refs:
    - EvidenceBasketEvaluationLogic
    write_scope:
    - EvidenceBasket
    - requirementRequiresBasket
  RegisterSourceProfile:
    id: RegisterSourceProfile
    name: 登记来源画像
    description: 登记稳定来源画像和禁用用途。
    target_types:
    - SourceProfile
    parameters:
    - sourceName
    - sourceTier
    - sourceCategory
    - authorityType
    - typicalContentDomains
    - allowedClaimTypes
    - forbiddenUse
    - defaultReliability
    preconditions:
    - 来源画像可描述
    effects:
    - create_SourceProfile
    outputs:
    - SourceProfile
    rule_refs:
    - source_profile_required
    function_ref: MatchSourceProfileFunction
    logic_refs:
    - SourceProfileMatchingLogic
    write_scope:
    - SourceProfile
  RegisterAcquisitionChannel:
    id: RegisterAcquisitionChannel
    name: 登记取数通道
    description: 登记取数通道、权限和留痕要求。
    target_types:
    - AcquisitionChannel
    parameters:
    - channelName
    - channelType
    - permissionRequirement
    - traceabilityLevel
    preconditions:
    - 通道留痕和权限要求明确
    effects:
    - create_AcquisitionChannel
    outputs:
    - AcquisitionChannel
    rule_refs:
    - acquisition_channel_must_be_allowed
    function_ref: null
    logic_refs: []
    write_scope:
    - AcquisitionChannel
  RegisterProxyIndicator:
    id: RegisterProxyIndicator
    name: 登记代理指标
    description: 登记代理指标、有效条件、失效条件和披露要求。
    target_types:
    - ProxyIndicator
    parameters:
    - proxyFor
    - proxyLogic
    - validConditions
    - invalidConditions
    preconditions:
    - 直接证据不可得或不足
    effects:
    - create_ProxyIndicator
    - create_proxySupportsRequirement
    outputs:
    - ProxyIndicator
    rule_refs:
    - proxy_must_be_disclosed
    - proxy_cannot_replace_direct_evidence
    function_ref: ValidateProxyIndicatorFunction
    logic_refs:
    - ProxyIndicatorValidationLogic
    write_scope:
    - ProxyIndicator
    - proxySupportsRequirement
  AssessBasketReadiness:
    id: AssessBasketReadiness
    name: 评价证据篮子就绪度
    description: 评价证据篮子是否满足质量、来源、反证和冲突要求。
    target_types:
    - EvidenceBasket
    parameters:
    - basketRef
    - evidenceRefs
    - sourceRefs
    preconditions:
    - 证据篮子已创建
    effects:
    - update_EvidenceBasket_status
    outputs:
    - basket_readiness
    rule_refs:
    - mandatory_basket_required
    - counter_basket_required
    - source_tier_must_match_requirement
    function_ref: EvaluateEvidenceBasketFunction
    logic_refs:
    - EvidenceBasketEvaluationLogic
    write_scope:
    - EvidenceBasket
  AssessEvidenceForUse:
    id: AssessEvidenceForUse
    name: 评估证据可用性
    description: 在不改写原始证据状态的前提下，按任务范围、质量规则和判断单元形成可用性评估。
    target_types:
    - SourceDocument
    - EvidenceClaim
    - EvidenceFact
    parameters:
    - executionId
    - profileRef
    - assessmentScope
    - evidenceRefs
    - judgmentUnitRefs
    preconditions:
    - 证据已登记且可追溯
    - 任务范围已冻结
    effects:
    - create_EvidenceAssessment
    - create_assessmentEvaluatesEvidence
    outputs:
    - EvidenceAssessment
    rule_refs:
    - assessment_requires_evidence
    - assessment_is_contextual
    function_ref: AssessEvidenceUsabilityFunction
    logic_refs:
    - EvidenceAssessmentLogic
    write_scope:
    - EvidenceAssessment
    - assessmentEvaluatesEvidence
  AssessEvidenceReadiness:
    id: AssessEvidenceReadiness
    name: 评价证据准入
    description: 综合证据需求、配方、篮子、来源、代理和冲突形成 04 使用上限。
    target_types:
    - EvidenceReadinessAssessment
    parameters:
    - judgmentUnitRef
    - requirementRefs
    - basketRefs
    - recipeRef
    preconditions:
    - 证据需求、配方和篮子均已记录
    effects:
    - create_EvidenceReadinessAssessment
    - create_readinessAssessesRequirement
    - create_readinessEvaluatesBasket
    outputs:
    - EvidenceReadinessAssessment
    rule_refs:
    - readiness_limits_04_output
    - stop_condition_must_be_recorded
    function_ref: AssessEvidenceReadinessFunction
    logic_refs:
    - EvidenceReadinessAssessmentLogic
    write_scope:
    - EvidenceReadinessAssessment
    - readinessAssessesRequirement
    - readinessEvaluatesBasket
functions:
  ExtractClaims:
    id: ExtractClaims
    name: 主张抽取
    description: 从来源指定范围识别最小主张候选。
    inputs:
    - SourceDocument
    - contentRange
    outputs:
    - claimCandidates
    reads:
    - SourceDocument
    writes: []
    deterministic: false
    side_effects: false
    version: 1.0.0
  NormalizeClaimValue:
    id: NormalizeClaimValue
    name: 主张口径归一
    description: 对齐对象、时间、数值和单位。
    inputs:
    - EvidenceClaim
    - semanticRefs
    - targetUnit
    outputs:
    - normalizedClaim
    reads:
    - EvidenceClaim
    - semantic_object
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  AssessSourceReliability:
    id: AssessSourceReliability
    name: 来源可靠性评价
    description: 评价来源本身的可靠程度。
    inputs:
    - sourceType
    - publisher
    - traceability
    outputs:
    - sourceReliability
    reads:
    - SourceDocument
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  AssessClaimConfidence:
    id: AssessClaimConfidence
    name: 主张可信度评价
    description: 结合来源、主张类型、冲突和独立来源评价可信度。
    inputs:
    - EvidenceClaim
    - sourceReliability
    - conflictRefs
    - independentSourceCount
    outputs:
    - claimConfidence
    - confidenceBasis
    reads:
    - SourceDocument
    - EvidenceClaim
    - EvidenceFact
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  DetectEvidenceConflict:
    id: DetectEvidenceConflict
    name: 证据冲突检测
    description: 识别口径、数值、时间或方向冲突。
    inputs:
    - evidenceRefs
    outputs:
    - conflictCandidates
    reads:
    - EvidenceClaim
    - EvidenceFact
    writes: []
    deterministic: false
    side_effects: false
    version: 1.0.0
  CalculateEvidenceFreshness:
    id: CalculateEvidenceFreshness
    name: 证据新鲜度计算
    description: 根据业务时间、有效期和评估时点判断适用性。
    inputs:
    - businessTime
    - validFrom
    - validTo
    - evaluationTime
    outputs:
    - freshness
    reads:
    - EvidenceClaim
    - EvidenceFact
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  DeriveEvidenceRequirements:
    id: DeriveEvidenceRequirements
    name: 判断单元到证据需求拆解
    description: 根据判断类型、证据角色、证据类别和禁用捷径生成证据需求候选。
    inputs:
    - judgmentUnitRef
    - judgmentType
    - requiredEvidenceRoles
    - requiredEvidenceCategories
    outputs:
    - evidenceRequirements
    reads:
    - rule
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  MatchEvidenceRecipeFunction:
    id: MatchEvidenceRecipeFunction
    name: 取证配方匹配
    description: 根据 judgment_type 和配方标签匹配取证策略库。
    inputs:
    - EvidenceRequirement
    - recipeTags
    outputs:
    - matchedRecipe
    reads:
    - EvidenceRequirement
    - EvidenceRecipe
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  EvaluateEvidenceBasketFunction:
    id: EvaluateEvidenceBasketFunction
    name: 证据篮子评价
    description: 评价证据篮子是否满足来源层级、独立来源、反证、冲突和代理要求。
    inputs:
    - EvidenceBasket
    - EvidenceClaim
    - EvidenceFact
    - SourceDocument
    outputs:
    - basketStatus
    - usageLimit
    reads:
    - EvidenceBasket
    - EvidenceClaim
    - EvidenceFact
    - SourceDocument
    writes: []
    deterministic: false
    side_effects: false
    version: 1.0.0
  MatchSourceProfileFunction:
    id: MatchSourceProfileFunction
    name: 来源画像匹配
    description: 判断 SourceProfile 是否满足证据需求的来源层级、内容域和禁用用途要求。
    inputs:
    - EvidenceRequirement
    - SourceProfile
    - AcquisitionChannel
    outputs:
    - sourceProfileMatch
    reads:
    - EvidenceRequirement
    - SourceProfile
    - AcquisitionChannel
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  ValidateProxyIndicatorFunction:
    id: ValidateProxyIndicatorFunction
    name: 代理指标校验
    description: 校验代理逻辑、有效条件、失效条件、置信折扣和披露要求。
    inputs:
    - ProxyIndicator
    - EvidenceRequirement
    outputs:
    - proxyValidation
    reads:
    - ProxyIndicator
    - EvidenceRequirement
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
  AssessEvidenceReadinessFunction:
    id: AssessEvidenceReadinessFunction
    name: 证据准入评价
    description: 综合需求、配方、篮子、来源、代理、反证和冲突输出 04 使用上限。
    inputs:
    - EvidenceRequirement
    - EvidenceRecipe
    - EvidenceBasket
    - ProxyIndicator
    outputs:
    - readinessAssessment
    reads:
    - EvidenceRequirement
    - EvidenceRecipe
    - EvidenceBasket
    - SourceProfile
    - AcquisitionChannel
    - ProxyIndicator
    writes: []
    deterministic: false
    side_effects: false
    version: 1.0.0
  AssessEvidenceUsabilityFunction:
    id: AssessEvidenceUsabilityFunction
    name: 证据可用性计算
    description: 根据来源质量、口径匹配、时效、可追溯性、冲突和使用边界生成任务口径下的证据评估。
    inputs:
    - SourceDocument
    - EvidenceClaim
    - EvidenceFact
    - profileRef
    - assessmentScope
    outputs:
    - usability
    - qualityLevel
    - rationale
    - gapRefs
    reads:
    - SourceDocument
    - EvidenceClaim
    - EvidenceFact
    writes: []
    deterministic: false
    side_effects: false
    version: 1.0.0
logic_flows:
  SourceToClaimLogic:
    id: SourceToClaimLogic
    name: 来源到主张逻辑
    description: 从可定位来源形成分类清楚的最小主张。
    inputs:
    - SourceDocument
    - contentRange
    steps:
    - id: validate_source
      rule_refs:
      - source_traceability
    - id: extract_claims
      function_ref: ExtractClaims
    - id: validate_atomicity
      rule_refs:
      - claim_atomicity
    outputs:
    - EvidenceClaim
    fallback: 无法定位时不生成正式主张。
  ClaimToFactLogic:
    id: ClaimToFactLogic
    name: 主张到事实逻辑
    description: 对齐主张并形成可追溯事实候选。
    inputs:
    - claimRefs
    steps:
    - id: normalize
      function_ref: NormalizeClaimValue
    - id: count_independent_sources
      rule_refs:
      - original_source_independence
    - id: separate_source_claim_reliability
      rule_refs:
      - source_claim_reliability_separation
    - id: detect_conflict
      function_ref: DetectEvidenceConflict
      rule_refs:
      - conflict_preservation
    - id: validate_support
      rule_refs:
      - fact_requires_claim
    outputs:
    - EvidenceFact
    - conflict_record
    fallback: 冲突未解时保持 conflicted。
  ConflictHandlingLogic:
    id: ConflictHandlingLogic
    name: 证据冲突处理逻辑
    description: 区分冲突、替代和失效，不静默覆盖证据。
    inputs:
    - evidenceRefs
    steps:
    - id: detect_conflict
      function_ref: DetectEvidenceConflict
    - id: preserve_conflict
      rule_refs:
      - conflict_preservation
    - id: classify_outcome
      uses:
      - conflictsWith
      - supersedes
      - invalidates
    outputs:
    - conflict_record
    - supersede_candidate
    - invalidation_candidate
    fallback: 无法裁定时只记录冲突。
  FreshnessEvaluationLogic:
    id: FreshnessEvaluationLogic
    name: 证据新鲜度逻辑
    description: 根据业务时间和有效期判断证据当前适用性。
    inputs:
    - evidenceRef
    - evaluationTime
    steps:
    - id: require_business_time
      rule_refs:
      - business_time_required
    - id: calculate_freshness
      function_ref: CalculateEvidenceFreshness
    outputs:
    - freshness
    fallback: 时间缺失时降低可信度。
  JudgmentToEvidenceRequirementLogic:
    id: JudgmentToEvidenceRequirementLogic
    name: 判断到证据需求逻辑
    description: 把判断类型和证据角色拆成可执行证据需求。
    inputs:
    - judgmentUnitRef
    - judgmentType
    steps:
    - id: validate_judgment_type
      rule_refs:
      - judgment_type_required
    - id: derive_requirements
      function_ref: DeriveEvidenceRequirements
    - id: validate_requirement
      rule_refs:
      - evidence_requirement_required
    outputs:
    - EvidenceRequirement
    fallback: 判断类型或证据角色缺失时退回 02。
  EvidenceRecipeMatchingLogic:
    id: EvidenceRecipeMatchingLogic
    name: 取证配方匹配逻辑
    description: 为证据需求匹配可复用取证配方。
    inputs:
    - EvidenceRequirement
    - recipeTags
    steps:
    - id: require_recipe_before_acquisition
      rule_refs:
      - recipe_before_acquisition
    - id: match_recipe
      function_ref: MatchEvidenceRecipeFunction
    - id: create_recipe_link
      uses:
      - requirementUsesRecipe
    outputs:
    - EvidenceRecipe
    fallback: 无配方时不得 high_quality_pass。
  EvidenceBasketEvaluationLogic:
    id: EvidenceBasketEvaluationLogic
    name: 证据篮子评价逻辑
    description: 检查必需篮子、反证篮子和实际证据填充状态。
    inputs:
    - EvidenceRequirement
    - EvidenceBasket
    - EvidenceClaim
    - EvidenceFact
    steps:
    - id: validate_mandatory_basket
      rule_refs:
      - mandatory_basket_required
    - id: validate_counter_basket
      rule_refs:
      - counter_basket_required
    - id: evaluate_basket
      function_ref: EvaluateEvidenceBasketFunction
    outputs:
    - basket_readiness
    fallback: 必需篮子缺失时降级 04 使用上限。
  SourceProfileMatchingLogic:
    id: SourceProfileMatchingLogic
    name: 来源画像匹配逻辑
    description: 检查 SourceProfile、内容领域、来源层级、权限、材料形态和取数通道是否满足证据需求。
    inputs:
    - EvidenceRequirement
    - SourceProfile
    - AcquisitionChannel
    - SourceDocument
    steps:
    - id: require_source_profile
      rule_refs:
      - source_profile_required
    - id: match_source_profile
      function_ref: MatchSourceProfileFunction
    - id: validate_content_domain
      rule_refs:
      - content_domain_must_match_basket
    - id: validate_source_tier
      rule_refs:
      - source_tier_must_match_requirement
    - id: validate_channel
      rule_refs:
      - acquisition_channel_must_be_allowed
    - id: validate_channel_not_profile
      rule_refs:
      - acquisition_channel_not_source_profile
    - id: validate_access_scope
      rule_refs:
      - access_scope_required_for_formal_evidence
    - id: validate_artifact_type
      rule_refs:
      - artifact_type_drives_traceability
    outputs:
    - source_profile_match
    fallback: 来源画像或通道不匹配时不得作为正式硬证据。
  ProxyIndicatorValidationLogic:
    id: ProxyIndicatorValidationLogic
    name: 代理指标校验逻辑
    description: 检查代理指标是否可用、必须披露且不能替代直接证据。
    inputs:
    - ProxyIndicator
    - EvidenceRequirement
    steps:
    - id: validate_proxy
      function_ref: ValidateProxyIndicatorFunction
    - id: require_disclosure
      rule_refs:
      - proxy_must_be_disclosed
    - id: forbid_replacement
      rule_refs:
      - proxy_cannot_replace_direct_evidence
    outputs:
    - proxyValidation
    fallback: 代理未披露时不得作为事实使用。
  EvidenceReadinessAssessmentLogic:
    id: EvidenceReadinessAssessmentLogic
    name: 证据准入评估逻辑
    description: 根据需求、配方、篮子、来源、代理、冲突和反证生成 04 使用上限。
    inputs:
    - EvidenceRequirement
    - EvidenceRecipe
    - EvidenceBasket
    - ProxyIndicator
    steps:
    - id: require_stop_condition
      rule_refs:
      - stop_condition_must_be_recorded
    - id: assess_readiness
      function_ref: AssessEvidenceReadinessFunction
    - id: limit_04_output
      rule_refs:
      - readiness_limits_04_output
    outputs:
    - EvidenceReadinessAssessment
    fallback: 无准入评估时 04 不得形成方向性观点。
  EvidenceAssessmentLogic:
    id: EvidenceAssessmentLogic
    name: 证据可用性评估逻辑
    description: 逐项评估来源、主张或事实在当前任务中能否用于推理和研报表达。
    inputs:
    - SourceDocument
    - EvidenceClaim
    - EvidenceFact
    steps:
    - id: require_evidence_target
      rule_refs:
      - assessment_requires_evidence
    - id: preserve_original_status
      rule_refs:
      - assessment_is_contextual
    - id: assess_usability
      function_ref: AssessEvidenceUsabilityFunction
    outputs:
    - EvidenceAssessment
    fallback: 无法确认口径或可追溯性时记为 unusable 或 blocked。
rules:
  assessment_requires_evidence:
    id: assessment_requires_evidence
    name: 证据评估必须有明确对象
    description: EvidenceAssessment 必须至少指向一项可追溯的来源、主张或事实。
    rule_type: validation
    applies_to:
    - EvidenceAssessment
    condition: evidenceRefs 非空且每项存在 assessmentEvaluatesEvidence。
    result: 允许评估进入证据准入计算。
    priority: 100
    failure_handling: reject_assessment
  assessment_is_contextual:
    id: assessment_is_contextual
    name: 证据评估不改写原始证据
    description: 任务口径下的可用性与质量结论只写入 EvidenceAssessment，不覆盖来源、主张或事实的原始状态。
    rule_type: governance
    applies_to:
    - EvidenceAssessment
    - SourceDocument
    - EvidenceClaim
    - EvidenceFact
    condition: 评估结果与原始证据生命周期字段分离存储。
    result: 保留历史证据真实性和任务口径差异。
    priority: 95
    failure_handling: reject_assessment
  source_traceability:
    id: source_traceability
    name: 来源可追溯
    description: 来源和主张位置必须可访问或可复核。
    rule_type: validation
    applies_to:
    - SourceDocument
    - EvidenceClaim
    condition: SourceDocument.location 非空，EvidenceClaim.locator 非空。
    result: 允许来源或主张进入后续处理。
    priority: 100
    failure_handling: keep_candidate_or_reject
  claim_atomicity:
    id: claim_atomicity
    name: 主张最小化
    description: 一条主张只表达一个核心断言。
    rule_type: validation
    applies_to:
    - EvidenceClaim
    condition: statement 不混合多个对象、时间、数值或因果断言。
    result: 允许主张归一。
    priority: 90
    failure_handling: split_claim
  source_claim_reliability_separation:
    id: source_claim_reliability_separation
    name: 来源与主张可靠性分离
    description: 来源可靠性不得直接复制为主张可信度。
    rule_type: scoring
    applies_to:
    - SourceDocument
    - EvidenceClaim
    condition: claimConfidence 独立考虑主张类型、位置、冲突和独立来源。
    result: 产生独立主张可信度。
    priority: 80
    failure_handling: recalculate_claim_confidence
  fact_requires_claim:
    id: fact_requires_claim
    name: 事实必须有主张支撑
    description: 事实候选至少由一条有效主张支撑。
    rule_type: validation
    applies_to:
    - EvidenceFact
    condition: 至少存在一条 factSupportedByClaim。
    result: 允许创建事实候选。
    priority: 100
    failure_handling: reject_fact
  original_source_independence:
    id: original_source_independence
    name: 独立来源追溯
    description: 转述同一原始来源不得重复计算独立来源。
    rule_type: scoring
    applies_to:
    - EvidenceClaim
    condition: 按 originalSourceId 或可追溯来源去重。
    result: 产生独立来源计数。
    priority: 70
    failure_handling: merge_source_count
  conflict_preservation:
    id: conflict_preservation
    name: 冲突保留
    description: 未裁决冲突不得删除任一方或静默覆盖。
    rule_type: blocking
    applies_to:
    - EvidenceClaim
    - EvidenceFact
    condition: 存在未解决 conflictsWith。
    result: 证据状态保持 conflicted。
    priority: 100
    failure_handling: preserve_both_sides
  business_time_required:
    id: business_time_required
    name: 业务时间完整
    description: 动态内容必须有业务时间或明确说明缺失。
    rule_type: validation
    applies_to:
    - EvidenceClaim
    - EvidenceFact
    condition: businessTime 非空，或 claimType 表明该内容没有业务时间。
    result: 允许新鲜度评价。
    priority: 80
    failure_handling: lower_confidence
  judgment_type_required:
    id: judgment_type_required
    name: 判断类型必填
    description: 02 交接给 03 的判断单元必须声明 judgment_type。
    rule_type: validation
    applies_to:
    - EvidenceRequirement
    condition: targetJudgmentUnitId 和判断类型非空。
    result: 允许拆解证据需求。
    priority: 100
    failure_handling: return_to_02
  evidence_requirement_required:
    id: evidence_requirement_required
    name: 正式取证前必须有证据需求
    description: 没有 EvidenceRequirement，不准登记正式取证结果。
    rule_type: blocking
    applies_to:
    - EvidenceRequirement
    - EvidenceClaim
    - EvidenceFact
    condition: EvidenceClaim 和 EvidenceFact 可追溯到至少一个 EvidenceRequirement。
    result: 允许进入正式证据链。
    priority: 100
    failure_handling: reject_formal_acquisition
  recipe_before_acquisition:
    id: recipe_before_acquisition
    name: 取证前必须匹配配方
    description: 没有 EvidenceRecipe，不得标记 high_quality_pass。
    rule_type: blocking
    applies_to:
    - EvidenceRequirement
    - EvidenceRecipe
    condition: requirementUsesRecipe 已建立或记录无配方降级理由。
    result: 允许执行取证配方。
    priority: 95
    failure_handling: downgrade_quality
  mandatory_basket_required:
    id: mandatory_basket_required
    name: 必需证据篮子必查
    description: 必需篮子不满足，不得给 04 强方向判断。
    rule_type: blocking
    applies_to:
    - EvidenceRequirement
    - EvidenceBasket
    - EvidenceReadinessAssessment
    condition: 必需 EvidenceBasket 状态为 met，或 EvidenceReadinessAssessment 已降级。
    result: 允许判断单元进入对应使用上限。
    priority: 100
    failure_handling: downgrade_or_block_04_output
  counter_basket_required:
    id: counter_basket_required
    name: 反证篮子必查
    description: 反证篮子未检查，不得方向性输出。
    rule_type: blocking
    applies_to:
    - EvidenceRequirement
    - EvidenceBasket
    - EvidenceReadinessAssessment
    condition: counterCheckStatus 为 checked/met/not_applicable。
    result: 允许方向性或条件性输出。
    priority: 100
    failure_handling: restrict_to_insufficient_or_conditional
  source_profile_required:
    id: source_profile_required
    name: 来源画像必填
    description: 正式证据必须匹配稳定 SourceProfile，不能只登记笼统来源名称。
    rule_type: validation
    applies_to:
    - SourceProfile
    - SourceDocument
    - EvidenceRequirement
    condition: SourceDocument.sourceProfileId 或 sourceDocumentUsesProfile 存在。
    result: 允许来源参与证据篮子。
    priority: 90
    failure_handling: keep_as_lead_or_background
  acquisition_channel_not_source_profile:
    id: acquisition_channel_not_source_profile
    name: 获取通道不得写成来源画像
    description: MCP、API、网页、人工上传、文件检索、数据库终端和内部系统均属于 acquisitionChannel，不得写成 SourceProfile。
    rule_type: blocking
    applies_to:
    - SourceDocument
    - SourceProfile
    - AcquisitionChannel
    condition: SourceProfile.sourceName 不得为 MCP/API/网页/搜索/文件上传/文件检索/数据库终端等获取方式；SourceDocument.acquisitionChannel 必须单独记录。
    result: 通道和来源生产者分离。
    priority: 100
    failure_handling: reject_or_reclassify_source_metadata
  access_scope_required_for_formal_evidence:
    id: access_scope_required_for_formal_evidence
    name: 正式证据必须明确权限边界
    description: AccessScope 不清时，不得进入正式证据包。
    rule_type: blocking
    applies_to:
    - SourceDocument
    - EvidenceClaim
    - EvidenceFact
    condition: SourceDocument.accessScope 非 unknown，且权限或引用限制已记录。
    result: 允许正式使用；否则只能作为线索或候选材料。
    priority: 100
    failure_handling: block_formal_use
  artifact_type_drives_traceability:
    id: artifact_type_drives_traceability
    name: 材料形态决定留痕要求
    description: ArtifactType 决定原文定位、字段血缘、快照和复核要求。
    rule_type: validation
    applies_to:
    - SourceDocument
    - EvidenceClaim
    condition: PDF/HTML 需页码段落或快照，CSV/XLSX 需行列和文件指纹，API/数据库字段需端点、参数、字段血缘和响应指纹，人工记录需样本和记录时间。
    result: 按材料形态形成可复核 locator。
    priority: 95
    failure_handling: lower_traceability_or_reject
  content_domain_must_match_basket:
    id: content_domain_must_match_basket
    name: 内容领域必须匹配证据篮子
    description: ContentDomain 用于判断该来源是否适合当前证据篮子。
    rule_type: validation
    applies_to:
    - EvidenceRequirement
    - EvidenceBasket
    - SourceDocument
    - SourceProfile
    condition: SourceDocument.contentDomain 或 SourceProfile.typicalContentDomains 覆盖 EvidenceRequirement.requiredContentDomains
      / EvidenceBasket.requiredContentDomains。
    result: 允许作为对应证据篮子来源。
    priority: 90
    failure_handling: downgrade_to_background_or_request_better_source
  proxy_must_be_disclosed:
    id: proxy_must_be_disclosed
    name: 代理指标必须披露
    description: 代理指标在 04/05 中必须说明代理性质和限制。
    rule_type: validation
    applies_to:
    - ProxyIndicator
    - EvidenceClaim
    - EvidenceFact
    condition: requiredDisclosure 非空，且关联证据 usageLimit 说明代理限制。
    result: 允许代理指标受限使用。
    priority: 100
    failure_handling: reject_as_fact
  proxy_cannot_replace_direct_evidence:
    id: proxy_cannot_replace_direct_evidence
    name: 代理不能替代直接证据
    description: 代理指标只能在直接变量不可得时受限使用，不能写成直接事实。
    rule_type: blocking
    applies_to:
    - ProxyIndicator
    - EvidenceReadinessAssessment
    condition: cannotReplace 非空，且高代理依赖时 allowed04Output 不为 full_reasoning_ready。
    result: 降低置信上限。
    priority: 100
    failure_handling: discount_confidence
  source_tier_must_match_requirement:
    id: source_tier_must_match_requirement
    name: 来源层级必须匹配需求
    description: 来源层级低于需求时不得冒充硬事实。
    rule_type: validation
    applies_to:
    - EvidenceRequirement
    - SourceProfile
    - SourceDocument
    condition: SourceProfile.sourceTier 和 SourceDocument.sourceTier 满足 minimumSourceTier。
    result: 允许作为对应证据角色使用。
    priority: 95
    failure_handling: downgrade_to_background_or_lead
  acquisition_channel_must_be_allowed:
    id: acquisition_channel_must_be_allowed
    name: 取数通道必须被允许
    description: 实际取数通道必须在证据需求允许范围内，并保留权限和留痕。
    rule_type: validation
    applies_to:
    - EvidenceRequirement
    - AcquisitionChannel
    - SourceDocument
    condition: requirementAllowsAcquisitionChannel 存在，且 traceabilityLevel 满足需求。
    result: 允许来源进入正式证据记录。
    priority: 90
    failure_handling: reject_or_mark_restricted
  stop_condition_must_be_recorded:
    id: stop_condition_must_be_recorded
    name: 停止条件必须记录
    description: 03 必须记录何时停止补证、何时停止方向性推理。
    rule_type: validation
    applies_to:
    - EvidenceRequirement
    - EvidenceReadinessAssessment
    condition: EvidenceRequirement.stopCondition 非空。
    result: 允许形成准入评估。
    priority: 90
    failure_handling: return_to_03
  readiness_limits_04_output:
    id: readiness_limits_04_output
    name: 准入评估限制 04 输出
    description: 04 的每条观点不得超过 EvidenceReadinessAssessment.allowed04Output。
    rule_type: blocking
    applies_to:
    - EvidenceReadinessAssessment
    condition: allowed04Output 和 confidenceCeiling 已明确。
    result: 04 只能在上限内表达观点。
    priority: 100
    failure_handling: block_overreach
