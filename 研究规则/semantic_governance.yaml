# 本文件由迁移工具生成；v2 启用后为对应域的机器权威。
schema_name: semantic_governance_execution_rules
schema_version: 1.0.0
status: active
description: 语义对象维护动作、函数、流程与准入规则；不属于本体。
action_types:
  DefineConcept:
    id: DefineConcept
    name: 定义概念
    description: 创建或补充术语定义和边界。
    target_types:
    - Concept
    parameters:
    - name
    - definition
    - inclusionCriteria
    - exclusionCriteria
    preconditions:
    - 术语可识别
    effects:
    - create_or_update_Concept
    outputs:
    - Concept
    rule_refs:
    - concept_definition_required
    function_ref: NormalizeTerm
    logic_refs:
    - ConceptAdmissionLogic
    write_scope:
    - Concept
  ResolveConceptBoundary:
    id: ResolveConceptBoundary
    name: 裁定概念边界
    description: 记录概念纳入或排除边界。
    target_types:
    - Concept
    parameters:
    - conceptRef
    - boundaryQuestion
    - decision
    - basis
    preconditions:
    - Concept 已存在
    effects:
    - update_Concept_boundary
    outputs:
    - Concept
    rule_refs:
    - concept_object_separation
    function_ref: null
    logic_refs:
    - ConceptAdmissionLogic
    write_scope:
    - Concept
  RegisterSemanticObject:
    id: RegisterSemanticObject
    name: 登记语义对象
    description: 解析身份后创建稳定语义对象。
    target_types:
    - Organization
    - Industry
    - Segment
    - Company
    - Product
    - Material
    - ProcessStep
    - Asset
    - FinancialInstrument
    - Identifier
    - IdentificationScheme
    - TradingVenue
    - Listing
    - RoleAssignment
    - Region
    - Application
    - PolicyInstrument
    - PolicyRequirement
    - TechnicalConstraint
    parameters:
    - objectType
    - name
    - description
    - properties
    preconditions:
    - 身份可解析且未重复
    effects:
    - create_semantic_object
    outputs:
    - semantic_object_ref
    rule_refs:
    - unique_identity
    - organization_kind_required
    function_ref: ResolveEntityIdentity
    logic_refs:
    - ObjectIdentityResolutionLogic
    write_scope:
    - Organization
    - Industry
    - Segment
    - Company
    - Product
    - Material
    - ProcessStep
    - Asset
    - FinancialInstrument
    - Identifier
    - IdentificationScheme
    - TradingVenue
    - Listing
    - RoleAssignment
    - Region
    - Application
    - PolicyInstrument
    - PolicyRequirement
    - TechnicalConstraint
  ReviseSemanticObject:
    id: ReviseSemanticObject
    name: 修订语义对象
    description: 在不改变对象身份的前提下修订允许属性。
    target_types:
    - Concept
    - Organization
    - Industry
    - Segment
    - Company
    - Product
    - Material
    - ProcessStep
    - Asset
    - FinancialInstrument
    - Identifier
    - IdentificationScheme
    - TradingVenue
    - Listing
    - RoleAssignment
    - Region
    - Application
    - PolicyInstrument
    - PolicyRequirement
    - TechnicalConstraint
    parameters:
    - objectRef
    - changedProperties
    - basis
    preconditions:
    - 对象存在且类型不变
    effects:
    - update_allowed_properties
    outputs:
    - semantic_object_ref
    rule_refs:
    - stable_semantics_only
    function_ref: null
    logic_refs: []
    write_scope:
    - Concept
    - Organization
    - Industry
    - Segment
    - Company
    - Product
    - Material
    - ProcessStep
    - Asset
    - FinancialInstrument
    - Identifier
    - IdentificationScheme
    - TradingVenue
    - Listing
    - RoleAssignment
    - Region
    - Application
    - PolicyInstrument
    - PolicyRequirement
    - TechnicalConstraint
  MergeSemanticObjects:
    id: MergeSemanticObjects
    name: 合并语义对象
    description: 合并被确认属于同一实体的同类型对象。
    target_types:
    - Concept
    - Organization
    - Industry
    - Segment
    - Company
    - Product
    - Material
    - ProcessStep
    - Asset
    - FinancialInstrument
    - Identifier
    - IdentificationScheme
    - TradingVenue
    - Listing
    - RoleAssignment
    - Region
    - Application
    - PolicyInstrument
    - PolicyRequirement
    - TechnicalConstraint
    parameters:
    - primaryObjectRef
    - mergedObjectRefs
    - basis
    preconditions:
    - 对象同类型且身份一致
    effects:
    - merge_properties
    - preserve_reference_mapping
    outputs:
    - primary_object_ref
    rule_refs:
    - unique_identity
    function_ref: DetectDuplicateObject
    logic_refs:
    - ObjectIdentityResolutionLogic
    write_scope:
    - Concept
    - Organization
    - Industry
    - Segment
    - Company
    - Product
    - Material
    - ProcessStep
    - Asset
    - FinancialInstrument
    - Identifier
    - IdentificationScheme
    - TradingVenue
    - Listing
    - RoleAssignment
    - Region
    - Application
    - PolicyInstrument
    - PolicyRequirement
    - TechnicalConstraint
  DeprecateSemanticObject:
    id: DeprecateSemanticObject
    name: 废弃语义对象
    description: 终止对象当前定义的有效期并保留历史。
    target_types:
    - Concept
    - Organization
    - Industry
    - Segment
    - Company
    - Product
    - Material
    - ProcessStep
    - Asset
    - FinancialInstrument
    - Identifier
    - IdentificationScheme
    - TradingVenue
    - Listing
    - RoleAssignment
    - Region
    - Application
    - PolicyInstrument
    - PolicyRequirement
    - TechnicalConstraint
    parameters:
    - objectRef
    - reason
    - invalidAt
    preconditions:
    - 对象存在
    effects:
    - set_validTo
    - mark_deprecated
    outputs:
    - object_status
    rule_refs:
    - stable_semantics_only
    function_ref: null
    logic_refs: []
    write_scope:
    - Concept
    - Organization
    - Industry
    - Segment
    - Company
    - Product
    - Material
    - ProcessStep
    - Asset
    - FinancialInstrument
    - Identifier
    - IdentificationScheme
    - TradingVenue
    - Listing
    - RoleAssignment
    - Region
    - Application
    - PolicyInstrument
    - PolicyRequirement
    - TechnicalConstraint
  CreateSemanticRelation:
    id: CreateSemanticRelation
    name: 创建语义关系
    description: 创建端点、基数和稳定性均合法的语义关系。
    target_types:
    - semantic_relation
    parameters:
    - relationType
    - sourceRef
    - targetRef
    - properties
    preconditions:
    - 端点及基数合法
    effects:
    - create_semantic_relation
    outputs:
    - relation_ref
    rule_refs:
    - relation_endpoint_compatibility
    - complex_relation_reification
    function_ref: ValidateRelationEndpoints
    logic_refs:
    - SemanticRelationAdmissionLogic
    write_scope:
    - semantic_relation
  ReviseSemanticRelation:
    id: ReviseSemanticRelation
    name: 修订语义关系
    description: 修订关系轻量属性或有效期。
    target_types:
    - semantic_relation
    parameters:
    - relationRef
    - changedProperties
    - basis
    preconditions:
    - 关系存在且端点合法
    effects:
    - update_relation_properties
    outputs:
    - relation_ref
    rule_refs:
    - relation_endpoint_compatibility
    - complex_relation_reification
    function_ref: ValidateRelationEndpoints
    logic_refs:
    - SemanticRelationAdmissionLogic
    write_scope:
    - semantic_relation
  RemoveSemanticRelation:
    id: RemoveSemanticRelation
    name: 移除语义关系
    description: 终止语义关系有效期并保留历史。
    target_types:
    - semantic_relation
    parameters:
    - relationRef
    - reason
    - invalidAt
    preconditions:
    - 关系存在
    effects:
    - set_relation_validTo
    outputs:
    - relation_status
    rule_refs:
    - relation_endpoint_compatibility
    function_ref: null
    logic_refs: []
    write_scope:
    - semantic_relation
functions:
  NormalizeTerm:
    id: NormalizeTerm
    name: 术语归一
    description: 将名称和别名归一为候选标准术语。
    inputs:
    - name
    - aliases
    - language
    outputs:
    - normalizedTerm
    reads:
    - Concept
    writes: []
    deterministic: false
    side_effects: false
    version: 1.0.0
  ResolveEntityIdentity:
    id: ResolveEntityIdentity
    name: 实体消歧
    description: 判断对象候选是否对应已有实体。
    inputs:
    - objectType
    - name
    - properties
    - candidateRefs
    outputs:
    - identityResolution
    reads:
    - semantic_object
    writes: []
    deterministic: false
    side_effects: false
    version: 1.0.0
  DetectDuplicateObject:
    id: DetectDuplicateObject
    name: 重复对象检测
    description: 返回重复对象候选及相似度。
    inputs:
    - objectRefs
    outputs:
    - duplicateCandidates
    reads:
    - semantic_object
    writes: []
    deterministic: false
    side_effects: false
    version: 1.0.0
  ValidateRelationEndpoints:
    id: ValidateRelationEndpoints
    name: 关系端点校验
    description: 校验端点类型、方向和基数。
    inputs:
    - relationType
    - sourceRef
    - targetRef
    outputs:
    - validationResult
    reads:
    - semantic_object
    - semantic_relation
    writes: []
    deterministic: true
    side_effects: false
    version: 1.0.0
logic_flows:
  ConceptAdmissionLogic:
    id: ConceptAdmissionLogic
    name: 概念准入逻辑
    description: 从术语说明形成概念或边界问题。
    inputs:
    - term
    - scopeDescription
    steps:
    - id: normalize
      function_ref: NormalizeTerm
    - id: validate_definition
      rule_refs:
      - concept_definition_required
    - id: separate_concept_object
      rule_refs:
      - concept_object_separation
    outputs:
    - Concept
    - boundaryIssue
    fallback: 定义不足时不准入。
  ObjectIdentityResolutionLogic:
    id: ObjectIdentityResolutionLogic
    name: 对象身份解析逻辑
    description: 解析对象身份并处理重复候选。
    inputs:
    - objectCandidate
    steps:
    - id: resolve_identity
      function_ref: ResolveEntityIdentity
    - id: detect_duplicate
      function_ref: DetectDuplicateObject
    - id: validate_unique
      rule_refs:
      - unique_identity
    outputs:
    - newObjectCandidate
    - existingObjectRef
    - mergeCandidate
    fallback: 无法确定时保持候选。
  SemanticRelationAdmissionLogic:
    id: SemanticRelationAdmissionLogic
    name: 语义关系准入逻辑
    description: 校验关系端点、稳定性和对象化要求。
    inputs:
    - relationCandidate
    steps:
    - id: validate_endpoints
      function_ref: ValidateRelationEndpoints
      rule_refs:
      - relation_endpoint_compatibility
    - id: validate_stability
      rule_refs:
      - stable_semantics_only
    - id: check_reification
      rule_refs:
      - complex_relation_reification
    outputs:
    - admittedRelation
    - rejectionReason
    fallback: 动态关系转交推理域。
rules:
  concept_definition_required:
    id: concept_definition_required
    name: 概念定义完整性
    description: 概念定义和边界必须可理解。
    rule_type: validation
    applies_to:
    - Concept
    condition: definition 非空，且纳入或排除口径不存在自相矛盾。
    result: Concept 可进入准入判断。
    priority: 50
    failure_handling: reject_admission
  concept_object_separation:
    id: concept_object_separation
    name: 概念与对象分离
    description: 术语口径不得直接替代现实对象身份。
    rule_type: validation
    applies_to:
    - Concept
    - semantic_object
    condition: 只有需要独立引用和关系连接时才映射为对象。
    result: 保持 Concept 或形成对象候选。
    priority: 60
    failure_handling: keep_as_concept
  stable_semantics_only:
    id: stable_semantics_only
    name: 只保存稳定语义
    description: 语义域不得承载时点值、方向变化或判断。
    rule_type: blocking
    applies_to:
    - semantic_object
    - semantic_relation
    condition: 候选内容包含时点值、变化方向、事件或判断。
    result: 阻止写入语义域。
    priority: 100
    failure_handling: route_to_reasoning
  unique_identity:
    id: unique_identity
    name: 身份唯一性
    description: 同一类型和身份键不得产生重复正式对象。
    rule_type: validation
    applies_to:
    - semantic_object
    condition: 候选身份与现有对象不重复。
    result: 允许创建对象。
    priority: 80
    failure_handling: return_existing_or_merge_candidate
  organization_kind_required:
    id: organization_kind_required
    name: 非公司组织类型完整
    description: 直接以 Organization 建档的非公司主体必须声明组织类型；Company 由子类型身份表达，无需重复声明。
    rule_type: validation
    applies_to:
    - Organization
    condition: objectType 为 Company，或 organizationKind 使用允许枚举值。
    result: 允许组织主体进入身份解析。
    priority: 75
    failure_handling: return_missing_organization_kind
  relation_endpoint_compatibility:
    id: relation_endpoint_compatibility
    name: 关系端点兼容
    description: 起点、终点和基数必须符合关系定义。
    rule_type: validation
    applies_to:
    - semantic_relation
    condition: sourceType、targetType 和 cardinality 均合法。
    result: 允许创建或修订关系。
    priority: 90
    failure_handling: reject_relation_change
  complex_relation_reification:
    id: complex_relation_reification
    name: 复杂关系对象化
    description: 复杂关系应升级为具有独立身份的对象。
    rule_type: validation
    applies_to:
    - semantic_relation
    condition: 关系不需要独立身份、丰富属性、生命周期或被其他关系引用。
    result: 允许保持普通关系。
    priority: 70
    failure_handling: reify_as_object
