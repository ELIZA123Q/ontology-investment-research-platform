# 本文件由迁移工具生成；v2 启用后为对应域的机器权威。
schema_name: semiconductor_domain_evidence
schema_version: 1.0.0
status: active
depends_on:
- common.yaml
- semantic.yaml
- ../一级通用本体规范/evidence.yaml
description: 半导体领域证据质量维度、商业化阶段、最低覆盖规则和质量约束；证据画像与变量绑定实例见 business_instances.yaml。
evidence_quality_dimensions:
  source_authority:
    description: 来源主体是否有权掌握并披露该信息。
    levels:
    - primary
    - authoritative_secondary
    - informed_secondary
    - indirect
    - unknown
  traceability:
    description: 是否能定位到原始文档、表格、页码、记录或数据口径。
    levels:
    - fully_traceable
    - partially_traceable
    - untraceable
  independence:
    description: 多条证据是否真正来自独立信息源，而非相互转述。
    levels:
    - independent
    - partially_independent
    - same_origin
    - unknown
  time_relevance:
    description: 证据业务时间是否覆盖当前判断窗口。
    levels:
    - current
    - usable_with_lag
    - stale
    - unknown
  scope_match:
    description: 地域、产品、客户、工艺和统计口径是否与变量范围一致。
    levels:
    - matched
    - partially_matched
    - mismatched
    - unknown
  statement_nature:
    description: 明确区分事实、估算、预测、指引、观点和假设。
    levels:
    - reported_fact
    - data_point
    - estimate
    - forecast
    - guidance
    - judgment
    - assumption
    - unverified
source_type_guidance:
  official_primary:
    examples:
    - 监管和政策原文
    - 公司公告与财报
    - 标准原文
    - 官方统计
    - 法律文件
    preferred_for:
    - 政策适用范围
    - 已发生事件
    - 正式披露数据
    - 认证和法律状态
  operating_primary:
    examples:
    - 客户采购与认证记录
    - 供应商交付记录
    - 设备材料验收
    - 制造和质量记录
    preferred_for:
    - 订单交付
    - 认证
    - 良率
    - 质量
    - 产能和供应可得性
  industry_authoritative:
    examples:
    - 行业协会数据
    - 权威技术路线图
    - 标准组织资料
    - 海关与贸易数据
    preferred_for:
    - 行业规模
    - 设备材料分类
    - 技术路线
    - 贸易和区域供给
  company_communication:
    examples:
    - 管理层指引
    - 业绩说明会
    - 投资者交流
    - 产品和技术资料
    preferred_for:
    - 经营展望
    - 产品路线
    - 资本开支
    - 扩产和商业化计划
    caution: 指引和计划不是已经发生的事实。
  research_channel:
    examples:
    - 卖方研报
    - 产业调研
    - 专家访谈
    - 渠道数据
    preferred_for:
    - 估算
    - 竞争解释
    - 产业链交叉验证
    - 市场预期
    caution: 必须保留来源属性、业务时间和转述链。
  market_data:
    examples:
    - 价格与成交
    - 估值
    - 持仓
    - 一致预期
    - 资金流
    preferred_for:
    - 预期差
    - 定价反映程度
    - 拥挤度
    caution: 市场变化不自动证明基本面因果。
evidence_domain_mapping:
  description: 半导体 evidence_profiles 用于 03 生成通用证据域对象，不替代 EvidenceRequirement、EvidenceBasket、SourceProfile、AcquisitionChannel、ProxyIndicator
    或 EvidenceReadinessAssessment。
  profile_to_requirement:
    required_fields:
    - required_evidence_category
    - required_content_domains
    - minimum_quality_level
    - minimum_source_tier
    - required_counter_categories
  profile_to_basket:
    basket_sources:
    - supporting_evidence
    - counter_evidence
    - competing_explanations
    - scope_checks
  source_guidance_to_source_profile:
    source_type_guidance: SourceProfile
    access_and_traceability: AcquisitionChannel
  proxy_guidance:
    description: 直接数据不可得时，必须登记 ProxyIndicator，并在 EvidenceReadinessAssessment 中折扣置信度。
business_instance_graph_ref: business_instances.yaml
time_alignment_rules:
- 事实发生时间、文档发布时间和系统记录时间必须分开。
- 订单、库存、价格、产能和财务数据必须使用可比较的业务期间。
- 技术路线的实验、试产、认证和量产证据不得混为同一成熟阶段。
- 政策判断必须使用当时有效版本，并记录生效、过渡和失效时间。
- 市场预期截面必须早于被比较的新增事实，避免使用事后预期证明预期差。
- market_expectations 必须使用事件前截面和同对象、同口径、同时间尺度对齐；缺少事件前截面不得形成正式 expectation_gap 或 priced_in_degree 判断。
independence_rules:
- 多家媒体转述同一公告只算一个原始来源。
- 同一券商报告被不同平台转载不构成独立交叉验证。
- 公司披露与其客户或供应商披露可以形成交叉验证，但需检查关联性。
- 行业协会汇总数据与参与公司原始数据可能共享来源，应记录依赖关系。
- AI摘要、搜索摘要和无原文摘录只作为线索，不作为正式证据。
conflict_handling:
  preserve_all_claims: true
  never_overwrite_conflict: true
  required_actions:
  - 记录冲突对象、口径、业务时间和来源关系。
  - 区分数值冲突、范围冲突、时间冲突和解释冲突。
  - 优先核对原始来源，不以来源数量简单投票。
  - 冲突未解决时降低结论等级并保留竞争解释。
  - 后续证据替代旧证据时保留有效期和替代关系。
evidence_gap_behavior:
  missing_primary_source: 仅保留线索，不形成已确认事实。
  missing_business_time: 不得参与跨期比较或趋势判断。
  missing_scope_match: 标记范围不确定，不外推到全行业或公司。
  missing_counter_check: 不得形成高置信判断或资产影响。
  missing_market_expectation: 只输出基本面观察，不形成正式预期差或资产影响。
  unresolved_conflict: 判断保持 contested 或 observation，列出补证任务。
evidence_constraints:
- id: observation_requires_source_and_time
  statement: 具体读数必须进入 Observation，并具有来源、业务时间、口径和实际值或估算值标记。
- id: forecast_not_observation
  statement: 分析师预测、公司指引和目标价不得作为已发生 Observation。
- id: no_source_count_voting
  statement: 证据质量按权威性、独立性、时效和范围判断，不按来源数量投票。
- id: counter_check_required
  statement: 每次假设和传导评价都必须主动检查反证和竞争解释。
- id: evidence_cannot_skip_reasoning
  statement: 证据不得绕过状态变量、假设和判断直接生成资产影响。
- id: reasoning_owns_variable_profile_binding
  statement: 变量到证据画像的绑定写在 business_instances.yaml 的 StateVariable.evidence_profile_ref；evidence.yaml 不得反向列举状态变量。
commercialization_stages:
  concept:
    id: concept
    name: 概念
    description: 产品或技术处于概念验证和早期定义阶段。
    order: 1
  sample:
    id: sample
    name: 样品
    description: 已向客户或合作伙伴提供样品进行初步评估。
    order: 2
  certification:
    id: certification
    name: 认证
    description: 进入客户资格认证、测试和设计导入流程。
    order: 3
  design_win:
    id: design_win
    name: Design Win
    description: 获得客户设计导入、定点或Design Win确认。
    order: 4
  pilot_production:
    id: pilot_production
    name: 试产
    description: 进入小批量试产或工程验证量产。
    order: 5
  mass_production:
    id: mass_production
    name: 量产
    description: 达到规模量产并稳定交付。
    order: 6
  repurchase:
    id: repurchase
    name: 复购
    description: 客户重复采购，商业化可持续性得到验证。
    order: 7
  scale_adoption:
    id: scale_adoption
    name: 规模采用
    description: 跨客户扩散并进入主流采用。
    order: 8
minimum_evidence_coverage:
  order_visibility:
    evidence_profile_ref: demand_orders
    required_profile_elements:
    - 订单覆盖期或排产
    - 至少一条交付验证
    - 明确业务时间
    downgrade_if_missing:
    - 仅有管理层表态
    - 缺少交付验证
  capacity_tightness:
    evidence_profile_ref: capacity_supply
    required_profile_elements:
    - 有效产能或利用率
    - 交期或分配证据
    downgrade_if_missing:
    - 只有名义产能
    - 缺少交期验证
  yield_maturity:
    evidence_profile_ref: manufacturing_yield
    required_profile_elements:
    - 至少两个连续制造时点
    - 量产规模证据
    downgrade_if_missing:
    - 只有单点良率
    - 缺少量产规模
  technology_maturity:
    evidence_profile_ref: technology_route
    required_profile_elements:
    - 技术依据
    - 同口径比较
    - 制造或客户验证
    downgrade_if_missing:
    - 仅有概念发布
    - 无量产或客户验证
  customer_qualification_progress:
    evidence_profile_ref: qualification_commercialization
    required_profile_elements:
    - 至少一个客户验证节点
    - 认证阶段明确
    downgrade_if_missing:
    - 只有公司自述
    - 仍停留在样品阶段
  mass_production_readiness:
    evidence_profile_ref: qualification_commercialization
    required_profile_elements:
    - 量产准备证据
    - 产能或良率验证
    downgrade_if_missing:
    - 无客户或交付验证
    - 仍停留在样品阶段
  localization_substitution_progress:
    evidence_profile_ref: qualification_commercialization
    required_profile_elements:
    - 认证证据
    - 量产或复购证据
    downgrade_if_missing:
    - 只有送样
    - 仍依赖进口核心环节
  supply_chain_resilience:
    evidence_profile_ref: capacity_supply
    required_profile_elements:
    - 多供或替代检查
    - 恢复时间或库存覆盖
    downgrade_if_missing:
    - 表面多供
    - 无法确认替代认证
  export_control_intensity:
    evidence_profile_ref: policy_trade
    required_profile_elements:
    - 政策原文
    - 适用范围分析
    - 执行或企业影响证据
    downgrade_if_missing:
    - 只有媒体转述
    - 政策未生效
  regional_policy_exposure:
    evidence_profile_ref: policy_trade
    required_profile_elements:
    - 地域业务映射
    - 政策适用范围
    - 合规或交易影响
    downgrade_if_missing:
    - 无法确认地域暴露
    - 政策不适用
  earnings_elasticity:
    evidence_profile_ref: company_exposure_execution
    required_profile_elements:
    - 业务暴露证据
    - 财务或现金流验证
    downgrade_if_missing:
    - 只有公司标签
    - 只有订单无财务验证
  consensus_expectation_level:
    evidence_profile_ref: market_expectations
    required_profile_elements:
    - 明确预期基准
    - 事件前预期截面
    - 对象口径对齐
    downgrade_if_missing:
    - 缺少预期截面
    - 不可比口径
  expectation_gap:
    evidence_profile_ref: market_expectations
    required_profile_elements:
    - 事件前预期截面
    - 基本面比较
    - 对象口径对齐
    downgrade_if_missing:
    - 缺少事件前截面
    - 不可形成正式预期差
  priced_in_degree:
    evidence_profile_ref: market_expectations
    required_profile_elements:
    - 事件前预期截面
    - 价格或估值验证
    - 混杂事件检查
    downgrade_if_missing:
    - 缺少事件前截面
    - 宏观事件主导价格
