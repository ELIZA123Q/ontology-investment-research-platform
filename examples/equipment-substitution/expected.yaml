bundle_id: EXEC-USCTRL-CNSEMI-EQP-20260715-1
title: 美国管制与国产设备替代研究
overall_judgment_level: J2
publish_status: PUBLISHABLE
judgments:
- id: EXEC-USCTRL-CNSEMI-EQP-20260715-1:J-RUN-01
  judgment_level: J4
  statement: 设备层管制仍形成可执行约束；芯片层有条件许可不构成设备松绑，亦非全面禁运
- id: EXEC-USCTRL-CNSEMI-EQP-20260715-1:J-RUN-02
  judgment_level: J2
  statement: 政策窗口只有通过验证复购跨线复制和经营兑现才能转化为未来十二个月受益
- id: EXEC-USCTRL-CNSEMI-EQP-20260715-1:J-RUN-03
  judgment_level: J2
  statement: 刻蚀沉积热处理清洗CMP减薄先进封装强于量测检测离子注入涂胶显影而先进光刻近端兑现最弱
- id: EXEC-USCTRL-CNSEMI-EQP-20260715-1:J-RUN-04
  judgment_level: J2
  statement: 设备层管制不会整体推翻国产替代主逻辑，但兑现必须按类别分化；芯片层许可与整体国产化率均不得外推为同步受益。
