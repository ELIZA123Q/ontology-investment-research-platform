schema_name: investment_research_lens_profiles
schema_version: 5.0.0
status: active
authority: 01_semantic_knowledge/01_ontology
description: >-
  研究 Lens 是可组合的研究要求，不是另一套对象模型。每次研究由 runtime 建议，
  研究员确认后写入 ResearchMandate 并投影到 Problem Graph。
lens_profiles:
  fundamental: {label_zh: 基本面, task_motifs: [company_analysis, company_coverage, earnings_update], required_interfaces: [ResearchSubject, ObservableSubject], evidence_roles: [support, counter, boundary], default_horizon: '12个月', comparison_basis: historical_and_peer, required_outputs: [FinancialObservation, ResearchThesis], stop_conditions: [drivers_and_financial_bridge_resolved], allow_indeterminate: true}
  growth: {label_zh: 成长, task_motifs: [company_analysis, earnings_update, technology_route_analysis], required_interfaces: [ObservableSubject], evidence_roles: [support, counter], default_horizon: '12-36个月', comparison_basis: growth_duration_and_peer, required_outputs: [Forecast, ForecastAssumption], stop_conditions: [growth_driver_and_constraints_resolved], allow_indeterminate: true}
  quality: {label_zh: 质量, task_motifs: [company_analysis, company_coverage], required_interfaces: [ResearchSubject, ObservableSubject], evidence_roles: [support, counter, boundary], default_horizon: '12个月', comparison_basis: profitability_cashflow_governance, required_outputs: [FinancialObservation, ResearchThesis], stop_conditions: [quality_of_earnings_assessed], allow_indeterminate: true}
  value_valuation: {label_zh: 价值与估值, task_motifs: [company_analysis, earnings_update], required_interfaces: [InvestableAsset, ObservableSubject], evidence_roles: [support, counter, boundary], default_horizon: '12个月', comparison_basis: normalized_earnings_and_peer, required_outputs: [Forecast, ValuationAssessment], stop_conditions: [valuation_inputs_and_sensitivities_audited], allow_indeterminate: true}
  cycle: {label_zh: 周期, task_motifs: [cycle_judgment, value_chain_analysis], required_interfaces: [ResearchSubject, ObservableSubject], evidence_roles: [support, counter, boundary], default_horizon: '6-18个月', comparison_basis: historical_cycle, required_outputs: [StateVariable, ResearchThesis], stop_conditions: [cycle_state_and_turning_conditions_assessed], allow_indeterminate: true}
  event_driven: {label_zh: 事件驱动, task_motifs: [event_impact_analysis, earnings_update], required_interfaces: [ResearchSubject, TimeScoped], evidence_roles: [support, counter, boundary], default_horizon: '事件窗口', comparison_basis: pre_event_baseline, required_outputs: [Event, ResearchThesis], stop_conditions: [event_scope_and_transmission_assessed], allow_indeterminate: true}
  expectation_gap: {label_zh: 预期差, task_motifs: [earnings_update, thesis_review], required_interfaces: [InvestableAsset, TimeScoped], evidence_roles: [support, counter, boundary], default_horizon: '下一报告期', comparison_basis: consensus_and_pre_event_baseline, required_outputs: [ConsensusSnapshot, ExpectationGap], stop_conditions: [expectation_baseline_and_delta_verified], allow_indeterminate: true}
  risk_first: {label_zh: 风险优先, task_motifs: [thesis_review, event_impact_analysis], required_interfaces: [ResearchSubject, TimeScoped], evidence_roles: [counter, boundary], default_horizon: '12个月', comparison_basis: downside_and_stress, required_outputs: [BlockingFactor, ResearchThesis], stop_conditions: [downside_paths_and_invalidation_conditions_recorded], allow_indeterminate: true}
