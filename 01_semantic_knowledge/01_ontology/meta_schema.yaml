schema_name: investment_research_ontology_platform_meta_schema
schema_version: 1.0.0
platform_version: 4.0.0
status: active
authority: formal_ontology
description: >-
  Ontology 4.0 的统一机器元模型。models 保持纯语义，kinetics 定义受治理的
  Action、只读 Function、Policy 与 Trigger；TaskGraph 仍属于 Runtime 编排。

namespaces:
  core.semantic: ir.core.semantic
  core.state_event: ir.core.state_event
  core.evidence: ir.core.evidence
  core.judgment: ir.core.judgment
  core.operational: ir.core.operational
  core.kinetic: ir.core.kinetic
  core.audit: ir.core.audit
  semiconductor: ir.domain.semiconductor

common_metadata:
  required: [id, namespace, label_zh, label_en, aliases, definition, model, version, status, valid_from, valid_to, replaced_by, source, examples, counter_examples]
  status_values: [draft, active, deprecated]
  model_values: [semantic, state_event, evidence, judgment, operational]
  rules:
    - id 与 namespace 组合后必须全局唯一且版本内稳定。
    - deprecated 元素必须填写非空 replaced_by；active/draft 元素的 replaced_by 必须为空列表。
    - draft 表示已定义但未纳入当前 Runtime 实例图投影；active 才可写入 business_instance_graph。
    - valid_from 与 valid_to 使用 ISO 8601；valid_to 为空表示尚未失效。
    - examples 与 counter_examples 必须至少各有一项，用于约束概念边界。
    - 场景类型目录位于 02_scenario_task/02_scenarios/types.yaml，不再作为 formal model。
    - 领域正式扩展位于 domains/<domain>/ontology_extension.yaml；领域研究参数不得写入 models/。
  id_pattern: '^[A-Za-z][A-Za-z0-9_.-]*$'
  semver_pattern: '^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$'
  date_format: ISO-8601-date

object_type_contract:
  required: [metadata, primary_key, title_property, attributes, constraints]
  attribute_required: [type, required, cardinality, value_role, nullable_semantics, description]
  attribute_optional: [allowed_values, reference_target, unit, time_basis, default]
  scalar_types: [string, integer, number, boolean, date, datetime, uri]
  compound_types: [array, object, enum, object_ref]
  cardinalities: ['0..1', '1..1', '0..*', '1..*']
  value_roles: [identity, fact, state, calculated, judgment, metadata]
  constraints_required: [unique, mutually_exclusive, lifecycle]

relation_type_contract:
  required: [metadata, source_types, target_types, source_cardinality, target_cardinality, direction, inverse_of, symmetric, transitive, evidence_required, temporal, attributes, invalidation_policy]
  directions: [directed, undirected]
  invalidation_policies: [retain_history, invalidate_downstream, block_delete]

rule_contract:
  allowed_rule_classes: [semantic_constraint, evidence_constraint, state_consistency]
  required: [metadata, rule_class, applies_to, input_types, output_types, preconditions, condition, counter_conditions, failure_result, priority, test_case_role, test_cases]
  forbidden_method_ids_pattern: '^(?:A|kb0[234]:A)[0-9]{2}$'
  test_case_required: [id, input, expected]
  test_case_role_values: [design_intent, executable]
  positive_expected_values: [pass, allow, valid, success]
  negative_expected_values: [reject, fail, invalid, block, downgrade_or_reject]
  rules:
    - test_case_role=design_intent 表示用例是设计意图与边界说明，冻结门只做结构检查，不由 Runtime 执行。
    - test_case_role=executable 表示冻结门用 `rule_interpreter` 按 condition/counter_conditions 断言正反例；Runtime 对深公理亦用同一谓词语义判定。

scenario_contract:
  # 场景类型正文在 02_scenario_task/02_scenarios/types.yaml；语义类型清单在 research_requirement_profiles.yaml
  required: [id, label_zh, definition, scope_dimensions, semantic_requirements, judgment_requirements, entry_conditions, completion_conditions, invalidation_conditions, update_triggers]
  enforcement_values: [catalog_only]
  rules:
    - scenario_types.enforcement 必须为 catalog_only：场景类型是任务枚举/设计清单，不是 Runtime 可写对象或入口门禁。
    - 不得在 Scenario Type 内重定义 required_*_types；应引用 research_requirement_profiles 中的 profile。

action_type_contract:
  required: [version, label_zh, description, target_types, parameters, allowed_actors, reads, writes, preconditions, submission_policy, function_ref, ontology_edits, post_commit_effects, approval_policy, postconditions, idempotency, conflict_control, audit_fields, compensation, automation_allowed, handler]
  approval_modes: [never, always, conditional]
  actor_values: [researcher, agent, system, ontology_admin]
  effect_phases: [atomic, post_commit]
  rules:
    - Action 是正式语义状态的唯一写入口；Skill、Tool、Function 和 TaskNode 不得直接写正式对象或关系。
    - ontology_edits 必须原子提交；post_commit_effects 失败不得回滚已经提交的语义事务。
    - function_ref 表示 Action 提交前使用的主要计算/规范化 Function；不要求 Function 输入输出与 Action parameters 一一对应，也不表示 Runtime 自动 binding。
    - 评级、仓位、订单和交易动作不在平台允许边界内。

function_type_contract:
  required: [version, label_zh, description, inputs, outputs, reads, deterministic, side_effects, implementation]
  rules:
    - Function 只读本体并返回计算结果，side_effects 必须为 false。
    - 需要改变对象或关系时必须由 Action 提交 Function 结果。
    - Function 产出候选或提案；正式写入只经对应 Action。

policy_type_contract:
  required: [version, label_zh, description, applies_to, effect, failure_message]
  rules:
    - Policy 是跨 Action 的治理规则 Source of Truth。
    - Action.preconditions 与 approval_policy 是该 Policy 在具体 Action 上的可执行实现；两边不得冲突。

trigger_type_contract:
  required: [version, label_zh, description, observes, condition, action_ref, run_as, enabled_by_default]
  rules:
    - run_as 必须属于 action_type_contract.actor_values，且必须属于目标 Action 的 allowed_actors。

forbidden_top_level_sections: []
extension_contract:
  event_taxonomy_required: [extends_object, extends_attribute, allowed_extensions, event_type_taxonomy]
  independent_relation_rationale_field: subproperty_rationale
  rules:
    - 领域扩展不得重定义任何 core ID。
    - 每个领域对象必须通过无环的 extends 或 projects_to 传递指向核心对象。
    - 每个领域关系必须通过 subproperty_of 指向核心关系，或显式声明 null 并说明独立语义。
    - 领域事件分类必须明确扩展 Event.event_type，allowed_extensions 与分类字典键完全一致且不覆盖核心枚举。
