  regionHostsFacility: {subproperty_of: null, subproperty_rationale: facilityLocatedIn的领域逆关系。, metadata: {id: regionHostsFacility, namespace: semiconductor, label_zh: 地区承载设施, label_en: region hosts facility, aliases: [], definition: facilityLocatedIn 的逆关系。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [地区承载晶圆厂], counter_examples: [地区属于行业]}, source_types: [Region], target_types: [ManufacturingFacility], source_cardinality: '0..*', target_cardinality: '1..1', direction: directed, inverse_of: facilityLocatedIn, symmetric: false, transitive: false, evidence_required: true, temporal: true, attributes: {}, invalidation_policy: retain_history}
