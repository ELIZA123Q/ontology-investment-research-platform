  organizationOperatesFacility: {subproperty_of: null, subproperty_rationale: facilityOperatedBy的领域逆关系。, metadata: {id: organizationOperatesFacility, namespace: semiconductor, label_zh: 组织运营设施, label_en: organization operates facility, aliases: [], definition: facilityOperatedBy 的逆关系。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [公司运营晶圆厂], counter_examples: [公司拥有股票]}, source_types: [Organization], target_types: [ManufacturingFacility], source_cardinality: '0..*', target_cardinality: '1..1', direction: directed, inverse_of: facilityOperatedBy, symmetric: false, transitive: false, evidence_required: true, temporal: true, attributes: {}, invalidation_policy: invalidate_downstream}
