schema_name: semiconductor_ontology_extension
schema_version: 3.0.0
meta_schema_version: 1.0.0
status: active
namespace: semiconductor
model: domain_extension
description: 半导体领域的稳定对象、关系、事件枚举和证据约束；业务参数实例位于领域目录，研究方法位于 methods。

object_types:
  TechnologyRoute:
    projects_to: Technology
    metadata: {id: TechnologyRoute, namespace: semiconductor, label_zh: 技术路线, label_en: Technology Route, aliases: [工艺路线, 架构路线], definition: 可跨公司和产品复用、具有明确能力边界与依赖结构的半导体技术路线。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [Chiplet异构集成路线], counter_examples: [某公司本季度研发进展]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 技术路线规范名称。}
      route_category: {type: enum, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, allowed_values: [process_scaling, device_architecture, memory_architecture, packaging, interconnect, compound_semiconductor, photonics, test, system_integration, other], description: 技术路线类别。}
    constraints: {unique: [name], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  ManufacturingFacility:
    implements: [NamedEntity, ResearchSubject, Facility]
    projects_to: Asset
    metadata: {id: ManufacturingFacility, namespace: semiconductor, label_zh: 半导体制造设施, label_en: Semiconductor Manufacturing Facility, aliases: [制造基地], definition: 具有独立位置、运营主体、工艺能力和生命周期的半导体制造设施。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [十二英寸晶圆制造基地], counter_examples: [晶圆制造公司法人]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 设施规范名称。}
      facility_kind: {type: enum, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, allowed_values: [wafer_fab, packaging, testing, mask, material, equipment, integrated], description: 设施类型。}
      region_ref: {type: object_ref, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, reference_target: Region, description: 设施所在地区。}
      lifecycle_stage: {type: enum, required: true, cardinality: '1..1', value_role: state, nullable_semantics: forbidden, allowed_values: [planned, under_construction, pilot, operating, suspended, retired], description: 设施生命周期阶段。}
      capacity_scope_summary: {type: string, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示尚未冻结产能口径简述。, description: 用于研究的设施产能口径简述。}
    constraints: {unique: [name, region_ref], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  WaferFab:
    implements: [NamedEntity, ResearchSubject, Facility]
    extends: ManufacturingFacility
    metadata: {id: WaferFab, namespace: semiconductor, label_zh: 晶圆厂, label_en: Wafer Fab, aliases: [晶圆制造设施], definition: 承担晶圆制造并具有可识别晶圆尺寸、工艺能力和有效产能的制造设施。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [十二英寸逻辑晶圆厂], counter_examples: [无独立设施边界的晶圆制造公司]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 晶圆厂规范名称。}
      wafer_sizes: {type: array, required: true, cardinality: '1..*', value_role: fact, nullable_semantics: forbidden, unit: inch, description: 支持的晶圆尺寸。}
      process_node_refs: {type: array, required: false, cardinality: '0..*', value_role: fact, nullable_semantics: 空列表表示节点能力尚未冻结。, description: 可稳定支持的制程节点引用。}
    constraints: {unique: [], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  ProductionLine:
    projects_to: Asset
    metadata: {id: ProductionLine, namespace: semiconductor, label_zh: 半导体产线, label_en: Semiconductor Production Line, aliases: [生产线], definition: 在制造设施内具有独立工艺范围、产品边界和生命周期的生产单元；与制造设施是部分-整体关系，不是设施子类。, model: semantic, version: 3.1.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [十二英寸特色工艺产线], counter_examples: [月度产量读数]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 产线规范名称。}
      line_kind: {type: enum, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, allowed_values: [front_end, wafer_test, packaging, final_test, material, equipment], description: 产线类别。}
      process_scope: {type: array, required: true, cardinality: '1..*', value_role: fact, nullable_semantics: forbidden, description: 产线覆盖的工艺步骤或能力范围。}
    constraints: {unique: [], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  SemiconductorEquipment:
    extends: Product
    metadata: {id: SemiconductorEquipment, namespace: semiconductor, label_zh: 半导体设备, label_en: Semiconductor Equipment, aliases: [设备], definition: 用于晶圆制造、封装、测试或厂务环节的专用设备产品类别。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [刻蚀设备], counter_examples: [设备稼动率]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 设备名称。}
      equipment_category: {type: enum, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, allowed_values: [lithography, etch, deposition, implant, thermal, clean, cmp, metrology, inspection, packaging, test, automation, facility, subsystem, other], description: 设备类别。}
    constraints: {unique: [name], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  SemiconductorMaterial:
    extends: Material
    metadata: {id: SemiconductorMaterial, namespace: semiconductor, label_zh: 半导体材料, label_en: Semiconductor Material, aliases: [电子材料], definition: 进入半导体制造或封装工序且规格影响工艺结果的材料类别。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [光刻胶], counter_examples: [材料价格上涨]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 材料名称。}
      material_category: {type: enum, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, allowed_values: [wafer_substrate, photoresist, mask, gas, wet_chemical, precursor, target, cmp, packaging_substrate, bonding, encapsulation, thermal, consumable, other], description: 材料类别。}
      composition_axis: {type: string, required: false, cardinality: '0..1', value_role: fact, nullable_semantics: null 表示不适用或尚未冻结。, description: Si、SiC、GaN、InP等组成体系。}
    constraints: {unique: [name], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  Chip:
    extends: Product
    metadata: {id: Chip, namespace: semiconductor, label_zh: 芯片, label_en: Chip, aliases: [集成电路], definition: 完成计算、存储、模拟、功率、传感或控制功能的半导体产品。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [DRAM芯片], counter_examples: [晶圆产能]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 芯片名称。}
      chip_category: {type: enum, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, allowed_values: [logic, memory, analog, power, rf, optoelectronic, sensor, discrete, mixed_signal, other], description: 芯片功能类别。}
      process_node_ref: {type: object_ref, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示尚未绑定主要制程节点。, reference_target: ProcessNode, description: 主要制程节点引用（可选）。}
      primary_application_ref: {type: object_ref, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示尚未绑定主要应用锚点。, reference_target: Application, description: 主要应用锚点（可选）。}
    constraints: {unique: [name], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  ProcessNode:
    extends: Technology
    metadata: {id: ProcessNode, namespace: semiconductor, label_zh: 制程节点, label_en: Process Node, aliases: [工艺节点], definition: 在明确制造技术体系下可稳定识别的制程代际，不等同于单一线宽读数。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [28nm特色工艺节点], counter_examples: [良率达到90%]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 节点名称。}
      nominal_node_nm: {type: number, required: false, cardinality: '0..1', value_role: fact, nullable_semantics: null 表示节点不是以等效纳米数定义。, unit: nm, description: 名义或等效节点数。}
      process_family: {type: string, required: true, cardinality: '1..1', value_role: fact, nullable_semantics: forbidden, description: 逻辑、存储、功率、模拟等工艺族。}
    constraints: {unique: [name, process_family], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  CapacityMetric:
    extends: Metric
    metadata: {id: CapacityMetric, namespace: semiconductor, label_zh: 产能指标, label_en: Capacity Metric, aliases: [产能], definition: 同时冻结晶圆尺寸、制程或产品、时间和名义/有效口径的产能指标。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [十二英寸晶圆月有效产能], counter_examples: [宣布扩产但无产能口径]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 指标名称。}
      unit: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 标准产能单位。}
      time_basis: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 月、季度或年度口径。}
      wafer_size: {type: string, required: false, cardinality: '0..1', value_role: metadata, nullable_semantics: null 表示非晶圆口径。, description: 晶圆尺寸。}
      capacity_basis: {type: enum, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, allowed_values: [nameplate, effective, qualified, available], description: 名义、有效、已认证或可用产能。}
      process_or_product_scope: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 制程或产品范围。}
    constraints: {unique: [name, unit, time_basis, capacity_basis, process_or_product_scope], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}
  YieldMetric:
    extends: Metric
    metadata: {id: YieldMetric, namespace: semiconductor, label_zh: 良率指标, label_en: Yield Metric, aliases: [良率], definition: 明确产品、制程、批次层级、时间和合格标准的产出比例指标。, model: semantic, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [某制程季度量产良率], counter_examples: [工艺已经成熟]}
    primary_key: id
    title_property: name
    attributes:
      name: {type: string, required: true, cardinality: '1..1', value_role: identity, nullable_semantics: forbidden, description: 指标名称。}
      unit: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 百分比或比例。}
      time_basis: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 批次、月度或季度口径。}
      product_scope: {type: string, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, description: 产品与制程范围。}
      batch_scope: {type: enum, required: true, cardinality: '1..1', value_role: metadata, nullable_semantics: forbidden, allowed_values: [sample, pilot, mass_production, blended], description: 样品、试产、量产或混合批次。}
    constraints: {unique: [name, time_basis, product_scope, batch_scope], mutually_exclusive: [], lifecycle: valid_from_lte_valid_to}

