event_taxonomy:
  extends_object: Event
  extends_attribute: event_type
  allowed_extensions: [capacity_expansion, production_start, qualification_start, qualification_pass, qualification_fail, export_restriction, sanction, supply_disruption, price_regime_shift, inventory_cycle_turn, technology_node_transition, localization_share_shift, equipment_adoption_stage_change, material_shortage, policy_incentive, merger_acquisition, fab_utilization_shift, yield_excursion]
  event_type_taxonomy:
    capacity_expansion: 扩产
    production_start: 投产
    qualification_start: 启动认证
    qualification_pass: 通过认证
    qualification_fail: 认证失败
    export_restriction: 出口限制
    sanction: 制裁
    supply_disruption: 供应中断
    price_regime_shift: 价格机制切换
    inventory_cycle_turn: 库存周期转折
    technology_node_transition: 制程切换
    localization_share_shift: 国产化份额变化
    equipment_adoption_stage_change: 设备导入阶段变化
    material_shortage: 材料短缺
    policy_incentive: 政策激励
    merger_acquisition: 并购
    fab_utilization_shift: 稼动率变化
    yield_excursion: 良率异常

domain_guides:
  evidence_quality_dimensions:
    source_authority: {levels: [low, medium, high]}
    traceability: {levels: [low, medium, high]}
    independence: {levels: [low, medium, high]}
    time_relevance: {levels: [low, medium, high]}
    scope_match: {levels: [low, medium, high]}
    statement_nature: {levels: [factual, interpretive, forward_looking]}
  commercialization_stages:
    - {id: concept, name: 概念, order: 1}
    - {id: sample, name: 样品, order: 2}
    - {id: customer_evaluation, name: 客户评估, order: 3}
    - {id: qualification, name: 认证, order: 4}
    - {id: design_win, name: 定点, order: 5}
    - {id: pilot, name: 试产, order: 6}
    - {id: mass_production, name: 量产, order: 7}
    - {id: repeat_purchase, name: 复购, order: 8}
    - {id: scale_adoption, name: 规模采用, order: 9}

evidence_constraints:
  semiconductor_proxy_disclosure:
    metadata: {id: semiconductor_proxy_disclosure, namespace: semiconductor, label_zh: 半导体代理指标披露, label_en: Semiconductor proxy disclosure, aliases: [], definition: 订单、招标、价格、交期或贸易流等代理指标必须披露时间滞后、范围边界和不可替代的直接证据。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [订单领先收入两个季度并披露], counter_examples: [订单上升直接等于收入上升]}
    rule_class: evidence_constraint
    applies_to: [EvidenceAssessment]
    input_types: [EvidenceFact, EvidenceAssessment]
    output_types: [EvidenceAssessment]
    preconditions: [proxy_used]
    condition: proxy_lag_scope_and_non_substitution_disclosed
    counter_conditions: [proxy_treated_as_direct_evidence]
    failure_result: downgrade_or_reject
    priority: blocking
    test_case_role: executable
    test_cases:
      - {id: SEMI-PROXY-P, input: {proxy_lag_scope_and_non_substitution_disclosed: true, proxy_treated_as_direct_evidence: false}, expected: pass}
      - {id: SEMI-PROXY-N, input: {proxy_treated_as_direct_evidence: true, proxy_lag_scope_and_non_substitution_disclosed: false}, expected: reject}
  semiconductor_qualification_stage_alignment:
    metadata: {id: semiconductor_qualification_stage_alignment, namespace: semiconductor, label_zh: 认证商业化阶段对齐, label_en: Semiconductor qualification stage alignment, aliases: [], definition: 送样、评估、认证、定点、试产、量产和复购必须按同一对象与规格分层，低阶段证据不得支持高阶段判断。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [认证通过只支持qualification], counter_examples: [送样直接写成规模量产]}
    rule_class: evidence_constraint
    applies_to: [EvidenceAssessment, Judgment]
    input_types: [EvidenceFact, EvidenceAssessment]
    output_types: [EvidenceAssessment]
    preconditions: [commercialization_claim_present]
    condition: evidence_stage_gte_claimed_stage and product_spec_and_customer_scope_aligned
    counter_conditions: [intent_treated_as_order, sample_treated_as_mass_production, qualification_scope_mismatch]
    failure_result: downgrade_or_block
    priority: blocking
    test_case_role: executable
    test_cases:
      - {id: SEMI-STAGE-P, input: {evidence_stage_gte_claimed_stage: true, product_spec_and_customer_scope_aligned: true, intent_treated_as_order: false, sample_treated_as_mass_production: false, qualification_scope_mismatch: false}, expected: pass}
      - {id: SEMI-STAGE-N, input: {sample_treated_as_mass_production: true, evidence_stage_gte_claimed_stage: false, product_spec_and_customer_scope_aligned: false}, expected: reject}
  semiconductor_capacity_yield_scope_alignment:
    metadata: {id: semiconductor_capacity_yield_scope_alignment, namespace: semiconductor, label_zh: 产能良率口径对齐, label_en: Semiconductor capacity and yield scope alignment, aliases: [], definition: 产能和良率证据必须同时对齐设施、晶圆尺寸、制程或产品、批次阶段、单位和业务时间。, model: evidence, version: 3.0.0, status: active, valid_from: '2026-07-17', valid_to: null, replaced_by: [], source: semiconductor-domain-3.0, examples: [同产线同产品量产良率可比], counter_examples: [样品良率外推全厂有效产能]}
    rule_class: evidence_constraint
    applies_to: [EvidenceAssessment, Observation]
    input_types: [EvidenceFact, Observation, CapacityMetric, YieldMetric]
    output_types: [EvidenceAssessment]
    preconditions: [capacity_or_yield_claim_present]
    condition: facility_wafer_process_product_batch_unit_and_time_aligned
    counter_conditions: [nameplate_as_effective_capacity, sample_yield_as_mass_production_yield, scope_or_unit_mismatch]
    failure_result: downgrade_or_reject
    priority: blocking
    test_case_role: executable
    test_cases:
      - {id: SEMI-CAP-YIELD-P, input: {facility_wafer_process_product_batch_unit_and_time_aligned: true, nameplate_as_effective_capacity: false, sample_yield_as_mass_production_yield: false, scope_or_unit_mismatch: false}, expected: pass}
      - {id: SEMI-CAP-YIELD-N, input: {scope_or_unit_mismatch: true, facility_wafer_process_product_batch_unit_and_time_aligned: false}, expected: reject}
