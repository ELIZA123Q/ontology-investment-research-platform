schema_name: investment_research_interface_catalog
schema_version: 5.0.0
status: active
namespace: core.semantic
description: >-
  面向 runtime 查询、Action 能力和应用渲染的抽象对象形状。接口不能直接实例化，
  具体对象通过 implements 复用它们。
interface_types:
  NamedEntity:
    metadata: {id: NamedEntity, namespace: core.semantic, label_zh: 命名实体, label_en: Named Entity, aliases: [], definition: 具有稳定名称和别名的可识别对象形状。, model: semantic, version: 5.0.0, status: active, valid_from: '2026-08-11', valid_to: null, replaced_by: [], source: ontology-5.0-design, examples: [公司, 行业], counter_examples: [一次性研究任务]}
    properties: [name, aliases]
    action_capabilities: [read]
  ResearchSubject:
    metadata: {id: ResearchSubject, namespace: core.semantic, label_zh: 研究主体, label_en: Research Subject, aliases: [], definition: 可以被研究范围、事实、判断或预测直接指向的现实对象形状。, model: semantic, version: 5.0.0, status: active, valid_from: '2026-08-11', valid_to: null, replaced_by: [], source: ontology-5.0-design, examples: [公司, 行业, 金融工具], counter_examples: [判断本身]}
    properties: [id]
    action_capabilities: [read, evidence_subject]
  ObservableSubject:
    metadata: {id: ObservableSubject, namespace: core.semantic, label_zh: 可观测主体, label_en: Observable Subject, aliases: [], definition: 可以承载指标观测或状态变量的研究主体形状。, model: semantic, version: 5.0.0, status: active, valid_from: '2026-08-11', valid_to: null, replaced_by: [], source: ontology-5.0-design, examples: [公司, 产品], counter_examples: [来源文档]}
    properties: [id]
    action_capabilities: [read, observe]
  InvestableAsset:
    metadata: {id: InvestableAsset, namespace: core.semantic, label_zh: 可研究资产, label_en: Investable Asset, aliases: [], definition: 可被估值、预期差和市场影响研究引用的资产形状，不代表交易授权。, model: semantic, version: 5.0.0, status: active, valid_from: '2026-08-11', valid_to: null, replaced_by: [], source: ontology-5.0-design, examples: [上市股票, 债券], counter_examples: [持仓指令]}
    properties: [id, name]
    action_capabilities: [read, valuation_subject]
  TimeScoped:
    metadata: {id: TimeScoped, namespace: core.semantic, label_zh: 时间范围对象, label_en: Time Scoped, aliases: [], definition: 具有生效、观察或截止时间边界的对象形状。, model: semantic, version: 5.0.0, status: active, valid_from: '2026-08-11', valid_to: null, replaced_by: [], source: ontology-5.0-design, examples: [财务观测, 预测], counter_examples: [静态行业分类]}
    properties: [valid_from, valid_to, cutoff_at]
    action_capabilities: [read, as_of_filter]
  EvidenceBearing:
    metadata: {id: EvidenceBearing, namespace: core.semantic, label_zh: 证据承载对象, label_en: Evidence Bearing, aliases: [], definition: 必须可追溯到来源快照或受治理映射执行的对象形状。, model: semantic, version: 5.0.0, status: active, valid_from: '2026-08-11', valid_to: null, replaced_by: [], source: ontology-5.0-design, examples: [证据事实, 财务观测], counter_examples: [未验证聊天文本]}
    properties: [source_ref, cutoff_at]
    action_capabilities: [read, trace_provenance]
  DecisionArtifact:
    metadata: {id: DecisionArtifact, namespace: core.semantic, label_zh: 决策研究制品, label_en: Decision Artifact, aliases: [], definition: 由研究流程形成并带有条件、失效边界和审批轨迹的对象形状。, model: semantic, version: 5.0.0, status: active, valid_from: '2026-08-11', valid_to: null, replaced_by: [], source: ontology-5.0-design, examples: [研究判断, 估值评估], counter_examples: [原始来源文档]}
    properties: [cutoff_at, conditions, invalidation_conditions]
    action_capabilities: [read, approve, trace_provenance]
  Facility:
    metadata: {id: Facility, namespace: core.semantic, label_zh: 设施, label_en: Facility, aliases: [], definition: 可定位、可运营并可承载制造能力的实体设施形状。, model: semantic, version: 5.0.0, status: active, valid_from: '2026-08-11', valid_to: null, replaced_by: [], source: ontology-5.0-design, examples: [晶圆厂], counter_examples: [工艺步骤]}
    properties: [id, name]
    action_capabilities: [read]
