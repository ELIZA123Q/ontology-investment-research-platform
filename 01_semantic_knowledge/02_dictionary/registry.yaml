schema_name: semantic_dictionary_registry
schema_version: 2.1.0
status: active

authority:
  answers: 自然语言归一化（别名、口径、歧义、研究用语）；不是语义权威。
  role: lexical_normalization_authority
  write_entry: 01_semantic_knowledge/02_dictionary/
  read_primary: 01_semantic_knowledge/02_dictionary/
  semantic_authority: 01_semantic_knowledge/01_ontology/
  runtime_consumption: >
    Runtime 经 dictionary 得到 canonical_ref 后，必须以 ontology 为语义权威；
    不得默认把本目录当作知识正文权威全文注入。

source_of_truth_machine_enums: 01_semantic_knowledge/01_ontology/models
source_of_truth_normalization: 01_semantic_knowledge/02_dictionary
ontology_machine_entry: 01_semantic_knowledge/01_ontology/platform_registry.yaml

entries:
  - 01_semantic_knowledge/02_dictionary/01_core_terms.yaml
  - 01_semantic_knowledge/02_dictionary/02_aliases.yaml
  - 01_semantic_knowledge/02_dictionary/03_research_terms.yaml
  - 01_semantic_knowledge/02_dictionary/04_ambiguity_rules.yaml
  - 01_semantic_knowledge/02_dictionary/05_deprecated_terms.yaml
  - 01_semantic_knowledge/02_dictionary/domains/semiconductor.yaml
  - 01_semantic_knowledge/02_dictionary/domains/capital_market.yaml

notes:
  - Dictionary = lexical / normalization；Ontology = semantic authority。
  - aliases 只收无损同义词；近义/上下位进 research_terms 或 ambiguity_rules。
  - deprecated_terms 只收旧词→新词；路径与模型归属迁移见 governance migrations。
  - 禁止在本目录复制 ontology 的 relation/cardinality/constraint。
