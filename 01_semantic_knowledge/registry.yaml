schema_name: semantic_domain_registry
schema_version: 2.0.0
status: active

authority:
  answers: >
    Semantic 顶层入口为本文件；
    各子域权威入口由 subdomains 显式登记。
  write_entry: 01_semantic_knowledge/

subdomains:
  ontology:
    entry: 01_semantic_knowledge/01_ontology/platform_registry.yaml
    status: active

  dictionary:
    entry: 01_semantic_knowledge/02_dictionary/registry.yaml
    status: active

  knowledge_graph:
    entry: 01_semantic_knowledge/03_knowledge_graph/registry.yaml
    status: active

notes:
  - 本域只定义系统如何理解世界，不定义一次研究如何执行。
  - 正式对象、关系及证据/provenance 语义权威归 Ontology。
  - Dictionary 只负责自然语言到正式语义的归一化，不产生新的语义权威。
  - Knowledge Graph 只规定正式语义如何组织成图视图，不重新定义对象和关系。
  - 取证方法与来源策略归 03_agent_capability/02_skills/evidence_research/references/。
  - 不在本域写研究步骤、阶段门、运行状态或单次研究结论。
